TV<sub>HR</sub>D<sub>90%</sub> aimed at ≥84-86 Gy EQD2<sub>α/β = 10Gy</sub>, and constraints for the OARs were 80-90 Gy, 65-75 Gy and 70-75 Gy EQD2<sub>α/β = 3Gy</sub> for the bladder, rectum and sigmoid [Formula: see text] , respectively. Studies using IC/IS applicators were associated with a ∼4 Gy increase in CTV<sub>HR</sub>D<sub>90%</sub> compared to IC only, with no effect on OAR dose. T&R studies achieved improvements of 3.2 Gy and 2.8-3.4 Gy at typical planning aims in comparison with T&O applicators in target and OAR doses. In 100% (15/15) of patient groups treated with T&R + N both CTV<sub>HR</sub> and OAR objectives were met for the population average. For T&R, T&O, and T&O + N groups, this was the case in 89% (8/9), 43% (6/14), and 50% (4/8), respectively.\n\n**Conclusion:** Studies using interstitial needles with T&R applicators in MR-guided brachytherapy for cervical cancer seem to be associated with a favorable therapeutic target dose/OAR sparing ratio.", "abstract_zh": "**背景与目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** 在 Scopus、PubMed 和 Web of Science 数据库中进行了文献检索。其中包括同行评审的文章，描述了腔内 (IC) 串联和环形 (T&R) / 串联和卵形 (T&O) / 模具 (M) 施药器的计划限制并报告了高风险临床靶体积 (CTV<sub>HR</sub>) D<sub>90%</sub> 和 OAR [公式：参见文本]，可能辅以间质 (IS) 针 (+N)。为了确定与目标体积覆盖 (D<sub>90%</sub>) 和 OAR 保留（[公式：见文本]）相关的因素，进行了多变量元回归。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Applicator use, Image-guided adaptive brachytherapy, Locally advanced cervical cancer, Therapeutic dose window", "link": "https://pubmed.ncbi.nlm.nih.gov/41444098/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 24 Dec 2025"}, {"id": "41413743", "title_en": "Altered molecular signature of the intestinal microbiota in irritable bowel syndrome patients versus healthy controls: An updated systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hui Zheng", "abstract_en": "**Background And Aims:** Irritable bowel syndrome (IBS), a prevalent functional gastrointestinal disorder, poses significant challenges for both patients and medical practitioners. Recent investigations have indicated the gut microbiome as a potential therapeutic target for IBS. Nevertheless, the exact association between these microorganisms and IBS symptoms remains incompletely elucidated. This updated systematic analysis aims to assess the extant research correlating the gut microbial community with IBS.\n\n**Methods:** A systematic search was performed in major electronic databases including PubMed, EMBASE and Web of Science, spanning from their inception to December 2024. The objective was to identify case-control studies that examined and compared the composition of the fecal or colonic microbiota in individuals diagnosed with IBS against healthy controls.\n\n**Results:** Our systematic search included 44 articles, which collectively revealed that IBS patients exhibit lower intestinal microbiome diversity compared to healthy controls. Fecal microbiome analysis demonstrated an imbalance in the phyla Firmicutes and Bacteroidetes among IBS patients. Specifically, IBS with diarrhea (IBS-D) patients showed reduced levels of Butyricimonas and Proteobacteria, while IBS with constipation (IBS-C) patients exhibited decreased Firmicutes and Actinobacteria, along with increased Verrucomicrobiota and Proteobacteria. Additionally, disruptions in the gut microbiome were noted, particularly in the lysis compared the diagnostic performance and complication profiles of transperineal biopsy (TPBx) versus transrectal biopsy (TRBx) for prostate cancer, incorporating recent randomized and large observational studies.\n\n**Methods:** Following PRISMA 2020 guidelines, PubMed, Scopus, Embase, and Cochrane Library were searched till April 2025. Studies directly comparing TPBx and TRBx were included. Risk of bias was assessed using RoB 2.0 for randomized trials and the Newcastle - Ottawa Scale for observational studies. Pooled relative risks (RRs) with 95% confidence intervals (CIs) were calculated using random-effects models. Subgroup analyses and a GRADE assessment were performed to evaluate the certainty of evidence.\n\n**Results:** Twenty-nine studies (<i>n</i> = 90,621) were included. TPBx showed higher PCa detection (RR 1.08; 95% CI 1.01-1.15; <i>p</i> = 0.02) and csPCa detection (RR 1.14; 95% CI 1.05-1.24; <i>p</i> = 0.001), though the certainty of evidence was low to moderate. Heterogeneity was moderate to high. TPBx also showed lower infection-related complications and comparable overall events, though procedure-related pain was slightly higher.\n\n**Conclusion:** TPBx offers improved diagnostic yield and lower infection risk compared with TRBx, with comparable safety. However, given the moderate heterogeneity and limited high-quality RCTs, further confirmatory trials are necessary.\n\n**Protocol Registration:** https://www.crd.york.ac.uk/PROSPERO identifier is CRD420251035763.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we milarly, no differences were found in bleeding (OR 1.14, 95% CI, 0.66-1.95), urinary retention (OR 1.01, 95% CI, 0.50-2.04), total infections (OR 1.02, 95% CI, 0.77-1.35), or severe infections (OR 2.17, 95% CI, 0.97-4.88). Mild pain was more frequent in the TP group (OR 1.56, 95% CI, 1.20-2.03), while moderate to severe pain did not differ significantly (OR 0.65, 95% CI, 0.39-1.07). Transperineal and transrectal MRI-fusion-guided biopsy approaches demonstrated equivalent diagnostic accuracy and safety profiles. While the transperineal route was associated with slightly greater mild discomfort, cancer detection and complication rates were comparable. The selection of approach should be guided by principles of antimicrobial stewardship, patient preference, and institutional expertise.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Diagnosis, Prostate cancer, Randomized trial, Transperineal Biopsy, Transperineal prostate biopsy", "link": "https://pubmed.ncbi.nlm.nih.gov/41385931/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 12 Dec 2025"}, {"id": "41372917", "title_en": "The impact of primary tumor location of colorectal cancer on the survival outcome of patients with brain metastasis: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Abhishek Kumar", "abstract_en": "**Objectives:** Several prior studies have shown that in metastasized colorectal cancer, the primary cancer's location influences patients' survival rates, with left-sided colorectal cancer being associated with longer survival than right-sided colorectal cancer. This study aimed to explore the influence of the primary location of colorectal cancer on survival following brain metastasis.\n\n**Methods:** To address this clinical question, we conducted a systematic review and meta-analysis. We included studies focused on patients diagnosed with brain metastasis from colorectal cancer. These studies reported survival outcomes based on different primary tumor sites (right versus left and colon versus rectum). The primary outcome was to aggregate the hazard ratio (HR) of left-sided colorectal cancer when metastasized to the brain compared with right-sided colorectal cancer. The secondary outcome was to aggregate the HR of rectal cancer when it metastasized to the brain compared with colon cancer.\n\n**Results:** Ten studies with a total of 1792 patients were included in the meta-analysis, and combined HR was calculated. Left-sided colon cancer showed higher overall survival compared with right-sided colon cancer when metastasized to the brain (HR: 0.71, 95% CI: 0.54-0.94, I<sup>2</sup> = 0%). Rectal cancer did not show a statistically significant difference in overall survival compared with colon cancer (HR: 0.75, 95% CI: 0.40-1.41, I<sup>2</sup> = 81%).\n\n**Conclusions:** Concordant with lung and liver metastases, the primary location of colorectal cancer influenced overall survival when metastasized to the brain. Left-sided colon cancer demonstrated higher overall survival than right-sided colon cancer.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all  SCP/SHP. The proportion metanalysis of four included studies reported a subjective POP recurrence rate of 7% (95% CI 1-13%; I<sup>2</sup> test 82.9%, p < 0.001). The proportion metanalysis of five included studies for objective POP recurrence was 5% (95% CI 1-9%; I<sup>2</sup> test 56.9%, p = 0.041). No serious adverse events were reported.\n\n**Conclusions:** VRP combined with SCP/SHP has been shown to be safe and effective for women with multicompartment POP, providing optimal anatomical and functional outcomes. Larger, long-term, prospective-controlled studies are needed to confirm these results.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal incontinence, Obstructed defecation syndrome, Pelvic organ prolapse, Rectal prolapse, Sacrocolpopexy, Sacrohysteropexy, Ventral rectopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/41359190/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 08 Dec 2025"}, {"id": "41316735", "title_en": "Colorectal polyp distribution in relation to age: meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Frank Frizelle", "abstract_en": "**Background:** An increase in early-onset colorectal cancer has been observed globally, despite a decline in colorectal cancer incidence rates in many Western countries. Screening strategies for younger individuals are particularly challenging, as there are limited data on polyps in young individuals to guide clinicians. This study aimed to systematically review the current evidence surrounding polyp distribution in different age groups.\n\n**Methods:** A literature search was performed in PubMed, Scopus, MEDLINE, Embase (OVID), Web of Science, and Cochrane Review databases using the keywords 'age' and 'polyp', and Medical Subject Heading terms 'age of onset', 'age factors', 'age distribution', and 'age groups', with no restrictions on publication year. Articles published in English that described the distribution of polyps (adenomatous, advanced adenomatous polyps, and sessile serrated lesions) or individuals with polyps according to different age groups were considered for inclusion. Younger patients were defined as those aged < 50 years. The outcomes of interest were the number of patients with polyps in the left and/or right colon, or the number of polyps per side of the colorectum in different age groups.\n\n**Results:** From 12 470 articles, 24 met the eligibility criteria for the systematic review, and 12 were suitable for meta-analysis. Among younger people, 46.5% had right-sided and 75.9% had left-sided polyps. In comparison, 70.8% of the older group had right-sided and 61.9% had left-sided polyps. Meta-analyses of studies showed a greater proportion of younger people than older people with at least one left-sided polyp (mean difference 0.06, 95% confidence interval (c.i.) 0.03 to 0.09; P < 0.001). There was also a greater proportion of left-sided polyps in younger people (odds ratio 0.77, 95% c.i. 0.59 to 1.01; P < 0.001).\n\n**Conclusion:** Patients aged < 50 years have a greater tendency towards having polyps in the left colon, compared with people ≥ 50 years of age, similar to the distribution of early-onset colorectal cancer. This has implications for the methodology of screening and investigation of symptoms in those aged < 50 years.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 使用关键词“年龄”和“息肉”以及医学主题词“发病年龄”、“年龄因素”、“年龄分布”和“年龄组”在 PubMed、Scopus、MEDLINE、Embase (OVID)、Web of Science 和 Cochrane Review 数据库中进行文献检索，对发表年份没有限制。以英文发表的描述息肉（腺瘤性、晚期腺瘤性息肉和无蒂锯齿状病变）分布或根据不同年龄组患有息肉的个体的文章被考虑纳入。年轻患者被定义为年龄< 50 岁的患者。感兴趣的结果是左和/或右结肠息肉患者的数量，或不同年龄组每侧结肠直肠息肉的数量。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adenoma, colon, rectum, sessile serrated lesions", "link": "https://pubmed.ncbi.nlm.nih.gov/41316735/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sat, 29 Nov 2025"}, {"id": "41290553", "title_en": "Preemptive Versus Postoperative Analgesia in Colorectal Surgery: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Muhammed Elhadi", "abstract_en": "**Background:** Preemptive and preventative methods have been suggested to decrease pain by blocking nociceptive inputs to tissues. Preemptive analgesia has the potential to enhance postoperative recovery in patients undergoing colorectal surgery. This study aimed to evaluate the efficacy and safety of preemptive versus postoperative analgesia in this population.\n\n**Methods:** We systematically searched PubMed, Scopus, Web of Science, and the Cochrane Library from inception to December 2024, and updated the search in May 2025, to identify randomized controlled trials (RCTs) comparing preemptive analgesia with postoperative analgesia in adult patients undergoing colorectal surgery. The primary outcomes were opioid consumption within 24 h, visual analog scale (VAS) pain score at rest at 24 and 48 h postoperatively. Secondary outcomes included adverse events, length of hospital stay, surgery duration (minutes), and postoperative nausea and vomiting (PONV). The Cochrane Risk of Bias 2.0 tool was used to assess risk of bias, and the strength of evidence was graded using the GRADE approach.\n\n**Results:** We identified a total of 2739 records. Seven studies involving 625 patients (312 preemptive and 313 postoperative) met the inclusion criteria. Preemptive analgesia decreased VAS scores at 24 h compared to postoperative analgesia (MD -0.45, 95% CI: -0.89 to -0.01, p = 0.04). However, significant heterogeneity was observed among included studies. Additionally, there was no difference between the two groups regarding VAS at 48 h (MD -0.17, 95% CI -0.43 to 0.09, p = 0.21) and opioid consumption at 24 h (MD -21.17, 95% CI 48.18-5.85, p = 0.12).\n\n**Conclusion:** The findings indicate that preemptive analgesia did not decrease opioid consumption at 24 h; however, it decreased VAS score at 24 h without any difference in VAS at 48 h, length of hospital stay, incidence of PONV, or other adverse events when compared to postoperative analgesia alone in colorectal surgery.\n\n**Trial Registration:** The study is registered in PROSPERO under the registration number CRD420250636020.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Se  months after radiation therapy) to the bowel/bladder compared to no HBO₂ or placebo/sham; complete outcomes data must have corresponded to the tools used to measure change in LRTI symptoms. Medline was searched through May 4, 2023, Embase through May 29, 2023, and Google Scholar through May 5, 2023. The Cochrane risk-of-bias tool and GRADE approach were used with a certainty of outcomes assessment.\n\n**Results:** Three RCTs were included with 273 subjects. Two double-blinded studies evaluated rectal symptoms; one open study evaluated cystitis. One study had a low risk of bias; two had some concerns. All had moderate certainty of outcomes. There is moderate certainty with a weak recommendation for using HBO₂ for rectal complications or cystitis, which (in context of GRADE terminology) means the decision to treat depends on a case-by-case basis.\n\n**Discussion:** The highly heterogeneous design of the trials made meta-analysis impossible, but moderate certainty of the beneficial effect of HBO₂ on LRTI to the rectum and bladder was confirmed. With the weak recommendation, a discussion should take place between the patient and their physician as to whether or not the patient is likely to benefit from HBO₂.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "LRTI, cancer, chronic wounds, comparative studies, cystitis, hyperbaric oxygen therapy, proctitis", "link": "https://pubmed.ncbi.nlm.nih.gov/41223393/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 12 Nov 2025"}, {"id": "41126092", "title_en": "Radiotherapy as a potential risk factor for delayed anastomotic leakage after rectal surgery: a meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ming-Yin Shen", "abstract_en": "BACKGROUND: Radiotherapy is a well-recognized risk factor of acute leakage after colorectal surgery. However, its relationship with delayed leakage remains unclear. The aim of this systemic review and meta-analysis was to determine its association with delayed anastomotic leakage (DAL) after rectal surgery. METHODS: A comprehensive literature search was conducted across seven international databases (PubMed, Embase, Cochrane CENTRAL, ClinicalKeys, EBSCOhost-CINAHL, Web of Science, and Google Scholar), five Chinese/Taiwanese databases, the ProQuest Dissertations, and three Grey literature databases. All studies that reported DAL where radiotherapy and nonradiotherapy study groups were included. The random-effect model was used to combine data. Data were presented as odds-ratios (ORs) with 95% confidence intervals (CI). The main outcome measured was DAL. RESULTS: Six comparative series involving a total of 4991 patients were analyzed. DAL was identified in 323 cases, occurring between 22 and 2059 days post-operation. The results revealed a statistically significant increase in the risk of DAL following radiotherapy (OR = 5.208; 95% CI = 3.241-8.371; p < 0.001). Heterogeneity was observed across the included studies (Cochran Q = 12.769 (p=0.026), I2=60.844%, Tau2 = 0.188, predictive interval (PI) = 5.208, 95% PI = 1.313-20.665). CONCLUSIONS: Radiotherapy is a potential risk factor for DAL after anterior resection and low anterior resection.", "abstract_zh": "背景：放射治疗是结直肠手术后急性漏出的一个公认的危险因素。然而，其与延迟泄漏的关系仍不清楚。本系统评价和荟萃分析的目的是确定其与直肠手术后延迟性吻合口漏 (DAL) 的关联。方法：对七个国际数据库（PubMed、Embase、Cochrane CENTRAL、ClinicalKeys、EBSCOhost-CINAHL、Web of Science 和 Google Scholar）、五个中国/台湾数据库、ProQuest Dissertations 和三个 Gray 文献数据库进行了全面的文献检索。所有报告 DAL 的研究都包括放射治疗和非放射治疗研究组。使用随机效应模型来组合数据。数据以优势比 (OR) 的形式呈现，置信区间 (CI) 为 95%。测量的主要结果是 DAL。结果：分析了 6 个比较系列，共涉及 4991 名患者。在 323 例病例中发现了 DAL，发生在术后 22 至 2059 天之间。结果显示，放疗后 DAL 风险显着增加（OR = 5.208；95% CI = 3.241-8.371；p < 0.001）。在纳入的研究中观察到异质性（Cochran Q = 12.769 (p=0.026)、I2=60.844%、Tau2 = 0.188、预测区间 (PI) = 5.208、95% PI = 1.313-20.665）。结论：放疗是前路切除和低位前路切除术后发生 DAL 的潜在危险因素。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anterior resection, Delayed leakage, Low anterior resection, Radiotherapy", "link": "https://pubmed.ncbi.nlm.nih.gov/41126092/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 22 Oct 2025"}, {"id": "41075390", "title_en": "Quality of Life and Functional Outcomes After Watch-and-Wait for Locally Advanced Rectal Cancer: A Meta-analysis", "title_zh": "局部晚期直肠癌观察等待后的生活质量和功能结果：荟萃分析", "authors": "Jonathan S Abelson", "abstract_en": "**Introduction:** Watch-and-wait (W&W), which involves total neoadjuvant therapy followed by close observation, has emerged as an alternative to total mesorectal excision for patients with locally advanced rectal cancer who achieve a clinical or near-complete response. This approach aims to preserve bowel function and avoid the morbidity associated with radical surgery.\n\n**Methods:** This systematic review and meta-analysis followed Preferred Reporting Items for Systematic Reviews and Meta-Analyses and Cochrane guidelines. Eligible studies included randomized trials and observational studies of patients with locally advanced rectal cancer treated with total neoadjuvant therapy, followed by either W&W or total mesorectal excision. The primary outcome was quality of life (QoL), assessed using validated instruments (European Organization for Research and Treatment of Cancer Quality of Life Questionnaire-C30, Quality of Life Questionnaire-CR29, Fecal Incontinence Quality of Life). Secondary outcomes included bowel function among patients without an ostomy, using validated measures such as Cleveland Clinic Florida Fecal Incontinence Scores, Vaizey, Memorial Sloan Kettering Cancer Center, and low anterior resection syndrome scores. A comprehensive search of PubMed, EMBASE, Medline, and Web of Science (Sept 2023-May 2025) was performed without language or date restrictions. Abstract/full-text screening, data extraction, and risk of bias assessments were conducted independently by two reviewers. Meta-analyses used inverse-variance weighting under a random-effects model. Data unsuitable for meta-analysis were synthesized narratively.\n\n**Results:** Of 617 screened studies, 28 were reviewed in full and 9 met inclusion criteria (total 923 patients). Meta-analysis of five studies (n = 601) with no statistically significant difference in overall QoL between groups (pooled mean difference = 0.10, 95% confidence interval: -0.19 to 0.39, P = 0.49). However, pooled analysis of fecal incontinence scores from four studies (n = 384) showed a significant advantage for W&W (pooled mean difference = -1.10, 95% confidence interval: -1.50 to -0.73, P < 0.001). Qualitative synthesis of low anterior resections syndrome scores outcomes favored W&W.\n\n**Conclusions:** W&W, offers a functional advantage without compromising QoL. The decision to pursue W&W should be individualized, considering both the potential functional benefits and the oncological risks.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.Ther ) and cosmetic results (Manchester Scar Scale), were prospectively collected and analyzed. Additionally, a systematic review and meta-analysis were performed following PRISMA guidelines, pooling data from nine studies comprising 420 patients.\n\n**Results:** The mean operative time was 70.0 ± 30.3 min, significantly shorter than the pooled estimate from the meta-analysis (166.44 min; 95% CI 137.74-195.14, p < 0.001). No intraoperative complications or conversions were recorded. The mean hospital stay was 5.23 ± 2.69 days, consistent with prior reports. Enterocolitis occurred in 16.1% of cases, comparable to the pooled estimate (12%; 95% CI 7-21%). Among patients aged ≥ 4 years (n = 64), 84% achieved good to excellent bowel function scores. The mean Manchester Scar Score was 5.73 ± 1.38.\n\n**Conclusion:** SILEP is a safe, effective, and cosmetically superior approach for HSCR, with favorable perioperative outcomes and functional results. Our findings, supported by meta-analysis data, reinforce the feasibility of SILEP as a viable alternative for HSCR management.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Patients and methods：** 我们的机构进行了一项前瞻性研究，涉及 93 名诊断为 HSCR 的儿童患者，这些患者在 2020 年至 2021 年间接受了 SILEP。前瞻性收集和分析了人口统计数据、围手术期详细信息和术后结果，包括肠功能评分 (Rintala) 和美容结果（曼彻斯特疤痕量表）。此外，还按照 PRISMA 指南进行了系统回顾和荟萃分析，汇集了涉及 420 名患者的 9 项研究的数据。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Bowel function, Hirschsprung’s disease, Laparoscopic, Meta-analysis, Single-incision, Soave procedure", "link": "https://pubmed.ncbi.nlm.nih.gov/41023221/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 29 Sep 2025"}, {"id": "40972340", "title_en": "Postoperative physiotherapy in enhanced recovery pathways: A general surgery evidence update, dominated by colorectal studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Thomas W Wainwright", "abstract_en": "**Introduction:** Physiotherapy is a pivotal component of enhanced recovery protocols, particularly in initiating early mobilisation and supporting the return to functional independence. Despite this, there is a lack of guidance on optimal post-mobilisation physiotherapy strategies. This systematic review aims to synthesise and critically appraise the most recent evidence on postoperative physiotherapy interventions within enhanced recovery pathways for general surgical patients. This review seeks to advance scientific understanding and provide guidance for the optimisation of physiotherapy practice within enhanced recovery pathways.\n\n**Materials And Methods:** A systematic review of the literature between 2000 and 2024 was conducted to identify studies of physiotherapy interventions in general surgical populations following an enhanced recovery protocol.\n\n**Results:** Ten studies met the inclusion criteria. Six studies were conducted in colorectal patients, one study (plus a secondary analysis) was conducted in radical cystectomy patients, one in head and neck patients undergoing oncologic resection, and one included a mixed patient sample (colon, rectum, stomach, pancreas and liver surgery). Interventions involving early physiotherapy were found to benefit postoperative walking distance, achievement of activities of daily living and length of stay in hospital. There was mixed evidence for influence on readiness for discharge, quality of recovery measures and health-related quality of life. No consistent effects were observed for inpatient satisfaction or functional outcome.\n\n**Conclusion:** This review supports the feasibility and potential benefits of a structured physiotherapy interventions within enhanced recovery protocols. These results highlight the potential for structured mobilisation interventions to enhance recovery, particularly when supported by education and technology-based strategies.", "abstract_zh": "**介绍：** 物理治疗是加速康复方案的关键组成部分，特别是在启动早期活动和支持恢复功能独立方面。尽管如此，仍缺乏最佳动员后物理治疗策略的指导。本系统综述旨在综合并严格评估普通外科患者加速康复途径术后物理治疗干预的最新证据。本综述旨在增进科学理解，并为加速康复途径中物理治疗实践的优化提供指导。\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Enhanced recovery after surgery (ERAS), Mobilisation, Physiotherapy, Recovery, Rehabilitation, Surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40972340/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 19 Sep 2025"}, {"id": "40968352", "title_en": "Stroke risk in cancer survivors: A meta-analysis and meta regression", "title_zh": "癌症幸存者的中风风险：荟萃分析和荟萃回归", "authors": "Rommel Mario Rodríguez Burbano", "abstract_en": "**Introduction:** It is suggested that survivors of different types of cancer may have an increased risk of stroke. Our study aims to evaluate cancer patients and non-cancer controls by analyzing stroke events in each group. Previous studies concluded that certain types of cancer increased stroke risk, however, their results had significant heterogeneity and statistical concerns.\n\n**Methods:** Medline, Embase, and Cochrane databases were systematically searched until February 18th, 2024, assessing stroke in cancer survivor patients compared to the global population. Data were examined using the Mantel-Haenszel method and 95% CIs. Heterogeneity was assessed using I² statistics. Rstudio software, version 4.2.3., was used for statistical analysis.\n\n**Results:** A total of 18 studies were included, and stroke was reported in both cancer and non-cancer groups. Breast cancer (HR 1.09; 95% CI 1.02-1.17; p = 0.01; I²= 0%), Central Nervous System cancers (HR 2.47; 95% CI 1.01-6.01; p = 0.047; I²= 78%), cervical cancers (HR 1.58; 95% CI 1.19-2.09; p = 0.001; I²= 0%), head and neck cancers (HR 1.4439; 95% CI 1.3095-1.5922; p < 0.001; I²=31.5%), lung cancers (HR 1.60; 95% CI 1.40-1.83; p < 0.001; I²=67%), multiple myeloma (HR 1.58; 95% CI 1.32-1.89; p < 0.001; I²= 49%), nasopharyngeal cancers (HR 1.9178; 95% CI 1.3358-2.7533; p < 0.001; I²=89.7%), oesophageal cancers (HR 1.33; 95% CI 1.07-1.65; p = 0.009; I²= 0%), ovarian cancers (HR 1.33; 95% CI 1.07-1.65; p = 0.01; I²= 38%), pancreatic cancers (HR 2,70; 95% CI 2.34-3.11; p < 0.001; I²= 0%) and rectum cancers (HR 1.29; 95% CI 1.01-1.63; p = 0.04; I²= 0%) showed statistically significant differences between groups in favor of non-cancer controls.\n\n**Conclusions:** In this meta-analysis, the stroke risk was increased in all cancers that reached statistical significance. Furthermore, our study brings relevant data to the body of literature concerning this long-term clinical uncertainty.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Cancer survivors, Meta-Analysis, Stroke risk", "link": "https://pubmed.ncbi.nlm.nih.gov/40968352/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 19 Sep 2025"}, {"id": "40956186", "title_en": "Clinicopathological characteristics and biomarker alterations in early-onset vs. late-onset colorectal cancer: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Lie Yang", "abstract_en": "**Background:** The clinicopathological and molecular characteristics of early-onset colorectal cancer (EOCRC) are unclear. In this study, we compared the clinicopathological features, biomarkers, and prognoses between EOCRC and late-onset colorectal cancer (LOCRC).\n\n**Methods:** A search was conducted on PubMed, Web of Science, Embase, and Cochrane Library from inception to May 2024. The key outcomes were clinicopathological features, prevalence of molecular biomarker alterations, and 5-year overall survival (OS), with pooled odds ratios (ORs) and hazard ratios (HRs), along with their corresponding 95% confidence intervals (CIs), calculated for each outcome.\n\n**Results:** Forty studies were included in the final analysis. EOCRC exhibited distal colon and rectum localization (OR: 0.59; 95% CI: 0.55-0.62; P < 0.001), was poorly differentiated (OR: 0.56; 95% CI: 0.52-0.60; P = 0.01), tended to be more mucinous or signet-ring cell carcinoma (OR: 0.56; 95% CI: 0.52-0.60; P < 0.001), and was associated with advanced stages (OR: 1.49; 95% CI: 1.30-1.71; P < 0.001), lymph node metastasis (LNM) (OR: 0.56; 95% CI: 0.53-0.60; P < 0.001), and distant metastasis (OR: 1.29; 95% CI: 1.04-1.60; P = 0.02). EOCRC exhibited higher TP53 mutation rates (OR: 1.33; 95% CI: 1.13-1.58; P < 0.001), MSI-H status (OR: 1.45; 95% CI: 1.10-1.92; P = 0.01), but lower PIK3CA mutation rates (OR: 0.93; 95% CI: 0.88-0.99; P = 0.03). EOCRC and LOCRC had similar 5-year OS rates (HR: 1.01; 95% CI: 0.79-1.30; P = 0.92). Although no significant difference was observed in the APC, BRAF, KRAS, NRAS, SM4D4, and MMR, subgroup analyses revealed that BRAF ( P = 0.01), KRAS mutations ( P < 0.001), and DNA hypermethylation ( P = 0.01) were less prevalent among westerners.\n\n**Conclusion:** EOCRC often presents with more aggressive and metastatic features due to its frequent diagnosis at advanced stages. TP53 mutations and the MSI-H status are prevalent in EOCRC. EOCRC's prognosis is often comparable to LOCRC. Radical and tailored treatment strategies should be developed to improve the survival outcomes in advanced and metastatic EOCRC.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 从开始到 2024 年 5 月，我们在 PubMed、Web of Science、Embase 和 Cochrane 图书馆上进行了检索。主要结果是临床病理学特征、分子生物标志物改变的发生率和 5 年总生存率 (OS)，以及针对每个结果计算的汇总比值比 (OR) 和风险比 (HR) 及其相应的 95% 置信区间 (CI)。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "clinicopathological features, colorectal cancer, early-onset, molecular biomarker, survival", "link": "https://pubmed.ncbi.nlm.nih.gov/40956186/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Tue, 16 Sep 2025"}, {"id": "40944330", "title_en": "Efficacy and safety of methylene blue for postoperative pain of haemorrhoids: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Li Xu", "abstract_en": "**Objectives:** Pain is a common complication after haemorrhoid surgery. In addition to anaesthetic methods, surgical techniques and postoperative interventions, surgeons also use intraoperative adjuncts to alleviate postoperative pain. This study aims to evaluate the effectiveness and safety of methylene blue in reducing postoperative pain in haemorrhoid patients.\n\n**Methods:** A search was conducted in PubMed, Embase, Cochrane Library and Web of Science for randomized controlled trials (RCTs) up until 9 December 2024, involving methylene blue use for pain relief after haemorrhoid surgery. Two reviewers independently assessed the study eligibility, extracted data and evaluated the risk of bias. Data analysis was performed using Stata 18 software. The primary outcome was the visual analogue scale (VAS) pain scores at different time points within 14 days postoperatively. Secondary outcomes included the number of patients requiring analgesics and the occurrence of complications.\n\n**Results:** 358 articles were retrieved and six studies involving 598 patients were included after screening. Compared with the control group, the use of methylene blue reduced pain within 12 h postoperatively(WMD -1.582, 95% CI -2.834 to -0.330, <i>p</i> = .013), as well as on day 2 (WMD -1.441, 95% CI - 1.874 to -1.008, <i>p</i> < .0001), day 3 (WMD -0.975, 95% CI -1.309 to -0.641, <i>p</i> < .0001), day 5(WMD -0.786, 95% CI -1.094 to -0.478, <i>p</i> = .028) and day 7 (WMD -0.679, 95% CI -1.257 to -0.101, <i>p</i> = .021), decreased the number of patients using analgesics(RR 0.293, 95% CI 0.203 to 0.422, <i>p</i> < .0001) and did not increase the incidence of complications(RR 0.65, 95% CI 0.39-1.10, <i>p</i> = .111) such as urinary retention, secondary haemorrhage, pruritus, temporary incontinence, wound infection, or local skin reactions.\n\n**Conclusions:** This study shows that methylene blue can reduce postoperative pain, decrease analgesic use and does not increase complications after haemorrhoid surgery.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Analgesia, haemorrhoidectomy, methylene blue, postoperative pain", "link": "https://pubmed.ncbi.nlm.nih.gov/40944330/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sat, 13 Sep 2025"}, {"id": "40914745", "title_en": "Robotic versus laparoscopic total mesorectal excision for mid-low rectal cancer after neoadjuvant chemoradiotherapy: a systematic review and meta-analysis of oncological, perioperative, and survival-related outcomes", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Shukai Wang", "abstract_en": "A major cause of cancer death, colorectal cancer is becoming more common in younger people. The comparative effectiveness of robotic versus laparoscopic total mesorectal excision (TME) as surgical interventions for mid-low rectal cancer following neoadjuvant chemoradiotherapy (nCRT) remains uncertain. To systematically evaluate oncological, perioperative, and survival outcomes of robotic versus laparoscopic surgery for mid-low rectal cancer following nCRT. A PRISMA-compliant systematic review and meta-analysis included 20 non-randomized studies (13,212 patients) from Web of Science, PubMed, and Embase up to July 2025. Outcomes encompassed pathological completeness (circumferential resection margin, TME quality), perioperative metrics (operative duration, conversion rates), complications, and survival (5-year OS/DFS). Risk of bias was assessed via ROBINS-I; statistical synthesis utilized RevMan5.4 and hazard ratios derived from Kaplan-Meier curves. This meta-analysis of 20 non-randomized studies (13,212 patients) found no significant differences in 5-year overall survival (HR: 1.07, 95% CI 0.20-5.66, p = 0.94, I<sup>2</sup> = 98%) or disease-free survival (HR: 1.16, 95% CI 0.72-1.89, p = 0.54, I<sup>2</sup> = 0%) between robotic and laparoscopic TME after nCRT. Robotic surgery demonstrated superior technical outcomes, including higher rates of complete TME (OR: 1.97, p = 0.02) and reduced conversion to open surgery (OR: 0.46, p < 0.001), but required significantly longer operative time (WMD: + 42.09 min, p < 0.001). Perioperative metrics showed equivalence in intraoperative blood loss (p = 0.20), hospitalization duration (p = 0.78), and postoperative complications, including anastomotic leakage (5.4% vs. 6.5%, p = 0.28) and Clavien-Dindo III-IV events (OR: 1.11, p = 0.54). Pathological outcomes were comparable, with no differences in circumferential resection margin positivity (OR: 1.0, p = 1), distal margin length (p = 0.92), or lymph-node yield (p = 0.55). Local (OR: 0.85, p = 0.34) and distant recurrence rates (p = 0.99) were statistically indistinguishable. Risk-of-bias assessment revealed confounding risks in non-randomized designs, underscoring the need for RCT validation. Robotic and laparoscopic TME achieve equivalent long-term survival and oncological control after nCRT, with robotic advantages in technical precision counterbalanced by prolonged operative duration. The equivalence underscores nCRT's dominant role in tumor control, while procedural differences highlight context-dependent surgical feasibility. High heterogeneity in survival data and reliance on non-randomized evidence necessitate validation through rigorously designed RCTs incorporating standardized protocols and patient-reported functional outcomes.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Laparoscopic surgery, Meta-analysis, Mid–low rectal cancer, Neoadjuvant chemoradiotherapy, Robotic surgery, Total mesorectal excision", "link": "https://pubmed.ncbi.nlm.nih.gov/40914745/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sat, 06 Sep 2025"}, {"id": "40907429", "title_en": "ICG-FA for Anastomotic Leak Prevention During Minimally Invasive Colorectal Surgery: A Meta-analysis", "title_zh": "ICG-FA 在微创结直肠手术期间预防吻合口漏：荟萃分析", "authors": "Muhammad Shehryar Hussain", "abstract_en": "**Introduction:** Anastomotic leakage is a serious complication after colorectal surgery. Indocyanine green fluorescence angiography (ICG-FA) allows real-time perfusion assessment and may reduce leak rates; however, recent larger randomized clinical trials reported conflicting results. This meta-analysis aimed to clarify the effectiveness of ICG-FA in reducing anastomotic leakage and related complications following minimally invasive colorectal surgery.\n\n**Methods:** We conducted a comprehensive search across the databases to identify relevant studies. The search results were imported into Covidence for article eligibility screening, and all relevant outcomes data were synthesized using risk ratios (RRs) or mean differences with 95% confidence intervals (CIs) in meta-analysis models using RevMan 5.4. CRD420251031138.\n\n**Results:** Six randomized clinical trials involving 3264 participants were included. ICG-FA significantly reduced the risk of overall anastomotic leakage (RR: 0.66, 95% CI [0.53-0.83], P = 0.0005) and complications (RR: 0.88, 95% CI [0.78-0.99], P = 0.03). Subgroup analysis showed a significant reduction in leakage for left-sided anastomoses (RR: 0.57, 95% CI [0.44-0.75], P < 0.0001) but not for right-sided ones (RR: 0.90, 95% CI [0.53-1.51], P = 0.68). No significant differences were found in Clavien-Dindo ≥3 complications, reoperation rates, or hospital stay. However, the ICG-FA group had a longer operation time (mean difference: 5.57, 95% CI [1.56-9.58], P = 0.006).\n\n**Conclusions:** ICG-FA significantly reduces anastomotic leakage and overall complications in minimally invasive colorectal surgery, especially for left-sided anastomoses. However, its use is associated with a slightly longer operative time. Further research is needed to confirm its role in right-sided procedures and long-term outcomes.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leakage, Colorectal surgery, Fluorescence angiography, ICG, Indocyanine green, Meta-analysis, Minimally invasive surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40907429/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 04 Sep 2025"}, {"id": "40905480", "title_en": "Neoadjuvant Chemotherapy Without Radiation for Locally Advanced Rectal Cancer: A Meta-analysis of Surgical Outcomes After Total Mesorectal Excision", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Dean A Fergusson", "abstract_en": "**Background:** Neoadjuvant chemotherapy alone (with radiation omission) for locally advanced rectal cancer has been evaluated in several randomized controlled trials. Although oncologic outcomes have been well described, the impact of this treatment strategy on surgical outcomes is unknown.\n\n**Objective:** To evaluate how important surgical outcomes were reported in previous trials comparing neoadjuvant chemotherapy to chemoradiation therapy for locally advanced rectal cancer and to perform a meta-analysis of available data.\n\n**Data Sources:** A systematic review was conducted using MEDLINE, Embase, and the Cochrane Library Databases.\n\n**Study Selection:** All published randomized controlled trials that compared neoadjuvant chemotherapy to chemoradiation for MRI-staged rectal adenocarcinoma.\n\n**Interventions:** Neoadjuvant chemotherapy alone (with radiation omission).\n\n**Main Outcome Measures:** Postoperative surgical outcomes, including anastomotic leak, diverting ostomy use, ostomy nonreversal, 30-day postoperative morbidity, and postoperative bowel function.\n\n**Results:** Four randomized controlled trials met eligibility criteria and were included for data analysis. Oncologic outcomes demonstrated that neoadjuvant chemotherapy was equivalent or noninferior to chemoradiation therapy. Anastomotic leak and use of diverting ostomy were reported in 3 of the 4 trials, whereas 30-day postoperative morbidity and ostomy nonreversal were reported in only 2 trials. Bowel function was measured in 3 trials but was measured and reported differently in each trial. On meta-analysis, neoadjuvant chemotherapy was associated with a significant reduction in anastomotic leak (relative risk [RR] 0.54; 95% CI, 0.35-0.81), use of diverting ostomy (RR 0.79; 95% CI, 0.70-0.88), and ostomy nonreversal (RR 0.37; 95% CI, 0.15-0.93). There was no association between neoadjuvant chemotherapy and 30-day postoperative morbidity (RR 0.88; 95% CI, 0.53-1.45).\n\n**Limitations:** A small number of included trials with heterogeneity in outcome definitions was the limitation.\n\n**Conclusions:** Important surgical outcomes were not reported in trials comparing neoadjuvant chemotherapy alone to chemoradiation therapy for locally advanced rectal cancer. Based on the limited data available, chemotherapy alone was associated with reduced risk of anastomotic leak, diverting ostomy use, and ostomy nonreversal. See Video Abstract .", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study selection：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Interventions：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Main outcome measures：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.T on.\n\n**Results:** Nine systematic reviews encompassing 28 unique studies (3472 participants) were included. For polyps of any size, the pooled per-patient sensitivity was 0.79 (95% CI: 0.69-0.86), specificity was 0.77 (95% CI: 0.71-0.82), and the area under the curve (AUC) was 0.81. For polyps ⩾6 mm, sensitivity and specificity were 0.80 and 0.87 (AUC 0.81), and for polyps ⩾10 mm, 0.88 and 0.95 (AUC 0.95), respectively. Second-generation CCE (CCE2) improved diagnostic accuracy across all polyp sizes. For polyps of any size, CCE2 achieved a sensitivity of 0.90, specificity of 0.81 and AUC of 0.82. For polyps ⩾ 6 mm and ⩾10 mm, AUCs were 0.92 and 0.94, respectively. CCE2 showed high sensitivity for detecting any polyp size and polyps ⩾6 mm, with low heterogeneity (<i>p</i> > 0.05, <i>I</i> <sup>2</sup> < 25%). CRC detection sensitivity was 0.96 (95% CI: 0.73-1.00) after excluding cases where the capsule failed to reach the rectum due to battery exhaustion.\n\n**Conclusion:** CCE2 has high diagnostic accuracy for polyps and colorectal cancer detection. While technical challenges persist, CCE2 shows promise as a complementary diagnostic tool to help address the increasing demands for endoscopy services.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "CCE, CRC detection, CT colonoscopy, capsule endoscopy, colon capsule endoscopy, colonoscopy, panenteric capsule endoscopy, polyp, polyp detection, polypoidal lesion", "link": "https://pubmed.ncbi.nlm.nih.gov/40894328/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Tue, 02 Sep 2025"}, {"id": "40877526", "title_en": "Outcomes of embolization therapy of superior rectal arteries for the management of grade 1 to 3 internal hemorrhoids: a systematic Review of clinical studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jana Al Jnainati", "abstract_en": "**Background:** Superior rectal artery embolization (\"Emborrhoid\") offers a catheter-based alternative for grade I-III internal hemorrhoids when office therapies fail or surgery is undesirable.\n\n**Methods:** Following PRISMA 2020, PubMed and Embase were searched (Jan 2014-Jan 2024). Two reviewers independently screened records, extracted data, and applied RoB 2, ROBINS-I, or an adapted Newcastle-Ottawa Scale. Prespecified outcomes were technical success, clinical success (≥ 2-point fall in bleeding score or equivalent), adverse events, and recurrence. Substantial heterogeneity blocked meta-analysis; results were narratively synthesized.\n\n**Results:** Twenty-two studies encompassing 810 procedures qualified. Technical success reached 93-100%. Clinical success ranged from 63 to 94%, yielding marked bleeding control and symptom relief. Reported complications were mild and self-limited (pelvic discomfort, nausea, and low-grade fever); no ischemic injury, continence disturbance, or mortality occurred. Recurrence necessitating repeat treatment affected 8-20% of patients, usually when collateral arterial supply persisted. Patient-reported satisfaction exceeded 80% in every series. Only two small, heterogeneous comparative studies versus rubber-band ligation or sclerotherapy were available, precluding a pooled analysis.\n\n**Conclusions:** Current evidence suggests Emborrhoid is a safe, effective bridge between office procedures and surgery-particularly valuable for frail or anticoagulated patients. Yet small single-center cohorts, disparate techniques, and scarce head-to-head trials limit external validity. Multicenter randomized studies with harmonized outcomes and ≥ 24-month follow-up are required to confirm long-term efficacy, cost-effectiveness, and optimal patient selection.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Embolic materials, Hemorrhoidal embolization, Minimally invasive therapy, Patient satisfaction, Recurrence rates, Superior rectal artery, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40877526/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 28 Aug 2025"}, {"id": "40876363", "title_en": "Local excision versus total mesorectal excision following neoadjuvant chemoradiotherapy for rectal cancer: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Neary Peter", "abstract_en": "**Background:** Total mesorectal excision (TME) with or without neoadjuvant chemoradiotherapy remains the gold standard treatment for rectal cancer. However, newer organ sparing methods, including Local Excision (LE) have been introduced in conjunction with neoadjuvant therapy to improve morbidity and functional outcomes while not impacting on oncological outcomes.\n\n**Methods:** A systematic review and meta-analysis was performed using the PRISMA guidelines. All studies comparing neoadjuvant chemoradiotherapy and local excision versus TME were included from 2000 to 2024. Primary endpoint included local recurrence rates. Secondary outcomes included distant recurrence, disease free survival (DFS), overall survival (OS), and morbidity. Subgroup analysis was performed on randomised control trials (RCT).\n\n**Results:** Sixteen studies (n = 2121; LE = 616, TME = 1505) were included. LE was associated with higher local recurrence (8.3 % vs 5.5 %; OR 1.82, 95 % CI 1.19-2.77, p = 0.006). However, in RCTs (n = 245), this difference was not significant (7.3 % vs 6.6 %; OR 1.10, 95 % CI 0.41-2.97, p = 0.84). No significant differences were observed in distant recurrence, DFS, or OS. LE was associated with significantly reduced morbidity (OR 0.30, 95 % CI 0.18-0.50, p < 0.0001).\n\n**Conclusion:** Local recurrence was not statistically significant in the RCT subgroup analysis. Despite, higher local recurrence rates in the overall pooled analysis, no significant differences were observed for secondary outcomes. Neoadjuvant chemoradiotherapy and local excision appears oncologically safe, defined by DFS and OS, in select patient cohorts with a clinical complete or near-complete response to neoadjuvant therapy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.T
