y population was 42.4 (±15.7), years. There were 44 primary and 93 recurrent RVF. The weighted mean success rate for MF when performed for primary RVF was 91.4% (95% CI: 79.45-98.46; I<sup>2</sup> = 32.1%; P = 0.183) and that for recurrent RVF was 77.5% (95% CI: 62.24-89.67; I<sup>2</sup> = 58.1%; P = 0.008). The weighted mean complication rate was 29% (95% CI: 8.98-54.68; I<sup>2</sup> = 85.4%; P < 0.0001) and the overall recurrence rate was 12.0% (95% CI: 5.03-21.93; I<sup>2</sup> = 52.3%; P = 0.021). When purely radiotherapy-induced RVF were evaluated, the mean overall success rate was 94.6% (95% CI: 83.33-99.75; I<sup>2</sup> = 0%; P = 0.350).\n\n**Conclusions:** MF interposition appears to be more effective for primary than recurrent RVF. However, the poor quality of the data limits definitive conclusions being drawn and demands further assessment with randomized studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "complication, fistula, primary, rectovaginal, recurrence, success", "link": "https://pubmed.ncbi.nlm.nih.gov/38475976/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 13 Mar 2024"}, {"id": "38315695", "title_en": "Obstetric fistula repair failure and its associated factors among women who underwent repair in sub-Saharan Africa. A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Mesfin Abebe", "abstract_en": "**Background:** Obstetric fistula repair failure can result in increased depression, social isolation, financial burden for the woman, and fistula care programs. However, there is limited, comprehensive evidence on obstetric fistula repair failure in Sub-Saharan African countries. This systematic review and meta-analysis aimed to determine the pooled prevalence of obstetric fistula repair failure and associated factors among women who underwent surgical repair in Sub-Saharan African countries.\n\n**Methods:** To identify potential articles, a systematic search was done utilizing online databases (PubMed, Hinari, and Google Scholar). The Preferred Reporting Items for Systematic Review and Meta-Analysis Statement (PRISMA) guideline was used to report the review's findings. I2 test statistics were employed to examine study heterogeneity. A random-effects model was used to assess the pooled prevalence of obstetric fistula repair failure, and the association was determined using the log odds ratio. Publication bias was investigated using the funnel plot and Egger's statistical test at the 5% level of significance. Meta-regression and subgroup analysis were done to identify potential sources of heterogeneity. The data were analyzed using STATA version 17 statistical software.\n\n**Results:** A total of 24 articles with 9866 study participants from 13 Sub-Saharan African countries were included in this meta-analysis. The pooled prevalence of obstetric fistula repair failure in sub-Saharan Africa was 24.92% [95% CI: 20.34-29.50%]. The sub-group analysis by country revealed that the highest prevalence was in Angola (58%, 95% CI: 53.20-62.80%) and the lowest in Rwanda (13.9, 95% CI: 9.79-18.01%). Total urethral damage [OR  =  3.50, 95% CI: 2.09, 4.91], large fistula [OR = 3.09, 95% CI: (2.00, 4.10)], duration of labor [OR = 0.45, 95% CI: 0.27, 0.76], and previous fistula repair [OR = 2.70, 95% CI: 1.94, 3.45] were factors associated with obstetric fistula repair failure.\n\n**Conclusion:** Women who received surgical treatment for obstetric fistulas in Sub-Saharan African countries experienced more repair failures than the WHO standards. Obstetric fistula repair failure was affected by urethral damage, fistula size, duration of labor, types of fistula, and history of previous repairs. Therefore, we suggest policy measures specific to each country to provide special attention to the prevention of all risk factors, including poor nutrition, multiparty, obstructed labor, and maternal age, which can result in conditions like large fistulas, urethral damage, and repeat repair, in order to reduce obstetric fistula repair failure.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38315695/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 05 Feb 2024"}, {"id": "38296841", "title_en": "The use of core descriptors from the ENiGMA code study in recent literature: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Sharon L Stein", "abstract_en": "**Aim:** The heterogeneity in data quality presented in studies regarding Crohn's anal fistula (CAF) limit extrapolation into clinical practice. The ENiGMA collaborators established a core descriptor set to standardize reporting of CAF. The aim of this work was to quantify the use of these descriptors in recent literature.\n\n**Method:** We completed a systematic review of PubMed and the Cochrane Library, extracting publications from the past 10 years specific to the clinical interventions and outcomes of CAF, and reported in line with PRISMA guidance. Each article was assessed for inclusion of ENiGMA descriptors. The median number of descriptors per publication was evaluated along with the overall frequency of each individual descriptor. Use of ENiGMA descriptors was compared between medical and procedural publications.\n\n**Results:** Ninety publications were included. The median number of descriptors was 15 of 37; 16 descriptors were used in over half of the publications while 17 were used in fewer than a third. Descriptors were more frequently used in procedural (n = 16) than medical publications (n = 14) (p = 0.031). In procedural publications, eight descriptors were more frequently used including Faecal incontinence, Number of previous fistula interventions, Presence and severity of anorectal stenosis and Current proctitis. Medical publications were more likely to include Previous response to biological therapy and Duration and type of current course of biological therapy.\n\n**Conclusion:** With many descriptors being used infrequently and variations between medical and procedural literature, the colorectal community should assess the need for all 37 descriptors.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "core descriptor set, crohn’s perianal fistulae, multidisciplinary care, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38296841/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 31 Jan 2024"}, {"id": "38197847", "title_en": "Efficacy and safety of video-assisted anal fistula treatment in anorectal fistula: a meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xuebing Wang", "abstract_en": "**Introduction:** By searching relevant literature, the recurrence rate, complication rate after video-assisted anal fistula treatment (VAAFT), and efficacy and safety of the treatment were analyzed.\n\n**Evidence Acquisition:** Articles that reported the outcomes of VAAFT up to December 2020 were searched in PubMed (Medline) and Cochrane Library, in accordance with the preferred reporting items for systematic review and meta-analysis (PRISMA) screening guidelines. Two researchers independently completed the whole process from screening and inclusion to quality evaluation and bias risk assessment, and the data was included in the RevMan 5.3 software for analysis. The main outcomes were demographic data of patients, detection rate, classification of internal opening of anorectal fistula, postoperative recurrence rate, and incidence of complications.\n\n**Evidence Synthesis:** A total of 10 articles were included (779 patients). The average age of the patients was 44 years old, average operation time was 60 min, and the average follow-up time was 22 months. The ratio of male to female was 2.4:1, the ratio of high anorectal fistula to low anorectal fistula was 6.6:1, the detection rate of internal openings was 98%, the weighted recurrence rate was 24%, and the weighted complication rate was 1%.\n\n**Conclusions:** VAAFT is effective and safe in the treatment of anorectal fistulas.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38197847/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 10 Jan 2024"}, {"id": "38126903", "title_en": "Scoring Indices for Perianal Fistulising Crohn's Disease: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** In this systematic review we summarise existing scoring indices for assessing disease activity and quality of life in perianal fistulising Crohn's disease [PFCD], and highlight gaps in the literature.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL were searched from August 24, 2022, to identify studies evaluating clinical, radiological, or patient-reported outcome measures [PROMS] in PFCD. The primary objective was to identify all available scoring indices and describe the operating properties of these indices.\n\n**Results:** A total of 53 studies reported on the use of one clinical index [Perianal Disease Activity Index: PDAI], three PROMs, and 10 radiological indices; 25 studies evaluated the operating properties of these indices. The PDAI demonstrated content validity, construct validity, and responsiveness but criterion validity or reliability were not assessed. The Van Assche Index [VAI], modified VAI, and the Magnetic Resonance Index for Assessing Fistulas in Patients with CD [MAGNIFI-CD] were the most studied radiological indices. These indices demonstrated responsiveness and reliability. The VAI and MAGNIFI-CD demonstrated construct validity; criterion and content validity and feasibility have not been assessed. Among the three PROMs, the Crohn's Anal Fistula Quality of Life index demonstrated content and construct validity, inter-observer reliability, and responsiveness; criterion validity, intra-observer reliability, and feasibility have not been assessed for this index.\n\n**Conclusions:** There are no fully valid, reliable, and responsive clinical disease or radiological indices for PFCD. Although the radiological indices demonstrated responsiveness and reliability, well-defined cut-offs for response and remission are lacking. Future research should focus on establishing standardised definitions and thresholds for outcomes.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 共有 53 项研究报告了一项临床指标[肛周疾病活动指数：PDAI]、三项 PROM 和 10 项放射学指标的使用； 25 项研究评估了这些指数的操作特性。 PDAI 证明了内容有效性、结构有效性和响应性，但未评估标准有效性或可靠性。 Van Assche 指数 [VAI]、改良 VAI 和评估 CD 患者瘘管的磁共振指数 [MAGNIFI-CD] 是研究最多的放射学指数。这些指数显示了响应性和可靠性。 VAI 和 MAGNIFI-CD 证明了结构有效性；标准和内容的有效性和可行性尚未评估。在三个 PROM 中，克罗恩病肛瘘生活质量指数展示了内容和结构的有效性、观察者间的可靠性和响应性；尚未评估该指数的标准有效性、观察者内部可靠性和可行性。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Outcomes, disease activity indices, operating properties, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38126903/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 21 Dec 2023"}, {"id": "38091125", "title_en": "Cutting seton for the treatment of cryptoglandular fistula-in-ano: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "C Eskicioglu", "abstract_en": "**Background:** The use of cutting seton (CS) for the management of cryptoglandular fistula-in-ano has remained controversial because of reports of fecal incontinence, postoperative pain, and extended healing time. The aim of this review was to provide the first synthesis of studies investigating the use of CS for the treatment of cryptoglandular fistula-in-ano.\n\n**Methods:** MEDLINE, Embase, and CENTRAL were searched up to October 2022. Randomized controlled trials and observational studies comparing CS with alternative interventions were included, along with single-arm studies evaluating CS alone. The primary outcome was fistula-in-ano recurrence, and secondary outcomes included incontinence, healing time, proportion with complete healing, and postoperative pain. Inverse variance random-effects meta-analyses were used to pool effect estimates.\n\n**Results:** After screening 661 citations, 29 studies were included. Overall, 1513 patients undergoing CS (18.8% female, mean age: 43.1 years) were included. Patients with CS had a 6% (95% CI: 3-12%) risk of recurrence and a 16% (95% CI: 5-38%) risk of incontinence at 6 months. CS patients had an average healing time of 14.6 weeks (95% CI: 10-19 weeks) with 73% (95% CI: 48-89%) of patients achieving complete healing at 6 months postoperatively. There was no difference in recurrence between CS and fistulotomy, advancement flap, two-stage seton fistulotomy, or draining seton.\n\n**Conclusions:** Overall, this analysis shows that CS has comparable recurrence and incontinence rates to other modalities. However, this may be at the expense of more postoperative pain and extended healing time. Further comparative studies between CS and other modalities are warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal fistula, Colorectal surgery, Cryptoglandular fistula, Cutting seton, Fistula-in-ano", "link": "https://pubmed.ncbi.nlm.nih.gov/38091125/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 13 Dec 2023"}, {"id": "38018554", "title_en": "FISTULIZING PERIANAL CROHN'S DISEASE: IS THE PATIENT'S SEX A BURDEN? A SYSTEMATIC REVIEW", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Odery Ramos Júnior", "abstract_en": "**Background:** Fistulizing perianal Crohn's disease poses a treatment challenge, and researchers postulate that this phenotype in young male patients could have a worst outcome.\n\n**Objective:** Thus, the aim of this study was to assess whether sex influences the response to treatment for these patients.\n\n**Methods:** This systematic review (PROSPERO CRD42022319629) was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses protocol. We selected articles published in English, Spanish, Portuguese, and Italian between 2010 and 2020 in the PubMed and Science Direct databases. According to the PICO acronym, prospective studies in patients older than 18 years with the objective of treating fistulizing perianal Crohn's disease were selected. Studies in pediatric populations, retrospective, without treatment objectives, and that included only rectovaginal fistulas or a single sex were excluded. Study quality was assessed using the Cochrane risk of bias tool and Newcastle-Ottawa scale.\n\n**Results:** Of the 1887 articles found, 33 were included. Most studies used anti-TNF drugs as treatment (n=11). Ten studies had subgroup analyses; of them, the two studies reporting sex differences used infliximab and adalimumab as treatment and showed that women had a longer fistula closure time than men.\n\n**Conclusion:** This systematic review showed that few data corroborate the difference between sexes in the treatment of fistulizing perianal Crohn's disease, possibly having a greater relationship with the phenotype. However, considering the lack of results, further studies with this objective and with standardization of fistulas and response assessment methods are needed.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.  anal fistula (CAF), however, none is ideal. To compare the superiority of Anal fistula plug (AFP) and Endoanal advancement flap repair (EAFR) for complex anal fistula. We searched worldwide databases including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed from their inception to March 2023. Studies comparing the outcomes of AFP and EAFR were included according to the PICO principles. The indicators of the healing rate, recurrence rate, wound infection rate, and complication rate, et al. were extracted and compared between different surgical methods. 5 RCTS and 7 non-RCTs were included in the meta-analysis with a total of 847 patients (341 patients conducted with AFP and 506 patients with EAFR). By combining the total effect of the 12 articles, we found that there was a statistical difference reporting the healing rate of AFP 48.3% and EAFR 64.4% treating the CAF (OR 0.68, 95% CI 0.30,1.55, P = 0.03), and EAFR has a better healing rate. However, there was no significant difference in terms of the recurrence rate (OR 1.68, 95% CI 0.80,3.54, P = 0.17), the wound infection rate (OR 1.82, 95% CI 0.95,3.52, P = 0.07), and the complication rate (OR 1.06, 95% CI 0.70,1.61, P = 0.77) either in the 12 articles or in the subgroup. The meta-analysis indicated that the EAFR was superior to AFP in terms of the healing rate treating the CAF, however, there were no significant differences between the two groups when it came to the recurrence rate, the wound infection rate, and the complication rate. EAFR might be one initial treatment for the complex cryptoglandular anal fistulas compared with AFP.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula plug, Complex anal fistula, Endoanal advancement flap repair, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37882975/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 26 Oct 2023"}, {"id": "37737881", "title_en": "Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Maosheng Tian", "abstract_en": "**Background:** Considering the difficulty of treating complex anal fistula (CAF), various surgical techniques exist in clinical work. However, none are ideal. Evidence on the efficacy and safety of different surgical treatments is scarce. The authors aimed to compare the outcomes of the 13 surgical techniques and tried to find the best surgical method for treating CAF.\n\n**Materials And Methods:** The authors searched worldwide databases, including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed, from inception to March 2023. All randomized controlled trials comparing the outcomes of 13 surgical techniques were included according to the PICO principles. The indicators of the cure rate, the recurrence rate, the complication rate, the operating time, the postoperative pain on day 1 (VAS), and the postoperative incontinence in month 1 (Wexner) were extracted and analyzed using STATA software 15.1, Review Manager 5.4, and GeMTC14.3.\n\n**Results:** Twenty-eight randomized controlled trials with a total of 2274 patients were included in the network meta-analysis. There was no statistically significant difference in the comparison among any surgical interventions in terms of the cure rate ( P >0.05 Table 2) and recurrence rate ( P >0.05 Table 3). However, in terms of complication rate, fistulectomy was lower than FPS (Median: 0.14; 95% CI: 0.02-0.70) or fistulotomy (Median: 0.09; 95% CI: 0.01-0.55), and fistulotomy was lower than EAFR (Median: 0.24; 95% CI: 0.05-0.84), LIFT (Median: 0.17; 95% CI: 0.02-0.66) or LIFT-EAFR (Median: 0.11; 95% CI: 0.01-0.69) ( P >0.05 Table 4). The surface estimated the advantages and disadvantages under the cumulative ranking (SUCRA). The ranking results indicated that fistulectomy might have the lowest complication rate (SUCRA=7.9%). Because the network results of the operating time, the postoperative pain, and the postoperative incontinence contained no closed loops, the results of their probability ranking could only be referenced, demonstrating that fistulectomy might have the shortest operating time (SUCRA=23.4%), video-assisted modified ligation of the intersphincteric fistula tract (VAMLIFT) might have the lowest postoperative pain on day 1 (VAS) (SUCRA=0.4%) and LIFT might have the lowest postoperative incontinence in month 1(Wexner) (SUCRA=16.2%).\n\n**Conclusion:** Fistulectomy might have the lowest complication rate, which might be the relatively superior surgical technique for treating CAF.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37737881/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 22 Sep 2023"}, {"id": "37707561", "title_en": "Comparing the efficacy and safety of different thread-drawing surgery method for treating high complex anal fistula: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Guofeng Li", "abstract_en": "**Purpose:** To evaluate the effect of different surgical methods in the treatment of high complex anal fistula by systematic review and network meta-analysis.\n\n**Methods:** Randomized controlled trials that met the inclusion criteria in PubMed, Cochrane Library, Embase, Web of Science, CBM, CNKI, WANFANG DATA, VIP were searched from the date of database construction to May 23, 2023.\n\n**Results:** Among the 48 randomized controlled trials (RCTs), 4205 patients were included in the network meta-analysis. Incision thread-drawing counter-drainage procedure (ITCP) in improving the effective rate, the cure rate; reduce the recurrence rate, reduce the anal canal damage has a huge advantage. Directional line-hanging method (DLM) is optimal for safety and postoperative pain relief. Directional line-hanging method (ITSS) protect the optimal anal function after surgery. Sphincter preserving thread-hanging method (SPTM) has a significant advantage in accelerating wound healing time. Main tube incision combined with thread-hanging branch tube drainage (MIBD) is second only to incision thread-drawing counter-drainage procedure (ITCP) in improving effective rate, cure rate, reducing recurrence rate and reduce complication rate.\n\n**Conclusion:** In general, different thread-drawing surgery methods have good clinical effect for the treatment of high complex anal fistula. In general, these methods provide evidence-based medical evidence for early treatment in terms of improving clinical efficacy, relieving anal pain and reducing wound healing time. However, there are differences in the number of included literature studies, and further verification by large-sample, high-quality, multicenter RCTS is still needed in the next stage.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "High complex anal fistula, Network meta-analysis, Systematic review, Thread-drawing surgery method", "link": "https://pubmed.ncbi.nlm.nih.gov/37707561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 14 Sep 2023"}, {"id": "37704476", "title_en": "Risk factors for anastomotic stenosis after radical resection of rectal cancer: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kun Qian", "abstract_en": "Radical resection of rectal cancer is a safe and effective treatment, but there remain several complications related to anastomosis. We aimed to assess the risk factors and incidence of rectal anastomotic stenosis (AS) after rectal cancer resection. We conducted a systematic review and meta-analysis after searching PubMed, Embase, Web of Science, and Medline databases from inception until May 2023. Data are reported as the combined odds ratio (OR) for categorical variables and the weighted mean difference (WMD) for continuous variables. Six hundred and fifty-nine studies were retrieved, nine (3031 patients) of which were included in the meta-analysis. Young age (WMD = -3.09, P = 0.0002), male sex (OR = 1.53, P = 0.0002), smoking (OR = 1.54, P = 0.009), radiotherapy (OR = 2.34, P = 0.0002), protective stoma (OR = 2.88, P = 0.007), intersphincteric resection surgery (OR = 6.28, P = 0.05), anastomotic fistula (OR = 3.72, P = 0.003), and anastomotic distance (WMD = -3.11, P = 0.0006) were identified as factors that increased the risk of AS, while staple (OR = 0.39, P < 0.001) was a protective factor. The incidence of AS after rectal cancer resection was approximately 17% (95% CI: 13%-21%). We identified eight risk factors and one protective factor associated with AS after rectal cancer resection. These factors may be combined in future studies to develop a more comprehensive and accurate prediction model related to AS after rectal cancer resection.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "吻合口狭窄，Meta分析，直肠癌根治术", "keywords_en": "Anastomotic stenosis, Meta-analysis, Radical resection of rectal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/37704476/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 13 Sep 2023"}, {"id": "37608385", "title_en": "Comparative efficacy of oral drugs for chronic radiation proctitis - a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jinjun Liang", "abstract_en": "**Background:** Chronic radiation proctitis (CRP) is a long-term complication of pelvic radiotherapy that manifests as rectal bleeding, diarrhoea, fistula formation and obstruction. Treatments such as endoscopic argon plasma coagulation, hyperbaric oxygen therapy and rectal topical formalin have imposed a significant medical burden on CRP patients. In contrast, oral therapies offer a more accessible and acceptable option for managing CRP. Here, we conducted a systematic review of the efficacy of oral treatments for CRP to assess their potential as an effective and convenient treatment option for this condition.\n\n**Methods:** We searched the Cochrane Central Register of Controlled Trials, PubMed, Web of Science, China National Knowledge Infrastructure and Chinese VIP in February 2021. We included post-radiotherapy participants with CRP that compared oral medicine alone or in combination with other treatments versus control treatments. The primary outcomes were bleeding, diarrhoea and symptom score. Heterogeneity between studies was checked using Cochrane Q test statistics and I<sup>2</sup> test statistics. The Cochrane risk-of-bias tool was used to assess the quality of the included studies.\n\n**Results:** We included 10 randomised controlled trials (RCTs) and 1 retrospective study with 898 participants. Three placebo-controlled trials evaluated the effects of oral sucralfate on CRP, with meta-analysis showing no significant different with placebo arm. Four trials on TCM demonstrated significant improvement of symptoms, especially for the 3 trials on oral TCM drinks. Retinyl palmitate and high-fibre diet were found to reduce rectal bleeding. The combination of oral pentoxifylline and tocopherol did not significantly change the process of CRP.\n\n**Conclusions:** Our study implies that oral TCM drinks, retinyl palmitate and a high-fiber diet showed significant improvement in CRP symptoms, but not with the combination of oral pentoxifylline and tocopherol. Further multicentre, larger-scale RCTs are needed to confirm the efficacy and safety of these treatments and optimize treatment strategies, ultimately improving the quality of life for patients with CRP.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Pleas the selected studies. For preoperative MRI, the significant items affecting the outcome were the length of the fistula, horseshoe type, presence of multiple tracts, supralevator extension, and apparent diffusion coefficient (ADC) value. Other studies investigated the healing process using postoperative MRI.\n\n**Conclusion:** This review found that MRI can be useful in the management of AF, both preoperatively and postoperatively. Factors, such as fistula length, horseshoe type, presence of multiple tracts, supralevator extension, and ADC value were found to be significantly associated with treatment outcomes. The presence of the fistula tract and the development of new abscesses on postoperative MRI was found to hinder the healing process. Further studies are needed to confirm these findings.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, magnetic resonance imaging, recurrence, treatment outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/37359408/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 26 Jun 2023"}, {"id": "37277090", "title_en": "Neonatal head circumference as a risk factor for obstetric anal sphincter injuries: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ahmad Azmi Nasution", "abstract_en": "**Objective:** Between 53% and 79% of women will sustain some degree of perineal laceration during vaginal delivery. Third- and fourth-degree perineal lacerations are known as obstetric anal sphincter injuries. Timely diagnosis and prompt treatment of obstetric anal sphincter injuries can help to prevent the development of severe consequences like fecal incontinence, urinary incontinence, and rectovaginal fistula. Neonatal head circumference is routinely measured postpartum but is often not mentioned as a risk factor for obstetric anal sphincter injuries in clinical guidelines. Thus far, no review article on the risk factors for obstetric anal sphincter injuries has discussed the role of neonatal head circumference. This study aimed to review and analyze the relationship between head circumference and the occurrence of obstetric anal sphincter injuries among previous studies to conclude whether head circumference should be recognized as an important risk factor.\n\n**Data Sources:** Through study screening on Google Scholar, PubMed, Scopus, and Science Direct for articles published between 2013 to 2023, followed by assessment of eligibility, this study ended up reviewing 25 studies, 17 of which were included in the meta-analysis.\n\n**Study Eligibility Criteria:** Only studies that reported both the neonatal head circumference and the occurrence of obstetric anal sphincter injuries were included in this review.\n\n**Methods:** The included studies were appraised using the Dartmouth Library risk of bias assessment checklist. Qualitative synthesis was based on the study population, findings, adjusted confounding factors, and suggested causative links in each study. Quantitative synthesis was conducted using calculation and pooling of odds ratios and inverse variance using Review Manager 5.4.1.\n\n**Results:** A statistically significant association between head circumference and obstetric anal sphincter injuries was reported in 21 of 25 studies; 4 studies reported that head circumference was a true independent risk factor. A meta-analysis of the studies that reported neonatal head circumference as a dichotomous categorical variable with a cutoff point of 35±1 cm yielded statistically significant pooled results (odds ratio, 1.92; 95% confidence interval, 1.80-2.04).\n\n**Conclusion:** The risk for obstetric anal sphincter injuries increased as the neonatal head circumference increased-this should be considered in decision-making during labor and postpartum management to attain the best outcome.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study eligibility criteria：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 使用达特茅斯图书馆偏倚风险评估清单对纳入的研究进行评估。定性综合基于研究人群、研究结果、调整后的混杂因素以及每项研究中建议的因果关系。使用 Review Manager 5.4.1 计算并合并优势比和逆方差，进行定量综合。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "delivery, neonatal head circumference, obstetric anal sphincter injuries", "link": "https://pubmed.ncbi.nlm.nih.gov/37277090/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 05 Jun 2023"}, {"id": "37213241", "title_en": "Incidence of Rectal Injury After Radical Prostatectomy: A Systematic Review and Meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vincenzo Ficarra", "abstract_en": "**Context:** Rectal injury (RI) is a dreaded complication after radical prostatectomy (RP), increasing the risk of early postoperative complications, such as bleeding and severe infection/sepsis, and late sequelae, such as a rectourethral fistula (RUF). Considering its traditionally low incidence, uncertainty remains as to predisposing risk factors and management.\n\n**Objective:** To examine the incidence of RI after RP in contemporary series and to propose a pragmatic algorithm for its management.\n\n**Evidence Acquisition:** A systematic literature search was performed using the Medline and Scopus databases. Studies reporting data on RI incidence were selected. Subgroup analyses were conducted to assess the differential incidence by age, surgical approach, salvage RP after radiation therapy, and previous benign prostatic hyperplasia (BPH)-related surgery.\n\n**Evidence Synthesis:** Eighty-eight, mostly retrospective noncomparative, studies were selected. The meta-analysis obtained a pooled RI incidence of 0.58% (95% confidence interval [CI] 0.46-0.73) in contemporary series with significant across-study heterogeneity (I<sup>2</sup> = 100%, <i>p</i> < 0.00001). The highest RI incidence was found in patients undergoing open RP (1.25%; 95% CI 0.66-2.38) and laparoscopic RP (1.25%; 95% CI 0.75-2.08) followed by perineal RP (0.19%; 95% CI 0-276.95) and robotic RP (0.08%; 95% CI 0.02-0.31). Age ≥60 yr (0.56%; 95% CI 0.37-06) and salvage RP after radiation therapy (6.01%; 95% CI 3.99-9.05), but not previous BPH-related surgery (4.08%, 95% CI 0.92-18.20), were also associated with an increased RI incidence. Intraoperative versus postoperative RI detection was associated with a significantly decreased risk of severe postoperative complications (such as sepsis and bleeding) and subsequent formation of a RUF.\n\n**Conclusions:** RI is a rare, but potentially devastating, complication following RP. RI incidence was higher in patients ≥60 yr of age, and in those who underwent open/laparoscopic approach or salvage RP after radiation therapy. Intraoperative RI detection and repair apparently constitute the single most critical step to significantly decrease the risk of major postoperative complications and subsequent RUF formation. Conversely, intraoperatively undetected RI can lead more often to severe infective complications and RUF, the management of which remains poorly standardised and requires complex procedures.\n\n**Patient Summary:** Accidental rectum tear is a rare, but potentially devastating, complication in men undergoing prostate removal for cancer. It occurs more often in patients aged 60 yr or older as well as in those who underwent prostate removal via an open/laparoscopic approach and/or prostate removal after radiation therapy for recurrent disease. Prompt identification and repair of this condition during the initial operation are the key to reduce further complications such as the formation of an abnormal opening between the rectum and the urinary tract.", "abstract_zh": "**Context：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Patient summary：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we  ratio: 1.363, 95% confidence interval: 0.373-4.972, P = .639), recurrence (odds ratio: 0.525, 95% confidence interval: 0.263-1.047, P = .067), and complications (odds ratio: 0.356, 95% confidence interval: 0.085-1.487, P = .157) were similar between the 2 procedures. Ligation of intersphincteric fistula tract was associated with a significantly shorter operation time (weighted mean difference: -4.876, 95% confidence interval: -7.988 to -1.764, P = .002) and less postoperative pain (weighted mean difference: -1.030, 95% confidence interval: -1.418 to -0.641, 0.198, P < .001, I<sup>2</sup> = 3.85%) than advancement flap. Ligation of intersphincteric fistula tract was associated with marginally lower odds of fecal incontinence than advancement flap (odds ratio: 0.27, 95% confidence interval: 0.069-1.06, P = .06).\n\n**Conclusion:** Ligation of intersphincteric fistula tract and advancement flap had similar odds of healing, recurrence, and complications. The odds of fecal incontinence and extent of pain after ligation of intersphincteric fistula tract were lower than after advancement flap.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37198039/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 17 May 2023"}, {"id": "37101285", "title_en": "Mesenchymal stem cells transplantation for perianal fistulas: a systematic review and meta-analysis of clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "J L Jiang", "abstract_en": "**Background:** Perianal fistulas, characterised as granulomatous inflammation of fistulas around the anal canal, are associated with significant morbidity resulting in a negative impact on quality of life and a tremendous burden to the healthcare system. Treatment of anal fistulas usually consists of anal surgery; however, results of closure rates are not satisfactory especially with complex perianal fistulas, after which many patients may suffer from anal incontinence. Recently, the administration of mesenchymal stem cells (MSCs) has shown promising efficacy. Herein, we aim to explore whether MSCs are effective for complex perianal fistulas and if they have either short-term, medium-term, long-term or over-long-term efficacy. Additionally, we want to elucidate whether factors such as drug dosage, MSC source, cell type, and disease aetiology influence treatment efficacy. We searched four online databases and analysed data based on information within the clinical trials registry. The outcomes of eligible trials were analysed with Review Manager 5.4.1. Relative risk and related 95% confidence interval were calculated to compare the effect between the MSCs and control groups. In addition, the Cochrane risk of bias tool was applied to evaluate the bias risk of eligible studies. Meta-analyses showed that therapy with MSCs was superior to conventional treatment for complex perianal fistulas in short-, long- and over-long-term follow-up phases. However, there was no statistical difference in treatment efficacy in the medium term between the two methods. Subgroup meta-analyses showed factors including cell type, cell source and cell dosage were superior compared to the control, but there was no significant difference between different experimental groups of those factors. Besides, local MSCs therapy has shown more promising results for fistulas as a result of Crohn's Disease (CD). Although we tend to maintain that MSCs therapy is effective for cryptoglandular fistulas equally, more studies are needed to confirm this conclusion in the future.\n\n**Short Conclusion:** MSCs Transplantation could be a new therapeutic method for complex perianal fistulas of both cryptoglandular and CD origin showing high efficacy in the short-term to over-long-term phases, as well as high efficacy in sustained healing. The difference in cell types, cell sources and cell dosages did not influence MSCs' efficacy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Short conclusion：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Clinical trials, Efficacy and safety, Healing rate, Mesenchymal stem cells transplantation, Perianal fistulas, Randomised controlled trial, Systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37101285/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 26 Apr 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36905499", "title_en": "A Systematic Review of Epidemiology and Outcomes Associated with Local Surgical and Intersphincteric Ligation Procedures for Complex Cryptoglandular Fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Suzanne F Cook", "abstract_en": "**Introduction:** This systematic literature review (SLR) assessed incidence/prevalence of cryptoglandular fistulas (CCF) and outcomes associated with local surgical and intersphincteric ligation procedures for CCFs.\n\n**Methods:** Two trained reviewers searched PubMed and Embase for observational studies evaluating the incidence/prevalence of cryptoglandular fistula and clinical outcomes of treatments for CCF after local surgical and intersphincteric ligation procedures for CCF.\n\n**Results:** In total 148 studies met a priori eligibility criteria for all cryptoglandular fistulas and all intervention types. Of those, two assessed incidence/prevalence of cryptoglandular fistulas. Eighteen reported clinical outcomes of surgeries of interest in CCF and were published in the past 5 years. Prevalence was reported as 1.35/10,000 non-Crohn's patients, and 52.6% of non-IBD patients were found to progress from anorectal abscess to fistula over 12 months. Primary healing rates ranged from 57.1% to 100%; recurrence occurred in a range of 4.9-60.7% and failure in 2.8-18.0% of patients. Limited published evidence suggests postoperative fecal incontinence and long-term postoperative pain were rare. Several of the studies were limited by single-center design with small sample sizes and short follow-up durations.\n\n**Discussion:** This SLR summarizes outcomes from specific surgical procedures for the treatment of CCF. Healing rates vary according to procedure and clinical factors. Differences in study design, outcome definition, and length of follow-up prevent direct comparison. Overall, published studies offer a wide range of findings with respect to recurrence. Postsurgical incontinence and long-term postoperative pain were rare in the included studies, but more research is needed to confirm rates of these conditions following CCF treatments.\n\n**Conclusion:** Published studies on the epidemiology of CCF are rare and limited. Outcomes of local surgical and intersphincteric ligation procedures show differing success and failure rates, and more research is needed to compare outcomes across various procedures. (PROSPERO; registration number CRD42020177732).", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 总共 148 项研究符合所有隐腺瘘和所有干预类型的先验资格标准。其中，有两项评估了隐腺瘘管的发病率/患病率。过去 5 年发表了 18 份报告，其中涉及 CCF 手术的临床结果。据报道，非克罗恩病患者的患病率为 1.35/10,000，并且发现 52.6% 的非 IBD 患者在 12 个月内从肛门直肠脓肿进展为瘘管。一期愈合率从57.1%到100%；复发率为 4.9-60.7%，失败率为 2.8-18.0%。有限的已发表证据表明术后大便失禁和长期术后疼痛很少见。一些研究受到单中心设计、样本量小和随访时间短的限制。\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Complex cryptoglandular fistula, Healing, Incontinence, Pain, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/36905499/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36905475", "title_en": "Platelet-rich plasma in the treatment of anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xiaofei Li", "abstract_en": "**Objective:** To analyse the safety and effectiveness of platelet-rich plasma (PRP) in anal fistula patients.\n\n**Methods:** Online databases including PubMed, Embase, Cochrane Library, and Web of Science were searched from inception to December 5, 2022, for eligible studies about evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. Literature search, screening, data extraction, and quality assessment were carried out by two independent investigators. The overall cure rate, the complete cure rate, the recurrence rate, and the adverse event rate with their 95% confidence intervals (95% CI) were the primary calculation indexes. Subgroup analyses were conducted primarily according to whether PRP was combined with other treatments. Softwares of MedCalc 18.2 and Review Manager 5.3 were used for meta-analysis.\n\n**Results:** A total of 14 studies with 514 patients were included in the meta-analysis. The overall cure rate of 14 studies was 72.11% (95% CI 0.64-0.79). The cure rate of PRP alone was 62.39% (95% CI 0.55-0.69). The combined cure rate of PRP with other treatments was 83.12% (95% CI 0.77-0.88). The cure rate of interventions involving PRP were superior to the cure rate of surgery methods without using PRP significantly in the 4 randomized controlled studies (RR = 1.30, 95% CI 1.10-1.54, p = 0.002). The complete cure rate of the 8 studies was 66.37% (95% CI 0.52-0.79). The recurrence rate of the 12 studies was 14.84% (95% CI 0.08-0.24). The adverse event rate of the 12 studies was 6.31% (95% CI 0.02-0.12).\n\n**Conclusion:** PRP showed favorable safety and effectiveness in the treatment of anal fistula, especially combined with other treatment procedures.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Adverse events, Anal fistula, Cure rate, Meta-analysis, PRP, Recurrence rate", "link": "https://pubmed.ncbi.nlm.nih.gov/36905475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "小儿肛周脓肿和肛瘘的最佳初步治疗：系统评价和荟萃分析", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Level of evidence：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36847868", "title_en": "Conservative surgery versus colorectal resection for endometriosis with rectal involvement: a systematic review and meta-analysis of surgical and long-term outcomes", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Cillian Clancy", "abstract_en": "**Purpose:** The optimal surgical approach for removal of colorectal endometrial deposits is unclear. Shaving and discoid excision of colorectal deposits allow organ preservation but risk recurrence with associated functional issues and re-operation. Formal resection risks potential higher complications but may be associated with lower recurrence rates. This meta-analysis compares peri-operative and long-term outcomes between conservative surgery (shaving and disc excision) versus formal colorectal resection.\n\n**Methods:** The study was registered with PROSPERO. A systematic search was performed on PubMed and EMBASE databases. All comparative studies examining surgical outcomes in patients that underwent conservative surgery versus colorectal resection for rectal endometrial deposits were included. The two main groups (conservative versus resection) were compared in three main blocks of variables including group comparability, operative outcomes and long-term outcomes.\n\n**Results:** Seventeen studies including 2861 patients were analysed with patients subdivided by procedure: colorectal resection (n = 1389), shaving (n = 703) and discoid excision (n = 742). When formal colorectal resection was compared to conservative surgery there was lower risk of recurrence (p = 0.002), comparable functional outcomes (minor LARS, p = 0.30, major LARS, p = 0.54), similar rates of postoperative leaks (p = 0.22), pelvic abscesses (p = 0.18) and rectovaginal fistula (p = 0.92). On subgroup analysis, shaving had the highest recurrence rate (p = 0.0007), however a lower rate of stoma formation (p < 0.00001) and rectal stenosis (p = 0.01). Discoid excision and formal resection were comparable.\n\n**Conclusion:** Colorectal resection has a significantly lower recurrence rate compared to shaving. There is no difference in complications or functional outcomes between discoid excision and formal resection and both have similar recurrence rates.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Colorectal surgery, Endometriosis, Meta-analysis, Surgery, Surgery outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/36847868/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 27 Feb 2023"}, {"id": "36740680", "title_en": "Surgical management of complex perianal fistula revisited in a systematic review: a critical view of available scientific evidence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "F de la Portilla", "abstract_en": "**Background:** Treating complex perianal fistulas in Crohn's disease patients remains a challenge. Classical surgical treatments for Crohn's disease fistulas have been extrapolated from cryptoglandular fistulas treatment, which have different etiology, and this might interfere with its effectiveness, in addition, they increase fecal incontinence risk. Recently, new surgical techniques with support from biological approaches, like stem cells, have been developed to preserve the function of the sphincter. We have performed a systematic literature review to compare the results of these different techniques in the treatment of Crohn's or Cryptoglandular fistula.\n\n**Methods:** PubMed, EMBASE, Database of Abstracts of Reviews of Effectiveness, Cochrane Central Register of Controlled Trials were searched systematically for relevant articles. We included randomized controlled trials and observational studies that referred to humans, were written in English, included adults 18+ years old, and were published during the 10-year period from 2/01/2010 to 2/29/2020. Evidence level was assigned as designated by the Scottish Intercollegiate Guidelines Network.\n\n**Results:** Of the 577 citations screened, a total of 79 were ultimately included in our review. In Crohn's disease patients, classical techniques such as primarily seton, Ligation of Intersphincteric Fistula Tracks, or lay open, healing rates were approximately 50-60%, while in cryptoglandular fistula were around, 70-80% for setons or flaps. In Crohn's disease patients, new surgical techniques using derivatives of adipose tissue reported healing rates exceeding 70%, stem cells-treated patients achieved higher combined remission versus controls (56.3% vs 38.6%, p = 0.010), mesenchymal cells reported a healing rate of 80% at week 12. In patients with cryptoglandular fistulas, a healing rate of 70% using derivatives of adipose tissue or platelets was achieved, and a healing rate of 80% was achieved using laser technology. Fecal incontinence was improved after the use of autologous platelet growth factors and Nitinol Clips.\n\n**Conclusion:** New surgical techniques showed better healing rates in Crohn's disease patients than classical techniques, which have better results in cryptoglandular fistula than in Crohn's disease. Healing rates for complex cryptoglandular fistulas were similar between the classic and new techniques, being the new techniques less invasive; the incontinence rate improved with the current techniques.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complex perianal fistula, Crohn’s disease, Cryptoglandular fistula, Surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/36740680/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Sun, 05 Feb 2023"}, {"id": "36735766", "title_en": "Gracilis Muscle Interposition for the Treatment of Rectovaginal Fistula: A Systematic Review and Pooled Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Tracy L Hull", "abstract_en": "**Background:** A rectovaginal fistula is a debilitating condition that often severely impacts quality of life. Despite many treatment options available, the best surgical treatment is far from being established, and many patients will undergo several procedures before fistula closure is achieved. Gracilis muscle interposition, which is the transposition of the gracilis muscle into the rectovaginal septum, is an option for complex and persistent fistulas, but literature on the subject is scarce, mainly consisting of small case series.\n\n**Objective:** This study aimed to assess the success rate of gracilis muscle interposition for the surgical treatment of rectovaginal fistula.\n\n**Data Sources:** MEDLINE, Embase, Cochrane Library, and Web of Science.\n\n**Study Selection:** Studies comprising at least 5 patients who underwent gracilis muscle interposition for rectovaginal fistula were included. No date or language restrictions was applied.\n\n**Intervention:** Gracilis muscle interposition.\n\n**Main Outcome Measures:** The primary outcome is the fistula closure rate (%). Other domains analyzed are stoma closure rate, postoperative complications, quality of life, fecal continence, and sexual function.\n\n**Results:** Twenty studies were included for a total of 384 patients. The pooled fistula closure rate for gracilis muscle interposition was 64% (95% CI, 53%-74%; range, 33%-100%). Risk factors for failure were smoking, underlying Crohn's disease, and more than 2 previous repairs, whereas stoma formation was associated with improved outcomes. Postoperative complications ranged from 0% to 37%, mostly related to surgical site occurrences at the harvest site and perineal area. No deaths occurred. Gracilis muscle interposition improved quality of life and fecal continence, but impairment of sexual function was common.\n\n**Limitations:** Most of the included studies were small case series.\n\n**Conclusions:** Gracilis muscle interposition is a safe and moderately effective treatment that could be taken into consideration as second- or third-line therapy for recurrent rectovaginal fistula.\n\n**Registration No:** CRD42022319621.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 本研究旨在评估股薄肌介入手术治疗直肠阴道瘘的成功率。\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study selection：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Intervention：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Main outcome measures：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Limitations：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration no：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/36735766/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 03 Feb 2023"}, {"id": "36658773", "title_en": "Autologous fat graft injections for the treatment of perianal fistulas in Crohn's disease: a systematic review and single-arm meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "SVHM IBD Collaborative Group", "abstract_en": "**Background:** Crohn's perianal fistulas are often refractory to standard management. Fat graft injections are hypothesised to improve fistula healing rates. We evaluated the treatment efficacy of fat graft injections for Crohn's perianal fistulas in a systematic review (PRISMA).\n\n**Methods:** We completed database searches of MEDLINE (Ovid), Embase, and PubMed. All studies published in English in full text or abstract, from January 2001 to August 2021, evaluating fat graft injections for Crohn's perianal fistulas were selected. Included randomized controlled trials, single-arm intervention trials, cohort studies, and case series; excluded single case reports. Primary outcome was pooled clinical healing, defined as non-draining treated fistulas, or closure, defined as closure of treated fistulas. Secondary outcomes were clinical healing, clinical closure, radiologic response, and adverse events.\n\n**Results:** Of 1258 publications identified, 891 articles were assessed for eligibility, and 107 relevant for manuscript review. Forty-nine patients received fat graft injections for Crohn's perianal fistulas across four single-arm intervention trials. Clinical healing or closure was achieved in 74% in a pooled single-arm meta-analysis (95% confidence interval: 57%, 85%), with moderate heterogeneity between studies. Clinical healing was achieved in 20% and 60% at 3 and 12 months, respectively. Clinical closure was achieved in 83% at 6 months. Variable parameters were used to define radiologic response, with success rates from 20% to 67%. Minimal adverse events were reported.\n\n**Conclusion:** Fat graft injections show promise as a novel treatment for Crohn's perianal fistulas in this systematic review and meta-analysis. Assessment in controlled matched studies is warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later
