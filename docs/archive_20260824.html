gical technique has not yet been established. This network meta-analysis aims to assess and compare postoperative failure and anal incontinence pooled rates for different available surgical techniques for complex cryptoglandular anal fistulas.\n\n**Methods:** Systematic searches were carried out on Pubmed, Ovid, the Cochrane Library database and ClinicalTrials.gov up to June 2023. All randomized comparative trials of nine surgical techniques for cryptoglandular complex perianal fistulas in adult patients were included. A systematic review and network meta-analysis was conducted using the PRISMA-NMA methodology. The endorectal advancement flap was used as the control technique, and the odds ratios (ORs) were calculated through pairwise and network meta-analysis with random effects.\n\n**Results:** 16 randomized trials were included in this study. Network meta-analysis was conducted for each outcome. Techniques, such as cutting seton, fistulotomy with sphincter reconstruction, LIFT, and VAAFT, obtained similar results in terms of technique failure to the transanal advancement flap with no statistically significant differences. PLUG (OR = 3.6 [95%CI 1.1-11.5]), fibrin glue (OR = 7.5 [95%CI 2.2-25], and platelet-rich plasma (PRP) (OR = 11.5[95%CI 1.3-99]) demonstrated a statistically significant increase in the pooled failure rate. For anal incontinence, only the cutting seton technique exhibited a higher risk of postoperative incontinence (OR = 8.6 [95%CI 1-72.5]).\n\n**Conclusion:** Our research highlights effective therapeutic approaches for complex anal fistulas, stressing the need to customize treatment based on location, anatomy, patient characteristics, and preferences. However, it advises against using plugs, fibrin glue, PRP therapy due to lower healing rates, and the seton technique because of its potential impact on anal continence. PROSPERO number CRD42022304345.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal incontinence, Complex anal fistula, Network meta-analysis, Persistence, Recurrence, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40442569/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 29 May 2025"}, {"id": "40392371", "title_en": "Failure rates and complications of four sphincter-sparing techniques for the treatment of fistula-in-ano: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "G Pellino", "abstract_en": "**Background:** Several techniques are available to reduce the risk of sphincter injury when treating anal fistula, such as ligation of the intersphincteric fistula tract (LIFT), video-assisted anal fistula treatment (VAAFT), fistula laser closure (FiLaC) and endoanal flap (EAF). The aim of this meta-analysis is to provide data on the safety, complications and failure of these techniques.\n\n**Methods:** Studies published after 2017, with patients undergoing at least one among LIFT, VAAFT, FiLaC and EAF for perianal fistula and providing data regarding failure, were retrieved from PubMed and EMBASE. Primary outcome was failure; other outcomes included continence disturbance and complications.\n\n**Results:** Forty-nine articles with 3520 patients were included. The failure rates were 28.6% (range 3.8-75) for LIFT, 22.3% (6.2-65.2) for VAAFT, 43.9% (11.1-80) for FiLaC and 25.9% (4.7-100) for EAF, with a mean follow-up of 35.4 (6-80.4), 32.4 (6-48), 31.6(6.3-60) and 42.4 (12-155) months. The available network meta-analysis on failure showed RD of -0.08 (95% CI - 0.58 to 0.42) comparing LIFT vs VAAFT and 0.30 (95% CI 0.03 to 0.58) comparing LIFT vs EAF. No patients undergoing VAAFT or FiLaC reported worsening continence, while for LIFT and EAF, the continence disturbance rate was 1.5% and 7.3%, respectively. No major complications were observed. The most common minor complications were pain (1.4%), bleeding (1.1%) and wound infection (1.2%). Overall, minor complication rates were 4.3% for LIFT, 7.2% for VAAFT, 10.2% for FiLaC and 6.2% for EAF. Crohn's disease was associated with a higher failure rate (39.5% vs 31.4%).\n\n**Conclusions:** FiLaC, VAAFT, LIFT and EAF may represent a valid option in the treatment of anal fistula. VAAFT showed the lowest rate of failure but with no differences from network metanalysis. Wider homogeneous studies with long-term follow-up are necessary to obtain more robust data.\n\n**Prospero Number:** CRD42022375600.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Prospero number：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Complications, Endoanal flap, FILAC, LIFT, Recurrence, VAAFT", "link": "https://pubmed.ncbi.nlm.nih.gov/40392371/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Tue, 20 May 2025"}, {"id": "40353830", "title_en": "Early Resuturing versus expectant Management for Perineal Wound Dehiscence: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Debjyoti Karmakar", "abstract_en": "**Background And Objective:** Perineal wound dehiscence is a common complication of vaginal birth that impacts maternal well-being and quality of life. This systematic review compares early resuturing with expectant management in the treatment of perineal wound dehiscence.\n\n**Methods:** We searched Ovid MEDLINE, CINAHL, and PubMed databases, and hand-searched recent reviews and relevant studies. Human prospective and retrospective studies, randomized controlled trials (RCTs), and case series evaluating early resuturing within the postnatal period were included. Two reviewers independently assessed the studies for outcomes and risk of bias. The primary outcome was healing time; secondary outcomes included dyspareunia, long-term symptoms, functional outcomes, infection rates, and anal sphincter injury.\n\n**Results:** Thirteen studies (1987-2022) were included: three RCTs, four prospective cohort studies or case series, and six retrospective studies-heterogeneity in study designs and outcomes limited data synthesis. Early resuturing was associated with reduced healing time, particularly for wounds not involving the anal sphincter, but increased the risk of complications such as fistula formation. Many studies emphasized meticulous preoperative wound care.\n\n**Conclusions:** Limited evidence suggests that early resuturing may reduce healing time without increasing wound infection risk. However, the increased risk of complications necessitates cautious application and highlights the importance of preoperative wound care. Further robust research is needed, although challenging to conduct. Alternative analytical methods, such as data mining and decision tree algorithms, should be explored. Based on current evidence, clinicians should carefully individualize recommendations on the benefits and risks of early resuturing.", "abstract_zh": "**Background and objective：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们检索了 Ovid MEDLINE、CINAHL 和 PubMed 数据库，并手动检索了最近的评论和相关研究。包括人类前瞻性和回顾性研究、随机对照试验（RCT）以及评估产后早期再缝合的病例系列。两名评审员独立评估了研究的结果和偏倚风险。主要结果是愈合时间；次要结局包括性交困难、长期症状、功能结局、感染率和肛门括约肌损伤。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "early resuturing, perineal dehiscence, perineal wound breakdown, postpartum", "link": "https://pubmed.ncbi.nlm.nih.gov/40353830/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 12 May 2025"}, {"id": "40325545", "title_en": "The Current Applications in Surgery of Three-Dimensional Modelling Technology for Complex Fistula-In-Ano: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Roland Shannon", "abstract_en": "**Background:** Complex fistula-in-ano (FIA) poses significant clinical challenges due to its intricate anatomy and high recurrence rates. Traditional imaging techniques like MRI are limited by their two-dimensional (2D) nature, prompting the use of three-dimensional (3D) modeling for enhanced visualization.\n\n**Methods:** This systematic review, adhering to PRISMA guidelines, analysed 17 studies using 3D models for surgical planning, education, and patient engagement in managing complex FIA. A risk of bias assessment was conducted using the Cochrane Risk of Bias Tool for randomized studies and ROBINS-I for non-randomized studies, revealing that all included studies had at least a moderate risk of bias.\n\n**Results:** Three-dimensional models improved anatomical visualization compared to 2D MRI, potentially enhancing surgical planning accuracy and reducing recurrence rates. They also offered educational benefits for surgeons and patients. However, the evidence is limited by methodological weaknesses such as small sample sizes and subjective outcome measures.\n\n**Conclusion:** Three-dimensional modelling technology shows promise in improving surgical precision and patient outcomes for complex FIA, but further high-quality research is needed to validate its clinical utility due to methodological weaknesses in current studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "fistula‐in‐ano, patient education, surgical education, surgical planning, three‐dimensional modelling", "link": "https://pubmed.ncbi.nlm.nih.gov/40325545/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Tue, 06 May 2025"}, {"id": "40315877", "title_en": "Isolated perianal Crohn's disease: a systematic review and expert consensus proposing novel diagnostic criteria and management advice", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "TOpClass Collaborators", "abstract_en": "Perianal fistulae can present a diagnostic challenge when distinguishing perianal Crohn's disease from idiopathic perianal fistulae. This distinction is key, as perianal Crohn's disease requires inflammatory bowel disease (IBD) therapy, whereas idiopathic perianal fistulae are primarily managed surgically. When luminal inflammation is absent, but Crohn's disease is suspected, the term isolated perianal Crohn's disease is sometimes applied. However, no formal guidance exists for diagnosing or managing isolated perianal Crohn's disease. Furthermore, whereas fistula granuloma might provide specific evidence of Crohn's disease, they are rarely detected in perianal fistulae, so are unlikely to sensitively delineate aetiology. This project aimed to develop an opinion-based framework for isolated perianal Crohn's disease. A systematic review evaluated clinical features suggestive of isolated perianal Crohn's disease and evidence for IBD therapies in patients with perianal fistulae without luminal IBD. The findings of this systematic review informed a multidisciplinary consensus process with IBD specialists, resulting in the formulation of diagnostic criteria and management recommendations for isolated perianal Crohn's disease. We then tested this diagnostic approach in a prospective cohort of 50 patients treated as having idiopathic perianal fistulae at a proctology referral centre, identifying six (12%) individuals as meeting the diagnostic criteria. Our findings underscore the scarcity of evidence guiding isolated perianal Crohn's disease diagnosis and the need for a composite risk-based assessment. The proposed framework provides a tool for clinical practice and research but requires validation and refinement. Clear communication with patients is essential, given the diagnostic and therapeutic uncertainties. Future studies should refine these criteria, explore biological markers for isolated perianal Crohn's disease, and establish evidence-based methods to differentiate isolated perianal Crohn's disease within the perianal fistulae spectrum.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40315877/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 02 May 2025"}, {"id": "40269939", "title_en": "Fish bone migration: complications, diagnostic challenges, and treatment strategies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jichuan Chen", "abstract_en": "**Background:** Fish bone impaction in the pharynx is a common otolaryngological emergency. However, if the fish bone perforates the pharyngeal wall or the gastrointestinal wall and migrates to the neck tissues or organs, entering the lungs, mediastinum, heart, liver, biliary tract, spleen, pancreas, or other structures, or damages major blood vessels in the thoracic or abdominal cavities, it can lead to severe complications. This condition is rare and dangerous, potentially resulting in a series of serious complications, including neck abscess, thyroid abscess, thrombosis or air embolism of the cervical vessels, esophageal perforation, rupture of major mediastinal vessels, mediastinitis, aorto-esophageal fistula, lung abscess, spinal injury, sepsis, splenic abscess, hepatic abscess, anal fistula, and it may even be misdiagnosed as a tumor.\n\n**Objective:** This narrative review synthesizes evidence on fish bone translocation complications to (1) identify high-risk clinical presentations, (2) guide site-specific imaging selection, and (3) inform multidisciplinary management strategies.\n\n**Methods:** Use the keyword \"fishbone\" to systematically search articles from PubMed、CNKI and Embase databases from 1972 to 2024. Review all original articles and include them in this review where appropriate. This narrative review synthesizes evidence from case reports and observational studies to explore complications and management of fish bone translocation in uncommon sites. Given the predominance of heterogeneous case reports, a formal systematic review with meta-analysis was not feasible; however, we employed systematic search strategies to minimize selection bias.\n\n**Conclusion:** To avoid severe complications, it is crucial to provide comprehensive information on the management of fish bone impaction. When fish bone removal cannot be achieved using laryngoscopy, prompt and decisive surgical intervention is required to extract the foreign body.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complications, Fishbone, Gastrointestinal foreign body, Pharyngeal foreign body", "link": "https://pubmed.ncbi.nlm.nih.gov/40269939/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 24 Apr 2025"}, {"id": "40210078", "title_en": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "TOpClass collaborative authors", "abstract_en": "**Background & Aims:** Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\n**Methods:** The study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\n**Results:** A radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\n**Conclusions:** This international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "abstract_zh": "**Background & aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40210078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 10 Apr 2025"}, {"id": "40205247", "title_en": "Systematic review and meta-analysis of the efficacy and safety of stem cell treatment of anal fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "S D Wexner", "abstract_en": "**Background:** Since anal fistulas can be challenging to treat; numerous innovative treatments have been proposed, including stem cell therapy. This systematic review aimed to assess pooled rates of fistula healing and adverse events associated with stem cell treatment.\n\n**Methods:** In this PRISMA-compliant systematic review we searched PubMed and Scopus for observational and randomized studies reporting outcomes of stem cell treatment for anal fistulas. The main outcome measures were successful healing and adverse effects of stem cell therapy.\n\n**Results:** In total, 43 studies incorporating 1160 patients (53.6% male) were included. Underlying fistula etiologies were Crohn's disease (30 studies) and cryptoglandular disease (12 studies). The main origin of stem cells was from adipose tissue (34 studies) or bone marrow (6 studies). The median follow-up duration was 12 months. The combined overall pooled healing rate was 58.1% (95% confidence interval (CI) 51.5-64.7%). The pooled healing rate for Crohn's fistulas was 60.4% (95% CI 54.7-66.2%) with adipose-derived stem cells and 63.6% (95% CI 49.4-77.7%) with bone-marrow-derived cells. The pooled healing rate for cryptoglandular fistulas was 53.8% (95% CI 35.5-72.2%) with adipose-derived stem cells. The pooled complication rate was 37.3% (95% CI 27.1-47.5%). Stem cells were associated with higher odds of anal fistula healing (odds ratio (OR): 1.81, p = 0.003) and similar odds of complications (OR: 1, p = 0.986) compared with controls.\n\n**Conclusions:** Stem cell treatment of anal fistulas was associated with promising results. The healing rate in Crohn's anal fistulas was higher than in cryptoglandular fistulas. Bone-marrow-derived stem cells were associated with marginally better outcomes than were adipose-derived cells. This finding suggests that the autoimmune inflammatory etiology of Crohn's disease may respond better to autologous myoblasts than does the infectious etiology of cryptoglandular fistulas.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法  treatment mentioned in the selected articles.\n\n**Results:** The quantitative synthesis included 32 studies (18 retrospective and 14 prospective) accounting for 595 patients. The quality of these studies was low because of the lack of prospective randomization. Nineteen procedure types were described and assessed. Most patients (n = 180) underwent endorectal advancement flap (ERAF) followed by excision and layered closure (ELC) (n = 213) and Musset procedure (n = 65). A diverting stoma was performed in 66/132 patients. Only 13 studies reported the functional results of the procedure. In the meta-analysis, the Musset procedure (OR = 4.29; 95% CI: 1.18-16.14), transvaginal ELC (OR = 11.84; 95% CI: 2.18-91.80) and transperineal ELC (OR = 3.56; 95% CI: 1.26-10) significantly improved the anatomical results compared to ERAF.\n\n**Conclusions:** A further randomized controlled trial in the literature assessing ERAF and sphincteroplasty to compare the anatomical results, functional results and morbidity of this treatment is needed.\n\n**Registration:** PROSPERO CRD42023447875.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anovaginal fistula, Obstetric, Rectovaginal fistula, Repair", "link": "https://pubmed.ncbi.nlm.nih.gov/40192869/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 07 Apr 2025"}, {"id": "40185644", "title_en": "Oncological and functional outcomes after sacrectomy for colorectal cancer: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gabriëlle H van Ramshorst", "abstract_en": "**Aim:** Worldwide, of all cancers, colorectal cancer has the fourth highest rate of mortality. Curative treatment for locally advanced or recurrent rectal cancer can require extended resections with sacrectomy, but this sugery can have major consequences for patients. The aim of this study was to investigate the oncological and functional outcomes after sacrectomy in patients with colorectal cancer.\n\n**Method:** The protocol was registered in (PROSPERO), the international prospective register of systematic reviews. PubMed, Embase, The Cochrane Library, Scopus and Google Scholar were searched using a predetermined search strategy. Article selection, quality of evidence [Grading of Recommendation, Assessment, Development and Evaluation (GRADE)] and risk of bias [The Risk Of Bias In Non-randomized Studies-of Interventions (ROBINS-I)] were assessed by two independent reviewers. Studies reporting on sacrectomy for colorectal cancer were included. Oncological and functional outcomes after sacrectomy for colorectal cancer were the primary outcomes.\n\n**Results:** Forty-six articles with 1687 patients (1115 men; 506 women) were included. Median follow-up was 31.4 months. Mean 30-day mortality was 1.1%. After R0 resection, overall survival was achieved in 86.2%, 68.0% and 42.1% patients, and disease-free survival was achieved in 75.0%, 51.0% and 43.0% patients, respectively, after 1, 3 and 5 years. Survival rates were lower after R1 or R2 resection. Most patients reported elimination of or significantly reduced pain after surgery, and 82.2% were able to walk independently, without the use of assistive devices. More patients were dependent on walking-assist devices after high sacrectomy than after low sacrectomy. The most commonly reported bowel dysfunctions were bowel obstruction (22.3%) and fistula (4.6%). Bladder dysfunction was mainly reported as incontinence (8.3%) and neurogenic bladder (23.3%). No study included quality of life as an outcome.\n\n**Conclusions:** The mortality was limited, and the morbidity rates were in concordance with published literature. The results suggest that R0 resection has higher survival rates than R1/R2 resections. Both short- and long-term functional outcomes could have major impact on a patient's quality of life. Heterogeneity was high, and neither comparative analyses nor meta-analysis could be performed.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, functional outcomes, oncological outcomes, sacrectomy", "link": "https://pubmed.ncbi.nlm.nih.gov/40185644/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 04 Apr 2025"}, {"id": "40156066", "title_en": "Efficacy of mesenchymal stem cell-based therapies in the treatment of perianal fistulizing Crohn's disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jérémy Magalon", "abstract_en": "**Background:** Perianal lesions of Crohn's disease (CD) are complex and disabling conditions. Mesenchymal stem cell (MSC)-based therapies have emerged as an innovative approach in managing refractory perianal fistulizing CD. We conducted a systematic review and meta-analysis to describe and compare combined remission and clinical outcomes of MSC-based therapies, and then whether one approach stands out from the rest.\n\n**Methods:** We searched in MEDLINE, EMBASE and CENTRAL (up to December 31, 2023) all prospective studies assessing a local injection of MSC-based therapy in perianal fistulas of CD. The primary outcome was achievement of combined remission. MSC-based therapy strategies were compared.\n\n**Results:** Twenty-five studies were included in the meta-analysis, enrolling 596 patients with perianal fistulizing CD. The combined remission rate at 3, 6 and 12 months were 36.2% (95% confidence interval (CI), 24.5-49.7), 57.9% (95% CI 51.3-64.2) and 52% (95% CI 38.8-64.8), respectively. MSC-based therapies demonstrated a significant effect in achieving combined remission compared to placebo at 3 months (relative risk (RR) = 1.6; 95% CI 1.0-2.8) and at 6 months (RR = 1.5; 95% CI 1.1-1.9). At 6 months, the combined remission rate was 57.2% (95% CI 47.2-66.6) for adipose-derived stem cells (ASCs) and 55.7% (95% CI 26.4-81.5) for bone marrow-derived stem cells (BMSCs). In the network meta-analysis, allogeneic ASCs and BMSCs did not demonstrate superiority over each other (RR = 0.74; 95% CI 0.31-1.77).\n\n**Conclusion:** MSC-based therapies are effective for achieving combined remission of refractory and/or complex perianal fistulizing CD. The optimal efficacy effect is reached after 6 months of treatment. No superiority has yet been demonstrated between ASCs and BMSCs therapies.", "abstr y period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\n**Results:** The systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\n**Conclusions:** The perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40155532/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "40125894", "title_en": "Fistulotomy versus fistulectomy for simple fistula-in-ano: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Rebecca J Lendzion", "abstract_en": "**Background:** Perianal fistulas are a common anorectal pathology. The sphincter-cutting techniques of fistulectomy and fistulotomy are associated with high cure rates for low or simple fistula-in-ano, with negligible risk of incontinence. However, the superiority of either technique has not previously been conclusively demonstrated. The aim of this systematic review is to compare the outcomes of the two surgical techniques for the management of simple fistula-in-ano.\n\n**Methods:** A search of MEDLINE, EMBASE and Cochrane Databases for randomized controlled trials (RCT) comparing fistulotomy to fistulectomy for simple fistula-in-ano was conducted. The primary outcome was healing time; secondary outcomes included operative time, length of hospital stay, post-operative pain score, post-operative complications and fistula recurrence.\n\n**Results:** Thirteen RCTs meet inclusion criteria, comprising a total of 685 fistulectomy and 688 fistulotomy patients. There was no significant difference between the techniques for healing time (P = 0.15), operative time (P = 0.13), length of stay (P = 0.05), wound infection (P = 0.97), flatus or faecal incontinence (P = 0.35 and P = 0.70, respectively) or recurrence (P = 0.19). Post-operative pain at 24 h, assessed using a visual analogue scale, was significantly lower in the fistulectomy group (MD-0.49, 95% CI: -0.90, -0.08; P = 0.02), and we found significantly fewer post-operative bleeding complications in the fistulotomy group (OR: 3.81, 95% CI: 1.23, 11.80; P = 0.02).\n\n**Conclusion:** This systematic review did not find conclusive evidence of the superiority of either fistulectomy or fistulotomy in terms of healing time. The two statistically significant findings were lower post-operative pain scores with fistulectomy and reduced post-operative bleeding with fistulotomy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "肛瘘, 瘘管切除术, 瘘管切开术, 随机对照试验", "keywords_en": "anal fistula, fistulectomy, fistulotomy, randomized controlled trials", "link": "https://pubmed.ncbi.nlm.nih.gov/40125894/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 24 Mar 2025"}, {"id": "40024986", "title_en": "A systematic review of outcome measurement instruments used in pouch anal and vaginal fistulae: a COSMIN-based analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Phil Tozer", "abstract_en": "**Purpose:** Pouch-related fistulae are devastating complications of ileoanal pouch surgery, which is performed to improve the quality of life (QoL) for patients who have had a proctocolectomy. Their management is limited by inconsistent evidence, including using poorly and heterogeneously defined outcomes. This study aims to identify all Outcome Measurement Instruments (OMIs) used in pouch fistula research, including Patient-Reported Outcome Measures (PROMs) and Clinician-Reported Outcome Measures (ClinROMs) and evaluate their quality using COSMIN guidelines to help select the best tool for a standardised core outcome measurement set in a future consensus study.\n\n**Methods:** A systematic review was conducted to identify all OMIs used in ileo-anal pouch fistulae studies, from MEDLINE, Embase, and the Cochrane Library. We evaluated existing OMIs based on COSMIN guidelines and used the GRADE approach to assess evidence quality. Results were synthesized narratively.\n\n**Results:** Among 91 studies, 13 OMIs were reviewed. Pouch-specific instruments performed poorly in key domains of reliability, validity, and responsiveness. Only 17.6% of studies assessed QoL using PROMs. The best-performing instruments were the SF-36 and IBDQ. The Ileoanal Pouch Syndrome Severity Score was the only pouch-specific instrument that involved patients in its development and although useful for pouch dysfunction, it lacks specific QoL assessment and was not validated in pouch-fistulae patients.\n\n**Conclusion:** Existing OMIs for pouch-related fistulae lack adequate measurement properties, with no PROMs specifically validated for QoL in this population and very few instruments involving patients in their development. There is an unmet need for a validated PROM specifically for QoL in pouch-related fistulae.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "COSMIN, Patient reported outcome measures, Pouch Fistula, Pouch anal fistula, Pouch vaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40024986/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Sun, 02 Mar 2025"}, {"id": "39946821", "title_en": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "G S Octavius", "abstract_en": "**Introduction:** This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\n**Methods:** The protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\n**Results:** Of 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\n**Conclusion:** ADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\n**Implications For Practice:** T2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在该评价纳入的 21 项研究中，有 12 项进行了荟萃分析，涉及 1007 名患者（77.5% 男性），有 1092 个瘘管和 321 个脓肿。六项研究报告了活动性瘘管与非活动性瘘管的 ADC 值，汇总敏感性为 83% (95%CI 68-92)，特异性为 75% (95%CI 60-85)，AUC 为 0.85 (95%CI 0.81-0.87)。汇集的 ADC 截止范围为 1.105 至 1.109 × 10⁻3 mm<sup>2</sup>/s。 T2WI + DWI 序列显示出最高的诊断准确性，汇总敏感性为 99% (95%CI 90-100)，特异性为 97% (95%CI 79-100)，AUC 为 1。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Implications for practice：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39946821/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 13 Feb 2025"}, {"id": "39876853", "title_en": "Rectovaginal Fistula Repair Following Vaginoplasty in Transgender Females: A Systematic Review of Surgical Techniques", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gabriel A Del Corral", "abstract_en": "<b>Background:</b> Rectovaginal fistula (RVF) remains a complex complication following gender-affirming vaginoplasty. This review aims to evaluate RVF repair techniques and outcomes following vaginoplasty. <b>Methods:</b> A systematic review was performed per PRISMA guidelines. Ovid MEDLINE, Ovid EMBASE, Cochrane, and Web of Science were queried for records pertaining to RVF repair following vaginoplasty. Study characteristics, operative details, and demographics were collected. Outcomes included RVF repair method, recurrence rate, and complications. <b>Results:</b> Among 282 screened citations, 17 articles representing 41 patients were included. Rectovaginal fistula repair methods identified included 4 conservative management approaches (n = 12 patients), primary closure with or without fistulectomy and ostomy (n = 22), 10 reconstructive surgical techniques (n = 18). The most common reconstructive techniques were V-Y full-thickness advancement with rectal flap (n = 5) and infragluteal fasciocutaneous flap (n = 4). Median time to recurrence was 6 months (interquartile range 7.5). Reported RVF repair complications included RVF recurrence (n = 5, 14.7%) and wound complication or dehiscence (n = 2, 5.88%). Three cases of RVF recurred after primary closure with or without fistulectomy and ostomy, while 2 cases of recurrence followed reconstruction. <b>Conclusion:</b> There remains a high level of variability in the approach to RVF repair following vaginoplasty. Reconstructive surgical techniques may be a more optimal solution without necessitating ostomies, but this decision must be considered in the context of RVF location, individual patient expectations, and clinical presentation.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "neovagina, rectovaginal fistula, surgical technique, transgender, vaginoplasty", "link": "https://pubmed.ncbi.nlm.nih.gov/39876853/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 29 Jan 2025"}, {"id": "39833536", "title_en": "Fistulae Secondary to Vaginal Pessary Use for Pelvic Organ Prolapse: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Thomas Giles Gray", "abstract_en": "**Introduction And Hypothesis:** Urogenital and rectovaginal fistulae are rare complications of pessary use for pelvic organ prolapse (POP). This systematic review investigates the prevalence of these complications in patients using pessary for POP, potential risk factors and approaches to their investigation and management.\n\n**Methods:** All studies in English reporting urogenital or rectovaginal fistulae secondary to pessaries for POP were eligible for inclusion. AMED, CINAHL, MedLine, Scopus and Web of Science databases were searched from inception to March 2024. Risk of bias was assessed using validated tools: Murad et al.'s tool for case series/reports and ROBINS-I for non-randomised studies. Quantitative synthesis of descriptive statistics and narrative summary were performed.\n\n**Results:** Two retrospective studies and 60 case series/reports were included, describing 76 fistulae (34 urogenital, 42 rectovaginal). The retrospective studies estimated the prevalence of fistulae to be 3%. Of reported fistulae, 45% occurred with Gellhorn, 16% with ring, 11% with shelf and 9% with cube pessaries. Fifty percent were associated with neglected pessary care. Conservative management resulted in size reduction or resolution in 69% of fistulae: this approach should be considered. Vaginal (88%) and abdominal (100%) vesicovaginal fistula repairs were successful. Diverting ostomies were popular for rectovaginal fistulae but often resulted in permanent stoma without reducing mortality, recurrence or repair failure. Colpocleisis represents an effective procedure for managing co-existing POP.\n\n**Conclusions:** The prevalence of fistulae from pessary use is likely < 1% but may rise to 3% with risk factors present, including Gellhorn pessaries and neglected care. Both conservative and surgical management are viable treatment options.", "abstract_zh": "**Introduction and hypothesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Pelvic organ prolapse, Pessaries, Rectovaginal fistula, Systematic review, Vesicovaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39833536/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 20 Jan 2025"}, {"id": "39623055", "title_en": "Salvage irreversible electroporation for locally recurrent prostate cancer after definitive radiotherapy: a systematic review", "title_zh": "Error 500 (Server Error)!  was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39360706", "title_en": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Darvadstrocel 治疗克罗恩病复杂肛周瘘：系统评价和荟萃分析", "authors": "Cristina Alba", "abstract_en": "**Background:** Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\n**Objective:** This study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\n**Methods:** A systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\n**Results:** Twelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\n**Conclusion:** Evidence from observational studies supports la and abscess recurrence, whereas others describe its economic burden and increase in pain. In this systematic review, we examine current evidence on the impact of packing after incision and drainage for anorectal abscesses.\n\n**Methods:** The medical librarian conducted a comprehensive literature search on January 5, 2023. We conducted the meta-analysis using RevMan 5.4.1 software with a Mantel-Haenszel random-effects model.\n\n**Results:** We identified 3 randomized controlled trials, comprising 490 patients. Of those, 241 patients (49%) received postoperative packing; most patients were male (<i>n</i> = 158, 65.6%), with a median age of 40.5 years and a follow-up of 6 months. Meta-analysis showed that prolonged wound packing was associated with delayed wound healing and increased pain, but no difference in abscess recurrence or fistula formation.\n\n**Conclusion:** In this systematic review of current evidence highlighting the impact of packing after incision and drainage for anorectal abscesses, we found that the practice is not associated with significant differences in abscess recurrence and fistula formation, but is associated with increased postoperative pain and delayed wound healing.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39332832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 27 Sep 2024"}, {"id": "39298676", "title_en": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Phillip Fleshner", "abstract_en": "**Background:** Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\n**Results:** Overall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\n**Conclusions:** Optimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn’s disease, perianal fistula, seton", "link": "https://pubmed.ncbi.nlm.nih.gov/39298676/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 19 Sep 2024"}, {"id": "39186335", "title_en": "Efficacy and Safety of Endorectal Advancement Flap for the Treatment of Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wencong Xu", "abstract_en": "**Aim:** Complex anal fistula poses a significant challenge for anorectal surgeons due to its high risks of recurrence and incontinence. A sphincter-preserving procedure named endorectal advancement flap (ERAF) is gradually being applied to clinical practice. Therefore, this meta-analysis aims to evaluate the efficacy and safety of ERAF in managing anal fistula.\n\n**Methods:** We searched PubMed, Embase, Cochrane, and Web of Science databases for relevant manuscripts published from 29 August 2003 to 29 August 2023. Among these studies, outcomes included healing rate, recurrence rate, incontinence rate, and complications. Furthermore, the quality of the included studies was assessed using the Newcastle-Ottawa Scale (NOS) and the Cochrane risk-of-bias tool. The heterogeneity was determined using the chi-squared test and I2 statistic. A random effects model was applied if significant heterogeneity (p < 0.05 and I2 > 50%) was observed. Sensitivity analysis was conducted by excluding studies with a high risk of bias.\n\n**Results:** Thirty-eight studies were included in the present analysis, involving 1559 participants. The pooled healing rate and recurrence rate of ERAF were 65.5% (95% confidence intervals (CI): 57.6%-73.4%) and 19.6% (95% CI: 14.8%-24.4%), respectively. The pooled incontinence rate was 10.6% (95% CI: 6.0%-15.1%). According to the subgroup analysis, the healing rate, recurrence rate, and incontinence rate of ERAF for fistula associated with inflammatory bowel disease (IBD) were 53.9% (95% CI: 38.1%-69.7%), 32.6% (95% CI: 21.3%-43.8%), and 2.8% (95% CI: 0%-10.6%), respectively. For patients without IBD, the healing rate, recurrence rate, and incontinence rate of ERAF were 70.6% (95% CI: 63.9%-77.4%), 15.7% (95% CI: 9.9%-21.5%), and 16.5% (95% CI: 8.1%-24.9%), respectively. We observed that bleeding, local infection or abscess, flap dehiscence, and haematomas were the common complications, with incidences of 2.2% (95% CI: 0%-4.5%), 9.5% (95% CI: 4.7%-14.4%), 10.4% (95% CI: 0.0%-21.6%), and 12.4% (95% CI: 0%-27.6%), respectively.\n\n**Conclusions:** ERAF may be an optional treatment for anal fistula from the perspective of effectiveness and safety.\n\n**Systematic Review Registration:** PROSPERO: CRD42023451451.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later. cording to the criteria, Meta-analysis was carried out with RevMan 5.4 software.\n\n**Results:** A total of 11 studies were included, including 1216 patients. Meta-analysis showed that, compared with parenteral nutrition, mixed nutrition can improve the levels of transferrin, serum albumin, prealbumin and lymphocyte counts in patients with esophageal cancer after surgery, shorten the time of anal recovery of exhaust, defecation and hospital stay after surgery, and reduce the incidence of pulmonary infection, abdominal distension, incision infection and anastomotic fistula, with statistical significance between the two groups (<i>P</i> < 0.05). The heterogeneity of individual results in this study is relatively high, the analysis comes from clinical heterogeneity, and the publication bias is analyzed through Funnel plot. Taking the incidence of lung infection as an example, the results are evenly distributed on both sides of the Funnel plot, and the publication bias has little impact on the results of the study.\n\n**Conclusion:** Compared with parenteral nutrition, mixed nutrition can improve the prognosis of postoperative patients with esophageal cancer and reduce the incidence of related adverse events.", "abstract_zh": "**目的：** 本研究旨在评价混合营养与肠外营养支持对食管癌术后患者的临床效果。\n\n**Method：** 通过检索PubMed、Web of Science、Cochrane、CNKI、万方等数据库，筛选截至2024年3月关于食管癌术后患者混合营养与肠外营养支持随机对照试验（RCT）比较的文献。纳入标准为患者来自中国的随机对照试验或临床试验，且患者均经病理活检确诊为食管癌。排除标准为上述以外的文献，包括重复发表的文献、非中英文文献、分析数据不完整或缺失等。两名研究者根据标准独立筛选文献、提取数据并评估偏倚风险后，采用RevMan 5.4软件进行Meta分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "efficacy and safety, meta-analysis, mixed nutrition, parenteral nutrition, postoper (AI) in tackling the difficulties of managing benign anorectal disorders and pelvic floor disorders.\n\n**Methods:** A systematic literature review was performed according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. We searched the PubMed database to identify all potentially relevant studies published from January 2000 to August 2023. Search queries were built using the following terms: AI, machine learning, deep learning, benign anorectal disease, pelvic floor disorder, fecal incontinence, obstructive defecation, anal fistula, rectal prolapse, and anorectal manometry. Malignant anorectal articles and abstracts were excluded. Data from selected articles were analyzed.\n\n**Results:** 139 articles were found, 15 of which met our inclusion and exclusion criteria. The most common AI module was convolutional neural network. researchers were able to develop AI modules to optimize imaging studies for pelvis, fistula, and abscess anatomy, facilitated anorectal manometry interpretation, and improved high-definition anoscope use. None of the modules were validated in an external cohort.\n\n**Conclusion:** There is potential for AI to enhance the management of pelvic floor and benign anorectal diseases. Ongoing research necessitates the use of multidisciplinary approaches and collaboration between physicians and AI programmers to tackle pressing challenges.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal disease, Artificial intelligence, Deep learning, Pelvic floor disorder", "link": "https://pubmed.ncbi.nlm.nih.gov/38910957/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Mon, 24 Jun 2024"}, {"id": "38871152", "title_en": "Perianal Fistulizing Crohn's Disease-Associated Anorectal and Fistula Cancers: Systematic Review and Expert Consensus", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jean-Frederic Colombel", "abstract_en": "**Background & Aims:** Perianal fistulizing Crohn's disease (PFCD)-associated anorectal and fistula cancers are rare but often devastating diagnoses. However, given the low incidence and consequent lack of data and clinical trials in the field, there is little to no guidance on screening and management of these cancers. To inform clinical practice, we developed consensus guidelines on PFCD-associated anorectal and fistula cancers by multidisciplinary experts from the international TOpClass consortium.\n\n**Methods:** We conducted a systematic review by standard methodology, using the Newcastle-Ottawa Scale quality assessment tool. We subsequently developed consensus statements using a Delphi consensus approach.\n\n**Results:** Of 561 articles identified, 110 were eligible, and 76 articles were included. The overall quality of evidence was low. The TOpClass consortium reached consensus on 6 structured statements addressing screening, risk assessment, and management of PFCD-associated anorectal and fistula cancers. Patients with long-standing (>10 years) PFCD should be considered at small but increased risk of developing perianal cancer, including squamous cell carcinoma of the anus and anorectal carcinoma. Risk factors for squamous cell carcinoma of the anus, notably human papilloma virus, should be considered. New, refractory, or progressive perianal symptoms should prompt evaluation for fistula cancer. There was no consensus on timing or frequency of screening in patients with asymptomatic perianal fistula. Multiple modalities may be required for diagnosis, including an examination under anesthesia with biopsy. Multidisciplinary team efforts were deemed central to the management of fistula cancers.\n\n**Conclusions:** Inflammatory bowel disease clinicians should be aware of the risk of PFCD-associated anorectal and fistula cancers in all patients with PFCD. The TOpClass consortium consensus statements outlined herein offer guidance in managing this challenging scenario.", "abstract_zh": "**Background & aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal Cancer, Inflammatory Bowel Disease, Perianal Fistulizing Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/38871152/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 13 Jun 2024"}, {"id": "38491943", "title_en": "Does Combined Medical and Surgical Treatment Improve Perianal Fistula Outcomes in Patients With Crohn's Disease? A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** The optimal treatment of perianal fistulizing Crohn's disease [PFCD] is unknown. We performed a systematic review with meta-analysis to compare combined surgical intervention and anti-tumour necrosis factor [anti-TNF] therapy [combined therapy] vs either therapy alone.\n\n**Methods:** MEDLINE, EMBASE, and Cochrane databases were searched systematically up to end December 2023. Surgical intervention was defined as an exam under anaesthesia ± setons. We calculated weighted risk ratios [RRs] with 95% confidence intervals [CIs] for our co-primary outcomes: fistula response and healing, defined clinically as a reduction in fistula drainage or number of draining fistulas and fistula closure respectively.\n\n**Results:** Thirteen studies were analysed: 515 patients treated with combined therapy, 330 patients with surgical intervention, and 406 patients with anti-TNF therapy with follow-up between 10 weeks and 3 years. Fistula response [RR 1.10; 95% CI 0.93-1.30, p = 0.28] and healing [RR 1.06; 95% CI 0.86-1.31, p = 0.58] was not significantly different when comparing combined therapy with anti-TNF therapy alone. In contrast, combined therapy was associated with significantly higher rates of fistula response [RR 1.25; 95% CI 1.10-1.41, p < 0.001] and healing [RR 1.17; 95% CI 1.00-1.36, p = 0.05] compared with surgical intervention alone. Our results remained stable when limiting to studies that assessed outcomes within 1 year and studies where <10% of patients underwent fistula closure procedures.\n\n**Conclusion:** Combined surgery and anti-TNF therapy was not associated with improved PFCD outcomes compared with anti-TNF therapy alone. Due to an inability to control for confounding and small study sizes, future, controlled trials are warranted to confirm these findings.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s
