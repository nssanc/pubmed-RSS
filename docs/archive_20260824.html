usion, oral capsules).\n\n**Results:** Sixteen RCTs were included. Overall, FMT improved clinical remission (RR = 1.81, 95% CI: 1.41-2.31; I<sup>2</sup> = 0%) and endoscopic remission (RR = 1.74, 95% CI: 1.00-3.01; I<sup>2</sup> = 45.5%). By route, significant effects were seen for colonoscopy (RR = 1.58, 95% CI 1.05-2.37), rectal enema (RR = 1.62, 95% CI 1.04-2.54) and combined colonoscopy + enema (RR = 2.39, 95% CI 1.47-3.89) for clinical remission; nasoduodenal and oral capsule results were imprecise. For endoscopic remission, the combined route showed the most consistent benefit (RR = 2.19, 95% CI 1.04-4.62). AEs did not differ from control (RR = 1.03, 95% CI 0.90-1.18; I<sup>2</sup> = 11.2%).\n\n**Conclusions:** FMT improves induction-phase clinical and endoscopic remission in patients with UC without increasing AEs. Efficacy appears route-dependent, with colonoscopy + enema demonstrating the largest effect. Head-to-head trials optimizing route and dosing with longer follow-up are warranted.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们系统地检索了 PubMed、Embase、Cochrane Library、Web of Science 和中国知网 (CNKI) 从成立到 2025 年 10 月的随机对照试验 (RCT)，这些试验比较了 UC 患者中供体来源的 FMT 与安慰剂/假手术或自体 FMT 的情况。主要结局是诱导时（8-12 周）的临床和内镜缓解。不良事件（AE）是次要的。随机效应模型生成的风险比 (RR) 的置信区间为 95%。预先指定的亚组分析比较了给药途径（结肠镜检查、直肠灌肠、联合结肠镜检查++灌肠、鼻十二指肠输注、口服胶囊）。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Delivery route, Fecal microbiota transplantation, Meta-analysis, Randomized controlled trial, Ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/41945234/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Tue, 07 Apr 2026"}, {"id": "41931335", "title_en": "Neuroendocrine neoplasms diagnosed in the setting of inflammatory bowel disease: A systematic review and proposed management algorithm", "title_zh": "炎症性肠病中诊断的神经内分泌肿瘤：系统评价和提出的管理算法", "authors": "Nikolaos A Trikalinos", "abstract_en": "**Background:** Patients with inflammatory bowel disease (IBD) are at higher risk of developing malignancies, including neuroendocrine neoplasms, but the specifics of that are not well known. We reviewed the existing literature to map the evidence surrounding this phenomenon.\n\n**Methods:** Following PRISMA 2020 guidelines, we searched PubMed from inception to September 2024 for patients with gastrointestinal neuroendocrine neoplasms (NENs) and either Crohn disease (CD) or ulcerative colitis (UC). Eligible studies included case reports, case series, and larger retrospective IBD cohorts. We extracted demographic and clinical data including tumor grade, location, metastatic status, and mode of detection. Comparative analyses between UC and CD were performed using Fisher exact test, chi-square test, and independent t-tests.\n\n**Results:** We identified 67 case studies with data available for a total of 108 patients (61.1% male), ranging from 14 to 87 years of age. The median duration from IBD diagnosis to NEN detection was 13 years. Fifty-five (50.9%) patients had CD and 53 (49.1%) had UC. UC patients were older at NEN diagnosis (mean 49 vs 40 years, P = .004) and had a higher metastatic rate (39.6% vs 18.2%, P = .019). Most NENs were low-grade (69.4%), while 20.4% were high-grade and 8.3% were mixed. The most common tumor locations were the rectum (29.6%) and appendix (27.8%), with rectal and colonic NENs more prevalent in UC and small bowel or appendiceal NENs more common in CD. At diagnosis, 71.3% of patients had localized disease. For high-grade NENs, 86.4% of cases were metastatic, compared to 9.3% for low-grade tumors. Only 10.2% of NENs were detected via endoscopic surveillance.\n\n**Conclusions:** NENs in IBD show distinct patterns by IBD type, with significant differences in tumor location, grade, and metastatic rates between UC and CD. These hypothesis-generating observations suggest heightened vigilance after approximately 10 years of IBD or around age 44, focusing on rectal lesions in UC and small bowel/appendiceal lesions in CD. Validation in prospective, population-based studies is needed before these findings can inform clinical practice.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn disease, inflammatory bowel disease, neuroendocrine neoplasms, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/41931335/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 03 Apr 2026"}, {"id": "41871586", "title_en": "Indocyanine green fluorescence angiography for anastomotic perfusion assessment in colorectal surgery: a systematic review with meta-analysis, meta-regression, and trial sequential analyses", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ronan A Cahill", "abstract_en": "**Background:** Anastomotic leak is a serious complication in colorectal surgery. Indocyanine green fluorescence angiography (ICGFA) is an adjunctive digital method of assessing bowel perfusion intraoperatively. We assessed whether ICGFA use during surgery reduces postoperative anastomotic leak exclusively using data from randomised controlled trials (RCTs).\n\n**Methods:** In this systematic review and meta-analysis, we searched PubMed, ScienceDirect, Scopus, Web of Science, Embase, and the Cochrane Collaboration databases from inception to July 19, 2025, for English-language RCTs comparing additive intraoperative ICGFA with standard surgeon perfusion assessment alone in patients undergoing colorectal resection with primary anastomosis according to prespecified criteria and PRISMA guidelines. Summary-level data were extracted by two reviewers. The primary outcome was overall anastomotic leak rate. The Jadad scale (Oxford quality scoring system) was used to assess trial quality, the Cochrane Risk of Bias (RoB 2) tool for RCTs was used to assess risk of bias, and GRADE was used to assess strength of evidence. Meta-regression and trial sequential analyses were performed. This study is registered with PROSPERO, CRD420250652639.\n\n**Findings:** 719 records were initially identified, with 387 remaining after screening and 184 sought for full eligibility screening, of which nine were eligible RCTs (with 4754 patients) for analysis. ICGFA significantly reduced overall anastomotic leak (risk ratio 0·66 [95% CI 0·56-0·78], p<0·0001; number needed to treat [NNT]=24), with trial sequential analysis showing that the required information size (2183) was exceeded overall. ICGFA reduced both anastomotic leak requiring intervention (risk ratio 0·73 [95% CI 0·60-0·89], p=0·0020; NNT=39) and anastomotic leak not requiring intervention (0·48 [0·31-0·72], p=0·0004, NNT=35). Significant benefit was observed for left-sided resections (risk ratio 0·62 [95% CI 0·51-0·74], p<0·0001; NNT=19), rectal resections (0·62 [0·51-0·76], p<0·0001; NNT=19), and low anterior resections (0·62 [0·48-0·79], p<0·0001; NNT=13), in which the required information size was also exceeded, but not for right-sided resections. In the meta-regression analysis, among all tested covariates, only patient BMI significantly modified the ICGFA treatment effect, with an increasing protective effect with increasing BMI (coefficient -0·0153 [95% CI -0·0251 to -0·0056], p=0·0020). Evidence was graded as high certainty for overall, left-sided, rectal, asymptomatic, and 30-day anastomotic leaks, and moderate certainty for clinically significant anastomotic leak.\n\n**Interpretation:** Intraoperative use of ICGFA reduces anastomotic leak rates in left-sided and rectal colorectal resections. Given the evidence available now, further general efficacy trials are no longer required and research should shift to implementation and defined targeted subgroup ICGFA role definition (ie, in non-rectal left-sided resections).\n\n**Funding:** None.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Findings：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Interpretation：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Funding：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41871586/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 23 Mar 2026"}, {"id": "41857485", "title_en": "The Clinical Relevance of the Rectosigmoid Brake in Surgical Disorders and Therapies: A Systematic Review of Colonic Manometry Studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gregory O'Grady", "abstract_en": "**Background:** The rectosigmoid brake (RSB) regulates rectal filling via retrograde cyclic motor patterns in the distal colon. Disruption has been linked to postoperative ileus (POI), low anterior resection syndrome (LARS), fecal incontinence (FI), and acute colonic pseudo-obstruction (ACPO). We synthesized manometric evidence to clarify the RSB's clinical relevance.\n\n**Methods:** A systematic search of Ovid MEDLINE and Embase (March 2025) for studies assessing distal colonic motility in adults with surgical or functional colorectal conditions. Thirty-four studies met the inclusion criteria, including nine using high-resolution manometry. Data were qualitatively synthesized by condition.\n\n**Key Results:** Altered RSB activity was a consistent finding. In POI (7 studies; 2 HRM), the HRM studies showed immediate postoperative hyperactive distal cyclic activity (~2-4 cycles/min) correlating with delayed return of bowel function, contradicting older low-resolution reports of quiescence. In LARS (4 studies; 3 HRM), post-prandial cyclic patterns and propagating sequences were blunted after rectosigmoid resection. In FI (5 studies; 2 HRM), the brake was suppressed; sacral nerve stimulation increased distal retrograde contractions with parallel symptom gains. In ACPO (1 HRM case study), recordings showed disordered, non-propagating hyperactive activity consistent with distal functional obstruction rather than hypoactivity.\n\n**Conclusions:** Across POI, LARS, FI, and ACPO, the RSB appears to be a unifying physiological mechanism and a promising physiological biomarker with diagnostic and therapeutic potential. Priorities include standardizing manometric definitions, establishing normative reference metrics, and advancing non-invasive assessment (e.g., body-surface colonic mapping) to enable RSB-guided care and translation to practice.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Key results：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 在 POI、LARS、FI 和 ACPO 中，RSB 似乎是一种统一的生理机制，也是一种具有诊断和治疗潜力的有前景的生理生物标志物。优先事项包括标准化测压定义、建立规范性参考指标以及推进非侵入性评估（例如体表结肠测绘），以实现 RSB 指导的护理和转化为实践。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colonic motility, fecal incontinence, ileus, low anterior resection syndrome, sacral nerve stimulation", "link": "https://pubmed.ncbi.nlm.nih.gov/41857485/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 20 Mar 2026"}, {"id": "41832382", "title_en": "Novel adjunctive technologies for the prevention of colorectal anastomotic leakage: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A Picciariello", "abstract_en": "**Background:** Anastomotic leakage (AL) remains one of the most serious complications following colorectal surgery, particularly after low anterior resection. In recent years, several adjunctive technologies have been introduced to reinforce anastomotic integrity during the early phases of healing. This systematic review aimed to evaluate the safety, feasibility, and clinical effectiveness of novel mechanical and biological devices designed to prevent AL in colorectal surgery.\n\n**Methods:** A systematic literature search was conducted in PubMed, Embase, and Scopus. Human studies evaluating innovative adjunctive devices for AL prevention in patients undergoing low anterior resection were included. Studies focusing on transanal tubes, omental wrapping, or suture reinforcement were excluded. The primary outcome was the rate of anastomotic leakage.\n\n**Results:** Eighteen studies published between 2005 and 2021 met the inclusion criteria. The evaluated technologies were grouped into six categories: bioabsorbable staple-line reinforcements, nitinol-based compression rings, biodegradable intraluminal sheaths, vacuum-anchored diversion systems, fi brin-based sealants, and collagen patches (Seamguard™, C-Seal™, ColonRing™, Colovac™, Tissucol™/Greenplast™, TachoSil™, and Hemopatch™). Considerable heterogeneity in study design and methodological quality was observed. Although several devices demonstrated acceptable technical feasibility and safety, their eff ect on AL prevention was inconsistent. Only a limited number of studies included control groups or were designed as randomized controlled trials. Device-related complications, including migration, technical difficulties, and local tissue reactions, were reported in some series.\n\n**Conclusions:** Current adjunctive technologies have not consistently demonstrated a reduction in AL rates after colorectal surgery. While selected devices may provide potential benefit in high-risk patients, their clinical applicability remains limited by technical constraints and heterogeneous evidence. Further large, high-quality studies incorporating standardized definitions of AL and patient-specific risk stratification are warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leakage, Anastomotic reinforcement devices, Colorectal surgery, urgical sealants and biomaterials", "link": "https://pubmed.ncbi.nlm.nih.gov/41832382/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sun, 15 Mar 2026"}, {"id": "41822113", "title_en": "Perioperative outcomes of robotic-assisted vs. conventional laparoscopy for colorectal cancer resection: a systematic review and meta-analysis", "title_zh": "机器人辅助与传统腹腔镜结直肠癌切除术的围手术期结果：系统评价和荟萃分析", "authors": "Ashraf Abdelmonem Elsayed", "abstract_en": "**Background:** Colorectal cancer is a major global health concern that requires successful surgical treatments. While robotic-assisted surgery (RAS) provides prospective improvements, laparoscopic surgery has proven to yield better results than open surgeries.\n\n**Methods:** From 2018 to December 2024, PubMed, Scopus, and Web of Science were used to perform a systematic review and meta-analysis of cohort studies and randomized controlled trials (RCTs). Studies comparing RAS and conventional laparoscopic surgery were included. The primary outcomes assessed were length of hospital stay, conversion to open surgery, postoperative complications, and operating time. Using Comprehensive Meta-Analysis software, statistical analysis was performed, including subgroup analyses by anatomical site (colon, rectum, colorectal). Sensitivity analyses and heterogeneity were conducted.\n\n**Results:** 21 studies involving over 70,000 patients were included. The meta-analysis demonstrated significantly longer operative times with RAS (MD = 0.161-1.049, <i>p</i> < 0.001). RAS was linked to a significantly lower chance of re-operative rates (RR = 0.549, <i>p</i> = 0.023) and a significantly lower risk of conversion to open surgery (RR = 0.412-0.592, <i>p</i> < 0.001). RAS decreased problems in the colorectal group (RR = 0.867, <i>p</i> = 0.023), but overall rectum group complication rates were comparable. Hospital stays were shorter after robotic-assisted surgery (MD = -0.284 to -0.755, <i>p</i> = 0.001).\n\n**Conclusion:** When compared to CLS, RAS has the advantage of lowering conversion and re-operation rates, albeit at the expense of higher operating time. CLS led to shorter hospital stays, but in some circumstances, the complication rates were on level with or lower than those of RAS. According to these results, RAS might be useful in some surgical situations and patient demographics.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/view/614084, PROSPERO CRD42024614084.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, laparoscopic surgery, meta-analysis, postoperative outcomes, robotic surgery, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41822113/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 13 Mar 2026"}, {"id": "41821307", "title_en": "Preoperative low-energy diets for patients with a body mass index >30 kg/m2 undergoing non-bariatric surgery: pilot feasibility randomized clinical trial and a systematic review and meta-analysis of efficacy data", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Mohit Bhandari", "abstract_en": "**Background:** The current evidence for preoperative low-energy diets (LEDs) for patients with a BMI >30 kg/m2 before non-bariatric surgery rests on studies with a high risk of bias. An RCT is warranted to bridge this knowledge gap. Before a larger RCT, a pilot feasibility RCT was conducted to address potential hurdles for the larger trial.\n\n**Methods:** The pilot feasibility multicentre trial was conducted in Canada at four centres between 3 January 2024 and 23 October 2024. Patients were randomized (1 : 1 randomly permuted online blocked allocation) to receive a 3-week LED protocol or standard care. All patients aged >18 years with a BMI >30 kg/m2 undergoing elective non-bariatric intra-abdominal or orthopaedic surgery were evaluated for enrolment. Main exclusion criteria were LED contraindications and surgery scheduled without at least 3 weeks notice. The primary outcome was descriptive including the following feasibility outcomes: recruitment rate, randomization percentage, intervention adherence, and follow-up completion. Clinical outcomes included anthropometric data. The primary outcome analysis was descriptive. Additionally, a random-effects meta-analysis was performed using data from the present study and data from previously published RCTs to evaluate 30-day postoperative morbidity. The last follow-up date was 14 January 2025.\n\n**Results:** Out of 373 patients approached, 288 were eligible. Of these, 175 consented to be randomized (60.8% (95% c.i. 54.9-66.4%)). Seventy four of these patients were still awaiting a surgical date when the trial closed, leaving 91 patients randomized (LED n = 45, control n = 46) in the present pilot trial. Out of these 91 randomized patients, 81 (89%, 95% c.i. 80.7-94.6%) had complete follow-up. LED adherence was 81.7% (95% c.i. 74.1-89.3%). Analysis of covariance suggested patients in the LED group lost more weight during the 3-week intervention period (MD 4.5kg, 95% c.i. -5.6 to -3.5). The pooled meta-analysis of 5 RCTs suggested a 19% relative risk reduction in postoperative morbidity favouring the intervention (RR 0.81, 95% c.i. 0.52-1.26, P = 0.351, I2 = 0%).\n\n**Conclusion:** The feasibility targets of this pilot RCT were not met for recruitment rate, randomization percentage, and complete follow-up. The pooled meta-analysis suggests that LEDs before non-bariatric surgery can effectively induce weight loss with reduced postoperative morbidity, which needs to be validated in a larger non-inferiority RCT with additional centres to meet the feasibility targets.\n\n**Registration Number:** NCT03935451 (http://www.clinicaltrials.gov).", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 试点可行性多中心试验于 2024 年 1 月 3 日至 2024 年 10 月 23 日在加拿大的四个中心进行。患者被随机（1:1 随机排列在线分组分配）接受为期 3 周的 LED 方案或标准护理。所有年龄 > 18 岁且 BMI > 30 kg/m2 接受选择性非减肥腹腔内或骨科手术的患者均接受了入组评估。主要排除标准是 LED 禁忌症和在没有至少 3  周通知的情况下安排手术。主要结果是描述性的，包括以下可行性结果：招募率、随机化百分比、干预依从性和随访完成情况。临床结果包括人体测量数据。主要结果分析是描述性的。此外，使用本研究的数据和之前发表的随机对照试验的数据进行了随机效应荟萃分析，以评估术后 30 天的发病率。最后一次随访日期是2025年1月14日。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration number：** NCT03935451 (http://www.clinicaltrials.gov)。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41821307/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 13 Mar 2026"}, {"id": "41815276", "title_en": "Setup and target volume shape variation in rectal cancer radiotherapy: a systematic literature review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Rianne de Jong", "abstract_en": "**Introduction:** This systematic literature review aimed to evaluate treatment uncertainties associated with modern rectal cancer radiotherapy, focusing on systematic and random errors in setup and target volume (TV) shape variation, with the aim of supporting clinics in optimizing treatment accuracy and consistency in daily practice.\n\n**Methods:** A systematic literature review was conducted to quantify geometrical uncertainties with respect to setup and TV shape variations in the treatment of rectal cancer. It included studies reporting uncertainties for setup, CTV (Clinical Target Volume) shape variations (rectum and mesorectum), GTVp (Gross Tumor Volume - Primary Tumor), GTVn (Gross Tumor Volume - Nodes), and/or elective pelvic lymph nodes; excluding non-English language publications.\n\n**Results:** 196 reports were assessed for full text screening and 32 publications were selected for final reporting. Most authors utilized on board imaging to calculate setup errors and TV shape variation, and all reported substantial uncertainties. Setup uncertainty was reported to be very different for prone (w/o belly board) vs supine position, in favour of supine position. TV shape variation showed large systematic and random errors, especially for GTVp and the upper anterior part of the mesorectum. A subset of publications analyzed the positional uncertainties of elective draining lymph nodes, which are typically not removed during surgery, showing their small positional variations in relation to bone structures.\n\n**Conclusion:** Setup and TV shape variation are significant and non-negligible geometric uncertainties. Setup errors can largely be minimized with daily (2D or 3D) IGRT, whereas TV shape variations-particularly in the mesorectum-needs to be assessed daily with 3D imaging and requires anisotropic margins.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Image guided radiotherapy, Rectal cancer, Review, Set up, Shape variation, Uncertainties", "link": "https://pubmed.ncbi.nlm.nih.gov/41815276/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41813999", "title_en": "Circular powered staplers versus manual staplers in left-sided colorectal anastomoses: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Amandeep Ghuman", "abstract_en": "**Background:** Anastomotic leaks in colorectal surgery increase mortality, local cancer recurrence, and hospital readmission rate. The Echelon Circular Powered Stapler (PCS) is marketed to reduce anastomotic leaks by minimizing operator errors through powered systems. We reviewed current evidence on the use of PCS in left-sided colorectal anastomoses to determine if there is a reduction in anastomotic leak rates versus manual circular staplers (MCS).\n\n**Methods:** This study followed PRISMA guidelines. MEDLINE, EMBASE, CINAHL, and OVID review databases were searched to January 2024. A broad search strategy for PCS versus MCS in colorectal surgery was used. Abstracts were reviewed for the primary outcome of anastomotic leaks, and data were extracted from full-text review. Statistical analysis was performed using RevMan 5.4 software.\n\n**Results:** 109 articles were screened, 9 studies with 3110 patients were included. No randomized control trials (RCTs) were found. In pooled and sensitivity analysis excluding studies that used historic comparators, there was no significant difference in the rates of anastomotic leak (pooled RR 0.56, 95% CI [0.27-1.18], p = 0.13; sensitivity analysis RR 0.75, 95% CI [0.32-1.77], p = 0.52). Similarly, there was no significant difference in morbidity between PCS and MCS on pooled analysis (RR 0.84, 95% [CI 0.65-1.08], p = 0.17). However, on pooled analysis, there was a significantly lower rate of post-operative bleeding with the use of PCS (RR 0.2, 95% CI [0.08-0.51], p < 0.001).\n\n**Conclusion:** The current systematic review and meta-analysis is unable to support the claim of lower leak rate with the use of PCS; however, there is preliminary evidence to indicate that powered staplers may decrease the rate of post-operative bleeding. Further evidence from RCTs investigating anastomotic leaks and bleeding rate with PCS and assessments of environmental impact should be conducted prior to the widespread use of powered staplers.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leak rate, Colorectal surgery, Echelon powered stapler, Manual circular stapler, Powered circular stapler", "link": "https://pubmed.ncbi.nlm.nih.gov/41813999/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41804965", "title_en": "Impact of circular stapler size on anastomotic complications after low colorectal anastomosis: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Dimitrios Prassas", "abstract_en": "**Introduction:** Despite advancements in colorectal surgery, anastomotic complications such as leakage and stricture remain significant challenges. The influence of circular stapler size on these outcomes is controversial. This meta-analysis evaluates the impact of stapler diameter on anastomotic morbidity following low colorectal anastomosis.\n\n**Evidence Acquisition:** A systematic search of PubMed, Google Scholar, and the Cochrane Central Register was conducted in accordance with PRISMA guidelines. Comparative studies that reported outcomes based on circular stapler size were included. Primary endpoints were anastomotic leak, stricture, bleeding, and overall anastomotic morbidity. Secondary outcomes included overall morbidity, major complications, reoperation, readmission, and operative time. Odds ratios (ORs) and standardized mean differences (SMDs) with 95% confidence intervals (CIs) were calculated. The ROBINS-I and GRADE tools were used to assess the risk of bias and quality of evidence.\n\n**Evidence Synthesis:** Seven studies comprising 2214 patients (small stapler size (<30 mm): N.=859, large stapler size (≥30 mm): N.=1355) were included. Use of larger staplers was associated with a significantly lower incidence of anastomotic stricture (OR=2.31, 95% CI: 1.48-3.60, P=0.0002), with low heterogeneity (I<sup>2</sup>=5%). No significant differences were observed in anastomotic leak, bleeding, or overall anastomotic morbidity. Secondary outcomes, including overall and major morbidity, readmission, reoperation, and operative duration, also showed no significant differences between stapler sizes.\n\n**Conclusions:** Larger circular staplers are associated with a reduced risk of anastomotic stricture following low colorectal anastomosis, without increasing other postoperative complications. These findings support the consideration of larger stapler diameters when anatomically feasible. Further high-quality prospective studies are warranted to validate these results and guide surgical decision-making.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41804965/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Tue, 10 Mar 2026"}, {"id": "41800666", "title_en": "Transrectal vs transperineal prostate biopsy: a systematic review and meta-analysis", "title_zh": "经直肠与经会阴前列腺活检：系统评价和荟萃分析", "authors": "Kieran J Breen", "abstract_en": "**Objective:** To compare transrectal ultrasonography (TRUS) and local anaesthetic transperineal (LATP) biopsy.\n\n**Methods:** A systematic review of randomised control trials and prospective studies meeting eligibility criteria was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines.\n\n**Results:** A total of 12 studies with 8497 patients were included. LATP biopsy was performed in 3961 patients and TRUS biopsy in 4536. Patient characteristics were comparable in both groups. Infection (risk ratio [RR] 0.68, 95% confidence interval [CI] 0.56-0.84, P < 0.001) and sepsis rates were significantly lower in the LATP group (RR 0.16, 95% CI 0.08-0.33, P < 0.001) and urinary retention rates were comparable (RR 0.87, 95% CI 0.61-1.25, P = 0.46). Overall cancer detection rates were significantly higher in LATP biopsy (RR 1.07, 95% CI 1.03-1.10, P < 0.001) as were Gleason Grade Group 2-5 or clinically significant cancer detection rates (RR 1.12, 95% CI 1.06-1.18, P < 0.001). Gleason GG 1 detection rates were comparable (RR 0.92, 95% CI 0.82-1.04, P = 0.20).\n\n**Conclusion:** The LATP biopsy is associated with lower rates of infection and sepsis compared to TRUS biopsy. The LATP biopsy also detects a higher overall incidence of prostate cancer and clinically significant prostate cancer (Gleason Grade Group 2-5).", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again  %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in the pooled analysis (log OR 1.23, 95 % CI 0.02 to 2.44); this persisted in event-positive studies (log OR 1.45, 95 % CI 0.18 to 2.72). Operative time was longer with LAARP (mean difference (MD) 66.74 min, 95 % CI 27.48 to 106.00), with substantial heterogeneity (I<sup>2</sup> 97.57 %). Wound infection was uncommon and inconsistently reported; quantitative pooling was not undertaken.\n\n**Conclusions:** LAARP is a feasible and safe option for male RBF, with outcomes comparable to those of PSARP for major postoperative complications; however, the certainty of the evidence remains limited, underscoring the need for high-quality prospective studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformations, Laparoscopic-assisted anorectoplasty, Meta-analysis, Pediatric colorectal surgery, Posterior sagittal anorectoplasty, Rectobulbar fistula, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41796653/?utm_source=Other&utm_medium=rss&utm_campaig ght to establish the prevalence of normal endoscopic findings within the IDA population as well as the prevalence of nonmalignant and malignant gastrointestinal pathology amongst clinically relevant subgroups. Results were synthesized using a random effects meta-analysis.\n\n**Results:** A total of 8563 citations were screened, and 39 articles were included from four continents, comprising 9807 patients with IDA. Overall, the most prevalent upper gastrointestinal finding was Helicobacter pylori gastritis (27.0%), and the most prevalent lower gastrointestinal finding was hemorrhoids (10.0%). The overall prevalence of upper gastrointestinal malignancy was 5.0%, and the prevalence of colorectal cancer was 8.0%. A total of 52.0% of upper gastrointestinal endoscopies and 66.0% of lower gastrointestinal endoscopies did not detect any abnormalities.\n\n**Conclusion:** The estimated prevalence of individual malignant and nonmalignant gastrointestinal disease will serve as a guide in the context of clinical decision making before endoscopy in patients with IDA. Further population-based studies are needed, particularly among relevant subgroups.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "cancer, endoscopy, gastrointestinal, iron deficiency anemia, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41784434/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j now.", "authors": "Wu Jiang", "abstract_en": "**Background:** Mismatch repair deficiency (dMMR) and microsatellite instability (MSI-H) cancers exhibit high immunogenicity and are highly responsive to immune checkpoint inhibitors. In patients with locally advanced dMMR/MSI-H colorectal cancer (CRC), neoadjuvant immunotherapy (NIT) has demonstrated unprecedented pathological complete response (pCR) rates, suggesting nonoperative management strategies may be possible. There remains a discrepancy between radiological assessment and pathological responses to NIT in CRC.\n\n**Methods:** We conducted a systematic review and meta-analysis of studies published between February 2015 and February 2025 to determine if radiological and pathological assessments following neoadjuvant immune checkpoint inhibitor therapy (NIT) were consistent in patients with non-metastatic dMMR/MSI-H CRC. Using PubMed, Embase, and Web of Science, the literature was retrieved, with inclusion criteria focusing on studies that reported both imaging data and pathological results. A random-effects model was used to calculate pooled odds ratios (ORs) and 95% confidence intervals (CIs). Subgroup analyses were conducted based on tumor location (colon versus rectum) and type of response (cCR versus pCR).\n\n**Results:** In 12 studies, 396 patients were included. A total rate of 59.6% discordance was found between radiological and pathological responses. Compared to rectal cancer patients (34.9%), colon cancer patients exhibited a significantly higher rate of discordance (64.2%). A total of 238 patients with confirmed pCR were incorrectly diagnosed as having residual disease on radiological assessment (OR = 61.41; 95% CI: 10.05-375.27;P < 0.00001). A high level of heterogeneity was observed across studies (I2 = 85%), but no publication bias was observed.\n\n**Conclusion:** In dMMR/MSI-H CRC, radiologic assessment alone cannot reliably assess the efficacy of NIT, particularly in colon cancer. It should be integrated with additional modalities-such as endoscopic evaluation and biomarker analysis-to ensure an accurate appraisal of treatment efficacy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "dMMR/MSI-H colorectal cancer, meta-analysis, microsatellite instability-high, neoadjuvant immunotherapy, radiological assessment", "link": "https://pubmed.ncbi.nlm.nih.gov/41737205/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 25 Feb 2026"}, {"id": "41721863", "title_en": "Life outcomes of being born with anorectal malformation: a systematic review of intersectional reporting, mental health co-morbidities, and psychosocial experiences in adulthood", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Paul Harris", "abstract_en": "**Purpose:** Anorectal malformations exist across a spectrum of abnormalities involving the rectum, distal anus, genital and urinary tracts, and occur in approximately one in 5,000 live births. The purpose of this study was to investigate intersectional reporting, mental health co-morbidities, and psychosocial experiences of adults born with anorectal malformation.\n\n**Methods:** A systematic quantitative literature review was utilized to collect and analyze data. Articles were required to discuss population demographics, mental health comorbidities, or psychosocial experiences associated with anorectal malformation in adulthood. A total of 94 articles were found suitable for review.\n\n**Results:** Patient ethnicity, culture, sexuality, and spirituality were significantly underrepresented. Mental health co-morbidities such as anxiety and depression were discussed but rarely transitioned to intervention. Psychological challenges included psychosexual anxiety and limited professional knowledge. Sociological challenges included navigating health services and social settings. Literature prioritized continence outcomes that diminished psychosocial complexities.\n\n**Conclusions:** The intersectionality, mental health concerns, and psychosocial experiences of adults born with anorectal malformation remain largely unknown. Allied health professionals such as social workers can improve ongoing support provision, with interventions that enhance psychosocial functioning and emotional wellbeing.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformation, Psychosocial functioning, Social work", "link": "https://pubmed.ncbi.nlm.nih.gov/41721863/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sat, 21 2.0 tool for randomized controlled trials (RCTs) and the ROBINS-I tool for observational studies. The certainty of evidence was evaluated using the GRADE approach.\n\n**Results:** Nine studies including 2317 participants were included, and five were eligible for meta-analysis. Overall, prophylactic antibiotics were not associated with a significant reduction in postoperative infectious or wound-related complications in RCTs (RR 0.76, 95% CI 0.43-1.33, and p = 0.66, moderate GRADE certainty of evidence) or observational studies (RR 0.60 (95% CI 0.01-48.4) and p = 0.53, very low certainty). All studies concluded that routine antibiotic prophylaxis may be unnecessary in anorectal surgery.\n\n**Conclusion:** Current evidence does not support the routine use of prophylactic antibiotics in uncomplicated anorectal procedures. However, the certainty of evidence is limited by small sample sizes, methodological heterogeneity, and limited number of available studies. Large-scale randomized trials are required to strengthen this evidence base.\n\n**Trial Registration:** The review protocol was registered in the PROSPERO database CRD420251159850.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Trial registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anorectal diseases, antibiotic prophylaxis, hemorrhoidectomy, surgical site infection", "link": "https://pubmed.ncbi.nlm.nih.gov/41645344/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 06 Feb 2026"}, {"id": "41640613", "title_en": "Is salvage treatment necessary after incomplete resection of rectal neuroendocrine tumors: A systematic review and meta-analysis", "title_zh": "直肠神经内分泌肿瘤不完全切除后是否需要挽救治疗：系统评价和荟萃分析", "authors": "Seun Ja Park", "abstract_en": "**Background:** Incomplete resection of rectal neuroendocrine tumors (NETs), defined by positive or indeterminate margins or lymphovascular invasion, raises concerns regarding residual disease and recurrence. However, the benefits of salvage treatment in these cases remain unclear.\n\n**Aim:** To evaluate the oncologic impact of salvage treatment compared with observation after incomplete endoscopic resection of rectal NETs through a systematic review and meta-analysis.\n\n**Methods:** We conducted a systematic review and meta-analysis in accordance with the preferred reporting items for systematic reviews and meta-analyses guidelines. MEDLINE, EMBASE, and the Cochrane Library were searched from their inception until May 2025. Eligible studies included patients with incompletely resected rectal NETs managed with salvage treatment or observation, reporting outcomes of residual tumors or recurrence. Pooled estimates were calculated using random-effects models with Hartung-Knapp adjustments.\n\n**Results:** Thirty-four studies with 2279 cases of incomplete endoscopic resection met the inclusion criteria. The incomplete resection rates differed markedly according to the initial resection method (17 studies): 73.1% for cold snare polypectomy, 29.8% for conventional endoscopic mucosal resection (EMR), 28.4% for modified EMR, and 14.7% for endoscopic submucosal dissection. Among the 19 studies that evaluated salvage treatment, the pooled residual tumor rate was 25.0% [95% confidence interval (CI): 12.0%-40.0%]. The crude recurrence rates from 31 studies favored salvage treatment over observation (0.96% <i>vs</i> 2.96%, <i>P</i> = 0.003). However, a meta-analysis of nine comparative studies found no statistically significant difference in recurrence risk (odds ratio = 0.89; 95%CI: 0.40-2.02).\n\n**Conclusion:** Given the relatively high residual tumor rate and low incidence of recurrence, salvage treatment may be justified as both a diagnostic and therapeutic approach after incomplete resection of rectal NETs. Although its benefits in preventing recurrence remain unclear, clinical decisions should be individualized, as these findings are based on low-certainty evidence.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Neuroendocrine tumors, Observation, Rectum, Residual neoplasm, Salvage therapy", "link": "https://pubmed.ncbi.nlm.nih.gov/41640613/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 05 Feb 2026"}, {"id": "41629638", "title_en": "Fecal incontinence after prostate cancer irradiation: a systematic literature review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jean-Michel Hannoun-Levi", "abstract_en": "**Goal:** Fecal incontinence (FI) is an underrecognized but clinically significant late gastrointestinal toxicity following radiotherapy (RT) for prostate cancer. This systematic review aimed to synthesize current knowledge on the definition and pathophysiology of post-radiation anal continence, as well as prevention strategies, technical considerations, and therapeutic approaches.\n\n**Method:** A systematic literature search was conducted according to PRISMA guidelines using the keywords: \"Fecal incontinence,\" \"Radiation therapy,\" and \"Prostatic neoplasms.\" Eligible studies included randomized phase III trials and prospective or retrospective series reporting on FI after definitive or adjuvant/salvage prostate RT. Fifty-four articles were included in the final analysis.\n\n**Results:** FI after prostate RT results from functional, morphological, and neurogenic alterations of the anorectal system. Reported incidence ranges from 1 to 12%, most often presenting as flatulence or liquid stool leakage, while severe forms requiring pads are uncommon. Variability is largely explained by heterogeneity in definitions and assessment tools, as no standardized scoring system is universally applied. Risk factors include advanced age, prior abdominal surgery, vascular comorbidities, chronic inflammatory bowel disease, hemorrhoids, and rectal urgency during RT. Dosimetric analyses indicate that low-to-intermediate doses to the anal canal and high doses to the rectum contribute differentially to FI. Based on current evidence, the mean dose to the anal canal should be kept below 37 Gy, though further studies are needed to define precise constraints for both structures. Preventive strategies such as MRI-based contouring and endorectal balloon placement, perirectal hydrogel spacers placement show promise. Management is multidisciplinary, including dietary measures, medications, pelvic floor therapy, neuromodulation, and, in severe cases, diversion procedures.\n\n**Conclusion:** FI after prostate RT is likely underestimated due to the absence of a standardized assessment. Developing a validated, universally applicable scoring system is a priority to improve evaluation, enable cross-study comparisons, refine preventive measures, and guide therapeutic strategies.", "abstract_zh": "**Goal：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41629638/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 02 Feb 2026"}, {"id": "41611909", "title_en": "Indocyanine green fluorescence to prevent anastomotic leak in colorectal surgery: an updated systematic review and meta-analysis on randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Antonino Spinelli", "abstract_en": "**Background:** In light of the recent publication of two multicentric controlled trials, this systematic review and meta-analysis aims to update the evidence of the efficacy of Indocyanine Green fluorescence angiography in preventing the risk of anastomotic leak after colorectal surgery.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL databases were searched for randomized controlled trials using relevant keywords from 2015 until September 2025. The outcomes were the overall rate of anastomotic leaks, the rate of reoperations, and the rate of intraoperative surgical strategy changes.\n\n**Results:** Ten randomized controlled trials were selected, including 4.885 patients, 2.432 (49.7%) who received intraoperative ICG assessment and 2.453 (50.3%) who underwent standard white light assessment. The studies displayed a moderate risk of bias and were included in the meta-analysis. The ICG group showed a reduced rate of anastomotic leak (OR = 0.64; p < 0.0001; high evidence) compared with the standard dressing group and a higher rate of changes in surgical strategy (OR = 7.50; p = 0.02; moderate evidence), while no difference was found in the rate of reoperations (OR = 0.94; p = 0.64; moderate evidence). A subgroup analysis showed reduced anastomotic leak rates in left colon (p = 0.003) and rectal resection (p = 0.0002) and no differences after right colon surgery (p = 0.94).\n\n**Conclusions:** This systematic review and meta-analysis supports the use of ICG to reduce the anastomotic leak rate in colorectal surgery, in particular in left-sided and rectal resections.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leak, Colorectal surgery, Indocyanine green fluorescence angiography", "link": "https://pubmed.ncbi.nlm.nih.gov/41611909/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 29 Jan 2026"}, {"id": "41604561", "title_en": "Colitis cystica profunda: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Priyanka Kanth", "abstract_en": "Colitis cystica profunda (CCP) is an uncommon, benign colorectal lesion that can mimic malignancy. We conducted a systematic review of histologically confirmed CCP case reports and series to define epidemiology, presentation, diagnostic yield, management, and outcomes. Following PRISMA 2020, Embase, PubMed/MEDLINE, Web of Science, and CINAHL were searched (1965-2025); two reviewers independently screened studies and extracted demographic, clinical, imaging, histologic, treatment, and outcome data. Sixty-five studies (92 patients) met criteria. Mean age was 40 ± 12 years (median 39), and 54% were male. Rectal bleeding (70%), mucus discharge (32%), diarrhea (24%), and abdominal/rectal pain (26%) were most common; 12% were asymptomatic. Lesions were predominantly distal (rectum 61%), and superficial biopsies reached the submucosa in only 32%, contributing to frequent sampling error; Endoscopic ultrasound (EUS) and cross-sectional imaging typically showed submucosal cystic lesions with intact muscularis propria. Conservative and medical therapy were each attempted in 16% of patients, endoscopic resection in 14%, and surgery in 67%, most commonly local transanal/perineal excision (40% of surgeries) or segmental/partial colectomy (32% of surgeries). Dysplasia was reported in 10% and coexisting invasive adenocarcinoma in 4% at diagnosis; no subsequent malignant transformation was reported over a median follow-up of 8.4 months. Post-operative morbidity occurred in 5% and recurrence in 4%. CCP is a rare but important mimic of colorectal cancer; diagnosis is optimized with deep tissue sampling and high-resolution imaging. When feasible, organ-preserving endoscopic or local excision can achieve durable symptom resolution with low morbidity while avoiding unnecessary radical surgery.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colitis cystica profunda, endoscopic resection, mucous colitis, rectal bleeding, submucosal cysts", "link": "https://pubmed.ncbi.nlm.nih.gov/41604561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 28 Jan 2026"}, {"id": "41586878", "title_en": "Metronidazole is an effective method of analgesia following haemorrhoidectomy: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Christina A Fleming", "abstract_en": "**Background:** Haemorrhoids are one of the most frequently encountered benign anorectal conditions that negatively impact patients' quality of life. Excisional haemorrhoidectomy (closed or open) is a surgical procedure reserved for the treatment of third- and fourth-degree haemorrhoids, with considerable post-procedure pain reported. The aim of this study was to clarify the association between post operative metronidazole use (both oral and topical) and post-haemorrhoidectomy pain scores through systematic review and meta-analysis of randomised controlled trials (RCTs).\n\n**Methods:** This study was guided by the Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) guidelines. Prospective registration was performed on PROSPERO (CRD42024580928). A systematic review was performed for RCTs reporting post-haemorrhoidectomy pain scores between patients who received metronidazole and patients who received placebo. Meta-analysis was performed using RevMan version 5.4.\n\n**Results:** Seventeen RCTs including 1297 participants were eligible for inclusion. Metronidazole administration was associated with significantly lower post-operative visual analogue scores (VAS) on day 1 (-1.18, p < 0.00001), day 2 (-1.15, p = 0.003), day 3 (-0.86, p < 0.00001), and day 7 post-operatively with a mean pain score difference of -1.72 (95% CI -2.27 to -1.18) (p < 0.00001). A significant difference in pain scores was seen on day 3 favouring topical metronidazole in comparison to the oral route (1.38, 95% CI [0.44, 2.32], p = 0.004).\n\n**Conclusion:** This review synthesises the best available evidence to support the use of metronidazole to reduce pain after excisional haemorrhoidectomy. While both oral and topical forms appear to be beneficial, topical administration appears to have a more effective analgesic effect from post-operative day 3.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 包括 1297 名参与者在内的 17 项 RCT 有资格纳入。甲硝唑给药与术后第1天（-1.18，p < 0.00001）、第2天（-1.15，p = 0.003）、第3天（-0.86，p < 0.00001）和术后第7天显着降低的术后视觉模拟评分（VAS）相关，平均疼痛评分差异为-1.72（95% CI -2.27 至 -1.18）（p < 0.00001）。与口服途径相比，第 3 天局部使用甲硝唑的疼痛评分存在显着差异（1.38，95% CI [0.44，2.32]，p = 0.004）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Haemorrhoids, Metronidazole, RCT", "link": "https://pubmed.ncbi.nlm.nih.gov/41586878/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 26 Jan 2026"}, {"id": "41554450", "title_en": "Salvia plebeia R.Br.: A comprehensive review of its ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wei Jiang", "abstract_en": "**Ethnopharmacological Relevance:** Salvia plebeia R.Br. (Lamiaceae), the dried aerial parts, has been traditionally used across China and East/South Asia to treat sore throat, bronchitis, nephritis edema, abscesses, mastitis, hemorrhoids, and bleeding disorders, consistent with traditional indications of heat-clearing, detoxifying, cooling blood, and promoting diuresis.\n\n**Aim Of The Review:** This study provides a systematic overview of the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications of S. plebeia, while highlighting current research gaps and future perspectives.\n\n**Materials And Methods:** A comprehensive literature search was conducted using multiple scientific databases, including Web of Science, PubMed, Elsevier, ACS, CNKI, and Google Scholar, covering publications from database inception to October 2025. Relevant information on the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and applications of S. plebeia was systematically collected, screened, and synthesized according to predefined inclusion/exclusion criteria.\n\n**Results:** To date, 325 constituents have been identified, dominated by flavonoids, phenolic acids, terpenoids, volatile oils, sterols, lignans, and others. Extracts and purified compounds show tradition-relevant anti-inflammatory, antiviral, immunoregulatory, and antioxidant activities, while other reported effects (hepatoprotective, hypolipidemic, cardiovascular-protective, sedative/anticonvulsant, anticancer, and anti-photoaging) are presented as exploratory findings. Quality evaluation evolved from UV and HPLC to UPLC-MS fingerprinting using flavonoids and sesquiterpenes as markers. In practical applications, S. plebeia has been used in medicinal preparations for the management of pharyngitis, bronchitis, nephritis, dermatitis, and anorectal inflammation. In food sector, it has been developed into functional products, including health teas, chewable or effervescent tablets, composite beverages, and co-fermented vinegars.\n\n**Conclusion:** Although S. plebeia shows broad pharmacological potential, current investigations remain constrained by incomplete chemical space coverage, limited pharmacokinetic and toxicological characterization, and insufficient well-designed clinical evidence. Future research should focus on comprehensive constituent profiling, mechanism-oriented validation aligned with traditional indications, standardized quality markers/fingerprints, and rigorous PK-toxicology-clinical translation, to promote safe, effective, and evidence-based utilization of S. plebeia in medicine and functional food development.", "abstract_zh": "**Ethnopharmacological relevance：** 鼠尾草 (Salvia plebeia R.Br.) （唇形科）干燥的地上部分，在中国和东亚/南亚传统上用于治疗咽喉肿痛、支气管炎、肾炎水肿、脓肿、乳腺炎、痔疮和出血性疾病，符合清热解毒、凉血和利尿的传统功能。\n\n**Aim of the review：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** 利用Web of Science、PubMed、Elsevier、ACS、CNKI和Google Scholar等多个科学数据库进行了全面的文献检索，涵盖了从数据库建库到2025年10月的出版物。根据预先确定的纳入/排除标准，系统收集、筛选和合成了白花草的民族药理学、植物化学、药理活性、质量控制和应用的相关信息。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Current applications, Ethnopharmacology, Pharmacological activity, Phytochemistry, Quality control, Salvia plebeia R.Br.", "link": "https://pubmed.ncbi.nlm.nih.gov/41554450/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 19 Jan 2026"}, {"id": "41535511", "title_en": "Long-term outcomes of stapled haemorrhoidopexy versus conventional haemorrhoidectomy: An updated systematic review, meta-analysis and trial-sequential analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Roberto Cirocchi", "abstract_en": "**Purpose:** Stapled haemorrhoidopexy (SH) offers well-established short-term advantages over conventional haemorrhoidectomy (CH), but its long-term effectiveness remains controversial. This systematic review and meta-analysis aimed to compare long-term outcomes of SH versus CH in adult patients with grade II-IV haemorrhoids, incorporating Trial Sequential Analysis (TSA).\n\n**Methods:** MEDLINE, EMBASE and CENTRAL were searched from January 2001 to October 2025 for randomized controlled trials (RCTs) comparing SH and CH with a minimum follow-up of 12 months. Two reviewers independently performed study selection, data extraction and risk-of-bias assessment (RoB-2). Primary outcomes included recurrence, reintervention, anal function, and quality of life (QoL). Pooled risk ratios (RRs) with 95% confidence intervals (CIs) were calculated using random-effects models. TSA was applied to overall recurrence.\n\n**Results:** Seventeen RCTs including 1,041 SH and 1,031 CH patients were analysed. SH was associated with a higher risk of overall recurrence compared with CH (RR = 1.56,95%CI = 1.00-2.44;I<sup>2</sup> = 48%). TSA showed that the accrued information size (1,913 patients) did not reach the required information size (2,608 patients), indicating that current evidence remains underpowered. Prolapse-related recurrence was significantly more frequent after SH (RR = 3.28,95%CI = 1.49-7.25;I<sup>2</sup> = 12%), whereas bleeding-related recurrence did not differ between groups (RR = 1.20,95%CI = 0.63-2.26;I<sup>2</sup> = 23%). No significant differences were found for reintervention, persistent anal pain, functional impairment or QoL.\n\n**Conclusion:** SH is associated with a higher risk of long-term recurrence, particularly prolapse-related recurrence, compared with CH, while long-term pain, functional outcomes and QoL appear broadly comparable. These findings suggest that, although SH may remain an option for selected patients, CH provides more durable anatomical correction, and procedural choice should balance early recovery against long-term durability.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "圆形吻合器、弗格森、痔切除术、痔疮、谐波手术刀、LigaSure、Milligan-Morgan、PPH、吻合器痔疮固定术", "keywords_en": "Circular stapler, Ferguson, Haemorrhoidectomy, Haemorrhoids, Harmonic scalpel, LigaSure, Milligan-Morgan, PPH, Stapled haemorrhoidopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/41535511/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 14 Jan 2026"}, {"id": "41503542", "title_en": "Arterial Embolization for the Internal Hemorrhoids Management: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hadi Rokni Yazdi", "abstract_en": "**Background And Aims:** Hemorrhoids are common vascular structures that can become symptomatic when prolapsed, representing the most prevalent benign anorectal condition worldwide. Despite affecting up to 11% of the population with symptoms including pain, bleeding, and discomfort, hemorrhoids remain underdiagnosed and often inappropriately managed. This systematic review aimed to evaluate the efficacy, clinical outcomes, and morbidity of endovascular artery embolization in hemorrhoids.\n\n**Method:** Up to August 2022, PubMed, Scopus, Web of Science, and Embase were searched comprehensively. All studies had eligible criteria included, except review articles, articles published in a language other than English, and case reports or series of cases. Two independent reviewers performed a literature review and data extraction. Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) 2020 checklist was used for quality assessment.\n\n**Results:** The systematic review included 15 studies. The patient's age ranged from 40.5 ± 9.51 to 72.2 ± 10.9. Eleven studies mentioned the sample size as gender-specific, with 57.89% (<i>n</i> = 187/323) male patients. The embolic site involved in embolization, according to the frequency, was 424 patients for the superior rectal artery in all studies, and coils and micro coils were utilized as Embolic material in most cases. No major complication or death was noted in 12 studies. The most frequent complications were postoperative pain and tenesmus, bleeding, ulceration and fibrotic scars, and low-grade fever. In 11.79% (<i>n</i> = 27/229) of patients re-embolization and after-treatment surgery were due to surgical failure and symptom recurrence, such as bleeding.\n\n**Conclusion:** Rectal artery embolization using microcoils, embolic particles, or a combination is a new method for managing internal hemorrhoids with proper clinical efficacy without significant complications. QoL score has improved after emborrhoid, and most cases had a lower bleeding score.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "embolization, emborrhoid, hemorrhoid, hemorrhoidal artery, rectal artery", "link": "https://pubmed.ncbi.nlm.nih.gov/41503542/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 08 Jan 2026"}, {"id": "41450176", "title_en": "Worldwide prevalence of haemorrhoids: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Pouyan Ebrahimi", "abstract_en": "**Background:** Haemorrhoidal disease (HD) is one of the most common anorectal disorders globally, significantly impacting individuals' quality of life and productivity. Despite its importance, global prevalence remains unclear due to limited population-specific studies. This study aimed to systematically assess the global prevalence of HD through a systematic review and meta-analysis.\n\n**Methods:** We conducted a systematic review and meta-analysis by searching PubMed, Scopus, Embase, Web of Science, and Google Scholar up to March 31, 2025, without language restrictions. Studies reporting prevalence of haemorrhoids in general, clinical, or high-risk populations were included. Exclusion criteria comprised studies lacking total sample size, focusing on other anorectal conditions, or using duplicate or insufficient data. Four independent reviewers extracted and appraised study quality using the Joanna Briggs Institute tool. The primary outcome was pooled point prevalence of HD, analyzed using a random-effects model with 95% confidence intervals (CIs). The study was registered in PROSPERO (CRD420251045600).\n\n**Results:** From 6,312 records, 150 studies (210 datasets) comprising 8,960,338 individuals were included. The global pooled point prevalence was 25.92% (95% CI: 22.62-29.22). Lifetime prevalence was 27.19% (95% CI: 14.77-39.60), and one-year prevalence was 21.65% (95% CI: 14.33-28.97). Prevalence was higher in women (27.33%, 95% CI: 21.84-32.82) than in men, and highest in the African region 28.07% (95% CI: 15.34-40.79). Invasive diagnostic methods (28.05%, 95% CI: 23.86-32.26) yielded higher prevalence estimates than non-invasive methods. Also, factors showing associations with HD in unadjusted analyses include older age, obesity, pregnancy, diabetes, family history, constipation, and hypertension.\n\n**Conclusion:** HD remains a prevalent condition globally, with minor variation across regions. The burden is consistent regardless of socioeconomic context. Diagnostic method and population characteristics influence prevalence estimates. These findings underscore the importance of targeted prevention and early intervention strategies, especially for at-risk groups.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** HD 在全球范围
