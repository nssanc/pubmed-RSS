econdary outcomes were presence of postoperative small bowel obstruction (SBO), pouchitis, stricture and fistula complications. A random-effects meta-analysis was used.\n\n**Results:** Twenty-three observational studies in the systematic review were included with 658 patients (83% diverted, 17% undiverted). Pooled estimates showed no difference in occurrence of leaks in children who underwent J-pouch/IPAA with ileostomy versus without (odds ratio (OR) 0.54, 95% confidence interval (CI) 0.17 to 1.64, I<sup>2</sup>=16%). There was no difference in the occurrence of SBO, pouchitis or strictures in children who underwent J-pouch/IPAA with ileostomy versus without (SBO: OR 2.27, 95% CI 0.52 to 9.92, I<sup>2</sup>=0%, pouchitis: OR 1.76, 95% CI 0.95 to 3.24, I<sup>2</sup>=0%, strictures: OR 2.72, 95% CI 0.44 to 16.69, I<sup>2</sup>=66%).\n\n**Conclusion:** The meta-analysis did not find differences in the occurrence of complications in pediatric patients who underwent the IPAA with ileostomy procedure versus without ileostomy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adolescent health, education, evidence-based medicine, medical, statistics", "link": "https://pubmed.ncbi.nlm.nih.gov/36474515/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Wed, 07 Dec 2022"}, {"id": "36413086", "title_en": "Gracilis muscle interposition for complex perineal fistulas: A systematic review and meta-analysis of the literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Steven D Wexner", "abstract_en": "**Aim:** Complex perineal fistulas (CPFs) are among the most challenging problems in colorectal practice. Various procedures have been used to treat CPFs, with none being a panacea. Our study aimed to assess the overall success and complication rates after gracilis muscle interposition in patients with CPF.\n\n**Method:** PubMed, Scopus and Google Scholar databases were systematically searched until January 2022 according to PRISMA 2020 guidelines. Studies including children <18 years or <10 patients were excluded, as well as reviews, duplicate or animal studies, studies with poor documentation (no report of success rate) and non-English text. An open-source, cross-platform software for advanced meta-analysis openMeta [Analyst]™ version 12.11.14 and Cochrane Review Manager 5.4® were used to conduct the meta-analysis of data.\n\n**Results:** Twenty-five studies published between 2002 and 2021 were identified. The studies included 658 patients (409 women). Most patients had rectovaginal (50.7%) or rectourethral fistulas (33.7%). The most common causes of CPF were pelvic surgery (29.4%) and inflammatory bowel disease (25.2%). A history of radiotherapy was reported in approximately 18% of the patients. 498 (75.7%) patients with CPF achieved complete healing after gracilis muscle interposition. The weighted mean rate of success of the gracilis interposition procedure was 79.4% (95% CI 73.8%-85%, I<sup>2</sup>  = 75.3%), the weighted mean short-term complication rate was 25.7% (95% CI 18.1-33.2, I<sup>2</sup>  = 84.1%) and the weighted mean rate for 30-day reoperation was 3.6% (95% CI 1.6-5.6, I<sup>2</sup>  = 42%). The weighted mean rate of fistula recurrence was 16.7% (95% CI 11%-22.3%, I<sup>2</sup>  = 61%).\n\n**Conclusion:** The gracilis muscle interposition technique is a viable treatment option for CPF. Surgeons should be familiar with indications and techniques to offer it as an option for patients. Given the relatively infrequent use of the operation, referral rather than performance of graciloplasty is an acceptable option.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal, complex perineal, fistula, gracilis, gracilis muscle interposition, graciloplasty, rectourethral, rectovaginal", "link": "https://pubmed.ncbi.nlm.nih.gov/36413086/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Tue, 22 Nov 2022"}, {"id": "36294834", "title_en": "Negative Pressure Wound Therapy for the Treatment of Fournier's Gangrene: A Rare Case with Rectal Fistula and Systematic Review of the Literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Stefania Cimbanassi", "abstract_en": "Fournier's gangrene (FG) is a Necrotizing Soft Tissue Infection (NSTI) of the perineal region characterized by high morbidity and mortality even if appropriately treated. The main treatment strategies are surgical debridement, broad-spectrum antibiotics, hyperbaric oxygen therapy, NPWT (Negative Pressure Wound Therapy), and plastic surgery reconstruction. We present the case of a 50-year-old woman with an NSTI of the abdomen, pelvis, and perineal region associated with a rectal fistula referred to our department. After surgical debridement and a diverting blow-out colostomy, an NPWT system composed of two sponges connected by a bridge through a rectal fistula was performed. Our target was to obtain healing in a lateral-to-medial direction instead of depth-to-surface to prevent the enlargement of the rectal fistula, promoting granulation tissue growth towards the rectum. This eso-endo-NPWT technique allowed for the primary suture of the perineal wounds bilaterally, simultaneously treating the rectal fistula and the perineum lesions. A systematic review of the literature underlines the spreading of NPWT and its effects.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Fournier’s gangrene, Negative Pressure Wound Therapy (NPWT), case report, hyperbaric oxygen therapy, rectal fistula, surgical technique", "link": "https://pubmed.ncbi.nlm.nih.gov/36294834/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Thu, 27 Oct 2022"}, {"id": "36271904", "title_en": "Placebo Response Rates in Randomized Controlled Trials for Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** Perianal fistulizing disease is a common complication of Crohn's disease [CD], for which new therapies are urgently needed. To assist the design of clinical trials for novel therapeutics, we conducted a systematic review and meta-analysis of randomised controlled trials [RCTs] to quantify placebo rates and identify factors influencing them in perianal CD [pCD].\n\n**Methods:** We searched MEDLINE, Embase and CENTRAL from inception to June 2021. Eligible studies were placebo-controlled trials of pharmacological interventions for pCD. Placebo fistula response and remission rates for induction and maintenance trials were extracted and pooled using a random-effects model. Mixed-effects meta-regression was used to evaluate the impact of patient and study-level characteristics on point estimates.\n\n**Results:** In 17 RCTs [13 induction, five maintenance] the pooled placebo fistula response and remission rate for induction trials was 25% (95% confidence interval [CI] 17-36%) and 17% [95% CI 11-25%], respectively. For maintenance trials, the pooled placebo fistula response and remission rate was 23% [95% CI 17-32%] and 19% [95% CI 14-25%], respectively. Trials enrolling patients with less disease activity and a higher proportion with ileal predominant disease were associated with significantly higher placebo response rates. Trials originating in Europe [compared to North America], therapies requiring perianal injection and a longer timepoint to measure remission were associated with higher placebo remission rates.\n\n**Conclusions:** Placebo response and remission rates in pCD trials are influenced by patient and disease-related factors, as well as the type of intervention being studied. These contemporary rates will inform trial design for novel therapeutics.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500. one of the patients had a history of radiation, and two had histories of total abdominal hysterectomy (22%). In the rectovaginal fistula cohort, one patient had a history of pelvic radiation for rectal squamous cell carcinoma, and another had a history of chronic steroid use for rheumatoid arthritis. No other risk factors were reported in the other groups. Ring and Gellhorn were the most represented pessary types among the studies, 16 (44%) and 12 (33%), respectively. No complications were reported with surgical and non-surgical treatment of the complications.\n\n**Conclusion:** Pessaries are a reasonable and durable treatment for POP with exceedingly rare reports of severe adverse complications. The ideal candidate for pessary should have a good self-care index. Studies to determine causative factors of the more serious adverse events are needed; however, this may be difficult given the long follow-up that is required.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adverse effects, fistula, incontinence, pessary, prolapse, rare complications", "link": "https://pubmed.ncbi.nlm.nih.gov/36267197/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 21 Oct 2022"}, {"id": "36176822", "title_en": "A Comparison of Different Surgical Treatments for Complex Anal Fistula: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Pousette Hamid", "abstract_en": "Fistula-in-ano is a common proctological condition that primarily affects younger people and leads to chronic morbidity. An anal fistula is divided into simple and complex fistulas. A complex fistula is a challenging problem due to higher recurrence rates and incontinence associated with surgery. Many new methods have been developed for the closure of complex fistula-in-ano, but there is no single best method. The aim of this study is to identify a superior surgical technique for treating complex/high cryptoglandular perianal fistulas (HCPFs). A literature search was done using PubMed and Google Scholar for the period of 2012-2021. Articles that contain surgical treatment for complex anal fistula in the English language published in the last 10 years were included. The types of studies included were randomized controlled trials (RCTs), meta-analyses, systematic reviews, cohort studies, and traditional reviews. Articles excluded were those done more than 10 years ago, in other languages, and containing simple fistula management only. Nine studies were included in the review; a systematic review and meta-analysis concluded that no single method is effective. The ligation of the intersphincteric fistula tract (LIFT) procedure seems to be a promising and effective technique as it has a low rate of fecal incontinence as compared to other methods. Biological techniques give variable success rates so does fistula plug (FP). Mucosal advancement flap (MAF) and rerouting seton give good results according to one study. Fistula plug gives variable results and is not a preferred method. Ligation of the intersphincteric fistula tract (LIFT) seems to be a promising new technique for complex anal fistulas, but the data available is not enough to determine the best method. More randomized trials are required to compare traditional techniques and emerging new biological methods to see the best technique available.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "draining seton, endorectal advancement flap, fecal incontinence, high cryptoglandular perianal fistula, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/36176822/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260823213523&v=2.20.1", "date": "Fri, 30 Sep 2022"}], "痔疮": [{"id": "42594997", "title_en": "Comparison of the outcomes of ileal pouch-anal anastomosis and ileorectal anastomosis for patients with familial adenomatous polyposis: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ka-Wai Tam", "abstract_en": "**Background:** Familial adenomatous polyposis (FAP) is an inherited colorectal cancer syndrome for which ileorectal anastomosis (IRA) preserves the rectum but ileal pouch-anal anastomosis (IPAA) removes it. These procedures may influence the risk of desmoid tumors and involve trade-offs in oncologic protection and bowel function. This study compared the oncologic, desmoid, functional, and postoperative outcomes of IRA and IPAA in FAP.\n\n**Methods:** PubMed, Embase, Scopus, and the Cochrane Library were searched for relevant studies. Primary outcomes were rectal or pouch-anal cancer and desmoid tumors. Risk of bias was assessed using the ROBINS-I tool, and certainty of evidence was assessed using the GRADE framework. Random-effects meta-analyses were conducted using pooled risk ratios (RRs), mean differences (MDs), and hazard ratios.\n\n**Results:** Thirty-four studies involving 4,700 patients were included. Compared with IRA, IPAA was associated with lower risks of postoperative rectal and pouch-anal cancer (RR: 0.22, 95% CI: 0.09-0.54) but with a higher risk of desmoid tumors (RR: 1.58, 95% CI: 1.13-2.19). IPAA was associated with higher 24-hour incontinence (RR: 1.90, 95% CI: 1.24-2.92) and 24-hour stool frequency (MD: 1.89 stools/day, 95% CI: 1.29-2.49). Anastomotic stricture was more frequent after IPAA (RR: 2.91, 95% CI: 1.46-5.78), but major complications did not differ substantially between the procedures.\n\n**Conclusions:** IPAA is associated with greater long-term oncologic protection but worse bowel function and a higher desmoid tumor risk compared with IRA. These findings support individualized procedure selection based on surveillance feasibility to balance functional trade-offs, perioperative risk, and durability.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "desmoid tumor, familial adenomatous polyposis, ileal pouch–anal anastomosis, ileorectal anastomosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42594997/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 13 Aug 2026"}, {"id": "42534720", "title_en": "A Systematic Review of Post-surgical Adverse Events Related to Hem-O-Lok Clips: A Commonly Used Device With Potential Complications", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Palanivelraju Gopalakrishnan", "abstract_en": "Since their introduction, Hem-o-lok clips (HOLCs) have become widely accepted and increasingly reliable devices among surgeons performing minimally invasive surgery due to their effectiveness in achieving vascular pedicle control and haemostasis. Although HOLCs are generally regarded as safe devices, various complications have been reported. This review aimed to identify and summarise complications occurring at any time following HOLC use, from their initial introduction in January 1999 through December 2025. This literature review was conducted in accordance with the PRISMA (Preferred Reporting Items for Systematic Reviews and Meta-Analyses) guidelines. A systematic search of PubMed (MEDLINE®), Google Scholar™, ResearchGate, and Embase® was performed using predefined search strings and Boolean operators to identify English-language articles reporting complications associated with HOLC use. The most frequently reported postoperative complications associated with HOLCs occurred after prostatectomy, accounting for 66.23% (n = 51) of all reported cases. The second most common postoperative complication was associated with laparoscopic cholecystectomy, representing 14.28% (n = 11) of cases. The most common complication was clip migration to the urinary bladder with stone formation, accounting for 45.45% (n = 35), followed by urinary bladder neck contracture (14.29%; n = 11), clip migration to the ureter and erosion into the collecting system (14.29%; n = 11), erosion into the duodenum/resulting in duodenal ulcer formation (10.39%; n = 8), and common bile duct (CBD) obstruction (including Mirizzi syndrome or CBD stones) (3.89%; n = 3). Other less frequently reported complications, comprising 11.69% (n = 9), included clip migration to the urinary bladder without stone formation, clip migration to the rectum, erosion into the small intestine, transmural migration to the oesophagus, and anastomotic leak following prostatectomy. Although HOLCs are generally considered safe devices, rare but clinically significant complications have been reported. A high index of clinical suspicion is essential for the early recognition and diagnosis of these complications. The management of HOLC-related complications varies according to the site and nature of the complication but most commonly involves endoscopic retrieval. Conservative management may be appropriate in selected asymptomatic patients.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "eroded hem-o-lock clips, hem-o-lock clips, hem-o-lock clips complication, migrating hem-o-lock clips, perforatinghem-o-lock clip", "link": "https://pubmed.ncbi.nlm.nih.gov/42534720/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 31 Jul 2026"}, {"id": "42503488", "title_en": "Laser Hemorrhoidoplasty versus Excisional Hemorrhoidectomy: The Recovery-Durability Tradeoff in Hemorrhoid Surgery-A Systematic Review of Randomized Trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fernanda Bellotti Formiga", "abstract_en": "BackgroundExcisional hemorrhoidectomy remains the standard for advanced disease, while the applicability of laser hemorrhoidoplasty remains uncertain. This study evaluates the tradeoff between short-term recovery and long-term durability to inform patient-centered decision-making.MethodsA systematic search of PubMed, Web of Science, Scopus, and CENTRAL was conducted through September 2025. Randomized controlled trials (RCTs) comparing diode laser hemorrhoidoplasty with conventional hemorrhoidectomy were included. Pooled risk ratios (RR) and mean differences (MD) with 95% confidence intervals were estimated using random-effects models. Heterogeneity was assessed with the I<sup>2</sup> statistic, and trial sequential analysis (TSA) was performed to explore the robustness of selected outcomes.ResultsFifteen RCTs involving 1099 patients were included. Laser hemorrhoidoplasty was associated with reduced postoperative pain on day 1 (MD -2.02; 95% CI -2.83 to -1.20) and day 7 (MD -2.13; 95% CI -3.06 to -1.20), shorter duration of analgesic use (MD -2.72 days), operative time (MD -12.49 min), intraoperative blood loss (MD -21.63 mL), hospital stay (MD -0.63 days), and earlier return to daily activities (MD -10.78 days). It was also associated with lower rates of postoperative bleeding (RR 0.35), urinary retention (RR 0.29), and anal stenosis (RR 0.12). TSA suggested that some short-term findings may be robust; however, several outcomes remained underpowered, and limited follow-up restricts the interpretation of long-term outcomes.ConclusionLaser hemorrhoidoplasty offers improved short-term recovery but with uncertain long-term durability. Given the low to very low certainty of the evidence and limited follow-up, these findings support a preference-sensitive approach rather than replacing excisional hemorrhoidectomy.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ferguson technique, Milligan-Morgan, diode laser, hemorrhoidectomy, hemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/42503488/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sun, 26 Jul 2026"}, {"id": "42489929", "title_en": "Rethinking congenital anal stenosis: a systematic review with histological observations toward a revised conceptual framework", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Go Miyano", "abstract_en": "The concept of congenital anal stenosis remains poorly defined, encompassing anatomically distinct conditions that may differ in pathogenesis and management. This study aimed to re-evaluate the current concept of congenital anal stenosis through a systematic review and histological examination of representative cases. We conducted a systematic review of English-language publications to assess clinical characteristics, treatment methods, and outcomes in patients diagnosed with congenital anal stenosis. In addition, we performed histological analysis of surgical specimens obtained from two representative surgical cases. Among 28 identified studies involving 70 cases, 50 cases without Currarino syndrome responded well to bougie dilatation or minor anoplasty. In contrast, 20 cases (28.6%) associated with Currarino syndrome showed poor response to conservative treatment and frequently required treatment of associated presacral lesions or more invasive procedures. Histopathological analysis of two representative surgical cases revealed dense fibrosis located between the dentate line and the anal verge, supporting the possibility that anal membranous stenosis can occur as a distinct skin-level lesion. Our findings support reconsidering the terminology of congenital anal stenosis and suggest that congenital skin-level anal stenosis should be distinguished from anorectal stenosis. Further anatomical and histopathological studies are needed to validate this framework.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal membranous stenosis, Anorectal stenosis, Congenital anal stenosis, Currarino syndrome, Heineke–Mikulicz anoplasty, Skin-level anal stenosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42489929/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 23 Jul 2026"}, {"id": "42470776", "title_en": "Assessment of the risk of developing second tumors after pediatric craniospinal irradiation", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ana Cravo Sá", "abstract_en": "**Introduction/Background:** Pediatric craniospinal irradiation is associated with a potential long-term risk of radiation-induced second malignancies because of the greater radiosensitivity and life expectancy of pediatric patients. This study aimed to estimate the incidence and mortality risk of second tumors after pediatric craniospinal radiotherapy, comparing Three-Dimensional Conformal Radiotherapy (3DCRT) and Volumetric Modulated Arc Therapy (VMAT).\n\n**Methods:** A structured literature review with systematic search and study selection was conducted following Preferred Reporting Items for Systematic and Meta-Analyses Search (PRISMA-S) principles to identify published dosimetric studies on pediatric craniospinal irradiation. Mean absorbed dose values for organs at risk were extracted from the included studies and used to estimate lifetime attributable risk (LAR) of cancer incidence and mortality based on the Biological Effects of Ionizing Radiation VII (BEIR VII) report, according to organ, sex, and age at exposure. Deterministic sensitivity analyses were performed using the original and redistributed BEIR VII coefficients for the residual category \"other cancers,\" as well as dose variability scenarios based on D<sub>mean</sub> - SD, D<sub>mean</sub>, and D<sub>mean</sub> + SD.\n\n**Results:** Two studies were included in the final review. VMAT was associated with lower mean absorbed doses for the thyroid, esophagus, heart, liver, lungs, pancreas, bladder, rectum, and eyes, whereas 3DCRT showed lower absorbed doses for the kidneys, intestine, gonads, breast, and lenses. For both techniques, the thyroid, lungs, esophagus, and breast showed the highest estimated incidence and mortality risks, whereas the lowest risks were generally observed for the gonads, rectum, bladder, and kidneys. Estimated risk decreased with increasing age at exposure and was generally higher in females. Sensitivity analyses showed that redistribution of the pooled BEIR VII \"other cancers\" coefficient substantially reduced absolute LAR values for residual-category organs without materially changing the overall comparative pattern between 3DCRT and VMAT.\n\n**Discussion:** These findings suggest that VMAT may reduce estimated long-term risk for several organs, although not uniformly across all organs at risk. The results should be interpreted as comparative model-based estimates, because they were derived from literature-based dose data and BEIR VII risk modelling rather than patient-specific dosimetry.\n\n**Conclusion:** This study provides a comparative and exploratory model-based assessment of second cancer risk after pediatric craniospinal radiotherapy. The findings support the importance of treatment technique selection in pediatric radiotherapy, while indicating that future studies should incorporate individualized treatment planning data and, when feasible, Monte Carlo-based dose reconstruction to improve the precision of absolute risk estimates.\n\n**Plain Language Summary:** Radiation treatment in children can sometimes increase the risk of developing a second cancer later in life. This study reviewed published research and used dose data to estimate longterm cancer risks from two different radiation therapy techniques used for treating the brain and spine in children. This study found that one technique often gave lower doses to several organs, while the other gave lower doses to some different areas, and risk varied by organ, age, and sex. This matters because understanding these differences can help clinicians choose treatment approaches that may reduce longterm risks for children.", "abstract_zh": "**Introduction/background：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** 这些研究结果表明，VMAT 可能会降低多个器官的估计长期风险，尽管并非所有处于风险的器官都一致。结果应解释为基于比较模型的估计，因为它们源自基于文献的剂量数据和 BEIR VII 风险模型，而不是患者特定的剂量测定。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Plain language summary：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Craniospinal irradiation, Pediatrics, Radiotherapy, conformal, Risk assessment, Second primary neoplasms, Volumetric modulated arc therapy", "link": "https://pubmed.ncbi.nlm.nih.gov/42470776/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Sat, 18 Jul 2026"}, {"id": "42455200", "title_en": "Single-stage versus staged reconstruction for high and intermediate anorectal malformations in neonates: a systematic review and meta-analysis", "title_zh": "新生儿高度和中度肛门直肠畸形的单期与分期重建：系统评价和荟萃分析", "authors": "Chieu Minh Vuong", "abstract_en": "The surgical approach to high and intermediate anorectal malformations remains controversial. This systematic review compared continence and infection outcomes between the two approaches. MEDLINE, Embase, and Cochrane CENTRAL were searched per a registered protocol (PROSPERO CRD420261291319). Comparative studies of single-stage versus staged repair in neonates with high or intermediate anorectal malformations were included. Risk of bias was assessed using ROBINS-I. Random-effects meta-analysis with prediction intervals was performed. Four comparative studies (746 patients: 399 single-stage, 347 staged) were included. Pooled analysis showed no significant difference in incontinence outcomes (RR 0.93, 95% CI: 0.52-1.66, p = 0.80; 95% prediction interval: 0.28-3.08) with substantial heterogeneity (I²=83%). Infection data could not be pooled due to methodological concerns in outcome reporting. All included studies demonstrated moderate to serious risk of bias. GRADE certainty was LOW for incontinence and VERY LOW for infection. Current evidence does not demonstrate superiority of either approach for bowel continence (LOW certainty). Infection evidence was insufficient for synthesis (VERY LOW). Wide prediction intervals indicate substantial uncertainty; available data cannot confirm or refute inferior outcomes after single-stage repair. Prospective studies with standardized outcomes are needed. Protocol registration: PROSPERO CRD420261291319.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformations, Fecal incontinence, Meta-analysis, Neonatal surgery, Posterior sagittal anorectoplasty, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/42455200/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42449595", "title_en": "Macrophage Polarization as a Target for Colorectal Cancer Treatment Optimization: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Susan Galandiuk", "abstract_en": "<b>Background:</b> Colorectal cancer (CRC) remains a leading cause of cancer-related mortality worldwide, with poor survival rates of late-stage disease. While immune checkpoint blockade (ICB) therapy has transformed treatment for mismatch repair-deficient (MMRd)/microsatellite instability-high (MSI-H) tumors, most CRC cases are mismatch repair-proficient (MMRp)/microsatellite-stable (MSS) and derive little to no benefit from current immunotherapy regimens. Tumor-associated macrophages (TAMs) constitute a significant component of the tumor microenvironment (TME) and exhibit a phenotypic gradient between pro-inflammatory (M1-like) and anti-inflammatory, immunosuppressive (M2-like) states. Although their polarization status is increasingly recognized as a key modulator of immunotherapy efficacy in CRC, a comprehensive synthesis of the literature regarding macrophage polarization and its relevance to improving CRC immunotherapy remains lacking. <b>Methods:</b> A systematic literature search was conducted across PubMed, EMBASE, and ScienceDirect from inception to December 2025 using terms encompassing macrophages, immunotherapy, immune checkpoint expression, colorectal cancer, and microsatellite stability status. Title, abstract, and full-text screening were performed independently by multiple authors. Sixty-five studies were included following PRISMA guidelines. The protocol was prospectively registered on PROSPERO (ID: CRD420251244320). <b>Results:</b> Three key themes were identified: (1) macrophage-mediated mechanisms of resistance to ICB, including M2 polarization driven by the PI3Kγ, STAT3, mTOR, and SIRT-1 axes, immunosuppressive cytokine production (IL-10, TGF-β), and altered immune checkpoint ligand expression; (2) macrophage polarization status and associated biomarkers as prognostic indicators of therapeutic response; (3) emerging macrophage-targeted therapeutic strategies in ongoing clinical trials, including CSF1R inhibitors, CD40 agonists, CD47/SIRPα blockade, and STING agonists. <b>Conclusions:</b> TAM polarization is a critical determinant of immunotherapy resistance and patient prognosis in CRC. Macrophage-targeted strategies, particularly M2-to-M1 repolarization approaches used in combination with existing ICB regimens, represent a promising avenue for expanding immunotherapy efficacy beyond MSI-H disease. Further translational research and randomized controlled trials are needed to validate these targets clinically.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, immunotherapy, macrophage polarization, microsatellite instability, tumor-associated macrophage", "link": "https://pubmed.ncbi.nlm.nih.gov/42449595/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42398078", "title_en": "Single-stapling versus double-stapling technique for rectal anastomosis-meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jim Tiernan", "abstract_en": "**Introduction:** The single-stapling technique (SST) is an alternative to the conventional double-stapling technique (DST), particularly in low rectal surgery. This systematic review and meta-analysis compared anastomotic leak (AL) between SST and DST.\n\n**Methods:** A systematic review of the PubMed/MEDLINE, Google Scholar®, and Scopus databases was conducted in accordance with PRISMA guidelines from inception through December 2025. The primary outcome of interest was AL. A random-effects meta-analysis was used to compare AL, blood loss, operative time, and length of hospital stay between SST and DST. Risk ratios (RRs) were calculated for dichotomous outcomes and mean differences or standardized mean differences were calculated for continuous outcomes. Sensitivity and subgroup analyses were conducted according to surgical approach. Risk of bias was assessed, and the certainty of the evidence for AL was evaluated using the GRADE framework.\n\n**Results:** Of 448 articles screened, 14 were included (2 randomized, 12 observational studies), comprising 1326 patients in the SST group and 1720 in the DST group. SST was associated with a significantly lower risk of AL than DST (RR 0.61; 95% confidence interval 0.42 to 0.90; P = 0.012), with moderate heterogeneity. Sensitivity analysis excluding studies with zero events yielded consistent results. Subgroup analyses showed no difference in AL for open intracorporeal SST compared with DST, a trend toward benefit with minimally invasive intracorporeal SST compared with DST, and a pronounced reduction in AL with transanal SST compared with DST.\n\n**Conclusions:** Although the causes of AL are multifactorial, with respect to the stapling technique, SST was associated with a lower risk of AL than DST, and this effect was primarily driven by transanal SST. However, the certainty of evidence is low, and ongoing prospective studies will better define the role of SST.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s ostoperative pain, time to return to routine activities, and recurrence. Secondary outcomes were operative time, length of hospital stay, and complications. The risk of bias was assessed using the RoB2 and ROBINS-I V2 tools. Meta-analyses were performed with a random-effects model. The certainty of evidence was evaluated using the GRADE approach.\n\n**Results:** Data from 461 patients (213 LHP, 248 LigH) across five studies were analyzed. Patients in the LHP group reported significantly lower pain scores on postoperative day 1 (MD: - 1.61 points; p = 0.025), earlier return to routine activities (MD: -5.75 days; p = 0.0002), shorter operative time (MD: -6.5 min; p = 0.002), and shorter hospital stay (MD: -0.3 days; p < 0.0001) compared to the LigH group. Conversely, LigH demonstrated a significantly lower risk of recurrence (RD: 0.12; 95% CI: [0.05, 0.19]). No significant differences were observed regarding postoperative bleeding, wound infection, urinary retention, or thrombosis.\n\n**Conclusion:** LHP yields better perioperative outcomes, including less pain and faster recovery, making it a favorable option for patient comfort. However, LigH has lower recurrence rates. The certainty of evidence is very low. Further high-quality randomized trials are needed to confirm these results.", "abstract_zh": "**背景：** 已经开发出许多外科手术来治疗痔疮疾病。尽管传统的切除技术是有效的，但它们也会带来明显的术后疼痛和较长的恢复时间。因此，人们引入了更新的技术来解决这些问题，包括激光痔疮成形术 (LHP) 和 LigaSure 痔疮切除术 (LigH)。这项系统评价和荟萃分析旨在比较这两种方法的围手术期结果和复发情况。\n\n**方法：** 截至 2025 年 12 月，我们在 PubMed、Scopus、Web of Science、Cochrane Library、ClinicalTrials.gov 和 Google Scholar 上进行了全面检索。我们纳入了涉及患有 II-IV 级痔疮的成人的所有符合条件的研究。主要结局包括术后疼痛、恢复日常活动的时间和复发。次要结局是手术时间、住院时间和并发症。使用 RoB2 和 ROBINS-I V2 工具评估偏倚风险。使用随机效应模型进行荟萃分析。使用 GRADE 方法评估证据的确定性。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, Laser Hemorrhoidoplasty, LigaSure, Meta-analysis, Systematic Review", "link": "https://pubmed.ncbi.nlm.nih.gov/42374341/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 29 Jun 2026"}, {"id": "42348182", "title_en": "Long-term impact of haemorrhoidal artery ligation on anal function and continence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A Arif", "abstract_en": "**Aims:** Haemorrhoidal artery ligation (HALO) and variants including Doppler-guided HAL (DG-HAL), HAL with rectoanal repair (HAL-RAR), and transanal haemorrhoidal dearterialisation (THD) serve as minimally invasive alternatives to excisional haemorrhoidectomy, reducing pain while preserving sphincter function. Long-term faecal incontinence remains a concern due to its quality-of-life impact. This systematic review assessed prevalence, severity, and patterns of incontinence beyond six months post-procedure across HAL techniques.\n\n**Methods:** PRISMA 2020 guidelines directed searches of PROSPERO, MEDLINE, PubMed, Scopus, Cochrane Library, and ScienceDirect for 2015-2024 studies reporting continence >6 months after HAL-based procedures. Six studies (3 RCTs, 1 prospective, 2 retrospective cohorts; total n=671 patients) met PICOS criteria, with Wexner Incontinence Scores reported or retrospectively mapped. Quality appraisal used CASP Cohort Checklist.\n\n**Results:** Seventeen (2.5%) of 671 patients developed postoperative faecal incontinence. Of these, 14 (82%) cases were mild (Wexner 1-4) and transient, resolving within 3-6 months; 3 (18%) were moderate (Wexner 5-8), primarily in HAL-RAR (9/158 [5.7%]). Standard HAL showed 0/76 (0%) cases; THD had 1/104 (1.0%); DG-HAL had 7/293 (2.4%). No severe incontinence occurred.\n\n**Discussion:** HALO techniques demonstrate excellent long-term continence safety (overall 2.5% low-grade incontinence). HAL-RAR's higher risk (5.7%) warrants counselling. Standardised scoring and multicentre trials are recommended.", "abstract_zh": "**Aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 671 名患者中有 17 名（2.5%）出现术后大便失禁。其中，14 例 (82%) 病例为轻度 (Wexner 1-4) 且短暂，在 3-6 个月内消退； 3 (18%) 为中等 (Wexner 5-8)，主要是在 HAL-RAR (9/158 [5.7%]) 中。标准 HAL 显示 0/76 (0%) 例； THD为1/104（1.0%）； DG-HAL 为 7/293 (2.4%)。没有发生严重失禁。\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42348182/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 25 Jun 2026"}, {"id": "42341213", "title_en": "Hospital and surgeon volume versus outcomes after colorectal cancer surgery: umbrella review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Francesco Giovinazzo", "abstract_en": "**Background:** An inverse relationship between surgical volume and outcomes has been suggested, with higher-volume hospitals and surgeons achieving better results, prompting debate over the centralization of surgical services. However, minimum volume thresholds are unclear, and volume is a poor proxy for quality. Despite the significant global burden of colorectal cancer, the benefits of high-volume care remain uncertain. This umbrella review synthesized the evidence on volume-outcome associations in colorectal surgery.\n\n**Methods:** An umbrella review (PRISMA 2020) was conducted to evaluate systematic reviews and meta-analyses of the hospital/surgeon volume-outcome relationship in colorectal cancer. The Cochrane Library, PubMed, Embase, and MEDLINE were searched to 1 October 2025. Volume definitions and outcomes were extracted and meta-analysed by subgroup. A MeaSurement Tool to Assess Systematic Reviews 2 and Risk of Bias in Systematic Reviews were used for analysis of bias.\n\n**Results:** A total of 150 unique records was identified, with 10 systematic reviews meeting the inclusion criteria. High- versus low-volume hospitals demonstrated an inverse relationship in terms of postoperative mortality following resection for rectal cancer (fixed- and random-effects models: odds ratio 0.73, 95 per cent confidence interval 0.64 to 0.82), colon cancer (fixed-effect model: odds ratio 0.74, 0.70 to 0.78; random-effects model: odds ratio 0.75, 0.69 to 0.81), and colorectal cancer (fixed- and random-effects models: odds ratio 0.77, 0.67 to 0.88). High- versus low-volume surgeons demonstrated an inverse relationship with respect to postoperative mortality following resection for rectal cancer (fixed- and random-effects models: odds ratio 0.69, 0.59 to 0.81), colon cancer (fixed-effect model: odds ratio 0.70, 0.63 to 0.77; random-effects model: odds ratio 0.68, 0.55 to 0.85), and colorectal cancer (fixed- and random-effects models: odds ratio 0.67, 0.60 to 0.74). There were no consistent significant differences in rates of the secondary outcomes (anastomotic leak rate, permanent stoma formation, local recurrence rate, rate of abdominoperineal excision of the rectum).\n\n**Conclusion:** High-volume hospitals and surgeons are associated with both improved short- and long-term outcomes for patients undergoing colorectal cancer surgery. However, a specific cut-off definition for high- versus low-volume hospitals and surgeons is yet to be elucidated owing to the heterogeneity of existing volume definitions. Future studies are required to confirm a threshold for this dose-response relationship.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 进行了一项总体评价（PRISMA 2020），以评估医院/外科医生结直肠癌治疗量与结果关系的系统评价和荟萃分析。 Cochrane 图书馆、PubMed、Embase 和 MEDLINE 的检索时间截至 2025 年 10 月 1 日。按亚组提取卷定义和结果并进行荟萃分析。使用评估系统评价的测量工具 2 和系统评价中的偏倚风险进行偏倚分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "centralization, health services research, volume–outcome relationship", "link": "https://pubmed.ncbi.nlm.nih.gov/42341213/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 24 Jun 2026"}, {"id": "42330709", "title_en": "Systematic review and Bayesian network meta-analysis comparing multiple anastomotic techniques after total mesorectal excision in rectal cancer", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jacques Marescaux", "abstract_en": "**Background:** Although several studies have performed pairwise comparisons of individual anastomotic techniques after total mesorectal excision (TME) for rectal cancer, there is a lack of comprehensive analyses, which simultaneously evaluate multiple techniques. This study aims to perform a systematic review and Bayesian network meta-analysis to compare the various anastomotic methods used after TME.\n\n**Methods:** This systematic review and Bayesian network meta-analysis included both randomized controlled trials (RCTs) and non-RCTs which evaluated outcomes of various anastomotic techniques in patients with rectal cancer undergoing TME. The techniques assessed included immediate handsewn anastomosis, delayed Turnbull-Cutait anastomosis (TCA), double-stapling technique (DST), and transanal transection and single-stapled (TTSS) anastomosis. The primary outcome was the proportion of anastomotic leakage (AL). Secondary outcomes included overall postoperative morbidity and postoperative anorectal function.\n\n**Results:** A total of 13 studies were included, comprising two RCTs and 11 non-RCTs, with a combined total of 2710 patients. TTSS was associated with a lower proportion of AL as compared to both the DST group (RR: 0.43, 95% CrI: 0.21-0.87) and the immediate handsewn group (RR: 0.35, 95% CrI: 0.13-0.74). TCA was also associated with a significantly lower proportion of AL as compared to the immediate handsewn group (RR: 0.42, 95% CrI: 0.21-0.80). No statistically significant differences were observed between groups regarding overall postoperative morbidity or anorectal function.\n\n**Conclusions:** The findings of this study suggest that TTSS may be associated with a lower risk of postoperative AL after TME for rectal cancer; however, the certainty of evidence was low, and the findings should be interpreted with caution.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomosis, Proctocolectomy, Rectal neoplasms, Restorative, Surgical, Transanal transection and single-stapled anastomosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42330709/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 22 Jun 2026"}, {"id": "42262727", "title_en": "Clinical significance of isolated periappendiceal red patch in ulcerative colitis: A systematic review, meta-analysis, and meta-regression", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Terrence A Barrett", "abstract_en": "**Objectives:** Ulcerative colitis (UC) is characterized by continuous mucosal inflammation beginning in the rectum with variable proximal extension. However, up to 17% of patients demonstrate patchy cecal inflammation known as a periappendiceal red patch (PARP). Although PARP has historically been linked to severe disease and worse outcomes, its long-term clinical significance remains unclear. We conducted a systematic review and meta-analysis to evaluate outcomes in UC patients with isolated PARP.\n\n**Methods:** A comprehensive literature search of MEDLINE, Embase, Scopus, and Cochrane CENTRAL was performed to identify studies comparing UC patients with and without endoscopic or histologic evidence of PARP. Meta-analysis was conducted using R (version 4.4.3). Pooled odds ratios (ORs) with 95% confidence intervals (CIs) were calculated, and between-study heterogeneity was assessed using Higgins' I2 statistic.\n\n**Results:** Thirteen nonrandomized studies, including 2289 UC patients (PARP+: 725; PARP-: 1564), were analyzed. PARP was significantly associated with higher odds of proctitis (OR, 1.54; 95% CI, 1.09-2.18; P = .02). No significant associations were observed between PARP and left-sided colitis (OR, 0.88; 95% CI, 0.57-1.35; P = .51) or extensive colitis (OR, 0.84; 95% CI, 0.50-1.41; P = .45). PARP was not associated with disease progression, pharmacotherapeutic escalation, or colectomy. However, moderate-to-high heterogeneity was observed across most of the outcomes.\n\n**Conclusion:** PARP is more frequently observed in patients with ulcerative proctitis but does not appear to influence long-term disease progression or major clinical outcomes, supporting its classification as a benign endoscopic finding in UC.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "appendectomy, appendiceal orifice inflammation, periappendiceal red patch, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/42262727/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Tue, 09 Jun 2026"}, {"id": "42223567", "title_en": "Resection quality and oncologic outcomes after robotic versus laparoscopic total mesorectal excision for mid and low rectal cancer: a systematic review and meta-analysis of randomised trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vignesh Narasimhan", "abstract_en": "Total mesorectal excision (TME) for mid and low rectal cancer is technically demanding, and resection quality strongly influences local control and survival. Robotic platforms may offer technical advantages over conventional laparoscopy, but oncologic benefits remain uncertain. This meta-analysis evaluates resection quality and early oncologic outcomes using evidence exclusively from randomised trials. A PRISMA aligned systematic review of MEDLINE, Embase, CENTRAL and Google Scholar was performed to 22 September 2025. Eligible studies were parallel-group randomised controlled trials comparing robotic with laparoscopic TME for mid or low rectal adenocarcinoma, defined as tumour height of 10 cm or less from the anal verge. Co-primary outcomes were circumferential resection margin (CRM) positivity and completeness of the mesorectum. Secondary outcomes included conversion to open surgery, intraoperative complications, and three-year locoregional recurrence, disease-free survival, and overall survival. Odds ratios and hazard ratios were pooled using random effects models. Four randomised trials met inclusion, enrolling 1,952 patients. Robotic TME reduced CRM positivity (OR 0.58, 95% CI 0.38 to 0.87) and increased complete TME rates (OR 1.55, 95% CI 1.14 to 2.12). Conversion to open surgery was less frequent with robotics (OR 0.41, 95% CI 0.21 to 0.79). Intraoperative and early postoperative complications did not differ. Two trials reported three-year oncologic outcomes. Robotic TME was associated with lower three-year locoregional recurrence (OR 0.43, 95% CI 0.23-0.81) and a modest improvement in disease-free survival (HR 0.78, 95% CI 0.61-0.99), although event rates were low and estimates should be interpreted cautiously. Overall survival did not differ (HR 0.79, 95% CI 0.57-1.11). In mid and low rectal cancer, robotic TME was associated with improved pathological resection quality and lower conversion rates compared with laparoscopic TME, without clear differences in early perioperative morbidity There is emerging evidence of improved three-year locoregional recurrence and disease-free survival.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "腹腔镜全直肠系膜切除术、机器人手术、机器人全直肠系膜切除术、全直肠系膜切除完整性", "keywords_en": "Laparoscopic total mesorectal excision, Robotic surgery, Robotic total mesorectal excision, Total mesorectal excision completeness", "link": "https://pubmed.ncbi.nlm.nih.gov/42223567/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 01 Jun 2026"}, {"id": "42189252", "title_en": "The impact of the number of stapler firings on anastomotic leakage in minimally invasive rectal surgery: risk factor or technical marker of complexity? A systematic review, meta-analysis, and metaregression", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Matteo Rottoli", "abstract_en": "**Background:** Anastomotic leakage is a major complication after minimally invasive anterior resection for rectal cancer. The number of stapler firings for rectal transection has been suggested as a modifiable risk factor, but its independent role and optimal threshold remain unclear.\n\n**Objective:** To evaluate the impact of the number of stapler firings on anastomotic leakage after rectal surgery and to assess the influence of surgical and patient-related variables.\n\n**Data Sources:** A comprehensive search of PubMed, Cochrane Library, and Ovid MEDLINE was performed.\n\n**Study Selection:** Studies reporting anastomotic leakage rates stratified by stapler firing count (one, two, or three or more) were included.\n\n**Intervention(S):** Rectal transection with one or more stapler firings during minimally invasive anterior resection for rectal cancer.\n\n**Main Outcome Measures:** Incidence of anastomotic leakage according to stapler firing (SF) count.\n\n**Results:** Twenty two studies including 8,725 patients and 784 anastomotic leakage events were analyzed. A single stapler firing was associated with a significantly reduced risk of anastomotic leakage compared with two stapler firings (odds ratio 0.57, 95% confidence interval 0.39-0.83), three or more stapler firings (odds ratio 0.28, 95% confidence interval 0.16-0.51), and two or more stapler firings (odds ratio 0.46, 95% confidence interval 0.34-0.63). The risk of anastomotic leakage was lower with fewer than three stapler firings compared with three or more stapler firings (odds ratio 0.38, 95% confidence interval 0.30-0.48). Meta-regression identified low rectal transection and preoperative radiotherapy as significant effect modifiers.\n\n**Limitations:** All included studies were observational, introducing potential bias and increased heterogeneity and the certainty of evidence was low across all comparisons.\n\n**Conclusions:** Three or more stapler firings were consistently associated with a higher risk of anastomotic leakage. However, because the certainty of evidence was low and owing to exploratory meta-regression findings, stapler firing number appears to reflect operative complexity more than a definitively established independent causal risk factor.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study selection：** 报告包括按吻合器发射次数（一次、两次、三次或更多）分层的吻合口漏率的研究。\n\n**Intervention(s)：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Main outcome measures：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Er cluded.\n\n**Results:** A total of 52 studies including 10,596 patients were included. The pooled prevalence of mismatch repair deficiency (MMRd) and microsatellite instability-high (MSI-H) in Hispanic/Latino populations was 15% (95% CI: 10%-20%; I<sup>2</sup> = 89.6%) and 18% (95% CI: 13%-24%; I<sup>2</sup> = 84.0%), respectively. Costa Rica and Mexico had the highest MMRd prevalence (30% and 24%), while Uruguay showed the highest MSI-H prevalence (45%). MSI-H was significantly associated with female sex (OR: 1.83) and right-sided tumors (OR: 8.16). MMRd was associated with right-sided tumors compared with the rectum (OR: 1.73) and the left colon (OR: 5.65).\n\n**Conclusions:** This meta-analysis underscores the unique prevalence of MMRd and MSI-H in Hispanics, highlighting regional variations and the need for broader representation.", "abstract_zh": "**背景：** 结直肠癌 (CRC) 是全球第三大常见癌症，拉丁美洲的病例不断增加。 MSI-H 和 MMRd 在 CRC 中发挥关键作用，但有关其在西班牙裔/拉丁裔人群中患病率的数据有限。这项研究评估了该地区的这些生物标志物。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Colorectal carcinoma, Hispanic/Latino population, MSI-high, Mismatch repair", "link": "https://pubmed.ncbi.nlm.nih.gov/42165902/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Thu, 21 May 2026"}, {"id": "42143002", "title_en": "Ultrasound for image-guided brachytherapy in cervical cancer: Geometric accuracy and dosimetric evidence compared with MRI and CT", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kelvin Ken Yu", "abstract_en": "**Purpose:** Cervical cancer is the fourth most common cancer worldwide, with the highest burden in low- and middle-income countries (LMICs). Image-guided brachytherapy (IGBT) with magnetic resonance imaging (MRI) is the gold standard, but access is limited in many regions. Ultrasound (US), being portable and cost-effective, has been proposed as an alternative to three-dimensional (3D) imaging with MRI or computed tomography (CT). This study systematically reviews and meta-analyzes evidence comparing US with MRI and CT in cervical cancer brachytherapy.\n\n**Methods:** A systematic search (2000-2025) was conducted in PubMed, Science Direct, EBSCOhost, Cochrane Library, and Wiley (PROSPERO: CRD420251121697). Nineteen studies (n = 5-295 patients) were included, comprising prospective, retrospective, and pilot designs. Outcomes included tumor and organ-at-risk (OAR) dimensions, dosimetry, and reproducibility. Random-effects meta-analyses were performed, with heterogeneity assessed using I², and sensitivity and subgroup analyses conducted.\n\n**Results:** Across geometric parameters (height, width, thickness, volume), pooled analyses demonstrated no significant differences between US and 3D imaging, except for a small reduction in tumor thickness favoring US that was not sustained in sensitivity analyses. Dosimetric parameters, including target coverage (D90) and OAR doses (D2cc bladder, rectum, sigmoid), also showed no significant differences. Reproducibility analyses using coefficient of variation demonstrated comparable consistency between modalities.\n\n**Conclusion:** Ultrasound yields geometric and dosimetric outcomes broadly comparable to MRI and CT, with added benefits of affordability, portability, and workflow integration. These findings support US as a feasible and reliable alternative for IGBT, particularly in LMICs, erative outcomes after rectal defect closure versus leaving the defect open following full-thickness (FT) excision. Odds ratios (ORs) and standardized mean differences (SMDs) with 95% confidence intervals (CIs) were calculated. Heterogeneity was assessed using Cochrane's Q test. Risk of bias and certainty of evidence were judged by ROBINS-I and GRADE, respectively.\n\n**Results:** Six comparative studies meeting the inclusion criteria were included in the final analysis. Closing the rectal defect was associated with significantly reduced rectal bleeding (OR = 0.57, 95% CI: 0.35-0.94, p = 0.03; I<sup>2</sup> = 26%) and re-admission rates (OR = 0.34, 95% CI: 0.16-0.76, p = 0.008; I<sup>2</sup> = 0%) compared with the open group, while other outcomes were not significantly different. A prolonged operative time was noted when the rectal wall defect was sutured (SMD = 0.15, 95% CI: 0.03-0.28, p = 0.02; I<sup>2</sup> = 44%).\n\n**Conclusions:** The present analysis revealed that both approaches are safe and technically feasible; however, closing the rectal wall defect after FT excision of rectal neoplasms was associated with lower bleeding and re-admission rates. Nevertheless, randomized studies with homogeneous protocols and consistent long-term outcome data are still needed to provide definitive answers.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Defect closure, Postoperative morbidity, Rectal excision, TAMIS, TEM, Transanal surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/42141324/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Fri, 15 May 2026"}, {"id": "42126654", "title_en": "Robotic versus laparoscopic low anterior resection for rectal cancer: an updated systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Dimitrios Schizas", "abstract_en": "Robotic surgery has increasingly been adopted for the treatment of rectal cancer. However, most previous meta-analyses included heterogeneous rectal procedures, limiting conclusions specific to low anterior resection. The present study aimed to provide an updated systematic review and meta-analysis comparing robotic versus laparoscopic low anterior resection for rectal cancer. This systematic review and meta-analysis was conducted according to PRISMA guidelines and recommendations from the Cochrane Handbook. PubMed, Scopus, and the Cochrane Library were systematically searched from inception to the most recent date. Comparative studies evaluating robotic low anterior resection (R-LAR) versus laparoscopic low anterior resection (L-LAR) for rectal cancer were included. Risk of bias was assessed using RoB 2 for randomized trials and ROBINS-I for non-randomized studies. Certainty of evidence was evaluated using the GRADE approach. Thirty-three studies including 82,149 patients were analyzed (R-LAR: 56,290; L-LAR: 25,859). R-LAR was associated with a significantly lower conversion rate (OR 0.45, 95% CI 0.40-0.51, p < 0.00001, I²=28%), lower 30-day reoperation rate (OR 0.86, 95% CI 0.77-0.96, p = 0.01, I²=0%), reduced 30-day mortality (OR 0.65, 95% CI 0.52-0.82, p = 0.002, I²=0%), and higher rate of complete total mesorectal excision (OR 2.71, 95% CI 1.38-5.33, p = 0.01, I²=72%). Operative time was significantly longer in the robotic group (MD + 30.58 min, 95% CI 13.71-47.45, p = 0.001, I²=97%). No significant differences were observed for estimated blood loss, overall complications, major complications, anastomotic leakage, postoperative ileus, recovery parameters, length of hospital stay, readmission, circumferential margin positivity, lymph node yield, local recurrence, diverting ileostomy formation, disease-free survival, or overall survival. Robotic LAR may reduce conversion, reoperation, and short-term mortality and may improve completeness of total mesorectal excision, although operative time is longer. These findings suggest potential technical advantages of R-LAR, but high-quality randomized trials are required to determine whether these translate into meaningful clinical benefit.PROSPERO: CRD420261326600.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Laparoscopic, Low anterior resection, Meta-analysis, Rectal cancer, Robotic", "link": "https://pubmed.ncbi.nlm.nih.gov/42126654/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Wed, 13 May 2026"}, {"id": "42112665", "title_en": "Vascular and Wound-Healing Implications of Single-Stage Versus Multistage Repair of Anorectal Malformations: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jingming Zhao", "abstract_en": "**Background:** Anorectal malformations (ARMs) are managed using either single-stage or multistage surgical repair. However, concerns persist regarding wound-related complications and long-term functional outcomes, which remain inconsistently reported across surgical approaches.\n\n**Objective:** To compare wound-related complications and long-term functional outcomes following single-stage versus multistage repair of ARMs, with emphasis on wound perfusion, dehiscence, and vascular healing dynamics.\n\n**Methods:** A systematic review and meta-analysis were conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines and registered in the International Prospective Register of Systematic Reviews (PROSPERO; CRD420251006245). PubMed and the Cochrane Central Register of Controlled Trials (CENTRAL) were searched for studies published between 2000 and 2024 comparing single-stage and staged ARM repair in neonates and infants. Outcomes included wound dehiscence, surgical site infection (SSI), stenosis, prolapse, redo surgery, constipation, soiling, and voluntary bowel movements. Pooled odds ratios (ORs) with 95% confidence intervals (CIs) were calculated using a random-effects model. Study quality was assessed using the Methodological Index for Non-Randomized Studies (MINORS).\n\n**Results:** Nineteen studies involving 1,972 patients were included. Single-stage repair was associated with a significantly higher risk of wound dehiscence (OR 3.31; 95% CI 1.90-5.79; <i>p</i> < 0.0001), while no significant differences were observed for SSI, stenosis, prolapse, redo surgery, constipation, soiling, or voluntary bowel movements. Moderate to high heterogeneity was noted for selected outcomes.\n\n**Conclusions:** Single-stage repair provides comparable infection rates and long-term functional outcomes to multistage surgery but carries an increased risk of wound dehiscence. Optimizing tissue perfusion and minimizing tension are essential to improve outcomes.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** al activities. Our literature review found that there were 181 species belonging to 147 genera and 78 families used to treat hemorrhoids among 18 ethnic groups. The most cited species were <i>Cissus quadrangularis</i>, <i>Biancaea sappan</i>, <i>Croton persimilis</i>, <i>Mimosa pudica</i>, <i>Aegle marmelos</i>, <i>Leea indica</i>, <i>Plumbago indica</i>, <i>Rotheca serrata</i>, and <i>Tectona grandis</i>. Prevalent pharmacological activities such as anti-inflammatory, anti-oxidative, anti-microbial, anti-hemorrhoid, analgesic, and vasorelaxant activities are found in key species used for hemorrhoid treatment. This study identifies the most important species for ethnopharmacological explorations in hemorrhoid treatments, which is expected to inspire the selection of medicinal plants for development into pharmaceutical products.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Rid Si Duang, Thai medicine, anti-inflammatory plants, piles, quantitative ethnobotany, traditional", "link": "https://pubmed.ncbi.nlm.nih.gov/42110541/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260823213810&v=2.20.1", "date": "Mon, 11 May 2026"}, {"id": "42069871", "title_en": "Clinical and surgical management of recto-urinary fistula after radical prostatectomy: a systematic review on current evidence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Marco Bandini", "abstract_en": "**Background:** Management of rectourinary fistula (RUF) is challenging due to limited data and variability in presentation and treatment. We conducted a systematic review of radical prostatectomy (RP)-related RUF to assess clinical features, diagnostics, treatments, and outcomes, and to propose a structured algorithm to guide management.\n\n**Methods:** We conducted a systematic review in accordance with PRISMA guidelines to evaluate the clinical presentation, diagnostic strategies, management approaches, and outcomes of RUF following RP. A comprehensive search of PubMed, Embase, and Web of Science was performed from database inception to January 2025. Data were extracted on patient demographics, symptoms, diagnostic modalities, management strategies, surgical repair techniques and treatment outcomes.\n\n**Results:** A total of 455 cases of RUF following RP were identified across 34 studies. The reported incidence of RUF ranged from <0.01% to 1.5%. The most frequent presenting symptoms were urine leakage per rectum (60.7%), fecaluria (44.1%), and pneumaturia (50.0%). Fecal and/or urinary diversion was utilized in over 60% of cases, with a median stoma duration of 3 months and an indwelling urinary catheter duration of 1 month. Conservative management (observation, fluid replacement and antibiotic therapy) was attempted in a minority of patients and was generally associated with success rates below 50%. Surgical repair was performed in nearly all cases, with the transperineal and transsphincteric approaches being the most commonly employed techniques. The median time to fistula closure ranged from 0.5 to 30 months, with reported surgical success rates varying between 41% and 100%. We propose a management flowchart based on our clinical experience, outlining the diagnostic and therapeutic approach to rectal injury and RP-related RUF.\n\n**Conclusions:** RUF after RP remains a challenging complication, often requiring stepwise management. Conservative treatments rarely succeed, and surgery is often necessary. Our proposed algorithm aims to standardize the approach to RI and RUF, guiding treatment decisions and improving outcomes.", "abstract_zh": "**背景：** Error 500 (Server l transmission was 47% (95% CI: 39%-55%). Among maternal isolates, serotypes V (27%; 95% CI: 23%-32%), Ia (24%; 95% CI: 19%-29%), III (23%; 95% CI: 19%-26%), and II (19%; 95% CI: 13%-25%) were most frequently detected. Among neonatal isolates, serotypes V (31%; 95% CI: 22%-41%), Ia (26%; 95% CI: 17%-35%), III (23%; 95% CI: 15%-31%), and II (15%; 95% CI: 12%-19%) were identified. AMR was high for tetracycline (87%; 95% CI: 85%-88%) and cotrimoxazole (75%; 95% CI: 72%-78%), and low for β-lactams, including ampicillin (10%; 95% CI: 9%-12%) and penicillin (9%; 95% CI: 8%-11%).\n\n**Conclusion:** The prevalence of maternal GBS rectovaginal colonization and vertical transmission in Africa is high and comparable to global estimates, but there were marked regional variations. The predominance of serotypes V, Ia, and III supports their inclusion in multivalent vaccine formulations. Widespread resistance to tetracycline and cotrimoxazole and moderate macrolide resistance highlight the need for antimicrobial stewardship and ongoing surveillance.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Africa, Antimicrobial resistance, Group B Streptococcus, Pregnant women, Serotypes, Vertical transmission", "link": "https://pubmed.ncbi.nlm.nih.gov/42001933/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff
