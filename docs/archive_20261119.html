s, with year 2010 reporting the strongest association. The systematic review of 37 studies highlighted VAPP occurrence within 2 months to 4 years post-vaccination, typically with acute flaccid paralysis. Immunodeficiency and perianal abscess emerged as major risk factors. Out of the 37 included studies, 27 showed consistent causal association of VAPP with OPV using WHO-AEFI causality assessment tool.\n\n**Conclusion:** The study emphasized the seriousness of VAPP and highlights its association with OPV, identifying immunodeficiency as a prominent contributor to VAPP manifestation.", "abstract_zh": "Vaccine-associated paralytic poliomyelitis (VAPP) is a rare adverse event of oral poliovirus vaccines (OPV), particularly affecting immunodeficient individuals.\n\nThis study aimed to (1) Assess the association between OPV and VAPP using Vaccine Adverse Event Reporting System (VAERS) database (2) Outline patient characteristics and risk factors associated with the occurrence of VAPP in OPV recipients through a systematic review of case reports and case series. A disproportionality analysis was conducted using the data from VAERS, encompassing adverse events reported from 1990 till February 2023. Additionally, we conducted a systematic review of case reports and case series using PubMed, Scopus, and Embase databases.\n\nThe VAERS data revealed 130 VAPP reports among 1,739,903 OPV linked adverse events, with year 2010 reporting the strongest association. The systematic review of 37 studies highlighted VAPP occurrence within 2 months to 4 years post-vaccination, typically with acute flaccid paralysis. Immunodeficiency and perianal abscess emerged as major risk factors. Out of the 37 included studies, 27 showed consistent causal association of VAPP with OPV using WHO-AEFI causality assessment tool.\n\nThe study emphasized the seriousness of VAPP and highlights its association with OPV, identifying immunodeficiency as a prominent contributor to VAPP manifestation.", "keywords_zh": "Case report, OPV, VAPP, causality, immunodeficiency, polio", "keywords_en": "Case report, OPV, VAPP, causality, immunodeficiency, polio", "link": "https://pubmed.ncbi.nlm.nih.gov/38813942/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 30 May 2024"}, {"id": "38563064", "title_en": "A systematic review and meta-analysis of the use of packing in the management of perianal abscesses", "title_zh": "A systematic review and meta-analysis of the use of packing in the management of perianal abscesses", "authors": "Ome Padfield", "abstract_en": "**Background:** Perianal abscesses are common presentations and reasons for emergency general surgery admissions. Management involves incision and drainage of the abscess and packing the cavity with internal wound dressings. This meta-analysis aimed to assess in adults if packing an abscess or leaving it unpacked leads to a significant difference in the outcomes of pain on wound dressing, time to healing, rate of fistulation and abscess recurrence.\n\n**Methods:** Randomised controlled trials (RCTs) with participants aged 18 years or older that compared packing of perianal abscess cavities with no packing between 2002 and 2022 were searched for in December 2022 on OVID Medline and Embase, the CENTRAL register of trials, PubMed and Google Scholar. Risk of bias was assessed using the Cochrane Risk of Bias tool. Random effects meta-analysis was conducted on the data extracted.\n\n**Results:** Three RCTs involving 490 patients were analysed for the outcomes of abscess recurrence and postoperative fistula formation; the data were not adequate to assess pain on dressing and time to healing. For unpacked versus packed, the pooled relative risk of abscess recurrence was 1.57 (95% confidence interval (CI) 0.764, 3.29, <i>p</i>=0.219) and for fistula formation 0.686 (95% CI 0.430, 1.09, <i>p</i>=0.114). These results suggest there is no significant benefit to packing abscess cavities.\n\n**Conclusions:** Analysis of the outcomes suggests there is no significant difference with regards to rates of abscess recurrence or fistula formation between the packed and unpacked groups; however, appropriately powered RCTs are required in this area to provide more primary evidence to inform best practice and clinical management.", "abstract_zh": "Perianal abscesses are common presentations and reasons for emergency general surgery admissions. Management involves incision and drainage of the abscess and packing the cavity with internal wound dressings. This meta-analysis aimed to assess in adults if packing an abscess or leaving it unpacked leads to a significant difference in the outcomes of pain on wound dressing, time to healing, rate of fistulation and abscess recurrence.\n\nRandomised controlled trials (RCTs) with participants aged 18 years or older that compared packing of perianal abscess cavities with no packing between 2002 and 2022 were searched for in December 2022 on OVID Medline and Embase, the CENTRAL register of trials, PubMed and Google Scholar. Risk of bias was assessed using the Cochrane Risk of Bias tool. Random effects meta-analysis was conducted on the data extracted.\n\nThree RCTs involving 490 patients were analysed for the outcomes of abscess recurrence and postoperative fistula formation; the data were not adequate to assess pain on dressing and time to healing. For unpacked versus packed, the pooled relative risk of abscess recurrence was 1.57 (95% confidence interval (CI) 0.764, 3.29, <i>p</i>=0.219) and for fistula formation 0.686 (95% CI 0.430, 1.09, <i>p</i>=0.114). These results suggest there is no significant benefit to packing abscess cavities.\n\nAnalysis of the outcomes suggests there is no significant difference with regards to rates of abscess recurrence or fistula formation between the packed and unpacked groups; however, appropriately powered RCTs are required in this area to provide more primary evidence to inform best practice and clinical management.", "keywords_zh": "Abscess packing, Perianal abscesses, Recurrence", "keywords_en": "Abscess packing, Perianal abscesses, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/38563064/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Tue, 02 Apr 2024"}, {"id": "38428446", "title_en": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "authors": "Kiriakos Ktenidis", "abstract_en": "**Background:** We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\n**Methods:** Our study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\n**Results:** Twelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\n**Conclusion:** ALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "abstract_zh": "We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\nOur study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\nTwelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\nALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "keywords_zh": "ALTA, aluminum potassium sulfate, hemorrhoidal disease, hemorrhoids, sclerotherapy", "keywords_en": "ALTA, aluminum potassium sulfate, hemorrhoidal disease, hemorrhoids, sclerotherapy", "link": "https://pubmed.ncbi.nlm.nih.gov/38428446/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Fri, 01 Mar 2024"}, {"id": "38223244", "title_en": "Effectiveness and safety of darvadstrocel in patients with complex perianal fistulizing Crohn's disease: a systematic review", "title_zh": "Effectiveness and safety of darvadstrocel in patients with complex perianal fistulizing Crohn's disease: a systematic review", "authors": "Konstantinos H Katsanos", "abstract_en": "**Background:** Managing complex perianal fistulizing Crohn's disease (CD) remains challenging, despite current medical and surgical treatment approaches. Darvadstrocel, a therapy utilizing adipose-derived stem cells, shows promise in promoting tissue regeneration and healing, offering a novel and effective treatment for fistula management.\n\n**Method:** A systematic literature search was conducted on PubMed and Scopus to identify studies involving patients with complex perianal fistulizing CD treated with darvadstrocel.\n\n**Results:** In total, 2 randomized controlled trials (RCT), 5 observational studies with retrospective data collection and 2 observational studies with prospective design were included in the final review. Data from the European ADMIRE-CD RCT demonstrated that darvadstrocel is superior to placebo in terms of clinical and imaging improvement over both the short and long term. These findings align with the prospective studies analyzed in this systematic review. The rate of treatment-emergent adverse events in the ADMIRE-CD trial's RCTs was similar in both the darvadstrocel and control groups, with perianal abscess being the most common adverse event up to 52 weeks after drug administration. Retrospective studies indicated no side-effects beyond 52 weeks.\n\n**Conclusions:** Darvadstrocel appears to be a new, potentially effective and safe treatment option for the management of complex perianal fistulas. However, more randomized clinical trials are needed to evaluate the efficacy and safety profile of the drug.", "abstract_zh": "Managing complex perianal fistulizing Crohn's disease (CD) remains challenging, despite current medical and surgical treatment approaches. Darvadstrocel, a therapy utilizing adipose-derived stem cells, shows promise in promoting tissue regeneration and healing, offering a novel and effective treatment for fistula management.\n\nA systematic literature search was conducted on PubMed and Scopus to identify studies involving patients with complex perianal fistulizing CD treated with darvadstrocel.\n\nIn total, 2 randomized controlled trials (RCT), 5 observational studies with retrospective data collection and 2 observational studies with prospective design were included in the final review. Data from the European ADMIRE-CD RCT demonstrated that darvadstrocel is superior to placebo in terms of clinical and imaging improvement over both the short and long term. These findings align with the prospective studies analyzed in this systematic review. The rate of treatment-emergent adverse events in the ADMIRE-CD trial's RCTs was similar in both the darvadstrocel and control groups, with perianal abscess being the most common adverse event up to 52 weeks after drug administration. Retrospective studies indicated no side-effects beyond 52 weeks.\n\nDarvadstrocel appears to be a new, potentially effective and safe treatment option for the management of complex perianal fistulas. However, more randomized clinical trials are needed to evaluate the efficacy and safety profile of the drug.", "keywords_zh": "Fistulizing Crohn’s disease, adipose-derived stem-cells, darvadstrocel, treatment", "keywords_en": "Fistulizing Crohn’s disease, adipose-derived stem-cells, darvadstrocel, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/38223244/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Mon, 15 Jan 2024"}, {"id": "37545826", "title_en": "Hidradenitis suppurativa and squamous cell carcinoma: a systematic review of the literature", "title_zh": "Hidradenitis suppurativa and squamous cell carcinoma: a systematic review of the literature", "authors": "Beata Bergler-Czop", "abstract_en": "Hidradenitis suppurativa (HS) is a chronic disease which is often recurrent and occurs as abscesses of the apocrine gland. The most common locations of HS are gluteal/perianal, axillary or inguinal. It is reasonable to assume that squamous cell carcinoma may arise from HS. As researchers in the field of dermatology, HS surgery and conventional surgical oncology, we studied whether there is any correlation between HS and neoplasms. Evidence shows a correlation between HS and squamous cell carcinoma. The aim of the study was to find literature about HS and SCC and analyse potential risk factors. This is a systemic review concerning squamous cell carcinoma and hidradenitis suppurativa.", "abstract_zh": "Hidradenitis suppurativa (HS) is a chronic disease which is often recurrent and occurs as abscesses of the apocrine gland. The most common locations of HS are gluteal/perianal, axillary or inguinal. It is reasonable to assume that squamous cell carcinoma may arise from HS. As researchers in the field of dermatology, HS surgery and conventional surgical oncology, we studied whether there is any correlation between HS and neoplasms. Evidence shows a correlation between HS and squamous cell carcinoma. The aim of the study was to find literature about HS and SCC and analyse potential risk factors. This is a systemic review concerning squamous cell carcinoma and hidradenitis suppurativa.", "keywords_zh": "hidradenitis suppurativa, squamous cell carcinoma, surgical treatment", "keywords_en": "hidradenitis suppurativa, squamous cell carcinoma, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/37545826/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Mon, 07 Aug 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\nUsing PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\nThirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\nStrong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\nType of study: Systemic review; Evidence level: Level II.", "keywords_zh": "Anal fistula, Pediatric, Perianal abscess, Primary management", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36794974", "title_en": "Mesenchymal Stem Cells Versus Placebo for Perianal Fistulizing Crohn's Disease: A Systemic Review and Meta-Analysis", "title_zh": "Mesenchymal Stem Cells Versus Placebo for Perianal Fistulizing Crohn's Disease: A Systemic Review and Meta-Analysis", "authors": "Minhao Yu", "abstract_en": "**Background:** Mesenchymal stem cells (MSCs)-based therapy for perianal fistulizing Crohn's disease (pfCD) has been extensively studies in the past decade. Its efficacy and safety had been preliminarily confirmed in some phase 2 or phase 3 clinical trials. This meta-analysis is performed to evaluate the efficacy and safety of MSCs-based therapy for pfCD.\n\n**Methods:** Electronic databases (Pubmed, Cochrane Library, Embase) were searched for studies that reported the efficacy and safety of MSCs. And RevMan were used to assess the efficacy and safety.\n\n**Results:** After screening, 5 randomized controlled trials (RCTs) were included in this meta-analysis. RevMan 5.4 for meta-analysis showed that: [Efficacy] Patients had definite remission after MSCs treatment, with an odds ratio (OR) of 2.06 (<i>P</i> < .0001, 95%CI 1.46, 2.89) vs controls. [Safety] The incidence of the most frequently reported TEAEs (treatment-emergent adverse events, TEAEs), perianal abscess and proctalgia, did not significantly increase due to the use of MSCs, with an OR of 1.07 in perianal abscess (<i>P</i> = .87, 95%CI 0.67, 1.72) vs controls, and an OR of 1.10 in proctalgia (<i>P</i> = .47, 95%CI 0.63, 1.92) vs controls.\n\n**Conclusions:** MSCs seem to be an effective and safe therapy for pfCD. MSCs based therapy has the potential to be used in combination with traditional therapies.", "abstract_zh": "Mesenchymal stem cells (MSCs)-based therapy for perianal fistulizing Crohn's disease (pfCD) has been extensively studies in the past decade. Its efficacy and safety had been preliminarily confirmed in some phase 2 or phase 3 clinical trials. This meta-analysis is performed to evaluate the efficacy and safety of MSCs-based therapy for pfCD.\n\nElectronic databases (Pubmed, Cochrane Library, Embase) were searched for studies that reported the efficacy and safety of MSCs. And RevMan were used to assess the efficacy and safety.\n\nAfter screening, 5 randomized controlled trials (RCTs) were included in this meta-analysis. RevMan 5.4 for meta-analysis showed that: [Efficacy] Patients had definite remission after MSCs treatment, with an odds ratio (OR) of 2.06 (<i>P</i> < .0001, 95%CI 1.46, 2.89) vs controls. [Safety] The incidence of the most frequently reported TEAEs (treatment-emergent adverse events, TEAEs), perianal abscess and proctalgia, did not significantly increase due to the use of MSCs, with an OR of 1.07 in perianal abscess (<i>P</i> = .87, 95%CI 0.67, 1.72) vs controls, and an OR of 1.10 in proctalgia (<i>P</i> = .47, 95%CI 0.63, 1.92) vs controls.\n\nMSCs seem to be an effective and safe therapy for pfCD. MSCs based therapy has the potential to be used in combination with traditional therapies.", "keywords_zh": "mesenchymal stem cells, meta-analysis, perianal fistulizing Crohn’s disease", "keywords_en": "mesenchymal stem cells, meta-analysis, perianal fistulizing Crohn’s disease", "link": "https://pubmed.ncbi.nlm.nih.gov/36794974/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 16 Feb 2023"}, {"id": "34792604", "title_en": "Epidemiology and Natural History of Perianal Crohn's Disease: A Systematic Review and Meta-Analysis of Population-Based Cohorts", "title_zh": "Epidemiology and Natural History of Perianal Crohn's Disease: A Systematic Review and Meta-Analysis of Population-Based Cohorts", "authors": "Siddharth Singh", "abstract_en": "**Background And Aims:** Perianal Crohn's disease (pCD) is a potentially severe phenotype of CD. We conducted a systematic review with meta-analysis to estimate cumulative incidence, risk factors, and outcomes of pCD in population-based cohort studies.\n\n**Methods:** Through a systematic literature review through March 1, 2021, we identified population-based inception cohort studies reporting cumulative incidence of perianal disease (primarily abscess and/or fistula) in patients with CD. We estimated the cumulative incidence of pCD at presentation and 1-, 5-, and 10-year follow-up, and risk factors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\n**Results:** In 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\n**Conclusions:** Approximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "abstract_zh": "Perianal Crohn's disease (pCD) is a potentially severe phenotype of CD. We conducted a systematic review with meta-analysis to estimate cumulative incidence, risk factors, and outcomes of pCD in population-based cohort studies.\n\nThrough a systematic literature review through March 1, 2021, we identified population-based inception cohort studies reporting cumulative incidence of perianal disease (primarily abscess and/or fistula) in patients with CD. We estimated the cumulative incidence of pCD at presentation and 1-, 5-, and 10-year follow-up, and risk factors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\nIn 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\nApproximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "keywords_zh": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "keywords_en": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "link": "https://pubmed.ncbi.nlm.nih.gov/34792604/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34792583", "title_en": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "title_zh": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\n**Methods:** We performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\n**Results:** Twenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\n**Conclusions:** Limited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "abstract_zh": "Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\nWe performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\nTwenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\nLimited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "keywords_zh": "cryptoglandular disease, fistula-in-ano, perianal disease", "keywords_en": "cryptoglandular disease, fistula-in-ano, perianal disease", "link": "https://pubmed.ncbi.nlm.nih.gov/34792583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20261119013711&v=2.20.1", "date": "Thu, 18 Nov 2021"}], "未命名": [], "痔疮": [{"id": "43018757", "title_en": "Laser hemorrhoidoplasty vs. stapled hemorrhoidopexy: a meta-analysis of clinical outcomes with considerations in surgical anatomy", "title_zh": "Laser hemorrhoidoplasty vs. stapled hemorrhoidopexy: a meta-analysis of clinical outcomes with considerations in surgical anatomy", "authors": "Theodore Troupis", "abstract_en": "CONCLUSION: LH and SH showed no statistically significant differences across several reported short-term outcomes, including postoperative pain, bleeding, and time to return to normal activities. While LH was associated with shorter operative times, reduced hospital stays, and lower rates of urinary retention and stenosis in the available studies, these findings must be interpreted with caution. Crucially, the true comparative therapeutic efficacy of these techniques remains uncertain. Because...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/43018757/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Thu, 12 Nov 2026"}, {"id": "43002588", "title_en": "Clinical characteristics, treatment, and prognosis of sexual-related rectal foreign bodies: a systematic review and meta-analysis", "title_zh": "Clinical characteristics, treatment, and prognosis of sexual-related rectal foreign bodies: a systematic review and meta-analysis", "authors": "Liu Yu", "abstract_en": "CONCLUSION: Sexual-related RFBs occur predominantly in middle-aged men who present late, often after failed self-removal. Transanal extraction succeeds in most patients; perforation, stoma creation, and death are uncommon. A stepwise, escalation-based management approach is supported by the available evidence.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/43002588/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Mon, 09 Nov 2026"}, {"id": "43000353", "title_en": "Microplastics and colorectal cancer: presence in human colorectal tissues and associations with tumor biology", "title_zh": "Microplastics and colorectal cancer: presence in human colorectal tissues and associations with tumor biology", "authors": "Hafiza Ummara Rasheed", "abstract_en": "CONCLUSION: MPs can affect the development of colorectal cancer (CRC) because they are found in human colorectal tissues and are preferentially accumulated in tumours. Multicenter studies with typical application are required to clarify causal processes and clinical consequences.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/43000353/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Sun, 08 Nov 2026"}, {"id": "42974829", "title_en": "Long-term (≥ 5 Years) Low Anterior Resection Syndrome and Health Related Quality of Life in Rectal Cancer Patients: A Systematic Review", "title_zh": "Long-term (≥ 5 Years) Low Anterior Resection Syndrome and Health Related Quality of Life in Rectal Cancer Patients: A Systematic Review", "authors": "Audrius Dulskas", "abstract_en": "CONCLUSION: Nearly half of rectal cancer survivors experience major Low Anterior Resection Syndrome ≥5 years postoperatively, highlighting the persistence of bowel dysfunction and its lasting impact on health-related quality of life. These findings underscore the need for long-term survivorship care and functional outcome monitoring.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42974829/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Tue, 03 Nov 2026"}, {"id": "42960858", "title_en": "Research Perspective on \"Long-Term (≥ 5-Years) Low Anterior Resection Syndrome and Health Related Quality of Life in Rectal Cancer Patients: A Systematic Review\"", "title_zh": "Research Perspective on \"Long-Term (≥ 5-Years) Low Anterior Resection Syndrome and Health Related Quality of Life in Rectal Cancer Patients: A Systematic Review\"", "authors": "Stephen P Sharp", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42960858/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Fri, 30 Oct 2026"}, {"id": "42908803", "title_en": "Clinical outcomes of different sclerosing agents for hemorrhoids: a network meta-analysis", "title_zh": "Clinical outcomes of different sclerosing agents for hemorrhoids: a network meta-analysis", "authors": "Chilei Shen", "abstract_en": "CONCLUSION: Polidocanol foam showed best efficacy among all sclerosing agents for treating hemorrhoids, Fri, 16 Oct 2026"}, {"id": "42816945", "title_en": "LigaSure versus conventional excisional haemorrhoidectomy: A systematic review and meta-analysis with trial sequential analysis of randomised controlled trials", "title_zh": "LigaSure versus conventional excisional haemorrhoidectomy: A systematic review and meta-analysis with trial sequential analysis of randomised controlled trials", "authors": "Fernanda Bellotti Formiga", "abstract_en": "CONCLUSION: LigaSure was associated with improvements in selected early perioperative outcomes, particularly postoperative pain and return to daily activities. However, uncertainty remains for several outcomes, and evidence regarding recurrence and other long-term anorectal outcomes remains limited.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42816945/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Thu, 01 Oct 2026"}, {"id": "42811015", "title_en": "Systematic Review and Meta-analysis of Group B Streptococcus Rectovaginal Colonization Rates and Serotype Distribution among Pregnant Women, Asia-Pacific Region, 2014-2025", "title_zh": "Systematic Review and Meta-analysis of Group B Streptococcus Rectovaginal Colonization Rates and Serotype Distribution among Pregnant Women, Asia-Pacific Region, 2014-2025", "authors": "Fiona M Russell", "abstract_en": "We conducted a systematic review and meta-analysis of group B Streptococcus (GBS) rectovaginal colonization prevalence, serotype distribution, and antimicrobial drug resistance (AMR) rates among pregnant women in the Asia-Pacific region. We included articles published in the MEDLINE, Embase, and PubMed databases during January 2014-October 2025. Overall, 1,623 studies were identified; 98 of those were included in the meta-analysis. Of 978,150 pregnant women, 172,973 were colonized with GBS;...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42811015/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Tue, 29 Sep 2026"}, {"id": "42810974", "title_en": "Clinical utility of endorectal balloons in prostate cancer external beam radiotherapy: a systematic review and meta-analysis", "title_zh": "Clinical utility of endorectal balloons in prostate cancer external beam radiotherapy: a systematic review and meta-analysis", "authors": "Jae Kyung Suh", "abstract_en": "CONCLUSION: ERB appears to be a relatively safe and clinically useful adjunct for enhancing treatment precision in prostate cancer radiotherapy. By stabilizing prostate motion and reducing radiation exposure to the rectum and anal wall, ERB optimizes the therapeutic ratio.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42810974/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Tue, 29 Sep 2026"}, {"id": "42778806", "title_en": "Indocyanine green fluorescence angiography for prevention of anastomotic leak in colorectal surgery: a graded systematic review and meta-analysis with trial sequential analysis of randomized controlled trials", "title_zh": "Indocyanine green fluorescence angiography for prevention of anastomotic leak in colorectal surgery: a graded systematic review and meta-analysis with trial sequential analysis of randomized controlled trials", "authors": "Mohamed H Zidan", "abstract_en": "CONCLUSIONS: High-certainty evidence demonstrates that ICG-FA reduces overall and low-grade AL, principally in left-sided resections, without prolonging operative time. ICG-FA should be considered an evidence-based adjunct to optimize perfusion assessment in colorectal surgery.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42778806/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Wed, 23 Sep 2026"}, {"id": "42775560", "title_en": "Research Perspective on Delays in Diagnosis of Early-Onset Colorectal Cancer Across the United States: A Systematic Review", "title_zh": "Research Perspective on Delays in Diagnosis of Early-Onset Colorectal Cancer Across the United States: A Systematic Review", "authors": "Thomas Curran", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42775560/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Wed, 23 Sep 2026"}, {"id": "42775541", "title_en": "Research Perspective on \"Measuring symptom severity and health-related quality-of-life with hemorrhoid treatments: Systematic Review\"", "title_zh": "Research Perspective on \"Measuring symptom severity and health-related quality-of-life with hemorrhoid treatments: Systematic Review\"", "authors": "Calista Harbaugh", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42775541/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Wed, 23 Sep 2026"}, {"id": "42775535", "title_en": "Measuring Symptom Severity and Health-Related Quality-of-Life with Hemorrhoid Treatments: Systematic Review", "title_zh": "Measuring Symptom Severity and Health-Related Quality-of-Life with Hemorrhoid Treatments: Systematic Review", "authors": "Eric D Shah", "abstract_en": "CONCLUSIONS: We identify two viable patient-reported outcome measures for use in future clinical trials that evaluate hemorrhoid interventions.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42775535/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Wed, 23 Sep 2026"}, {"id": "42759190", "title_en": "Single-stapled versus double-stapled colorectal anastomosis after anterior resection: Systematic review and meta-analysis of short-term and functional outcomes", "title_zh": "Single-stapled versus double-stapled colorectal anastomosis after anterior resection: Systematic review and meta-analysis of short-term and functional outcomes", "authors": "Paolo Delrio", "abstract_en": "CONCLUSION: Single-stapled anastomosis appears to be a safe alternative to the double-stapled anastomosis technique after restorative anterior rectal resection. Although no statistically significant differences were observed in anastomotic leak, postoperative complications, anastomotic stricture, and major low anterior resection syndrome risk, single-stapled anastomosis may represent a technically appealing option. Further large multicenter randomized trials are required.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42759190/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20261119013823&v=2.20.1", "date": "Fri, 18 Sep 2026"}, {"id": "42726324", "title_en": "Non-linear predictive modeling and comprehensive meta-analysis of rectal temperature in Santa Ines sheep: a systematic review of thermal challenges and biometerological trends", "title_zh": "Non-linear predictive modeling and comprehensive meta-analysis of rectal temperature in Santa Ines sheep: a systematic review of thermal challenges and biome
