s are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\n**Methods:** A comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\n**Results:** Of 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\n**Conclusions:** TPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 截至 2025 年 1 月，我们对多个数据库进行了全面的文献检索，以确定与 MRI、TRUS 或 EUA 作为参考标准相比，评估 TPUS 在检测肛周瘘管和脓肿方面的准确性的研究。进行荟萃分 esses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\n**Results:** Twenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\n**Conclusion:** Substantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "克罗恩病、脓肿、结直肠手术、炎症性肠病、直肠瘘", "keywords_en": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41693361/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Mon, 16 Feb 2026"}, {"id": "41359092", "title_en": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A Hart", "abstract_en": "**Introduction:** Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\n**Methods:** A literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\n**Results:** Of 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, c lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\n**Methods:** The American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\n**Results:** Over 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\n**Conclusions:** Both operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\n**Type Of Study:** Systematic Review of level 3-4 studies.\n\n**Level Of Evidence:** Level 4.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 美国儿科外科协会成果和循证实践委员会针对婴儿肛周脓肿和 FIA 的各种治疗方法提出了基于先验共识的问题。创建了全面的搜索策略，并使用系统评价和荟萃分析的首选报告项目 (PRISMA) 指南来识别和审查相关文章并回答既定问题。\n\n**结果：** Error 500 ( used populations, interventions, comparators, outcomes, study designs, and time criteria to identify relevant studies. Observational studies published in English from January 1, 2015 to February 17, 2022 with > 50 patients were included, even if complex CPF was not defined. Items of interest included complex CPF definitions, epidemiology, treatment patterns, morbidity, mortality, and risk factors associated with complex CPF development, treatment failure, and undergoing multiple surgeries. Data were reported using descriptive statistics.\n\n**Results:** Overall, 140 studies were included. Complex CPF definitions were heterogeneous and rarely reported (24 studies). Hence, data mostly related to CPF in general. CPF prevalence was variable (range: 1.5%-81.0%). Incidence was wide-ranging and mostly reported cumulatively at 1-year post-Crohn's disease diagnosis (range: 3.5%-50.1%). Overall healing and failure rates after treatment were in the range of 10.5%-80.2% and 3.6%-83.0%, respectively. Abscesses were the most frequently reported morbidity (<i>n =</i> 18). No CPF-related deaths were reported. No consistent risk or protective factors were identified.\n\n**Conclusion:** Epidemiology, treatment patterns, and risk factors for CPF vary, likely due to inconsistent CPF and clinical outcome definitions. Standardization would facilitate comparability, which may inform optimal complex CPF treatment strategies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 总体而言，纳入了 140 项研究。复杂的 CPF 定义多种多样且很少报道（24 项研究）。因此，数据主要与一般公积金相关。 CPF 患病率各不相同（范围：1.5%-81.0%）。发病率范围广泛，大多数是在克罗恩病诊断后 1 年累积报告的（范围：3.5%-50.1%）。治疗后总体治愈率和失败率分别为10.5%-80.2%和3.6%-83.0%。脓肿是最常报告的发病率（<i>n =</i> 18）。没有与公积金相关的死亡报告。没有发现一致的风险或保护因素。\n\n**结论：** CPF 的流行病学、治疗模式和危险因素各不相同，这可能是由于 CPF 和临床结果定义不一致所致。标准化将促进可比性，这可能为最佳的复杂 CPF 治疗策略提供信息。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complex perianal fistula, Crohn’s disease, Epidemiology, Morbidity, Risk factors, Treatment patterns", "link": "https://pubmed.ncbi.nlm.nih.gov/40740890/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 31 Jul 2025"}, {"id": "40585484", "title_en": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Li Xu", "abstract_en": "**Introduction:** The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\n**Material And Methods:** A thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\n**Results:** A total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\n**Conclusion:** The available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "abstract_zh": "**介绍：** 婴儿肛周脓肿（PA）和肛瘘（FIA）的最佳治疗方法仍然是一个争论的话题。\n\n**Material and methods：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 总共分析了 18 项回顾性研究，涵盖 1,770 名患者。接受保守治疗的702例（38.7%）中，治愈528例（75.2%），未治愈174例（24.8%），其中93例出现PA复发，81例出现FIA。相比之下，在接受手术干预的1,068例（61.3%）中，784例（73.4%）治愈，284例（26.6%）未治愈，其中151例出现PA复发，133例出现FIA。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40585484/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Mon, 30 Jun 2025"}, {"id": "40538531", "title_en": "The Correlation between Hidradenitis Suppurativa and Irritable Bowel Diseases: A Systematic Review", "title_zh": "化脓性汗腺炎与肠易激疾病之间的相关性：系统评价", "authors": "Ayezel Munoz Gonzalez", "abstract_en": "**Background:** Hidradenitis suppurativa (HS) is an inflammatory skin condition that presents with nodules or abscesses associated with sinus tracts. Inflammatory bowel diseases (IBD) are inflammatory gastrointestinal (GI) conditions presenting with irregular bowel movements. Although HS and IBDs may have similarities in their clinical presentation and pathophysiology, they can differ in their cutaneous manifestations. Both conditions are potentially caused by genetic changes in the human leukocyte antigen (HLA), cause skin inflammation, and are characterized by abscesses in the GI and sinus tracts.\n\n**Objective:** We sought to determine the extent of coincident IBD and HS and the associated risk factors.\n\n**Methods:** The Ovid Medline database was searched for all current literature on the correlations between HS and IBD. Articles were then included and removed according to specific inclusion and exclusion criteria, and a systematic review was performed on the remaining articles.\n\n**Results:** Thirteen papers that met the inclusion and the exclusion criteria were selected, and after data collection, a significant correlation was found between the development of HS and IBD. Most of the articles reviewed stated that the corresponding association was a causal link between the two diseases. Furthermore, there were various risk factors and comorbidities associated with HS and the development of IBD, including smoking, obesity, perianal disease, and genetic predispositions such as HLA-B27 mutations.\n\n**Discussion:** Studies show that there is a potential correlation with HS and IBDs. Additional research should to determine the genetic correlations between HS and IBDs and the underlying pathophysiological mechanism.", "abstract_zh": "**背景：** 化脓性汗腺炎 (HS) 是一种炎症性皮肤病，表现为与窦道相关的结节或脓肿。炎症性肠病 (IBD) 是一种炎症性胃肠道 (GI) 疾病，表现为排便不规则。尽管 HS 和 IBD 在临床表现和病理生理学方面可能有相似之处，但它们的皮肤表现可能有所不同。这两种情况都可能由人类白细胞抗原 (HLA) 的基因变化引起，引起皮肤炎症，并以胃肠道和窦道脓肿为特征。\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 在 Ovid Medline 数据库中检索了有关 HS 和 IBD 之间相关性的所有当前文献。然后根据特定的纳入和排除标准纳入和删除文章，并对剩余文章进行系统评价。\n\n**结果：** 筛选出13篇符合纳入和排除标准的论文，经过数据收集，发现HS和IBD的发展之间存在显着相关性。大多数审查的文章都指出，相应的关联是两种疾病之间的因果关系。此外，存在与 HS 和 IBD 发展相关的各种危险因素和合并症，包括吸烟、肥胖、肛周疾病和 HLA-B27 突变等遗传倾向。\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hidradenitis suppurativa, autoimmunity, dermatology, gastroenterology, irritable bowel diseases", "link": "https://pubmed.ncbi.nlm.nih.gov/40538531/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Fri, 20 Jun 2025"}, {"id": "40210078", "title_en": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "title_zh": "定义肛周瘘管性克罗恩病的放射治疗：顶级全球专家德尔菲共识", "authors": "TOpClass collaborative authors", "abstract_en": "**Background & Aims:** Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\n**Methods:** The study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\n**Results:** A radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\n**Conclusions:** This international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "abstract_zh": "**Background & aims：** 肛周瘘管克罗恩病 (pfCD) 影响五分之一的克罗恩病 (CD) 患者，显着影响他们的生活质量。磁共振成像是评估 pfCD 瘘管愈合的黄金标准，但放射学定义的可变性妨碍了有意义的临床解释和一致的试验设计。本研究旨在就 pfCD 放射治疗的定义建立国际共识。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 放射学愈合的瘘管可以定义为不存在 T2 加权高信号、完全纤维化的瘘管，以及使用造影剂时，造影后 T1 加权图像上不存在造影剂增强（95% 共识）。瘘管的放射学改善可以通过至少一个基本标准的存在来定义（80%共识）：瘘管纤维化程度不断增加，以下一项或多项指标明确减少：T2加权高信号、瘘管直径、瘘管长度、脓肿大小或瘘管造影增强。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40210078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 10 Apr 2025"}, {"id": "40155532", "title_en": "Early diagnosis of Crohn's disease in patients presenting with a perianal fistula: systematic review and development of a perianal red flags index", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "J D W van der Bilt", "abstract_en": "**Background:** Delay in diagnosing Crohn's disease (CD) in patients presenting with perianal abscess (PAA) and/or fistula (PAF) is common. The aim of this study was to identify red flags suggestive of CD.\n\n**Methods:** A systematic literature review was conducted to identify symptoms associated with CD in patients presenting with PAA/PAF. A questionnaire including those symptoms, supplemented with items from the International Organization for the Study of Inflammatory Bowel Diseases (IO-IBD) red flags index for luminal CD, was administered to all adult patients presenting with a PAF and eventually diagnosed with CD and matched patients (1:3) from the same study period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\n**Results:** The systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\n**Conclusions:** The perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "克罗恩病、延迟、炎症性肠病、肛周瘘", "keywords_en": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40155532/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "39946821", "title_en": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "G S Octavius", "abstract_en": "**Introduction:** This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\n**Methods:** The protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\n**Results:** Of 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\n**Conclusion:** ADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\n**Implications For Practice:** T2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 该方案已在国际系统评价前瞻性登记册 (PROSPERO) 中注册 (CRD42024596604)。该综述包括五个数据库（MEDLINE、Cochrane Library、PubMed、Science Direct 和 Google Scholar）。使用带有“Midas”命令的 STATA 软件对报告 ADC 值和其他序列的研究进行荟萃分析。\n\n**结果：** 在该评价纳入的 21 项研究中，有 12 项进行了荟萃分析，涉及 1007 名患者（77.5% 男性），有 1092 个瘘管和 321 个脓肿。六项研究报告了活动性瘘管与非活动性瘘管的 ADC 值，汇总敏感性为 83% (95%CI 68-92)，特异性为 75% (95%CI 60-85)，AUC 为 0.85 (95%CI 0.81-0.87)。汇集的 ADC 截止范围为 1.105 至 1.109 × 10⁻3 mm<sup>2</sup>/s。 T2WI + DWI 序列显示出最高的诊断准确性，汇总敏感性为 99% (95%CI 90-100)，特异性为 97% (95%CI 79-100)，AUC 为 1。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Implications for practice：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39946821/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 13 Feb 2025"}, {"id": "39887706", "title_en": "Hidradenitis Suppurativa Treatment During Pregnancy and Lactation: Navigating Challenges", "title_zh": "妊娠期和哺乳期化脓性汗腺炎治疗：应对挑战", "authors": "Seçil Vural", "abstract_en": "Hidradenitis suppurativa (HS), or acne inversa, is a chronic inflammatory skin condition primarily affecting skin folds such as the axilla, groins, and the inframammary, perineal, and perianal regions. It is characterized by painful abscesses, sinus tracts, and scarring. Predominantly affecting young adults, particularly females, HS often emerges during reproductive age, and flares are widely reported during pregnancy and postpartum, underscoring the need to consider management strategies tailored to pregnant or lactating individuals. Moreover, the chronic and relapsing nature of HS, along with challenges related to the safety and compliance of medication use during pregnancy and lactation, as well as various comorbidities and psychological distress, significantly complicate its management in pregnant or lactating women. Treatment options, including topical clindamycin, oral clindamycin-rifampicin, adalimumab, metformin, antiseptic washes, and certolizumab pegol, have accumulated evidence supporting their relative safety in pregnant and lactating women. While certolizumab pegol has shown promising safety data among biologics, it requires more efficacy data in HS. Conversely, while newly approved HS medications such as secukinumab and bimekizumab show promise for the general population, further research is necessary to evaluate their safety profiles in pregnant and breastfeeding individuals. The scant research available on HS in pregnant and lactating women, also shown by our systematic literature review, highlights the need for a comprehensive investigation into the safety, efficacy, and suitability of management strategies.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "母乳喂养、化脓性汗腺炎、哺乳期、怀孕、安全、治疗", "keywords_en": "breastfeeding, hidradenitis suppurativa, lactation, pregnancy, safety, therapeutics", "link": "https://pubmed.ncbi.nlm.nih.gov/39887706/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Fri, 31 Jan 2025"}, {"id": "39422801", "title_en": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "肛周粘液性腺癌：一例报告和文献系统回顾", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\n**Methods:** A systematic PubMed and Scopus search was conducted, a propos of a case report.\n\n**Results:** One hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "**背景：** 肛门粘液性腺癌是一种罕见的胃肠道肿瘤。在大多数情况下，这种疾病的早期诊断很困难，因为它的症状经常模仿良性炎症。\n\n**方法：** 根据病例报告的建议，进行了系统的 PubMed 和 Scopus 检索。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39360706", "title_en": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Cristina Alba", "abstract_en": "**Background:** Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\n**Objective:** This study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\n**Methods:** A systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\n**Results:** Twelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\n**Conclusion:** Evidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 本研究旨在探讨 darvadstrocel 治疗 CD 复杂肛周瘘的疗效和安全性。\n\n**方法：** 截至 2024 年 4 月，我们在相关数据库中进行了系统检索，以评估 darvadstrocel 的观察性研究。使用随机效应荟萃分析模型来计算有效性和安全性结果的汇总效应大小（比例或发生率 [IR]）以及 95% 置信区间 (CI)。使用乔安娜·布里格斯研究所批判性评估工具评估偏倚风险。 I<sup>2</sup> 值评估异质性。还进行了敏感性和亚组分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 观察性研究的证据支持 darvadstrocel 对于 CD 复杂肛周瘘的疗效和安全性。研究表明，大多数患者的瘘管愈合率较高，可以长期维持，研究间的异质性可以忽略不计，并且安全性良好。", "keywords_zh": "克罗恩病、脂肪源性同种异体间充质干细胞、alofisel、darvadstrocel、炎症性肠病、荟萃分析、肛周瘘", "keywords_en": "Crohn's disease, adipose‐derived allogenic mesenchymal stem cells, alofisel, darvadstrocel, inflammatory bowel disease, meta‐analysis, perianal fistulas", "link": "https://pubmed.ncbi.nlm.nih.gov/39360706/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 03 Oct 2024"}, {"id": "39298676", "title_en": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "title_zh": "使用挂线对复杂克罗恩病肛周瘘的临床、患者报告和医疗资源利用结果的影响：系统文献综述", "authors": "Phillip Fleshner", "abstract_en": "**Background:** Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\n**Results:** Overall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\n**Conclusions:** Optimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "abstract_zh": "**背景：** 克罗恩病肛周瘘（CPF）患者挂线的最佳治疗策略仍然难以捉摸。本系统文献综述旨在总结与使用挂线缓解症状和治疗复杂 CPF 相关的临床、患者报告和医疗资源利用 (HCRU) 结果。\n\n**方法：** 检索了电子数据库（MEDLINE、Embase、EBM Reviews、EconLit）。标题、摘要和相关全文由 2 名审稿人筛选，以使用预先指定的 PICOS-T 标准进行纳入。收录了1980年1月1日至2021年9月6日期间以英文发表的文章；动物/体外研究和病例报告<5名患者被排除在外。感兴趣的结果包括接受挂线并使用/不使用英夫利昔单抗或生物制剂的患者的完全缓解/缓解率和瘘管复发率。使用描述性统计总结数据。\n\n**结果：** 总体而言，纳入了 56 项研究（全文：n = 43；会议摘要：n = 13）。 CPF 和临床结果的定义是不同的。完全缓解/缓解率（范围）差异很大（挂线：13%-75%；挂线 + 英夫利昔单抗：23%-100%；挂线 + 生物制剂：23%-59%），瘘管复发率也有很大差异（挂线：4%-68%；挂线 + 英夫利昔单抗：0%-50%；挂线 + 英夫利昔单抗：0%-50%）。挂线 + 生物制剂：0%-17%）。与瘘管相关的再干预、新瘘管或脓肿形成以及脓肿复发的发生率也各不相同；在使用患者报告的结果方面观察到更加一致。很少有研究报告儿科/青少年患者或 HCRU 的结果。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn’s disease, perianal fistula, seton", "link": "https://pubmed.ncbi.nlm.nih.gov/39298676/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 19 Sep 2024"}, {"id": "38813942", "title_en": "Vaccine-associated paralytic poliomyelitis in oral polio vaccine recipients: disproportionality analysis using VAERS and systematic review", "title_zh": "口服脊髓灰质炎疫苗接种者中与疫苗相关的麻痹性脊髓灰质炎：使用 VAERS 和系统评价进行不成比例分析", "authors": "Girish Thunga", "abstract_en": "**Background:** Vaccine-associated paralytic poliomyelitis (VAPP) is a rare adverse event of oral poliovirus vaccines (OPV), particularly affecting immunodeficient individuals.\n\n**Research Design And Methods:** This study aimed to (1) Assess the association between OPV and VAPP using Vaccine Adverse Event Reporting System (VAERS) database (2) Outline patient characteristics and risk factors associated with the occurrence of VAPP in OPV recipients through a systematic review of case reports and case series. A disproportionality analysis was conducted using the data from VAERS, encompassing adverse events reported from 1990 till February 2023. Additionally, we conducted a systematic review of case reports and case series using PubMed, Scopus, and Embase databases.\n\n**Results:** The VAERS data revealed 130 VAPP reports among 1,739,903 OPV linked adverse events, with year 2010 reporting the strongest association. The systematic review of 37 studies highlighted VAPP occurrence within 2 months to 4 years post-vaccination, typically with acute flaccid paralysis. Immunodeficiency and perianal abscess emerged as major risk factors. Out of the 37 included studies, 27 showed consistent causal association of VAPP with OPV using WHO-AEFI causality assessment tool.\n\n**Conclusion:** The study emphasized the seriousness of VAPP and highlights its association with OPV, identifying immunodeficiency as a prominent contributor to VAPP manifestation.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Research design and methods：** 本研究旨在 (1) 使用疫苗不良事件报告系统 (VAERS) 数据库评估 OPV 和 VAPP 之间的关联 (2) 通过对病例报告和病例系列进行系统回顾，概述与 OPV 接受者发生 VAPP 相关的患者特征和危险因素。使用 VAERS 的数据进行不成比例分析，涵盖 1990 年至 2023 年 2 月报告的不良事件。此外，我们使用 PubMed、Scopus 和 Embase 数据库对病例报告和病例系列进行了系统回顾。\n\n**结果：** VAERS 数据显示，1,739,903 起 OPV 相关不良事件中有 130 份 VAPP 报告，其中 2010 年报告的关联性最强。对 37 项研究的系统回顾强调了 VAPP 在疫苗接种后 2 个月至 4 年内发生，通常伴有急性弛缓性麻痹。免疫缺陷和肛周脓肿成为主要危险因素。在纳入的 37 项研究中，27 项使用 WHO-AEFI 因果关系评估工具显示 VAPP 与 OPV 之间存在一致的因果关系。\n\n**结论：** 该研究强调了 VAPP 的严重性，并强调了其与 OPV 的关联，确定免疫缺陷是导致 VAPP 表现的一个重要因素。", "keywords_zh": "病例报告、OPV、VAPP、因果关系、免疫缺陷、脊髓灰质炎", "keywords_en": "Case report, OPV, VAPP, causality, immunodeficiency, polio", "link": "https://pubmed.ncbi.nlm.nih.gov/38813942/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 30 May 2024"}, {"id": "38563064", "title_en": "A systematic review and meta-analysis of the use of packing in the management of perianal abscesses", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ome Padfield", "abstract_en": "**Background:** Perianal abscesses are common presentations and reasons for emergency general surgery admissions. Management involves incision and drainage of the abscess and packing the cavity with internal wound dressings. This meta-analysis aimed to assess in adults if packing an abscess or leaving it unpacked leads to a significant difference in the outcomes of pain on wound dressing, time to healing, rate of fistulation and abscess recurrence.\n\n**Methods:** Randomised controlled trials (RCTs) with participants aged 18 years or older that compared packing of perianal abscess cavities with no packing between 2002 and 2022 were searched for in December 2022 on OVID Medline and Embase, the CENTRAL register of trials, PubMed and Google Scholar. Risk of bias was assessed using the Cochrane Risk of Bias tool. Random effects meta-analysis was conducted on the data extracted.\n\n**Results:** Three RCTs involving 490 patients were analysed for the outcomes of abscess recurrence and postoperative fistula formation; the data were not adequate to assess pain on dressing and time to healing. For unpacked versus packed, the pooled relative risk of abscess recurrence was 1.57 (95% confidence interval (CI) 0.764, 3.29, <i>p</i>=0.219) and for fistula formation 0.686 (95% CI 0.430, 1.09, <i>p</i>=0.114). These results suggest there is no significant benefit to packing abscess cavities.\n\n**Conclusions:** Analysis of the outcomes suggests there is no significant difference with regards to rates of abscess recurrence or fistula formation between the packed and unpacked groups; however, appropriately powered RCTs are required in this area to provide more primary evidence to inform best practice and clinical management.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 对涉及 490 名患者的三项随机对照试验分析了脓肿复发和术后瘘管形成的结果；这些数据不足以评估敷料时的疼痛和愈合时间。对于未填塞与填塞的情况，脓肿复发的汇总相对风险为 1.57（95% 置信区间 (CI) 0.764, 3.29, <i>p</i>=0.219），瘘管形成的汇总相对风险为 0.686（95% CI 0.430, 1.09，<i>p</i>=0.114）。这些结果表明，填塞脓肿腔没有显着的好处。\n\n**结论：** 结果分析表明，填塞组和未填塞组之间脓肿复发或瘘管形成率没有显着差异；然而，该领域需要适当的随机对照试验来提供更多主要证据，为最佳实践和临床管理提供信息。", "keywords_zh": "脓肿填塞、肛周脓肿、复发", "keywords_en": "Abscess packing, Perianal abscesses, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/38563064/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Tue, 02 Apr 2024"}, {"id": "38428446", "title_en": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "硫酸铝钾和单宁酸（ALTA）硬化疗法治疗痔疮：系统评价和荟萃分析", "authors": "Kiriakos Ktenidis", "abstract_en": "**Background:** We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\n**Methods:** Our study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\n**Results:** Twelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\n**Conclusion:** ALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "abstract_zh": "**背景：** 我们进行了系统评价，以评估硫酸铝钾和单宁酸 (ALTA) 硬化疗法治疗痔疮疾病的安全性和有效性。\n\n**方法：** 我们的研究是根据 2020 年 PRISMA 声明（系统评价和荟萃分析的首选报告项目）进行的。主要终点包括总体复发和复发类型，次要终点包括术后并发症、再次干预、是否存在直肠溃疡、直肠狭窄、排便异常和肛周脓肿。还进行了α回归分析，其中患有II级、III级和IV级痔疮疾病的患者的百分比被用作协变量。\n\n**结果：** 涉及 4249 名患者的 12 项研究符合所有纳入标准并最终被纳入。随访结束时总体复发和并发症的粗略估计和汇总估计分别为 10% (95% CI, 6.52%-14.08%) 和 5.20% (95% CI, 2.59%-8.52%)。回归分析显示复发与痔疮疾病分级之间没有相关性，II 级，β= -0.0012（95% CI，-0.0074 至 0.0049）（<i>p</i> = .64），III 级 β= -0.0006（95% CI，-0.0056 至 0.0045） (<i>p</i> = .79) 和 IV 级 β = 0.0025 (95% CI，-0.0075 至 0.0124)。然而，在 IV 级疾病比例较高的患者群体中观察到了复发率增加的趋势。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "ALTA，硫酸铝钾，痔疮疾病，痔疮，硬化疗法", "keywords_en": "ALTA, aluminum potassium sulfate, hemorrhoidal disease, hemorrhoids, sclerotherapy", "link": "https://pubmed.ncbi.nlm.nih.gov/38428446/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Fri, 01 Mar 2024"}, {"id": "38223244", "title_en": "Effectiveness and safety of darvadstrocel in patients with complex perianal fistulizing Crohn's disease: a systematic review", "title_zh": "darvadstrocel 对复杂肛周瘘管克罗恩病患者的有效性和安全性：系统评价", "authors": "Konstantinos H Katsanos", "abstract_en": "**Background:** Managing complex perianal fistulizing Crohn's disease (CD) remains challenging, despite current medical and surgical treatment approaches. Darvadstrocel, a therapy utilizing adipose-derived stem cells, shows promise in promoting tissue regeneration and healing, offering a novel and effective treatment for fistula management.\n\n**Method:** A systematic literature search was conducted on PubMed and Scopus to identify studies involving patients with complex perianal fistulizing CD treated with darvadstrocel.\n\n**Results:** In total, 2 randomized controlled trials (RCT), 5 observational studies with retrospective data collection and 2 observational studies with prospective design were included in the final review. Data from the European ADMIRE-CD RCT demonstrated that darvadstrocel is superior to placebo in terms of clinical and imaging improvement over both the short and long term. These findings align with the prospective studies analyzed in this systematic review. The rate of treatment-emergent adverse events in the ADMIRE-CD trial's RCTs was similar in both the darvadstrocel and control groups, with perianal abscess being the most common adverse event up to 52 weeks after drug administration. Retrospective studies indicated no side-effects beyond 52 weeks.\n\n**Conclusions:** Darvadstrocel appears to be a new, potentially effective and safe treatment option for the management of complex perianal fistulas. However, more randomized clinical trials are needed to evaluate the efficacy and safety profile of the drug.", "abstract_zh": "**背景：** 尽管目前有药物和手术治疗方法，但治疗复杂的肛周瘘管克罗恩病 (CD) 仍然具有挑战性。 Darvadstrocel 是一种利用脂肪干细胞的疗法，在促进组织再生和愈合方面显示出前景，为瘘管治疗提供了一种新颖有效的治疗方法。\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 最终评价总共纳入了 2 项随机对照试验 (RCT)、5 项回顾性数据收集观察性研究和 2 项前瞻性设计观察性研究。来自欧洲 ADMIRE-CD RCT 的数据表明，darvadstrocel 在短期和长期的临床和影像学改善方面均优于安慰剂。这些发现与本系统综述中分析的前瞻性研究一致。在 ADMIRE-CD 试验的随机对照试验中，darvadstrocel 组和对照组中治疗引起的不良事件发生率相似，其中肛周脓肿是给药后 52 周内最常见的不良事件。回顾性研究表明超过 52 周没有副作用。\n\n**结论：** Darvadstrocel 似乎是治疗复杂肛周瘘的一种新的、潜在有效且安全的治疗选择。然而，需要更多的随机临床试验来评估该药物的功效和安全性。", "keywords_zh": "瘘管性克罗恩病、脂肪干细胞、darvadstrocel、治疗", "keywords_en": "Fistulizing Crohn’s disease, adipose-derived stem-cells, darvadstrocel, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/38223244/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Mon, 15 Jan 2024"}, {"id": "37545826", "title_en": "Hidradenitis suppurativa and squamous cell carcinoma: a systematic review of the literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Beata Bergler-Czop", "abstract_en": "Hidradenitis suppurativa (HS) is a chronic disease which is often recurrent and occurs as abscesses of the apocrine gland. The most common locations of HS are gluteal/perianal, axillary or inguinal. It is reasonable to assume that squamous cell carcinoma may arise from HS. As researchers in the field of dermatology, HS surgery and conventional surgical oncology, we studied whether there is any correlation between HS and neoplasms. Evidence shows a correlation between HS and squamous cell carcinoma. The aim of the study was to find literature about HS and SCC and analyse potential risk factors. This is a systemic review concerning squamous cell carcinoma and hidradenitis suppurativa.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "hidradenitis suppurativa, squamous cell carcinoma, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/37545826/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Mon, 07 Aug 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "单独引流与引流联合瘘管治疗儿童肛周脓肿的系统回顾和荟萃分析", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "这项非随机研究（NRS）的系统回顾和荟萃分析旨在评估两种类型的手术干预（分别单独引流和引流联合初次瘘管治疗）治疗儿童肛周脓肿（PA）的临床疗效和安全性。在 10 个电子数据库中检索了 1992 年至 2022 年 7 月的研究。包括所有具有可用数据的相关 NRS，这些 NRS 比较了手术引流与或不进行初次瘘管治疗的情况。排除患有导致脓肿形成的基础疾病的患者。纽卡斯尔-渥太华量表用于评估纳入研究的偏倚风险和质量。结果是愈合率、瘘管形成率、大便失禁和伤口愈合持续时间。共有 16 篇文章、1,262 名患者被认为适合最终的荟萃分析。与单独切开引流相比，原发性瘘管治疗具有显着更高的治愈率（比值比 [OR]：5.76，95% 置信区间 [CI]：4.04-8.22）。这种积极的 PA 手术使瘘管形成率降低了 86%（OR：0.14，95% CI：0.06-0.32）。有限的数据显示，接受原发性瘘管治疗的患者对术后大便失禁的影响较小。原发性瘘管治疗在促进儿童PAs愈合率和减少瘘管形成方面显示出更好的临床疗效。现有证据表明这种干预后对肛门功能有轻微影响。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "小儿肛周脓肿和肛瘘的最佳初步治疗：系统评价和荟萃分析", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "**背景：** 肛周脓肿和肛瘘很常见。以往的系统评价并未考虑意向治疗原则。因此，初级治疗和复发后治疗之间的比较是混乱的，初级治疗的建议也含糊不清。目前的研究旨在确定儿科患者的最佳初始治疗。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 涉及 2507 名儿科患者的 31 项研究符合纳入标准。研究设计包括两个包含 47 名患者的前瞻性病例系列和回顾性队列研究。没有发现随机对照试验。使用随机效应模型对初始治疗后的复发进行荟萃分析。保守治疗和引流显示没有差异（优势比 [OR]，1.222；95% 置信区间 [CI]：0.615-2.427，p = 0.567）。保守治疗的复发风险高于手术，但无统计学意义（OR 0.278，95% CI：0.109-0.707，p = 0.007）。与切开/引流相比，手术可以显着预防复发（OR 4.360，95% CI：1.761-10.792，p = 0.001）。由于缺乏信息，未对保守治疗和手术中的不同方法进行亚组分析。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Level of evidence：** 研究类型：系统评价；证据级别：II级。", "keywords_zh": "肛瘘，儿科，肛周脓肿，初级治疗", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36794974", "title_en": "Mesenchymal Stem Cells Versus Placebo for Perianal Fistulizing Crohn's Disease: A Systemic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Minhao Yu", "abstract_en": "**Background:** Mesenchymal stem cells (MSCs)-based therapy for perianal fistulizing Crohn's disease (pfCD) has been extensively studies in the past decade. Its efficacy and safety had been preliminarily confirmed in some phase 2 or phase 3 clinical trials. This meta-analysis is performed to evaluate the efficacy and safety of MSCs-based therapy for pfCD.\n\n**Methods:** Electronic databases (Pubmed, Cochrane Library, Embase) were searched for studies that reported the efficacy and safety of MSCs. And RevMan were used to assess the efficacy and safety.\n\n**Results:** After screening, 5 randomized controlled trials (RCTs) were included in this meta-analysis. RevMan 5.4 for meta-analysis showed that: [Efficacy] Patients had definite remission after MSCs treatment, with an odds ratio (OR) of 2.06 (<i>P</i> < .0001, 95%CI 1.46, 2.89) vs controls. [Safety] The incidence of the most frequently reported TEAEs (treatment-emergent adverse events, TEAEs), perianal abscess and proctalgia, did not significantly increase due to the use of MSCs, with an OR of 1.07 in perianal abscess (<i>P</i> = .87, 95%CI 0.67, 1.72) vs controls, and an OR of 1.10 in proctalgia (<i>P</i> = .47, 95%CI 0.63, 1.92) vs controls.\n\n**Conclusions:** MSCs seem to be an effective and safe therapy for pfCD. MSCs based therapy has the potential to be used in combination with traditional therapies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 在电子数据库（Pubmed、Cochrane Library、Embase）中检索了报告 MSC 功效和安全性的研究。并用RevMan评估疗效和安全性。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** MSC 似乎是治疗 pfCD 的有效且安全的疗法。基于间充质干细胞的疗法有可能与传统疗法结合使用。", "keywords_zh": "间充质干细胞，荟萃分析，肛周瘘管克罗恩病", "keywords_en": "mesenchymal stem cells, meta-analysis, perianal fistulizing Crohn’s disease", "link": "https://pubmed.ncbi.nlm.nih.gov/36794974/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 16 Feb 2023"}, {"id": "34792604", "title_en": "Epidemiology and Natural History of Perianal Crohn's Disease: A Systematic Review and Meta-Analysis of Population-Based Cohorts", "title_zh": "肛周克罗恩病的流行病学和自然史：基于人群的系统回顾和荟萃分析", "authors": "Siddharth Singh", "abstract_en": "**Background And Aims:** Perianal Crohn's disease (pCD) is a potentially severe phenotype of CD. We conducted a systematic review with meta-analysis to estimate cumulative incidence, risk factors, and outcomes of pCD in population-based cohort studies.\n\n**Methods:** Through a systematic literature review through March 1, 2021, we identified population-based inception cohort studies reporting cumulative incidence of perianal disease (primarily abscess and/or fistula) in patients with CD. We estimated the cumulative incidence of pCD at presentation and 1-, 5-, and 10-year follow-up, and risk factors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\n**Results:** In 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\n**Conclusions:** Approximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 通过截至 2021 年 3 月 1 日的系统文献回顾，我们确定了基于人群的起始队列研究，报告了 CD 患者肛周疾病（主要是脓肿和/或瘘管）的累积发病率。我们估计了就诊时以及 1 年、5 年和 10 年随访时的 pCD 累积发生率，以及肛周疾病和结局的危险因素，包括大手术（肠切除、直肠切除术、造口术）和小肛周手术（切开引流、挂线放置等）的风险。\n\n**结果：** 在 12 项基于人群的研究中，pCD 患病率为 18.7%（95% 置信区间 [CI]，12.5%-27.0%），肛周疾病的 1 年、5 年和 10 年风险分别为 14.3%（95% CI，7.9%-24.6%）、17.6%（95% CI，11.3%-26.5%）和分别为 18.9%（95% CI，15.0%-23.4%）。大约 11.5% 的患者 (95% CI, 6.7%-19.0%) 在 CD 诊断时或之前患有肛周疾病。结肠疾病部位和直肠受累与较高的 pCD 风险相关。总体而言，63.3% 的患者 (95% CI, 53.3-72.3) 需要进行小型肛周手术，6.4% 的患者 (95% CI, 1.8%-20.6%) 需要针对 pCD 进行腹部大手术。使用生物疗法治疗 pCD 很常见，并且多年来一直在稳步增加。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "link": "https://pubmed.ncbi.nlm.nih.gov/34792604/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34792583", "title_en": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\n**Methods:** We performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\n**Results:** Twenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\n**Conclusions:** Limited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 有限的高质量证据表明，影像学特征可能有助于区分肛周瘘患者的 CD 和 CGD。需要更大规模的前瞻性研究来证实这些发现，并评估结合多种诊断测试是否可以提高诊断灵敏度。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "cryptoglandular disease, fistula-in-ano, perianal disease", "link": "https://pubmed.ncbi.nlm.nih.gov/34792583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34628909", "title_en": "A systematic review and meta-analysis of incision and seton drainage in the treatment of high perianal abscess", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Lihua Zheng", "abstract_en": "**Background:** Surgery is the clinically preferred treatment for high perianal abscesses. Incision and seton drainage improve the cure rate and reduce recurrence. We aimed to systematically evaluate the clinical effect and safety of incision and seton drainage in the treatment of high perianal abscess.\n\n**Methods:** China Knowledge Network (CNKI), WanFang database, VIP database, PubMed, and Cochrane Library were searched and all relevant Chinese and English language documents until July 2021were retrieved. All records that described randomized clinical trials (RCTs) of incision and seton drainage for the treatment of high perianal abscess were eligible. Documents that met the inclusion criteria were evaluated for bias using the Cochrane Collaboration Risk Evaluation Standard, and Revman5.4 software was used to analyze the data.\n\n**Results:** Fourteen RCTs were included. The results of nine studies showed that the clinical cure rate of the incision-seton group was higher than that of the incision-drainage group (P<0.05). Seven studies showed that the wound healing time of the incision-seton group was shorter than that of the incision-drainage group (P<0.05). Four studies showed that the visual analogue scale (VAS) score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Five studies showed that the Wexner score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Six studies showed that the formation rate of anal fistula in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Six studies demonstrated that the recurrence rate of abscess in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Seven studies showed that the incidence of adverse events in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Five studies demonstrated that the length of stay in the incision-seton group was shorter than that of the incision-drainage group (P<0.05).\n\n**Discussion:** The choice of surgical methods in clinical research has always been controversial. The incision-seton method can effectively and safely treat high perianal abscess. However, the results of this meta-analysis still leave some gaps in the evidence. More large-sample, high-quality, and multi-center RCTs are needed.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 检索中国知网（CNKI）、万方数据库、维普数据库、PubMed、Cochrane图书馆，检索截至2021年7月的所有相关中英文文献。所有描述切开挂线引流治疗高位肛周脓肿的随机临床试验 (RCT) 的记录均符合资格。使用Cochrane协作风险评估标准对符合纳入标准的文献进行偏倚评估，并使用Revman5.4软件对数据进行分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Incision-seton therapy, high perianal abscess, incision-drainage therapy, meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/34628909/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260824212438&v=2.20.1", "date": "Mon, 11 Oct 2021"}], "肛瘘": [{"id": "42562203", "title_en": "Invited Commentary on Beyond Incontinence: A Systematic Review and Meta-Analysis of Sexual Dysfunction after Anal Fistula Surgery", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Samuel Eisenstein", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42562203/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 06 Aug 2026"}, {"id": "42404302", "title_en": "Diffusion tensor imaging of the pelvic floor muscles and pelvic organs: a systematic review", "title_zh": "盆底肌肉和盆腔器官的扩散张量成像：系统评价", "authors": "Yan Chen", "abstract_en": "**Purpose:** This paper provides a systematic review of the current applications of diffusion tensor imaging (DTI) in the imaging of pelvic floor-related anatomical structures and the assessment of microscopic pathological changes.\n\n**Methods:** A systematic search of the PubMed, EMBASE, and Cochrane Library databases was conducted, with a focus on studies involving the application of diffusion tensor imaging to pelvic organs and muscles. The search was conducted from the inception of each database through to 11 December 2025. The present study incorporated a range of research methodologies, including randomized controlled trials (RCTs) and observational studies. The screening and reporting phases of the study adhered to the PRISMA guidelines, while the quality assessment was conducted using the Oxford Centre for Evidence-Based Medicine (OEBM) evidence grading tool.\n\n**Results:** The final sample comprised a total of 30 studies. Of these, two studies reported the application of DTI on the anal canal and its diagnostic value for anal fistula. Five studies demonstrated the ability of DTI to visualize microstructural alterations in endometriosis and uterine fibroids by measuring uterine anisotropy fraction and fibre tracking. A total of 19 studies reported the utilization of DTI applications in the context of prostate and prostate tumor analysis. Four studies have documented its use in healthy pelvic muscles and pelvic floor dysfunction.\n\n**Conclusion:** The findings suggest that the application of diffusion tensor imaging metrics in the pelvic region may aid in the assessment of tissue microstructural disruption and the distinction between benign and malignant or inflammatory lesions through relevant parameters, thereby enhancing diagnostic specificity. As diffusion tensor imaging becomes increasingly utilized in imaging for treatment guidance, it is imperative to develop a comprehensive understanding of its application in the pelvic region.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "diffusion, diffusion tensor imaging, magnetic resonance imaging, pelvic floor, pelvic floor organ", "link": "https://pubmed.ncbi.nlm.nih.gov/42404302/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 06 Jul 2026"}, {"id": "42392439", "title_en": "Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul D Yagnik", "abstract_en": "**Background:** Traditional metrics for anal fistula surgery prioritize healing and continence, largely ignoring intimacy and psychosocial well-being. Addressing a critical literature gap, this novel systematic review and exploratory meta-analysis is the first to mathematically evaluate the sex-specific impacts of fistula surgery and seton placement on sexual function.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyzes-compliant search of PubMed, Embase, Scopus, and Cochrane databases identified studies using validated sexual indices: International Index of Erectile Function (IIEF) for males and the Female Sexual Function Index (FSFI), and targeted quality-of-life surveys for cryptoglandular or Crohn's-associated fistulas. This study uniquely pooled continuous pre- and postoperative functional data using standardized mean differences.\n\n**Results:** A total of 18 studies were included. The systematic review established a stark, previously unquantified sex dimorphism in surgical recovery. Definitive surgical cure yielded highly significant improvements in IIEF (male) by eradicating chronic suppuration (P <.001). Conversely, FSFI (female) showed negligible improvement or active deterioration, frequently complicated by anterior-tract dyspareunia. Furthermore, this review quantified the \"Seton Paradox:\" although loose setons successfully mitigate sepsis, cross-sectional pooling demonstrated that they inflict severe, statistically significant impairment on female sexual function (P =.02) and drive high rates of body-image avoidance across both genders. Crucially, the synthesis of patient-reported data revealed a systemic failure in informed consent, showing that 79% of patients never received preoperative sexual counseling.\n\n**Conclusion:** Anal fistula surgery inflicts a profound, sex-dimorphic toll on sexual function. As the first systematic review to objectively highlight this disparity and quantify the psychological burden of chronic setons, these findings mandate a clinical paradigm shift. Proactive counseling regarding dyspareunia, body image, and intimacy must become a mandatory component of preoperative informed consent.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Crohn’s disease, Dyspareunia, Quality of life, Sexual dysfunction", "link": "https://pubmed.ncbi.nlm.nih.gov/42392439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 02 Jul 2026"}, {"id": "42161324", "title_en": "Intestinal ultrasound to detect postoperative recurrence in patients with Crohn's disease: an international, multidisciplinary, RAND/UCLA appropriateness method study", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kerri L Novak", "abstract_en": "**Background:** Intestinal ultrasound is a non-invasive method increasingly used to diagnose and monitor disease activity in patients with inflammatory bowel disease; however, there is no consensus on the appropriate implementation of intestinal ultrasound to assess postoperative recurrence in Crohn's disease. We aimed to develop expert-based recommendations for standardising intestinal ultrasound use for the detection and evaluation of postoperative Crohn's disease recurrence.\n\n**Methods:** An international, multidisciplinary, modified RAND/University of California Los Angeles appropriateness method was used. Based on a systematic review and meta-analysis of the literature, expert opinion, and panellist feedback, a list of statements related to the use of intestinal ultrasound in this setting was generated. Panellists with expertise in Crohn's disease intestinal ultrasound, surgery, postoperative management, clinical trials, and outcome measures were invited. Panellists r
