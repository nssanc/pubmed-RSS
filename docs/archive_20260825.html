0.51, p < 0.00001, I²=28%), lower 30-day reoperation rate (OR 0.86, 95% CI 0.77-0.96, p = 0.01, I²=0%), reduced 30-day mortality (OR 0.65, 95% CI 0.52-0.82, p = 0.002, I²=0%), and higher rate of complete total mesorectal excision (OR 2.71, 95% CI 1.38-5.33, p = 0.01, I²=72%). Operative time was significantly longer in the robotic group (MD + 30.58 min, 95% CI 13.71-47.45, p = 0.001, I²=97%). No significant differences were observed for estimated blood loss, overall complications, major complications, anastomotic leakage, postoperative ileus, recovery parameters, length of hospital stay, readmission, circumferential margin positivity, lymph node yield, local recurrence, diverting ileostomy formation, disease-free survival, or overall survival. Robotic LAR may reduce conversion, reoperation, and short-term mortality and may improve completeness of total mesorectal excision, although operative time is longer. These findings suggest potential technical advantages of R-LAR, but high-quality randomized trials are required to determine whether these translate into meaningful clinical benefit.PROSPERO: CRD420261326600.", "abstract_zh": "机器人手术越来越多地用于直肠癌的治疗。然而，大多数先前的荟萃分析包括异质直肠手术，限制了低位前切除术的具体结论。本研究旨在提供最新的系统评价和荟萃分析，比较机器人与腹腔镜低位前切除直肠癌的情况。这项系统评价和荟萃分析是根据 PRISMA 指南和 Cochrane 手册的建议进行的。从开始到最近的日期，PubMed、Scopus 和 Cochrane 图书馆都被系统地检索。其中包括评估机器人低位前切除术（R-LAR）与腹腔镜低位前切除术（L-LAR）治疗直肠癌的比较研究。使用 RoB 2 评估随机试验的偏倚风险，使用 ROBINS-I 评估非随机研究的偏倚风险。使用 GRADE 方法评估证据的质量。分析了 33 项研究，包括 82,149 名患者（R-LAR：56,290；L-LAR：25,859）。 R-LAR 与显着较低的转化率（OR 0.45，95% CI 0.40-0.51，p < 0.00001，I²=28%）、较低的 30 天再手术率（OR 0.86，95% CI 0.77-0.96，p = 0.01，I²=0%）、降低30天死亡率（OR 0.65，95% CI 0.52-0.82，p = 0.002，I²=0%），完全直肠系膜切除率较高（OR 2.71，95% CI 1.38-5.33，p = 0.01，I²=72%）。机器人组的手术时间明显更长（MD + 30.58 分钟，95% CI 13.71-47.45，p = 0.001，I²=97%）。在估计失血量、总体并发症、主要并发症、吻合口瘘、术后肠梗阻、恢复参数、住院时间、再入院、环切缘阳性、淋巴结产量、局部复发、改道回肠造口形成、无病生存或总体生存方面，没有观察到显着差异。机器人 LAR 可减少转化、再次手术和短期死亡率，并可提高全直肠系膜切除的完整性，尽管手术时间较长。这些发现表明 R-LAR 具有潜在的技术优势，但需要高质量的随机试验来确定这些优势是否转化为有意义的临床益处。PROSPERO：CRD420261326600。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Laparoscopic, Low anterior resection, Meta-analysis, Rectal cancer, Robotic", "link": "https://pubmed.ncbi.nlm.nih.gov/42126654/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 13 May 2026"}, {"id": "42112665", "title_en": "Vascular and Wound-Healing Implications of Single-Stage Versus Multistage Repair of Anorectal Malformations: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jingming Zhao", "abstract_en": "**Background:** Anorectal malformations (ARMs) are managed using either single-stage or multistage surgical repair. However, concerns persist regarding wound-related complications and long-term functional outcomes, which remain inconsistently reported across surgical approaches.\n\n**Objective:** To compare wound-related complications and long-term functional outcomes following single-stage versus multistage repair of ARMs, with emphasis on wound perfusion, dehiscence, and vascular healing dynamics.\n\n**Methods:** A systematic review and meta-analysis were conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines and registered in the International Prospective Register of Systematic Reviews (PROSPERO; CRD420251006245). PubMed and the Cochrane Central Register of Controlled Trials (CENTRAL) were searched for studies published between 2000 and 2024 comparing single-stage and staged ARM repair in neonates and infants. Outcomes included wound dehiscence, surgical site infection (SSI), stenosis, prolapse, redo surgery, constipation, soiling, and voluntary bowel movements. Pooled odds ratios (ORs) with 95% confidence intervals (CIs) were calculated using a random-effects model. Study quality was assessed using the Methodological Index for Non-Randomized Studies (MINORS).\n\n**Results:** Nineteen studies involving 1,972 patients were included. Single-stage repair was associated with a significantly higher risk of wound dehiscence (OR 3.31; 95% CI 1.90-5.79; <i>p</i> < 0.0001), while no significant differences were observed for SSI, stenosis, prolapse, redo surgery, constipation, soiling, or voluntary bowel movements. Moderate to high heterogeneity was noted for selected outcomes.\n\n**Conclusions:** Single-stage repair provides comparable infection rates and long-term functional outcomes to multistage surgery but carries an increased risk of wound dehiscence. Optimizing tissue perfusion and minimizing tension are essential to improve outcomes.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformation, dehiscence, posterior sagittal anorectoplasty, vascular perfusion, wound healing", "link": "https://pubmed.ncbi.nlm.nih.gov/42112665/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 11 May 2026"}, {"id": "42110541", "title_en": "An ethnobotanical review of medicinal plants used for treating hemorrhoids in Thailand", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ruyu Yao", "abstract_en": "Hemorrhoids is one of the most prevalent diseases affecting people's health both in Thailand and worldwide. The therapeutic use of medicinal plants for hemorrhoidal treatments is widespread across many countries, supported by evidence demonstrating the efficacy of their pharmacological activity. This study aims to (1) conduct an in-depth literature review on plants used in Thailand for hemorrhoid treatment and (2) identify the most promising species in traditional Thai medicine to effectively treat hemorrhoids. A total of 53 references were methodically reviewed. The important medicinal plants were determined using ethnobotanical indices including use-value (UV) and choice value of species (CVs), and the important species were selected for an in-depth review of their pharmacological activities. Our literature review found that there were 181 species belonging to 147 genera and 78 families used to treat hemorrhoids among 18 ethnic groups. The most cited species were <i>Cissus quadrangularis</i>, <i>Biancaea sappan</i>, <i>Croton persimilis</i>, <i>Mimosa pudica</i>, <i>Aegle marmelos</i>, <i>Leea indica</i>, <i>Plumbago indica</i>, <i>Rotheca serrata</i>, and <i>Tectona grandis</i>. Prevalent pharmacological activities such as anti-inflammatory, anti-oxidative, anti-microbial, anti-hemorrhoid, analgesic, and vasorelaxant activities are found in key species used for hemorrhoid treatment. This study identifies the most important species for ethnopharmacological explorations in hemorrhoid treatments, which is expected to inspire the selection of medicinal plants for development into pharmaceutical products.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Rid Si Duang, Thai medicine, anti-inflammatory plants, piles, quantitative ethnobotany, traditional", "link": "https://pubmed.ncbi.nlm.nih.gov/42110541/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 11 May 2026"}, {"id": "42069871", "title_en": "Clinical and surgical management of recto-urinary fistula after radical prostatectomy: a systematic review on current evidence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Marco Bandini", "abstract_en": "**Background:** Management of rectourinary fistula (RUF) is challenging due to limited data and variability in presentation and treatment. We conducted a systematic review of radical prostatectomy (RP)-related RUF to assess clinical features, diagnostics, treatments, and outcomes, and to propose a structured algorithm to guide management.\n\n**Methods:** We conducted a systematic review in accordance with PRISMA guidelines to evaluate the clinical presentation, diagnostic strategies, management approaches, and outcomes of RUF following RP. A comprehensive search of PubMed, Embase, and Web of Science was performed from database inception to January 2025. Data were extracted on patient demographics, symptoms, diagnostic modalities, management strategies, surgical repair techniques and treatment outcomes.\n\n**Results:** A total of 455 cases of RUF following RP were identified across 34 studies. The reported incidence of RUF ranged from <0.01% to 1.5%. The most frequent presenting symptoms were urine leakage per rectum (60.7%), fecaluria (44.1%), and pneumaturia (50.0%). Fecal and/or urinary diversion was utilized in over 60% of cases, with a median stoma duration of 3 months and an indwelling urinary catheter duration of 1 month. Conservative management (observation, fluid replacement and antibiotic therapy) was attempted in a minority of patients and was generally associated with success rates below 50%. Surgical repair was performed in nearly all cases, with the transperineal and transsphincteric approaches being the most commonly employed techniques. The median time to fistula closure ranged from 0.5 to 30 months, with reported surgical success rates varying between 41% and 100%. We propose a management flowchart based on our clinical experience, outlining the diagnostic and therapeutic approach to rectal injury and RP-related RUF.\n\n**Conclusions:** RUF after RP remains a challenging complication, often requiring stepwise management. Conservative treatments rarely succeed, and surgery is often necessary. Our proposed algorithm aims to standardize the approach to RI and RUF, guiding treatment decisions and improving outcomes.", "abstract_zh": "**背景：** 由于数据有限以及表现和治疗的可变性，直肠瘘（RUF）的治疗具有挑战性。我们对根治性前列腺切除术 (RP) 相关的 RUF 进行了系统评价，以评估临床特征、诊断、治疗和结果，并提出一种结构化算法来指导管理。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42069871/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sat, 02 May 2026"}, {"id": "42001933", "title_en": "Group B Streptococcus in African pregnancies: A systematic review and meta-analysis of its maternal rectovaginal colonization, vertical transmission, serotype distribution, and antimicrobial resistance", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Piet Cools", "abstract_en": "**Objectives:** We conducted a systematic review and meta-analysis to estimate maternal Group B Streptococcus (GBS) colonization, vertical transmission, serotype distribution, and antimicrobial resistance (AMR) burden of GBS in African pregnant women and newborn infants.\n\n**Methods:** Literature searches were performed on CINAHL, EMBASE, Cochrane Library, Google Scholar, ProQuest, PsycINFO, MEDLINE/PubMed, WHO IRIS, Scopus, Web of Science, African Journals Online, and University repositories. Heterogeneity was evaluated using Cochrane's chi-square test and the I² statistics, and potential publication bias was assessed using Egger's regression intercept.\n\n**Results:** A total of 116 studies from 29 African countries (n = 53,770 participants) were included. The pooled prevalence of maternal rectovaginal GBS colonization was 18% (95% confidence interval [CI]: 16%-20%). The pooled proportion of vertical transmission was 47% (95% CI: 39%-55%). Among maternal isolates, serotypes V (27%; 95% CI: 23%-32%), Ia (24%; 95% CI: 19%-29%), III (23%; 95% CI: 19%-26%), and II (19%; 95% CI: 13%-25%) were most frequently detected. Among neonatal isolates, serotypes V (31%; 95% CI: 22%-41%), Ia (26%; 95% CI: 17%-35%), III (23%; 95% CI: 15%-31%), and II (15%; 95% CI: 12%-19%) were identified. AMR was high for tetracycline (87%; 95% CI: 85%-88%) and cotrimoxazole (75%; 95% CI: 72%-78%), and low for β-lactams, including ampicillin (10%; 95% CI: 9%-12%) and penicillin (9%; 95% CI: 8%-11%).\n\n**Conclusion:** The prevalence of maternal GBS rectovaginal colonization and vertical transmission in Africa is high and comparable to global estimates, but there were marked regional variations. The predominance of serotypes V, Ia, and III supports their inclusion in multivalent vaccine formulations. Widespread resistance to tetracycline and cotrimoxazole and moderate macrolide resistance highlight the need for antimicrobial stewardship and ongoing surveillance.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Africa, Antimicrobial resistance, Group B Streptococcus, Pregnant women, Serotypes, Vertical transmission", "link": "https://pubmed.ncbi.nlm.nih.gov/42001933/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sun, 19 Apr 2026"}, {"id": "41984221", "title_en": "Anorectal malformation in adulthood: a systematic review of biological, psychological, and sociological outcomes and experiences", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Paul Harris", "abstract_en": "**Purpose:** Anorectal malformations are congenital anomalies involving the rectum, anus, genital, and urinary tracts, and occur in approximately one in 5000 live births. A lack of transition from pediatric to adult health services means little is known about how this condition is experienced in adulthood. The purpose of this review was to discover biopsychosocial challenges and supports experienced by adults living with anorectal malformation.\n\n**Materials And Methods:** A systematic quantitative literature review was the preferred method to collect and analyze data. Articles included in the review were sorted into purpose-built datasets, with data coded into biopsychosocial themes and patterns.\n\n**Results:** The most frequently reported biological challenge was surgical intervention; the most frequently reported support was positively framed continence management. The most common psychological challenges were psychosexual concerns such as sexual anxiety, and the most common supports were interventions focused on improving self-perception. The most reported sociological challenge was navigating complex health systems, and the most reported support was forming meaningful relationships.\n\n**Conclusion:** Biopsychosocial outcomes experienced by adults born with anorectal malformation remain largely unknown. Social work and psychology can provide therapeutic interventions that enhance emotional wellbeing, psychosocial functioning, and patient-led care.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformation, Psychology, Psychosocial functioning, Social work", "link": "https://pubmed.ncbi.nlm.nih.gov/41984221/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 15 Apr 2026"}, {"id": "41945234", "title_en": "Comparative Effectiveness and Safety of Fecal Microbiota Transplantation in Ulcerative Colitis: An Updated Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Rong Wang", "abstract_en": "**Introduction:** Fecal microbiota transplantation (FMT) is a potential therapy for ulcerative colitis (UC). Evidence has expanded, but the impact of delivery route on efficacy and safety remains uncertain.\n\n**Methods:** We systematically searched PubMed, Embase, Cochrane Library, Web of Science and China National Knowledge Infrastructure (CNKI) from inception to October 2025 for randomized controlled trials (RCTs) comparing donor-derived FMT with placebo/sham or autologous FMT in patients with UC. Primary outcomes were clinical and endoscopic remission at induction (8-12 weeks). Adverse events (AEs) were secondary. Random effect models generated risk ratios (RRs) with 95% CIs. Pre-specified subgroup analyses compared delivery routes (colonoscopy, rectal enema, combined colonoscopy + enema, nasoduodenal infusion, oral capsules).\n\n**Results:** Sixteen RCTs were included. Overall, FMT improved clinical remission (RR = 1.81, 95% CI: 1.41-2.31; I<sup>2</sup> = 0%) and endoscopic remission (RR = 1.74, 95% CI: 1.00-3.01; I<sup>2</sup> = 45.5%). By route, significant effects were seen for colonoscopy (RR = 1.58, 95% CI 1.05-2.37), rectal enema (RR = 1.62, 95% CI 1.04-2.54) and combined colonoscopy + enema (RR = 2.39, 95% CI 1.47-3.89) for clinical remission; nasoduodenal and oral capsule results were imprecise. For endoscopic remission, the combined route showed the most consistent benefit (RR = 2.19, 95% CI 1.04-4.62). AEs did not differ from control (RR = 1.03, 95% CI 0.90-1.18; I<sup>2</sup> = 11.2%).\n\n**Conclusions:** FMT improves induction-phase clinical and endoscopic remission in patients with UC without increasing AEs. Efficacy appears route-dependent, with colonoscopy + enema demonstrating the largest effect. Head-to-head trials optimizing route and dosing with longer follow-up are warranted.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 其中包括十六项随机对照试验。总体而言，FMT 改善了临床缓解（RR = 1.81，95% CI：1.41-2.31；I<sup>2</sup> = 0%）和内镜缓解（RR = 1.74，95% CI：1.00-3.01；I<sup>2</sup> = 0%）。我<sup>2</sup> = 45.5%）。按途径来看，结肠镜检查（RR = 1.58，95% CI 1.05-2.37）、直肠灌肠（RR = 1.62，95% CI 1.04-2.54）和联合结肠镜 + 灌肠（RR = 2.39，95% CI）具有显着效果。 1.47-3.89)用于临床缓解；鼻十二指肠和口腔胶囊结果不精确。对于内镜缓解，联合途径显示出最一致的益处（RR = 2.19，95% CI 1.04-4.62）。 AE 与对照没有差异（RR = 1.03，95% CI 0.90-1.18；I<sup>2</sup> = 11.2%）。\n\n**结论：** FMT 可改善 UC 患者的诱导期临床和内镜缓解，且不会增加 AE。功效似乎具有途径依赖性，结肠镜检查+灌肠效果最大。有必要进行头对头试验来优化给药途径和剂量并进行更长时间的随访。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Delivery route, Fecal microbiota transplantation, Meta-analysis, Randomized controlled trial, Ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/41945234/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 07 Apr 2026"}, {"id": "41931335", "title_en": "Neuroendocrine neoplasms diagnosed in the setting of inflammatory bowel disease: A systematic review and proposed management algorithm", "title_zh": "炎症性肠病中诊断的神经内分泌肿瘤：系统评价和提出的管理算法", "authors": "Nikolaos A Trikalinos", "abstract_en": "**Background:** Patients with inflammatory bowel disease (IBD) are at higher risk of developing malignancies, including neuroendocrine neoplasms, but the specifics of that are not well known. We reviewed the existing literature to map the evidence surrounding this phenomenon.\n\n**Methods:** Following PRISMA 2020 guidelines, we searched PubMed from inception to September 2024 for patients with gastrointestinal neuroendocrine neoplasms (NENs) and either Crohn disease (CD) or ulcerative colitis (UC). Eligible studies included case reports, case series, and larger retrospective IBD cohorts. We extracted demographic and clinical data including tumor grade, location, metastatic status, and mode of detection. Comparative analyses between UC and CD were performed using Fisher exact test, chi-square test, and independent t-tests.\n\n**Results:** We identified 67 case studies with data available for a total of 108 patients (61.1% male), ranging from 14 to 87 years of age. The median duration from IBD diagnosis to NEN detection was 13 years. Fifty-five (50.9%) patients had CD and 53 (49.1%) had UC. UC patients were older at NEN diagnosis (mean 49 vs 40 years, P = .004) and had a higher metastatic rate (39.6% vs 18.2%, P = .019). Most NENs were low-grade (69.4%), while 20.4% were high-grade and 8.3% were mixed. The most common tumor locations were the rectum (29.6%) and appendix (27.8%), with rectal and colonic NENs more prevalent in UC and small bowel or appendiceal NENs more common in CD. At diagnosis, 71.3% of patients had localized disease. For high-grade NENs, 86.4% of cases were metastatic, compared to 9.3% for low-grade tumors. Only 10.2% of NENs were detected via endoscopic surveillance.\n\n**Conclusions:** NENs in IBD show distinct patterns by IBD type, with significant differences in tumor location, grade, and metastatic rates between UC and CD. These hypothesis-generating observations suggest heightened vigilance after approximately 10 years of IBD or around age 44, focusing on rectal lesions in UC and small bowel/appendiceal lesions in CD. Validation in prospective, population-based studies is needed before these findings can inform clinical practice.", "abstract_zh": "**背景：** 炎症性肠病（IBD）患者患恶性肿瘤（包括神经内分泌肿瘤）的风险较高，但其具体情况尚不清楚。我们回顾了现有文献，以绘制围绕这一现象的证据。\n\n**方法：** 根据 PRISMA 2020 指南，我们在 PubMed 上检索了从成立到 2024 年 9 月期间患有胃肠道神经内分泌肿瘤 (NEN) 和克罗恩病 (CD) 或溃疡性结肠炎 (UC) 的患者。符合条件的研究包括病例报告、病例系列和更大的回顾性 IBD 队列。我们提取了人口统计和临床数据，包括肿瘤分级、位置、转移状态和检测模式。使用 Fisher 精确检验、卡方检验和独立 t 检验进行 UC 和 CD 之间的比较分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn disease, inflammatory bowel disease, neuroendocrine neoplasms, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/41931335/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 03 Apr 2026"}, {"id": "41871586", "title_en": "Indocyanine green fluorescence angiography for anastomotic perfusion assessment in colorectal surgery: a systematic review with meta-analysis, meta-regression, and trial sequential analyses", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ronan A Cahill", "abstract_en": "**Background:** Anastomotic leak is a serious complication in colorectal surgery. Indocyanine green fluorescence angiography (ICGFA) is an adjunctive digital method of assessing bowel perfusion intraoperatively. We assessed whether ICGFA use during surgery reduces postoperative anastomotic leak exclusively using data from randomised controlled trials (RCTs).\n\n**Methods:** In this systematic review and meta-analysis, we searched PubMed, ScienceDirect, Scopus, Web of Science, Embase, and the Cochrane Collaboration databases from inception to July 19, 2025, for English-language RCTs comparing additive intraoperative ICGFA with standard surgeon perfusion assessment alone in patients undergoing colorectal resection with primary anastomosis according to prespecified criteria and PRISMA guidelines. Summary-level data were extracted by two reviewers. The primary outcome was overall anastomotic leak rate. The Jadad scale (Oxford quality scoring system) was used to assess trial quality, the Cochrane Risk of Bias (RoB 2) tool for RCTs was used to assess risk of bias, and GRADE was used to assess strength of evidence. Meta-regression and trial sequential analyses were performed. This study is registered with PROSPERO, CRD420250652639.\n\n**Findings:** 719 records were initially identified, with 387 remaining after screening and 184 sought for full eligibility screening, of which nine were eligible RCTs (with 4754 patients) for analysis. ICGFA significantly reduced overall anastomotic leak (risk ratio 0·66 [95% CI 0·56-0·78], p<0·0001; number needed to treat [NNT]=24), with trial sequential analysis showing that the required information size (2183) was exceeded overall. ICGFA reduced both anastomotic leak requiring intervention (risk ratio 0·73 [95% CI 0·60-0·89], p=0·0020; NNT=39) and anastomotic leak not requiring intervention (0·48 [0·31-0·72], p=0·0004, NNT=35). Significant benefit was observed for left-sided resections (risk ratio 0·62 [95% CI 0·51-0·74], p<0·0001; NNT=19), rectal resections (0·62 [0·51-0·76], p<0·0001; NNT=19), and low anterior resections (0·62 [0·48-0·79], p<0·0001; NNT=13), in which the required information size was also exceeded, but not for right-sided resections. In the meta-regression analysis, among all tested covariates, only patient BMI significantly modified the ICGFA treatment effect, with an increasing protective effect with increasing BMI (coefficient -0·0153 [95% CI -0·0251 to -0·0056], p=0·0020). Evidence was graded as high certainty for overall, left-sided, rectal, asymptomatic, and 30-day anastomotic leaks, and moderate certainty for clinically significant anastomotic leak.\n\n**Interpretation:** Intraoperative use of ICGFA reduces anastomotic leak rates in left-sided and rectal colorectal resections. Given the evidence available now, further general efficacy trials are no longer required and research should shift to implementation and defined targeted subgroup ICGFA role definition (ie, in non-rectal left-sided resections).\n\n**Funding:** None.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Findings：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Interpretation：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Funding：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41871586/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 23 Mar 2026"}, {"id": "41857485", "title_en": "The Clinical Relevance of the Rectosigmoid Brake in Surgical Disorders and Therapies: A Systematic Review of Colonic Manometry Studies", "title_zh": "直肠乙状结肠制动在外科疾病和治疗中的临床相关性：结肠测压研究的系统回顾", "authors": "Gregory O'Grady", "abstract_en": "**Background:** The rectosigmoid brake (RSB) regulates rectal filling via retrograde cyclic motor patterns in the distal colon. Disruption has been linked to postoperative ileus (POI), low anterior resection syndrome (LARS), fecal incontinence (FI), and acute colonic pseudo-obstruction (ACPO). We synthesized manometric evidence to clarify the RSB's clinical relevance.\n\n**Methods:** A systematic search of Ovid MEDLINE and Embase (March 2025) for studies assessing distal colonic motility in adults with surgical or functional colorectal conditions. Thirty-four studies met the inclusion criteria, including nine using high-resolution manometry. Data were qualitatively synthesized by condition.\n\n**Key Results:** Altered RSB activity was a consistent finding. In POI (7 studies; 2 HRM), the HRM studies showed immediate postoperative hyperactive distal cyclic activity (~2-4 cycles/min) correlating with delayed return of bowel function, contradicting older low-resolution reports of quiescence. In LARS (4 studies; 3 HRM), post-prandial cyclic patterns and propagating sequences were blunted after rectosigmoid resection. In FI (5 studies; 2 HRM), the brake was suppressed; sacral nerve stimulation increased distal retrograde contractions with parallel symptom gains. In ACPO (1 HRM case study), recordings showed disordered, non-propagating hyperactive activity consistent with distal functional obstruction rather than hypoactivity.\n\n**Conclusions:** Across POI, LARS, FI, and ACPO, the RSB appears to be a unifying physiological mechanism and a promising physiological biomarker with diagnostic and therapeutic potential. Priorities include standardizing manometric definitions, establishing normative reference metrics, and advancing non-invasive assessment (e.g., body-surface colonic mapping) to enable RSB-guided care and translation to practice.", "abstract_zh": "**背景：** 直肠乙状结肠制动器（RSB）通过远端结肠的逆行循环运动模式调节直肠充盈。中断与术后肠梗阻 (POI)、低位前切除综合征 (LARS)、大便失禁 (FI) 和急性结肠假性梗阻 (ACPO) 有关。我们综合了测压证据来阐明 RSB 的临床相关性。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Key results：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colonic motility, fecal incontinence, ileus, low anterior resection syndrome, sacral nerve stimulation", "link": "https://pubmed.ncbi.nlm.nih.gov/41857485/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 20 Mar 2026"}, {"id": "41832382", "title_en": "Novel adjunctive technologies for the prevention of colorectal anastomotic leakage: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A Picciariello", "abstract_en": "**Background:** Anastomotic leakage (AL) remains one of the most serious complications following colorectal surgery, particularly after low anterior resection. In recent years, several adjunctive technologies have been introduced to reinforce anastomotic integrity during the early phases of healing. This systematic review aimed to evaluate the safety, feasibility, and clinical effectiveness of novel mechanical and biological devices designed to prevent AL in colorectal surgery.\n\n**Methods:** A systematic literature search was conducted in PubMed, Embase, and Scopus. Human studies evaluating innovative adjunctive devices for AL prevention in patients undergoing low anterior resection were included. Studies focusing on transanal tubes, omental wrapping, or suture reinforcement were excluded. The primary outcome was the rate of anastomotic leakage.\n\n**Results:** Eighteen studies published between 2005 and 2021 met the inclusion criteria. The evaluated technologies were grouped into six categories: bioabsorbable staple-line reinforcements, nitinol-based compression rings, biodegradable intraluminal sheaths, vacuum-anchored diversion systems, fi brin-based sealants, and collagen patches (Seamguard™, C-Seal™, ColonRing™, Colovac™, Tissucol™/Greenplast™, TachoSil™, and Hemopatch™). Considerable heterogeneity in study design and methodological quality was observed. Although several devices demonstrated acceptable technical feasibility and safety, their eff ect on AL prevention was inconsistent. Only a limited number of studies included control groups or were designed as randomized controlled trials. Device-related complications, including migration, technical difficulties, and local tissue reactions, were reported in some series.\n\n**Conclusions:** Current adjunctive technologies have not consistently demonstrated a reduction in AL rates after colorectal surgery. While selected devices may provide potential benefit in high-risk patients, their clinical applicability remains limited by technical constraints and heterogeneous evidence. Further large, high-quality studies incorporating standardized definitions of AL and patient-specific risk stratification are warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 2005 年至 2021 年间发表的 18 项研究符合纳入标准。评估的技术分为六类：生物可吸收钉线增强材料、基于镍钛诺的压缩环、可生物降解的腔内护套、真空锚定分流系统、基于纤维蛋白的密封剂和胶原蛋白补片（Seamguard™、C-Seal™、ColonRing™、Colovac™、Tissucol™/Greenplast™、TachoSil™ 和 Hemopatch™）。观察到研究设计和方法学质量存在相当大的异质性。尽管一些设备表现出可接受的技术可行性和安全性，但它们对预防 AL 的效果并不一致。只有有限数量的研究包括对照组或被设计为随机对照试验。一些系列报道了与设备相关的并发症，包括迁移、技术困难和局部组织反应。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leakage, Anastomotic reinforcement devices, Colorectal surgery, urgical sealants and biomaterials", "link": "https://pubmed.ncbi.nlm.nih.gov/41832382/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sun, 15 Mar 2026"}, {"id": "41822113", "title_en": "Perioperative outcomes of robotic-assisted vs. conventional laparoscopy for colorectal cancer resection: a systematic review and meta-analysis", "title_zh": "机器人辅助与传统腹腔镜结直肠癌切除术的围手术期结果：系统评价和荟萃分析", "authors": "Ashraf Abdelmonem Elsayed", "abstract_en": "**Background:** Colorectal cancer is a major global health concern that requires successful surgical treatments. While robotic-assisted surgery (RAS) provides prospective improvements, laparoscopic surgery has proven to yield better results than open surgeries.\n\n**Methods:** From 2018 to December 2024, PubMed, Scopus, and Web of Science were used to perform a systematic review and meta-analysis of cohort studies and randomized controlled trials (RCTs). Studies comparing RAS and conventional laparoscopic surgery were included. The primary outcomes assessed were length of hospital stay, conversion to open surgery, postoperative complications, and operating time. Using Comprehensive Meta-Analysis software, statistical analysis was performed, including subgroup analyses by anatomical site (colon, rectum, colorectal). Sensitivity analyses and heterogeneity were conducted.\n\n**Results:** 21 studies involving over 70,000 patients were included. The meta-analysis demonstrated significantly longer operative times with RAS (MD = 0.161-1.049, <i>p</i> < 0.001). RAS was linked to a significantly lower chance of re-operative rates (RR = 0.549, <i>p</i> = 0.023) and a significantly lower risk of conversion to open surgery (RR = 0.412-0.592, <i>p</i> < 0.001). RAS decreased problems in the colorectal group (RR = 0.867, <i>p</i> = 0.023), but overall rectum group complication rates were comparable. Hospital stays were shorter after robotic-assisted surgery (MD = -0.284 to -0.755, <i>p</i> = 0.001).\n\n**Conclusion:** When compared to CLS, RAS has the advantage of lowering conversion and re-operation rates, albeit at the expense of higher operating time. CLS led to shorter hospital stays, but in some circumstances, the complication rates were on level with or lower than those of RAS. According to these results, RAS might be useful in some surgical situations and patient demographics.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/view/614084, PROSPERO CRD42024614084.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 2018年至2024年12月，使用PubMed、Scopus和Web of Science对队列研究和随机对照试验（RCT）进行系统评价和荟萃分析。比较 RAS 和传统腹腔镜手术的研究也被纳入其中。评估的主要结果是住院时间、转为开放手术、术后并发症和手术时间。使用综合荟萃分析软件进行统计分析，包括按解剖部位（结肠、直肠、结直肠）进行亚组分析。进行了敏感性分析和异质性分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, laparoscopic surgery, meta-analysis, postoperative outcomes, robotic surgery, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41822113/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 13 Mar 2026"}, {"id": "41821307", "title_en": "Preoperative low-energy diets for patients with a body mass index >30 kg/m2 undergoing non-bariatric surgery: pilot feasibility randomized clinical trial and a systematic review and meta-analysis of efficacy data", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Mohit Bhandari", "abstract_en": "**Background:** The current evidence for preoperative low-energy diets (LEDs) for patients with a BMI >30 kg/m2 before non-bariatric surgery rests on studies with a high risk of bias. An RCT is warranted to bridge this knowledge gap. Before a larger RCT, a pilot feasibility RCT was conducted to address potential hurdles for the larger trial.\n\n**Methods:** The pilot feasibility multicentre trial was conducted in Canada at four centres between 3 January 2024 and 23 October 2024. Patients were randomized (1 : 1 randomly permuted online blocked allocation) to receive a 3-week LED protocol or standard care. All patients aged >18 years with a BMI >30 kg/m2 undergoing elective non-bariatric intra-abdominal or orthopaedic surgery were evaluated for enrolment. Main exclusion criteria were LED contraindications and surgery scheduled without at least 3 weeks notice. The primary outcome was descriptive including the following feasibility outcomes: recruitment rate, randomization percentage, intervention adherence, and follow-up completion. Clinical outcomes included anthropometric data. The primary outcome analysis was descriptive. Additionally, a random-effects meta-analysis was performed using data from the present study and data from previously published RCTs to evaluate 30-day postoperative morbidity. The last follow-up date was 14 January 2025.\n\n**Results:** Out of 373 patients approached, 288 were eligible. Of these, 175 consented to be randomized (60.8% (95% c.i. 54.9-66.4%)). Seventy four of these patients were still awaiting a surgical date when the trial closed, leaving 91 patients randomized (LED n = 45, control n = 46) in the present pilot trial. Out of these 91 randomized patients, 81 (89%, 95% c.i. 80.7-94.6%) had complete follow-up. LED adherence was 81.7% (95% c.i. 74.1-89.3%). Analysis of covariance suggested patients in the LED group lost more weight during the 3-week intervention period (MD 4.5kg, 95% c.i. -5.6 to -3.5). The pooled meta-analysis of 5 RCTs suggested a 19% relative risk reduction in postoperative morbidity favouring the intervention (RR 0.81, 95% c.i. 0.52-1.26, P = 0.351, I2 = 0%).\n\n**Conclusion:** The feasibility targets of this pilot RCT were not met for recruitment rate, randomization percentage, and complete follow-up. The pooled meta-analysis suggests that LEDs before non-bariatric surgery can effectively induce weight loss with reduced postoperative morbidity, which needs to be validated in a larger non-inferiority RCT with additional centres to meet the feasibility targets.\n\n**Registration Number:** NCT03935451 (http://www.clinicaltrials.gov).", "abstract_zh": "**背景：** 目前对于非减肥手术前 BMI >30 kg/m2 的患者进行术前低能量饮食 (LED) 的证据依赖于具有高偏倚风险的研究。有必要进行随机对照试验来弥补这一知识差距。在进行更大规模的随机对照试验之前，进行了试点可行性随机对照试验，以解决更大规模试验的潜在障碍。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在 373 名患者中，有 288 名符合资格。其中，175 人同意接受随机分组（60.8%（95% c.i. 54.9-66.4%））。当试验结束时，其中 74 名患者仍在等待手术日期，剩下 91 名患者在本试点试验中被随机分配（LED n = 45，对照 n = 46）。在这 91 名随机患者中，81 名（89%、95% c.i. 80.7-94.6%）进行了完整随访。 LED 粘附率为 81.7% (95% c.i. 74.1-89.3%)。协方差分析表明，LED 组患者在 3 周干预期间体重减轻更多（MD 4.5kg，95% c.i. -5.6 至 -3.5）。 5 项随机对照试验的汇总荟萃分析表明，术后发病率的相对风险降低了 19%，有利于干预（RR 0.81，95% c.i. 0.52-1.26，P = 0.351，I2 = 0%）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration number：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41821307/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 13 Mar 2026"}, {"id": "41815276", "title_en": "Setup and target volume shape variation in rectal cancer radiotherapy: a systematic literature review", "title_zh": "直肠癌放射治疗的设置和靶区形状变化：系统文献综述", "authors": "Rianne de Jong", "abstract_en": "**Introduction:** This systematic literature review aimed to evaluate treatment uncertainties associated with modern rectal cancer radiotherapy, focusing on systematic and random errors in setup and target volume (TV) shape variation, with the aim of supporting clinics in optimizing treatment accuracy and consistency in daily practice.\n\n**Methods:** A systematic literature review was conducted to quantify geometrical uncertainties with respect to setup and TV shape variations in the treatment of rectal cancer. It included studies reporting uncertainties for setup, CTV (Clinical Target Volume) shape variations (rectum and mesorectum), GTVp (Gross Tumor Volume - Primary Tumor), GTVn (Gross Tumor Volume - Nodes), and/or elective pelvic lymph nodes; excluding non-English language publications.\n\n**Results:** 196 reports were assessed for full text screening and 32 publications were selected for final reporting. Most authors utilized on board imaging to calculate setup errors and TV shape variation, and all reported substantial uncertainties. Setup uncertainty was reported to be very different for prone (w/o belly board) vs supine position, in favour of supine position. TV shape variation showed large systematic and random errors, especially for GTVp and the upper anterior part of the mesorectum. A subset of publications analyzed the positional uncertainties of elective draining lymph nodes, which are typically not removed during surgery, showing their small positional variations in relation to bone structures.\n\n**Conclusion:** Setup and TV shape variation are significant and non-negligible geometric uncertainties. Setup errors can largely be minimized with daily (2D or 3D) IGRT, whereas TV shape variations-particularly in the mesorectum-needs to be assessed daily with 3D imaging and requires anisotropic margins.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们进行了系统的文献综述，以量化直肠癌治疗中设置和电视形状变化的几何不确定性。它包括报告设置、CTV（临床目标体积）形状变化（直肠和直肠系膜）、GTVp（总肿瘤体积 - 原发肿瘤）、GTVn（总肿瘤体积 - 淋巴结）和/或选择性盆腔淋巴结不确定性的研究；不包括非英语出版物。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Image guided radiotherapy, Rectal cancer, Review, Set up, Shape variation, Uncertainties", "link": "https://pubmed.ncbi.nlm.nih.gov/41815276/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41813999", "title_en": "Circular powered staplers versus manual staplers in left-sided colorectal anastomoses: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Amandeep Ghuman", "abstract_en": "**Background:** Anastomotic leaks in colorectal surgery increase mortality, local cancer recurrence, and hospital readmission rate. The Echelon Circular Powered Stapler (PCS) is marketed to reduce anastomotic leaks by minimizing operator errors through powered systems. We reviewed current evidence on the use of PCS in left-sided colorectal anastomoses to determine if there is a reduction in anastomotic leak rates versus manual circular staplers (MCS).\n\n**Methods:** This study followed PRISMA guidelines. MEDLINE, EMBASE, CINAHL, and OVID review databases were searched to January 2024. A broad search strategy for PCS versus MCS in colorectal surgery was used. Abstracts were reviewed for the primary outcome of anastomotic leaks, and data were extracted from full-text review. Statistical analysis was performed using RevMan 5.4 software.\n\n**Results:** 109 articles were screened, 9 studies with 3110 patients were included. No randomized control trials (RCTs) were found. In pooled and sensitivity analysis excluding studies that used historic comparators, there was no significant difference in the rates of anastomotic leak (pooled RR 0.56, 95% CI [0.27-1.18], p = 0.13; sensitivity analysis RR 0.75, 95% CI [0.32-1.77], p = 0.52). Similarly, there was no significant difference in morbidity between PCS and MCS on pooled analysis (RR 0.84, 95% [CI 0.65-1.08], p = 0.17). However, on pooled analysis, there was a significantly lower rate of post-operative bleeding with the use of PCS (RR 0.2, 95% CI [0.08-0.51], p < 0.001).\n\n**Conclusion:** The current systematic review and meta-analysis is unable to support the claim of lower leak rate with the use of PCS; however, there is preliminary evidence to indicate that powered staplers may decrease the rate of post-operative bleeding. Further evidence from RCTs investigating anastomotic leaks and bleeding rate with PCS and assessments of environmental impact should be conducted prior to the widespread use of powered staplers.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 目前的系统评价和荟萃分析无法支持使用 PCS 降低泄漏率的说法；然而，有初步证据表明动力吻合器可能会降低术后出血率。在广泛使用动力吻合器之前，应从调查 PCS 吻合口渗漏和出血率的随机对照试验以及环境影响评估中获得进一步的证据。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leak rate, Colorectal surgery, Echelon powered stapler, Manual circular stapler, Powered circular stapler", "link": "https://pubmed.ncbi.nlm.nih.gov/41813999/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41804965", "title_en": "Impact of circular stapler size on anastomotic complications after low colorectal anastomosis: a systematic review and meta-analysis", "title_zh": "圆形吻合器尺寸对低位结直肠吻合术后吻合并发症的影响：系统评价和荟萃分析", "authors": "Dimitrios Prassas", "abstract_en": "**Introduction:** Despite advancements in colorectal surgery, anastomotic complications such as leakage and stricture remain significant challenges. The influence of circular stapler size on these outcomes is controversial. This meta-analysis evaluates the impact of stapler diameter on anastomotic morbidity following low colorectal anastomosis.\n\n**Evidence Acquisition:** A systematic search of PubMed, Google Scholar, and the Cochrane Central Register was conducted in accordance with PRISMA guidelines. Comparative studies that reported outcomes based on circular stapler size were included. Primary endpoints were anastomotic leak, stricture, bleeding, and overall anastomotic morbidity. Secondary outcomes included overall morbidity, major complications, reoperation, readmission, and operative time. Odds ratios (ORs) and standardized mean differences (SMDs) with 95% confidence intervals (CIs) were calculated. The ROBINS-I and GRADE tools were used to assess the risk of bias and quality of evidence.\n\n**Evidence Synthesis:** Seven studies comprising 2214 patients (small stapler size (<30 mm): N.=859, large stapler size (≥30 mm): N.=1355) were included. Use of larger staplers was associated with a significantly lower incidence of anastomotic stricture (OR=2.31, 95% CI: 1.48-3.60, P=0.0002), with low heterogeneity (I<sup>2</sup>=5%). No significant differences were observed in anastomotic leak, bleeding, or overall anastomotic morbidity. Secondary outcomes, including overall and major morbidity, readmission, reoperation, and operative duration, also showed no significant differences between stapler sizes.\n\n**Conclusions:** Larger circular staplers are associated with a reduced risk of anastomotic stricture following low colorectal anastomosis, without increasing other postoperative complications. These findings support the consideration of larger stapler diameters when anatomically feasible. Further high-quality prospective studies are warranted to validate these results and guide surgical decision-making.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41804965/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 10 Mar 2026"}, {"id": "41800666", "title_en": "Transrectal vs transperineal prostate biopsy: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kieran J Breen", "abstract_en": "**Objective:** To compare transrectal ultrasonography (TRUS) and local anaesthetic transperineal (LATP) biopsy.\n\n**Methods:** A systematic review of randomised control trials and prospective studies meeting eligibility criteria was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines.\n\n**Results:** A total of 12 studies with 8497 patients were included. LATP biopsy was performed in 3961 patients and TRUS biopsy in 4536. Patient characteristics were comparable in both groups. Infection (risk ratio [RR] 0.68, 95% confidence interval [CI] 0.56-0.84, P < 0.001) and sepsis rates were significantly lower in the LATP group (RR 0.16, 95% CI 0.08-0.33, P < 0.001) and urinary retention rates were comparable (RR 0.87, 95% CI 0.61-1.25, P = 0.46). Overall cancer detection rates were significantly higher in LATP biopsy (RR 1.07, 95% CI 1.03-1.10, P < 0.001) as were Gleason Grade Group 2-5 or clinically significant cancer detection rates (RR 1.12, 95% CI 1.06-1.18, P < 0.001). Gleason GG 1 detection rates were comparable (RR 0.92, 95% CI 0.82-1.04, P = 0.20).\n\n**Conclusion:** The LATP biopsy is associated with lower rates of infection and sepsis compared to TRUS biopsy. The LATP biopsy also detects a higher overall incidence of prostate cancer and clinically significant prostate cancer (Gleason Grade Group 2-5).", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "biopsy, complications, prostate cancer, transperineal, transrectal", "link": "https://pubmed.ncbi.nlm.nih.gov/41800666/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 09 Mar 2026"}, {"id": "41796653", "title_en": "Feasibility and safety of laparoscopic versus open repair for rectobulbar fistula in anorectal malformations: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vikesh Agrawal", "abstract_en": "**Background:** Laparoscopic-assisted Anorectoplasty (LAARP) for male recto-bulbar fistula (RBF) remains debated, with early reports describing approach-specific complications. Prior meta-analyses pooled heterogeneous Anorectal malformation (ARM) subtypes, limiting conclusions for RBF. We conducted an RBF-specific systematic review and meta-analysis comparing LAARP with posterior sagittal anorectoplasty (PSARP).\n\n**Methods:** PubMed/MEDLINE, Embase, Scopus, and Google Scholar were searched (2000-November 2025) for comparative studies of LAARP versus PSARP in male children with RBF. Risk of bias was assessed using the ROBINS-I tool. Random-effects meta-analyses in Jeffreys's Amazing Statistics Program (JASP) used log effect sizes for dichotomous outcomes and mean differences for operative time. Sensitivity analyses excluded studies with zero events in both arms.\n\n**Results:** Six observational cohort studies (278 patients; LAARP 154, PSARP 124) were included. No intraoperative complications or conversions to open surgery were reported. Postoperative urethral diverticulum (UD) was not reported in five studies; one study reported 4 cases (15.38 %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in th d, and 39 articles were included from four continents, comprising 9807 patients with IDA. Overall, the most prevalent upper gastrointestinal finding was Helicobacter pylori gastritis (27.0%), and the most prevalent lower gastrointestinal finding was hemorrhoids (10.0%). The overall prevalence of upper gastrointestinal malignancy was 5.0%, and the prevalence of colorectal cancer was 8.0%. A total of 52.0% of upper gastrointestinal endoscopies and 66.0% of lower gastrointestinal endoscopies did not detect any abnormalities.\n\n**Conclusion:** The estimated prevalence of individual malignant and nonmalignant gastrointestinal disease will serve as a guide in the context of clinical decision making before endoscopy in patients with IDA. Further population-based studies are needed, particularly among relevant subgroups.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "cancer, endoscopy, gastrointestinal, iron deficiency anemia, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41784434/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 05 Mar 2026"}, {"id": "41760933", "title_en": "Prophylactic wound closure after ESD significantly reduces post-ESD bleeding: stratified and meta-regression analyses by tumor size and rectal proportion", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Chi-Wei Yang", "abstract_en": "**Background:** Colorectal endoscopic submucosal dissection (ESD) enables curative resection but carries a risk of delayed bleeding. The efficacy of prophylactic wound closure remains uncertain. We conducted a systematic review and meta-analysis to evaluate closure versus non-closure and identify high-risk subgroups.\n\n**Methods:** Following PRISMA 2020 guidelines, databases were searched to September 2025 for randomized and comparative cohort studies of closure after colorectal ESD. Primary outcome was delayed bleeding; secondary outcomes were perforation and post-ESD coagulation syndrome (PECS). Pooled odds ratios (ORs) were estimated using random-effects models, with subgroup and meta-regression analyses.\n\n**Results:** Nine studies (n = 2404) were included. Closure significantly reduced delayed bleeding (OR 0.324, 95% CI 0.172-0.611; I<sup>2</sup> = 0%). Benefit was greater in large lesions (≥ 3 cm: OR 0.293, 95% CI 0.134-0.641) and in studies with higher rectal proportion (≥ 25%: OR 0.306, 95% CI 0.142-0.661). Meta-regression confirmed associations with lesion size (p = 0.0006) and rectal proportion (p = 0.049). Closure did not significantly affect perforation (OR 1.142, 95% CI 0.565-2.309) or PECS (OR 0.723, 95% CI 0.179-2.916).\n\n**Conclusions:** Prophylactic closure after colorectal ESD reduces delayed bleeding, particularly in large tumors and rectal lesions, but does not alter perforation or PECS risk. Selective closure in high-risk cases may optimize outcomes.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try aga ggesting nonoperative management strategies may be possible. There remains a discrepancy between radiological assessment and pathological responses to NIT in CRC.\n\n**Methods:** We conducted a systematic review and meta-analysis of studies published between February 2015 and February 2025 to determine if radiological and pathological assessments following neoadjuvant immune checkpoint inhibitor therapy (NIT) were consistent in patients with non-metastatic dMMR/MSI-H CRC. Using PubMed, Embase, and Web of Science, the literature was retrieved, with inclusion criteria focusing on studies that reported both imaging data and pathological results. A random-effects model was used to calculate pooled odds ratios (ORs) and 95% confidence intervals (CIs). Subgroup analyses were conducted based on tumor location (colon versus rectum) and type of response (cCR versus pCR).\n\n**Results:** In 12 studies, 396 patients were included. A total rate of 59.6% discordance was found between radiological and pathological responses. Compared to rectal cancer patients (34.9%), colon cancer patients exhibited a significantly higher rate of discordance (64.2%). A total of 238 patients with confirmed pCR were incorrectly diagnosed as having residual disease on radiological assessment (OR = 61.41; 95% CI: 10.05-375.27;P < 0.00001). A high level of heterogeneity was observed across studies (I2 = 85%), but no publication bias was observed.\n\n**Conclusion:** In dMMR/MSI-H CRC, radiologic assessment alone cannot reliably assess the efficacy of NIT, particularly in colon cancer. It should be integrated with additional modalities-such as endoscopic evaluation and biomarker analysis-to ensure an accurate appraisal of treatment efficacy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：*
