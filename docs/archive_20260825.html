omized controlled trials, comprising 490 patients. Of those, 241 patients (49%) received postoperative packing; most patients were male (<i>n</i> = 158, 65.6%), with a median age of 40.5 years and a follow-up of 6 months. Meta-analysis showed that prolonged wound packing was associated with delayed wound healing and increased pain, but no difference in abscess recurrence or fistula formation.\n\n**Conclusion:** In this systematic review of current evidence highlighting the impact of packing after incision and drainage for anorectal abscesses, we found that the practice is not associated with significant differences in abscess recurrence and fistula formation, but is associated with increased postoperative pain and delayed wound healing.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39332832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 27 Sep 2024"}, {"id": "39298676", "title_en": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Phillip Fleshner", "abstract_en": "**Background:** Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\n**Results:** Overall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\n**Conclusions:** Optimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn’s disease, perianal fistula, seton", "link": "https://pubmed.ncbi.nlm.nih.gov/39298676/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 19 Sep 2024"}, {"id": "39186335", "title_en": "Efficacy and Safety of Endorectal Advancement Flap for the Treatment of Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wencong Xu", "abstract_en": "**Aim:** Complex anal fistula poses a significant challenge for anorectal surgeons due to its high risks of recurrence and incontinence. A sphincter-preserving procedure named endorectal advancement flap (ERAF) is gradually being applied to clinical practice. Therefore, this meta-analysis aims to evaluate the efficacy and safety of ERAF in managing anal fistula.\n\n**Methods:** We searched PubMed, Embase, Cochrane, and Web of Science databases for relevant manuscripts published from 29 August 2003 to 29 August 2023. Among these studies, outcomes included healing rate, recurrence rate, incontinence rate, and complications. Furthermore, the quality of the included studies was assessed using the Newcastle-Ottawa Scale (NOS) and the Cochrane risk-of-bias tool. The heterogeneity was determined using the chi-squared test and I2 statistic. A random effects model was applied if significant heterogeneity (p < 0.05 and I2 > 50%) was observed. Sensitivity analysis was conducted by excluding studies with a high risk of bias.\n\n**Results:** Thirty-eight studies were included in the present analysis, involving 1559 participants. The pooled healing rate and recurrence rate of ERAF were 65.5% (95% confidence intervals (CI): 57.6%-73.4%) and 19.6% (95% CI: 14.8%-24.4%), respectively. The pooled incontinence rate was 10.6% (95% CI: 6.0%-15.1%). According to the subgroup analysis, the healing rate, recurrence rate, and incontinence rate of ERAF for fistula associated with inflammatory bowel disease (IBD) were 53.9% (95% CI: 38.1%-69.7%), 32.6% (95% CI: 21.3%-43.8%), and 2.8% (95% CI: 0%-10.6%), respectively. For patients without IBD, the healing rate, recurrence rate, and incontinence rate of ERAF were 70.6% (95% CI: 63.9%-77.4%), 15.7% (95% CI: 9.9%-21.5%), and 16.5% (95% CI: 8.1%-24.9%), respectively. We observed that bleeding, local infection or abscess, flap dehiscence, and haematomas were the common complications, with incidences of 2.2% (95% CI: 0%-4.5%), 9.5% (95% CI: 4.7%-14.4%), 10.4% (95% CI: 0.0%-21.6%), and 12.4% (95% CI: 0%-27.6%), respectively.\n\n**Conclusions:** ERAF may be an optional treatment for anal fistula from the perspective of effectiveness and safety.\n\n**Systematic Review Registration:** PROSPERO: CRD42023451451.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https:// istulas in ulcerative colitis following restorative proctocolectomy: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jonathan P Segal", "abstract_en": "**Background/Aims:** One complication of restorative proctocolectomy with ileo-anal pouch anastomosis is fistula formation in the pouch. Fistulas can be associated with significant morbidity and pouch failure. We conducted a systematic review with meta- analysis to try and understand the prevalence of pouch fistulas in patients with ulcerative colitis following restorative proctocolectomy.\n\n**Methods:** The Embase, Embase Classic, and PubMed databases were searched between January 1979 and April 2022. Studies were included if there were cross-sectional, case-controlled, population-based or cohort studies reporting on prevalence of pouch fistulas in ulcerative colitis. Studies had to report the number of patients with pouch fistulas using either clinical, endoscopic, or radiological diagnosis in an adult population.\n\n**Results:** Thirty-three studies screened met the inclusion criteria. The pooled prevalence of developing at least 1 fistula was 0.05 (95% confidence interval [CI], 0.04-0.07). The pooled prevalence of pouch failure in patients with pouch fistula was found to be 0.24 (95% CI, 0.19-0.30). The pooled prevalence of developing a pouch fistula at 3 years, 5 years and more than 5 years was 0.04 (95% CI, 0.02-0.07), 0.05 (95% CI, 0.02-0.07), and 0.05 (95% CI, 0.02-0.10), respectively.\n\n**Conclusions:** This is the first systematic review and meta-analysis to report the prevalence of pouch fistula. It also provides a pooled prevalence of pouch failure in these patients. These results can help to shape future guidelines, power future studies, and help counsel patients.", "abstract_zh": "**Background/aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please ueries were built using the following terms: AI, machine learning, deep learning, benign anorectal disease, pelvic floor disorder, fecal incontinence, obstructive defecation, anal fistula, rectal prolapse, and anorectal manometry. Malignant anorectal articles and abstracts were excluded. Data from selected articles were analyzed.\n\n**Results:** 139 articles were found, 15 of which met our inclusion and exclusion criteria. The most common AI module was convolutional neural network. researchers were able to develop AI modules to optimize imaging studies for pelvis, fistula, and abscess anatomy, facilitated anorectal manometry interpretation, and improved high-definition anoscope use. None of the modules were validated in an external cohort.\n\n**Conclusion:** There is potential for AI to enhance the management of pelvic floor and benign anorectal diseases. Ongoing research necessitates the use of multidisciplinary approaches and collaboration between physicians and AI programmers to tackle pressing challenges.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 共找到 139 篇文章，其中 15 篇符合我们的纳入和排除标准。最常见的人工智能模块是卷积神经网络。研究人员能够开发人工智能模块来优化骨盆、瘘管和脓肿解剖的成像研究，促进肛门直肠测压解释，并改进高清肛门镜的使用。所有模块均未在外部队列中得到验证。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal disease, Artificial intelligence, Deep learning, Pelvic floor disorder", "link": "https://pubmed.ncbi.nlm.nih.gov/38910957/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 24 Jun 2024"}, {"id": "38871152", "title_en": "Perianal Fistulizing Crohn's Disease-Associated Anorectal and Fistula Cancers: Systematic Review and Expert Consensus", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jean-Frederic Colombel", "abstract_en": "**Background & Aims:** Perianal fistulizing Crohn's disease (PFCD)-associated anorectal and fistula cancers are rare but often devastating diagnoses. However, given the low incidence and consequent lack of data and clinical trials in the field, there is little to no guidance on screening and management of these cancers. To inform clinical practice, we developed consensus guidelines on PFCD-associated anorectal and fistula cancers by multidisciplinary experts from the international TOpClass consortium.\n\n**Methods:** We conducted a systematic review by standard methodology, using the Newcastle-Ottawa Scale quality assessment tool. We subsequently developed consensus statements using a Delphi consensus approach.\n\n**Results:** Of 561 articles identified, 110 were eligible, and 76 articles were included. The overall quality of evidence was low. The TOpClass consortium reached consensus on 6 structured statements addressing screening, risk assessment, and management of PFCD-associated anorectal and fistula cancers. Patients with long-standing (>10 years) PFCD should be considered at small but increased risk of developing perianal cancer, including squamous cell carcinoma of the anus and anorectal carcinoma. Risk factors for squamous cell carcinoma of the anus, notably human papilloma virus, should be considered. New, refractory, or progressive perianal symptoms should prompt evaluation for fistula cancer. There was no consensus on timing or frequency of screening in patients with asymptomatic perianal fistula. Multiple modalities may be required for diagnosis, including an examination under anesthesia with biopsy. Multidisciplinary team efforts were deemed central to the management of fistula cancers.\n\n**Conclusions:** Inflammatory bowel disease clinicians should be aware of the risk of PFCD-associated anorectal and fistula cancers in all patients with PFCD. The TOpClass consortium consensus statements outlined herein offer guidance in managing this challenging scenario.", "abstract_zh": "**Background & aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal Cancer, Inflammatory Bowel Disease, Perianal Fistulizing Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/38871152/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 13 Jun 2024"}, {"id": "38491943", "title_en": "Does Combined Medical and Surgical Treatment Improve Perianal Fistula Outcomes in Patients With Crohn's Disease? A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** The optimal treatment of perianal fistulizing Crohn's disease [PFCD] is unknown. We performed a systematic review with meta-analysis to compare combined surgical intervention and anti-tumour necrosis factor [anti-TNF] therapy [combined therapy] vs either therapy alone.\n\n**Methods:** MEDLINE, EMBASE, and Cochrane databases were searched systematically up to end December 2023. Surgical intervention was defined as an exam under anaesthesia ± setons. We calculated weighted risk ratios [RRs] with 95% confidence intervals [CIs] for our co-primary outcomes: fistula response and healing, defined clinically as a reduction in fistula drainage or number of draining fistulas and fistula closure respectively.\n\n**Results:** Thirteen studies were analysed: 515 patients treated with combined therapy, 330 patients with surgical intervention, and 406 patients with anti-TNF therapy with follow-up between 10 weeks and 3 years. Fistula response [RR 1.10; 95% CI 0.93-1.30, p = 0.28] and healing [RR 1.06; 95% CI 0.86-1.31, p = 0.58] was not significantly different when comparing combined therapy with anti-TNF therapy alone. In contrast, combined therapy was associated with significantly higher rates of fistula response [RR 1.25; 95% CI 1.10-1.41, p < 0.001] and healing [RR 1.17; 95% CI 1.00-1.36, p = 0.05] compared with surgical intervention alone. Our results remained stable when limiting to studies that assessed outcomes within 1 year and studies where <10% of patients underwent fistula closure procedures.\n\n**Conclusion:** Combined surgery and anti-TNF therapy was not associated with improved PFCD outcomes compared with anti-TNF therapy alone. Due to an inability to control for confounding and small study sizes, future, controlled trials are warranted to confirm these findings.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Perianal fistula, anti-TNF, combined medical and surgical", "link": "https://pubmed.ncbi.nlm.nih.gov/38491943/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 16 Mar 2024"}, {"id": "38475976", "title_en": "Martius flaps for low rectovaginal fistulae: a systematic review and proportional meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Shaheel Mohammad Sahebally", "abstract_en": "**Background:** Rectovaginal fistulae (RVF) are notoriously challenging to treat. Martius flap (MF) is a technique employed to manage RVF, among various others, with none being universally successful. We aimed to assess the outcomes of RVF managed with MF interposition.\n\n**Methods:** A PRISMA-compliant meta-analysis searching for all studies specifically reporting on the outcomes of MF for RVF was performed. The primary objective was the mean success rate, whilst secondary objectives included complications and recurrence. The MedCalc software (version 20.118) was used to conduct proportional meta-analyses of data. Weighted mean values with 95% CI are presented and stratified according to aetiology where possible.\n\n**Results:** Twelve non-randomized (11 retrospective, 1 prospective) studies, assessing 137 MF were included. The mean age of the study population was 42.4 (±15.7), years. There were 44 primary and 93 recurrent RVF. The weighted mean success rate for MF when performed for primary RVF was 91.4% (95% CI: 79.45-98.46; I<sup>2</sup> = 32.1%; P = 0.183) and that for recurrent RVF was 77.5% (95% CI: 62.24-89.67; I<sup>2</sup> = 58.1%; P = 0.008). The weighted mean complication rate was 29% (95% CI: 8.98-54.68; I<sup>2</sup> = 85.4%; P < 0.0001) and the overall recurrence rate was 12.0% (95% CI: 5.03-21.93; I<sup>2</sup> = 52.3%; P = 0.021). When purely radiotherapy-induced RVF were evaluated, the mean overall success rate was 94.6% (95% CI: 83.33-99.75; I<sup>2</sup> = 0%; P = 0.350).\n\n**Conclusions:** MF interposition appears to be more effective for primary than recurrent RVF. However, the poor quality of the data limits definitive conclusions being drawn and demands further assessment with randomized studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 纳入了 12 项非随机研究（11 项回顾性研究，1 项前瞻性研究），评估了 137 例 MF。研究人群的平均年龄为 42.4 (±15.7) 岁。其中 44 例为原发性 RVF，93 例为复发性 RVF。原发性 RVF 的 MF 加权平均成功率为 91.4%（95% CI：79.45-98.46；I<sup>2</sup> = 32.1%；P = 0.183），复发性 RVF 的加权平均成功率为 77.5%（95% CI：62.24-89.67；P = 0.183）。 I<sup>2</sup> = 58.1%；P = 0.008)。加权平均并发症率为29%（95% CI：8.98-54.68；I<sup>2</sup> = 85.4%；P < 0.0001），总复发率为12.0%（95% CI：5.03-21.93；I<sup>2</sup> = 85.4%；P < 0.0001）。 I<sup>2</sup> = 52.3%；P = 0.021）。当评估单纯放疗引起的RVF时，平均总体成功率为94.6%（95% CI：83.33-99.75；I<sup>2</sup> = 0%；P = 0.350）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "complication, fistula, primary, rectovaginal, recurrence, success", "link": "https://pubmed.ncbi.nlm.nih.gov/38475976/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 13 Mar 2024"}, {"id": "38315695", "title_en": "Obstetric fistula repair failure and its associated factors among women who underwent repair in sub-Saharan Africa. A systematic review and meta-analysis", "title_zh": "撒哈拉以南非洲接受修复的妇女产科瘘修复失败及其相关因素。系统回顾和荟萃分析", "authors": "Mesfin Abebe", "abstract_en": "**Background:** Obstetric fistula repair failure can result in increased depression, social isolation, financial burden for the woman, and fistula care programs. However, there is limited, comprehensive evidence on obstetric fistula repair failure in Sub-Saharan African countries. This systematic review and meta-analysis aimed to determine the pooled prevalence of obstetric fistula repair failure and associated factors among women who underwent surgical repair in Sub-Saharan African countries.\n\n**Methods:** To identify potential articles, a systematic search was done utilizing online databases (PubMed, Hinari, and Google Scholar). The Preferred Reporting Items for Systematic Review and Meta-Analysis Statement (PRISMA) guideline was used to report the review's findings. I2 test statistics were employed to examine study heterogeneity. A random-effects model was used to assess the pooled prevalence of obstetric fistula repair failure, and the association was determined using the log odds ratio. Publication bias was investigated using the funnel plot and Egger's statistical test at the 5% level of significance. Meta-regression and subgroup analysis were done to identify potential sources of heterogeneity. The data were analyzed using STATA version 17 statistical software.\n\n**Results:** A total of 24 articles with 9866 study participants from 13 Sub-Saharan African countries were included in this meta-analysis. The pooled prevalence of obstetric fistula repair failure in sub-Saharan Africa was 24.92% [95% CI: 20.34-29.50%]. The sub-group analysis by country revealed that the highest prevalence was in Angola (58%, 95% CI: 53.20-62.80%) and the lowest in Rwanda (13.9, 95% CI: 9.79-18.01%). Total urethral damage [OR  =  3.50, 95% CI: 2.09, 4.91], large fistula [OR = 3.09, 95% CI: (2.00, 4.10)], duration of labor [OR = 0.45, 95% CI: 0.27, 0.76], and previous fistula repair [OR = 2.70, 95% CI: 1.94, 3.45] were factors associated with obstetric fistula repair failure.\n\n**Conclusion:** Women who received surgical treatment for obstetric fistulas in Sub-Saharan African countries experienced more repair failures than the WHO standards. Obstetric fistula repair failure was affected by urethral damage, fistula size, duration of labor, types of fistula, and history of previous repairs. Therefore, we suggest policy measures specific to each country to provide special attention to the prevention of all risk factors, including poor nutrition, multiparty, obstructed labor, and maternal age, which can result in conditions like large fistulas, urethral damage, and repeat repair, in order to reduce obstetric fistula repair failure.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38315695/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 05 Feb 2024"}, {"id": "38296841", "title_en": "The use of core descriptors from the ENiGMA code study in recent literature: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Sharon L Stein", "abstract_en": "**Aim:** The heterogeneity in data quality presented in studies regarding Crohn's anal fistula (CAF) limit extrapolation into clinical practice. The ENiGMA collaborators established a core descriptor set to standardize reporting of CAF. The aim of this work was to quantify the use of these descriptors in recent literature.\n\n**Method:** We completed a systematic review of PubMed and the Cochrane Library, extracting publications from the past 10 years specific to the clinical interventions and outcomes of CAF, and reported in line with PRISMA guidance. Each article was assessed for inclusion of ENiGMA descriptors. The median number of descriptors per publication was evaluated along with the overall frequency of each individual descriptor. Use of ENiGMA descriptors was compared between medical and procedural publications.\n\n**Results:** Ninety publications were included. The median number of descriptors was 15 of 37; 16 descriptors were used in over half of the publications while 17 were used in fewer than a third. Descriptors were more frequently used in procedural (n = 16) than medical publications (n = 14) (p = 0.031). In procedural publications, eight descriptors were more frequently used including Faecal incontinence, Number of previous fistula interventions, Presence and severity of anorectal stenosis and Current proctitis. Medical publications were more likely to include Previous response to biological therapy and Duration and type of current course of biological therapy.\n\n**Conclusion:** With many descriptors being used infrequently and variations between medical and procedural literature, the colorectal community should assess the need for all 37 descriptors.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** 我们完成了对 PubMed 和 Cochrane 图书馆的系统回顾，提取了过去 10 年针对 CAF 临床干预和结果的出版物，并根据 PRISMA 指南进行报告。每篇文章都经过评估以包含 ENiGMA 描述符。每个出版物的描述符中位数以及每个单独描述符的总体频率进行了评估。对医学出版物和程序出版物中 ENiGMA 描述符的使用进行了比较。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "core descriptor set, crohn’s perianal fistulae, multidisciplinary care, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38296841/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 31 Jan 2024"}, {"id": "38197847", "title_en": "Efficacy and safety of video-assisted anal fistula treatment in anorectal fistula: a meta-analysis", "title_zh": "视频辅助肛瘘治疗肛肠瘘的疗效和安全性：荟萃分析", "authors": "Xuebing Wang", "abstract_en": "**Introduction:** By searching relevant literature, the recurrence rate, complication rate after video-assisted anal fistula treatment (VAAFT), and efficacy and safety of the treatment were analyzed.\n\n**Evidence Acquisition:** Articles that reported the outcomes of VAAFT up to December 2020 were searched in PubMed (Medline) and Cochrane Library, in accordance with the preferred reporting items for systematic review and meta-analysis (PRISMA) screening guidelines. Two researchers independently completed the whole process from screening and inclusion to quality evaluation and bias risk assessment, and the data was included in the RevMan 5.3 software for analysis. The main outcomes were demographic data of patients, detection rate, classification of internal opening of anorectal fistula, postoperative recurrence rate, and incidence of complications.\n\n**Evidence Synthesis:** A total of 10 articles were included (779 patients). The average age of the patients was 44 years old, average operation time was 60 min, and the average follow-up time was 22 months. The ratio of male to female was 2.4:1, the ratio of high anorectal fistula to low anorectal fistula was 6.6:1, the detection rate of internal openings was 98%, the weighted recurrence rate was 24%, and the weighted complication rate was 1%.\n\n**Conclusions:** VAAFT is effective and safe in the treatment of anorectal fistulas.", "abstract_zh": "**介绍：** 通过检索相关文献，分析视频辅助肛瘘治疗（VAAFT）后的复发率、并发症发生率以及治疗的有效性和安全性。\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38197847/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 10 Jan 2024"}, {"id": "38126903", "title_en": "Scoring Indices for Perianal Fistulising Crohn's Disease: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** In this systematic review we summarise existing scoring indices for assessing disease activity and quality of life in perianal fistulising Crohn's disease [PFCD], and highlight gaps in the literature.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL were searched from August 24, 2022, to identify studies evaluating clinical, radiological, or patient-reported outcome measures [PROMS] in PFCD. The primary objective was to identify all available scoring indices and describe the operating properties of these indices.\n\n**Results:** A total of 53 studies reported on the use of one clinical index [Perianal Disease Activity Index: PDAI], three PROMs, and 10 radiological indices; 25 studies evaluated the operating properties of these indices. The PDAI demonstrated content validity, construct validity, and responsiveness but criterion validity or reliability were not assessed. The Van Assche Index [VAI], modified VAI, and the Magnetic Resonance Index for Assessing Fistulas in Patients with CD [MAGNIFI-CD] were the most studied radiological indices. These indices demonstrated responsiveness and reliability. The VAI and MAGNIFI-CD demonstrated construct validity; criterion and content validity and feasibility have not been assessed. Among the three PROMs, the Crohn's Anal Fistula Quality of Life index demonstrated content and construct validity, inter-observer reliability, and responsiveness; criterion validity, intra-observer reliability, and feasibility have not been assessed for this index.\n\n**Conclusions:** There are no fully valid, reliable, and responsive clinical disease or radiological indices for PFCD. Although the radiological indices demonstrated responsiveness and reliability, well-defined cut-offs for response and remission are lacking. Future research should focus on establishing standardised definitions and thresholds for outcomes.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Outcomes, disease activity indices, operating properties, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38126903/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 21 Dec 2023"}, {"id": "38091125", "title_en": "Cutting seton for the treatment of cryptoglandular fistula-in-ano: a systematic review and meta-analysis", "title_zh": "切割挂线治疗肛门隐窝瘘：系统评价和荟萃分析", "authors": "C Eskicioglu", "abstract_en": "**Background:** The use of cutting seton (CS) for the management of cryptoglandular fistula-in-ano has remained controversial because of reports of fecal incontinence, postoperative pain, and extended healing time. The aim of this review was to provide the first synthesis of studies investigating the use of CS for the treatment of cryptoglandular fistula-in-ano.\n\n**Methods:** MEDLINE, Embase, and CENTRAL were searched up to October 2022. Randomized controlled trials and observational studies comparing CS with alternative interventions were included, along with single-arm studies evaluating CS alone. The primary outcome was fistula-in-ano recurrence, and secondary outcomes included incontinence, healing time, proportion with complete healing, and postoperative pain. Inverse variance random-effects meta-analyses were used to pool effect estimates.\n\n**Results:** After screening 661 citations, 29 studies were included. Overall, 1513 patients undergoing CS (18.8% female, mean age: 43.1 years) were included. Patients with CS had a 6% (95% CI: 3-12%) risk of recurrence and a 16% (95% CI: 5-38%) risk of incontinence at 6 months. CS patients had an average healing time of 14.6 weeks (95% CI: 10-19 weeks) with 73% (95% CI: 48-89%) of patients achieving complete healing at 6 months postoperatively. There was no difference in recurrence between CS and fistulotomy, advancement flap, two-stage seton fistulotomy, or draining seton.\n\n**Conclusions:** Overall, this analysis shows that CS has comparable recurrence and incontinence rates to other modalities. However, this may be at the expense of more postoperative pain and extended healing time. Further comparative studies between CS and other modalities are warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 总体而言，该分析表明，CS 的复发率和失禁率与其他治疗方式相当。然而，这可能会以更多的术后疼痛和更长的愈合时间为代价。需要对 CS 和其他方式进行进一步的比较研究。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal fistula, Colorectal surgery, Cryptoglandular fistula, Cutting seton, Fistula-in-ano", "link": "https://pubmed.ncbi.nlm.nih.gov/38091125/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 13 Dec 2023"}, {"id": "38018554", "title_en": "FISTULIZING PERIANAL CROHN'S DISEASE: IS THE PATIENT'S SEX A BURDEN? A SYSTEMATIC REVIEW", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Odery Ramos Júnior", "abstract_en": "**Background:** Fistulizing perianal Crohn's disease poses a treatment challenge, and researchers postulate that this phenotype in young male patients could have a worst outcome.\n\n**Objective:** Thus, the aim of this study was to assess whether sex influences the response to treatment for these patients.\n\n**Methods:** This systematic review (PROSPERO CRD42022319629) was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses protocol. We selected articles published in English, Spanish, Portuguese, and Italian between 2010 and 2020 in the PubMed and Science Direct databases. According to the PICO acronym, prospective studies in patients older than 18 years with the objective of treating fistulizing perianal Crohn's disease were selected. Studies in pediatric populations, retrospective, without treatment objectives, and that included only rectovaginal fistulas or a single sex were excluded. Study quality was assessed using the Cochrane risk of bias tool and Newcastle-Ottawa scale.\n\n**Results:** Of the 1887 articles found, 33 were included. Most studies used anti-TNF drugs as treatment (n=11). Ten studies had subgroup analyses; of them, the two studies reporting sex differences used infliximab and adalimumab as treatment and showed that women had a longer fistula closure time than men.\n\n**Conclusion:** This systematic review showed that few data corroborate the difference between sexes in the treatment of fistulizing perianal Crohn's disease, possibly having a greater relationship with the phenotype. However, considering the lack of results, further studies with this objective and with standardization of fistulas and response assessment methods are needed.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 因此，本研究的目的是评估性别是否影响这些患者对治疗的反应。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 这项系统评价表明，很少有数据证实肛周克罗恩病治疗中的性别差异，可能与表型有更大的关系。然而，考虑到缺乏结果，需要为此目标以及瘘管标准化和反应评估方法进行进一步的研究。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38018554/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 29 Nov 2023"}, {"id": "37933849", "title_en": "Pharmacological Therapies for the Management of Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background:** Fistulas are a debilitating complication of Crohn's disease [CD]. We conducted a systematic review to assess the efficacy of medical therapies for fistulizing CD.\n\n**Methods:** MEDLINE, Embase, and CENTRAL were searched on May 26, 2022, for randomized controlled trials [RCTs] of pharmacological therapy in adults with fistulizing CD. The primary outcome was induction and maintenance of fistula response. Pooled risk ratios [RRs] and 95% confidence intervals [CIs] were calculated. GRADE was used to assess the certainty of evidence.\n\n**Results:** Thirty-eight RCTs were included. Nineteen trials [50%] exclusively involved perianal fistula. The remaining studies included some participants with non-perianal fistula. Pooled RRs for anti-tumour necrosis factor [TNF] agents were not statistically significant for induction [RR 1.36, 95% CI 0.97-1.91] or maintenance of fistula response [RR 1.48, 95% CI 0.97-2.27]. However, in a sensitivity analysis of studies with fistula response as the primary outcome, anti-TNFs were superior to placebo for induction [RR 1.94, 95% CI 1.10-3.41] and maintenance [RR 1.88, 95% CI 1.23-2.88] of fistula response. Oral small molecules [RR 2.56, 95% CI 1.18-5.53] and mesenchymal stem cell [MSC] therapy [RR 1.26, 95% CI 1.01-1.57] were effective for induction of fistula response. Ustekinumab was associated with maintenance of fistula response [RR 1.80, 95% CI 1.04-3.11]. Vedolizumab was not superior to placebo. The certainty of evidence ranged from very low to moderate.\n\n**Conclusion:** Very low- to moderate-certainty evidence suggests that anti-TNF therapy, oral small molecules, ustekinumab, and MSCs are effective for perianal fistulizing CD. Dedicated fistula studies evaluating biologics and small molecules are needed.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Biologic, fistula, stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/37933849/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 07 Nov 2023"}, {"id": "37882975", "title_en": "Comparison of clinical outcomes of anal fistula plug and endoanal advancement flap repair treating the complex anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jihua Gao", "abstract_en": "Anal fistula (AF) is a common disease with high prevalence and surgical operations are effective treatments in clinical work. There exist many well-known surgical techniques treating complex anal fistula (CAF), however, none is ideal. To compare the superiority of Anal fistula plug (AFP) and Endoanal advancement flap repair (EAFR) for complex anal fistula. We searched worldwide databases including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed from their inception to March 2023. Studies comparing the outcomes of AFP and EAFR were included according to the PICO principles. The indicators of the healing rate, recurrence rate, wound infection rate, and complication rate, et al. were extracted and compared between different surgical methods. 5 RCTS and 7 non-RCTs were included in the meta-analysis with a total of 847 patients (341 patients conducted with AFP and 506 patients with EAFR). By combining the total effect of the 12 articles, we found that there was a statistical difference reporting the healing rate of AFP 48.3% and EAFR 64.4% treating the CAF (OR 0.68, 95% CI 0.30,1.55, P = 0.03), and EAFR has a better healing rate. However, there was no significant difference in terms of the recurrence rate (OR 1.68, 95% CI 0.80,3.54, P = 0.17), the wound infection rate (OR 1.82, 95% CI 0.95,3.52, P = 0.07), and the complication rate (OR 1.06, 95% CI 0.70,1.61, P = 0.77) either in the 12 articles or in the subgroup. The meta-analysis indicated that the EAFR was superior to AFP in terms of the healing rate treating the CAF, however, there were no significant differences between the two groups when it came to the recurrence rate, the wound infection rate, and the complication rate. EAFR might be one initial treatment for the complex cryptoglandular anal fistulas compared with AFP.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "肛瘘塞、复杂肛瘘、肛门内推进皮瓣修复、Meta 分析", "keywords_en": "Anal fistula plug, Complex anal fistula, Endoanal advancement flap repair, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37882975/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 26 Oct 2023"}, {"id": "37737881", "title_en": "Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Maosheng Tian", "abstract_en": "**Background:** Considering the difficulty of treating complex anal fistula (CAF), various surgical techniques exist in clinical work. However, none are ideal. Evidence on the efficacy and safety of different surgical treatments is scarce. The authors aimed to compare the outcomes of the 13 surgical techniques and tried to find the best surgical method for treating CAF.\n\n**Materials And Methods:** The authors searched worldwide databases, including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed, from inception to March 2023. All randomized controlled trials comparing the outcomes of 13 surgical techniques were included according to the PICO principles. The indicators of the cure rate, the recurrence rate, the complication rate, the operating time, the postoperative pain on day 1 (VAS), and the postoperative incontinence in month 1 (Wexner) were extracted and analyzed using STATA software 15.1, Review Manager 5.4, and GeMTC14.3.\n\n**Results:** Twenty-eight randomized controlled trials with a total of 2274 patients were included in the network meta-analysis. There was no statistically significant difference in the comparison among any surgical interventions in terms of the cure rate ( P >0.05 Table 2) and recurrence rate ( P >0.05 Table 3). However, in terms of complication rate, fistulectomy was lower than FPS (Median: 0.14; 95% CI: 0.02-0.70) or fistulotomy (Median: 0.09; 95% CI: 0.01-0.55), and fistulotomy was lower than EAFR (Median: 0.24; 95% CI: 0.05-0.84), LIFT (Median: 0.17; 95% CI: 0.02-0.66) or LIFT-EAFR (Median: 0.11; 95% CI: 0.01-0.69) ( P >0.05 Table 4). The surface estimated the advantages and disadvantages under the cumulative ranking (SUCRA). The ranking results indicated that fistulectomy might have the lowest complication rate (SUCRA=7.9%). Because the network results of the operating time, the postoperative pain, and the postoperative incontinence contained no closed loops, the results of their probability ranking could only be referenced, demonstrating that fistulectomy might have the shortest operating time (SUCRA=23.4%), video-assisted modified ligation of the intersphincteric fistula tract (VAMLIFT) might have the lowest postoperative pain on day 1 (VAS) (SUCRA=0.4%) and LIFT might have the lowest postoperative incontinence in month 1(Wexner) (SUCRA=16.2%).\n\n**Conclusion:** Fistulectomy might have the lowest complication rate, which might be the relatively superior surgical technique for treating CAF.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37737881/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 22 Sep 2023"}, {"id": "37707561", "title_en": "Comparing the efficacy and safety of different thread-drawing surgery method for treating high complex anal fistula: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Guofeng Li", "abstract_en": "**Purpose:** To evaluate the effect of different surgical methods in the treatment of high complex anal fistula by systematic review and network meta-analysis.\n\n**Methods:** Randomized controlled trials that met the inclusion criteria in PubMed, Cochrane Library, Embase, Web of Science, CBM, CNKI, WANFANG DATA, VIP were searched from the date of database construction to May 23, 2023.\n\n**Results:** Among the 48 randomized controlled trials (RCTs), 4205 patients were included in the network meta-analysis. Incision thread-drawing counter-drainage procedure (ITCP) in improving the effective rate, the cure rate; reduce the recurrence rate, reduce the anal canal damage has a huge advantage. Directional line-hanging method (DLM) is optimal for safety and postoperative pain relief. Directional line-hanging method (ITSS) protect the optimal anal function after surgery. Sphincter preserving thread-hanging method (SPTM) has a significant advantage in accelerating wound healing time. Main tube incision combined with thread-hanging branch tube drainage (MIBD) is second only to incision thread-drawing counter-drainage procedure (ITCP) in improving effective rate, cure rate, reducing recurrence rate and reduce complication rate.\n\n**Conclusion:** In general, different thread-drawing surgery methods have good clinical effect for the treatment of high complex anal fistula. In general, these methods provide evidence-based medical evidence for early treatment in terms of improving clinical efficacy, relieving anal pain and reducing wound healing time. However, there are differences in the number of included literature studies, and further verification by large-sample, high-quality, multicenter RCTS is still needed in the next stage.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在 48 项随机对照试验 (RCT) 中，网络荟萃分析纳入了 4205 名患者。切开拉丝反引流术（ITCP）在提高有效率、治愈率方面；对降低复发率、减少肛管损伤有着巨大的优势。定向挂线法 (DLM) 是安全性和术后疼痛缓解的最佳选择。定向挂线法（ITSS）可保护术后最佳肛门功能。保肛挂线法（SPTM）在加快伤口愈合时间方面具有显着优势。主管切开联合挂线支管引流术（MIBD）在提高有效率、治愈率、降低复发率、降低并发症率方面仅次于切开挂线反引流术（ITCP）。\n\n**结论：** 总的来说，不同的拔线手术方法对于治疗高位复杂性肛瘘都有良好的临床效果。总的来说，这些方法在提高临床疗效、缓解肛门疼痛、缩短伤口愈合时间等方面为早期治疗提供了循证医学证据。但纳入文献研究数量存在差异，下一阶段仍需大样本、高质量、多中心RCTS进一步验证。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "High complex anal fistula, Network meta-analysis, Systematic review, Thread-drawing surgery method", "link": "https://pubmed.ncbi.nlm.nih.gov/37707561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 14 Sep 2023"}, {"id": "37704476", "title_en": "Risk factors for anastomotic stenosis after radical resection of rectal cancer: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kun Qian", "abstract_en": "Radical resection of rectal cancer is a safe and effective treatment, but there remain several complications related to anastomosis. We aimed to assess the risk factors and incidence of rectal anastomotic stenosis (AS) after rectal cancer resection. We conducted a systematic review and meta-analysis after searching PubMed, Embase, Web of Science, and Medline databases from inception until May 2023. Data are reported as the combined odds ratio (OR) for categorical variables and the weighted mean difference (WMD) for continuous variables. Six hundred and fifty-nine studies were retrieved, nine (3031 patients) of which were included in the meta-analysis. Young age (WMD = -3.09, P = 0.0002), male sex (OR = 1.53, P = 0.0002), smoking (OR = 1.54, P = 0.009), radiotherapy (OR = 2.34, P = 0.0002), protective stoma (OR = 2.88, P = 0.007), intersphincteric resection surgery (OR = 6.28, P = 0.05), anastomotic fistula (OR = 3.72, P = 0.003), and anastomotic distance (WMD = -3.11, P = 0.0006) were identified as factors that increased the risk of AS, while staple (OR = 0.39, P < 0.001) was a protective factor. The incidence of AS after rectal cancer resection was approximately 17% (95% CI: 13%-21%). We identified eight risk factors and one protective factor associated with AS after rectal cancer resection. These factors may be combined in future studies to develop a more comprehensive and accurate prediction model related to AS after rectal cancer resection.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic stenosis, Meta-analysis, Radical resection of rectal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/37704476/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 13 Sep 2023"}, {"id": "37608385", "title_en": "Comparative efficacy of oral drugs for chronic radiation proctitis - a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jinjun Liang", "abstract_en": "**Background:** Chronic radiation proctitis (CRP) is a long-term complication of pelvic radiotherapy that manifests as rectal bleeding, diarrhoea, fistula formation and obstruction. Treatments such as endoscopic argon plasma coagulation, hyperbaric oxygen therapy and rectal topical formalin have imposed a significant medical burden on CRP patients. In contrast, oral therapies offer a more accessible and acceptable option for managing CRP. Here, we conducted a systematic review of the efficacy of oral treatments for CRP to assess their potential as an effective and convenient treatment option for this condition.\n\n**Methods:** We searched the Cochrane Central Register of Controlled Trials, PubMed, Web of Science, China National Knowledge Infrastructure and Chinese VIP in February 2021. We included post-radiotherapy participants with CRP that compared oral medicine alone or in combination with other treatments versus control treatments. The primary outcomes were bleeding, diarrhoea and symptom score. Heterogeneity between studies was checked using Cochrane Q test statistics and I<sup>2</sup> test statistics. The Cochrane risk-of-bias tool was used to assess the quality of the included studies.\n\n**Results:** We included 10 randomised controlled trials (RCTs) and 1 retrospective study with 898 participants. Three placebo-controlled trials evaluated the effects of oral sucralfate on CRP, with meta-analysis showing no significant different with placebo arm. Four trials on TCM demonstrated significant improvement of symptoms, especially for the 3 trials on oral TCM drinks. Retinyl palmitate and high-fibre diet were found to reduce rectal bleeding. The combination of oral pentoxifylline and tocopherol did not significantly change the process of CRP.\n\n**Conclusions:** Our study implies that oral TCM drinks, retinyl palmitate and a high-fiber diet showed significant improvement in CRP symptoms, but not with the combination of oral pentoxifylline and tocopherol. Further multicentre, larger-scale RCTs are needed to confirm the efficacy and safety of these treatments and optimize treatment strategies, ultimately improving the quality of life for patients with CRP.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们于 2021 年 2 月检索了 Cochrane 对照试验中央注册库、PubMed、Web of Science、中国国家知识基础设施和中国 VIP。我们纳入了接受 CRP 的放射治疗后参与者，将单独口服药物或联合其他治疗与对照治疗进行比较。主要结局是出血、腹泻和症状评分。使用 Cochrane Q 检验统计数据和 I<sup>2</sup> 检验统计数据检查研究之间的异质性。 Cochrane 偏倚风险工具用于评估纳入研究的质量。\n\n**结果：** 我们纳入了 10 项随机对照试验 (RCT) 和 1 项回顾性研究，共有 898 名参与者参与。三项安慰剂对照试验评估了口服硫糖铝对 CRP 的影响，荟萃分析显示与安慰剂组没有显着差异。 4项中药试验显示症状有显着改善，尤其是3项口服中药饮料试验。研究发现棕榈酸视黄酯和高纤维饮食可以减少直肠出血。口服己酮可可碱和生育酚的组合并没有显着改变CRP的过程。\n\n**结论：** 我们的研究表明，口服中药饮料、棕榈酸视黄酯和高纤维饮食可显着改善 CRP 症状，但口服己酮可可碱和生育酚的组合则不然。需要进一步的多中心、更大规模的随机对照试验来确认这些治疗的有效性和安全性，并优化治疗策略，最终改善 CRP 患者的生活质量。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Chronic radiation proctitis, Diarrhoea, Oral treatments, Radiation toxicity, Rectal bleeding", "link": "https://pubmed.ncbi.nlm.nih.gov/37608385/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 23 Aug 2023"}, {"id": "37359408", "title_en": "Predictors of outcome in cryptoglandular anal fistula according to magnetic resonance imaging: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Amirhosein Naseri", "abstract_en": "**Background And Aims:** Anal fistula (AF) with cryptoglandular origin tends to recur, and multiple risk factors are implicated. Recently, some magnetic resonance imaging (MRI) findings with predictive value for disease outcomes have been proposed. These intrinsic anatomic features include those of the AF and its surrounding structures. This study aims to clarify the prognostic role of MRI in AF.\n\n**Methods:** We performed a systematic search of PubMed, Embase, and EBSCO databases. Two independent reviewers conducted the search and screened the articles. We selected studies that used MRI to assess AF and reported its relationship to disease outcome. We extracted data regarding the study design, type of intervention, outcome, MRI-measured items, and their significance.\n\n**Results:** Out of 1230 retrieved articles, 18 were eligible for final inclusion, and a total of 4026 patients were enrolled in the selected studies. For preoperative MRI, the significant items affecting the outcome were the length of the fistula, horseshoe type, presence of multiple tracts, supralevator extension, and apparent diffusion coefficient (ADC) value. Other studies investigated the healing process using postoperative MRI.\n\n**Conclusion:** This review found that MRI can be useful in the management of AF, both preoperatively and postoperatively. Factors, such as fistula length, horseshoe type, presence of multiple tracts, supralevator extension, and ADC value were found to be significantly associated with treatment outcomes. The presence of the fistula tract and the development of new abscesses on postoperative MRI was found to hinder the healing process. Further studies are needed to confirm these findings.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们对 PubMed、Embase 和 EBSCO 数据库进行了系统检索。两名独立审稿人进行了检索并筛选了文章。我们选择了使用 MRI 评估 AF 的研究，并报告了其与疾病结果的关系。我们提取了有关研究设计、干预类型、结果、MRI 测量项目及其意义的数据。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, magnetic resonance imaging, recurrence, treatment outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/37359408/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 26 Jun 2023"}, {"id": "37277090", "title_en": "Neonatal head circumference as a risk factor for obstetric anal sphincter injuries: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ahmad Azmi Nasution", "abstract_en": "**Objective:** Between 53% and 79% of women will sustain some degree of perineal laceration during vaginal delivery. Third- and fourth-degree perineal lacerations are known as obstetric anal sphincter injuries. Timely diagnosis and prompt treatment of obstetric anal sphincter injuries can help to prevent the development of severe consequences like fecal incontinence, urinary incontinence, and rectovaginal fistula. Neonatal head circumference is routinely measured postpartum but is often not mentioned as a risk factor for obstetric anal sphincter injuries in clinical guidelines. Thus far, no review article on the risk factors for obstetric anal sphincter injuries has discussed the role of neonatal head circumference. This study aimed to review and analyze the relationship between head circumference and the occurrence of obstetric anal sphincter injuries among previous studies to conclude whether head circumference should be recognized as an important risk factor.\n\n**Data Sources:** Through study screening on Google Scholar, PubMed, Scopus, and Science Direct for articles published between 2013 to 2023, followed by assessment of eligibility, this study ended up reviewing 25 studies, 17 of which were included in the meta-analysis.\n\n**Study Eligibility Criteria:** Only studies that reported both the neonatal head circumference and the occurrence of obstetric anal sphincter injuries were included in this review.\n\n**Methods:** The included studies were appraised using the Dartmouth Library risk of bias assessment checklist. Qualitative synthesis was based on the study population, findings, adjusted confounding factors, and suggested causative links in each study. Quantitative synthesis was conducted using calculation and pooling of odds ratios and inverse variance using Review Manager 5.4.1.\n\n**Results:** A statistically significant association between head circumference and obstetric anal sphincter injuries was reported in 21 of 25 studies; 4 studies reported that head circumference was a true independent risk factor. A meta-analysis of the studies that reported neonatal head circumference as a dichotomous categorical variable with a cutoff point of 35±1 cm yielded statistically significant pooled results (odds ratio, 1.92; 95% confidence interval, 1.80-2.04).\n\n**Conclusion:** The risk for obstetric anal sphincter injuries increased as the neonatal head circumference increased-this should be considered in decision-making during labor and postpartum management to attain the best outcome.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study eligibility criteria：** 本综述仅纳入报告新生儿头围和产科肛门括约肌损伤发生率的研究。\n\n**方法：** 使用达特茅斯图书馆偏倚风险评估清单对纳入的研究进行评估。定性综合基于研究人群、研究结果、调整后的混杂因素以及每项研究中建议的因果关系。使用 Review Manager 5.4.1 计算并合并优势比和逆方差，进行定量综合。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "delivery, neonatal head circumference, obstetric anal sphincter injuries", "link": "https://pubmed.ncbi.nlm.nih.gov/37277090/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 05 Jun 2023"}, {"id": "37213241", "title_en": "Incidence of Rectal Injury After Radical Prostatectomy: A Systematic Review and Meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vincenzo Ficarra", "abstract_en": "**Context:** Rectal injury (RI) is a dreaded complication after radical prostatectomy (RP), increasing the risk of early postoperative complications, such as bleeding and severe infection/sepsis, and late sequelae, such as a rectourethral fistula (RUF). Considering its traditionally low incidence, uncertainty remains as to predisposing risk factors and management.\n\n**Objective:** To examine the incidence of RI after RP in contemporary series and to propose a pragmatic algorithm for its management.\n\n**Evidence Acquisition:** A systematic literature search was performed using the Medline and Scopus databases. Studies reporting data on RI incidence were selected. Subgroup analyses were conducted to assess the differential incidence by age, surgical approach, salvage RP after radiation therapy, and previous benign prostatic hyperplasia (BPH)-related surgery.\n\n**Evidence Synthesis:** Eighty-eight, mostly retrospective noncomparative, studies were selected. The meta-analysis obtained a pooled RI incidence of 0.58% (95% confidence interval [CI] 0.46-0.73) in contemporary series with significant across-study heterogeneity (I<sup>2</sup> = 100%, <i>p</i> < 0.00001). The highest RI incidence was found in patients undergoing open RP (1.25%; 95% CI 0.66-2.38) and laparoscopic RP (1.25%; 95% CI 0.75-2.08) followed by perineal RP (0.19%; 95% CI 0-276.95) and robotic RP (0.08%; 95% CI 0.02-0.31). Age ≥60 yr (0.56%; 95% CI 0.37-06) and salvage RP after radiation therapy (6.01%; 95% CI 3.99-9.05), but not previous BPH-related surgery (4.08%, 95% CI 0.92-18.20), were also associated with an increased RI incidence. Intraoperative versus postoperative RI detection was associated with a significantly decreased risk of severe postoperative complications (such as sepsis and bleeding) and subsequent formation of a RUF.\n\n**Conclusions:** RI is a rare, but potentially devastating, complication following RP. RI incidence was higher in patients ≥60 yr of age, and in those who underwent open/laparoscopic approach or salvage RP after radiation therapy. Intraoperative RI detection and repair apparently constitute the single most critical step to significantly decrease the risk of major postoperative complications and subsequent RUF formation. Conversely, intraoperatively undetected RI can lead more often to severe infective complications and RUF, the management of which remains poorly standardised and requires complex procedures.\n\n**Patient Summary:** Accidental rectum tear is a rare, but potentially devastating, complication in men undergoing prostate removal for cancer. It occurs more often in patients aged 60 yr or older as well as in those who underwent prostate removal via an open/laparoscopic approach and/or prostate removal after radiation therapy for recurrent disease. Prompt identification and repair of this condition during the initial operation are the key to reduce further complications such as the formation of an abnormal opening between the rectum and the urinary tract.", "abstract_zh": "**Context：** 直肠损伤（RI）是根治性前列腺切除术（RP）后的一种可怕并发症，增加了术后早期并发症（例如出血和严重感染/败血症）以及晚期后遗症（例如直肠尿道瘘（RUF））的风险。考虑到其传统上发病率较低，诱发风险因素和管理仍存在不确定性。\n\n**目的：** 检查当代系列中 RP 之后 RI 的发生率，并提出一种实用的管理算法。\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** 选择了 88 项研究，其中大部分是回顾性非比较性研究。荟萃分析得出当代系列中 RI 的汇总发生率为 0.58%（95% 置信区间 [CI] 0.46-0.73），具有显着的跨研究异质性（I<sup>2</sup> = 100%，<i>p</i> < 0.00001）。 RI 发生率最高的是接受开放式 RP（1.25%；95% CI 0.66-2.38）和腹腔镜 RP（1.25%；95% CI 0.75-2.08）的患者，其次是会阴 RP（0.19%；95% CI 0-276.95）和机器人 RP（0.08%；95% CI） 0.02-0.31）。年龄≥60岁（0.56%；95% CI 0.37-06）和放射治疗后的挽救性RP（6.01%；95% CI 3.99-9.05），但与既往BPH相关手术无关（4.08%，95% CI 0.92-18.20）也与RI发生率增加相关。术中与术后 RI 检测与严重术后并发症（如脓毒症和出血）以及随后形成 RUF 的风险显着降低相关。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Patient summary：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complications, Prostate cancer, Radical prostatectomy, Rectal injury, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/37213241/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 22 May 2023"}, {"id": "37198039", "title_en": "Endorectal advancement flap compared to ligation of inter-sphincteric fistula tract in the treatment of complex anal fistulas: A meta-analysis of randomized clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Steven D Wexner", "abstract_en": "**Background:** Rectal advancement flap and ligation of intersphincteric fistula tract are common procedures for treating complex anal fistula. The present meta-analysis aimed to compare the surgical outcomes of advancement flap and ligation of intersphincteric fistula tract.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review of randomized clinical trials comparing the ligation of intersphincteric fistula tract and advancement flap was conducted. PubMed, Scopus, and Web of Science were searched through January 2023. The risk of bias was assessed using the Risk of Bias 2 tool and certainty of evidence with the Grading of Recommendations Assessment, Development and Evaluation approach. The primary outcomes were healing and recurrence of anal fistulas, and secondary outcomes were operative time, complications, fecal incontinence, and early pain.\n\n**Results:** Three randomized clinical trials (193 patients, 74.6% male) were included. The median follow-up was 19.2 months. Two trials had a low risk of bias, and 1 had some risk of bias. The odds of healing (odds ratio: 1.363, 95% confidence interval: 0.373-4.972, P = .639), recurrence (odds ratio: 0.525, 95% confidence interval: 0.263-1.047, P = .067), and complications (odds ratio: 0.356, 95% confidence interval: 0.085-1.487, P = .157) were similar between the 2 procedures. Ligation of intersphincteric fistula tract was associated with a significantly shorter operation time (weighted mean difference: -4.876, 95% confidence interval: -7.988 to -1.764, P = .002) and less postoperative pain (weighted mean difference: -1.030, 95% confidence interval: -1.418 to -0.641, 0.198, P < .001, I<sup>2</sup> = 3.85%) than advancement flap. Ligation of intersphincteric fistula tract was associated with marginally lower odds of fecal incontinence than advancement flap (odds ratio: 0.27, 95% confidence interval: 0.069-1.06, P = .06).\n\n**Conclusion:** Ligation of intersphincteric fistula tract and advancement flap had similar odds of healing, recurrence, and complications. The odds of fecal incontinence and extent of pain after ligation of intersphincteric fistula tract were lower than after advancement flap.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37198039/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 17 May 2023"}, {"id": "37101285", "title_en": "Mesenchymal stem cells transplantation for perianal fistulas: a systematic review and meta-analysis of clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "J L Jiang", "abstract_en": "**Background:** Perianal fistulas, characterised as granulomatous inflammation of fistulas around the anal canal, are associated with significant morbidity resulting in a negative impact on quality of life and a tremendous burden to the healthcare system. Treatment of anal fistulas usually consists of anal surgery; however, results of closure rates are not satisfactory especially with complex perianal fistulas, after which many patients may suffer from anal incontinence. Recently, the administration of mesenchymal stem cells (MSCs) has shown promising efficacy. Herein, we aim to explore whether MSCs are effective for complex perianal fistulas and if they have either short-term, medium-term, long-term or over-long-term efficacy. Additionally, we want to elucidate whether factors such as drug dosage, MSC source, cell type, and disease aetiology influence treatment efficacy. We searched four online databases and analysed data based on information within the clinical trials registry. The outcomes of eligible trials were analysed with Review Manager 5.4.1. Relative risk and related 95% confidence interval were calculated to compare the effect between the MSCs and control groups. In addition, the Cochrane risk of bias tool was applied to evaluate the bias risk of eligible studies. Meta-analyses showed that therapy with MSCs was superior to conventional treatment for complex perianal fistulas in short-, long- and over-long-term follow-up phases. However, there was no statistical difference in treatment efficacy in the medium term between the two methods. Subgroup meta-analyses showed factors including cell type, cell source and cell dosage were superior compared to the control, but there was no significant difference between different experimental groups of those factors. Besides, local MSCs therapy has shown more promising results for fistulas as a result of Crohn's Disease (CD). Although we tend to maintain that MSCs therapy is effective for cryptoglandular fistulas equally, more studies are needed to confirm this conclusion in the future.\n\n**Short Conclusion:** MSCs Transplantation could be a new therapeutic method for complex perianal fistulas of both cryptoglandular and CD origin showing high efficacy in the short-term to over-long-term phases, as well as high efficacy in sustained healing. The difference in cell types, cell sources and cell dosages did not influence MSCs' efficacy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Short conclusion：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Clinical trials, Efficacy and safety, Healing rate, Mesenchymal stem cells transplantation, Perianal fistulas, Randomised controlled trial, Systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37101285/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 26 Apr 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "单独引流与引流联合瘘管治疗儿童肛周脓肿的系统回顾和荟萃分析", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36905499", "title_en": "A Systematic Review of Epidemiology and Outcomes Associated with Local Surgical and Intersphincteric Ligation Procedures for Complex Cryptoglandular Fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s a
