ated the appropriateness of each statement on a 9-point Likert scale in two rounds of voting, with statements classified as appropriate, inappropriate, or uncertain based on median panel rating and the presence of disagreement, then met in person to discuss the results and vote on the appropriate and inappropriate statements in a final round of ratification voting. Statements ratified by 75% or more of the panellists were incorporated into the final recommendations.\n\n**Findings:** The first online survey was open to the panellists from June 21, 2024, to Aug 6, 2024, and the second survey round was available between Nov 1 and Nov 25, 2024. The in-person ratification meeting was held on Feb 21, 2025. The panel comprised 16 experts (12 [75%] men and four [25%] women) from nine countries (Brazil, Canada, Denmark, Germany, Italy, the Netherlands, Spain, the UK, and the USA) with specialties in gastroenterology (n=10), colorectal surgery (n=4), and radiology (n=2). The overall response rate was 100% (all 16 panellists) for the first round of voting and 94% (15 of 16) for the second round of voting, with 12 (75%) of 16 panellists participating in ratification voting. The first survey contained 116 statements, with 88 (76%) rated as appropriate, two (2%) as inappropriate, and 26 (22%) as uncertain. Of the 122 statements in the second survey, 97 (80%) were rated appropriate, two (2%) were inappropriate, and 23 (19%) were uncertain. 79 statements were voted on during the ratification meeting and 67 (85%) were ratified. Recommended anatomical components for sonographic evaluation were the colonic segment immediately distal to the anastomosis, the neoterminal ileum, neoterminal ileal inlet, colonic and ileal blind side of the anastomosis, sonographically visible colonic segments, and the surrounding mesentery. Recommended parameters for assessment were bowel wall thickness, bowel wall stratification, bowel wall vascularity; mesenteric inflammatory fat and lymphadenopathy; luminal narrowing; and the presence of complications (abscess, inflammatory mass, fistula or sinus tract, stricture and stricture length, and prestenotic dilation). Intestinal ultrasound findings in the neoterminal ileum and the inlet of the neoterminal ileum were considered most likely to reflect clinically meaningful disease activity. Waiting at least 4 weeks after surgery to perform intestinal ultrasound was recommended to avoid confounding the interpretation of sonographic findings with immediate postoperative complications or changes associated with surgical healing. The first assessment is recommended to be performed 3-12 months after surgery.\n\n**Interpretation:** These multidisciplinary recommendations aim to standardise the application of intestinal ultrasound for assessing postoperative recurrence of Crohn's disease after surgical bowel ileocolic resection. Future development of a reliable, validated index for Crohn's disease postoperative recurrence is an important next step.\n\n**Funding:** Johnson & Johnson Innovative Medicine.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Findings：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Interpretation：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Funding：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42161324/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 20 May 2026"}, {"id": "42069871", "title_en": "Clinical and surgical management of recto-urinary fistula after radical prostatectomy: a systematic review on current evidence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Marco Bandini", "abstract_en": "**Background:** Management of rectourinary fistula (RUF) is challenging due to limited data and variability in presentation and treatment. We conducted a systematic review of radical prostatectomy (RP)-related RUF to assess clinical features, diagnostics, treatments, and outcomes, and to propose a structured algorithm to guide management.\n\n**Methods:** We conducted a systematic review in accordance with PRISMA guidelines to evaluate the clinical presentation, diagnostic strategies, management approaches, and outcomes of RUF following RP. A comprehensive search of PubMed, Embase, and Web of Science was performed from database inception to January 2025. Data were extracted on patient demographics, symptoms, diagnostic modalities, management strategies, surgical repair techniques and treatment outcomes.\n\n**Results:** A total of 455 cases of RUF following RP were identified across 34 studies. The reported incidence of RUF ranged from <0.01% to 1.5%. The most frequent presenting symptoms were urine leakage per rectum (60.7%), fecaluria (44.1%), and pneumaturia (50.0%). Fecal and/or urinary diversion was utilized in over 60% of cases, with a median stoma duration of 3 months and an indwelling urinary catheter duration of 1 month. Conservative management (observation, fluid replacement and antibiotic therapy) was attempted in a minority of patients and was generally associated with success rates below 50%. Surgical repair was performed in nearly all cases, with the transperineal and transsphincteric approaches being the most commonly employed techniques. The median time to fistula closure ranged from 0.5 to 30 months, with reported surgical success rates varying between 41% and 100%. We propose a management flowchart based on our clinical experience, outlining the diagnostic and therapeutic approach to rectal injury and RP-related RUF.\n\n**Conclusions:** RUF after RP remains a challenging complication, often requiring stepwise management. Conservative treatments rarely succeed, and surgery is often necessary. Our proposed algorithm aims to standardize the approach to RI and RUF, guiding treatment decisions and improving outcomes.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们根据 PRISMA 指南进行了系统评价，以评估 RP 后 RUF 的临床表现、诊断策略、管理方法和结果。从数据库建立到 2025 年 1 月，对 PubMed、Embase 和 Web of Science 进行了全面检索。提取了有关患者人口统计、症状、诊断方式、管理策略、手术修复技术和治疗结果的数据。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** RP 后的 RUF 仍然是一个具有挑战性的并发症，通常需要逐步管理。保守治疗很少成功，往往需要手术治疗。我们提出的算法旨在标准化 RI 和 RUF 方法，指导治疗决策并改善结果。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42069871/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 02 May 2026"}, {"id": "42034194", "title_en": "Outcomes of Stage IVA Cervical Cancer Treated with Radiation Therapy: A Systematic Review and Meta-Analysis", "title_zh": "IVA 期宫颈癌放射治疗的结果：系统评价和荟萃分析", "authors": "D N Sharma", "abstract_en": "FIGO stage IVA cervical cancer, defined by bladder or rectal mucosal invasion without distant metastasis, is an uncommon but clinically challenging disease with limited high-quality evidence to guide management. We performed a systematic review and meta-analysis to evaluate survival outcomes, treatment-related morbidity, and prognostic factors in patients with stage IVA cervical cancer treated with definitive radiotherapy. Following PRISMA 2020 guidelines and PROSPERO registration (CRD42024602426), PubMed, Embase, and Web of Science were searched through February 2025. Eleven studies comprising 492 patients met eligibility criteria. Pooled random-effects analyses demonstrated 2-, 3-, and 5-year disease-free survival rates of 41.5% (95% CI, 28.1-55.0), 34.2% (95% CI, 21.1-47.3), and 30.9% (95% CI, 16.0-45.8), respectively. Corresponding overall survival rates were 56.0% (95% CI, 46.2-65.9), 45.9% (95% CI, 35.9-55.9), and 34.8% (95% CI, 26.4-43.3). Weighted median disease-free survival and overall survival were 15.6 and 33.6 months, respectively. The pooled incidence of vesicovaginal or rectovaginal fistula was 23.7% (95% CI, 12.9-34.6). Adverse prognostic factors included pelvic nodal involvement, hydronephrosis, rectal invasion, omission of brachytherapy, and total EQD2 below 80-85 Gy. Concurrent chemoradiation and completion of brachytherapy were consistently associated with improved outcomes. Despite curative-intent treatment, long-term survival remains poor and treatment-related morbidity substantial. Durable pelvic control remains the principal therapeutic challenge. Concurrent chemoradiation with adequate-dose brachytherapy appears essential for optimal outcomes, while future stage IVA-specific studies incorporating image-guided adaptive brachytherapy, advanced radiotherapy techniques, and systemic treatment intensification are needed to improve survival and reduce treatment-related morbidity.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42034194/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 25 Apr 2026"}, {"id": "42003433", "title_en": "Timing of seton removal and clinical outcomes in perianal fistulizing Crohn's disease: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hiroki Ikeuchi", "abstract_en": "**Background:** The optimal timing for seton removal in perianal fistulizing Crohn's disease (PFCD) remains unclear. Therefore, we examined the range of reported timing strategies and their association with clinical outcomes.\n\n**Methods:** We systematically searched PubMed, Web of Science, Cochrane Library and Ichushi-Web for studies published from January 1990 to June 2025. Eligible studies included adult patients with PFCD who underwent seton placement and reported removal timing and clinical outcomes. Healing and recurrence rates were pooled using a random effects model. Subgroup analyses evaluated seton removal timing (<34 vs. ≥34 weeks) and biologic and antibiotic usage.\n\n**Results:** Overall, nine studies were included (nine observational studies). The pooled healing rate was 57% (95% confidence interval [CI], 40-73%), and the pooled recurrence rate was 31% (95% CI, 15-53%), both with substantial heterogeneity (I<sup>2</sup> > 80%). Short-term removal (<34 weeks) achieved a healing rate of 69% (95% CI, 56-79%) vs. 46% (95% CI, 22-72%) for long-term removal (≥34 weeks) (p = 0.03). A significant correlation was found between seton removal timing and healing rate (r = -0.70, p = 0.03). The recurrence incidence was 12.7 (95% CI, 4.7-34.3) in the short-term group and 3.9 (95% CI, 0.7-21.4) in the long-term group (p = 0.09).\n\n**Conclusion:** An association between seton removal timing and fistula healing was observed without a corresponding increase in recurrence. These findings should be interpreted cautiously because removal timing may reflect disease severity and treatment response rather than a causal effect.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "荟萃分析，肛周瘘管克罗恩病，挂线放置，挂线移除", "keywords_en": "meta‐analysis, perianal fistulizing Crohn's disease, seton placement, seton removal", "link": "https://pubmed.ncbi.nlm.nih.gov/42003433/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 20 Apr 2026"}, {"id": "41873840", "title_en": "Transperineal ultrasonography in detecting penetrating perianal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Krisztina Gecse", "abstract_en": "**Background And Aims:** Perianal complications such as fistulas and abscesses are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\n**Methods:** A comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\n**Results:** Of 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\n**Conclusions:** TPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "abstract_zh": "**Background and aims：** 肛周并发症，如瘘管和脓肿，在克罗恩病 (CD) 中很常见，并导致显着的发病率。经会阴超声检查 (TPUS) 已成为诊断肛周瘘管性 CD (pfCD) 的一种无创且准确的方法。本综述评估了 TPUS 与磁共振成像 (MRI)、经直肠超声检查 (TRUS) 和麻醉下检查 (EUA) 相比对肛周瘘管和脓肿的检测和分类的诊断准确性。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "TPUS, abscess, perianal fistula, perianal fistulizing Crohn’s disease, transperineal ultrasound", "link": "https://pubmed.ncbi.nlm.nih.gov/41873840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 24 Mar 2026"}, {"id": "41815267", "title_en": "Response to \"Comment on the systematic review of TROPIS for anal fistula\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815267/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41815266", "title_en": "Comment on the systematic review of TROPIS for anal fistula", "title_zh": "TROPIS治疗肛瘘系统评价评述", "authors": "Prema Ram Choudhary", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815266/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41796653", "title_en": "Feasibility and safety of laparoscopic versus open repair for rectobulbar fistula in anorectal malformations: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vikesh Agrawal", "abstract_en": "**Background:** Laparoscopic-assisted Anorectoplasty (LAARP) for male recto-bulbar fistula (RBF) remains debated, with early reports describing approach-specific complications. Prior meta-analyses pooled heterogeneous Anorectal malformation (ARM) subtypes, limiting conclusions for RBF. We conducted an RBF-specific systematic review and meta-analysis comparing LAARP with posterior sagittal anorectoplasty (PSARP).\n\n**Methods:** PubMed/MEDLINE, Embase, Scopus, and Google Scholar were searched (2000-November 2025) for comparative studies of LAARP versus PSARP in male children with RBF. Risk of bias was assessed using the ROBINS-I tool. Random-effects meta-analyses in Jeffreys's Amazing Statistics Program (JASP) used log effect sizes for dichotomous outcomes and mean differences for operative time. Sensitivity analyses excluded studies with zero events in both arms.\n\n**Results:** Six observational cohort studies (278 patients; LAARP 154, PSARP 124) were included. No intraoperative complications or conversions to open surgery were reported. Postoperative urethral diverticulum (UD) was not reported in five studies; one study reported 4 cases (15.38 %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in the pooled analysis (log OR 1.23, 95 % CI 0.02 to 2.44); this persisted in event-positive studies (log OR 1.45, 95 % CI 0.18 to 2.72). Operative time was longer with LAARP (mean difference (MD) 66.74 min, 95 % CI 27.48 to 106.00), with substantial heterogeneity (I<sup>2</sup> 97.57 %). Wound infection was uncommon and inconsistently reported; quantitative pooling was not undertaken.\n\n**Conclusions:** LAARP is a feasible and safe option for male RBF, with outcomes comparable to those of PSARP for major postoperative complications; however, the certainty of the evidence remains limited, underscoring the need for high-quality prospective studies.", "abstract_zh": "**背景：** 腹腔镜辅助肛门直肠成形术 (LAARP) 治疗男性直肠球瘘 (RBF) 仍存在争议，早期报告描述了手术特异性并发症。先前的荟萃分析汇集了异质性肛门直肠畸形 (ARM) 亚型，限制了 RBF 的结论。我们进行了针对 RBF 的系统评价和荟萃分析，比较了 LAARP 与后矢状肛门直肠成形术 (PSARP)。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s al sitivity and specificity for intersphincteric (SEN: 0.89, SPE: 0.94) and transsphincteric anal fistulas (SEN: 0.96, SPE: 0.86), but lower diagnostic sensitivity for suprasphincteric (SEN: 0.72) and extrasphincteric (SEN: 0.75) fistulas. unenhanced MRI demonstrated high specificity (>0.94) for all classifications and moderate sensitivity (>0.85), except for suprasphincteric fistulas (SEN: 0.71). CE-MRI showed the highest diagnostic accuracy, with both sensitivity and specificity exceeding 0.90 for most classifications.\n\n**Conclusion:** Both 3D-EAUS and MRI can effectively diagnose anal fistulas. 3D-EAUS is the preferred initial examination, and CE-MRI is recommended for complex or unclear cases, providing an evidence-based basis for clinical decision-making and improving patient prognosis.", "abstract_zh": "**Rationale and objectives：** 肛瘘严重影响患者的生活质量，术前准确的 Parks 分类对于手术计划和保留肛门括约肌至关重要。这项系统评价和荟萃分析评估了 3D 肛门内超声 (3D-EAUS) 和非增强/对比增强 (CE) 磁共振成像 (MRI) 对肛瘘分类的诊断功效。\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "3D-EAUS, Anal fistula, Diagnostic accuracy, MRI, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/41714221/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 19 Feb 2026"}, {"id": "41698846", "title_en": "Tunnel vision: rethinking local therapy for perianal fistulas in Crohn's disease", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Serre-Yu Wong", "abstract_en": "**Background And Aims:** Local therapies involving direct delivery of agents to fistula tracts in perianal fistulizing Crohn's disease (PFCD) have been explored but are not standard in clinical practice. We aimed to conduct a systematic review of local therapies for PFCD to evaluate their role in fistula closure, considering current pathophysiological insights and contemporary surgical and medical expertise.\n\n**Methods:** We performed a systematic review assessing the efficacy of local therapies for PFCD, excluding mesenchymal stem cell therapies, which have been reviewed elsewhere. The reporting quality of the studies was assessed using a validated checklist.\n\n**Results:** The systematic review included 31 studies evaluating fibrin glue (n = 11), fistula plugs (n = 11), locally injected medications (n = 5), ointments (n = 3), and platelet-rich plasma (n = 2). Fibrin glue showed short-term success (healing rates 30%-91%) but poor long-term outcomes (26%-57%). Fistula plugs had variable success rates (15%-85%) with minimal benefit from repeated applications. Locally injected biologics achieved healing rates of over 60%, often with durable responses. Metronidazole ointment had only short-term efficacy, while tacrolimus had no significant benefit. A potential approach to improving the efficacy and durability of local therapies for PFCD may involve surgical preconditioning (through curettage and internal orifice closure) and the efficient delivery of agents into fistula tracts that modulate microbial communities, inflammation, and, ultimately, wound healing.\n\n**Conclusions:** There is an unmet need to generate novel local therapies that achieve long-lasting fistula closure. To facilitate their development, the delineation of host and microbial pathways contributing to PFCD pathogenesis and research in drug delivery systems are needed.", "abstract_zh": "**Background and aims：** Error 500 (Se A, seton insertion, and/or seton removal. We stratified recommendations by fistula complexity, the presence of abscesses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\n**Results:** Twenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\n**Conclusion:** Substantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "abstract_zh": "**Background and aims：** 肛周瘘管性克罗恩病 (pfCD) 是克罗恩病的一种异质表型，在解剖复杂性、症状学和疾病轨迹方面具有显着的变异性。这通常会给最佳管理方法带来不确定性，特别是何时进行麻醉下检查（EUA）以及何时插入或取出挂线的手术方面。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "克罗恩病、脓肿、结直肠手术、炎症性肠病、直肠瘘", "keywords_en": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41693361/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 16 Feb 2026"}, {"id": "41692935", "title_en": "Intraluminal bypass devices as an alternative to defunctioning stoma in anterior resection: A systematic review of safety and feasibility", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ziqiang Wang", "abstract_en": "**Aim:** To systematically evaluate the safety and feasibility of intraluminal bypass devices (IBDs) as alternatives to defunctioning stoma for colorectal/coloanal anastomoses after anterior resection.\n\n**Method:** The present systematic review was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Endpoints were feasibility (placement, fixation, maintenance, removal) and safety (device-related events, postoperative morbidity and anastomotic leakage).\n\n**Results:** In total, 10 studies evaluating five types of IBDs were included in this systematic review. Each IBD had a head portion with a proximal fixation component and a tail portion consisting of a transanal endoluminal tubular sheath or tube for faecal diversion but with a distinct design. Device-related events included migration, sheath internalization, partial colonic wall erosions and enterocutaneous fistula. Overall postoperative complications were reported in 0-74% and anastomotic leakage in 0-32% across studies. Stoma avoidance ranged from 66.7% to 100%.\n\n**Conclusion:** IBDs are technically feasible and appear acceptably safe, with potential to reduce reliance on defunctioning stoma; however, evidence remains early and heterogeneous. Further studies are needed, and optimization of fixation and anti-migration strategies should be prioritized.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "吻合口保护装置, 吻合口漏, 造口功能障碍, 低位前切除术, 术后并发症", "keywords_en": "anastomosis protection device, anastomotic leakage, defunctioning stoma, low anterior resection, postoperative complications", "link": "https://pubmed.ncbi.nlm.nih.gov/41692935/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sun, 15 Feb 2026"}, {"id": "41537212", "title_en": "Transanal Opening of the Intersphincteric Space to Treat Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Zhen-Yi Wang", "abstract_en": "**Aim:** Transanal opening of the intersphincteric space (TROPIS) is a minimally invasive surgical treatment for anal fistula that not only eliminates the source of infection but also protects anal function to the greatest extent. This systematic review and meta-analysis aims to evaluate the efficacy of TROPIS in the treatment of anal fistula.\n\n**Methods:** We searched PubMed, EMBASE, Web of Science, and the Cochrane Library for information on TROPIS surgery for anal fistulas performed between the inception of each database and 1 November 2024. We used the single-arm studies for analysis, with a total of 918 subjects and a follow-up period ranging from 3 months to 36 months. The analysis focused on the cure rate of different types of anal fistula, postoperative bleeding, infection, and adverse reactions.\n\n**Results:** This systematic review included six single-arm studies involving a total of 918 patients with anal fistula who underwent TROPIS surgery, with follow-up durations ranging from 3 to 36 months. Among the included studies, all were classified as high quality (score ≥7). This study demonstrated an 80% success rate for the initial operation (95% confidence interval (CI): 0.77-0.83), as well as an 80% success rate specifically for high fistulas (95% CI: 0.77-0.83). The success rate for second operations was 73% (95% CI: 0.47-0.99). For patients with high fistulas who underwent a second procedure, the success rate was 78% (95% CI: 0.40-1.00). The cure rate for anal fistulas accompanied by abscesses was 88%, while the cure rate for anal fistulas without abscesses is the same. For horseshoe fistulas, the cure rate was 87%, whereas it was 88% for non-horseshoe fistulas. The overall cure rate in this study was 88% (95% CI: 0.86-0.90). The rate of intraoperative bleeding was 3%, the postoperative infection rate was 5%, and the overall incidence of adverse reactions was 3%.\n\n**Conclusions:** This study demonstrates that TROPIS holds significant potential in the treatment of anal fistulas, particularly for high fistulas, fistulas with associated abscesses, and horseshoe-shaped fistulas, whilst exhibiting a relatively low incidence of incontinence.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, meta-analysis, sphincter-preserving procedure, transanal opening of intersphincteric space", "link": "https://pubmed.ncbi.nlm.nih.gov/41537212/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 15 Jan 2026"}, {"id": "41359092", "title_en": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "title_zh": "系统评价：炎症性肠病直肠切除术后未愈合伤口和持续性会阴窦的处理", "authors": "A Hart", "abstract_en": "**Introduction:** Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\n**Methods:** A literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\n**Results:** Of 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, cleft closure, omentoplasty, skin grafting, gracilis and rectus abdominis flap, platelet-derived growth factor, curettage, lay open and excision of sinuses. Reported healing rates ranged from 30% to 100%. Heterogeneity in the reporting of outcomes, as well as the interventions performed precluded meta-analysis.\n\n**Conclusion:** The published evidence for treatment of PPS in IBD consists of low-quality evidence case series with high risk of bias. There is a need for standardised outcome reporting and high-quality, prospective studies to establish effective treatment algorithms.", "abstract_zh": "**介绍：** 克罗恩病直肠切除术后，多达三分之一的患者可能会出现未愈合的伤口和持续性会阴窦 (PPS)。这些疾病的治疗仍然是一个重大挑战，特别是在炎症性肠病（IBD）的背景下，现有的治疗方法受到高失败率的困扰。这项对文献的系统回顾评估了 IBD 中 PPS 闭合的药物和手术治疗的疗效。次要目标包括审查用于 PPS 的分类系统。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "肛周瘘管克罗恩病、肛周脓肿", "keywords_en": "Fistulizing perianal Crohn’s disease, Perianal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/41359092/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 08 Dec 2025"}, {"id": "41345764", "title_en": "The diagnostic value of faecal calprotectin levels in patients with perianal fistula: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Dimitrios Chatziisaak", "abstract_en": "**Aim:** Perianal fistula (PAF) is a common condition encountered in surgical and gastroenterological practice. Distinguishing between cryptoglandular disease (CGD) and inflammatory bowel disease (IBD)-related perianal disease is critical to ensure appropriate management. Faecal calprotectin (FC) has emerged as a promising non-invasive biomarker for IBD; however, its role in acute perianal disease is not well established. This systematic review aimed to evaluate the diagnostic accuracy of FC in distinguishing IBD-related perianal disease from CGD.\n\n**Method:** A systematic literature search was conducted in PubMed, Embase and Cochrane databases following PRISMA guidelines. Studies were included if they assessed FC levels in patients with PAF and provided diagnostic accuracy metrics. Data extraction focused on study design, population characteristics, FC cut-off values, sensitivity, specificity and area under the curve (AUC) metrics.\n\n**Results:** Three studies met the inclusion criteria, all reporting significantly higher FC levels in IBD-related PAF compared to CGD-related fistulas. The proposed FC cut-off values varied, ranging from 110 μg/g to 344 μg/g, with corresponding sensitivities between 52% and 81%, as well as specificities between 77% and 93%. The AUC values indicated moderate to high diagnostic accuracy.\n\n**Conclusion:** FC shows potential as a diagnostic tool for differentiating IBD-related perianal disease from CGD. A cut-off of 110-150 μg/g appears most suitable for early screening, whereas a higher threshold may be appropriate for confirmatory diagnosis. Further prospective studies with standardized protocols are necessary to refine these thresholds and validate FC as a clinical decision-making tool.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 三项研究符合纳入标准，所有研究均报告 IBD 相关 PAF 的 FC 水平显着高于 CGD 相关瘘管。建议的 FC 截止值范围从 110μg/g 到 344μg/g，相应的敏感性在 52% 到 81% 之间，特异性在 77% 到 93% 之间。 AUC 值表明诊断准确性为中等到高。\n\n**结论：** FC 显示出作为区分 IBD 相关肛周疾病和 CGD 的诊断工具的潜力。 110-150μg/g 的临界值似乎最适合早期筛查，而更高的阈值可能适合确诊。有必要使用标准化方案进行进一步的前瞻性研究，以完善这些阈值并验证 FC 作为临床决策工具。", "keywords_zh": "克罗恩病、隐腺疾病、粪便钙卫蛋白、炎症性肠病、肛周瘘", "keywords_en": "Crohn's disease, cryptoglandular disease, faecal calprotectin, inflammatory bowel disease, perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41345764/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 04 Dec 2025"}, {"id": "41342583", "title_en": "Letter to the Editor: commentary on \"Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jingen Lu", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41342583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 04 Dec 2025"}, {"id": "41273375", "title_en": "Association Between Sexual Violence and Reported Anorectal Symptoms Among Adults: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Veronique Feipel", "abstract_en": "**Introduction And Hypothesis:** Individuals experiencing anorectal symptoms may report a history of sexual violence (SV) and conversely, survivors of SV may later report anorectal symptoms. However, the nature of the relationship between SV and these symptoms remains insufficiently understood. This review aims to systematically assess the reported prevalence and severity of anorectal symptoms, as well as their association with sexual violence, among adult survivors of both sexes.\n\n**Material And Methods:** Following the PRISMA guidelines, a systematic search of three databases, CINAHL, Embase, and MEDLINE/PubMed, was performed for quantitative observational studies concerning SV (rape, sexual harassment, childhood sexual abuse, female genital mutilation) as well as reported anorectal symptoms among adults. Cross-sectional, cohort, case-control, and case series studies published in English and French were included. The Mixed Methods Appraisal Tool (MMAT) was used for assessing the quality of included studies.\n\n**Results:** Thirteen studies met the inclusion criteria for data extraction. Most studies (12/13) were conducted in a medical setting with a cross-sectional design. Two cross-sectional studies assessed the prevalence of reported anorectal symptoms among SV survivors and 11 studies evaluated the prevalence of SV among patients with anorectal disorders. SV prevalence ranged from 4.1% to 62%. Constipation was the main studied symptom (9/13) followed by fecal incontinence (7/13), anorectal pain (2/13), and recto-vaginal fistula (1/13). Assessments for both SV and anorectal disorders lacked standardization, involving heterogeneous findings.\n\n**Conclusion:** This review highlights the need for more specific research using standardized assessment of SV and anorectal disorders to better understand their association to improve trauma-informed care pathways.", "abstract_zh": "**Introduction and hypothesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Material and methods：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 本综述强调需要使用 SV 和肛门直肠疾病的标准化评估进行更具体的研究，以更好地了解它们的关联，从而改善创伤知情护理途径。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal symptoms, Constipation, Fecal incontinence, Sexual violence systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41273375/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 22 Nov 2025"}, {"id": "41267606", "title_en": "Efficacy of Adalimumab Biosimilars in Managing Perianal Fistula in Moderate to Severe Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "M R Bakry", "abstract_en": "**Background:** Perianal fistulas represent a severe complication of Crohn's disease (CD), leading to significant morbidity and a decline in patients' quality of life. Adalimumab, a tumor necrosis factor (TNF) inhibitor, has been widely used for managing CD-related fistulas. However, with the introduction of adalimumab biosimilars, their comparative efficacy in fistula closure remains unclear. This systematic review and meta-analysis assessed the effectiveness and safety of adalimumab biosimilars in achieving complete fistula closure in moderate to severe CD.\n\n**Objective:** To evaluate the efficacy of adalimumab biosimilars in achieving complete fistula closure in patients with moderate to severe Crohn's disease, compared to placebo or standard therapies.\n\n**Methods:** A systematic review and meta-analysis were conducted following PRISMA guidelines. Studies published between 2007 and 2024 were retrieved from PubMed, Web of Science, Embase, Google Scholar, and the Cochrane Library. The included studies consisted of randomized controlled trials (RCTs), non-RCTs, case-control studies, and cohort studies that evaluated the efficacy of adalimumab biosimilars in fistula closure. Data extraction and quality assessment were independently performed using the MINORS evaluation tool. Heterogeneity was assessed using Q and I² statistics, and sensitivity analyses were conducted to explore potential sources of heterogeneity. Funnel plots were used to assess publication bias.\n\n**Results:** Ten studies met the inclusion criteria. The analysis demonstrated that adalimumab biosimilars significantly improved the complete fistula closure rate compared to placebo or conventional treatments. The pooled results indicated a moderate to high efficacy, with a statistically significant improvement in clinical remission rates (P < 0.05). Safety analysis revealed that adverse events were comparable between biosimilars and the original adalimumab, with no significant increase in serious adverse reactions. Sensitivity analysis confirmed the robustness of the findings, and publication bias assessment did not indicate significant bias.\n\n**Conclusions:** This meta-analysis supports the efficacy and safety of adalimumab biosimilars in managing perianal fistulas in moderate to severe CD. The findings suggest that adalimumab biosimilars are effective and safe in managing perianal fistulas in Crohn's disease, but further direct comparative studies with originator adalimumab are needed to establish equivalence. Further large-scale RCTs are recommended to confirm these results and establish long-term safety data.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 与安慰剂或标准疗法相比，评估阿达木单抗生物仿制药在中度至重度克罗恩病患者实现瘘管完全闭合方面的功效。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 该荟萃分析支持阿达木单抗生物仿制药治疗中度至重度 CD 肛周瘘的有效性和安全性。研究结果表明，阿达木单抗生物仿制药在治疗克罗恩病肛周瘘方面有效且安全，但需要与原研药阿达木单抗进行进一步的直接比较研究以确定等效性。建议进一步进行大规模随机对照试验来证实这些结果并建立长期安全性数据。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Adalimumab, Crohn’s disease, adalimumab biosimilars, anti-TNF agents., biologic therapy, biosimilars, fistula closure, perianal fistula, tumor necrosis factor inhibitors", "link": "https://pubmed.ncbi.nlm.nih.gov/41267606/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 21 Nov 2025"}, {"id": "41219674", "title_en": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\n**Methods:** MEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\n**Results:** Eighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\n**Conclusions:** This systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/41219674/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 11 Nov 2025"}, {"id": "41133388", "title_en": "Letter to the Editor: insights into \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41133388/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 24 Oct 2025"}, {"id": "40983150", "title_en": "Management of Perianal Abscesses in Infants: A Systematic Review From the APSA Outcomes and Evidence-Based Practice Committee", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "American Pediatric Surgical Association Outcomes and Evidence-Based Practice Committee", "abstract_en": "**Background:** Management of infant perianal disease, including perianal abscess and fistula-in- ano (FIA), remains controversial. There is lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\n**Methods:** The American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\n**Results:** Over 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\n**Conclusions:** Both operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\n**Type Of Study:** Systematic Review of level 3-4 studies.\n\n**Level Of Evidence:** Level 4.", "abstract_zh": "**背景：** 婴儿肛周疾病的治疗，包括肛周脓肿和肛瘘（FIA），仍然存在争议。关于手术和非手术方法的风险和益处缺乏共识。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Type of study：** 3-4 级研究的系统审查。\n\n**Level of evidence：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Fistula-in-ano, Fistulotomy, Infants, Perianal abscess, Perirectal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/40983150/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 22 Sep 2025"}, {"id": "40936062", "title_en": "Effectiveness of Laser-Based Fistula Therapies with and without Adjunctive Measures in Anal Fistulas Management: A Systematic Review and Single-Arm Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Stefano Baraldo", "abstract_en": "**Purpose:** Fistula Laser Closure (FiLaC®) is a sphincter-preserving technique for anal fistulas, but its efficacy and safety remain under discussion. Therefore, we aim to evaluate the efficacy and safety of FiLaC® in the management of patients with cryptoglandular fistulas.\n\n**Methods:** A systematic review was performed in MEDLINE, Embase, and Cochrane databases in January 2025, following PRISMA guidelines. We included randomized controlled trials (RCTs) and observational studies assessing FiLaC® for cryptoglandular fistulas, with or without surgical adjunctive measures. The main outcome was the primary healing rate. Secondary outcomes included fistula recurrence, incontinence, reoperation rates, and postoperative complications. Subgroup analyses explored variables related to the primary healing rate. Data are presented as percentages (95% confidence interval). Statistical analyses were performed using R (version 4.4.1 (2024-06-14 (ucrt)).\n\n**Results:** We included 24 studies with 1,503 patients. The pooled primary healing rate was 57.46% (49.40-65.33). Recurrence occurred in 18.48% of patients (10.14-28.47), while new-onset incontinence was rare (0.57%; 0.00-2.15). The reoperation rate was 36.49% (28.95-44.36), and anal abscesses or infections affected 6.54% (1.93-13.09) of patients. Subgroup analysis showed no statistically significant differences in the primary healing rate based on fistula type, adjunctive measures, or sex. Sensitivity analysis confirmed the robustness of our findings.\n\n**Conclusions:** FiLaC® seems to be a safe option with an intermediate healing rate in patients with cryptoglandular fistulas, although it is associated with a considerable recurrence rate. While its sphincter preservation advantage is evident, further RCTs standardizing the technique and adjunctive approaches are needed to optimize outcomes and refine its application in fistula management.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "隐腺瘘管，FiLaC，愈合率，荟萃分析，直肠瘘", "keywords_en": "Cryptoglandular fistulas, FiLaC, Healing rate, Meta-analysis, Rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40936062/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40933558", "title_en": "Adipose-derived stem cell therapies for complex anal fistula: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wenjiang Wu", "abstract_en": "**Purpose:** This study aimed to systematically investigate the efficacy of adipose-derived stem cells (ASCs) in complex anal fistula treatment.\n\n**Methods:** This study systematically searched randomized controlled studies on the efficacy of ASCs in treating complex anal fistula published before June 2024 in PubMed, EMBASE, Web of Science, and Cochrane Library. Further, relevant journals were manually searched for relevant references, and two researchers independently performed literature search and screening, data extraction, and bias assessment. Stata version 12.0 was utilized to statistically analyze the healing rate of the anal fistula and the incidence of adverse events.\n\n**Results:** This study involved 1,056 patients from five randomized controlled trials, including 561 patients in the treatment group (ASCs/ASCs + fibrin glue) and 495 patients in the control group (fibrin glue/placebo). Meta-analysis revealed better short- and long-term efficacy of adipose mesenchymal stem cell treatment for complex perianal fistulas than in conventional treatment. However, no statistical difference was observed between mid-term and ultra-long-term treatments. Subgroup meta-analysis demonstrated a difference in efficacy between various cell doses. Further, all treatments with different sources of ASCs were superior to conventional quality.\n\n**Conclusion:** This study confirms that Adipose-derived Stem Cells can effectively improve short-term and long-term (1-year) clinical outcomes in patients with complex perianal fistulas, supporting their potential as a novel therapeutic strategy.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/view/CRD42024602327.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adipose stem cells, adipose-derived mesenchymal stem cell, perianal fistula, randomized controlled trial, systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/40933558/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40929949", "title_en": "A systematic review and meta-analysis of the outcomes of anal fistula clips in the treatment of anal fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Giovanna DaSilva", "abstract_en": "**Introduction:** One recent novel method for the treatment of anal fistulas is the over-the-scope clip. This meta-analysis aimed to examine the success of anal fistula clips.\n\n**Methods:** This Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review searched PubMed, Scopus, and Cochrane Library from January 2000 through March 2025 for observational and randomized controlled trials that used over-the-scope clips in treating cryptoglandular and inflammatory bowel disease-related anal fistulas. Main outcomes were pooled healing and complication rates, and length of stay.\n\n**Results:** 12 studies (2 randomized controlled trials) incorporating a total of 438 patients were included; 293 patients underwent anal fistula clip placement. The median age of the patients was 45.5 years. The pooled healing rate was 67.7% (95% confidence interval: 54.7%-80.7%) with a median follow-up of 11.3 months. Pooled healing was 78.7% (95% confidence interval: 62.3%-95.1%) in cryptoglandular fistulas and 59.5% (95% confidence interval: 41.8%-77.2%) in studies that included both cryptoglandular and inflammatory bowel disease fistulas. The medical hospital stay across 3 studies was 4.9 days. Pooled complication rate was 30.9% (95% confidence interval: 14.6%-47.2%). The most common complications were spontaneous migration or unscheduled removal of a clip (17.3%, 95% confidence interval: 8.3%-26.4%) and clinically significant pain (3.8%, 95% confidence interval: 0.9%-6.7%). Seven studies assessed continence after over-the-scope clip placement, and no cases of fecal incontinence were reported.\n\n**Conclusions:** The over-the-scope clip is a promising and novel minimally invasive treatment for anal fistulas. The pooled healing rate was 67.7% overall and >75% for cryptoglandular fistulas. Despite its encouraging success, the over-the-scope clip's complication rate of 30.9% highlights the need for further refinement of this technique and patient selection.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40929949/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 10 Sep 2025"}, {"id": "40844884", "title_en": "A commentary on \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Chunxue Li", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40844884/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 22 Aug 2025"}, {"id": "40833840", "title_en": "Bacteriology of Anorectal Abscess and Anal Fistula: A Systematic Review of the Literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "David Parés", "abstract_en": "<b><i>Aim:</i></b> A cryptoglandular anorectal abscess is a collection of purulent material around the anus, often leading to the development of an anal fistula after drainage. Although <i>Escherichia coli</i> and <i>Bacteroides fragilis</i> have been considered key bacteria in these conditions, recent evidence suggests the need to revisit this assumption. This work aimed to analyze the presence and role of bacteria in the development of anal fistulas following anorectal abscesses. <b><i>Patients and Methods:</i></b> A search was conducted using MEDLINE via PubMed, EMBASE, Cochrane Library, and Google Scholar. Articles reporting the microbiology of cryptoglandular anorectal abscesses and the resulting anal fistulas in human beings were included. The main outcome was to evaluate the presence of bacteria in cultures of anorectal abscesses or in patients who developed anal fistulas. Additional goals included identifying patient characteristics and assessing clinical outcomes on the basis of the isolated bacteria. <b><i>Results:</i></b> In total, 22 articles on anorectal abscesses and seven on anal fistulas met the inclusion criteria. Men were the most prevalent in both cases. <i>Escherichia coli</i> and the <i>Bacteroides</i> genus were the most isolated microorganisms in abscesses and fistulas, though inconsistently in the latter. <i>Bilophila wadsworthia</i> was newly isolated in abscesses, and <i>Rothia</i> sp. was notable in fistulas using new molecular techniques. <b><i>Conclusions:</i></b> <i>Escherichia coli</i> and <i>Bacteroides</i> sp. are involved in anorectal abscesses and anal fistula formation. Recently, using new technology non-well-known bacteria had been isolated involved in this clinical problem.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, anorectal abscess, bacteriology, cultures", "link": "https://pubmed.ncbi.nlm.nih.gov/40833840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 20 Aug 2025"}, {"id": "40824311", "title_en": "Abdominoperineal pull-through with delayed coloanal anastomosis for pelvic anastomotic failure-a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "I Seow-En", "abstract_en": "**Aim:** Despite the potential benefits of abdominoperineal pull-through with delayed coloanal anastomosis (DCAA), it is still infrequently performed as a salvage procedure for pelvic anastomotic failure. We aimed to perform a systematic review on the subject to guide practice.\n\n**Method:** PubMed, Embase and Cochrane were used to identify studies evaluating DCAA for salvage after pelvic surgery from inception to August 2024. Risk of bias assessment was performed using the Newcastle-Ottawa scale. The primary outcome was overall stoma-free survival. Secondary outcomes included hospital length of stay, high-grade postoperative complication rates, 30-day postoperative mortality rates, incidence of redo surgical intervention after DCAA, and postoperative anorectal function.\n\n**Results:** Five retrospective cohort studies evaluating a total of 97 patients who underwent salvage abdominoperineal pull-through and DCAA were included in this review. All patients had previous pelvic surgery, predominantly proctectomy (n = 84, 86.6%). The most common indication for redo surgery was chronic fistula (n = 62, 63.9%) followed by anastomotic leak or chronic pelvic sepsis (n = 34, 35.1%). The pooled overall stoma-free survival rate across all five studies was 81.4% over a mean 24-month postoperative follow-up duration. The overall incidence of high-grade complications after DCAA was 39.1% (n = 38). Pooled mean length of stay was 17 days. There were no cases of early postoperative death. Pooled rate of repeat surgery across four studies was 11.6% (n = 8). Pooled mean functional scores across three studies indicated minor low anterior resection syndrome at 26 months.\n\n**Conclusion:** Abdominoperineal pull-through with delayed coloanal anastomosis is a viable option for salvage surgery following pelvic anastomotic complications, with low rates of permanent stoma and acceptable long-term anorectal function.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 腹会阴牵引联合延迟结肠肛管吻合术是盆腔吻合并发症后挽救手术的可行选择，具有较低的永久性造口率和可接受的长期肛门直肠功能。", "keywords_zh": "腹会阴牵引、结直肠手术、延迟结肠肛门吻合术、重做手术", "keywords_en": "Abdominoperineal pull-through, Colorectal surgery, Delayed coloanal anastomosis, Redo surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40824311/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20
