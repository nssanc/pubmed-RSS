n error.There was an error. Please try again later.That’s all we know.", "authors": "Suzanne F Cook", "abstract_en": "**Introduction:** This systematic literature review (SLR) assessed incidence/prevalence of cryptoglandular fistulas (CCF) and outcomes associated with local surgical and intersphincteric ligation procedures for CCFs.\n\n**Methods:** Two trained reviewers searched PubMed and Embase for observational studies evaluating the incidence/prevalence of cryptoglandular fistula and clinical outcomes of treatments for CCF after local surgical and intersphincteric ligation procedures for CCF.\n\n**Results:** In total 148 studies met a priori eligibility criteria for all cryptoglandular fistulas and all intervention types. Of those, two assessed incidence/prevalence of cryptoglandular fistulas. Eighteen reported clinical outcomes of surgeries of interest in CCF and were published in the past 5 years. Prevalence was reported as 1.35/10,000 non-Crohn's patients, and 52.6% of non-IBD patients were found to progress from anorectal abscess to fistula over 12 months. Primary healing rates ranged from 57.1% to 100%; recurrence occurred in a range of 4.9-60.7% and failure in 2.8-18.0% of patients. Limited published evidence suggests postoperative fecal incontinence and long-term postoperative pain were rare. Several of the studies were limited by single-center design with small sample sizes and short follow-up durations.\n\n**Discussion:** This SLR summarizes outcomes from specific surgical procedures for the treatment of CCF. Healing rates vary according to procedure and clinical factors. Differences in study design, outcome definition, and length of follow-up prevent direct comparison. Overall, published studies offer a wide range of findings with respect to recurrence. Postsurgical incontinence and long-term postoperative pain were rare in the included studies, but more research is needed to confirm rates of these conditions following CCF treatments.\n\n**Conclusion:** Published studies on the epidemiology of CCF are rare and limited. Outcomes of local surgical and intersphincteric ligation procedures show differing success and failure rates, and more research is needed to compare outcomes across various procedures. (PROSPERO; registration number CRD42020177732).", "abstract_zh": "**介绍：** 本系统文献综述 (SLR) 评估了隐腺瘘 (CCF) 的发病率/患病率以及与 CCF 局部手术和括约肌间结扎手术相关的结果。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** 本 SLR 总结了治疗 CCF 的特定外科手术的结果。治愈率根据手术和临床因素而有所不同。研究设计、结果定义和随访时间长度的差异阻碍了直接比较。总体而言，已发表的研究提供了有关复发的广泛发现。在纳入的研究中，术后失禁和长期术后疼痛很少见，但需要更多的研究来确认 CCF 治疗后这些情况的发生率。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Complex cryptoglandular fistula, Healing, Incontinence, Pain, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/36905499/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36905475", "title_en": "Platelet-rich plasma in the treatment of anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xiaofei Li", "abstract_en": "**Objective:** To analyse the safety and effectiveness of platelet-rich plasma (PRP) in anal fistula patients.\n\n**Methods:** Online databases including PubMed, Embase, Cochrane Library, and Web of Science were searched from inception to December 5, 2022, for eligible studies about evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. Literature search, screening, data extraction, and quality assessment were carried out by two independent investigators. The overall cure rate, the complete cure rate, the recurrence rate, and the adverse event rate with their 95% confidence intervals (95% CI) were the primary calculation indexes. Subgroup analyses were conducted primarily according to whether PRP was combined with other treatments. Softwares of MedCalc 18.2 and Review Manager 5.3 were used for meta-analysis.\n\n**Results:** A total of 14 studies with 514 patients were included in the meta-analysis. The overall cure rate of 14 studies was 72.11% (95% CI 0.64-0.79). The cure rate of PRP alone was 62.39% (95% CI 0.55-0.69). The combined cure rate of PRP with other treatments was 83.12% (95% CI 0.77-0.88). The cure rate of interventions involving PRP were superior to the cure rate of surgery methods without using PRP significantly in the 4 randomized controlled studies (RR = 1.30, 95% CI 1.10-1.54, p = 0.002). The complete cure rate of the 8 studies was 66.37% (95% CI 0.52-0.79). The recurrence rate of the 12 studies was 14.84% (95% CI 0.08-0.24). The adverse event rate of the 12 studies was 6.31% (95% CI 0.02-0.12).\n\n**Conclusion:** PRP showed favorable safety and effectiveness in the treatment of anal fistula, especially combined with other treatment procedures.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Adverse events, Anal fistula, Cure rate, Meta-analysis, PRP, Recurrence rate", "link": "https://pubmed.ncbi.nlm.nih.gov/36905475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Level of evidence：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36847868", "title_en": "Conservative surgery versus colorectal resection for endometriosis with rectal involvement: a systematic review and meta-analysis of surgical and long-term outcomes", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Cillian Clancy", "abstract_en": "**Purpose:** The optimal surgical approach for removal of colorectal endometrial deposits is unclear. Shaving and discoid excision of colorectal deposits allow organ preservation but risk recurrence with associated functional issues and re-operation. Formal resection risks potential higher complications but may be associated with lower recurrence rates. This meta-analysis compares peri-operative and long-term outcomes between conservative surgery (shaving and disc excision) versus formal colorectal resection.\n\n**Methods:** The study was registered with PROSPERO. A systematic search was performed on PubMed and EMBASE databases. All comparative studies examining surgical outcomes in patients that underwent conservative surgery versus colorectal resection for rectal endometrial deposits were included. The two main groups (conservative versus resection) were compared in three main blocks of variables including group comparability, operative outcomes and long-term outcomes.\n\n**Results:** Seventeen studies including 2861 patients were analysed with patients subdivided by procedure: colorectal resection (n = 1389), shaving (n = 703) and discoid excision (n = 742). When formal colorectal resection was compared to conservative surgery there was lower risk of recurrence (p = 0.002), comparable functional outcomes (minor LARS, p = 0.30, major LARS, p = 0.54), similar rates of postoperative leaks (p = 0.22), pelvic abscesses (p = 0.18) and rectovaginal fistula (p = 0.92). On subgroup analysis, shaving had the highest recurrence rate (p = 0.0007), however a lower rate of stoma formation (p < 0.00001) and rectal stenosis (p = 0.01). Discoid excision and formal resection were comparable.\n\n**Conclusion:** Colorectal resection has a significantly lower recurrence rate compared to shaving. There is no difference in complications or functional outcomes between discoid excision and formal resection and both have similar recurrence rates.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 对包括 2861 名患者的 17 项研究进行了分析，患者按手术细分为：结直肠切除术 (n = 1389)、剃须术 (n = 703) 和盘状切除术 (n = 742)。当正式结直肠切除术与保守手术相比时，复发风险较低（p = 0.002），功能结果相当（轻微 LARS，p = 0.30，严重 LARS，p = 0.54），术后漏尿率相似（p = 0.22），盆腔脓肿（p = 0.18）和直肠阴道瘘 (p = 0.92)。在亚组分析中，剃毛的复发率最高（p = 0.0007），但造口形成率（p < 0.00001）和直肠狭窄率较低（p = 0.01）。盘状切除和正式切除具有可比性。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Colorectal surgery, Endometriosis, Meta-analysis, Surgery, Surgery outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/36847868/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 27 Feb 2023"}, {"id": "36740680", "title_en": "Surgical management of complex perianal fistula revisited in a systematic review: a critical view of available scientific evidence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "F de la Portilla", "abstract_en": "**Background:** Treating complex perianal fistulas in Crohn's disease patients remains a challenge. Classical surgical treatments for Crohn's disease fistulas have been extrapolated from cryptoglandular fistulas treatment, which have different etiology, and this might interfere with its effectiveness, in addition, they increase fecal incontinence risk. Recently, new surgical techniques with support from biological approaches, like stem cells, have been developed to preserve the function of the sphincter. We have performed a systematic literature review to compare the results of these different techniques in the treatment of Crohn's or Cryptoglandular fistula.\n\n**Methods:** PubMed, EMBASE, Database of Abstracts of Reviews of Effectiveness, Cochrane Central Register of Controlled Trials were searched systematically for relevant articles. We included randomized controlled trials and observational studies that referred to humans, were written in English, included adults 18+ years old, and were published during the 10-year period from 2/01/2010 to 2/29/2020. Evidence level was assigned as designated by the Scottish Intercollegiate Guidelines Network.\n\n**Results:** Of the 577 citations screened, a total of 79 were ultimately included in our review. In Crohn's disease patients, classical techniques such as primarily seton, Ligation of Intersphincteric Fistula Tracks, or lay open, healing rates were approximately 50-60%, while in cryptoglandular fistula were around, 70-80% for setons or flaps. In Crohn's disease patients, new surgical techniques using derivatives of adipose tissue reported healing rates exceeding 70%, stem cells-treated patients achieved higher combined remission versus controls (56.3% vs 38.6%, p = 0.010), mesenchymal cells reported a healing rate of 80% at week 12. In patients with cryptoglandular fistulas, a healing rate of 70% using derivatives of adipose tissue or platelets was achieved, and a healing rate of 80% was achieved using laser technology. Fecal incontinence was improved after the use of autologous platelet growth factors and Nitinol Clips.\n\n**Conclusion:** New surgical techniques showed better healing rates in Crohn's disease patients than classical techniques, which have better results in cryptoglandular fistula than in Crohn's disease. Healing rates for complex cryptoglandular fistulas were similar between the classic and new techniques, being the new techniques less invasive; the incontinence rate improved with the current techniques.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complex perianal fistula, Crohn’s disease, Cryptoglandular fistula, Surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/36740680/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sun, 05 Feb 2023"}, {"id": "36735766", "title_en": "Gracilis Muscle Interposition for the Treatment of Rectovaginal Fistula: A Systematic Review and Pooled Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Tracy L Hull", "abstract_en": "**Background:** A rectovaginal fistula is a debilitating condition that often severely impacts quality of life. Despite many treatment options available, the best surgical treatment is far from being established, and many patients will undergo several procedures before fistula closure is achieved. Gracilis muscle interposition, which is the transposition of the gracilis muscle into the rectovaginal septum, is an option for complex and persistent fistulas, but literature on the subject is scarce, mainly consisting of small case series.\n\n**Objective:** This study aimed to assess the success rate of gracilis muscle interposition for the surgical treatment of rectovaginal fistula.\n\n**Data Sources:** MEDLINE, Embase, Cochrane Library, and Web of Science.\n\n**Study Selection:** Studies comprising at least 5 patients who underwent gracilis muscle interposition for rectovaginal fistula were included. No date or language restrictions was applied.\n\n**Intervention:** Gracilis muscle interposition.\n\n**Main Outcome Measures:** The primary outcome is the fistula closure rate (%). Other domains analyzed are stoma closure rate, postoperative complications, quality of life, fecal continence, and sexual function.\n\n**Results:** Twenty studies were included for a total of 384 patients. The pooled fistula closure rate for gracilis muscle interposition was 64% (95% CI, 53%-74%; range, 33%-100%). Risk factors for failure were smoking, underlying Crohn's disease, and more than 2 previous repairs, whereas stoma formation was associated with improved outcomes. Postoperative complications ranged from 0% to 37%, mostly related to surgical site occurrences at the harvest site and perineal area. No deaths occurred. Gracilis muscle interposition improved quality of life and fecal continence, but impairment of sexual function was common.\n\n**Limitations:** Most of the included studies were small case series.\n\n**Conclusions:** Gracilis muscle interposition is a safe and moderately effective treatment that could be taken into consideration as second- or third-line therapy for recurrent rectovaginal fistula.\n\n**Registration No:** CRD42022319621.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study selection：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Intervention：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Main outcome measures：** 主要结果是瘘管闭合率（%）。其他分析领域包括造口闭合率、术后并发症、生活质量、大便失禁和性功能。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Limitations：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration no：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/36735766/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 03 Feb 2023"}, {"id": "36658773", "title_en": "Autologous fat graft injections for the treatment of perianal fistulas in Crohn's disease: a systematic review and single-arm meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "SVHM IBD Collaborative Group", "abstract_en": "**Background:** Crohn's perianal fistulas are often refractory to standard management. Fat graft injections are hypothesised to improve fistula healing rates. We evaluated the treatment efficacy of fat graft injections for Crohn's perianal fistulas in a systematic review (PRISMA).\n\n**Methods:** We completed database searches of MEDLINE (Ovid), Embase, and PubMed. All studies published in English in full text or abstract, from January 2001 to August 2021, evaluating fat graft injections for Crohn's perianal fistulas were selected. Included randomized controlled trials, single-arm intervention trials, cohort studies, and case series; excluded single case reports. Primary outcome was pooled clinical healing, defined as non-draining treated fistulas, or closure, defined as closure of treated fistulas. Secondary outcomes were clinical healing, clinical closure, radiologic response, and adverse events.\n\n**Results:** Of 1258 publications identified, 891 articles were assessed for eligibility, and 107 relevant for manuscript review. Forty-nine patients received fat graft injections for Crohn's perianal fistulas across four single-arm intervention trials. Clinical healing or closure was achieved in 74% in a pooled single-arm meta-analysis (95% confidence interval: 57%, 85%), with moderate heterogeneity between studies. Clinical healing was achieved in 20% and 60% at 3 and 12 months, respectively. Clinical closure was achieved in 83% at 6 months. Variable parameters were used to define radiologic response, with success rates from 20% to 67%. Minimal adverse events were reported.\n\n**Conclusion:** Fat graft injections show promise as a novel treatment for Crohn's perianal fistulas in this systematic review and meta-analysis. Assessment in controlled matched studies is warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn's disease, fat graft, metaanalysis, perianal fistula, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/36658773/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 20 Jan 2023"}, {"id": "36474515", "title_en": "Postoperative complications of colectomy and J-pouch with ileostomy versus without ileostomy in children with inflammatory bowel diseases: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ahmed Nasr", "abstract_en": "**Background:** The efficacy of performing a restorative proctocolectomy and J-pouch ileoanal anastomosis without diverting ileostomy in children with inflammatory bowel disease has been a longstanding debate. A systematic review and meta-analysis is presented comparing the occurrence of postoperative complications in children who underwent either the pouch-anal anastomosis (IPAA) with ileostomy (diverted) versus the undiverted procedure.\n\n**Methods:** Records were sourced from CINAHL, CENTRAL, EMBASE and MEDLINE databases. Studies followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines and compared postoperative complications in pediatric patients diagnosed with inflammatory diseases aged less than 18 years who underwent J-pouch with ileostomy versus without ileostomy. The primary outcome was the occurrence of postoperative leaks, and the secondary outcomes were presence of postoperative small bowel obstruction (SBO), pouchitis, stricture and fistula complications. A random-effects meta-analysis was used.\n\n**Results:** Twenty-three observational studies in the systematic review were included with 658 patients (83% diverted, 17% undiverted). Pooled estimates showed no difference in occurrence of leaks in children who underwent J-pouch/IPAA with ileostomy versus without (odds ratio (OR) 0.54, 95% confidence interval (CI) 0.17 to 1.64, I<sup>2</sup>=16%). There was no difference in the occurrence of SBO, pouchitis or strictures in children who underwent J-pouch/IPAA with ileostomy versus without (SBO: OR 2.27, 95% CI 0.52 to 9.92, I<sup>2</sup>=0%, pouchitis: OR 1.76, 95% CI 0.95 to 3.24, I<sup>2</sup>=0%, strictures: OR 2.72, 95% CI 0.44 to 16.69, I<sup>2</sup>=66%).\n\n**Conclusion:** The meta-analysis did not find differences in the occurrence of complications in pediatric patients who underwent the IPAA with ileostomy procedure versus without ileostomy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adolescent health, education, evidence-based medicine, medical, statistics", "link": "https://pubmed.ncbi.nlm.nih.gov/36474515/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 07 Dec 2022"}, {"id": "36413086", "title_en": "Gracilis muscle interposition for complex perineal fistulas: A systematic review and meta-analysis of the literature", "title_zh": "股薄肌介入治疗复杂会阴瘘：文献的系统回顾和荟萃分析", "authors": "Steven D Wexner", "abstract_en": "**Aim:** Complex perineal fistulas (CPFs) are among the most challenging problems in colorectal practice. Various procedures have been used to treat CPFs, with none being a panacea. Our study aimed to assess the overall success and complication rates after gracilis muscle interposition in patients with CPF.\n\n**Method:** PubMed, Scopus and Google Scholar databases were systematically searched until January 2022 according to PRISMA 2020 guidelines. Studies including children <18 years or <10 patients were excluded, as well as reviews, duplicate or animal studies, studies with poor documentation (no report of success rate) and non-English text. An open-source, cross-platform software for advanced meta-analysis openMeta [Analyst]™ version 12.11.14 and Cochrane Review Manager 5.4® were used to conduct the meta-analysis of data.\n\n**Results:** Twenty-five studies published between 2002 and 2021 were identified. The studies included 658 patients (409 women). Most patients had rectovaginal (50.7%) or rectourethral fistulas (33.7%). The most common causes of CPF were pelvic surgery (29.4%) and inflammatory bowel disease (25.2%). A history of radiotherapy was reported in approximately 18% of the patients. 498 (75.7%) patients with CPF achieved complete healing after gracilis muscle interposition. The weighted mean rate of success of the gracilis interposition procedure was 79.4% (95% CI 73.8%-85%, I<sup>2</sup>  = 75.3%), the weighted mean short-term complication rate was 25.7% (95% CI 18.1-33.2, I<sup>2</sup>  = 84.1%) and the weighted mean rate for 30-day reoperation was 3.6% (95% CI 1.6-5.6, I<sup>2</sup>  = 42%). The weighted mean rate of fistula recurrence was 16.7% (95% CI 11%-22.3%, I<sup>2</sup>  = 61%).\n\n**Conclusion:** The gracilis muscle interposition technique is a viable treatment option for CPF. Surgeons should be familiar with indications and techniques to offer it as an option for patients. Given the relatively infrequent use of the operation, referral rather than performance of graciloplasty is an acceptable option.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 确定了 2002 年至 2021 年间发表的 25 项研究。该研究包括 658 名患者（409 名女性）。大多数患者有直肠阴道瘘（50.7%）或直肠尿道瘘（33.7%）。 CPF 最常见的原因是盆腔手术（29.4%）和炎症性肠病（25.2%）。大约 18% 的患者报告有放射治疗史。 498 名（75.7%）CPF 患者在股薄肌介入治疗后实现完全愈合。股薄肌介入手术的加权平均成功率为 79.4%（95% CI 73.8%-85%，I<sup>2</sup> = 75.3%），加权平均短期并发症率为 25.7%（95% CI 18.1-33.2，I<sup>2</sup> = 84.1%），30 天再手术的加权平均率为 3.6%（95% CI 1.6-5.6，I<sup>2</sup> = 42%）。瘘管复发的加权平均率为 16.7%（95% CI 11%-22.3%，I<sup>2</sup> = 61%）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal, complex perineal, fistula, gracilis, gracilis muscle interposition, graciloplasty, rectourethral, rectovaginal", "link": "https://pubmed.ncbi.nlm.nih.gov/36413086/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 22 Nov 2022"}, {"id": "36294834", "title_en": "Negative Pressure Wound Therapy for the Treatment of Fournier's Gangrene: A Rare Case with Rectal Fistula and Systematic Review of the Literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Stefania Cimbanassi", "abstract_en": "Fournier's gangrene (FG) is a Necrotizing Soft Tissue Infection (NSTI) of the perineal region characterized by high morbidity and mortality even if appropriately treated. The main treatment strategies are surgical debridement, broad-spectrum antibiotics, hyperbaric oxygen therapy, NPWT (Negative Pressure Wound Therapy), and plastic surgery reconstruction. We present the case of a 50-year-old woman with an NSTI of the abdomen, pelvis, and perineal region associated with a rectal fistula referred to our department. After surgical debridement and a diverting blow-out colostomy, an NPWT system composed of two sponges connected by a bridge through a rectal fistula was performed. Our target was to obtain healing in a lateral-to-medial direction instead of depth-to-surface to prevent the enlargement of the rectal fistula, promoting granulation tissue growth towards the rectum. This eso-endo-NPWT technique allowed for the primary suture of the perineal wounds bilaterally, simultaneously treating the rectal fistula and the perineum lesions. A systematic review of the literature underlines the spreading of NPWT and its effects.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Fournier’s gangrene, Negative Pressure Wound Therapy (NPWT), case report, hyperbaric oxygen therapy, rectal fistula, surgical technique", "link": "https://pubmed.ncbi.nlm.nih.gov/36294834/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 27 Oct 2022"}, {"id": "36271904", "title_en": "Placebo Response Rates in Randomized Controlled Trials for Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** Perianal fistulizing disease is a common complication of Crohn's disease [CD], for which new therapies are urgently needed. To assist the design of clinical trials for novel therapeutics, we conducted a systematic review and meta-analysis of randomised controlled trials [RCTs] to quantify placebo rates and identify factors influencing them in perianal CD [pCD].\n\n**Methods:** We searched MEDLINE, Embase and CENTRAL from inception to June 2021. Eligible studies were placebo-controlled trials of pharmacological interventions for pCD. Placebo fistula response and remission rates for induction and maintenance trials were extracted and pooled using a random-effects model. Mixed-effects meta-regression was used to evaluate the impact of patient and study-level characteristics on point estimates.\n\n**Results:** In 17 RCTs [13 induction, five maintenance] the pooled placebo fistula response and remission rate for induction trials was 25% (95% confidence interval [CI] 17-36%) and 17% [95% CI 11-25%], respectively. For maintenance trials, the pooled placebo fistula response and remission rate was 23% [95% CI 17-32%] and 19% [95% CI 14-25%], respectively. Trials enrolling patients with less disease activity and a higher proportion with ileal predominant disease were associated with significantly higher placebo response rates. Trials originating in Europe [compared to North America], therapies requiring perianal injection and a longer timepoint to measure remission were associated with higher placebo remission rates.\n\n**Conclusions:** Placebo response and remission rates in pCD trials are influenced by patient and disease-related factors, as well as the type of intervention being studied. These contemporary rates will inform trial design for novel therapeutics.", "abstrac
