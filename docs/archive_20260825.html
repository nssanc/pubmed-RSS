range 62-98). The most frequent complications were vesicovaginal fistula (25%, <i>n</i> = 9/36), rectovaginal fistula (19%, <i>n</i> = 7/36), vaginal impaction (11%, <i>n</i> = 4/36) and vaginal evisceration of small bowel through vaginal vault (8%, <i>n</i> = 3/36). In the vesicovaginal fistula cohort, none of the patients had a history of radiation, and two had histories of total abdominal hysterectomy (22%). In the rectovaginal fistula cohort, one patient had a history of pelvic radiation for rectal squamous cell carcinoma, and another had a history of chronic steroid use for rheumatoid arthritis. No other risk factors were reported in the other groups. Ring and Gellhorn were the most represented pessary types among the studies, 16 (44%) and 12 (33%), respectively. No complications were reported with surgical and non-surgical treatment of the complications.\n\n**Conclusion:** Pessaries are a reasonable and durable treatment for POP with exceedingly rare reports of severe adverse complications. The ideal candidate for pessary should have a good self-care index. Studies to determine causative factors of the more serious adverse events are needed; however, this may be difficult given the long follow-up that is required.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们使用“脱垂”、“压力性尿失禁”和“子宫托或子宫托或子宫托”等搜索术语在 PubMed、Embase 和 CINAHL 上进行了系统的文献综述。共鉴定出36篇文章。从病例报告中提取患者层面的数据，以进一步描述个体层面的并发症。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "adverse effects, fistula, incontinence, pessary, prolapse, rare complications", "link": "https://pubmed.ncbi.nlm.nih.gov/36267197/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 21 Oct 2022"}, {"id": "36176822", "title_en": "A Comparison of Different Surgical Treatments for Complex Anal Fistula: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Pousette Hamid", "abstract_en": "Fistula-in-ano is a common proctological condition that primarily affects younger people and leads to chronic morbidity. An anal fistula is divided into simple and complex fistulas. A complex fistula is a challenging problem due to higher recurrence rates and incontinence associated with surgery. Many new methods have been developed for the closure of complex fistula-in-ano, but there is no single best method. The aim of this study is to identify a superior surgical technique for treating complex/high cryptoglandular perianal fistulas (HCPFs). A literature search was done using PubMed and Google Scholar for the period of 2012-2021. Articles that contain surgical treatment for complex anal fistula in the English language published in the last 10 years were included. The types of studies included were randomized controlled trials (RCTs), meta-analyses, systematic reviews, cohort studies, and traditional reviews. Articles excluded were those done more than 10 years ago, in other languages, and containing simple fistula management only. Nine studies were included in the review; a systematic review and meta-analysis concluded that no single method is effective. The ligation of the intersphincteric fistula tract (LIFT) procedure seems to be a promising and effective technique as it has a low rate of fecal incontinence as compared to other methods. Biological techniques give variable success rates so does fistula plug (FP). Mucosal advancement flap (MAF) and rerouting seton give good results according to one study. Fistula plug gives variable results and is not a preferred method. Ligation of the intersphincteric fistula tract (LIFT) seems to be a promising new technique for complex anal fistulas, but the data available is not enough to determine the best method. More randomized trials are required to compare traditional techniques and emerging new biological methods to see the best technique available.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "引流挂线、直肠内推进皮瓣、大便失禁、高位隐腺肛周瘘、直肠瘘", "keywords_en": "draining seton, endorectal advancement flap, fecal incontinence, high cryptoglandular perianal fistula, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/36176822/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 30 Sep 2022"}], "痔疮": [{"id": "42594997", "title_en": "Comparison of the outcomes of ileal pouch-anal anastomosis and ileorectal anastomosis for patients with familial adenomatous polyposis: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ka-Wai Tam", "abstract_en": "**Background:** Familial adenomatous polyposis (FAP) is an inherited colorectal cancer syndrome for which ileorectal anastomosis (IRA) preserves the rectum but ileal pouch-anal anastomosis (IPAA) removes it. These procedures may influence the risk of desmoid tumors and involve trade-offs in oncologic protection and bowel function. This study compared the oncologic, desmoid, functional, and postoperative outcomes of IRA and IPAA in FAP.\n\n**Methods:** PubMed, Embase, Scopus, and the Cochrane Library were searched for relevant studies. Primary outcomes were rectal or pouch-anal cancer and desmoid tumors. Risk of bias was assessed using the ROBINS-I tool, and certainty of evidence was assessed using the GRADE framework. Random-effects meta-analyses were conducted using pooled risk ratios (RRs), mean differences (MDs), and hazard ratios.\n\n**Results:** Thirty-four studies involving 4,700 patients were included. Compared with IRA, IPAA was associated with lower risks of postoperative rectal and pouch-anal cancer (RR: 0.22, 95% CI: 0.09-0.54) but with a higher risk of desmoid tumors (RR: 1.58, 95% CI: 1.13-2.19). IPAA was associated with higher 24-hour incontinence (RR: 1.90, 95% CI: 1.24-2.92) and 24-hour stool frequency (MD: 1.89 stools/day, 95% CI: 1.29-2.49). Anastomotic stricture was more frequent after IPAA (RR: 2.91, 95% CI: 1.46-5.78), but major complications did not differ substantially between the procedures.\n\n**Conclusions:** IPAA is associated with greater long-term oncologic protection but worse bowel function and a higher desmoid tumor risk compared with IRA. These findings support individualized procedure selection based on surveillance feasibility to balance functional trade-offs, perioperative risk, and durability.", "abstract_zh": "**背景：** 家族性腺瘤性息肉病 (FAP) 是一种遗传性结直肠癌综合征，回肠直肠吻合术 (IRA) 保留直肠，但回肠贮袋肛门吻合术 (IPAA) 将其切除。这些手术可能会影响硬纤维瘤的风险，并涉及肿瘤保护和肠道功能的权衡。本研究比较了 FAP 中 IRA 和 IPAA 的肿瘤学、硬纤维瘤、功能和术后结果。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 与 IRA 相比，IPAA 具有更强的长期肿瘤保护作用，但肠功能更差，且硬纤维瘤风险更高。这些发现支持基于监测可行性的个体化手术选择，以平衡功能权衡、围手术期风险和耐久性。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "desmoid tumor, familial adenomatous polyposis, ileal pouch–anal anastomosis, ileorectal anastomosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42594997/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 13 Aug 2026"}, {"id": "42534720", "title_en": "A Systematic Review of Post-surgical Adverse Events Related to Hem-O-Lok Clips: A Commonly Used Device With Potential Complications", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Palanivelraju Gopalakrishnan", "abstract_en": "Since their introduction, Hem-o-lok clips (HOLCs) have become widely accepted and increasingly reliable devices among surgeons performing minimally invasive surgery due to their effectiveness in achieving vascular pedicle control and haemostasis. Although HOLCs are generally regarded as safe devices, various complications have been reported. This review aimed to identify and summarise complications occurring at any time following HOLC use, from their initial introduction in January 1999 through December 2025. This literature review was conducted in accordance with the PRISMA (Preferred Reporting Items for Systematic Reviews and Meta-Analyses) guidelines. A systematic search of PubMed (MEDLINE®), Google Scholar™, ResearchGate, and Embase® was performed using predefined search strings and Boolean operators to identify English-language articles reporting complications associated with HOLC use. The most frequently reported postoperative complications associated with HOLCs occurred after prostatectomy, accounting for 66.23% (n = 51) of all reported cases. The second most common postoperative complication was associated with laparoscopic cholecystectomy, representing 14.28% (n = 11) of cases. The most common complication was clip migration to the urinary bladder with stone formation, accounting for 45.45% (n = 35), followed by urinary bladder neck contracture (14.29%; n = 11), clip migration to the ureter and erosion into the collecting system (14.29%; n = 11), erosion into the duodenum/resulting in duodenal ulcer formation (10.39%; n = 8), and common bile duct (CBD) obstruction (including Mirizzi syndrome or CBD stones) (3.89%; n = 3). Other less frequently reported complications, comprising 11.69% (n = 9), included clip migration to the urinary bladder without stone formation, clip migration to the rectum, erosion into the small intestine, transmural migration to the oesophagus, and anastomotic leak following prostatectomy. Although HOLCs are generally considered safe devices, rare but clinically significant complications have been reported. A high index of clinical suspicion is essential for the early recognition and diagnosis of these complications. The management of HOLC-related complications varies according to the site and nature of the complication but most commonly involves endoscopic retrieval. Conservative management may be appropriate in selected asymptomatic patients.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "腐蚀的卷边锁夹、卷边锁夹、卷边锁夹并发症、迁移卷边锁夹、穿孔卷边锁夹", "keywords_en": "eroded hem-o-lock clips, hem-o-lock clips, hem-o-lock clips complication, migrating hem-o-lock clips, perforatinghem-o-lock clip", "link": "https://pubmed.ncbi.nlm.nih.gov/42534720/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 31 Jul 2026"}, {"id": "42503488", "title_en": "Laser Hemorrhoidoplasty versus Excisional Hemorrhoidectomy: The Recovery-Durability Tradeoff in Hemorrhoid Surgery-A Systematic Review of Randomized Trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fernanda Bellotti Formiga", "abstract_en": "BackgroundExcisional hemorrhoidectomy remains the standard for advanced disease, while the applicability of laser hemorrhoidoplasty remains uncertain. This study evaluates the tradeoff between short-term recovery and long-term durability to inform patient-centered decision-making.MethodsA systematic search of PubMed, Web of Science, Scopus, and CENTRAL was conducted through September 2025. Randomized controlled trials (RCTs) comparing diode laser hemorrhoidoplasty with conventional hemorrhoidectomy were included. Pooled risk ratios (RR) and mean differences (MD) with 95% confidence intervals were estimated using random-effects models. Heterogeneity was assessed with the I<sup>2</sup> statistic, and trial sequential analysis (TSA) was performed to explore the robustness of selected outcomes.ResultsFifteen RCTs involving 1099 patients were included. Laser hemorrhoidoplasty was associated with reduced postoperative pain on day 1 (MD -2.02; 95% CI -2.83 to -1.20) and day 7 (MD -2.13; 95% CI -3.06 to -1.20), shorter duration of analgesic use (MD -2.72 days), operative time (MD -12.49 min), intraoperative blood loss (MD -21.63 mL), hospital stay (MD -0.63 days), and earlier return to daily activities (MD -10.78 days). It was also associated with lower rates of postoperative bleeding (RR 0.35), urinary retention (RR 0.29), and anal stenosis (RR 0.12). TSA suggested that some short-term findings may be robust; however, several outcomes remained underpowered, and limited follow-up restricts the interpretation of long-term outcomes.ConclusionLaser hemorrhoidoplasty offers improved short-term recovery but with uncertain long-term durability. Given the low to very low certainty of the evidence and limited follow-up, these findings support a preference-sensitive approach rather than replacing excisional hemorrhoidectomy.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ferguson technique, Milligan-Morgan, diode laser, hemorrhoidectomy, hemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/42503488/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sun, 26 Jul 2026"}, {"id": "42489929", "title_en": "Rethinking congenital anal stenosis: a systematic review with histological observations toward a revised conceptual framework", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Go Miyano", "abstract_en": "The concept of congenital anal stenosis remains poorly defined, encompassing anatomically distinct conditions that may differ in pathogenesis and management. This study aimed to re-evaluate the current concept of congenital anal stenosis through a systematic review and histological examination of representative cases. We conducted a systematic review of English-language publications to assess clinical characteristics, treatment methods, and outcomes in patients diagnosed with congenital anal stenosis. In addition, we performed histological analysis of surgical specimens obtained from two representative surgical cases. Among 28 identified studies involving 70 cases, 50 cases without Currarino syndrome responded well to bougie dilatation or minor anoplasty. In contrast, 20 cases (28.6%) associated with Currarino syndrome showed poor response to conservative treatment and frequently required treatment of associated presacral lesions or more invasive procedures. Histopathological analysis of two representative surgical cases revealed dense fibrosis located between the dentate line and the anal verge, supporting the possibility that anal membranous stenosis can occur as a distinct skin-level lesion. Our findings support reconsidering the terminology of congenital anal stenosis and suggest that congenital skin-level anal stenosis should be distinguished from anorectal stenosis. Further anatomical and histopathological studies are needed to validate this framework.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal membranous stenosis, Anorectal stenosis, Congenital anal stenosis, Currarino syndrome, Heineke–Mikulicz anoplasty, Skin-level anal stenosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42489929/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 23 Jul 2026"}, {"id": "42470776", "title_en": "Assessment of the risk of developing second tumors after pediatric craniospinal irradiation", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ana Cravo Sá", "abstract_en": "**Introduction/Background:** Pediatric craniospinal irradiation is associated with a potential long-term risk of radiation-induced second malignancies because of the greater radiosensitivity and life expectancy of pediatric patients. This study aimed to estimate the incidence and mortality risk of second tumors after pediatric craniospinal radiotherapy, comparing Three-Dimensional Conformal Radiotherapy (3DCRT) and Volumetric Modulated Arc Therapy (VMAT).\n\n**Methods:** A structured literature review with systematic search and study selection was conducted following Preferred Reporting Items for Systematic and Meta-Analyses Search (PRISMA-S) principles to identify published dosimetric studies on pediatric craniospinal irradiation. Mean absorbed dose values for organs at risk were extracted from the included studies and used to estimate lifetime attributable risk (LAR) of cancer incidence and mortality based on the Biological Effects of Ionizing Radiation VII (BEIR VII) report, according to organ, sex, and age at exposure. Deterministic sensitivity analyses were performed using the original and redistributed BEIR VII coefficients for the residual category \"other cancers,\" as well as dose variability scenarios based on D<sub>mean</sub> - SD, D<sub>mean</sub>, and D<sub>mean</sub> + SD.\n\n**Results:** Two studies were included in the final review. VMAT was associated with lower mean absorbed doses for the thyroid, esophagus, heart, liver, lungs, pancreas, bladder, rectum, and eyes, whereas 3DCRT showed lower absorbed doses for the kidneys, intestine, gonads, breast, and lenses. For both techniques, the thyroid, lungs, esophagus, and breast showed the highest estimated incidence and mortality risks, whereas the lowest risks were generally observed for the gonads, rectum, bladder, and kidneys. Estimated risk decreased with increasing age at exposure and was generally higher in females. Sensitivity analyses showed that redistribution of the pooled BEIR VII \"other cancers\" coefficient substantially reduced absolute LAR values for residual-category organs without materially changing the overall comparative pattern between 3DCRT and VMAT.\n\n**Discussion:** These findings suggest that VMAT may reduce estimated long-term risk for several organs, although not uniformly across all organs at risk. The results should be interpreted as comparative model-based estimates, because they were derived from literature-based dose data and BEIR VII risk modelling rather than patient-specific dosimetry.\n\n**Conclusion:** This study provides a comparative and exploratory model-based assessment of second cancer risk after pediatric craniospinal radiotherapy. The findings support the importance of treatment technique selection in pediatric radiotherapy, while indicating that future studies should incorporate individualized treatment planning data and, when feasible, Monte Carlo-based dose reconstruction to improve the precision of absolute risk estimates.\n\n**Plain Language Summary:** Radiation treatment in children can sometimes increase the risk of developing a second cancer later in life. This study reviewed published research and used dose data to estimate longterm cancer risks from two different radiation therapy techniques used for treating the brain and spine in children. This study found that one technique often gave lower doses to several organs, while the other gave lower doses to some different areas, and risk varied by organ, age, and sex. This matters because understanding these differences can help clinicians choose treatment approaches that may reduce longterm risks for children.", "abstract_zh": "**Introduction/background：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 这项研究提供了基于比较和探索性模型的儿科颅脊髓放射治疗后第二次癌症风险的评估。研究结果支持了儿科放射治疗中治疗技术选择的重要性，同时表明未来的研究应纳入个体化治疗计划数据，并在可行时采用基于蒙特卡罗的剂量重建，以提高绝对风险估计的精度。\n\n**Plain language summary：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Craniospinal irradiation, Pediatrics, Radiotherapy, conformal, Risk assessment, Second primary neoplasms, Volumetric modulated arc therapy", "link": "https://pubmed.ncbi.nlm.nih.gov/42470776/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sat, 18 Jul 2026"}, {"id": "42455200", "title_en": "Single-stage versus staged reconstruction for high and intermediate anorectal malformations in neonates: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Chieu Minh Vuong", "abstract_en": "The surgical approach to high and intermediate anorectal malformations remains controversial. This systematic review compared continence and infection outcomes between the two approaches. MEDLINE, Embase, and Cochrane CENTRAL were searched per a registered protocol (PROSPERO CRD420261291319). Comparative studies of single-stage versus staged repair in neonates with high or intermediate anorectal malformations were included. Risk of bias was assessed using ROBINS-I. Random-effects meta-analysis with prediction intervals was performed. Four comparative studies (746 patients: 399 single-stage, 347 staged) were included. Pooled analysis showed no significant difference in incontinence outcomes (RR 0.93, 95% CI: 0.52-1.66, p = 0.80; 95% prediction interval: 0.28-3.08) with substantial heterogeneity (I²=83%). Infection data could not be pooled due to methodological concerns in outcome reporting. All included studies demonstrated moderate to serious risk of bias. GRADE certainty was LOW for incontinence and VERY LOW for infection. Current evidence does not demonstrate superiority of either approach for bowel continence (LOW certainty). Infection evidence was insufficient for synthesis (VERY LOW). Wide prediction intervals indicate substantial uncertainty; available data cannot confirm or refute inferior outcomes after single-stage repair. Prospective studies with standardized outcomes are needed. Protocol registration: PROSPERO CRD420261291319.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformations, Fecal incontinence, Meta-analysis, Neonatal surgery, Posterior sagittal anorectoplasty, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/42455200/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42449595", "title_en": "Macrophage Polarization as a Target for Colorectal Cancer Treatment Optimization: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Susan Galandiuk", "abstract_en": "<b>Background:</b> Colorectal cancer (CRC) remains a leading cause of cancer-related mortality worldwide, with poor survival rates of late-stage disease. While immune checkpoint blockade (ICB) therapy has transformed treatment for mismatch repair-deficient (MMRd)/microsatellite instability-high (MSI-H) tumors, most CRC cases are mismatch repair-proficient (MMRp)/microsatellite-stable (MSS) and derive little to no benefit from current immunotherapy regimens. Tumor-associated macrophages (TAMs) constitute a significant component of the tumor microenvironment (TME) and exhibit a phenotypic gradient between pro-inflammatory (M1-like) and anti-inflammatory, immunosuppressive (M2-like) states. Although their polarization status is increasingly recognized as a key modulator of immunotherapy efficacy in CRC, a comprehensive synthesis of the literature regarding macrophage polarization and its relevance to improving CRC immunotherapy remains lacking. <b>Methods:</b> A systematic literature search was conducted across PubMed, EMBASE, and ScienceDirect from inception to December 2025 using terms encompassing macrophages, immunotherapy, immune checkpoint expression, colorectal cancer, and microsatellite stability status. Title, abstract, and full-text screening were performed independently by multiple authors. Sixty-five studies were included following PRISMA guidelines. The protocol was prospectively registered on PROSPERO (ID: CRD420251244320). <b>Results:</b> Three key themes were identified: (1) macrophage-mediated mechanisms of resistance to ICB, including M2 polarization driven by the PI3Kγ, STAT3, mTOR, and SIRT-1 axes, immunosuppressive cytokine production (IL-10, TGF-β), and altered immune checkpoint ligand expression; (2) macrophage polarization status and associated biomarkers as prognostic indicators of therapeutic response; (3) emerging macrophage-targeted therapeutic strategies in ongoing clinical trials, including CSF1R inhibitors, CD40 agonists, CD47/SIRPα blockade, and STING agonists. <b>Conclusions:</b> TAM polarization is a critical determinant of immunotherapy resistance and patient prognosis in CRC. Macrophage-targeted strategies, particularly M2-to-M1 repolarization approaches used in combination with existing ICB regimens, represent a promising avenue for expanding immunotherapy efficacy beyond MSI-H disease. Further translational research and randomized controlled trials are needed to validate these targets clinically.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, immunotherapy, macrophage polarization, microsatellite instability, tumor-associated macrophage", "link": "https://pubmed.ncbi.nlm.nih.gov/42449595/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42398078", "title_en": "Single-stapling versus double-stapling technique for rectal anastomosis-meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jim Tiernan", "abstract_en": "**Introduction:** The single-stapling technique (SST) is an alternative to the conventional double-stapling technique (DST), particularly in low rectal surgery. This systematic review and meta-analysis compared anastomotic leak (AL) between SST and DST.\n\n**Methods:** A systematic review of the PubMed/MEDLINE, Google Scholar®, and Scopus databases was conducted in accordance with PRISMA guidelines from inception through December 2025. The primary outcome of interest was AL. A random-effects meta-analysis was used to compare AL, blood loss, operative time, and length of hospital stay between SST and DST. Risk ratios (RRs) were calculated for dichotomous outcomes and mean differences or standardized mean differences were calculated for continuous outcomes. Sensitivity and subgroup analyses were conducted according to surgical approach. Risk of bias was assessed, and the certainty of the evidence for AL was evaluated using the GRADE framework.\n\n**Results:** Of 448 articles screened, 14 were included (2 randomized, 12 observational studies), comprising 1326 patients in the SST group and 1720 in the DST group. SST was associated with a significantly lower risk of AL than DST (RR 0.61; 95% confidence interval 0.42 to 0.90; P = 0.012), with moderate heterogeneity. Sensitivity analysis excluding studies with zero events yielded consistent results. Subgroup analyses showed no difference in AL for open intracorporeal SST compared with DST, a trend toward benefit with minimally invasive intracorporeal SST compared with DST, and a pronounced reduction in AL with transanal SST compared with DST.\n\n**Conclusions:** Although the causes of AL are multifactorial, with respect to the stapling technique, SST was associated with a lower risk of AL than DST, and this effect was primarily driven by transanal SST. However, the certainty of evidence is low, and ongoing prospective studies will better define the role of SST.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anastomotic leak, rectal cancer, transanal transection and single-stapled anastomosis (TTSS)", "link": "https://pubmed.ncbi.nlm.nih.gov/42398078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 03 Jul 2026"}, {"id": "42374341", "title_en": "Laser hemorrhoidoplasty versus LigaSure hemorrhoidectomy for grade II-IV hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Yousef El-Ayman", "abstract_en": "**Background:** Many surgical procedures have been developed to treat hemorrhoidal disease. Although conventional excisional techniques are effective, they are also associated with significant postoperative pain and longer recovery times. Consequently, newer techniques have been introduced to address these issues, including laser hemorrhoidoplasty (LHP) and LigaSure hemorrhoidectomy (LigH). This systematic review and meta-analysis aims to compare these two approaches in terms of perioperative outcomes and recurrence.\n\n**Methods:** A comprehensive search was conducted across PubMed, Scopus, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar, up to December 2025. We included all eligible studies involving adults with grade II-IV hemorrhoids. Primary outcomes included postoperative pain, time to return to routine activities, and recurrence. Secondary outcomes were operative time, length of hospital stay, and complications. The risk of bias was assessed using the RoB2 and ROBINS-I V2 tools. Meta-analyses were performed with a random-effects model. The certainty of evidence was evaluated using the GRADE approach.\n\n**Results:** Data from 461 patients (213 LHP, 248 LigH) across five studies were analyzed. Patients in the LHP group reported significantly lower pain scores on postoperative day 1 (MD: - 1.61 points; p = 0.025), earlier return to routine activities (MD: -5.75 days; p = 0.0002), shorter operative time (MD: -6.5 min; p = 0.002), and shorter hospital stay (MD: -0.3 days; p < 0.0001) compared to the LigH group. Conversely, LigH demonstrated a significantly lower risk of recurrence (RD: 0.12; 95% CI: [0.05, 0.19]). No significant differences were observed regarding postoperative bleeding, wound infection, urinary retention, or thrombosis.\n\n**Conclusion:** LHP yields better perioperative outcomes, including less pain and faster recovery, making it a favorable option for patient comfort. However, LigH has lower recurrence rates. The certainty of evidence is very low. Further high-quality randomized trials are needed to confirm these results.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, Laser Hemorrhoidoplasty, LigaSure, Meta-analysis, Systematic Review", "link": "https://pubmed.ncbi.nlm.nih.gov/42374341/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 29 Jun 2026"}, {"id": "42348182", "title_en": "Long-term impact of haemorrhoidal artery ligation on anal function and continence", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A Arif", "abstract_en": "**Aims:** Haemorrhoidal artery ligation (HALO) and variants including Doppler-guided HAL (DG-HAL), HAL with rectoanal repair (HAL-RAR), and transanal haemorrhoidal dearterialisation (THD) serve as minimally invasive alternatives to excisional haemorrhoidectomy, reducing pain while preserving sphincter function. Long-term faecal incontinence remains a concern due to its quality-of-life impact. This systematic review assessed prevalence, severity, and patterns of incontinence beyond six months post-procedure across HAL techniques.\n\n**Methods:** PRISMA 2020 guidelines directed searches of PROSPERO, MEDLINE, PubMed, Scopus, Cochrane Library, and ScienceDirect for 2015-2024 studies reporting continence >6 months after HAL-based procedures. Six studies (3 RCTs, 1 prospective, 2 retrospective cohorts; total n=671 patients) met PICOS criteria, with Wexner Incontinence Scores reported or retrospectively mapped. Quality appraisal used CASP Cohort Checklist.\n\n**Results:** Seventeen (2.5%) of 671 patients developed postoperative faecal incontinence. Of these, 14 (82%) cases were mild (Wexner 1-4) and transient, resolving within 3-6 months; 3 (18%) were moderate (Wexner 5-8), primarily in HAL-RAR (9/158 [5.7%]). Standard HAL showed 0/76 (0%) cases; THD had 1/104 (1.0%); DG-HAL had 7/293 (2.4%). No severe incontinence occurred.\n\n**Discussion:** HALO techniques demonstrate excellent long-term continence safety (overall 2.5% low-grade incontinence). HAL-RAR's higher risk (5.7%) warrants counselling. Standardised scoring and multicentre trials are recommended.", "abstract_zh": "**Aims：** 痔动脉结扎 (HALO) 和多普勒引导 HAL (DG-HAL)、HAL 直肠修复术 (HAL-RAR) 和经肛门痔动脉去动脉化 (THD) 等变体可作为痔切除术的微创替代方案，在保留括约肌功能的同时减轻疼痛。由于其对生活质量的影响，长期大便失禁仍然是一个令人担忧的问题。这项系统评价评估了 HAL 技术术后六个月后失禁的患病率、严重程度和模式。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42348182/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 25 Jun 2026"}, {"id": "42341213", "title_en": "Hospital and surgeon volume versus outcomes after colorectal cancer surgery: umbrella review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Francesco Giovinazzo", "abstract_en": "**Background:** An inverse relationship between surgical volume and outcomes has been suggested, with higher-volume hospitals and surgeons achieving better results, prompting debate over the centralization of surgical services. However, minimum volume thresholds are unclear, and volume is a poor proxy for quality. Despite the significant global burden of colorectal cancer, the benefits of high-volume care remain uncertain. This umbrella review synthesized the evidence on volume-outcome associations in colorectal surgery.\n\n**Methods:** An umbrella review (PRISMA 2020) was conducted to evaluate systematic reviews and meta-analyses of the hospital/surgeon volume-outcome relationship in colorectal cancer. The Cochrane Library, PubMed, Embase, and MEDLINE were searched to 1 October 2025. Volume definitions and outcomes were extracted and meta-analysed by subgroup. A MeaSurement Tool to Assess Systematic Reviews 2 and Risk of Bias in Systematic Reviews were used for analysis of bias.\n\n**Results:** A total of 150 unique records was identified, with 10 systematic reviews meeting the inclusion criteria. High- versus low-volume hospitals demonstrated an inverse relationship in terms of postoperative mortality following resection for rectal cancer (fixed- and random-effects models: odds ratio 0.73, 95 per cent confidence interval 0.64 to 0.82), colon cancer (fixed-effect model: odds ratio 0.74, 0.70 to 0.78; random-effects model: odds ratio 0.75, 0.69 to 0.81), and colorectal cancer (fixed- and random-effects models: odds ratio 0.77, 0.67 to 0.88). High- versus low-volume surgeons demonstrated an inverse relationship with respect to postoperative mortality following resection for rectal cancer (fixed- and random-effects models: odds ratio 0.69, 0.59 to 0.81), colon cancer (fixed-effect model: odds ratio 0.70, 0.63 to 0.77; random-effects model: odds ratio 0.68, 0.55 to 0.85), and colorectal cancer (fixed- and random-effects models: odds ratio 0.67, 0.60 to 0.74). There were no consistent significant differences in rates of the secondary outcomes (anastomotic leak rate, permanent stoma formation, local recurrence rate, rate of abdominoperineal excision of the rectum).\n\n**Conclusion:** High-volume hospitals and surgeons are associated with both improved short- and long-term outcomes for patients undergoing colorectal cancer surgery. However, a specific cut-off definition for high- versus low-volume hospitals and surgeons is yet to be elucidated owing to the heterogeneity of existing volume definitions. Future studies are required to confirm a threshold for this dose-response relationship.", "abstract_zh": "**背景：** 有人提出，手术量和结果之间存在反比关系，手术量越大的医院和外科医生取得的效果越好，引发了关于手术服务集中化的争论。然而，最小数量阈值尚不清楚，而且数量并不能很好地代表质量。尽管结直肠癌给全球带来了巨大的负担，但大量护理的好处仍然不确定。这篇总体综述综合了结直肠手术中体积与结果关联的证据。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "集中化、卫生服务研究、数量-结果关系", "keywords_en": "centralization, health services research, volume–outcome relationship", "link": "https://pubmed.ncbi.nlm.nih.gov/42341213/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 24 Jun 2026"}, {"id": "42330709", "title_en": "Systematic review and Bayesian network meta-analysis comparing multiple anastomotic techniques after total mesorectal excision in rectal cancer", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jacques Marescaux", "abstract_en": "**Background:** Although several studies have performed pairwise comparisons of individual anastomotic techniques after total mesorectal excision (TME) for rectal cancer, there is a lack of comprehensive analyses, which simultaneously evaluate multiple techniques. This study aims to perform a systematic review and Bayesian network meta-analysis to compare the various anastomotic methods used after TME.\n\n**Methods:** This systematic review and Bayesian network meta-analysis included both randomized controlled trials (RCTs) and non-RCTs which evaluated outcomes of various anastomotic techniques in patients with rectal cancer undergoing TME. The techniques assessed included immediate handsewn anastomosis, delayed Turnbull-Cutait anastomosis (TCA), double-stapling technique (DST), and transanal transection and single-stapled (TTSS) anastomosis. The primary outcome was the proportion of anastomotic leakage (AL). Secondary outcomes included overall postoperative morbidity and postoperative anorectal function.\n\n**Results:** A total of 13 studies were included, comprising two RCTs and 11 non-RCTs, with a combined total of 2710 patients. TTSS was associated with a lower proportion of AL as compared to both the DST group (RR: 0.43, 95% CrI: 0.21-0.87) and the immediate handsewn group (RR: 0.35, 95% CrI: 0.13-0.74). TCA was also associated with a significantly lower proportion of AL as compared to the immediate handsewn group (RR: 0.42, 95% CrI: 0.21-0.80). No statistically significant differences were observed between groups regarding overall postoperative morbidity or anorectal function.\n\n**Conclusions:** The findings of this study suggest that TTSS may be associated with a lower risk of postoperative AL after TME for rectal cancer; however, the certainty of evidence was low, and the findings should be interpreted with caution.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomosis, Proctocolectomy, Rectal neoplasms, Restorative, Surgical, Transanal transection and single-stapled anastomosis", "link": "https://pubmed.ncbi.nlm.nih.gov/42330709/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 22 Jun 2026"}, {"id": "42262727", "title_en": "Clinical significance of isolated periappendiceal red patch in ulcerative colitis: A systematic review, meta-analysis, and meta-regression", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Terrence A Barrett", "abstract_en": "**Objectives:** Ulcerative colitis (UC) is characterized by continuous mucosal inflammation beginning in the rectum with variable proximal extension. However, up to 17% of patients demonstrate patchy cecal inflammation known as a periappendiceal red patch (PARP). Although PARP has historically been linked to severe disease and worse outcomes, its long-term clinical significance remains unclear. We conducted a systematic review and meta-analysis to evaluate outcomes in UC patients with isolated PARP.\n\n**Methods:** A comprehensive literature search of MEDLINE, Embase, Scopus, and Cochrane CENTRAL was performed to identify studies comparing UC patients with and without endoscopic or histologic evidence of PARP. Meta-analysis was conducted using R (version 4.4.3). Pooled odds ratios (ORs) with 95% confidence intervals (CIs) were calculated, and between-study heterogeneity was assessed using Higgins' I2 statistic.\n\n**Results:** Thirteen nonrandomized studies, including 2289 UC patients (PARP+: 725; PARP-: 1564), were analyzed. PARP was significantly associated with higher odds of proctitis (OR, 1.54; 95% CI, 1.09-2.18; P = .02). No significant associations were observed between PARP and left-sided colitis (OR, 0.88; 95% CI, 0.57-1.35; P = .51) or extensive colitis (OR, 0.84; 95% CI, 0.50-1.41; P = .45). PARP was not associated with disease progression, pharmacotherapeutic escalation, or colectomy. However, moderate-to-high heterogeneity was observed across most of the outcomes.\n\n**Conclusion:** PARP is more frequently observed in patients with ulcerative proctitis but does not appear to influence long-term disease progression or major clinical outcomes, supporting its classification as a benign endoscopic finding in UC.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "appendectomy, appendiceal orifice inflammation, periappendiceal red patch, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/42262727/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 09 Jun 2026"}, {"id": "42223567", "title_en": "Resection quality and oncologic outcomes after robotic versus laparoscopic total mesorectal excision for mid and low rectal cancer: a systematic review and meta-analysis of randomised trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vignesh Narasimhan", "abstract_en": "Total mesorectal excision (TME) for mid and low rectal cancer is technically demanding, and resection quality strongly influences local control and survival. Robotic platforms may offer technical advantages over conventional laparoscopy, but oncologic benefits remain uncertain. This meta-analysis evaluates resection quality and early oncologic outcomes using evidence exclusively from randomised trials. A PRISMA aligned systematic review of MEDLINE, Embase, CENTRAL and Google Scholar was performed to 22 September 2025. Eligible studies were parallel-group randomised controlled trials comparing robotic with laparoscopic TME for mid or low rectal adenocarcinoma, defined as tumour height of 10 cm or less from the anal verge. Co-primary outcomes were circumferential resection margin (CRM) positivity and completeness of the mesorectum. Secondary outcomes included conversion to open surgery, intraoperative complications, and three-year locoregional recurrence, disease-free survival, and overall survival. Odds ratios and hazard ratios were pooled using random effects models. Four randomised trials met inclusion, enrolling 1,952 patients. Robotic TME reduced CRM positivity (OR 0.58, 95% CI 0.38 to 0.87) and increased complete TME rates (OR 1.55, 95% CI 1.14 to 2.12). Conversion to open surgery was less frequent with robotics (OR 0.41, 95% CI 0.21 to 0.79). Intraoperative and early postoperative complications did not differ. Two trials reported three-year oncologic outcomes. Robotic TME was associated with lower three-year locoregional recurrence (OR 0.43, 95% CI 0.23-0.81) and a modest improvement in disease-free survival (HR 0.78, 95% CI 0.61-0.99), although event rates were low and estimates should be interpreted cautiously. Overall survival did not differ (HR 0.79, 95% CI 0.57-1.11). In mid and low rectal cancer, robotic TME was associated with improved pathological resection quality and lower conversion rates compared with laparoscopic TME, without clear differences in early perioperative morbidity There is emerging evidence of improved three-year locoregional recurrence and disease-free survival.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error. es including 8,725 patients and 784 anastomotic leakage events were analyzed. A single stapler firing was associated with a significantly reduced risk of anastomotic leakage compared with two stapler firings (odds ratio 0.57, 95% confidence interval 0.39-0.83), three or more stapler firings (odds ratio 0.28, 95% confidence interval 0.16-0.51), and two or more stapler firings (odds ratio 0.46, 95% confidence interval 0.34-0.63). The risk of anastomotic leakage was lower with fewer than three stapler firings compared with three or more stapler firings (odds ratio 0.38, 95% confidence interval 0.30-0.48). Meta-regression identified low rectal transection and preoperative radiotherapy as significant effect modifiers.\n\n**Limitations:** All included studies were observational, introducing potential bias and increased heterogeneity and the certainty of evidence was low across all comparisons.\n\n**Conclusions:** Three or more stapler firings were consistently associated with a higher risk of anastomotic leakage. However, because the certainty of evidence was low and owing to exploratory meta-regression findings, stapler firing number appears to reflect operative complexity more than a definitively established independent causal risk factor.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Data sources：** 对 PubMed、Cochrane 图书馆和 Ovid MEDLINE 进行了全面检索。\n\n**Study selection：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Intervention(s)：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Main outcome measures：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 分析 through IHC and PCR techniques in Hispanic/Latino individuals with colorectal cancer (whether sporadic, associated with Lynch Syndrome, or other forms), residing in Latin American countries or elsewhere, were included.\n\n**Results:** A total of 52 studies including 10,596 patients were included. The pooled prevalence of mismatch repair deficiency (MMRd) and microsatellite instability-high (MSI-H) in Hispanic/Latino populations was 15% (95% CI: 10%-20%; I<sup>2</sup> = 89.6%) and 18% (95% CI: 13%-24%; I<sup>2</sup> = 84.0%), respectively. Costa Rica and Mexico had the highest MMRd prevalence (30% and 24%), while Uruguay showed the highest MSI-H prevalence (45%). MSI-H was significantly associated with female sex (OR: 1.83) and right-sided tumors (OR: 8.16). MMRd was associated with right-sided tumors compared with the rectum (OR: 1.73) and the left colon (OR: 5.65).\n\n**Conclusions:** This meta-analysis underscores the unique prevalence of MMRd and MSI-H in Hispanics, highlighting regional variations and the need for broader representation.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Colorectal carcinoma, Hispanic/Latino population, MSI-high, Mismatch repair", "link": "https://pubmed.ncbi.nlm.nih.gov/42165902/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 21 May 2026"}, {"id": "42143002", "title_en": "Ultrasound for image-guided brachytherapy in cervical cancer: Geometric accuracy and dosimetric evidence compared with MRI and CT", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kelvin Ken Yu", "abstract_en": "**Purpose:** Cervical cancer is the fourth most common cancer worldwide, with the highest burden in low- and middle-income countries (LMICs). Image-guided brachytherapy (IGBT) with magnetic resonance imaging (MRI) is the gold standard, but access is limited in many regions. Ultrasound (US), being portable and cost-effective, has been proposed as an alternative to three-dimensional (3D) imaging with MRI or computed tomography (CT). This study systematically reviews and meta-analyzes evidence comparing US with MRI and CT in cervical cancer brachytherapy.\n\n**Methods:** A systematic search (2000-2025) was conducted in PubMed, Science Direct, EBSCOhost, Cochrane Library, and Wiley (PROSPERO: CRD420251121697). Nineteen studies (n = 5-295 patients) were included, comprising prospective, retrospective, and pilot designs. Outcomes included tumor and organ-at-risk (OAR) dimensions, dosimetry, and reproducibility. Random-effects meta-analyses were performed, with heterogeneity assessed using I², and sensitivity and subgroup analyses conducted.\n\n**Results:** Across geometric parameters (height, width, thickness, volume), pooled analyses demonstrated no significant differences between US and 3D imaging, except for a small reduction in tumor thickness favoring US that was not sustained in sensitivity analyses. Dosimetric parameters, including target coverage (D90) and OAR doses (D2cc bladder, rectum, sigmoid), also showed no significant differences. Reproducibility analyses using coefficient of variation demonstrated comparable consistency between modalities.\n\n**Conclusion:** Ultrasound yields geometric and dosimetric outcomes broadly comparable to MRI and CT, with added benefits of affordability, portability, and workflow integration. These findings support US as a feasible and reliable alternative for IGBT, particularly in LMICs, pending standardization of imaging protocols and prospective validation.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在几何参数（高度、宽度、厚度、体积）方面，汇总分析表明超声和 3D 成像之间没有显着差异，除了有利于超声的肿瘤厚度小幅减小（在敏感性分析中并未持续）。剂量测定参数，包括目标覆盖 (D90) 和 OAR 剂量（D2cc 膀胱、直肠、乙状结肠），也没有显示出显着差异。使用变异系数的再现性分析证明了模式之间具有可比较的一致性。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Brachytherapy, CT, Cervical cancer, Image-guided brachytherapy, MRI, Scan, Ultrasound", "link": "https://pubmed.ncbi.nlm.nih.gov/42143002/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sat, 16 May 2026"}, {"id": "42141324", "title_en": "Bridging the gap: a systematic literature review and meta-analysis on the management of rectal wall defect after transanal excision", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "D Prassas", "abstract_en": "**Background:** Transanal resection techniques have gained considerable importance in the treatment of benign and malignant rectal neoplasms. However, there is no definitive consensus on whether the rectal defect should be closed or left open after excision. We sought to provide an updated pooled analysis of the management of rectal wall defect after transanal excision.\n\n**Methods:** In accordance with PRISMA and Cochrane guidelines, this meta-analysis was performed using the PubMed (MEDLINE), Cochrane Central Register of Controlled Trials, and Google Scholar databases to identify studies comparing perioperative outcomes after rectal defect closure versus leaving the defect open following full-thickness (FT) excision. Odds ratios (ORs) and standardized mean differences (SMDs) with 95% confidence intervals (CIs) were calculated. Heterogeneity was assessed using Cochrane's Q test. Risk of bias and certainty of evidence were judged by ROBINS-I and GRADE, respectively.\n\n**Results:** Six comparative studies meeting the inclusion criteria were included in the final analysis. Closing the rectal defect was associated with significantly reduced rectal bleeding (OR = 0.57, 95% CI: 0.35-0.94, p = 0.03; I<sup>2</sup> = 26%) and re-admission rates (OR = 0.34, 95% CI: 0.16-0.76, p = 0.008; I<sup>2</sup> = 0%) compared with the open group, while other outcomes were not significantly different. A prolonged operative time was noted when the rectal wall defect was sutured (SMD = 0.15, 95% CI: 0.03-0.28, p = 0.02; I<sup>2</sup> = 44%).\n\n**Conclusions:** The present analysis revealed that both approaches are safe and technically feasible; however, closing the rectal wall defect after FT excision of rectal neoplasms was associated with lower bleeding and re-admission rates. Nevertheless, randomized studies with homogeneous protocols and consistent long-term outcome data are still needed to provide definitive answers.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 目前的分析表明，这两种方法都是安全且技术上可行
