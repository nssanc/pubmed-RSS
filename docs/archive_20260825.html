and recurrence. Substantial heterogeneity blocked meta-analysis; results were narratively synthesized.\n\n**Results:** Twenty-two studies encompassing 810 procedures qualified. Technical success reached 93-100%. Clinical success ranged from 63 to 94%, yielding marked bleeding control and symptom relief. Reported complications were mild and self-limited (pelvic discomfort, nausea, and low-grade fever); no ischemic injury, continence disturbance, or mortality occurred. Recurrence necessitating repeat treatment affected 8-20% of patients, usually when collateral arterial supply persisted. Patient-reported satisfaction exceeded 80% in every series. Only two small, heterogeneous comparative studies versus rubber-band ligation or sclerotherapy were available, precluding a pooled analysis.\n\n**Conclusions:** Current evidence suggests Emborrhoid is a safe, effective bridge between office procedures and surgery-particularly valuable for frail or anticoagulated patients. Yet small single-center cohorts, disparate techniques, and scarce head-to-head trials limit external validity. Multicenter randomized studies with harmonized outcomes and ≥ 24-month follow-up are required to confirm long-term efficacy, cost-effectiveness, and optimal patient selection.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 涵盖 810 项程序的 22 项研究合格。技术成功率达到93-100%。临床成功率为 63% 至 94%，显着控制出血并缓解症状。报告的并发症轻微且具有自限性（骨盆不适、恶心和低烧）；没有发生缺血性损伤、失禁障碍或死亡。需要重复治疗的复发影响了 8-20% 的患者，通常是在侧支动脉供应持续存在的情况下。每个系列中患者报告的满意度均超过 80%。只有两项小型、异质性与橡皮筋结扎或硬化疗法的比较研究可用，排除了汇总分析。\n\n**结论：** 目前的证据表明，Emborroid 是办公室程序和手术之间的安全、有效的桥梁，对于体弱或接受抗凝治疗的患者尤其有价值。然而，小型单中心队列、不同的技术和稀缺的头对头试验限制了外部有效性。需要具有一致结果的多中心随机研究和≥24个月的随访来确认长期疗效、成本效益和最佳患者选择。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Embolic materials, Hemorrhoidal embolization, Minimally invasive therapy, Patient satisfaction, Recurrence rates, Superior rectal artery, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40877526/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 28 Aug 2025"}, {"id": "40876363", "title_en": "Local excision versus total mesorectal excision following neoadjuvant chemoradiotherapy for rectal cancer: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Neary Peter", "abstract_en": "**Background:** Total mesorectal excision (TME) with or without neoadjuvant chemoradiotherapy remains the gold standard treatment for rectal cancer. However, newer organ sparing methods, including Local Excision (LE) have been introduced in conjunction with neoadjuvant therapy to improve morbidity and functional outcomes while not impacting on oncological outcomes.\n\n**Methods:** A systematic review and meta-analysis was performed using the PRISMA guidelines. All studies comparing neoadjuvant chemoradiotherapy and local excision versus TME were included from 2000 to 2024. Primary endpoint included local recurrence rates. Secondary outcomes included distant recurrence, disease free survival (DFS), overall survival (OS), and morbidity. Subgroup analysis was performed on randomised control trials (RCT).\n\n**Results:** Sixteen studies (n = 2121; LE = 616, TME = 1505) were included. LE was associated with higher local recurrence (8.3 % vs 5.5 %; OR 1.82, 95 % CI 1.19-2.77, p = 0.006). However, in RCTs (n = 245), this difference was not significant (7.3 % vs 6.6 %; OR 1.10, 95 % CI 0.41-2.97, p = 0.84). No significant differences were observed in distant recurrence, DFS, or OS. LE was associated with significantly reduced morbidity (OR 0.30, 95 % CI 0.18-0.50, p < 0.0001).\n\n**Conclusion:** Local recurrence was not statistically significant in the RCT subgroup analysis. Despite, higher local recurrence rates in the overall pooled analysis, no significant differences were observed for secondary outcomes. Neoadjuvant chemoradiotherapy and local excision appears oncologically safe, defined by DFS and OS, in select patient cohorts with a clinical complete or near-complete response to neoadjuvant therapy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Local excision, Radical surgery, Rectal cancer, Total mesorectal excision", "link": "https://pubmed.ncbi.nlm.nih.gov/40876363/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 28 Aug 2025"}, {"id": "40845608", "title_en": "Transparency in Externally Validated Models: A systematic review of machine learning vs. logistic regression for predicting colorectal anastomotic leakage", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Freek Daams", "abstract_en": "**Introduction:** Colorectal resection carries a 2.8 %-30 % risk of anastomotic leakage. Machine learning can estimate risks and guide decisions, but clinical implementation remains inadequate due to transparency issues. This review assesses the performance and transparency of machine learning models compared to logistic regression.\n\n**Methods:** A systematic review followed PRISMA guidelines. Medline, Embase, Web of Science, and Cochrane databases were searched for studies using Logistic Regression or Machine Learning with external validation for colorectal anastomotic leakage prediction. Data were extracted using CHARMS, risk of bias assessed with PROBAST, and transparency with TRIPOD + AI.\n\n**Results:** Ten studies were included. Machine learning models were validated on smaller cohorts than logistic regression. Transparency scores ranged from 29 % to 63 %, averaging 45 % for logistic regression and 43 % for machine learning. Reporting of missing data was inconsistent, and external validation was limited. Most studies had a high risk of bias due to small sample sizes and low event counts.\n\n**Conclusion:** In comparison to Logistic regression studies, machine learning studies are limited by small cohorts, low outcome numbers, and a lower level of transparency. Future research should prioritise transparency, adhere to TRIPOD + AI standards, and develop LR and ML models in parallel using the same datasets while ensuring separate models for colon and rectal surgery. Currently, these models are not yet suitable for clinical implementation; more robust and transparent models must be developed based on these recommendations before they can be applied in clinical practice.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leakage, Colorectal surgery, Logistic regression, Machine learning, Prediction", "link": "https://pubmed.ncbi.nlm.nih.gov/40845608/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 22 Aug 2025"}, {"id": "40824311", "title_en": "Abdominoperineal pull-through with delayed coloanal anastomosis for pelvic anastomotic failure-a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "I Seow-En", "abstract_en": "**Aim:** Despite the potential benefits of abdominoperineal pull-through with delayed coloanal anastomosis (DCAA), it is still infrequently performed as a salvage procedure for pelvic anastomotic failure. We aimed to perform a systematic review on the subject to guide practice.\n\n**Method:** PubMed, Embase and Cochrane were used to identify studies evaluating DCAA for salvage after pelvic surgery from inception to August 2024. Risk of bias assessment was performed using the Newcastle-Ottawa scale. The primary outcome was overall stoma-free survival. Secondary outcomes included hospital length of stay, high-grade postoperative complication rates, 30-day postoperative mortality rates, incidence of redo surgical intervention after DCAA, and postoperative anorectal function.\n\n**Results:** Five retrospective cohort studies evaluating a total of 97 patients who underwent salvage abdominoperineal pull-through and DCAA were included in this review. All patients had previous pelvic surgery, predominantly proctectomy (n = 84, 86.6%). The most common indication for redo surgery was chronic fistula (n = 62, 63.9%) followed by anastomotic leak or chronic pelvic sepsis (n = 34, 35.1%). The pooled overall stoma-free survival rate across all five studies was 81.4% over a mean 24-month postoperative follow-up duration. The overall incidence of high-grade complications after DCAA was 39.1% (n = 38). Pooled mean length of stay was 17 days. There were no cases of early postoperative death. Pooled rate of repeat surgery across four studies was 11.6% (n = 8). Pooled mean functional scores across three studies indicated minor low anterior resection syndrome at 26 months.\n\n**Conclusion:** Abdominoperineal pull-through with delayed coloanal anastomosis is a viable option for salvage surgery following pelvic anastomotic complications, with low rates of permanent stoma and acceptable long-term anorectal function.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Abdominoperineal pull-through, Colorectal surgery, Delayed coloanal anastomosis, Redo surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40824311/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 18 Aug 2025"}, {"id": "40819153", "title_en": "Comprehensive evaluation of reinforcement strategies for anastomotic leak prevention in rectal cancer surgery: an umbrella review of meta-analyses", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Leonardo Vincenti", "abstract_en": "Anastomotic leakage remains a serious complication following colorectal surgery. Various reinforcement techniques have been explored in literature, with multiple systematic reviews and meta-analyses addressing their effectiveness. However, no umbrella review has yet comprehensively synthesized this evidence. We aimed to summarize and critically appraise the available systematic reviews and meta-analyses investigating the effectiveness of anastomotic reinforcement techniques in colorectal surgery. A comprehensive literature search was conducted in PubMed, Embase, Scopus, and Cochrane Library up to June 2025. Eligible studies were systematic reviews or meta-analyses evaluating any reinforcement technique (biological, mechanical, or chemical) in colorectal anastomoses. Data extraction included review characteristics, reinforcement strategies, primary outcomes (anastomotic leak), and methodological quality assessed using AMSTAR 2. Twenty-one systematic reviews and meta-analyses were included. The reinforcement strategies evaluated comprised transanal tube (TAT) placement, suture reinforcement, and omentoplasty. Most reviews showed a reduction in anastomotic leak rates, particularly with TAT (43-70%) and sutures (59-75%), with the most pronounced effect observed in patients without a diverting stoma. TAT was also associated with a reduction in reintervention rates (62-84%). Findings on hospital stay were inconsistent, while no significant effects were reported for anastomotic bleeding, infections, stenosis, or mortality. The overall methodological quality of the included studies was rated as critically low. TAT and reinforcement sutures show potential in reducing anastomotic leakage in colorectal surgery. However, significant heterogeneity and variable methodological quality across reviews limit definitive conclusions. High-quality, targeted studies and standardized outcome definitions are warranted.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "吻合口漏、吻合口加固、直肠癌、经肛管", "keywords_en": "Anastomotic leak, Anastomotic reinforcement, Rectal cancer, Transanal tube", "link": "https://pubmed.ncbi.nlm.nih.gov/40819153/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sat, 16 Aug 2025"}, {"id": "40808658", "title_en": "Association between anastomotic leak after rectal resection and bowel dysfunction, a systematic review, meta-analysis and meta-regression", "title_zh": "直肠切除术后吻合口瘘与肠功能障碍之间的关联、系统评价、荟萃分析和荟萃回归", "authors": "Marylise Boutros", "abstract_en": "**Background:** Anastomotic leak (AL) after colorectal anastomosis can be a risk factor for bowel dysfunction, namely low anterior resection syndrome (LARS). The present study aimed to assess bowel dysfunction in patients who developed AL after anterior resection compared to patients without AL.\n\n**Methods:** We conducted a PRISMA-compliant systematic review of PubMed, Scopus and Cochrane Library for randomized and observational studies investigating the association between AL after anterior resection and bowel dysfunction. The main outcomes were LARS, faecal incontinence and urgency. Pairwise meta-analyses were conducted to calculate the relative risk (RR) of the study outcomes and their 95% confidence intervals (CI).\n\n**Results:** This review included 20 retrospective studies comprising 4764 patients (61.6% male, median age 63 years). AL was detected in 14% of patients and those who experienced AL had a higher risk of LARS (six studies; 1329 patients, RR: 1.27 95%CI: 1.02, 1.58, p = 0.035), major LARS (seven studies; 1395 patients, RR: 1.38, 95%CI: 1.07, 1.79, p = 0.012), urgency (five studies; 955 patients, RR: 1.15, 95%CI: 1.04, 1.27, p = 0.005) and had higher LARS scores (seven studies; 1450 patients, WMD: 6.64, 95%CI: 3.76, 9.52, p < 0.001) and Wexner incontinence scores (seven studies; 1045 patients, WMD: 1.72, 95%CI: 0.16, 3.28, p = 0.031).\n\n**Conclusion:** Based on low to moderate certainty evidence, AL after colorectal and coloanal anastomoses was significantly associated with an increased risk of LARS, particularly major LARS, urgency and higher LARS and Wexner/Cleveland Clinic Florida-Fecal Incontinence Scores.", "abstract_zh": "**背景：** 结直肠吻合术后吻合口漏（AL）可能是肠功能障碍的危险因素，即低位前切除综合征（LARS）。本研究旨在评估前切除术后发生 AL 的患者与未发生 AL 的患者相比的肠功能障碍。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 该综述包括 20 项回顾性研究，涉及 4764 名患者（61.6% 为男性，中位年龄 63 岁）。 14% 的患者检测到 AL，经历 AL 的患者发生 LARS 的风险较高（六项研究；1329 名患者，RR：1.27 95%CI：1.02、1.58，p = 0.035）、主要 LARS（七项研究；1395 名患者，RR：1.38，95%CI：1.07， 1.79，p = 0.012），紧迫性（五项研究；955 名患者，RR：1.15，95%CI：1.04，1.27，p = 0.005）并且具有较高的 LARS 评分（七项研究；1450 名患者，WMD：6.64，95%CI：3.76， 9.52，p< 0.001）和 Wexner 失禁评分（七项研究；1045 名患者，WMD：1.72，95%CI：0.16、3.28，p= 0.031）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "LARS, anastomotic leak, anterior resection, bowel dysfunction, colorectal, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40808658/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 14 Aug 2025"}, {"id": "40793873", "title_en": "Systematic Review: The Relationship Between the Faecal Microbiome and Colorectal Neoplasia in Shotgun Metagenomic Studies", "title_zh": "系统综述：鸟枪法宏基因组研究中粪便微生物组与结直肠肿瘤之间的关系", "authors": "Colin Rees", "abstract_en": "**Background:** The human gut microbiome is of academic and clinical interest. Associations between certain organisms and colorectal neoplasia have been reported, but findings have limited reproducibility in different populations.\n\n**Methods:** We performed a systematic review of whole metagenome shotgun sequencing studies using faecal samples from patients with colorectal neoplasia and control populations. Searches were performed on 30th June 2023. We identified 26 studies, reporting on 22 study populations (13 from Asia, five from Europe and four from North America). Study size ranged from 14 to 971 individuals (mean 170).\n\n**Results:** Some reproducible data were identified, such as the significant enrichment of Fusobacterium nucleatum and Parvimonas micra in colorectal cancer patients compared to controls (in 10 and nine studies, respectively). However, 21 out of 26 studies scored poorly on quality appraisal, specifically surrounding selection of cases and controls. Definitions of controls varied; some studies used individuals with normal endoscopic investigations, some used 'healthy' individuals where no colonoscopy was performed, and one used those with non-neoplastic findings (haemorrhoids). There was even less reproducibility of data in studies where individuals with colorectal polyps were compared to controls, possibly because of heterogeneity in these patient groupings as a variety of definitions for 'polyp cases' were used.\n\n**Conclusions:** Heterogeneity and potential for bias indicates that findings should be interpreted with caution. Standardised protocols to ensure robust methodology and allow pooling of large-scale data are required before these findings can be used in clinical practice (PROSPERO: CRD42023431977).", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 我们使用结直肠肿瘤患者和对照人群的粪便样本对整个宏基因组鸟枪法测序研究进行了系统回顾。检索于 2023 年 6 月 30 日进行。我们确定了 26 项研究，报告了 22 个研究人群（13 项来自亚洲，5 项来自欧洲，4 项来自北美）。研究规模从 14 人到 971 人不等（平均 170 人）。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 异质性和潜在偏差表明应谨慎解释研究结果。在将这些发现用于临床实践之前，需要制定标准化方案以确保稳健的方法并允许汇集大规模数据（PROSPERO：CRD42023431977）。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40793873/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 12 Aug 2025"}, {"id": "40788642", "title_en": "Role of Neoadjuvant Immune Checkpoint Inhibitors in Locally Advanced Rectal Cancer: A Systematic Review of Currently Available Studies", "title_zh": "新辅助免疫检查点抑制剂在局部晚期直肠癌中的作用：对现有研究的系统回顾", "authors": "Alexander G Heriot", "abstract_en": "**Background:** During the past few decades, the standard of care for locally advanced rectal cancer, involving neoadjuvant chemoradiation followed by surgery, has been associated with a pathological complete response rate of only 10% to 20%. Combination therapy with immune checkpoint inhibitors may improve treatment response.\n\n**Objective:** This systematic review examines the current evidence regarding neoadjuvant immune checkpoint inhibitors in locally advanced rectal cancer in terms of treatment efficacy, impact on surgical outcomes, and potential adverse events.\n\n**Data Sources:** A literature search was conducted using the Ovid MEDLINE, Embase, Web of Science, and Cochrane Library databases from the start of database records to October 31, 2024.\n\n**Study Selection:** All studies that reported outcomes in patients with locally advanced rectal cancer who received immune checkpoint inhibitors as part of their neoadjuvant treatment were included for examination.\n\n**Main Outcome Measures:** Primary outcome was pathological complete response rate. Secondary outcomes were major pathological response rate, clinical complete response rate, complete response rate, R0 resection rate, and sphincter preservation rate. Safety data were included where available. Potential biomarkers of treatment response were identified.\n\n**Results:** Twelve studies were reviewed. All were prospective phase I/II clinical trials. The overall pathological complete response rate ranged from 25% to 62.5% (50% for deficient mismatch repair/high microsatellite instability; 25%-62.5% for proficient mismatch repair/microsatellite stable). The clinical complete response rate ranged from 10.9% to 100% (56%-100% for deficient mismatch repair/high microsatellite instability; 16.4%-48% for proficient mismatch repair/microsatellite stable). The complete response rate ranged from 44% to 75% (75% for deficient mismatch repair/high microsatellite instability; 44%-56.5% for proficient mismatch repair/microsatellite stable). The R0 resection rate ranged from 94% to 100% and the sphincter preservation rate ranged from 59.4% to 100%. The majority of adverse events were of grades 1 and 2.\n\n**Limitations:** Our review was limited by a small number of mostly single-arm studies with a lack of long-term survival outcomes, as well as marked clinical and methodological heterogeneity among included studies.\n\n**Conclusions:** Combination therapy with immune checkpoint inhibitors in locally advanced rectal cancer appears to improve treatment response, but high-level evidence and long-term data are still lacking.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 本系统综述从治疗效果、对手术结果的影响和潜在不良事件方面探讨了有关新辅助免疫检查点抑制剂治疗局部晚期直肠癌的当前证据。\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study selection：** 所有报告接受免疫检查点抑制剂作为新辅助治疗一部分的局部晚期直肠癌患者结局的研究均被纳入检查。\n\n**Main outcome measures：** 主要结果是病理完全缓解率。次要结局为主要病理缓解率、临床完全缓解率、完全缓解率、R0切除率和括约肌保留率。如有可用的安全数据也包括在内。确定了治疗反应的潜在生物标志物。\n\n**结果：** 审查了十二项研究。所有均为前瞻性 I/II 期临床试验。总体病理完全缓解率范围为 25% 至 62.5%（错配修复缺陷/微卫星高度不稳定为 50%；错配修复熟练 eral, the approaches are considered to provide similar diagnostic power. However, infectious complications appear to differ in favour of the TP approach. Furthermore, antibiotic prophylaxis is felt to have limited additional value in a TP biopsy, which aligns with antimicrobial stewardship principles. Urology association guidelines have provided conflicting recommendations on the best approach for a prostate biopsy. This systematic review aims to compare the infectious complications and antibiotic usage of the two approaches.\n\n**Methods:** A systematic review and meta-analysis were performed according to the Preferred Reporting Items for Systematic Reviews and Meta-analyses guidelines after registration with PROSPERO (CRD42024513309). MEDLINE, Embase, Scopus, and Web of Science were searched for articles published until April 1, 2025. Randomised controlled trials (RCTs) assessing infectious complications (fever, urinary tract infection, and hospitalisation with infectious complications) following a prostate biopsy were included. The risk of bias was assessed with the RoB 2 tool, and statistical analyses included visualisation through funnel and forest plots and assessing the publication bias via Egger's regression test.\n\n**Key Findings And Limitations:** Ten RCTs were included in the analysis, encompassing 4188 prostate biopsies. Of seven studies reporting hospitalisation for infectious complications, the TP route showed significantly lower odds (odds ratio 0.23, 95% confidence interval [CI] 0.10-0.54; graphical abstract), reducing hospitalisation risk by 77% compared with the TR route. Postinterventional fever occurred less frequently, with an odds ratio of 0.68 (95% CI 0.52-0.89). There was no statistically significant difference in infectious complications after a TP biopsy with or without antibiotics. All TR route biopsies utilised antibiotic prophylaxis. The small number of eligible studies and the high risk of bias, as well as sparse data on bias in most studies, limit the power of our manuscript.\n\n**Conclusions And Clinical Implications:** TP biopsy is associated with a lower admission risk due to postprocedural infection compared with TR biopsy. TP biopsy seems to be a safe procedure without antibiotics in patients without risk factors, advocating for enhanced antimicrobial stewardship in urology.", "abstract_zh": "**Background and objective：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 在 PROSPERO 注册后，根据系统评价和荟萃分析指南的首选报告项目（CRD42024513309）进行了系统评价和荟萃分析。检索了 MEDLINE、Embase、Scopus 和 Web of Science 中截至 2025 年 4 月 1 日发表的文章。其中包括评估前列腺活检后感染性并发症（发烧、尿路感染和因感染性并发症住院）的随机对照试验 (RCT)。使用 RoB 2 工具评估偏倚风险，统计分析包括通过漏斗图和森林图可视化以及通过 Egger 回归测试评估发表偏倚。\n\n**Key findings and limitations：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Conclusions and clinical implications：** 与 TR 活检相比，TP 活检因术后感染而导致的入院风险较低。对于没有危险因素的患者来说，TP 活检似乎是一种无需抗生素的安全手术，提倡加强泌尿外科的抗菌药物管理。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Prostate biopsy, Rehospitalisation, Sepsis, Transperineal, Transrectal, Urinary tract infection", "link": "https://pubmed.ncbi.nlm.nih.gov/40774844/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 07 Aug 2025"}, {"id": "40760310", "title_en": "Correction: Real-world use of polidocanol foam sclerotherapy for hemorrhoidal disease: insights from an international survey and systematic review with clinical practice recommendations", "title_zh": "纠正：聚多卡醇泡沫硬化疗法治疗痔疮疾病的实际应用：国际调查和系统评价以及临床实践建议的见解", "authors": "Gianpiero Gravante", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40760310/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 05 Aug 2025"}, {"id": "40723194", "title_en": "Quality of Life in Rectal Cancer Treatments: An Updated Systematic Review of Randomized Controlled Trials (2013-2023)", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Emanuele Damiano Luca Urso", "abstract_en": "**Background:** Rectal cancer management involves surgery, chemotherapy (CT), radiotherapy (RT), and patient care strategies, all of which significantly affect health-related quality of life (HRQoL). Understanding these effects is critical for optimizing treatment protocols. This review aimed to systematically analyze the impact of rectal cancer treatment on HRQoL.\n\n**Methods:** Four databases, Scopus, EMBASE, MEDLINE, and the Cochrane Central Register of Controlled Trials, were searched for randomized controlled trials (RCTs) published between January 2013 and December 2023. RCTs specifically focusing on rectal cancer treatments (surgical interventions, pre- and/or post-CT and/or RT, and patient care strategies) were included. An abstract review, data extraction, and a risk-of-bias assessment were independently conducted by two reviewers.\n\n**Results:** The 41 included studies comprised 9240 patients: 16 evaluated surgical interventions (3507 patients), 15 evaluated pre- and/or post-CT and/or RT protocols (5114 patients), and 10 focused on patient-care strategies (619 patients). Sphincter-sparing procedures were associated with better HRQoL than abdominoperineal resection, and rectal-sparing techniques were associated with better overall HRQoL than rectal resection. RT was associated with a poorer HRQoL. Continuity-of-care interventions improved HRQoL in ostomy patients, whereas transanal irrigation improved HRQoL after ostomy closure.\n\n**Conclusions:** This systematic review of RCTs underscores the importance of organ-sparing strategies, such as rectum-sparing approaches and continuity-of-care packages, in improving HRQoL in patients with rectal cancer. Although RT negatively affects HRQoL, treatment regimens should be individualized. Tailored organ-preservation approaches and structured follow-up care are essential for optimizing HRQoL in patients with rectal cancer.", "abstract_zh": "**背景：** 直肠癌管理涉及手术、化疗 (CT)、放疗 (RT) 和患者护理策略，所有这些都会显着影响健康相关的生活质量 (HRQoL)。了解这些影响对于优化治疗方案至关重要。本综述旨在系统分析直肠癌治疗对 HRQoL 的影响。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "健康相关的生活质量、器官保存策略、放射治疗、直肠癌", "keywords_en": "health-related quality of life, organ-preserving strategies, radiotherapy, rectal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/40723194/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 29 Jul 2025"}, {"id": "40719429", "title_en": "Mechanical bowel preparation to prevent infective complications after colon and rectal surgery: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Eloy Espín-Basany", "abstract_en": "**Introduction:** Surgical site infections (SSI) represent a global health challenge, particularly in colorectal surgery, when rates can reach up to 20%. The role of mechanical bowel preparation (MBP) is still debated. A systematic review is proposed to evaluate MBP effectiveness in reducing SSI and complications after colorectal surgery.\n\n**Evidence Acquisition:** This systematic review and meta-analysis was conducted following the PRISMA guidelines. Only randomized studies comparing two or more methods for preventing infectious complications in patients undergoing colorectal surgery were included. The primary endpoint was the occurrence of SSIs, while secondary endpoints included anastomotic leak (AL) and intra-abdominal septic complications (IASC) other than AL.\n\n**Evidence Synthesis:** Eighteen studies met the inclusion criteria, including a total of 6,302 patients in the analysis. The meta-analysis showed similar SSI rates between the MBP and no-treatment groups (OR 1.015, 95% CI 0.855-1.206, I<sup>2</sup>=22.33%, P=0.863) as well as between the MBP and enema groups (OR 1.100, 95% CI 0.616-1.965, I<sup>2</sup>=35.96%, P=0.748). The risk of anastomotic leak (AL) was also similar when comparing no treatment to MBP (OR 0.904, 95% CI 0.661-1.237, I<sup>2</sup>=0%, P=0.528), and MBP to enema (OR 0.727, 95% CI 0.286-1.845, I<sup>2</sup>=25.98%, P=0.502). IASC rates were lower with MBP compared to no treatment (OR 0.526, 95% CI 0.326-0.848, I<sup>2</sup>=3.50%, P=0.008).\n\n**Conclusions:** This meta-analysis found no significant reduction in SSI or AL rates with MBP alone compared to no preparation or enema use. However, MBP significantly lowered IASC. Further research is warranted to evaluate the effectiveness of MBP combined with antibiotics in reducing postoperative complications.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 这项荟萃分析发现，与不使用制剂或灌肠相比，单独使用 MBP 的 SSI 或 AL 率没有显着降低。然而，MBP 显着降低了 IASC。需要进一步的研究来评估 MBP 联合抗生素在减少术后并发症方面的有效性。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40719429/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 28 Jul 2025"}, {"id": "40714623", "title_en": "Closing the gap: addressing delayed healthcare-seeking and improving quality of life for Ethiopian women with pelvic organ prolapse", "title_zh": "缩小差距：解决患有盆腔器官脱垂的埃塞俄比亚妇女延迟就医的问题并提高生活质量", "authors": "Lencho Kajela", "abstract_en": "**Background:** Pelvic organs prolapse (POP) involves the herniation of pelvic organs, such as the uterus, cervix, vaginal wall, bladder, and rectum, into the vagina. While it is a common gynecologic problem, its impact on quality of life and timely healthcare-seeking remains poorly understood in developing countries. This systematic review and meta-analysis aimed to assess the quality of life, delays in healthcare-seeking, and associated factors among women diagnosed with POP in Ethiopia.\n\n**Methods:** A systematic review and meta-analysis were conducted following PRISMA guidelines. Extensive literature searches were performed in PubMed, CINAHL, Google Scholar, ScienceDirect, and Scopus. A restricted maximum likelihood random-effects model was used to estimate pooled proportions. Heterogeneity among studies was assessed using the Cochrane Q-test and I2 statistics. Publication bias was evaluated using funnel plots and Egger's test. Stata 17 software was used for all analyses.\n\n**Results:** From an initial pool of 421 articles, 10 met the inclusion criteria, encompassing data from 1489 women diagnosed with POP. The pooled proportion of poor quality of life among women with POP in Ethiopia was 52.07 % [95 % C.I.: 48.04 %, 56.09 %]. Moderate heterogeneity was observed across studies. The mean delay between symptom onset and seeking medical care was 50.64 months [95 % C.I: 32.50, 68.79], with an estimated 78.22 % [95 % C.I.: 70.72 %, 85.72 %] of women experiencing delays in seeking healthcare. Postmenopausal status (OR = 2.05, 95 % CI: 1.22-3.45), living with POP for more than 2 years (OR = 4.17, 95 % CI: 1.23-14.10), and having Stage III/IV POP (OR = 4.48, 95 % CI: 1.61-12.44) associated with poor quality of life. In addition, factors associated with delayed healthcare seeking include: fear of disclosure (OR = 4.60, 95 % CI: 4.65-45.71), lack of social support (OR = 4.09, 95 % CI: 1.91-8.74), low income (OR = 4.80, 95 % CI: 2.12-10.86), and experiencing stigma (OR = 5.78, 95 % CI: 1.07-31.36).\n\n**Conclusion:** This review highlights a high prevalence of poor quality of life and significant delays in healthcare-seeking among Ethiopian women with POP, with an average delay of over four years after symptom onset. Stigma, fear of disclosure, low income, and lack of social support were significantly associated with delays in seeking health care. Additionally, longer prolapse duration, menopause, and stage III or IV pelvic organ prolapse (POP) were significantly associated with a reduced quality of life.", "abstract_zh": "**背景：** 盆腔器官脱垂（POP）涉及盆腔器官（例如子宫、子宫颈、阴道壁、膀胱和直肠）疝入阴道。虽然这是一个常见的妇科问题，但在发展中国家，它对生活质量和及时就医的影响仍然知之甚少。这项系统回顾和荟萃分析旨在评估埃塞俄比亚被诊断为 POP 的女性的生活质量、就医延迟以及相关因素。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ethiopia, Healthcare-seeking, Pelvic floor dysfunction, Pelvic organs prolapse, Quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/40714623/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sun, 27 Jul 2025"}, {"id": "40703667", "title_en": "Radiotherapy boost to the primary tumour in locally advanced rectal cancer: Systematic review of practices and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Geneviève Van Ooteghem", "abstract_en": "**Introduction:** In locally advanced rectal cancer (LARC), increasing the complete response (CR) rate after total neo-adjuvant treatment may increase the patient eligibility for non-operative management (\"watch and wait\", W&W). Although a radiotherapy (RT) boost to the primary tumour may enhance CR rates, clear guidelines are currently lacking. This systematic review and <i>meta</i>-analysis investigate the technical parameters used for rectal boost RT and assess their impact on oncological outcomes.\n\n**Methods:** Following PRISMA guidelines, the terms \"rectum,\" \"radiotherapy,\" and \"boost\" were searched in PubMed and EMBASE (PROSPERO: CRD42023444685). Studies reporting on external beam RT boost to the primary tumour in LARC and meeting quality criteria were included. Descriptive analyses extracted data on RT technique, preparation, boost delineation, dose, chemotherapy, and follow-up. A mixed-effects <i>meta</i>-analysis model evaluated the impact of selected parameters on CR and local recurrence rate (LRR). Studies were analysed separately based on treatment intent: planned surgery or W&W.\n\n**Results:** Out of 3904 references, 83 were included in the descriptive analysis and 78 in the <i>meta</i>-analysis. Substantial variability in RT parameters was observed across studies. Pathologic CR rates were significantly higher with intensity-modulated/volumetric-modulated arc RT (IMRT/VMAT, p = 0.007), simultaneous boost (p = 0.020), dose escalation (Biological equivalent dose > 74 Gy, p = 0.035), and the combination of induction and consolidation chemotherapy (p = 0.023). No significant associations were found for clinical CR or LRR.\n\n**Conclusion:** While rectal RT boost is already part of real-world practices, the wide heterogeneity in techniques highlights the urgent need for standardisation. Our <i>meta</i>-analysis suggests that IMRT/VMAT, simultaneous boost, and dose escalation are associated with higher pathological CR rates and should be considered in future rectal boost guidelines. These findings, however, warrant careful interpretation due to the absence of adjustments for clinical, tumoral, or patient-related parameters that may also influence response rate and oncological outcomes.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在 3904 篇参考文献中，83 篇纳入描述性分析，78 篇纳入元分析。不同研究中观察到 RT 参数存在显着差异。强度调节/体积调节弧形放疗（IMRT/VMAT，p = 0.007）、同时加强治疗（p = 0.020）、剂量递增（生物等效剂量> 74 Gy，p = 0.035）以及诱导和巩固化疗相结合（p = 0.023）的病理 CR 率显着更高。未发现与临床 CR 或 LRR 显着相关。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Complete response, Dose escalation, Locally advanced rectal cancer, Meta-analysis, Neo-adjuvant therapy, Rectal boost", "link": "https://pubmed.ncbi.nlm.nih.gov/40703667/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 24 Jul 2025"}, {"id": "40697442", "title_en": "Early-onset colorectal cancer in patients younger than 50 years: a systematic review of the literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Konstantinos Vlachos", "abstract_en": "Early-onset colorectal cancer (EO-CRC) refers to CRC diagnosed before the age of 50. Its incidence has risen in recent years, turning researchers' attention to its oncologic behavior and potentially modifiable risk factors. In this review, PubMed/MEDLINE database was searched for all original research articles concerning EO-CRC. The inclusion criteria were CRC patients under 50, without a known predisposing factor for malignancy or an inherited CRC syndrome, presenting oncological characteristics and outcomes. All studies were assessed for bias, based on the ROBINS-E 2022 tool, and were synthesized in a qualitative analysis. Twenty-nine articles, reporting on 64,376 EO-CRC patients, were included in the qualitative synthesis. Results were classified into 3 categories: a) demographics; b) histopathologic characteristics; and c) treatment outcomes. Of these publications, 21 studies agreed that rectum (45%) and left-sided (47.1%) cancers are most common in younger patients, and 5 indicated that the highest prevalence of CRC concerns the 40-49 years age group. Seventeen of 29 studies reported a higher stage (III and IV) on diagnosis, with lymphovascular and perineural invasion. Our review has some limitations: as it was based on a single database, not all studies provided information on the variables; and patients were not categorized in all studies in the same age groups, although all were under 50 years. As EO-CRC is on the rise, the need for closer monitoring and possibly earlier screening becomes apparent. Further research should focus on finding novel screening biomarkers and modifiable risk factors that would decrease mortality and improve patient outcomes.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "50 years old, Early-onset colorectal cancer, guidelines, young adults", "link": "https://pubmed.ncbi.nlm.nih.gov/40697442/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 23 Jul 2025"}, {"id": "40672439", "title_en": "Diagnosis and treatment for anal fistula: a systematic review of clinical practice guidelines and consensus statements", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Rong Shi", "abstract_en": "**Background:** Anal fistula constitutes a pathological channel originating either from the anal canal or rectum to the skin surrounding the anus, primarily characterized by recurrent pain, purulent discharge, and pruritus. This study aims to compare and standardize the recommendations for the diagnosis and treatment of anal fistula, drawing on contemporary clinical practice guidelines.\n\n**Methods:** A comprehensive search was conducted across multiple databases including PubMed, EMBASE, China National Knowledge Infrastructure, Wanfang Database, Chinese Science and Technology Periodical Database, and Chinese Biological Medicine Database, from their inception through April 1, 2024. The objective was to collate all published guidelines on anal fistula. The quality of the eligible guidelines was appraised by two reviewers using the Appraisal of Guidelines for Research and Evaluation II instrument.\n\n**Results:** The search yielded fifteen guidance documents -comprising nine guidelines and six consensus statements -each offering specific recommendations. Twelve of these documents address screening and diagnosis of anal fistula, while all fifteen discuss various treatment and management strategies. Document analysis highlighted MRI as the predominant diagnostic recommendation. Treatment and management strategies were categorized into four categories: preoperative management, surgical method selection, pharmacological interventions, and postoperative management. Regarding surgical interventions, all guidelines address incision and drainage of fistulas. Most guidelines offer a low recommendation for cutting setons, mainly attributed to the presence of incontinence. For high-positioned anal fistula, a push-pull flap procedure is recommended, whereas the LIFT procedure is advocated for newly identified, high, and sphincter-penetrating fistulas. Among the 15 guidelines and consensus statements evaluated in this study, more than half demonstrated methodological limitations, with particularly deficient performance in the applicability domain. As a critical determinant of implementation effectiveness, these deficiencies may undermine guidelines' capacity to optimize health outcomes.\n\n**Conclusion:** There is a pressing need for an updated search of potential evidence on the diagnosis and treatment of anal fistula. Effective diagnoses and therapeutic approaches, whether conventional or complementary and alternative medicine, should be thoroughly evaluated and incorporated based on robust evidence.", "abstract_zh": "**背景：** 肛瘘是从肛管或直肠到肛门周围皮肤的病理通道，主要表现为反复疼痛、脓性分泌物和瘙痒。本研究旨在借鉴当代临床实践指南，对肛瘘的诊断和治疗建议进行比较和标准化。\n\n**方法：** 对PubMed、EMBASE、中国国家知识基础设施、万方数据库、中国科技期刊数据库和中国生物医学数据库等多个数据库进行了全面检索，从建库到2024年4月1日。目的是整理所有已发布的肛瘘指南。合格指南的质量由两名评审员使用研究和评估指南 II 工具评估进行评估。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, diagnosis, guidelines, systematic review, therapeutic", "link": "https://pubmed.ncbi.nlm.nih.gov/40672439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 17 Jul 2025"}, {"id": "40670732", "title_en": "Robotic Beyond Total Mesorectal Excision (bTME) for locally advanced and recurrent anorectal cancer: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Muhammad Rafaih Iqbal", "abstract_en": "Robotic surgery is increasingly utilized for rectal cancer resection, particularly in cases requiring beyond total mesorectal excision (bTME) to achieve oncological clearance. Despite longer operative times, robotic bTME has been associated with reduced morbidity and blood loss, making it an emerging approach in specialized centers. A systematic review following PRISMA guidelines was conducted in Web of Science, PubMed, and Scopus. Studies reporting robotic bTME for recurrent or locally advanced anorectal cancer were included. Outcomes assessed included study characteristics, demographics, operative outcomes, oncological data, and follow-up. Nineteen studies comprising 1027 patients met the inclusion criteria (13 case series-68% and 6 cohort studies-32%). The median patient age ranged from 51 to 68 years with 73.7% males. Most patients had an ASA score of 2 (53.1%), and BMI ranged from 21.1 to 28.6. Tumor locations were predominantly near the anal verge (median: 3-6 cm), and the most common clinical staging was cT3, cN1, and cM0. Surgical complications included urinary issues (22.6%), anastomotic leakage (11.4%), ileus (10.4%), and bleeding (5.3%). Follow-up data indicated a recurrence rate of 24.9%, and the 1-year survival rate was > 90%. These studies reported an overall complication rate of 49.7%, with a median follow-up of 12-36 months. Oncological outcomes were favorable, although there was significant variability in survival data between studies. The heterogenicity of the studies makes it challenging to conclusively establish robotic bTME as a feasible alternative to the gold standard. Further prospective studies, with measurable outcomes and consistent terminology, are needed to ensure homogeneity.", "abstract_zh": "机器人手术越来越多地用于直肠癌切除，特别是在需要完全直肠系膜切除（bTME）以外才能实现肿瘤清除的病例。尽管手术时间较长，但机器人 bTME 与降低发病率和失血量有关，使其成为专业中心的新兴方法。 Web of Science、PubMed 和 Scopus 遵循 PRISMA 指南进行了系统评价。报告机器人 bTME 用于治疗复发性或局部晚期肛门直肠癌的研究也被纳入其中。评估的结果包括研究特征、人口统计、手术结果、肿瘤数据和随访。包含 1027 名患者的 19 项研究符合纳入标准（13 项病例系列研究 - 68% 和 6 项队列研究 - 32%）。患者中位年龄范围为 51 岁至 68 岁，其中 73.7% 为男性。大多数患者的 ASA 评分为 2 分（53.1%），BMI 范围为 21.1 至 28.6。肿瘤位置主要位于肛缘附近（中位：3-6 cm），最常见的临床分期是 cT3、cN1 和 cM0。手术并发症包括泌尿问题（22.6%）、吻合口漏（11.4%）、肠梗阻（10.4%）和出血（5.3%）。随访数据显示复发率为24.9%，1年生存率>90%。这些研究报告的总体并发症率为 49.7%，中位随访时间为 12-36 个月。尽管研究之间的生存数据存在显着差异，但肿瘤学结果良好。研究的异质性使得最终确定机器人 bTME 作为黄金标准的可行替代方案具有挑战性。需要进一步的前瞻性研究，具有可测量的结果和一致的术语，以确保同质性。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal cancer, Beyond total mesorectal excision, Minimally invasive surgery, Pelvic exenteration, Robotic surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40670732/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 16 Jul 2025"}, {"id": "40665575", "title_en": "Haemorrhoidal artery ligation: Is Doppler guidance useful? A systematic review and meta-analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gaetano Gallo", "abstract_en": "**Aim:** Haemorrhoidal arterial ligation (HAL) with or without mucopexy (recto-anal repair, RAR) is a minimally invasive technique for the treatment of haemorrhoidal disease. It is still debated if it should be performed with Doppler guidance (DG-HAL) or without. The primary aim of this study was to find evidence that the use of Doppler guidance reduces the risk of recurrence. The secondary aim was to evaluate the benefit of Doppler guidance on postoperative complications.\n\n**Methods:** A comprehensive literature search was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines (2020). The population, intervention, comparison, outcomes and study design (PICOS) framework was used for eligibility criteria. Data were extracted independently by two reviewers for initial screening and for eligibility to be included in the meta-analysis of randomized controlled trials. Random effects meta-analysis, leave-one-out meta-analysis and meta-regression were performed to assess the main outcomes.\n\n**Results:** Seven randomized controlled trials, published between 2008 and 2023, were selected. They included 514 patients (mean age 49.13 years, 46% men) with different haemorrhoidal degrees. The HAL technique was performed in 255 patients and DG-HAL in 259 patients. The meta-analysis revealed that the DG-HAL procedure was associated with a significant risk of recurrence (P = 0.007) and similar postoperative pain (P = 0.623) compared to the HAL procedure. In a subgroup analysis of patients treated with a combined RAR procedure, no differences were found between the DG-HAL-RAR and HAL-RAR regarding the risk of recurrence (P = 0.36) and postoperative pain (P = 0.31).\n\n**Conclusion:** In conclusion, this meta-analysis did not find superiority of DG-HAL over HAL with or without RAR in reducing postoperative complications and recurrence.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Doppler, haemorrhoid, haemorrhoidal artery ligation, haemorrhoidal vascularization, mucopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/40665575/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 16 Jul 2025"}, {"id": "40645825", "title_en": "Pelvic peritonectomy versus rectosigmoid resection in advanced epithelial ovarian cancer with Douglas pouch involvement: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Antonio Gil-Moreno", "abstract_en": "**Objective:** To compare the oncologic outcomes in patients with advanced epithelial ovarian cancer and Douglas pouch involvement who underwent pelvic peritonectomy vs rectosigmoid resection as part of cytoreductive surgery.\n\n**Methods:** A systematic literature review and meta-analysis were conducted following the Preferred Reporting Items for Systematic reviews and Meta-Analyses checklist. MEDLINE (through Ovid), Embase, and Cochrane Central Register of Controlled Trials were searched from inception until March 2024. We included studies with 2 arms of intervention comparing pelvic peritonectomy and rectosigmoid resection in patients diagnosed with advanced epithelial ovarian cancer (International Federation of Gynecology and Obstetrics 2014 stage IIB-IVB). Randomized controlled trials and prospective and retrospective observational studies were considered. The protocol was registered in PROSPERO (CRD42024535681).\n\n**Results:** The search identified 821 articles; 598 studies were considered potentially eligible after removing duplicates, and 4 met the selection criteria, including a total of 623 patients. All 4 studies were retrospective. There was no statistically significant difference between patients undergoing pelvic peritonectomy compared to rectosigmoid resection in terms of overall recurrences (OR 0.99, 95% CI 0.53 to 1.83, I<sup>2</sup> = 60%, p = .97; 3 studies, 495 participants) or pelvic recurrences (OR 1.61, 95% CI 0.23 to 11.53, I<sup>2</sup> = 88%, p = .63; 3 studies, 495 participants). Similarly, there were no significant differences in 5-year disease-free survival (OR 0.91, 95% CI 0.13 to 6.43, I<sup>2</sup> = 91%, p = .93; 2 studies, 317 participants), or 5-year overall survival (OR 1.02, 95% CI 0.39 to 2.62, I<sup>2</sup> = 83%, p = .97; 4 studies, 623 participants). Operative time, stoma rate, blood loss, blood transfusion, and length of hospital stay were significantly higher in the rectosigmoid resection group in the studies where these outcomes were assessed.\n\n**Conclusions:** The comparison between pelvic peritonectomy and rectosigmoid resection for the treatment of Douglas pouch carcinomatosis in advanced ovarian cancer revealed no significant differences in overall and pelvic recurrence rates. Disease-free and overall survival were comparable between the 2 surgical techniques. However, pelvic peritonectomy was associated with shorter surgeries, reduced stoma formation, shorter hospital stay, and lower blood loss and transfusion requirements.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try ; I<sup>2</sup>=59%; p=0.03). NPWT also shortened the wound healing time by three days (mean difference: -2.98; 95% CI: -4.99, -0.97; I<sup>2</sup>=0%; p=0.004). Subgroup analysis revealed that NPWT conferred greater benefits on wounds resulting from life-threatening emergency surgery, and contaminated or dirty-infected wounds.\n\n**Conclusion:** The findings of this review showed that NPWT is an effective intervention for the closure of wounds in patients following colorectal surgery, and lead to a significant reduction in SSIs, overall wound complications, and mean complete wound healing time. It was particularly effective in emergency cases and in contaminated to dirty-infected wounds. Treatment options should be considered in terms of cost-benefits and adequate patient selection during shared decision-making.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal surgery, meta-analysis, negative pressure wound therapy, surgical incision, surgical site infection, systematic review, wound, wound care, wound dressing, wound healing", "link": "https://pubmed.ncbi.nlm.nih.gov/40632066/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 09 Jul 2025"}, {"id": "40624403", "title_en": "Real-world use of polidocanol foam sclerotherapy for hemorrhoidal disease: insights from an international survey and systematic review with clinical practice recommendations", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Azka Mustaan", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40624403/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 07 Jul 2025"}, {"id": "40623139", "title_en": "Oral and Maxillofacial Manifestations of Gardner Syndrome: A Literature Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Luca Fiorillo", "abstract_en": "**Background And Objective:** Gardner syndrome (GS) is a rare autosomal condition of neoplasms and adenomatous polyps, particularly in the colon and rectum. If left untreated, these polyps develop into colon cancer. Thus, early diagnosis is crucial to improve prognosis among patients. However, the majority of the existing research is limited to single case studies, which lack generalizability. Therefore, this systematic review provides a thorough synthesis of GS-related dental symptoms along with diagnostic and treatment options, and outcomes in the published literature.\n\n**Methods:** A comprehensive literature search was conducted across 2 databases and the Google Scholar search engine. Case reports detailing oral symptoms in GS patients were included. The extracted information was synthesized using descriptive measures (frequencies and percentages) in a tabular format.\n\n**Results:** Of 676 studies, 33 studies were found eligible and evaluated statistically. GS has been investigated in 38 cases, with a larger prevalence among males than females. Mandibular osteomas/odontomas/dermoid cysts were the most frequently reported symptoms (84.21%). Teeth-related symptom was impacted teeth (50%), supernumerary teeth (23.68%), and missing teeth (18.42%). The predominant radiographic findings were osteomas (84.21%), followed by irregular and dense bony regions in the mandible (50%). In 23.68% of cases, osteoma was resected. Teeth extraction was performed in 21.05% of cases. In total, 5.26% had osteoma recurrence.\n\n**Conclusions:** Oral and maxillofacial features can serve as a significant diagnostic indicator for screening and subsequent confirmation of GS in affected patients, allowing for timely referral and care. Dental professionals must be properly trained to identify the dental and maxillofacial manifestations of the disease.", "abstract_zh": "**Background and objective：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Gardner syndrome, maxillofacial abnormalities, oral pathology, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40623139/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 07 Jul 2025"}, {"id": "40596934", "title_en": "Comparison of efficacy and safety between surgical and conservative treatments for hemorrhoids: a meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xiaoqiang Jia", "abstract_en": "**Objectives:** Hemorrhoids, a common anorectal condition, can be managed through surgical or conservative treatments. The aim of this meta-analysis is to compare the efficacy and safety of surgical and conservative treatments for hemorrhoids.\n\n**Methods:** A systematic search was conducted from of PubMed, Embase, the Cochrane Library, and Web of Science from their inception to September 25, 2024. Eligible studies compared surgical treatments with non-invasive conservative treatments in hemorrhoids. Statistical analyses included pooled odds ratios (ORs) and mean differences (MDs)/standard mean differences (SMDs) with 95% confidence intervals (CIs).\n\n**Results:** Seven studies, including 760 patients, were analyzed. Surgery achieved higher rates of complete symptom resolution than conservative therapy (OR = 2.96, 95% CI: 1.66-5.28, p < 0.001). Overall pain scores favored surgery (SMD = -0.93, 95% CI: 1.73 to -0.13, p = 0.02). Subgroup analysis showed clear superiority within four days (SMD = -1.26, 95% CI -1.84 to -0.68) but parity beyond ten days (SMD = 0.00, 95% CI -0.44 to 0.44; p = 0.99). Comparable patterns were observed in pregnant women with thrombosed external hemorrhoids. Rates of postoperative bleeding (OR: 1.09; 95% CI: 0.42 to 2.82, p = 0.86; I2 = 41%, p = 0.15) and urinary retention (OR: 1.75; 95% CI: 0.30 to 10.31, p = 0.54; I2 = 45%, p = 0.18) did not differ significantly between groups. Surgical-specific adverse events were infrequent (incontinence 3%, persistent pain 5%, watery discharge 6%). Surgery shortened recovery in pregnant thrombosed cases by approximately seven days (MD: -6.80; 95% CI: -7.64 to -5.96, p < 0.001; I2 = 55%, p = 0.14) and reduced overall recurrence (95% CI: 0.10 to 0.37, p < 0.001; I2 = 0%, p = 0.97).\n\n**Conclusion:** Surgical treatments provide superior symptom relief, faster recovery, and lower recurrence but with some specific post-treatment complications, while conservative treatments are safer and less invasive but with provides slower symptom relief and higher recurrence rates. Individualized treatment should consider symptom severity, patient preferences, and risk tolerance.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Conservative treatment, Hemorrhoids, Meta-Analysis, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40596934/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 02 Jul 2025"}]}, currentFeed: '', currentPapers: [], currentPaper: null,
