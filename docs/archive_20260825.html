sented. Mental health co-morbidities such as anxiety and depression were discussed but rarely transitioned to intervention. Psychological challenges included psychosexual anxiety and limited professional knowledge. Sociological challenges included navigating health services and social settings. Literature prioritized continence outcomes that diminished psychosocial complexities.\n\n**Conclusions:** The intersectionality, mental health concerns, and psychosocial experiences of adults born with anorectal malformation remain largely unknown. Allied health professionals such as social workers can improve ongoing support provision, with interventions that enhance psychosocial functioning and emotional wellbeing.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformation, Psychosocial functioning, Social work", "link": "https://pubmed.ncbi.nlm.nih.gov/41721863/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sat, 21 Feb 2026"}, {"id": "41692935", "title_en": "Intraluminal bypass devices as an alternative to defunctioning stoma in anterior resection: A systematic review of safety and feasibility", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ziqiang Wang", "abstract_en": "**Aim:** To systematically evaluate the safety and feasibility of intraluminal bypass devices (IBDs) as alternatives to defunctioning stoma for colorectal/coloanal anastomoses after anterior resection.\n\n**Method:** The present systematic review was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Endpoints were feasibility (placement, fixation, maintenance, removal) and safety (device-related events, postoperative morbidity and anastomotic leakage).\n\n**Results:** In total, 10 studies evaluating five types of IBDs were included in this systematic review. Each IBD had a head portion with a proximal fixation component and a tail portion consisting of a transanal endoluminal tubular sheath or tube for faecal diversion but with a distinct design. Device-related events included migration, sheath internalization, partial colonic wall erosions and enterocutaneous fistula. Overall postoperative complications were reported in 0-74% and anastomotic leakage in 0-32% across studies. Stoma avoidance ranged from 66.7% to 100%.\n\n**Conclusion:** IBDs are technically feasible and appear acceptably safe, with potential to reduce reliance on defunctioning stoma; however, evidence remains early and heterogeneous. Further studies are needed, and optimization of fixation and anti-migration strategies should be prioritized.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anastomosis protection device, anastomotic leakage, defunctioning stoma, low anterior resection, postoperative complications", "link": "https://pubmed.ncbi.nlm.nih.gov/41692935/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Sun, 15 Feb 2026"}, {"id": "41668163", "title_en": "Use of intraoperative ICG fluorescence angiography to reduce anastomotic leak in left-sided colorectal resections: A systematic review and meta-analysis of RCTs", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Muneer Junejo", "abstract_en": "**Aim:** Anastomotic leak remains a serious complication after left-sided colorectal resection with substantial morbidity, mortality and healthcare costs. This systematic review and meta-analysis evaluated whether intraoperative indocyanine green (ICG) fluorescence angiography reduces anastomotic leak rates in patients undergoing left-sided colorectal resections.\n\n**Methods:** A systematic search of major databases and trial registries was conducted for RCTs comparing ICG angiography with standard visual assessment in adults undergoing elective left-sided colorectal resection. The primary outcomes were overall and clinically significant (ISGRC Grade B/C) anastomotic leak. Risk ratios (RRs) were pooled using a random-effects model. Risk of bias was assessed with the Cochrane ROB2 tool.\n\n**Results:** Ten trials involving 3,772 patients were included. ICG fluorescence angiography, compared to control, reduced overall anastomotic leak (RR 0.62, 95% CI 0.53-0.73; I<sup>2</sup> = 0%; prediction interval 0.50-0.77) and clinically significant leak (RR 0.66, 95% CI 0.51-0.85; I<sup>2</sup> = 0%). Assuming a 10% baseline leak rate, ICG prevents one leak per 27 patients treated. Subgroup analysis showed benefit even when ICG did not prompt surgical plan modification (RR 0.67, 95% CI 0.50-0.90). Between-study heterogeneity was negligible across all analyses. ICG use did not prolong operating time and has reduced postoperative complications (RR 0.88, 95% CI 0.73-1.05).\n\n**Conclusion:** Intraoperative ICG fluorescence angiography significantly reduces anastomotic leak rates after left-sided colorectal resection, with consistent benefit across diverse surgical settings. The technology is practical and does not prolong operating time. ICG angiography should be considered a valuable adjunct in left-sided colorectal resections.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 对主要数据库和试验登记处进行了系统搜索，以比较 ICG 血管造影与接受选择性左侧结直肠切除术的成人标准视觉评估的随机对照试验。主要结局是总体上具有临床意义（ISGRC B/C 级）的吻合口瘘。使用随机效应模型汇总风险比（RR）。使用 Cochrane ROB2 工具评估偏倚风险。\n\n**结果：** 其中包括 10 项试验，涉及 3,772 名患者。与对照相比，ICG 荧光血管造影减少了总体吻合口瘘（RR 0.62，95% CI 0.53-0.73；I<sup>2</sup> = 0%；预测区间 0.50-0.77）和临床显着性漏（RR 0.66，95% CI 0.51-0.85；I<sup>2</sup> = 0%；预测区间 0.50-0.77）。我<sup>2</sup> = 0%）。假设基线泄漏率为 10%，ICG 每 27 名接受治疗的患者可防止 1 例泄漏。亚组分析显示，即使 ICG 没有促使手术计划修改，也能带来益处（RR 0.67，95% CI 0.50-0.90）。在所有分析中，研究间的异质性可以忽略不计。 ICG 的使用并没有延长手术时间，并减少了术后并发症（RR 0.88，95% CI 0.73-1.05）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anastomotic leak, colorectal surgery, fluorescence angiography, indocyanine green, meta‐analysis, perfusion assessment", "link": "https://pubmed.ncbi.nlm.nih.gov/41668163/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Tue, 10 Feb 2026"}, {"id": "41659148", "title_en": "Efficacy and safety of bipolar energy-based therapy for hemorrhoids: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Douglas G Adler", "abstract_en": "**Background:** Hemorrhoids arise from dilated vessels in the submucosal layer of the anorectal canal. Hemorrhoids are responsible for 4 million office and emergency visits annually in the US. Hemorrhoidal energy therapy (HET) is a novel nonsurgical, bipolar energy-based instrument for treating hemorrhoids. It has multiple benefits, such as requiring only a single session for resolution of symptoms, and minimizing heat-related collateral damage. However, there are limited data regarding the effectiveness and adverse events of HET. We performed the first systematic review to evaluate the efficacy and safety of HET in the treatment of internal hemorrhoids.\n\n**Methods:** A comprehensive search was performed from major databases to identify studies that investigated HET to treat hemorrhoids. The primary outcomes were technical success and clinical success. The secondary outcomes were total adverse events and individual adverse events, such as postprocedural bleeding and incontinence.\n\n**Results:** Eight studies with 512 patients were included in the meta-analysis. The average age was 55.6 years, and the majority of patients were female. Most patients presented with grade I and grade II hemorrhoids. The HET demonstrated technical and clinical success rates of 100% and 86.1%, respectively. All adverse events were determined to be mild, according to the ASGE lexicon, except for 1 case of perianal hematoma that required hospitalization.\n\n**Conclusion:** Our study demonstrates that HET is an effective and safe treatment for grade I and II internal hemorrhoids.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "双极能量疗法、痔疮能量疗法、内痔", "keywords_en": "Bipolar energy-based therapy, hemorrhoidal energy therapy, internal hemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/41659148/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 09 Feb 2026"}, {"id": "41645344", "title_en": "Evidence Suggests Prophylactic Antibiotics May Be Unnecessary in Anorectal Surgery-A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Andrew Hill", "abstract_en": "**Background:** Amid increasing global concerns regarding antimicrobial resistance, the routine use of prophylactic antibiotics in anorectal surgery has been questioned. In practice, prescribing practices vary widely among surgeons, highlighting the need for stronger evidence-based guidance. The aim of this study is to perform a systematic, critical assessment of the current literature to determine the role of prophylactic antibiotics in elective anorectal surgery.\n\n**Methods:** A comprehensive search of studies published between January 1980 and June 2025 was performed using PubMed, Embase, and Cochrane Library. The primary outcome was surgical site infection (SSI); secondary outcomes included systemic infection, wound dehiscence, abscess formation, bleeding, and recurrence. Study quality was assessed using the Cochrane RoB 2.0 tool for randomized controlled trials (RCTs) and the ROBINS-I tool for observational studies. The certainty of evidence was evaluated using the GRADE approach.\n\n**Results:** Nine studies including 2317 participants were included, and five were eligible for meta-analysis. Overall, prophylactic antibiotics were not associated with a significant reduction in postoperative infectious or wound-related complications in RCTs (RR 0.76, 95% CI 0.43-1.33, and p = 0.66, moderate GRADE certainty of evidence) or observational studies (RR 0.60 (95% CI 0.01-48.4) and p = 0.53, very low certainty). All studies concluded that routine antibiotic prophylaxis may be unnecessary in anorectal surgery.\n\n**Conclusion:** Current evidence does not support the routine use of prophylactic antibiotics in uncomplicated anorectal procedures. However, the certainty of evidence is limited by small sample sizes, methodological heterogeneity, and limited number of available studies. Large-scale randomized trials are required to strengthen this evidence base.\n\n**Trial Registration:** The review protocol was registered in the PROSPERO database CRD420251159850.", "abstract_zh": "**背景：** 随着全球对抗菌素耐药性的日益关注，在肛肠手术中常规使用预防性抗生素受到了质疑。在实践中，外科医生的处方做法差异很大，这突出表明需要更有力的循证指导。本研究的目的是对当前文献进行系统、严格的评估，以确定预防性抗生素在择期肛门直肠手术中的作用。\n\n**方法：** 使用 PubMed、Embase 和 Cochrane 图书馆对 1980 年 1 月至 2025 年 6 月期间发表的研究进行了全面检索。主要结局是手术部位感染（SSI）；次要结局包括全身感染、伤口裂开、脓肿形成、出血和复发。研究质量使用 Cochrane RoB 2.0 工具进行随机对照试验 (RCT) 评估，并使用 ROBINS-I 工具进行观察性研究。使用 GRADE 方法评估证据的确定性。\n\n**结果：** 纳入了 9 项研究，包括 2317 名参与者，其中 5 项研究符合荟萃分析条件。总体而言，在随机对照试验（RR 0.76，95% CI 0.43-1.33，p = 0.66，中等 GRADE 证据确定性）或观察性研究（RR 0.60（95% CI 0.01-48.4）和 p = 0.53，非常低确定性）中，预防性抗生素与术后感染或伤口相关并发症的显着减少无关。所有研究的结论是，在肛肠手术中常规抗生素预防可能是不必要的。\n\n**结论：** 目前的证据不支持在简单的肛肠手术中常规使用预防性抗生素。然而，证据的确定性受到样本量小、方法学异质性和可用研究数量有限的限制。需要进行大规模随机试验来加强这一证据基础。\n\n**Trial registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anorectal diseases, antibiotic prophylaxis, hemorrhoidectomy, surgical site infection", "link": "https://pubmed.ncbi.nlm.nih.gov/41645344/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 06 Feb 2026"}, {"id": "41640613", "title_en": "Is salvage treatment necessary after incomplete resection of rectal neuroendocrine tumors: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Seun Ja Park", "abstract_en": "**Background:** Incomplete resection of rectal neuroendocrine tumors (NETs), defined by positive or indeterminate margins or lymphovascular invasion, raises concerns regarding residual disease and recurrence. However, the benefits of salvage treatment in these cases remain unclear.\n\n**Aim:** To evaluate the oncologic impact of salvage treatment compared with observation after incomplete endoscopic resection of rectal NETs through a systematic review and meta-analysis.\n\n**Methods:** We conducted a systematic review and meta-analysis in accordance with the preferred reporting items for systematic reviews and meta-analyses guidelines. MEDLINE, EMBASE, and the Cochrane Library were searched from their inception until May 2025. Eligible studies included patients with incompletely resected rectal NETs managed with salvage treatment or observation, reporting outcomes of residual tumors or recurrence. Pooled estimates were calculated using random-effects models with Hartung-Knapp adjustments.\n\n**Results:** Thirty-four studies with 2279 cases of incomplete endoscopic resection met the inclusion criteria. The incomplete resection rates differed markedly according to the initial resection method (17 studies): 73.1% for cold snare polypectomy, 29.8% for conventional endoscopic mucosal resection (EMR), 28.4% for modified EMR, and 14.7% for endoscopic submucosal dissection. Among the 19 studies that evaluated salvage treatment, the pooled residual tumor rate was 25.0% [95% confidence interval (CI): 12.0%-40.0%]. The crude recurrence rates from 31 studies favored salvage treatment over observation (0.96% <i>vs</i> 2.96%, <i>P</i> = 0.003). However, a meta-analysis of nine comparative studies found no statistically significant difference in recurrence risk (odds ratio = 0.89; 95%CI: 0.40-2.02).\n\n**Conclusion:** Given the relatively high residual tumor rate and low incidence of recurrence, salvage treatment may be justified as both a diagnostic and therapeutic approach after incomplete resection of rectal NETs. Although its benefits in preventing recurrence remain unclear, clinical decisions should be individualized, as these findings are based on low-certainty evidence.", "abstract_zh": "**背景：** 直肠神经内分泌肿瘤（NET）的不完全切除（定义为阳性或不确定的切缘或淋巴血管侵犯）引起了对残留疾病和复发的担忧。然而，在这些病例中挽救治疗的益处仍不清楚。\n\n**Aim：** 通过系统评价和荟萃分析，与直肠 NET 不完全内镜切除术后观察相比，评估挽救治疗的肿瘤学影响。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 鉴于相对较高的残余肿瘤率和较低的复发率，挽救治疗可能是直肠 NET 不完全切除后的一种诊断和治疗方法。尽管其预防复发的益处尚不清楚，但临床决策应个体化，因为这些发现基于低质量证据。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Neuroendocrine tumors, Observation, Rectum, Residual neoplasm, Salvage therapy", "link": "https://pubmed.ncbi.nlm.nih.gov/41640613/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 05 Feb 2026"}, {"id": "41629638", "title_en": "Fecal incontinence after prostate cancer irradiation: a systematic literature review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jean-Michel Hannoun-Levi", "abstract_en": "**Goal:** Fecal incontinence (FI) is an underrecognized but clinically significant late gastrointestinal toxicity following radiotherapy (RT) for prostate cancer. This systematic review aimed to synthesize current knowledge on the definition and pathophysiology of post-radiation anal continence, as well as prevention strategies, technical considerations, and therapeutic approaches.\n\n**Method:** A systematic literature search was conducted according to PRISMA guidelines using the keywords: \"Fecal incontinence,\" \"Radiation therapy,\" and \"Prostatic neoplasms.\" Eligible studies included randomized phase III trials and prospective or retrospective series reporting on FI after definitive or adjuvant/salvage prostate RT. Fifty-four articles were included in the final analysis.\n\n**Results:** FI after prostate RT results from functional, morphological, and neurogenic alterations of the anorectal system. Reported incidence ranges from 1 to 12%, most often presenting as flatulence or liquid stool leakage, while severe forms requiring pads are uncommon. Variability is largely explained by heterogeneity in definitions and assessment tools, as no standardized scoring system is universally applied. Risk factors include advanced age, prior abdominal surgery, vascular comorbidities, chronic inflammatory bowel disease, hemorrhoids, and rectal urgency during RT. Dosimetric analyses indicate that low-to-intermediate doses to the anal canal and high doses to the rectum contribute differentially to FI. Based on current evidence, the mean dose to the anal canal should be kept below 37 Gy, though further studies are needed to define precise constraints for both structures. Preventive strategies such as MRI-based contouring and endorectal balloon placement, perirectal hydrogel spacers placement show promise. Management is multidisciplinary, including dietary measures, medications, pelvic floor therapy, neuromodulation, and, in severe cases, diversion procedures.\n\n**Conclusion:** FI after prostate RT is likely underestimated due to the absence of a standardized assessment. Developing a validated, universally applicable scoring system is a priority to improve evaluation, enable cross-study comparisons, refine preventive measures, and guide therapeutic strategies.", "abstract_zh": "**Goal：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41629638/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 02 Feb 2026"}, {"id": "41611909", "title_en": "Indocyanine green fluorescence to prevent anastomotic leak in colorectal surgery: an updated systematic review and meta-analysis on randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Antonino Spinelli", "abstract_en": "**Background:** In light of the recent publication of two multicentric controlled trials, this systematic review and meta-analysis aims to update the evidence of the efficacy of Indocyanine Green fluorescence angiography in preventing the risk of anastomotic leak after colorectal surgery.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL databases were searched for randomized controlled trials using relevant keywords from 2015 until September 2025. The outcomes were the overall rate of anastomotic leaks, the rate of reoperations, and the rate of intraoperative surgical strategy changes.\n\n**Results:** Ten randomized controlled trials were selected, including 4.885 patients, 2.432 (49.7%) who received intraoperative ICG assessment and 2.453 (50.3%) who underwent standard white light assessment. The studies displayed a moderate risk of bias and were included in the meta-analysis. The ICG group showed a reduced rate of anastomotic leak (OR = 0.64; p < 0.0001; high evidence) compared with the standard dressing group and a higher rate of changes in surgical strategy (OR = 7.50; p = 0.02; moderate evidence), while no difference was found in the rate of reoperations (OR = 0.94; p = 0.64; moderate evidence). A subgroup analysis showed reduced anastomotic leak rates in left colon (p = 0.003) and rectal resection (p = 0.0002) and no differences after right colon surgery (p = 0.94).\n\n**Conclusions:** This systematic review and meta-analysis supports the use of ICG to reduce the anastomotic leak rate in colorectal surgery, in particular in left-sided and rectal resections.", "abstract_zh": "**背景：** 鉴于最近发表的两项多中心对照试验，这项系统评价和荟萃分析旨在更新吲哚菁绿荧光血管造影在预防结直肠手术后吻合口瘘风险方面的功效证据。\n\n**方法：** 使用相关关键词检索MEDLINE、EMBASE和CENTRAL数据库中2015年至2025年9月的随机对照试验。结果为吻合口瘘总体发生率、再次手术率和术中手术策略改变率。\n\n**结果：** 选择了10个随机对照试验，包括4.885名患者，其中2.432名（49.7%）接受术中ICG评估，2.453名（50.3%）接受标准白光评估。这些研究显示出中等偏倚风险，并被纳入荟萃分析。与标准敷料组相比，ICG组吻合口瘘发生率降低（OR = 0.64；p < 0.0001；高证据），手术策略改变率较高（OR = 7.50；p = 0.02；中等证据），而再次手术率没有差异（OR = 0.94；p = 0.64；中等证据）。亚组分析显示左结肠（p = 0.003）和直肠切除（p = 0.0002）吻合口漏率降低，右结肠手术后无差异（p = 0.94）。\n\n**结论：** 这项系统评价和荟萃分析支持使用 ICG 来降低结直肠手术中的吻合口漏率，特别是在左侧和直肠切除术中。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anastomotic leak, Colorectal surgery, Indocyanine green fluorescence angiography", "link": "https://pubmed.ncbi.nlm.nih.gov/41611909/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 29 Jan 2026"}, {"id": "41604561", "title_en": "Colitis cystica profunda: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Priyanka Kanth", "abstract_en": "Colitis cystica profunda (CCP) is an uncommon, benign colorectal lesion that can mimic malignancy. We conducted a systematic review of histologically confirmed CCP case reports and series to define epidemiology, presentation, diagnostic yield, management, and outcomes. Following PRISMA 2020, Embase, PubMed/MEDLINE, Web of Science, and CINAHL were searched (1965-2025); two reviewers independently screened studies and extracted demographic, clinical, imaging, histologic, treatment, and outcome data. Sixty-five studies (92 patients) met criteria. Mean age was 40 ± 12 years (median 39), and 54% were male. Rectal bleeding (70%), mucus discharge (32%), diarrhea (24%), and abdominal/rectal pain (26%) were most common; 12% were asymptomatic. Lesions were predominantly distal (rectum 61%), and superficial biopsies reached the submucosa in only 32%, contributing to frequent sampling error; Endoscopic ultrasound (EUS) and cross-sectional imaging typically showed submucosal cystic lesions with intact muscularis propria. Conservative and medical therapy were each attempted in 16% of patients, endoscopic resection in 14%, and surgery in 67%, most commonly local transanal/perineal excision (40% of surgeries) or segmental/partial colectomy (32% of surgeries). Dysplasia was reported in 10% and coexisting invasive adenocarcinoma in 4% at diagnosis; no subsequent malignant transformation was reported over a median follow-up of 8.4 months. Post-operative morbidity occurred in 5% and recurrence in 4%. CCP is a rare but important mimic of colorectal cancer; diagnosis is optimized with deep tissue sampling and high-resolution imaging. When feasible, organ-preserving endoscopic or local excision can achieve durable symptom resolution with low morbidity while avoiding unnecessary radical surgery.", "abstract_zh": "深部囊性结肠炎 (CCP) 是一种罕见的良性结直肠病变，可能类似于恶性肿瘤。我们对组织学证实的 CCP 病例报告和系列进行了系统回顾，以确定流行病学、表现、诊断率、管理和结果。 PRISMA 2020 之后，检索了 Embase、PubMed/MEDLINE、Web of Science 和 CINAHL（1965-2025 年）；两名评审员独立筛选研究并提取人口统计、临床、影像、组织学、治疗和结果数据。 65 项研究（92 名患者）符合标准。平均年龄为 40±12 岁（中位数 39 岁），其中 54% 为男性。最常见的是直肠出血（70%）、粘液排出（32%）、腹泻（24%）和腹部/直肠疼痛（26%）； 12%无症状。病变主要位于远端（直肠 61%），浅表活检仅到达粘膜下层，仅 32%，导致频繁出现采样错误；超声内镜 (EUS) 和横截面成像通常显示粘膜下囊性病变，固有肌层完整。 16% 的患者尝试了保守治疗和药物治疗，14% 的患者尝试了内镜切除术，67% 的患者尝试了手术，最常见的是局部经肛门/会阴切除术（占手术的 40%）或节段/部分结肠切除术（占手术的 32%）。据报道，诊断时 10% 存在不典型增生，4% 存在共存浸润性腺癌；中位随访时间为 8.4 个月，未报告随后发生恶变。术后发病率为 5%，复发率为 4%。 CCP 是一种罕见但重要的结直肠癌类似物；通过深层组织采样和高分辨率成像优化诊断。在可行的情况下，保留器官的内窥镜或局部切除术可以以较低的发病率实现持久的症状缓解，同时避免不必要的根治性手术。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colitis cystica profunda, endoscopic resection, mucous colitis, rectal bleeding, submucosal cysts", "link": "https://pubmed.ncbi.nlm.nih.gov/41604561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 28 Jan 2026"}, {"id": "41586878", "title_en": "Metronidazole is an effective method of analgesia following haemorrhoidectomy: a systematic review and meta-analysis", "title_zh": "甲硝唑是痔切除术后镇痛的有效方法：系统评价和荟萃分析", "authors": "Christina A Fleming", "abstract_en": "**Background:** Haemorrhoids are one of the most frequently encountered benign anorectal conditions that negatively impact patients' quality of life. Excisional haemorrhoidectomy (closed or open) is a surgical procedure reserved for the treatment of third- and fourth-degree haemorrhoids, with considerable post-procedure pain reported. The aim of this study was to clarify the association between post operative metronidazole use (both oral and topical) and post-haemorrhoidectomy pain scores through systematic review and meta-analysis of randomised controlled trials (RCTs).\n\n**Methods:** This study was guided by the Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) guidelines. Prospective registration was performed on PROSPERO (CRD42024580928). A systematic review was performed for RCTs reporting post-haemorrhoidectomy pain scores between patients who received metronidazole and patients who received placebo. Meta-analysis was performed using RevMan version 5.4.\n\n**Results:** Seventeen RCTs including 1297 participants were eligible for inclusion. Metronidazole administration was associated with significantly lower post-operative visual analogue scores (VAS) on day 1 (-1.18, p < 0.00001), day 2 (-1.15, p = 0.003), day 3 (-0.86, p < 0.00001), and day 7 post-operatively with a mean pain score difference of -1.72 (95% CI -2.27 to -1.18) (p < 0.00001). A significant difference in pain scores was seen on day 3 favouring topical metronidazole in comparison to the oral route (1.38, 95% CI [0.44, 2.32], p = 0.004).\n\n**Conclusion:** This review synthesises the best available evidence to support the use of metronidazole to reduce pain after excisional haemorrhoidectomy. While both oral and topical forms appear to be beneficial, topical administration appears to have a more effective analgesic effect from post-operative day 3.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 本研究以系统评价和荟萃分析首选报告项目 (PRISMA) 指南为指导。在 PROSPERO (CRD42024580928) 上进行了前瞻性注册。对报告接受甲硝唑的患者和接受安慰剂的患者之间痔疮切除术后疼痛评分的随机对照试验进行了系统评价。使用 RevMan 5.4 版进行荟萃分析。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Haemorrhoids, Metronidazole, RCT", "link": "https://pubmed.ncbi.nlm.nih.gov/41586878/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 26 Jan 2026"}, {"id": "41554450", "title_en": "Salvia plebeia R.Br.: A comprehensive review of its ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wei Jiang", "abstract_en": "**Ethnopharmacological Relevance:** Salvia plebeia R.Br. (Lamiaceae), the dried aerial parts, has been traditionally used across China and East/South Asia to treat sore throat, bronchitis, nephritis edema, abscesses, mastitis, hemorrhoids, and bleeding disorders, consistent with traditional indications of heat-clearing, detoxifying, cooling blood, and promoting diuresis.\n\n**Aim Of The Review:** This study provides a systematic overview of the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications of S. plebeia, while highlighting current research gaps and future perspectives.\n\n**Materials And Methods:** A comprehensive literature search was conducted using multiple scientific databases, including Web of Science, PubMed, Elsevier, ACS, CNKI, and Google Scholar, covering publications from database inception to October 2025. Relevant information on the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and applications of S. plebeia was systematically collected, screened, and synthesized according to predefined inclusion/exclusion criteria.\n\n**Results:** To date, 325 constituents have been identified, dominated by flavonoids, phenolic acids, terpenoids, volatile oils, sterols, lignans, and others. Extracts and purified compounds show tradition-relevant anti-inflammatory, antiviral, immunoregulatory, and antioxidant activities, while other reported effects (hepatoprotective, hypolipidemic, cardiovascular-protective, sedative/anticonvulsant, anticancer, and anti-photoaging) are presented as exploratory findings. Quality evaluation evolved from UV and HPLC to UPLC-MS fingerprinting using flavonoids and sesquiterpenes as markers. In practical applications, S. plebeia has been used in medicinal preparations for the management of pharyngitis, bronchitis, nephritis, dermatitis, and anorectal inflammation. In food sector, it has been developed into functional products, including health teas, chewable or effervescent tablets, composite beverages, and co-fermented vinegars.\n\n**Conclusion:** Although S. plebeia shows broad pharmacological potential, current investigations remain constrained by incomplete chemical space coverage, limited pharmacokinetic and toxicological characterization, and insufficient well-designed clinical evidence. Future research should focus on comprehensive constituent profiling, mechanism-oriented validation aligned with traditional indications, standardized quality markers/fingerprints, and rigorous PK-toxicology-clinical translation, to promote safe, effective, and evidence-based utilization of S. plebeia in medicine and functional food development.", "abstract_zh": "**Ethnopharmacological relevance：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim of the review：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 尽管S. plebeia显示出广泛的药理学潜力，但目前的研究仍然受到化学空间覆盖不完整、药代动力学和毒理学特征有限以及精心设计的临床证据不足的限制。未来的研究应侧重于全面的成分分析、与传统适应症相一致的机制导向验证、标准化的质量标记/指纹以及严格的PK-毒理学-临床转化，以促进普雷贝亚在医学和功能性食品开发中的安全、有效和循证利用。", "keywords_zh": "当前应用、民族药理学、药理活性、植物化学、质量控制、Salvia plebeia R.Br。", "keywords_en": "Current applications, Ethnopharmacology, Pharmacological activity, Phytochemistry, Quality control, Salvia plebeia R.Br.", "link": "https://pubmed.ncbi.nlm.nih.gov/41554450/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Mon, 19 Jan 2026"}, {"id": "41535511", "title_en": "Long-term outcomes of stapled haemorrhoidopexy versus conventional haemorrhoidectomy: An updated systematic review, meta-analysis and trial-sequential analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Roberto Cirocchi", "abstract_en": "**Purpose:** Stapled haemorrhoidopexy (SH) offers well-established short-term advantages over conventional haemorrhoidectomy (CH), but its long-term effectiveness remains controversial. This systematic review and meta-analysis aimed to compare long-term outcomes of SH versus CH in adult patients with grade II-IV haemorrhoids, incorporating Trial Sequential Analysis (TSA).\n\n**Methods:** MEDLINE, EMBASE and CENTRAL were searched from January 2001 to October 2025 for randomized controlled trials (RCTs) comparing SH and CH with a minimum follow-up of 12 months. Two reviewers independently performed study selection, data extraction and risk-of-bias assessment (RoB-2). Primary outcomes included recurrence, reintervention, anal function, and quality of life (QoL). Pooled risk ratios (RRs) with 95% confidence intervals (CIs) were calculated using random-effects models. TSA was applied to overall recurrence.\n\n**Results:** Seventeen RCTs including 1,041 SH and 1,031 CH patients were analysed. SH was associated with a higher risk of overall recurrence compared with CH (RR = 1.56,95%CI = 1.00-2.44;I<sup>2</sup> = 48%). TSA showed that the accrued information size (1,913 patients) did not reach the required information size (2,608 patients), indicating that current evidence remains underpowered. Prolapse-related recurrence was significantly more frequent after SH (RR = 3.28,95%CI = 1.49-7.25;I<sup>2</sup> = 12%), whereas bleeding-related recurrence did not differ between groups (RR = 1.20,95%CI = 0.63-2.26;I<sup>2</sup> = 23%). No significant differences were found for reintervention, persistent anal pain, functional impairment or QoL.\n\n**Conclusion:** SH is associated with a higher risk of long-term recurrence, particularly prolapse-related recurrence, compared with CH, while long-term pain, functional outcomes and QoL appear broadly comparable. These findings suggest that, although SH may remain an option for selected patients, CH provides more durable anatomical correction, and procedural choice should balance early recovery against long-term durability.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 检索了 2001 年 1 月至 2025 年 10 月期间 MEDLINE、EMBASE 和 CENTRAL 中比较 SH 和 CH 的随机对照试验 (RCT)，随访时间至少为 12 个月。两名评审员独立进行研究选择、数据提取和偏倚风险评估（RoB-2）。主要结局包括复发、再次干预、肛门功能和生活质量 (QoL)。使用随机效应模型计算具有 95% 置信区间 (CI) 的合并风险比 (RR)。 TSA 应用于总体复发情况。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Circular stapler, Ferguson, Haemorrhoidectomy, Haemorrhoids, Harmonic scalpel, LigaSure, Milligan-Morgan, PPH, Stapled haemorrhoidopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/41535511/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Wed, 14 Jan 2026"}, {"id": "41503542", "title_en": "Arterial Embolization for the Internal Hemorrhoids Management: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hadi Rokni Yazdi", "abstract_en": "**Background And Aims:** Hemorrhoids are common vascular structures that can become symptomatic when prolapsed, representing the most prevalent benign anorectal condition worldwide. Despite affecting up to 11% of the population with symptoms including pain, bleeding, and discomfort, hemorrhoids remain underdiagnosed and often inappropriately managed. This systematic review aimed to evaluate the efficacy, clinical outcomes, and morbidity of endovascular artery embolization in hemorrhoids.\n\n**Method:** Up to August 2022, PubMed, Scopus, Web of Science, and Embase were searched comprehensively. All studies had eligible criteria included, except review articles, articles published in a language other than English, and case reports or series of cases. Two independent reviewers performed a literature review and data extraction. Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) 2020 checklist was used for quality assessment.\n\n**Results:** The systematic review included 15 studies. The patient's age ranged from 40.5 ± 9.51 to 72.2 ± 10.9. Eleven studies mentioned the sample size as gender-specific, with 57.89% (<i>n</i> = 187/323) male patients. The embolic site involved in embolization, according to the frequency, was 424 patients for the superior rectal artery in all studies, and coils and micro coils were utilized as Embolic material in most cases. No major complication or death was noted in 12 studies. The most frequent complications were postoperative pain and tenesmus, bleeding, ulceration and fibrotic scars, and low-grade fever. In 11.79% (<i>n</i> = 27/229) of patients re-embolization and after-treatment surgery were due to surgical failure and symptom recurrence, such as bleeding.\n\n**Conclusion:** Rectal artery embolization using microcoils, embolic particles, or a combination is a new method for managing internal hemorrhoids with proper clinical efficacy without significant complications. QoL score has improved after emborrhoid, and most cases had a lower bleeding score.", "abstract_zh": "**Background and aims：** 痔疮是常见的血管结构，脱垂时可能会出现症状，是全世界最常见的良性肛门直肠疾病。尽管有多达 11% 的人口出现疼痛、出血和不适等症状，但痔疮的诊断率仍然较低，而且往往治疗不当。本系统评价旨在评估血管内动脉栓塞治疗痔疮的疗效、临床结果和发病率。\n\n**Method：** 截至2022年8月，PubMed、Scopus、Web of Science、Embase均被全面检索。所有研究均包含合格标准，但评论文章、以英语以外的语言发表的文章以及病例报告或系列病例除外。两名独立评审员进行了文献评审和数据提取。系统评价和荟萃分析的首选报告项目 (PRISMA) 2020 检查表用于质量评估。\n\n**结果：** 系统评价包括 15 项研究。患者年龄为40.5±9.51岁至72.2±10.9岁。 11 项研究提到样本量具有性别特异性，其中 57.89% (<i>n</i> = 187/323) 为男性患者。所有研究中涉及栓塞的栓塞部位为直肠上动脉424例，栓塞材料大多采用弹簧圈和微弹簧圈作为栓塞材料。 12 项研究中未发现重大并发症或死亡。最常见的并发症是术后疼痛和里急后重、出血、溃疡和纤维化疤痕以及低烧。 11.79%（<i>n</i> = 27/229）的患者再次栓塞和治疗后手术是由于手术失败和出血等症状复发。\n\n**结论：** 使用微弹簧圈、栓塞颗粒或其组合进行直肠动脉栓塞是一种治疗内痔的新方法，具有良好的临床疗效，且无明显并发症。痔疮术后生活质量评分有所改善，大多数病例的出血评分较低。", "keywords_zh": "栓塞, 痔疮, 痔疮, 痔动脉, 直肠动脉", "keywords_en": "embolization, emborrhoid, hemorrhoid, hemorrhoidal artery, rectal artery", "link": "https://pubmed.ncbi.nlm.nih.gov/41503542/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Thu, 08 Jan 2026"}, {"id": "41450176", "title_en": "Worldwide prevalence of haemorrhoids: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Pouyan Ebrahimi", "abstract_en": "**Background:** Haemorrhoidal disease (HD) is one of the most common anorectal disorders globally, significantly impacting individuals' quality of life and productivity. Despite its importance, global prevalence remains unclear due to limited population-specific studies. This study aimed to systematically assess the global prevalence of HD through a systematic review and meta-analysis.\n\n**Methods:** We conducted a systematic review and meta-analysis by searching PubMed, Scopus, Embase, Web of Science, and Google Scholar up to March 31, 2025, without language restrictions. Studies reporting prevalence of haemorrhoids in general, clinical, or high-risk populations were included. Exclusion criteria comprised studies lacking total sample size, focusing on other anorectal conditions, or using duplicate or insufficient data. Four independent reviewers extracted and appraised study quality using the Joanna Briggs Institute tool. The primary outcome was pooled point prevalence of HD, analyzed using a random-effects model with 95% confidence intervals (CIs). The study was registered in PROSPERO (CRD420251045600).\n\n**Results:** From 6,312 records, 150 studies (210 datasets) comprising 8,960,338 individuals were included. The global pooled point prevalence was 25.92% (95% CI: 22.62-29.22). Lifetime prevalence was 27.19% (95% CI: 14.77-39.60), and one-year prevalence was 21.65% (95% CI: 14.33-28.97). Prevalence was higher in women (27.33%, 95% CI: 21.84-32.82) than in men, and highest in the African region 28.07% (95% CI: 15.34-40.79). Invasive diagnostic methods (28.05%, 95% CI: 23.86-32.26) yielded higher prevalence estimates than non-invasive methods. Also, factors showing associations with HD in unadjusted analyses include older age, obesity, pregnancy, diabetes, family history, constipation, and hypertension.\n\n**Conclusion:** HD remains a prevalent condition globally, with minor variation across regions. The burden is consistent regardless of socioeconomic context. Diagnostic method and population characteristics influence prevalence estimates. These findings underscore the importance of targeted prevention and early intervention strategies, especially for at-risk groups.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Haemorrhoids, epidemiology, haemorrhoid, meta-analysis, prevalence", "link": "https://pubmed.ncbi.nlm.nih.gov/41450176/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260824212914&v=2.20.1", "date": "Fri, 26 Dec 2025"}, {"id": "41444098", "title_en": "Clinical factors affecting the therapeutic dose window in cervical cancer brachytherapy: A systematic review and meta-regression", "title_zh": "影响宫颈癌近距离放射治疗治疗剂量窗的临床因素：系统评价和荟萃回归", "authors": "Nick J van de Berg", "abstract_en": "**Background And Purpose:** Although dose planning aims in cervical cancer brachytherapy are well-defined, variability in clinical practices makes it difficult to draw generalizable conclusions on achievable dosimetry. This review and meta-regression aim to assess clinical practices in terms of their therapeutic dose window, that is, the balance between target and organs-at-risk (OAR) doses.\n\n**Materials And Methods:** A search of the literature was performed in Scopus, PubMed, and Web of Science databases. Peer-reviewed articles were included that described planning constraints and reported high-risk clinical target volume (CTV<sub>HR</sub>) D<sub>90%</sub> and OAR [Formula: see text] for intracavitary (IC) tandem and ring (T&R) / tandem and ovoid (T&O) / mold (M) applicators, possibly supplemented with interstitial (IS) needles (+N). To determine factors associated with target volume coverage (D<sub>90%</sub>) and OAR sparing ( [Formula: see text] ), multivariate meta-regressions were performed.\n\n**Results:** Out of 1590 articles, 34 met the full inclusion criteria. In most studies, the CTV<sub>HR</sub>D<sub>90%</sub> aimed at ≥84-86 Gy EQD2<sub>α/β = 10Gy</sub>, and constraints for the OARs were 80-90 Gy, 65-75 Gy and 70-75 Gy EQD2<sub>α/β = 3Gy</sub> for the bladder, rectum and sigmoid [Formula: see text] , respectively. Studies using IC/IS applicators were associated with a ∼4 Gy increase in CTV<sub>HR</sub>D<sub>90%</sub> compared to IC only, with no effect on OAR dose. T&R studies achieved improvements of 3.2 Gy and 2.8-3.4 Gy at typical planning aims in comparison with T&O applicators in target and OAR doses. In 100% (15/15) of patient groups treated with T&R + N both CTV<sub>HR</sub> and OAR objectives were met for the population average. For T&R, T&O, and T&O + N groups, this was the case in 89% (8/9), 43% (6/14), and 50% (4/8), respectively.\n\n**Conclusion:** Studies using interstitial needles with T&R applicators in MR-guided brachytherapy for cervical cancer seem to be associated with a favorable therapeutic target dose/OAR sparing ratio.", "abstract_zh": "**背景与目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 在 1590 篇文章中，有 34 篇符合完全纳入标准。在大多数研究中，CTV<sub>HR</sub>D<sub>90%</sub>的目标是≥84-86 Gy EQD2<sub>α/β=10Gy</sub>，OAR的限制为膀胱、直肠和乙状结肠80-90 Gy、65-75 Gy和70-75 Gy EQD2<sub>α/β=3Gy</sub> [式：见正文] 分别。与仅使用 IC 相比，使用 IC/IS 施药
