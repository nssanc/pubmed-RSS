e know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** PAVFCOS 首次确立了对储袋肛瘘和阴道瘘患者重要的结果。 PAVFCOS 应用于介入研究，以在这种具有挑战性的情况下引入急需的结果报告标准化。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "core outcome set, ileoanal pouch, inflammatory bowel disease, patient‐reported outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/40780867/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 08 Aug 2025"}, {"id": "40693967", "title_en": "Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jiawen Wang", "abstract_en": "**Background:** The transanal opening of intersphincteric space (TROPIS) is a new surgical modality for treating anal fistulas. This procedure involves a transanal incision between the sphincters to promote drainage, excision of the infected areas, and maintenance of sphincter patency. In this meta-analysis, we evaluated the efficacy and safety of TROPIS in treating high complex anal fistula.\n\n**Methods:** We searched the PubMed (NLM), LISTA (EBSCO), and Web of Science Core Collection (Clarivate) databases for all related clinical research literature on highly complex anal fistulas treated with TROPIS from the time of database creation to 31 December 2024, with inclusion restricted to studies published in English. All included articles follow the PICO principle. Data on surgical one-time cure rate, recurrence rate after the first surgery, final cure rate, and occurrence of adverse events were extracted for further analysis.\n\n**Results:** Six studies involving 499 patients were included. The heterogeneity test revealed no heterogeneity, and results for one-time cure rate showed I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (effect size [ES] = 0.80, 95% confidence interval [CI] (0.77, 0.84), Z = 45.96, P = 0.00), where the one-time cure rate was 80%; recurrence rate after first surgery I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00), and the recurrence rate is 20%; final cure rate I 2  = 0.00% < 50%, and Q test P = 0.82 > 0.1 (ES = 0.89, 95% CI (0.86, 0.92), Z = 51.21, P = 0.00), and the final cure rate was 89%. No adverse events were reported in any of the patients. Sensitivity analyses showed excellent stability of the surgical cure results in all studies. No publication bias was detected in any of the included studies.\n\n**Conclusions:** The TROPIS procedure for highly complex anal fistulas exhibits a high one-time cure rate, low recurrence rate, and high overall cure rate and is not associated with any adverse events.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 纳入了涉及 499 名患者的六项研究。异质性检验显示无异质性，一次性治愈率结果显示 I 2 = 0.00% < 50%，Q 检验 P = 0.81 > 0.1（效应量 [ES] = 0.80，95% 置信区间 [CI] (0.77, 0.84)，Z = 45.96，P = 0.00），其中一次性治愈率为80%；首次手术后复发率 I 2 = 0.00% < 50%，Q 检验 P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00)，复发率为 20%；最终治愈率 I 2 = 0.00% < 50%，Q 检验 P = 0.82 > 0.1（ES = 0.89，95% CI（0.86，0.92），Z = 51.21，P = 0.00），最终治愈率为 89%。所有患者均未报告不良事件。敏感性分析显示所有研究中手术治愈结果均具有出色的稳定性。在所有纳入的研究中均未发现发表偏倚。\n\n**结论：** TROPIS手术治疗高度复杂的肛瘘具有一次性治愈率高、复发率低、总体治愈率高且无任何不良事件的特点。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, high complex anal fistula, meta-analysis, systematic review, transanal opening of intersphincteric space (TROPIS)", "link": "https://pubmed.ncbi.nlm.nih.gov/40693967/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 22 Jul 2025"}, {"id": "40672439", "title_en": "Diagnosis and treatment for anal fistula: a systematic review of clinical practice guidelines and consensus statements", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Rong Shi", "abstract_en": "**Background:** Anal fistula constitutes a pathological channel originating either from the anal canal or rectum to the skin surrounding the anus, primarily characterized by recurrent pain, purulent discharge, and pruritus. This study aims to compare and standardize the recommendations for the diagnosis and treatment of anal fistula, drawing on contemporary clinical practice guidelines.\n\n**Methods:** A comprehensive search was conducted across multiple databases including PubMed, EMBASE, China National Knowledge Infrastructure, Wanfang Database, Chinese Science and Technology Periodical Database, and Chinese Biological Medicine Database, from their inception through April 1, 2024. The objective was to collate all published guidelines on anal fistula. The quality of the eligible guidelines was appraised by two reviewers using the Appraisal of Guidelines for Research and Evaluation II instrument.\n\n**Results:** The search yielded fifteen guidance documents -comprising nine guidelines and six consensus statements -each offering specific recommendations. Twelve of these documents address screening and diagnosis of anal fistula, while all fifteen discuss various treatment and management strategies. Document analysis highlighted MRI as the predominant diagnostic recommendation. Treatment and management strategies were categorized into four categories: preoperative management, surgical method selection, pharmacological interventions, and postoperative management. Regarding surgical interventions, all guidelines address incision and drainage of fistulas. Most guidelines offer a low recommendation for cutting setons, mainly attributed to the presence of incontinence. For high-positioned anal fistula, a push-pull flap procedure is recommended, whereas the LIFT procedure is advocated for newly identified, high, and sphincter-penetrating fistulas. Among the 15 guidelines and consensus statements evaluated in this study, more than half demonstrated methodological limitations, with particularly deficient performance in the applicability domain. As a critical determinant of implementation effectiveness, these deficiencies may undermine guidelines' capacity to optimize health outcomes.\n\n**Conclusion:** There is a pressing need for an updated search of potential evidence on the diagnosis and treatment of anal fistula. Effective diagnoses and therapeutic approaches, whether conventional or complementary and alternative medicine, should be thoroughly evaluated and incorporated based on robust evidence.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 迫切需要更新有关肛瘘诊断和治疗的潜在证据。有效的诊断和治疗方法，无论是传统医学还是补充和替代医学，都应基于强有力的证据进行彻底评估和整合。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, diagnosis, guidelines, systematic review, therapeutic", "link": "https://pubmed.ncbi.nlm.nih.gov/40672439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 17 Jul 2025"}, {"id": "40607121", "title_en": "Systematic review and meta-analysis of Transanal Opening of Intersphincteric Space (TROPIS) versus conventional treatments for anal fistula", "title_zh": "经肛门括约肌间间隙开放 (TROPIS) 与肛瘘常规治疗的系统评价和荟萃分析", "authors": "Jing Wang", "abstract_en": "Transanal Opening of Intersphincteric Space (TROPIS) has emerged as a promising surgical approach for anal fistula management over recent years. This meta-analysis comprehensively evaluates the comparative efficacy and safety of TROPIS versus conventional treatments through systematic analysis of 24 clinical studies involving 2813 patients. Through systematic searches across 7 major biomedical databases (including PubMed, EMBASE, and Chinese repositories) from inception to March 2024, we identified comparative studies assessing TROPIS against six established interventions: incision-thread-drawing, seton placement, LIFT, EAFR, fistulotomy, and incision-suture techniques. Pooled analysis demonstrated TROPIS achieved superior clinical outcomes, with a 3.15-fold higher total efficacy rate (95 % CI 1.22-8.13, <i>p</i> = 0.02) and 64 % lower complication risk compared to conventional methods (OR 0.28, 95 % CI 0.18-0.42, <i>p</i> < 0.00001). Sensitivity analyses confirmed result stability across study designs, while publication bias assessment via funnel plots and Egger's test revealed no significant distortion. Importantly, TROPIS maintained its advantage across various complication subtypes including incontinence (OR 0.31), infection (OR 0.27), and recurrence (OR 0.19). These findings establish TROPIS as a clinically superior alternative that significantly improves therapeutic outcomes while reducing procedure-related risks, suggesting its potential to become the new reference standard in anal fistula management. The consistent results across diverse patient populations and comparator procedures underscore the robustness of this evidence synthesis.", "abstract_zh": "近年来，经肛门括约肌间开放术（TROPIS）已成为治疗肛瘘的一种有前途的手术方法。这项荟萃分析通过对涉及 2813 名患者的 24 项临床研究的系统分析，全面评估了 TROPIS 与传统治疗的疗效和安全性比较。通过从成立到 2024 年 3 月对 7 个主要生物医学数据库（包括 PubMed、EMBASE 和中国存储库）的系统检索，我们发现了评估 TROPIS 与六种既定干预措施的比较研究：切口挂线、挂线放置、LIFT、EAFR、瘘管切开术和切口缝合技术。汇总分析表明，TROPIS 取得了优异的临床效果，与传统方法相比，总有效率提高了 3.15 倍（95% CI 1.22-8.13，<i>p</i>=0.02），并发症风险降低了 64%（OR 0.28，95% CI 0.18-0.42，<i>p</i><0.00001）。敏感性分析证实了整个研究设计的结果稳定性，而通过漏斗图和艾格检验进行的发表偏倚评估显示没有明显的失真。重要的是，TROPIS 在各种并发症亚型中保持了其优势，包括失禁 (OR 0.31)、感染 (OR 0.27) 和复发 (OR 0.19)。这些研究结果表明 TROPIS 是一种临床上优越的替代方案，可显着改善治疗结果，同时降低手术相关风险，表明其有可能成为肛瘘治疗的新参考标准。不同患者群体和比较程序的一致结果强调了这一证据综合的稳健性。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Meta-analysis, TROPIS, Transanal Opening of Intersphincteric Space", "link": "https://pubmed.ncbi.nlm.nih.gov/40607121/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 03 Jul 2025"}, {"id": "40590873", "title_en": "Endoscopic Submucosal Dissection and Transanal Endoscopic Microsurgery in the Treatment of Rectal Neuroendocrine Tumors: Systematic Review and Meta-Analysis of the Observational Studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Andrzej Białek", "abstract_en": "**Introduction:** Rectal neuroendocrine tumors (rNETs) are subepithelial lesions with potential of malignancy. Despite the guidelines recommending that rNETs measuring 10-20 mm should be removed either endoscopic submucosal dissection (ESD) or transanal endoscopic microsurgery (TEM), the management with these entities is still a clinical dilemma. We performed a meta-analysis to compare ESD and TEM regarding method effectiveness and safety in the treatment of rNETs.\n\n**Methods:** PubMed/MEDLINE/Embase/EBSCO/CINAHL was searched up for observational studies analyzing the efficacy and safety of both methods in the treatment of rNETs.\n\n**Results:** A total of 59 observational studies with a total of n = 2,804 participants were included. In a subgroup analysis, we demonstrated that the R0 resection rate was significantly ( P = 0.002) lower for ESD (rate: 0.854) than for TEM (0.924). The recurrence rate differed significantly ( P = 0.008); the lowest (event rate [ER] = 0.015) was found for ESD and the highest for TEM (ER = 0.035). The overall bleeding rate was 0.046 and perforation rate was 0.023 and no significant differences ( P = 0.274 for bleeding, P = 0.808 for perforation) were found by intervention type. The rate of other complications (wound dehiscence, soilage, incontinence, rectovaginal fistula, pelvic pain, retroperitoneal emphysema, coagulation syndrome) was significantly ( P = 0.000) higher for TEM (ER = 0.107) than ESD (ER = 0.013). We also included 4 comparative studies with 490 patients. Using random-effects analysis, we found that the risk ratio for R0 resection was approximately 10% lower for ESD. Our analysis showed significantly greater size ( P = 0.01) and follow-up ( P = 0.03) in the group treated with TEM.\n\n**Discussion:** The efficacy of TEM is higher than ESD with a higher risk of complications in this method. Lesions with a greater size are treated with TEM, and recurrence rate is greater for this procedure. Long follow-up is needed after the treatment of rNETs to detect the recurrence early.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 检索了 PubMed/MEDLINE/Embase/EBSCO/CINAHL 的观察性研究，分析这两种方法治疗 rNET 的有效性和安全性。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "ESD、TEM、rNET、直肠神经内分泌肿瘤、治疗", "keywords_en": "ESD, TEM, rNETs, rectal neuroendocrine tumors, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40590873/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 01 Jul 2025"}, {"id": "40585484", "title_en": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Li Xu", "abstract_en": "**Introduction:** The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\n**Material And Methods:** A thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\n**Results:** A total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\n**Conclusion:** The available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please t ficacy and safety of primary surgical repair of adult-acquired recto-urethral fistulas. We conducted a comprehensive bibliographic search of MEDLINE, Scopus, and Web of Science Core Collection databases in August 2024, following the PRISMA guidelines. A total of 10 studies, covering over 500 patients, were included in our review. The most common surgical approach used was the transperineal technique with gracilis muscle flap interposition. Findings indicate higher complication rates and diminished healing in irradiated patients compared to non-irradiated counterparts. Although transperineal approaches generally resulted in high success rates irradiated individuals frequently required additional surgeries or definitive urinary diversion. Further research is required to establish evidence-based guidelines for optimal management, particularly for complex cases involving radiation-induced recto-urethral fistulas.", "abstract_zh": "直肠尿道瘘是一种罕见且具有挑战性的疾病，可能是先天性的，也可能是由于各种前列腺和盆腔干预措施（例如根治性前列腺切除术和放射治疗）引起的。这种情况通常表现为气尿、粪尿和尿路感染等症状。尽管这种情况很少见，但由于标准化治疗方案缺乏共识，特别是对于有放射史的患者，这种情况带来了重大的临床管理挑战。本研究旨在系统回顾关于成人获得性直肠尿道瘘初次手术修复的有效性和安全性的现有文献。我们遵循 PRISMA 指南，于 2024 年 8 月对 MEDLINE、Scopus 和 Web of Science 核心合集数据库进行了全面的书目检索。我们的综述中总共纳入了 10 项研究，涵盖 500 多名患者。最常用的手术方法是经会阴技术插入股薄肌瓣。研究结果表明，与未受辐射的患者相比，受辐射患者的并发症发生率更高，愈合速度也更差。尽管经会阴方法通常具有较高的成功率，但受辐射的个体经常需要额外的手术或明确的尿流改道。需要进一步的研究来建立基于证据的最佳治疗指南，特别是对于涉及辐射引起的直肠尿道瘘的复杂病例。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40579441/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 27 Jun 2025"}, {"id": "40518593", "title_en": "Outcomes of Fecal Diversion in Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Nik Sheng Ding", "abstract_en": "**Objectives:** Perianal fistulizing Crohn's disease (pfCD) is a severe type of inflammatory bowel disease resulting in significant patient morbidity. Despite advancements in treatments, pfCD remains challenging to manage with low healing rates. Fecal diversion (FD) has previously demonstrated clinical improvement for patients with refractory disease. Our meta-analysis aimed to explore the clinical response to FD, rates of successful restoration of bowel continuity after FD, rates of re-diversion, and factors affecting the success of FD in pfCD.\n\n**Methods:** A systematic review and meta-analysis was carried out of adult patients who had undergone FD for pfCD, with detailed patient outcome data. Studies were identified through a literature search of six bibliographic databases and one trial register, all run on February 28, 2025, including MEDLINE ALL, EMBASE, Emcare, APA PsycInfo, CINAHL, Cochrane Library, and Clinicaltrials.gov.\n\n**Results:** Seventeen studies encompassing 714 adult pfCD patients were included. FD resulted in a 65% clinical improvement rate, yet considerable heterogeneity existed in study methodologies and outcome definitions. While 29% of patients achieved bowel restoration within a median follow-up of 58.2 months, challenges in sustaining the effects were evident, with 10% requiring repeat diversion and a 37% overall proctectomy/proctocolectomy rate. Factors associated with diversion success included the absence of rectal involvement and quiescent luminal disease, with biologic use showing no impact on outcomes.\n\n**Conclusions:** FD offers symptom control in pfCD, although restoration rates remain low. These findings emphasize the need for individualized patient counseling. Future research should strive for uniform measures and refined approaches to enhance pfCD management.", "abstract_zh": "**Objectives：** 肛周瘘管克罗恩病 (pfCD) 是一种严重的炎症性肠病，可导致患者严重发病。尽管治疗方法取得了进步，但 pfCD 的治疗仍然具有挑战性，且治愈率较低。粪便改道（FD）先前已证明对难治性疾病患者有临床改善。我们的荟萃分析旨在探讨 pfCD 中 FD 的临床反应、FD 后肠道连续性成功恢复率、再改道率以及影响 FD 成功的因素。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 纳入了 17 项研究，涉及 714 名成年 pfCD 患者。 FD 的临床改善率为 65%，但研究方法和结果定义存在相当大的异质性。虽然 29% 的患者在中位随访时间 58.2 个月内实现了肠道恢复，但维持效果的挑战是显而易见的，其中 10% 需要重复改道，总体直肠切除术/直肠结肠切除术率为 37%。与改道成功相关的因素包括没有直肠受累和静止性管腔疾病，生物制剂的使用对结果没有影响。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "fecal diversion, inflammatory bowel diseases, perianal fistulizing Crohn's disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40518593/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 16 Jun 2025"}, {"id": "40474832", "title_en": "Comment on \"Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Libo Zhou", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40474832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 06 Jun 2025"}, {"id": "40442569", "title_en": "Systematic review and network meta-analysis of cryptoglandular complex anal fistula treatment: evaluation of surgical strategies", "title_zh": "隐腺复杂性肛瘘治疗的系统回顾和网络荟萃分析：手术策略评估", "authors": "Natalia Uribe Quintana", "abstract_en": "**Background:** Several surgical approaches are available for managing complex cryptoglandular perianal fistulas. However, a gold standard surgical technique has not yet been established. This network meta-analysis aims to assess and compare postoperative failure and anal incontinence pooled rates for different available surgical techniques for complex cryptoglandular anal fistulas.\n\n**Methods:** Systematic searches were carried out on Pubmed, Ovid, the Cochrane Library database and ClinicalTrials.gov up to June 2023. All randomized comparative trials of nine surgical techniques for cryptoglandular complex perianal fistulas in adult patients were included. A systematic review and network meta-analysis was conducted using the PRISMA-NMA methodology. The endorectal advancement flap was used as the control technique, and the odds ratios (ORs) were calculated through pairwise and network meta-analysis with random effects.\n\n**Results:** 16 randomized trials were included in this study. Network meta-analysis was conducted for each outcome. Techniques, such as cutting seton, fistulotomy with sphincter reconstruction, LIFT, and VAAFT, obtained similar results in terms of technique failure to the transanal advancement flap with no statistically significant differences. PLUG (OR = 3.6 [95%CI 1.1-11.5]), fibrin glue (OR = 7.5 [95%CI 2.2-25], and platelet-rich plasma (PRP) (OR = 11.5[95%CI 1.3-99]) demonstrated a statistically significant increase in the pooled failure rate. For anal incontinence, only the cutting seton technique exhibited a higher risk of postoperative incontinence (OR = 8.6 [95%CI 1-72.5]).\n\n**Conclusion:** Our research highlights effective therapeutic approaches for complex anal fistulas, stressing the need to customize treatment based on location, anatomy, patient characteristics, and preferences. However, it advises against using plugs, fibrin glue, PRP therapy due to lower healing rates, and the seton technique because of its potential impact on anal continence. PROSPERO number CRD42022304345.", "abstract_zh": "**背景：** 有几种手术方法可用于治疗复杂的隐窝腺周瘘。然而，金标准手术技术尚未建立。该网络荟萃分析旨在评估和比较复杂隐腺肛瘘的不同可用手术技术的术后失败和肛门失禁汇总率。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal incontinence, Complex anal fistula, Network meta-analysis, Persistence, Recurrence, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40442569/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 29 May 2025"}, {"id": "40392371", "title_en": "Failure rates and complications of four sphincter-sparing techniques for the treatment of fistula-in-ano: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "G Pellino", "abstract_en": "**Background:** Several techniques are available to reduce the risk of sphincter injury when treating anal fistula, such as ligation of the intersphincteric fistula tract (LIFT), video-assisted anal fistula treatment (VAAFT), fistula laser closure (FiLaC) and endoanal flap (EAF). The aim of this meta-analysis is to provide data on the safety, complications and failure of these techniques.\n\n**Methods:** Studies published after 2017, with patients undergoing at least one among LIFT, VAAFT, FiLaC and EAF for perianal fistula and providing data regarding failure, were retrieved from PubMed and EMBASE. Primary outcome was failure; other outcomes included continence disturbance and complications.\n\n**Results:** Forty-nine articles with 3520 patients were included. The failure rates were 28.6% (range 3.8-75) for LIFT, 22.3% (6.2-65.2) for VAAFT, 43.9% (11.1-80) for FiLaC and 25.9% (4.7-100) for EAF, with a mean follow-up of 35.4 (6-80.4), 32.4 (6-48), 31.6(6.3-60) and 42.4 (12-155) months. The available network meta-analysis on failure showed RD of -0.08 (95% CI - 0.58 to 0.42) comparing LIFT vs VAAFT and 0.30 (95% CI 0.03 to 0.58) comparing LIFT vs EAF. No patients undergoing VAAFT or FiLaC reported worsening continence, while for LIFT and EAF, the continence disturbance rate was 1.5% and 7.3%, respectively. No major complications were observed. The most common minor complications were pain (1.4%), bleeding (1.1%) and wound infection (1.2%). Overall, minor complication rates were 4.3% for LIFT, 7.2% for VAAFT, 10.2% for FiLaC and 6.2% for EAF. Crohn's disease was associated with a higher failure rate (39.5% vs 31.4%).\n\n**Conclusions:** FiLaC, VAAFT, LIFT and EAF may represent a valid option in the treatment of anal fistula. VAAFT showed the lowest rate of failure but with no differences from network metanalysis. Wider homogeneous studies with long-term follow-up are necessary to obtain more robust data.\n\n**Prospero Number:** CRD42022375600.", "abstract_zh": "**背景：** 有几种技术可以降低治疗肛瘘时括约肌损伤的风险，例如括约肌间瘘道结扎（LIFT）、视频辅助肛瘘治疗（VAAFT）、瘘管激光闭合（FiLaC）和肛内皮瓣（EAF）。这项荟萃分析的目的是提供有关这些技术的安全性、并发症和失败的数据。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Prospero number：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Complications, Endoanal flap, FILAC, LIFT, Recurrence, VAAFT", "link": "https://pubmed.ncbi.nlm.nih.gov/40392371/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 20 May 2025"}, {"id": "40353830", "title_en": "Early Resuturing versus expectant Management for Perineal Wound Dehiscence: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Debjyoti Karmakar", "abstract_en": "**Background And Objective:** Perineal wound dehiscence is a common complication of vaginal birth that impacts maternal well-being and quality of life. This systematic review compares early resuturing with expectant management in the treatment of perineal wound dehiscence.\n\n**Methods:** We searched Ovid MEDLINE, CINAHL, and PubMed databases, and hand-searched recent reviews and relevant studies. Human prospective and retrospective studies, randomized controlled trials (RCTs), and case series evaluating early resuturing within the postnatal period were included. Two reviewers independently assessed the studies for outcomes and risk of bias. The primary outcome was healing time; secondary outcomes included dyspareunia, long-term symptoms, functional outcomes, infection rates, and anal sphincter injury.\n\n**Results:** Thirteen studies (1987-2022) were included: three RCTs, four prospective cohort studies or case series, and six retrospective studies-heterogeneity in study designs and outcomes limited data synthesis. Early resuturing was associated with reduced healing time, particularly for wounds not involving the anal sphincter, but increased the risk of complications such as fistula formation. Many studies emphasized meticulous preoperative wound care.\n\n**Conclusions:** Limited evidence suggests that early resuturing may reduce healing time without increasing wound infection risk. However, the increased risk of complications necessitates cautious application and highlights the importance of preoperative wound care. Further robust research is needed, although challenging to conduct. Alternative analytical methods, such as data mining and decision tree algorithms, should be explored. Based on current evidence, clinicians should carefully individualize recommendations on the benefits and risks of early resuturing.", "abstract_zh": "**Background and objective：** 会阴伤口裂开是阴道分娩的常见并发症，影响产妇的健康和生活质量。本系统综述比较了会阴伤口裂开治疗中的早期缝合与期待治疗。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 有限的证据表明，早期重新缝合可能会缩短愈合时间，而不会增加伤口感染的风险。然而，并发症风险的增加需要谨慎使用，并凸显了术前伤口护理的重要性。尽管进行起来具有挑战性，但仍需要进一步强有力的研究。应探索替代分析方法，例如数据挖掘和决策树算法。根据目前的证据，临床医生应仔细针对早期再缝合的益处和风险提出个性化建议。", "keywords_zh": "早期缝合、会阴裂开、会阴伤口破裂、产后", "keywords_en": "early resuturing, perineal dehiscence, perineal wound breakdown, postpartum", "link": "https://pubmed.ncbi.nlm.nih.gov/40353830/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 12 May 2025"}, {"id": "40325545", "title_en": "The Current Applications in Surgery of Three-Dimensional Modelling Technology for Complex Fistula-In-Ano: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Roland Shannon", "abstract_en": "**Background:** Complex fistula-in-ano (FIA) poses significant clinical challenges due to its intricate anatomy and high recurrence rates. Traditional imaging techniques like MRI are limited by their two-dimensional (2D) nature, prompting the use of three-dimensional (3D) modeling for enhanced visualization.\n\n**Methods:** This systematic review, adhering to PRISMA guidelines, analysed 17 studies using 3D models for surgical planning, education, and patient engagement in managing complex FIA. A risk of bias assessment was conducted using the Cochrane Risk of Bias Tool for randomized studies and ROBINS-I for non-randomized studies, revealing that all included studies had at least a moderate risk of bias.\n\n**Results:** Three-dimensional models improved anatomical visualization compared to 2D MRI, potentially enhancing surgical planning accuracy and reducing recurrence rates. They also offered educational benefits for surgeons and patients. However, the evidence is limited by methodological weaknesses such as small sample sizes and subjective outcome measures.\n\n**Conclusion:** Three-dimensional modelling technology shows promise in improving surgical precision and patient outcomes for complex FIA, but further high-quality research is needed to validate its clinical utility due to methodological weaknesses in current studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 这项系统综述遵循 PRISMA 指南，分析了 17 项使用 3D 模型进行手术规划、教育和患者参与管理复杂 FIA 的研究。使用 Cochrane 偏倚风险工具进行随机研究，使用 ROBINS-I 进行非随机研究进行偏倚风险评估，结果显示所有纳入的研究至少具有中等偏倚风险。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "fistula‐in‐ano, patient education, surgical education, surgical planning, three‐dimensional modelling", "link": "https://pubmed.ncbi.nlm.nih.gov/40325545/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Tue, 06 May 2025"}, {"id": "40315877", "title_en": "Isolated perianal Crohn's disease: a systematic review and expert consensus proposing novel diagnostic criteria and management advice", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "TOpClass Collaborators", "abstract_en": "Perianal fistulae can present a diagnostic challenge when distinguishing perianal Crohn's disease from idiopathic perianal fistulae. This distinction is key, as perianal Crohn's disease requires inflammatory bowel disease (IBD) therapy, whereas idiopathic perianal fistulae are primarily managed surgically. When luminal inflammation is absent, but Crohn's disease is suspected, the term isolated perianal Crohn's disease is sometimes applied. However, no formal guidance exists for diagnosing or managing isolated perianal Crohn's disease. Furthermore, whereas fistula granuloma might provide specific evidence of Crohn's disease, they are rarely detected in perianal fistulae, so are unlikely to sensitively delineate aetiology. This project aimed to develop an opinion-based framework for isolated perianal Crohn's disease. A systematic review evaluated clinical features suggestive of isolated perianal Crohn's disease and evidence for IBD therapies in patients with perianal fistulae without luminal IBD. The findings of this systematic review informed a multidisciplinary consensus process with IBD specialists, resulting in the formulation of diagnostic criteria and management recommendations for isolated perianal Crohn's disease. We then tested this diagnostic approach in a prospective cohort of 50 patients treated as having idiopathic perianal fistulae at a proctology referral centre, identifying six (12%) individuals as meeting the diagnostic criteria. Our findings underscore the scarcity of evidence guiding isolated perianal Crohn's disease diagnosis and the need for a composite risk-based assessment. The proposed framework provides a tool for clinical practice and research but requires validation and refinement. Clear communication with patients is essential, given the diagnostic and therapeutic uncertainties. Future studies should refine these criteria, explore biological markers for isolated perianal Crohn's disease, and establish evidence-based methods to differentiate isolated perianal Crohn's disease within the perianal fistulae spectrum.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40315877/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 02 May 2025"}, {"id": "40269939", "title_en": "Fish bone migration: complications, diagnostic challenges, and treatment strategies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jichuan Chen", "abstract_en": "**Background:** Fish bone impaction in the pharynx is a common otolaryngological emergency. However, if the fish bone perforates the pharyngeal wall or the gastrointestinal wall and migrates to the neck tissues or organs, entering the lungs, mediastinum, heart, liver, biliary tract, spleen, pancreas, or other structures, or damages major blood vessels in the thoracic or abdominal cavities, it can lead to severe complications. This condition is rare and dangerous, potentially resulting in a series of serious complications, including neck abscess, thyroid abscess, thrombosis or air embolism of the cervical vessels, esophageal perforation, rupture of major mediastinal vessels, mediastinitis, aorto-esophageal fistula, lung abscess, spinal injury, sepsis, splenic abscess, hepatic abscess, anal fistula, and it may even be misdiagnosed as a tumor.\n\n**Objective:** This narrative review synthesizes evidence on fish bone translocation complications to (1) identify high-risk clinical presentations, (2) guide site-specific imaging selection, and (3) inform multidisciplinary management strategies.\n\n**Methods:** Use the keyword \"fishbone\" to systematically search articles from PubMed、CNKI and Embase databases from 1972 to 2024. Review all original articles and include them in this review where appropriate. This narrative review synthesizes evidence from case reports and observational studies to explore complications and management of fish bone translocation in uncommon sites. Given the predominance of heterogeneous case reports, a formal systematic review with meta-analysis was not feasible; however, we employed systematic search strategies to minimize selection bias.\n\n**Conclusion:** To avoid severe complications, it is crucial to provide comprehensive information on the management of fish bone impaction. When fish bone removal cannot be achieved using laryngoscopy, prompt and decisive surgical intervention is required to extract the foreign body.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** 这篇叙述性综述综合了鱼骨易位并发症的证据，以（1）识别高风险的临床表现，（2）指导特定部位的影像学选择，以及（3）为多学科管理策略提供信息。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "并发症、鱼刺、胃肠道异物、咽部异物", "keywords_en": "Complications, Fishbone, Gastrointestinal foreign body, Pharyngeal foreign body", "link": "https://pubmed.ncbi.nlm.nih.gov/40269939/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 24 Apr 2025"}, {"id": "40210078", "title_en": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "TOpClass collaborative authors", "abstract_en": "**Background & Aims:** Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\n**Methods:** The study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\n**Results:** A radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\n**Conclusions:** This international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "abstract_zh": "**Background & aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 这一国际德尔菲共识标准化了 pfCD 的放射学终点，提高了临床和研究环境的一致性。未来的研究将验证这一定义，并评估放射学变化如何预测长期临床结果和生活质量的改善。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40210078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Thu, 10 Apr 2025"}, {"id": "40205247", "title_en": "Systematic review and meta-analysis of the efficacy and safety of stem cell treatment of anal fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "S D Wexner", "abstract_en": "**Background:** Since anal fistulas can be challenging to treat; numerous innovative treatments have been proposed, including stem cell therapy. This systematic review aimed to assess pooled rates of fistula healing and adverse events associated with stem cell treatment.\n\n**Methods:** In this PRISMA-compliant systematic review we searched PubMed and Scopus for observational and randomized studies reporting outcomes of stem cell treatment for anal fistulas. The main outcome measures were successful healing and adverse effects of stem cell therapy.\n\n**Results:** In total, 43 studies incorporating 1160 patients (53.6% male) were included. Underlying fistula etiologies were Crohn's disease (30 studies) and cryptoglandular disease (12 studies). The main origin of stem cells was from adipose tissue (34 studies) or bone marrow (6 studies). The median follow-up duration was 12 months. The combined overall pooled healing rate was 58.1% (95% confidence interval (CI) 51.5-64.7%). The pooled healing rate for Crohn's fistulas was 60.4% (95% CI 54.7-66.2%) with adipose-derived stem cells and 63.6% (95% CI 49.4-77.7%) with bone-marrow-derived cells. The pooled healing rate for cryptoglandular fistulas was 53.8% (95% CI 35.5-72.2%) with adipose-derived stem cells. The pooled complication rate was 37.3% (95% CI 27.1-47.5%). Stem cells were associated with higher odds of anal fistula healing (odds ratio (OR): 1.81, p = 0.003) and similar odds of complications (OR: 1, p = 0.986) compared with controls.\n\n**Conclusions:** Stem cell treatment of anal fistulas was associated with promising results. The healing rate in Crohn's anal fistulas was higher than in cryptoglandular fistulas. Bone-marrow-derived stem cells were associated with marginally better outcomes than were adipose-derived cells. This finding suggests that the autoimmune inflammatory etiology of Crohn's disease may respond better to autologous myoblasts than does the infectious etiology of cryptoglandular fistulas.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an erro ", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gabriëlle H van Ramshorst", "abstract_en": "**Aim:** Worldwide, of all cancers, colorectal cancer has the fourth highest rate of mortality. Curative treatment for locally advanced or recurrent rectal cancer can require extended resections with sacrectomy, but this sugery can have major consequences for patients. The aim of this study was to investigate the oncological and functional outcomes after sacrectomy in patients with colorectal cancer.\n\n**Method:** The protocol was registered in (PROSPERO), the international prospective register of systematic reviews. PubMed, Embase, The Cochrane Library, Scopus and Google Scholar were searched using a predetermined search strategy. Article selection, quality of evidence [Grading of Recommendation, Assessment, Development and Evaluation (GRADE)] and risk of bias [The Risk Of Bias In Non-randomized Studies-of Interventions (ROBINS-I)] were assessed by two independent reviewers. Studies reporting on sacrectomy for colorectal cancer were included. Oncological and functional outcomes after sacrectomy for colorectal cancer were the primary outcomes.\n\n**Results:** Forty-six articles with 1687 patients (1115 men; 506 women) were included. Median follow-up was 31.4 months. Mean 30-day mortality was 1.1%. After R0 resection, overall survival was achieved in 86.2%, 68.0% and 42.1% patients, and disease-free survival was achieved in 75.0%, 51.0% and 43.0% patients, respectively, after 1, 3 and 5 years. Survival rates were lower after R1 or R2 resection. Most patients reported elimination of or significantly reduced pain after surgery, and 82.2% were able to walk independently, without the use of assistive devices. More patients were dependent on walking-assist devices after high sacrectomy than after low sacrectomy. The most commonly reported bowel dysfunctions were bowel obstruction (22.3%) and fistula (4.6%). Bladder dysfunction was mainly reported as incontinence (8.3%) and neurogenic bladder (23.3%). No study included quality of life as an outcome.\n\n**Conclusions:** The mortality was limited, and the morbidity rates were in concordance with published literature. The results suggest that R0 resection has higher survival rates than R1/R2 resections. Both short- and long-term functional outcomes could have major impact on a patient's quality of life. Heterogeneity was high, and neither comparative analyses nor meta-analysis could be performed.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "colorectal cancer, functional outcomes, oncological outcomes, sacrectomy", "link": "https://pubmed.ncbi.nlm.nih.gov/40185644/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 04 Apr 2025"}, {"id": "40156066", "title_en": "Efficacy of mesenchymal stem cell-based therapies in the treatment of perianal fistulizing Crohn's disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jérémy Magalon", "abstract_en": "**Background:** Perianal lesions of Crohn's disease (CD) are complex and disabling conditions. Mesenchymal stem cell (MSC)-based therapies have emerged as an innovative approach in managing refractory perianal fistulizing CD. We conducted a systematic review and meta-analysis to describe and compare combined remission and clinical outcomes of MSC-based therapies, and then whether one approach stands out from the rest.\n\n**Methods:** We searched in MEDLINE, EMBASE and CENTRAL (up to December 31, 2023) all prospective studies assessing a local injection of MSC-based therapy in perianal fistulas of CD. The primary outcome was achievement of combined remission. MSC-based therapy strategies were compared.\n\n**Results:** Twenty-five studies were included in the meta-analysis, enrolling 596 patients with perianal fistulizing CD. The combined remission rate at 3, 6 and 12 months were 36.2% (95% confidence interval (CI), 24.5-49.7), 57.9% (95% CI 51.3-64.2) and 52% (95% CI 38.8-64.8), respectively. MSC-based therapies demonstrated a significant effect in achieving combined remission compared to placebo at 3 months (relative risk (RR) = 1.6; 95% CI 1.0-2.8) and at 6 months (RR = 1.5; 95% CI 1.1-1.9). At 6 months, the combined remission rate was 57.2% (95% CI 47.2-66.6) for adipose-derived stem cells (ASCs) and 55.7% (95% CI 26.4-81.5) for bone marrow-derived stem cells (BMSCs). In the network meta-analysis, allogeneic ASCs and BMSCs did not demonstrate superiority over each other (RR = 0.74; 95% CI 0.31-1.77).\n\n**Conclusion:** MSC-based therapies are effective for achieving combined remission of refractory and/or complex perianal fistulizing CD. The optimal efficacy effect is reached after 6 months of treatment. No superiority has yet been demonstrated between ASCs and BMSCs therapies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s ng with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\n**Conclusions:** The perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40155532/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "40125894", "title_en": "Fistulotomy versus fistulectomy for simple fistula-in-ano: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "单纯性肛瘘的瘘管切开术与瘘管切除术：随机对照试验的系统评价和荟萃分析", "authors": "Rebecca J Lendzion", "abstract_en": "**Background:** Perianal fistulas are a common anorectal pathology. The sphincter-cutting techniques of fistulectomy and fistulotomy are associated with high cure rates for low or simple fistula-in-ano, with negligible risk of incontinence. However, the superiority of either technique has not previously been conclusively demonstrated. The aim of this systematic review is to compare the outcomes of the two surgical techniques for the management of simple fistula-in-ano.\n\n**Methods:** A search of MEDLINE, EMBASE and Cochrane Databases for randomized controlled trials (RCT) comparing fistulotomy to fistulectomy for simple fistula-in-ano was conducted. The primary outcome was healing time; secondary outcomes included operative time, length of hospital stay, post-operative pain score, post-operative complications and fistula recurrence.\n\n**Results:** Thirteen RCTs meet inclusion criteria, comprising a total of 685 fistulectomy and 688 fistulotomy patients. There was no significant difference between the techniques for healing time (P = 0.15), operative time (P = 0.13), length of stay (P = 0.05), wound infection (P = 0.97), flatus or faecal incontinence (P = 0.35 and P = 0.70, respectively) or recurrence (P = 0.19). Post-operative pain at 24 h, assessed using a visual analogue scale, was significantly lower in the fistulectomy group (MD-0.49, 95% CI: -0.90, -0.08; P = 0.02), and we found significantly fewer post-operative bleeding complications in the fistulotomy group (OR: 3.81, 95% CI: 1.23, 11.80; P = 0.02).\n\n**Conclusion:** This systematic review did not find conclusive evidence of the superiority of either fistulectomy or fistulotomy in terms of healing time. The two statistically significant findings were lower post-operative pain scores with fistulectomy and reduced post-operative bleeding with fistulotomy.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, fistulectomy, fistulotomy, randomized controlled trials", "link": "https://pubmed.ncbi.nlm.nih.gov/40125894/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 24 Mar 2025"}, {"id": "40024986", "title_en": "A systematic review of outcome measurement instruments used in pouch anal and vaginal fistulae: a COSMIN-based analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Phil Tozer", "abstract_en": "**Purpose:** Pouch-related fistulae are devastating complications of ileoanal pouch surgery, which is performed to improve the quality of life (QoL) for patients who have had a proctocolectomy. Their management is limited by inconsistent evidence, including using poorly and heterogeneously defined outcomes. This study aims to identify all Outcome Measurement Instruments (OMIs) used in pouch fistula research, including Patient-Reported Outcome Measures (PROMs) and Clinician-Reported Outcome Measures (ClinROMs) and evaluate their quality using COSMIN guidelines to help select the best tool for a standardised core outcome measurement set in a future consensus study.\n\n**Methods:** A systematic review was conducted to identify all OMIs used in ileo-anal pouch fistulae studies, from MEDLINE, Embase, and the Cochrane Library. We evaluated existing OMIs based on COSMIN guidelines and used the GRADE approach to assess evidence quality. Results were synthesized narratively.\n\n**Results:** Among 91 studies, 13 OMIs were reviewed. Pouch-specific instruments performed poorly in key domains of reliability, validity, and responsiveness. Only 17.6% of studies assessed QoL using PROMs. The best-performing instruments were the SF-36 and IBDQ. The Ileoanal Pouch Syndrome Severity Score was the only pouch-specific instrument that involved patients in its development and although useful for pouch dysfunction, it lacks specific QoL assessment and was not validated in pouch-fistulae patients.\n\n**Conclusion:** Existing OMIs for pouch-related fistulae lack adequate measurement properties, with no PROMs specifically validated for QoL in this population and very few instruments involving patients in their development. There is an unmet need for a validated PROM specifically for QoL in pouch-related fistulae.", "abstract_zh": "**Purpose：** 储袋相关瘘管是回肠肛管储袋手术的严重并发症，该手术的目的是提高直肠结肠切除术患者的生活质量 (QoL)。他们的管理受到不一致的证据的限制，包括使用不明确且异质定义的结果。本研究旨在确定储袋瘘研究中使用的所有结果测量仪器 (OMIs)，包括患者报告的结果测量 (PROM) 和临床医生报告的结果测量 (ClinROM)，并使用 COSMIN 指南评估其质量，以帮助在未来的共识研究中选择标准化核心结果测量集的最佳工具。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "COSMIN，患者报告的结果测量，储袋瘘，储袋肛瘘，储袋阴道瘘", "keywords_en": "COSMIN, Patient reported outcome measures, Pouch Fistula, Pouch anal fistula, Pouch vaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40024986/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Sun, 02 Mar 2025"}, {"id": "39946821", "title_en": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "G S Octavius", "abstract_en": "**Introduction:** This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\n**Methods:** The protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\n**Results:** Of 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\n**Conclusion:** ADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations r techniques and outcomes following vaginoplasty. <b>Methods:</b> A systematic review was performed per PRISMA guidelines. Ovid MEDLINE, Ovid EMBASE, Cochrane, and Web of Science were queried for records pertaining to RVF repair following vaginoplasty. Study characteristics, operative details, and demographics were collected. Outcomes included RVF repair method, recurrence rate, and complications. <b>Results:</b> Among 282 screened citations, 17 articles representing 41 patients were included. Rectovaginal fistula repair methods identified included 4 conservative management approaches (n = 12 patients), primary closure with or without fistulectomy and ostomy (n = 22), 10 reconstructive surgical techniques (n = 18). The most common reconstructive techniques were V-Y full-thickness advancement with rectal flap (n = 5) and infragluteal fasciocutaneous flap (n = 4). Median time to recurrence was 6 months (interquartile range 7.5). Reported RVF repair complications included RVF recurrence (n = 5, 14.7%) and wound complication or dehiscence (n = 2, 5.88%). Three cases of RVF recurred after primary closure with or without fistulectomy and ostomy, while 2 cases of recurrence followed reconstruction. <b>Conclusion:</b> There remains a high level of variability in the approach to RVF repair following vaginoplasty. Reconstructive surgical techniques may be a more optimal solution without necessitating ostomies, but this decision must be considered in the context of RVF location, individual patient expectations, and clinical presentation.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "neovagina, rectovaginal fistula, surgical technique, transgender, vaginoplasty", "link": "https://pubmed.ncbi.nlm.nih.gov/39876853/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Wed, 29 Jan 2025"}, {"id": "39833536", "title_en": "Fistulae Secondary to Vaginal Pessary Use for Pelvic Organ Prolapse: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Thomas Giles Gray", "abstract_en": "**Introduction And Hypothesis:** Urogenital and rectovaginal fistulae are rare complications of pessary use for pelvic organ prolapse (POP). This systematic review investigates the prevalence of these complications in patients using pessary for POP, potential risk factors and approaches to their investigation and management.\n\n**Methods:** All studies in English reporting urogenital or rectovaginal fistulae secondary to pessaries for POP were eligible for inclusion. AMED, CINAHL, MedLine, Scopus and Web of Science databases were searched from inception to March 2024. Risk of bias was assessed using validated tools: Murad et al.'s tool for case series/reports and ROBINS-I for non-randomised studies. Quantitative synthesis of descriptive statistics and narrative summary were performed.\n\n**Results:** Two retrospective studies and 60 case series/reports were included, describing 76 fistulae (34 urogenital, 42 rectovaginal). The retrospective studies estimated the prevalence of fistulae to be 3%. Of reported fistulae, 45% occurred with Gellhorn, 16% with ring, 11% with shelf and 9% with cube pessaries. Fifty percent were associated with neglected pessary care. Conservative management resulted in size reduction or resolution in 69% of fistulae: this approach should be considered. Vaginal (88%) and abdominal (100%) vesicovaginal fistula repairs were successful. Diverting ostomies were popular for rectovaginal fistulae but often resulted in permanent stoma without reducing mortality, recurrence or repair failure. Colpocleisis represents an effective procedure for managing co-existing POP.\n\n**Conclusions:** The prevalence of fistulae from pessary use is likely < 1% but may rise to 3% with risk factors present, including Gellhorn pessaries and neglected care. Both conservative and surgical management are viable treatment options.", "abstract_zh": "**Introduction and hypothesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 所有报告继发于 POP 子宫托的泌尿生殖道或直肠阴道瘘的英文研究均符合纳入条件。 AMED、CINAHL、MedLine、Scopus 和 Web of Science 数据库的检索时间从开始到 2024 年 3 月。使用经过验证的工具评估偏倚风险：Murad 等人用于病例系列/报告的工具和用于非随机研究的 ROBINS-I 工具。进行了描述性统计和叙述性总结的定量综合。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Pelvic organ prolapse, Pessaries, Rectovaginal fistula, Systematic review, Vesicovaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39833536/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 20 Jan 2025"}, {"id": "39623055", "title_en": "Salvage irreversible electroporation for locally recurrent prostate cancer after definitive radiotherapy: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gencay Hatiboglu", "abstract_en": "**Background:** To systematically evaluate the available evidence regarding the effect of salvage irreversible electroporation (IRE) in patients with local recurrent prostate cancer (PCa) after definitive radiotherapy (RT).\n\n**Methods:** A systematic search was conducted in the electronic databases PubMed-MEDLINE and the Web of Science. The following search terms were used: \"irreversible electroporation AND recurrent prostate cancer\", ''salvage irreversible electroporation AND prostate cancer AND radiation\", \"nanoknife AND recurrent prostate cancer\", and ''salvage irreversible electroporation AND prostate cancer\" by combining PICO (population, intervention, comparison, and outcome) terms.\n\n**Results:** We identified 5 eligible studies. Following IRE, local oncological control was ranging from 67 to 78%. In-field and out-field lesion recurrences after IRE were ranging from 3 to 10% and from 8 to 14%, respectively. Only one study reported an overall metastasis-free survival rate of 91% and a 5-year progression-free survival rate of 60%. The post-IRE continence status ranged 73-100%. Two studies reported a decline in the proportion of patients maintaining erections sufficient for sexual intercourse and two studies reported 50% preservation of erection. The majority of complications were of a low-to-mild nature, classified as Clavien-Dindo grade I-II, with the exception of the development of a rectal fistula in a single case.\n\n**Conclusions:** IRE represents an alternative salvage treatment option for patients with localised recurrent PCa following RT. The procedure offers a favourable safety profile and effective preservation of urinary function. The oncological results are promising, but further investigation is required.", "abstract_zh": "**背景：** 系统评估关于挽救性不可逆电穿孔 (IRE) 对根治性放射治疗 (RT) 后局部复发性前列腺癌 (PCa) 患者效果的现有证据。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39623055/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Mon, 02 Dec 2024"}, {"id": "39422801", "title_en": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "肛周粘液性腺癌：一例报告和文献系统回顾", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\n**Methods:** A systematic PubMed and Scopus search was conducted, a propos of a case report.\n\n**Results:** One hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260824212603&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39360706", "title_en": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Cristina Alba", "abstract_en": "**Background:** Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\n**Objective:** This study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\n**Methods:** A systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\n**Results:** Twelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\n**Conclusion:** Evidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an
