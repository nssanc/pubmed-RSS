istula surgery\"", "title_zh": "《超越失禁：肛瘘术后性功能障碍的系统回顾和荟萃分析》特邀评论", "authors": "Samuel Eisenstein", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42562203/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 06 Aug 2026"}, {"id": "42404302", "title_en": "Diffusion tensor imaging of the pelvic floor muscles and pelvic organs: a systematic review", "title_zh": "盆底肌肉和盆腔器官的扩散张量成像：系统评价", "authors": "Yan Chen", "abstract_en": "**Purpose:** This paper provides a systematic review of the current applications of diffusion tensor imaging (DTI) in the imaging of pelvic floor-related anatomical structures and the assessment of microscopic pathological changes.\n\n**Methods:** A systematic search of the PubMed, EMBASE, and Cochrane Library databases was conducted, with a focus on studies involving the application of diffusion tensor imaging to pelvic organs and muscles. The search was conducted from the inception of each database through to 11 December 2025. The present study incorporated a range of research methodologies, including randomized controlled trials (RCTs) and observational studies. The screening and reporting phases of the study adhered to the PRISMA guidelines, while the quality assessment was conducted using the Oxford Centre for Evidence-Based Medicine (OEBM) evidence grading tool.\n\n**Results:** The final sample comprised a total of 30 studies. Of these, two studies reported the application of DTI on the anal canal and its diagnostic value for anal fistula. Five studies demonstrated the ability of DTI to visualize microstructural alterations in endometriosis and uterine fibroids by measuring uterine anisotropy fraction and fibre tracking. A total of 19 studies reported the utilization of DTI applications in the context of prostate and prostate tumor analysis. Four studies have documented its use in healthy pelvic muscles and pelvic floor dysfunction.\n\n**Conclusion:** The findings suggest that the application of diffusion tensor imaging metrics in the pelvic region may aid in the assessment of tissue microstructural disruption and the distinction between benign and malignant or inflammatory lesions through relevant parameters, thereby enhancing diagnostic specificity. As diffusion tensor imaging becomes increasingly utilized in imaging for treatment guidance, it is imperative to develop a comprehensive understanding of its application in the pelvic region.", "abstract_zh": "**Purpose：** 本文系统综述了弥散张量成像（DTI）在盆底相关解剖结构成像和微观病理变化评估中的应用现状。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "diffusion, diffusion tensor imaging, magnetic resonance imaging, pelvic floor, pelvic floor organ", "link": "https://pubmed.ncbi.nlm.nih.gov/42404302/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 06 Jul 2026"}, {"id": "42392439", "title_en": "Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul D Yagnik", "abstract_en": "**Background:** Traditional metrics for anal fistula surgery prioritize healing and continence, largely ignoring intimacy and psychosocial well-being. Addressing a critical literature gap, this novel systematic review and exploratory meta-analysis is the first to mathematically evaluate the sex-specific impacts of fistula surgery and seton placement on sexual function.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyzes-compliant search of PubMed, Embase, Scopus, and Cochrane databases identified studies using validated sexual indices: International Index of Erectile Function (IIEF) for males and the Female Sexual Function Index (FSFI), and targeted quality-of-life surveys for cryptoglandular or Crohn's-associated fistulas. This study uniquely pooled continuous pre- and postoperative functional data using standardized mean differences.\n\n**Results:** A total of 18 studies were included. The systematic review established a stark, previously unquantified sex dimorphism in surgical recovery. Definitive surgical cure yielded highly significant improvements in IIEF (male) by eradicating chronic suppuration (P <.001). Conversely, FSFI (female) showed negligible improvement or active deterioration, frequently complicated by anterior-tract dyspareunia. Furthermore, this review quantified the \"Seton Paradox:\" although loose setons successfully mitigate sepsis, cross-sectional pooling demonstrated that they inflict severe, statistically significant impairment on female sexual function (P =.02) and drive high rates of body-image avoidance across both genders. Crucially, the synthesis of patient-reported data revealed a systemic failure in informed consent, showing that 79% of patients never received preoperative sexual counseling.\n\n**Conclusion:** Anal fistula surgery inflicts a profound, sex-dimorphic toll on sexual function. As the first systematic review to objectively highlight this disparity and quantify the psychological burden of chronic setons, these findings mandate a clinical paradigm shift. Proactive counseling regarding dyspareunia, body image, and intimacy must become a mandatory component of preoperative informed consent.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Crohn’s disease, Dyspareunia, Quality of life, Sexual dysfunction", "link": "https://pubmed.ncbi.nlm.nih.gov/42392439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 02 Jul 2026"}, {"id": "41815267", "title_en": "Response to \"Comment on the systematic review of TROPIS for anal fistula\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815267/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41815266", "title_en": "Comment on the systematic review of TROPIS for anal fistula", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Prema Ram Choudhary", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815266/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41796653", "title_en": "Feasibility and safety of laparoscopic versus open repair for rectobulbar fistula in anorectal malformations: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vikesh Agrawal", "abstract_en": "**Background:** Laparoscopic-assisted Anorectoplasty (LAARP) for male recto-bulbar fistula (RBF) remains debated, with early reports describing approach-specific complications. Prior meta-analyses pooled heterogeneous Anorectal malformation (ARM) subtypes, limiting conclusions for RBF. We conducted an RBF-specific systematic review and meta-analysis comparing LAARP with posterior sagittal anorectoplasty (PSARP).\n\n**Methods:** PubMed/MEDLINE, Embase, Scopus, and Google Scholar were searched (2000-November 2025) for comparative studies of LAARP versus PSARP in male children with RBF. Risk of bias was assessed using the ROBINS-I tool. Random-effects meta-analyses in Jeffreys's Amazing Statistics Program (JASP) used log effect sizes for dichotomous outcomes and mean differences for operative time. Sensitivity analyses excluded studies with zero events in both arms.\n\n**Results:** Six observational cohort studies (278 patients; LAARP 154, PSARP 124) were included. No intraoperative complications or conversions to open surgery were reported. Postoperative urethral diverticulum (UD) was not reported in five studies; one study reported 4 cases (15.38 %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in the pooled analysis (log OR 1.23, 95 % CI 0.02 to 2.44); this persisted in event-positive studies (log OR 1.45, 95 % CI 0.18 to 2.72). Operative time was longer with LAARP (mean difference (MD) 66.74 min, 95 % CI 27.48 to 106.00), with substantial heterogeneity (I<sup>2</sup> 97.57 %). Wound infection was uncommon and inconsistently reported; quantitative pooling was not undertaken.\n\n**Conclusions:** LAARP is a feasible and safe option for male RBF, with outcomes comparable to those of PSARP for major postoperative complications; however, the certainty of the evidence remains limited, underscoring the need for high-quality prospective studies.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anorectal malformations, Laparoscopic-assisted anorectoplasty, Meta-analysis, Pediatric colorectal surgery, Posterior sagittal anorectoplasty, Rectobulbar fistula, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41796653/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 09 Mar 2026"}, {"id": "41714221", "title_en": "Diagnostic Performance of Three-Dimensional Endoanal Ultrasound Compared with MRI in Anal Fistula: A Systematic Review and Meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jing Li", "abstract_en": "**Rationale And Objectives:** Anal fistula severely impacts patients' quality of life, and accurate preoperative Parks classification is critical for surgical planning and anal sphincter preservation. This systematic review and meta-analysis evaluated the diagnostic efficacy of 3D-endoanal ultrasound (3D-EAUS) and unenhanced/contrast-enhanced (CE) magnetic resonance imaging (MRI) for anal fistula classification.\n\n**Materials And Methods:** Following PRISMA guidelines, PubMed, Embase and Cochrane Library were searched for studies (2010-2025) comparing the two modalities, with diagnostic indices extracted and meta-analyzed via RevMan 5.3.\n\n**Results:** A total of 32 studies involving 4104 anal fistula cases were included. The summary receiver operating characteristic curves of 3D-EAUS, unenhanced MRI, and contrast-enhanced MRI (CE-MRI) showed that most points fell on or in the upper-left corner of the curves, indicating good diagnostic performance for all three modalities. 3D-EAUS exhibited high sensitivity and specificity for intersphincteric (SEN: 0.89, SPE: 0.94) and transsphincteric anal fistulas (SEN: 0.96, SPE: 0.86), but lower diagnostic sensitivity for suprasphincteric (SEN: 0.72) and extrasphincteric (SEN: 0.75) fistulas. unenhanced MRI demonstrated high specificity (>0.94) for all classifications and moderate sensitivity (>0.85), except for suprasphincteric fistulas (SEN: 0.71). CE-MRI showed the highest diagnostic accuracy, with both sensitivity and specificity exceeding 0.90 for most classifications.\n\n**Conclusion:** Both 3D-EAUS and MRI can effectively diagnose anal fistulas. 3D-EAUS is the preferred initial examination, and CE-MRI is recommended for complex or unclear cases, providing an evidence-based basis for clinical decision-making and improving patient prognosis.", "abstract_zh": "**Rationale and objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "3D-EAUS, Anal fistula, Diagnostic accuracy, MRI, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/41714221/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 19 Feb 2026"}, {"id": "41692935", "title_en": "Intraluminal bypass devices as an alternative to defunctioning stoma in anterior resection: A systematic review of safety and feasibility", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ziqiang Wang", "abstract_en": "**Aim:** To systematically evaluate the safety and feasibility of intraluminal bypass devices (IBDs) as alternatives to defunctioning stoma for colorectal/coloanal anastomoses after anterior resection.\n\n**Method:** The present systematic review was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Endpoints were feasibility (placement, fixation, maintenance, removal) and safety (device-related events, postoperative morbidity and anastomotic leakage).\n\n**Results:** In total, 10 studies evaluating five types of IBDs were included in this systematic review. Each IBD had a head portion with a proximal fixation component and a tail portion consisting of a transanal endoluminal tubular sheath or tube for faecal diversion but with a distinct design. Device-related events included migration, sheath internalization, partial colonic wall erosions and enterocutaneous fistula. Overall postoperative complications were reported in 0-74% and anastomotic leakage in 0-32% across studies. Stoma avoidance ranged from 66.7% to 100%.\n\n**Conclusion:** IBDs are technically feasible and appear acceptably safe, with potential to reduce reliance on defunctioning stoma; however, evidence remains early and heterogeneous. Further studies are needed, and optimization of fixation and anti-migration strategies should be prioritized.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anastomosis protection device, anastomotic leakage, defunctioning stoma, low anterior resection, postoperative complications", "link": "https://pubmed.ncbi.nlm.nih.gov/41692935/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sun, 15 Feb 2026"}, {"id": "41537212", "title_en": "Transanal Opening of the Intersphincteric Space to Treat Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Zhen-Yi Wang", "abstract_en": "**Aim:** Transanal opening of the intersphincteric space (TROPIS) is a minimally invasive surgical treatment for anal fistula that not only eliminates the source of infection but also protects anal function to the greatest extent. This systematic review and meta-analysis aims to evaluate the efficacy of TROPIS in the treatment of anal fistula.\n\n**Methods:** We searched PubMed, EMBASE, Web of Science, and the Cochrane Library for information on TROPIS surgery for anal fistulas performed between the inception of each database and 1 November 2024. We used the single-arm studies for analysis, with a total of 918 subjects and a follow-up period ranging from 3 months to 36 months. The analysis focused on the cure rate of different types of anal fistula, postoperative bleeding, infection, and adverse reactions.\n\n**Results:** This systematic review included six single-arm studies involving a total of 918 patients with anal fistula who underwent TROPIS surgery, with follow-up durations ranging from 3 to 36 months. Among the included studies, all were classified as high quality (score ≥7). This study demonstrated an 80% success rate for the initial operation (95% confidence interval (CI): 0.77-0.83), as well as an 80% success rate specifically for high fistulas (95% CI: 0.77-0.83). The success rate for second operations was 73% (95% CI: 0.47-0.99). For patients with high fistulas who underwent a second procedure, the success rate was 78% (95% CI: 0.40-1.00). The cure rate for anal fistulas accompanied by abscesses was 88%, while the cure rate for anal fistulas without abscesses is the same. For horseshoe fistulas, the cure rate was 87%, whereas it was 88% for non-horseshoe fistulas. The overall cure rate in this study was 88% (95% CI: 0.86-0.90). The rate of intraoperative bleeding was 3%, the postoperative infection rate was 5%, and the overall incidence of adverse reactions was 3%.\n\n**Conclusions:** This study demonstrates that TROPIS holds significant potential in the treatment of anal fistulas, particularly for high fistulas, fistulas with associated abscesses, and horseshoe-shaped fistulas, whilst exhibiting a relatively low incidence of incontinence.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 这项研究表明，TROPIS 在治疗肛瘘方面具有巨大潜力，特别是对于高位瘘管、伴有脓肿的瘘管和马蹄形瘘管，同时失禁发生率相对较低。", "keywords_zh": "肛瘘，荟萃分析，保留括约肌手术，经肛门括约肌间隙开放", "keywords_en": "anal fistula, meta-analysis, sphincter-preserving procedure, transanal opening of intersphincteric space", "link": "https://pubmed.ncbi.nlm.nih.gov/41537212/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 15 Jan 2026"}, {"id": "41342583", "title_en": "Letter to the Editor: commentary on \"Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jingen Lu", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41342583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 04 Dec 2025"}, {"id": "41219674", "title_en": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\n**Methods:** MEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\n**Results:** Eighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\n**Conclusions:** This systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 截至 2023 年 12 月，我们对 MEDLINE、EMBASE、Web of Science 和 Cochrane 数据库进行了系统检索。我们纳入了报告 PFCD 挂线拔除后瘘管结果的研究。我们使用层次结构将患者分为三种治疗类别之一：单纯药物治疗、手术闭合或基于细胞/血浆的治疗。瘘管结果报告为具有 95% 置信区间 (CI) 的加权比例。\n\n**结果：** 分析了 82 项研究（n=2441 名患者）。平均/中位挂线持续时间差异很大（2 至 70 周）。对于仅接受药物治疗、手术闭合或基于细胞/血浆的治疗类别的患者，挂线拔除后瘘管结局的汇总估计 (95% CI) 瘘管缓解率分别为 64% (54-75)、65% (52-78) 和 71% (65-77)； 30% (22-38)、29% (16-42) 和 20% (15-25) 复发； 15% (8-22)、11% (4-20) 和 14% (8-21) 脓肿形成； 26% (18-35)、23% (17-29) 和 13% (2-26) 需要再次手术干预。在多项敏感性分析中，瘘管结果估计值保持稳定。有限的研究根据挂线持续时间直接比较瘘管结局，产生不一致的结果。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/41219674/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 11 Nov 2025"}, {"id": "41133388", "title_en": "Letter to the Editor: insights into \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41133388/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 24 Oct 2025"}, {"id": "40936062", "title_en": "Effectiveness of Laser-Based Fistula Therapies with and without Adjunctive Measures in Anal Fistulas Management: A Systematic Review and Single-Arm Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Stefano Baraldo", "abstract_en": "**Purpose:** Fistula Laser Closure (FiLaC®) is a sphincter-preserving technique for anal fistulas, but its efficacy and safety remain under discussion. Therefore, we aim to evaluate the efficacy and safety of FiLaC® in the management of patients with cryptoglandular fistulas.\n\n**Methods:** A systematic review was performed in MEDLINE, Embase, and Cochrane databases in January 2025, following PRISMA guidelines. We included randomized controlled trials (RCTs) and observational studies assessing FiLaC® for cryptoglandular fistulas, with or without surgical adjunctive measures. The main outcome was the primary healing rate. Secondary outcomes included fistula recurrence, incontinence, reoperation rates, and postoperative complications. Subgroup analyses explored variables related to the primary healing rate. Data are presented as percentages (95% confidence interval). Statistical analyses were performed using R (version 4.4.1 (2024-06-14 (ucrt)).\n\n**Results:** We included 24 studies with 1,503 patients. The pooled primary healing rate was 57.46% (49.40-65.33). Recurrence occurred in 18.48% of patients (10.14-28.47), while new-onset incontinence was rare (0.57%; 0.00-2.15). The reoperation rate was 36.49% (28.95-44.36), and anal abscesses or infections affected 6.54% (1.93-13.09) of patients. Subgroup analysis showed no statistically significant differences in the primary healing rate based on fistula type, adjunctive measures, or sex. Sensitivity analysis confirmed the robustness of our findings.\n\n**Conclusions:** FiLaC® seems to be a safe option with an intermediate healing rate in patients with cryptoglandular fistulas, although it is associated with a considerable recurrence rate. While its sphincter preservation advantage is evident, further RCTs standardizing the technique and adjunctive approaches are needed to optimize outcomes and refine its application in fistula management.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 2025 年 1 月，按照 PRISMA 指南在 MEDLINE、Embase 和 Cochrane 数据库中进行了系统评价。我们纳入了随机对照试验 (RCT) 和观察性研究，评估 FiLaC® 在有或没有手术辅助措施的情况下治疗隐窝腺瘘。主要结果是初次治愈率。次要结局包括瘘管复发、失禁、再次手术率和术后并发症。亚组分析探讨了与初次治愈率相关的变量。数据以百分比形式呈现（95% 置信区间）。 使用 R（版本 4.4.1 (2024-06-14 (ucrt)）进行统计分析。\n\n**结果：** 我们纳入了 24 项研究，涉及 1,503 名患者。合并一期愈合率为 57.46% (49.40-65.33)。 18.48% 的患者（10.14-28.47）出现复发，而新发尿失禁很少见（0.57%；0.00-2.15）。再次手术率为36.49%（28.95-44.36），肛门脓肿或感染占6.54%（1.93-13.09）。亚组分析显示，基于瘘管类型、辅助措施或性别的初次愈合率没有统计学上的显着差异。敏感性分析证实了我们研究结果的稳健性。\n\n**结论：** FiLaC® 似乎是隐窝腺瘘患者的一种安全选择，具有中等的治愈率，尽管它与相当大的复发率相关。虽然其保留括约肌的优势显而易见，但仍需要进一步的随机对照试验来标准化该技术和辅助方法，以优化结果并完善其在瘘管治疗中的应用。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Cryptoglandular fistulas, FiLaC, Healing rate, Meta-analysis, Rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40936062/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40933558", "title_en": "Adipose-derived stem cell therapies for complex anal fistula: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Wenjiang Wu", "abstract_en": "**Purpose:** This study aimed to systematically investigate the efficacy of adipose-derived stem cells (ASCs) in complex anal fistula treatment.\n\n**Methods:** This study systematically searched randomized controlled studies on the efficacy of ASCs in treating complex anal fistula published before June 2024 in PubMed, EMBASE, Web of Science, and Cochrane Library. Further, relevant journals were manually searched for relevant references, and two researchers independently performed literature search and screening, data extraction, and bias assessment. Stata version 12.0 was utilized to statistically analyze the healing rate of the anal fistula and the incidence of adverse events.\n\n**Results:** This study involved 1,056 patients from five randomized controlled trials, including 561 patients in the treatment group (ASCs/ASCs + fibrin glue) and 495 patients in the control group (fibrin glue/placebo). Meta-analysis revealed better short- and long-term efficacy of adipose mesenchymal stem cell treatment for complex perianal fistulas than in conventional treatment. However, no statistical difference was observed between mid-term and ultra-long-term treatments. Subgroup meta-analysis demonstrated a difference in efficacy between various cell doses. Further, all treatments with different sources of ASCs were superior to conventional quality.\n\n**Conclusion:** This study confirms that Adipose-derived Stem Cells can effectively improve short-term and long-term (1-year) clinical outcomes in patients with complex perianal fistulas, supporting their potential as a novel therapeutic strategy.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/view/CRD42024602327.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 本研究系统检索了 2024 年 6 月之前发表在 PubMed、EMBASE、Web of Science 和 Cochrane Library 上的关于 ASC 治疗复杂肛瘘疗效的随机对照研究。此外，人工检索相关期刊相关参考文献，由两名研究人员独立进行文献检索和筛选、数据提取和偏倚评估。采用Stata 12.0版本对肛瘘愈合率及不良事件发生率进行统计分析。\n\n**结果：** 这项研究涉及来自五项随机对照试验的 1,056 名患者，其中治疗组（ASCs/ASCs + 纤维蛋白胶）561 名患者，对照组（纤维蛋白胶/安慰剂）495 名患者。荟萃分析显示，脂肪间充质干细胞治疗复杂肛周瘘的短期和长期疗效优于传统治疗。然而，中期和超长期治疗之间没有观察到统计学差异。亚组荟萃分析证明不同细胞剂量之间的功效存在差异。此外，使用不同来源的 ASC 进行的所有治疗均优于常规质量。\n\n**结论：** 这项研究证实，脂肪干细胞可以有效改善复杂肛周瘘患者的短期和长期（1 年）临床结果，支持其作为一种新型治疗策略的潜力。\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "脂肪干细胞，脂肪间充质干细胞，肛周瘘，随机对照试验，系统评价和荟萃分析", "keywords_en": "adipose stem cells, adipose-derived mesenchymal stem cell, perianal fistula, randomized controlled trial, systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/40933558/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40929949", "title_en": "A systematic review and meta-analysis of the outcomes of anal fistula clips in the treatment of anal fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Giovanna DaSilva", "abstract_en": "**Introduction:** One recent novel method for the treatment of anal fistulas is the over-the-scope clip. This meta-analysis aimed to examine the success of anal fistula clips.\n\n**Methods:** This Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review searched PubMed, Scopus, and Cochrane Library from January 2000 through March 2025 for observational and randomized controlled trials that used over-the-scope clips in treating cryptoglandular and inflammatory bowel disease-related anal fistulas. Main outcomes were pooled healing and complication rates, and length of stay.\n\n**Results:** 12 studies (2 randomized controlled trials) incorporating a total of 438 patients were included; 293 patients underwent anal fistula clip placement. The median age of the patients was 45.5 years. The pooled healing rate was 67.7% (95% confidence interval: 54.7%-80.7%) with a median follow-up of 11.3 months. Pooled healing was 78.7% (95% confidence interval: 62.3%-95.1%) in cryptoglandular fistulas and 59.5% (95% confidence interval: 41.8%-77.2%) in studies that included both cryptoglandular and inflammatory bowel disease fistulas. The medical hospital stay across 3 studies was 4.9 days. Pooled complication rate was 30.9% (95% confidence interval: 14.6%-47.2%). The most common complications were spontaneous migration or unscheduled removal of a clip (17.3%, 95% confidence interval: 8.3%-26.4%) and clinically significant pain (3.8%, 95% confidence interval: 0.9%-6.7%). Seven studies assessed continence after over-the-scope clip placement, and no cases of fecal incontinence were reported.\n\n**Conclusions:** The over-the-scope clip is a promising and novel minimally invasive treatment for anal fistulas. The pooled healing rate was 67.7% overall and >75% for cryptoglandular fistulas. Despite its encouraging success, the over-the-scope clip's complication rate of 30.9% highlights the need for further refinement of this technique and patient selection.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 纳入 12 项研究（2 项随机对照试验），共纳入 438 名患者； 293 名患者接受了肛瘘夹置入术。患者的中位年龄为 45.5 岁。汇总治愈率为 67.7%（95% 置信区间：54.7%-80.7%），中位随访时间为 11.3 个月。隐腺瘘管的合并愈合率为 78.7%（95% 置信区间：62.3%-95.1%），而包括隐腺瘘管和炎症性肠病瘘管的研究中的合并愈合率为 59.5%（95% 置信区间：41.8%-77.2%）。 3 项研究的住院时间为 4.9 天。合并并发症率为 30.9%（95% 置信区间：14.6%-47.2%）。最常见的并发症是夹子自发移位或意外移除（17.3%，95% 置信区间：8.3%-26.4%）和临床显着疼痛（3.8%，95% 置信区间：0.9%-6.7%）。七项研究评估了超范围夹子放置后的失禁情况，没有报告大便失禁的病例。\n\n**结论：** 超镜夹是一种有前景的新型微创治疗肛瘘的方法。总体愈合率为 67.7%，隐窝瘘的合并愈合率为 >75%。尽管取得了令人鼓舞的成功，但超范围夹子的并发症率为 30.9%，凸显了进一步完善该技术和患者选择的必要性。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40929949/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 10 Sep 2025"}, {"id": "40844884", "title_en": "A commentary on \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "“经肛门括约肌间间隙开放（TROPIS）治疗高位复杂性肛瘘：系统评价和荟萃分析”的评论", "authors": "Chunxue Li", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40844884/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 22 Aug 2025"}, {"id": "40833840", "title_en": "Bacteriology of Anorectal Abscess and Anal Fistula: A Systematic Review of the Literature", "title_zh": "肛门直肠脓肿和肛瘘的细菌学：文献的系统回顾", "authors": "David Parés", "abstract_en": "<b><i>Aim:</i></b> A cryptoglandular anorectal abscess is a collection of purulent material around the anus, often leading to the development of an anal fistula after drainage. Although <i>Escherichia coli</i> and <i>Bacteroides fragilis</i> have been considered key bacteria in these conditions, recent evidence suggests the need to revisit this assumption. This work aimed to analyze the presence and role of bacteria in the development of anal fistulas following anorectal abscesses. <b><i>Patients and Methods:</i></b> A search was conducted using MEDLINE via PubMed, EMBASE, Cochrane Library, and Google Scholar. Articles reporting the microbiology of cryptoglandular anorectal abscesses and the resulting anal fistulas in human beings were included. The main outcome was to evaluate the presence of bacteria in cultures of anorectal abscesses or in patients who developed anal fistulas. Additional goals included identifying patient characteristics and assessing clinical outcomes on the basis of the isolated bacteria. <b><i>Results:</i></b> In total, 22 articles on anorectal abscesses and seven on anal fistulas met the inclusion criteria. Men were the most prevalent in both cases. <i>Escherichia coli</i> and the <i>Bacteroides</i> genus were the most isolated microorganisms in abscesses and fistulas, though inconsistently in the latter. <i>Bilophila wadsworthia</i> was newly isolated in abscesses, and <i>Rothia</i> sp. was notable in fistulas using new molecular techniques. <b><i>Conclusions:</i></b> <i>Escherichia coli</i> and <i>Bacteroides</i> sp. are involved in anorectal abscesses and anal fistula formation. Recently, using new technology non-well-known bacteria had been isolated involved in this clinical problem.", "abstract_zh": "<b><i>目的：</i></b>隐窝腺肛门直肠脓肿是肛门周围化脓性物质的聚集，通常在引流后导致肛瘘的发展。尽管大肠杆菌和脆弱拟杆菌被认为是这些情况下的关键细菌，但最近的证据表明有必要重新审视这一假设。这项工作旨在分析细菌在肛门直肠脓肿后肛瘘发展中的存在和作用。 <b><i>患者和方法：</i></b>使用 MEDLINE 通过 PubMed、EMBASE、Cochrane 图书馆和 Google Scholar 进行搜索。报告人类隐腺肛门直肠脓肿和由此产生的肛瘘的微生物学的文章也被纳入其中。主要结果是评估肛门直肠脓肿培养物或发生肛瘘的患者中细菌的存在。其他目标包括识别患者特征并根据分离的细菌评估临床结果。 <b><i>结果：</i></b>总共有 22 篇关于肛门直肠脓肿的文章和 7 篇关于肛瘘的文章符合纳入标准。在这两种情况下，男性最为常见。大肠杆菌和拟杆菌属是脓肿和瘘管中分离程度最高的微生物，但在后者中的情况不一致。 <i>Bilophila wadsworthia</i>是新近在脓肿中分离出来的，而<i>Rothia</i> sp。在使用新分子技术的瘘管治疗中值得注意。 <b><i>结论：</i></b> <i>大肠杆菌</i>和<i>拟杆菌</i> sp。参与肛门直肠脓肿和肛瘘的形成。最近，利用新技术分离出了与这一临床问题有关的非知名细菌。", "keywords_zh": "肛瘘、肛门直肠脓肿、细菌学、培养", "keywords_en": "anal fistula, anorectal abscess, bacteriology, cultures", "link": "https://pubmed.ncbi.nlm.nih.gov/40833840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 20 Aug 2025"}, {"id": "40824311", "title_en": "Abdominoperineal pull-through with delayed coloanal anastomosis for pelvic anastomotic failure-a systematic review", "title_zh": "腹会阴牵引延迟结肠肛管吻合术治疗盆腔吻合失败的系统评价", "authors": "I Seow-En", "abstract_en": "**Aim:** Despite the potential benefits of abdominoperineal pull-through with delayed coloanal anastomosis (DCAA), it is still infrequently performed as a salvage procedure for pelvic anastomotic failure. We aimed to perform a systematic review on the subject to guide practice.\n\n**Method:** PubMed, Embase and Cochrane were used to identify studies evaluating DCAA for salvage after pelvic surgery from inception to August 2024. Risk of bias assessment was performed using the Newcastle-Ottawa scale. The primary outcome was overall stoma-free survival. Secondary outcomes included hospital length of stay, high-grade postoperative complication rates, 30-day postoperative mortality rates, incidence of redo surgical intervention after DCAA, and postoperative anorectal function.\n\n**Results:** Five retrospective cohort studies evaluating a total of 97 patients who underwent salvage abdominoperineal pull-through and DCAA were included in this review. All patients had previous pelvic surgery, predominantly proctectomy (n = 84, 86.6%). The most common indication for redo surgery was chronic fistula (n = 62, 63.9%) followed by anastomotic leak or chronic pelvic sepsis (n = 34, 35.1%). The pooled overall stoma-free survival rate across all five studies was 81.4% over a mean 24-month postoperative follow-up duration. The overall incidence of high-grade complications after DCAA was 39.1% (n = 38). Pooled mean length of stay was 17 days. There were no cases of early postoperative death. Pooled rate of repeat surgery across four studies was 11.6% (n = 8). Pooled mean functional scores across three studies indicated minor low anterior resection syndrome at 26 months.\n\n**Conclusion:** Abdominoperineal pull-through with delayed coloanal anastomosis is a viable option for salvage surgery following pelvic anastomotic complications, with low rates of permanent stoma and acceptable long-term anorectal function.", "abstract_zh": "**Aim：** 尽管腹会阴拉穿延迟结肠肛门吻合术 (DCAA) 具有潜在益处，但它仍然很少作为骨盆吻合失败的挽救手术进行。我们的目的是对该主题进行系统回顾以指导实践。\n\n**Method：** PubMed、Embase 和 Cochrane 被用来识别从开始到 2024 年 8 月评估 DCAA 在盆腔手术后挽救效果的研究。使用纽卡斯尔-渥太华量表进行偏倚风险评估。主要结果是总体无造口生存率。次要结局包括住院时间、术后高级并发症发生率、术后 30 天死亡率、DCAA 后重做手术干预的发生率以及术后肛门直肠功能。\n\n**结果：** 本次评价纳入了五项回顾性队列研究，评估了总共 97 名接受挽救性腹会阴牵引术和 DCAA 的患者。所有患者均曾接受过盆腔手术，主要是直肠切除术（n = 84，86.6%）。重做手术最常见的适应症是慢性瘘（n = 62，63.9%），其次是吻合口瘘或慢性盆腔脓毒症（n = 34，35.1%）。在平均 24 个月的术后随访期间，所有五项研究的汇总总体无造口生存率为 81.4%。 DCAA 后高级并发症的总体发生率为 39.1% (n = 38)。合并平均住院时间为 17 天。无术后早期死亡病例。四项研究的重复手术汇总率为 11.6% (n = 8)。三项研究的汇总平均功能评分表明 26 个月时有轻微的低位前切除综合征。\n\n**结论：** 腹会阴牵引联合延迟结肠肛管吻合术是盆腔吻合并发症后挽救手术的可行选择，具有较低的永久性造口率和可接受的长期肛门直肠功能。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Abdominoperineal pull-through, Colorectal surgery, Delayed coloanal anastomosis, Redo surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40824311/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 18 Aug 2025"}, {"id": "40780867", "title_en": "PAVFCOS: The development of a core outcome set for pouch anal and vaginal fistula", "title_zh": "PAVFCOS：针对储袋肛瘘和阴道瘘制定核心结果集", "authors": "Phil Tozer", "abstract_en": "**Aims:** The primary aim was to develop a patient-centred core outcome set (COS) for interventional studies in patients with pouch anal and vaginal fistula (PAVF).\n\n**Method:** PAVFCOS was developed using the methodology outlined by the Core Outcome Measures in Effectiveness Trials (COMET). Systematic review and qualitative patient interviews produced a long list of candidate outcomes. An online Delphi exercise was conducted with stakeholders to prioritise and shortlist outcomes. A consensus meeting of patients and clinicians ratified the final core outcome set.\n\n**Results:** A systematic review of the literature and 14 qualitative patient interviews produced a long list of 99 outcomes. These were reduced to 46 outcomes and subjected to two rounds of a Delphi exercise with 70 participants, including patients (45%), colorectal surgeons (31%), radiologists (6%), gastroenterologists (11%) and pouch specialist nurses (7%). Thirty-six outcomes were discussed in a consensus meeting of seven clinicians and seven patients. Seven core outcomes were selected for inclusion: global assessment of continence, pain related to fistula and surrounding area, impact on quality of life of fistula discharge, fistula healing (clinical and radiological), new fistula or abscess, need for rescue intervention (minor or major) and global quality-of-life assessment.\n\n**Conclusion:** PAVFCOS is the first to establish outcomes that are important to patients with pouch anal and vaginal fistula. PAVFCOS should be used in interventional studies to introduce much-needed standardisation of outcome reporting in this challenging condition.", "abstract_zh": "**Aims：** 主要目的是开发一个以患者为中心的核心结果集（COS），用于储袋肛瘘和阴道瘘（PAVF）患者的介入研究。\n\n**Method：** PAVFCOS 是使用有效性试验核心结果衡量标准 (COMET) 概述的方法开发的。系统审查和定性患者访谈产生了一长串候选结果。与利益相关者一起进行了在线德尔菲练习，以确定结果的优先顺序和最终名单。患者和临床医生的共识会议批准了最终的核心结果集。\n\n**结果：** 对文献的系统回顾和 14 次定性患者访谈产生了 99 项结果的长列表。这些结果被减少到 46 种，并接受了两轮德尔菲演习，共有 70 名参与者，包括患者 (45%)、结直肠外科医生 (31%)、放射科医生 (6%)、胃肠科医生 (11%) 和造口袋专科护士 (7%)。七名临床医生和七名患者参加的共识会议讨论了 36 项结果。选择纳入七个核心结局：失禁的总体评估、与瘘管及周围区域相关的疼痛、瘘管排出对生活质量的影响、瘘管愈合（临床和放射学）、新的瘘管或脓肿、救援干预的需要（轻微或严重）以及总体生活质量评估。\n\n**结论：** PAVFCOS 首次确立了对储袋肛瘘和阴道瘘患者重要的结果。 PAVFCOS 应该用于介入研究，以在这种具有挑战性的情况下引入急需的结果报告标准化。", "keywords_zh": "核心结果集、回肠肛袋、炎症性肠病、患者报告的结果", "keywords_en": "core outcome set, ileoanal pouch, inflammatory bowel disease, patient‐reported outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/40780867/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 08 Aug 2025"}, {"id": "40693967", "title_en": "Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jiawen Wang", "abstract_en": "**Background:** The transanal opening of intersphincteric space (TROPIS) is a new surgical modality for treating anal fistulas. This procedure involves a transanal incision between the sphincters to promote drainage, excision of the infected areas, and maintenance of sphincter patency. In this meta-analysis, we evaluated the efficacy and safety of TROPIS in treating high complex anal fistula.\n\n**Methods:** We searched the PubMed (NLM), LISTA (EBSCO), and Web of Science Core Collection (Clarivate) databases for all related clinical research literature on highly complex anal fistulas treated with TROPIS from the time of database creation to 31 December 2024, with inclusion restricted to studies published in English. All included articles follow the PICO principle. Data on surgical one-time cure rate, recurrence rate after the first surgery, final cure rate, and occurrence of adverse events were extracted for further analysis.\n\n**Results:** Six studies involving 499 patients were included. The heterogeneity test revealed no heterogeneity, and results for one-time cure rate showed I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (effect size [ES] = 0.80, 95% confidence interval [CI] (0.77, 0.84), Z = 45.96, P = 0.00), where the one-time cure rate was 80%; recurrence rate after first surgery I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00), and the recurrence rate is 20%; final cure rate I 2  = 0.00% < 50%, and Q test P = 0.82 > 0.1 (ES = 0.89, 95% CI (0.86, 0.92), Z = 51.21, P = 0.00), and the final cure rate was 89%. No adverse events were reported in any of the patients. Sensitivity analyses showed excellent stability of the surgical cure results in all studies. No publication bias was detected in any of the included studies.\n\n**Conclusions:** The TROPIS procedure for highly complex anal fistulas exhibits a high one-time cure rate, low recurrence rate, and high overall cure rate and is not associated with any adverse events.", "abstract_zh": "**背景：** 经肛门括约肌间隙开放术（TROPIS）是治疗肛瘘的一种新手术方式。该手术涉及在括约肌之间进行经肛门切口以促进引流、切除感染区域并保持括约肌通畅。在这项荟萃分析中，我们评估了 TROPIS 治疗高位复杂性肛瘘的有效性和安全性。\n\n**方法：** 我们检索了 PubMed (NLM)、LISTA (EBSCO) 和 Web of Science Core Collection (Clarivate) 数据库，查找从数据库创建之时到 2024 年 12 月 31 日期间所有关于 TROPIS 治疗高度复杂肛瘘的相关临床研究文献，仅限于以英文发表的研究。所有包含的文章都遵循 PICO 原则。提取手术一次性治愈率、首次手术后复发率、最终治愈率以及不良事件发生情况的数据进行进一步分析。\n\n**结果：** 纳入了涉及 499 名患者的六项研究。异质性检验显示无异质性，一次性治愈率结果显示 I 2 = 0.00% < 50%，Q 检验 P = 0.81 > 0.1（效应量 [ES] = 0.80，95% 置信区间 [CI] (0.77, 0.84)，Z = 45.96，P = 0.00），其中一次性治愈率为80%；首次手术后复发率 I 2 = 0.00% < 50%，Q 检验 P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00)，复发率为 20%；最终治愈率 I 2 = 0.00% < 50%，Q 检验 P = 0.82 > 0.1（ES = 0.89，95% CI（0.86，0.92），Z = 51.21，P = 0.00），最终治愈率为 89%。所有患者均未报告不良事件。敏感性分析显示所有研究中手术治愈结果均具有出色的稳定性。在所有纳入的研究中均未发现发表偏倚。\n\n**结论：** TROPIS手术治疗高度复杂的肛瘘具有一次性治愈率高、复发率低、总体治愈率高且无任何不良事件的特点。", "keywords_zh": "肛瘘，高位复杂性肛瘘，荟萃分析，系统评价，经肛门括约肌间间隙开放（TROPIS）", "keywords_en": "anal fistula, high complex anal fistula, meta-analysis, systematic review, transanal opening of intersphincteric space (TROPIS)", "link": "https://pubmed.ncbi.nlm.nih.gov/40693967/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 22 Jul 2025"}, {"id": "40672439", "title_en": "Diagnosis and treatment for anal fistula: a systematic review of clinical practice guidelines and consensus statements", "title_zh": "肛瘘的诊断和治疗：临床实践指南和共识声明的系统回顾", "authors": "Rong Shi", "abstract_en": "**Background:** Anal fistula constitutes a pathological channel originating either from the anal canal or rectum to the skin surrounding the anus, primarily characterized by recurrent pain, purulent discharge, and pruritus. This study aims to compare and standardize the recommendations for the diagnosis and treatment of anal fistula, drawing on contemporary clinical practice guidelines.\n\n**Methods:** A comprehensive search was conducted across multiple databases including PubMed, EMBASE, China National Knowledge Infrastructure, Wanfang Database, Chinese Science and Technology Periodical Database, and Chinese Biological Medicine Database, from their inception through April 1, 2024. The objective was to collate all published guidelines on anal fistula. The quality of the eligible guidelines was appraised by two reviewers using the Appraisal of Guidelines for Research and Evaluation II instrument.\n\n**Results:** The search yielded fifteen guidance documents -comprising nine guidelines and six consensus statements -each offering specific recommendations. Twelve of these documents address screening and diagnosis of anal fistula, while all fifteen discuss various treatment and management strategies. Document analysis highlighted MRI as the predominant diagnostic recommendation. Treatment and management strategies were categorized into four categories: preoperative management, surgical method selection, pharmacological interventions, and postoperative management. Regarding surgical interventions, all guidelines address incision and drainage of fistulas. Most guidelines offer a low recommendation for cutting setons, mainly attributed to the presence of incontinence. For high-positioned anal fistula, a push-pull flap procedure is recommended, whereas the LIFT procedure is advocated for newly identified, high, and sphincter-penetrating fistulas. Among the 15 guidelines and consensus statements evaluated in this study, more than half demonstrated methodological limitations, with particularly deficient performance in the applicability domain. As a critical determinant of implementation effectiveness, these deficiencies may undermine guidelines' capacity to optimize health outcomes.\n\n**Conclusion:** There is a pressing need for an updated search of potential evidence on the diagnosis and treatment of anal fistula. Effective diagnoses and therapeutic approaches, whether conventional or complementary and alternative medicine, should be thoroughly evaluated and incorporated based on robust evidence.", "abstract_zh": "**背景：** 肛瘘是从肛管或直肠到肛门周围皮肤的病理通道，主要表现为反复疼痛、脓性分泌物和瘙痒。本研究旨在借鉴当代临床实践指南，对肛瘘的诊断和治疗建议进行比较和标准化。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 搜索产生了十五份指导文件，其中包括九份指南和六份共识声明，每份文件都提供了具体建议。其中十二份文件涉及肛瘘的筛查和诊断，所有十五份文件都讨论了各种治疗和管理策略。文档分析强调 MRI 是主要的诊断建议。治疗和管理策略分为四类：术前管理、手术方法选择、药物干预和术后管理。关于手术干预，所有指南均涉及瘘管切开和引流。大多数指南对切挂线的建议较低，这主要是由于存在失禁。对于高位肛瘘，建议采用推拉皮瓣手术，而对于新发现的高位肛瘘和括约肌穿透性肛瘘，则提倡采用 LIFT 手术。在本研究评估的 15 条指南和共识声明中，超过一半表现出方法学局限性，尤其是在适用性领域表现不足。作为实施有效性的关键决定因素，这些缺陷可能会削弱指南优化健康结果的能力。\n\n**结论：** 迫切需要更新有关肛瘘诊断和治疗的潜在证据。有效的诊断和治疗方法，无论是传统医学还是补充和替代医学，都应基于强有力的证据进行彻底评估和整合。", "keywords_zh": "肛瘘, 诊断, 指南, 系统评价, 治疗", "keywords_en": "anal fistula, diagnosis, guidelines, systematic review, therapeutic", "link": "https://pubmed.ncbi.nlm.nih.gov/40672439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 17 Jul 2025"}, {"id": "40663191", "title_en": "Anal Verrucous Carcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "肛门疣状癌：病例报告和文献系统回顾", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Αn uncommon variant of squamous cell carcinoma is represented by verrucous carcinoma. Regarding the anal and perianal area, verrucous carcinoma is rarely described in the literature.\n\n**Methods:** A systematic PubMed and Scopus search was performed, a propos of a case report.\n\n**Results:** A 39-year-old man presented to our proctology practice, complaining of a palpable, perianal lump. A small size of the lesion was decided to be excised, under local anaesthesia. Pathology revealed the presence of verrucous carcinoma. Thirty patients from 17 studies were included. The mean age of the patients was 47.4 years (range: 33-77). The majority of them were males (24 out of 30, 80%). Considering the comorbidities of the included patients, only in 4 patients were mentioned to have a history of multiple perianal fistulas due to Crohn's disease, colorectal cancer, heart-lung transplantation and hidradenitis suppurativa, respectively. The most frequent symptoms at the time of presentation were painless perianal mass (7 out of 30, 23.3%), perianal pain (5 out of 30, 16.7%), ulcerated / exophytic mass (4 out of 30, 13.3%), pruritus ani (2 out of 30, 6.7%), perianal sepsis (1 out of 30, 10%) and bleeding (1 out of 30, 10%). The duration of the symptoms ranged between 2 months and 14 years. Regarding the surgical treatment of the included patients, local excision was the most common surgical option (76.7%). Combined chemoradiotherapy was administered in 5 out of 30 patients (16.7%). Recurrence of the disease was reported in 5 out of 30 patients (16.7%). Death was reported in 3 out of 30 cases (10%).\n\n**Conclusion:** Αnal verrucous carcinoma (VC) is an extremely rare neoplasm of the perianal area. In most of the cases, early diagnosis of VC is difficult due to the fact that its appearance and its symptoms commonly mimic benign conditions. Histopathological confirmation is the principal requisite in any further therapeutic treatment. In general, the prognosis is relatively good, especially when an early and radical excision is performed.", "abstract_zh": "**背景：** 鳞状细胞癌的一种罕见变体是疣状癌。关于肛门和肛周区域，文献中很少描述疣状癌。\n\n**方法：** 根据病例报告的建议，进行了系统的 PubMed 和 Scopus 检索。\n\n**结果：** 一名 39 岁的男性来我们的直肠科诊所就诊，主诉肛周可触及肿块。决定在局部麻醉下切除一小块病变。病理学显示存在疣状癌。来自 17 项研究的 30 名患者被纳入其中。患者的平均年龄为 47.4 岁（范围：33-77 岁）。其中大多数是男性（30 人中有 24 人，占 80%）。考虑到纳入患者的合并症，仅4例患者有因克罗恩病、结直肠癌、心肺移植和化脓性汗腺炎导致的多发性肛周瘘病史。就诊时最常见的症状是无痛性肛周肿块（30 例中有 7 例，23.3%）、肛周疼痛（30 例中有 5 例，16.7%）、溃疡/外生性肿块（30 例中有 4 例，13.3%）、肛门瘙痒（30 例中有 2 例，6.7%）、肛周脓毒症（30 例中有 1 例，10%）和出血（30 人中有 1 人，10%）。症状持续时间从 2 个月到 14 年不等。对于纳入患者的手术治疗，局部切除是最常见的手术选择（76.7%）。 30 名患者中有 5 名（16.7%）接受了联合放化疗。 30 名患者中有 5 名（16.7%）报告疾病复发。 30 例中有 3 例死亡（10%）。\n\n**结论：** 肛门疣状癌（VC）是一种极其罕见的肛周肿瘤。在大多数情况下，VC 的早期诊断很困难，因为它的外观和症状通常类似于良性病症。组织病理学确认是任何进一步治疗的主要必要条件。一般来说，预后相对较好，尤其是早期根治性切除时。", "keywords_zh": "肛门、肛门、高分辨率肛门镜检查、肛周、超声检查、疣状癌", "keywords_en": "Anal, Anus, High resolution anoscopy, Perianal, Ultrasonography, Verrucous carcinoma", "link": "https://pubmed.ncbi.nlm.nih.gov/40663191/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 15 Jul 2025"}, {"id": "40607121", "title_en": "Systematic review and meta-analysis of Transanal Opening of Intersphincteric Space (TROPIS) versus conventional treatments for anal fistula", "title_zh": "经肛门括约肌间间隙开放 (TROPIS) 与肛瘘常规治疗的系统回顾和荟萃分析", "authors": "Jing Wang", "abstract_en": "Transanal Opening of Intersphincteric Space (TROPIS) has emerged as a promising surgical approach for anal fistula management over recent years. This meta-analysis comprehensively evaluates the comparative efficacy and safety of TROPIS versus conventional treatments through systematic analysis of 24 clinical studies involving 2813 patients. Through systematic searches across 7 major biomedical databases (including PubMed, EMBASE, and Chinese repositories) from inception to March 2024, we identified comparative studies assessing TROPIS against six established interventions: incision-thread-drawing, seton placement, LIFT, EAFR, fistulotomy, and incision-suture techniques. Pooled analysis demonstrated TROPIS achieved superior clinical outcomes, with a 3.15-fold higher total efficacy rate (95 % CI 1.22-8.13, <i>p</i> = 0.02) and 64 % lower complication risk compared to conventional methods (OR 0.28, 95 % CI 0.18-0.42, <i>p</i> < 0.00001). Sensitivity analyses confirmed result stability across study designs, while publication bias assessment via funnel plots and Egger's test revealed no significant distortion. Importantly, TROPIS maintained its advantage across various complication subtypes including incontinence (OR 0.31), infection (OR 0.27), and recurrence (OR 0.19). These findings establish TROPIS as a clinically superior alternative that significantly improves therapeutic outcomes while reducing procedure-related risks, suggesting its potential to become the new reference standard in anal fistula management. The consistent results across diverse patient populations and comparator procedures underscore the robustness of this evidence synthesis.", "abstract_zh": "近年来，经肛门括约肌间开放术（TROPIS）已成为治疗肛瘘的一种有前途的手术方法。这项荟萃分析通过对涉及 2813 名患者的 24 项临床研究的系统分析，全面评估了 TROPIS 与传统治疗的疗效和安全性比较。通过从成立到 2024 年 3 月对 7 个主要生物医学数据库（包括 PubMed、EMBASE 和中国存储库）的系统检索，我们发现了评估 TROPIS 与六种既定干预措施的比较研究：切口挂线、挂线放置、LIFT、EAFR、瘘管切开术和切口缝合技术。汇总分析表明，TROPIS 取得了优异的临床效果，与传统方法相比，总有效率提高了 3.15 倍（95% CI 1.22-8.13，<i>p</i>=0.02），并发症风险降低了 64%（OR 0.28，95% CI 0.18-0.42，<i>p</i><0.00001）。敏感性分析证实了整个研究设计的结果稳定性，而通过漏斗图和艾格检验进行的发表偏倚评估显示没有明显的失真。重要的是，TROPIS 在各种并发症亚型中保持了其优势，包括失禁 (OR 0.31)、感染 (OR 0.27) 和复发 (OR 0.19)。这些研究结果表明 TROPIS 是一种临床上优越的替代方案，可显着改善治疗结果，同时降低手术相关风险，表明其有可能成为肛瘘治疗的新参考标准。不同患者群体和比较程序的一致结果强调了这一证据综合的稳健性。", "keywords_zh": "肛瘘，荟萃分析，TROPIS，经肛门括约肌间间隙开放", "keywords_en": "Anal fistula, Meta-analysis, TROPIS, Transanal Opening of Intersphincteric Space", "link": "https://pubmed.ncbi.nlm.nih.gov/40607121/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 03 Jul 2025"}, {"id": "40585484", "title_en": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "title_zh": "婴儿肛周脓肿和肛瘘的治疗：系统评价", "authors": "Li Xu", "abstract_en": "**Introduction:** The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\n**Material And Methods:** A thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\n**Results:** A total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\n**Conclusion:** The available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "abstract_zh": "**介绍：** 婴儿肛周脓肿（PA）和肛瘘（FIA）的最佳治疗方法仍然是一个争论的话题。\n\n**Material and methods：** 对多个数据库进行了彻底的文献检索，包括 Embase、PubMed、Web of Science、Cochrane Library、ClinicalTrials.gov 和 Google Scholar。\n\n**结果：** 总共分析了 18 项回顾性研究，涵盖 1,770 名患者。接受保守治疗的702例（38.7%）中，治愈528例（75.2%），未治愈174例（24.8%），其中93例出现PA复发，81例出现FIA。相比之下，在接受手术干预的1,068例（61.3%）中，784例（73.4%）治愈，284例（26.6%）未治愈，其中151例出现PA复发，133例出现FIA。\n\n**结论：** 现有研究表明，保守治疗组和手术治疗组之间 PA 和 FIA 的治愈率和复发率差异很小。\n\n**Systematic review registration：** https://www.crd.york.ac.uk/PROSPERO/，PROSPERO (CRD42023472249)。", "keywords_zh": "保守治疗, 肛瘘, 婴儿, 肛周脓肿, 手术治疗", "keywords_en": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40585484/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 30 Jun 2025"}, {"id": "40474832", "title_en": "Comment on \"Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis\"", "title_zh": "评论《13种手术技术治疗复杂性肛瘘、非克罗恩CAF的有效性和安全性：系统评价和网络荟萃分析》", "authors": "Libo Zhou", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40474832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 06 Jun 2025"}, {"id": "40442569", "title_en": "Systematic review and network meta-analysis of cryptoglandular complex anal fistula treatment: evaluation of surgical strategies", "title_zh": "隐腺复杂性肛瘘治疗的系统评价和网络荟萃分析：手术策略评估", "authors": "Natalia Uribe Quintana", "abstract_en": "**Background:** Several surgical approaches are available for managing complex cryptoglandular perianal fistulas. However, a gold standard surgical technique has not yet been established. This network meta-analysis aims to assess and compare postoperative failure and anal incontinence pooled rates for different available surgical techniques for complex cryptoglandular anal fistulas.\n\n**Methods:** Systematic searches were carried out on Pubmed, Ovid, the Cochrane Library database and ClinicalTrials.gov up to June 2023. All randomized comparative trials of nine surgical techniques for cryptoglandular complex perianal fistulas in adult patients were included. A systematic review and network meta-analysis was conducted using the PRISMA-NMA methodology. The endorectal advancement flap was used as the control technique, and the odds ratios (ORs) were calculated through pairwise and network meta-analysis with random effects.\n\n**Results:** 16 randomized trials were included in this study. Network meta-analysis was conducted for each outcome. Techniques, such as cutting seton, fistulotomy with sphincter reconstruction, LIFT, and VAAFT, obtained similar results in terms of technique failure to the transanal advancement flap with no statistically significant differences. PLUG (OR = 3.6 [95%CI 1.1-11.5]), fibrin glue (OR = 7.5 [95%CI 2.2-25], and platelet-rich plasma (PRP) (OR = 11.5[95%CI 1.3-99]) demonstrated a statistically significant increase in the pooled failure rate. For anal incontinence, only the cutting seton technique exhibited a higher risk of postoperative incontinence (OR = 8.6 [95%CI 1-72.5]).\n\n**Conclusion:** Our research highlights effective therapeutic approaches for complex anal fistulas, stressing the need to customize treatment based on location, anatomy, patient characteristics, and preferences. However, it advises against using plugs, fibrin glue, PRP therapy due to lower healing rates, and the seton technique because of its potential impact on anal continence. PROSPERO number CRD42022304345.", "abstract_zh": "**背景：** 有几种手术方法可用于治疗复杂的隐窝腺周瘘。然而，金标准手术技术尚未建立。该网络荟萃分析旨在评估和比较复杂隐腺肛瘘的不同可用手术技术的术后失败和肛门失禁汇总率。\n\n**方法：** 截至 2023 年 6 月，我们在 Pubmed、Ovid、Cochrane 图书馆数据库和 ClinicalTrials.gov 上进行了系统检索。纳入了针对成人患者隐腺复杂性肛瘘的九种手术技术的所有随机比较试验。使用 PRISMA-NMA 方法进行系统评价和网络荟萃分析。使用直肠内推进皮瓣作为对照技术，通过具有随机效应的成对和网络荟萃分析计算优势比（OR）。\n\n**结果：** 本研究纳入了 16 项随机试验。对每个结果进行网络荟萃分析。诸如切割挂线、瘘管切开术伴括约肌重建、LIFT 和 VAAFT 等技术在经肛门推进皮瓣的技术失败方面获得了相似的结果，但没有统计学上的显着差异。 PLUG (OR = 3.6 [95%CI 1.1-11.5])、纤维蛋白胶 (OR = 7.5 [95%CI 2.2-25]) 和富血小板血浆 (PRP) (OR = 11.5[95%CI 1.3-99]) 表现出合并失败率具有统计显着性增加。术后尿失禁，仅切割挂线技术表现出较高的术后尿失禁风险（OR = 8.6 [95%CI 1-72.5]）。\n\n**结论：** 我们的研究强调了复杂肛瘘的有效治疗方法，强调需要根据位置、解剖结构、患者特征和偏好定制治疗。然而，它建议不要使用塞子、纤维蛋白胶、PRP 治疗（因为治愈率较低）和挂线技术（因为它对肛门失禁有潜在影响）。普洛斯彼罗编号 CRD42022304345。", "keywords_zh": "肛门失禁，复杂性肛瘘，网络荟萃分析，持续性，复发，手术治疗", "keywords_en": "Anal incontinence, Complex anal fistula, Network meta-analysis, Persistence, Recurrence, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40442569/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 29 May 2025"}, {"id": "40392371", "title_en": "Failure rates and complications of four sphincter-sparing techniques for the treatment of fistula-in-ano: a systematic review and network meta-analysis", "title_zh": "四种保留括约肌技术治疗肛瘘的失败率和并发症：系统评价和网络荟萃分析", "authors": "G Pellino", "abstract_en": "**Background:** Several techniques are available to reduce the risk of sphincter injury when treating anal fistula, such as ligation of the intersphincteric fistula tract (LIFT), video-assisted anal fistula treatment (VAAFT), fistula laser closure (FiLaC) and endoanal flap (EAF). The aim of this meta-analysis is to provide data on the safety, complications and failure of these techniques.\n\n**Methods:** Studies published after 2017, with patients undergoing at least one among LIFT, VAAFT, FiLaC and EAF for perianal fistula and providing data regarding failure, were retrieved from PubMed and EMBASE. Primary outcome was failure; other outcomes included continence disturbance and complications.\n\n**Results:** Forty-nine articles with 3520 patients were included. The failure rates were 28.6% (range 3.8-75) for LIFT, 22.3% (6.2-65.2) for VAAFT, 43.9% (11.1-80) for FiLaC and 25.9% (4.7-100) for EAF, with a mean follow-up of 35.4 (6-80.4), 32.4 (6-48), 31.6(6.3-60) and 42.4 (12-155) months. The available network meta-analysis on failure showed RD of -0.08 (95% CI - 0.58 to 0.42) comparing LIFT vs VAAFT and 0.30 (95% CI 0.03 to 0.58) comparing LIFT vs EAF. No patients undergoing VAAFT or FiLaC reported worsening continence, while for LIFT and EAF, the continence disturbance rate was 1.5% and 7.3%, respectively. No major complications were observed. The most common minor complications were pain (1.4%), bleeding (1.1%) and wound infection (1.2%). Overall, minor complication rates were 4.3% for LIFT, 7.2% for VAAFT, 10.2% for FiLaC and 6.2% for EAF. Crohn's disease was associated with a higher failure rate (39.5% vs 31.4%).\n\n**Conclusions:** FiLaC, VAAFT, LIFT and EAF may represent a valid option in the treatment of anal fistula. VAAFT showed the lowest rate of failure but with no differences from network metanalysis. Wider homogeneous studies with long-term follow-up are necessary to obtain more robust data.\n\n**Prospero Number:** CRD42022375600.", "abstract_zh": "**背景：** 有几种技术可以降低治疗肛瘘时括约肌损伤的风险，例如括约肌间瘘道结扎（LIFT）、视频辅助肛瘘治疗（VAAFT）、瘘管激光闭合（FiLaC）和肛内皮瓣（EAF）。这项荟萃分析的目的是提供有关这些技术的安全性、并发症和失败的数据。\n\n**方法：** 从 PubMed 和 EMBASE 检索 2017 年之后发表的研究，其中患者接受了 LIFT、VAAFT、FiLaC 和 EAF 中至少一种治疗肛周瘘并提供了有关失败的数据。主要结果是失败；其他结果包括失禁障碍和并发症。\n\n**结果：** 纳入 49 篇文章，涉及 3520 名患者。 LIFT 的失败率为 28.6%（范围 3.8-75），VAAFT 为 22.3%（6.2-65.2），FiLaC 为 43.9%（11.1-80），EAF 为 25.9%（4.7-100），平均随访次数为 35.4（6-80.4），32.4 (6-48)、31.6(6.3-60) 和 42.4 (12-155) 个月。可用的失败网络荟萃分析显示，比较 LIFT 与 VAAFT 的 RD 为 -0.08（95% CI - 0.58 至 0.42），比较 LIFT 与 EAF 的 RD 为 0.30（95% CI 0.03 至 0.58）。接受 VAAFT 或 FiLaC 的患者没有报告失禁情况恶化，而接受 LIFT 和 EAF 的患者失禁率分别为 1.5% 和 7.3%。没有观察到重大并发症。最常见的轻微并发症是疼痛（1.4%）、出血（1.1%）和伤口感染（1.2%）。总体而言，LIFT 的轻微并发症发生率为 4.3%，VAAFT 为 7.2%，FiLaC 为 10.2%，EAF 为 6.2%。克罗恩病与较高的失败率相关（39.5% vs 31.4%）。\n\n**结论：** FiLaC、VAAFT、LIFT 和 EAF 可能是治疗肛瘘的有效选择。 VAAFT 显示失败率最低，但与网络荟萃分析没有差异。为了获得更可靠的数据，需要进行更广泛的同质研究和长期随访。\n\n**Prospero number：** CRD42022375600。", "keywords_zh": "肛瘘、并发症、肛内皮瓣、FILAC、LIFT、复发、VAAFT", "keywords_en": "Anal fistula, Complications, Endoanal flap, FILAC, LIFT, Recurrence, VAAFT", "link": "https://pubmed.ncbi.nlm.nih.gov/40392371/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 20 May 2025"}, {"id": "40353830", "title_en": "Early Resuturing versus expectant Management for Perineal Wound Dehiscence: A systematic review", "title_zh": "会阴伤口裂开的早期缝合与期待治疗：系统评价", "authors": "Debjyoti Karmakar", "abstract_en": "**Background And Objective:** Perineal wound dehiscence is a common complication of vaginal birth that impacts maternal well-being and quality of life. This systematic review compares early resuturing with expectant management in the treatment of perineal wound dehiscence.\n\n**Methods:** We searched Ovid MEDLINE, CINAHL, and PubMed databases, and hand-searched recent reviews and relevant studies. Human prospective and retrospective studies, randomized controlled trials (RCTs), and case series evaluating early resuturing within the postnatal period were included. Two reviewers independently assessed the studies for outcomes and risk of bias. The primary outcome was healing time; secondary outcomes included dyspareunia, long-term symptoms, functional outcomes, infection rates, and anal sphincter injury.\n\n**Results:** Thirteen studies (1987-2022) were included: three RCTs, four prospective cohort studies or case series, and six retrospective studies-heterogeneity in study designs and outcomes limited data synthesis. Early resuturing was associated with reduced healing time, particularly for wounds not involving the anal sphincter, but increased the risk of complications such as fistula formation. Many studies emphasized meticulous preoperative wound care.\n\n**Conclusions:** Limited evidence suggests that early resuturing may reduce healing time without increasing wound infection risk. However, the increased risk of complications necessitates cautious application and highlights the importance of preoperative wound care. Further robust research is needed, although challenging to conduct. Alternative analytical methods, such as data mining and decision tree algorithms, should be explored. Based on current evidence, clinicians should carefully individualize recommendations on the benefits and risks of early resuturing.", "abstract_zh": "**Background and objective：** 会阴伤口裂开是阴道分娩的常见并发症，影响产妇的健康和生活质量。本系统综述比较了会阴伤口裂开治疗中的早期缝合与期待治疗。\n\n**方法：** 我们检索了 Ovid MEDLINE、CINAHL 和 PubMed 数据库，并手动检索了最近的评论和相关研究。包括人类前瞻性和回顾性研究、随机对照试验（RCT）以及评估产后早期再缝合的病例系列。两名评审员独立评估了研究的结果和偏倚风险。主要结果是愈合时间；次要结局包括性交困难、长期症状、功能结局、感染率和肛门括约肌损伤。\n\n**结果：** 纳入了十三项研究（1987-2022）：三项随机对照试验、四项前瞻性队列研究或病例系列以及六项回顾性研究——研究设计和结果的异质性限制了数据合成。早期重新缝合会缩短愈合时间，特别是对于不涉及肛门括约肌的伤口，但会增加瘘管形成等并发症的风险。许多研究强调术前细致的伤口护理。\n\n**结论：** 有限的证据表明，早期重新缝合可能会缩短愈合时间，而不会增加伤口感染的风险。然而，并发症风险的增加需要谨慎使用，并凸显了术前伤口护理的重要性。尽管进行起来具有挑战性，但仍需要进一步强有力的研究。应探索替代分析方法，例如数据挖掘和决策树算法。根据目前的证据，临床医生应仔细针对早期再缝合的益处和风险提出个性化建议。", "keywords_zh": "早期缝合、会阴裂开、会阴伤口破裂、产后", "keywords_en": "early resuturing, perineal dehiscence, perineal wound breakdown, postpartum", "link": "https://pubmed.ncbi.nlm.nih.gov/40353830/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 12 May 2025"}, {"id": "40269939", "title_en": "Fish bone migration: complications, diagnostic challenges, and treatment strategies", "title_zh": "鱼骨迁移：并发症、诊断挑战和治疗策略", "authors": "Jichuan Chen", "abstract_en": "**Background:** Fish bone impaction in the pharynx is a common otolaryngological emergency. However, if the fish bone perforates the pharyngeal wall or the gastrointestinal wall and migrates to the neck tissues or organs, entering the lungs, mediastinum, heart, liver, biliary tract, spleen, pancreas, or other structures, or damages major blood vessels in the thoracic or abdominal cavities, it can lead to severe complications. This condition is rare and dangerous, potentially resulting in a series of serious complications, including neck abscess, thyroid abscess, thrombosis or air embolism of the cervical vessels, esophageal perforation, rupture of major mediastinal vessels, mediastinitis, aorto-esophageal fistula, lung abscess, spinal injury, sepsis, splenic abscess, hepatic abscess, anal fistula, and it may even be misdiagnosed as a tumor.\n\n**Objective:** This narrative review synthesizes evidence on fish bone translocation complications to (1) identify high-risk clinical presentations, (2) guide site-specific imaging selection, and (3) inform multidisciplinary management strategies.\n\n**Methods:** Use the keyword \"fishbone\" to systematically search articles from PubMed、CNKI and Embase databases from 1972 to 2024. Review all original articles and include them in this review where appropriate. This narrative review synthesizes evidence from case reports and observational studies to explore complications and management of fish bone translocation in uncommon sites. Given the predominance of heterogeneous case reports, a formal systematic review with meta-analysis was not feasible; however, we employed systematic search strategies to minimize selection bias.\n\n**Conclusion:** To avoid severe complications, it is crucial to provide comprehensive information on the management of fish bone impaction. When fish bone removal cannot be achieved using laryngoscopy, prompt and decisive surgical intervention is required to extract the foreign body.", "abstract_zh": "**背景：** 咽部鱼骨嵌塞是常见的耳鼻喉急症。但如果鱼刺穿透咽壁或胃肠壁，迁移到颈部组织或器官，进入肺、纵隔、心脏、肝脏、胆道、脾脏、胰腺等结构，或损伤胸腔或腹腔的主要血管，就会导致严重的并发症。这种情况罕见且危险，可能导致一系列严重并发症，包括颈部脓肿、甲状腺脓肿、颈部血管血栓或空气栓塞、食管穿孔、纵隔大血管破裂、纵隔炎、主食管瘘、肺脓肿、脊柱损伤、败血症、脾脓肿、肝脓肿、肛瘘，甚至可能被误诊为肿瘤。\n\n**目的：** 这篇叙述性综述综合了鱼骨易位并发症的证据，以（1）识别高风险的临床表现，（2）指导特定部位的影像学选择，以及（3）为多学科管理策略提供信息。\n\n**方法：** 使用关键词“fishbone”从PubMed、CNKI和Embase数据库中系统检索1972年至2024年的文章。审阅所有原始文章，并在适当的情况下将其纳入本综述。这篇叙述性综述综合了病例报告和观察性研究的证据，以探讨罕见部位鱼骨易位的并发症和处理。鉴于异质病例报告占主导地位，采用荟萃分析进行正式的系统评价是不可行的；然而，我们采用系统搜索策略来尽量减少选择偏差。\n\n**结论：** 为了避免严重的并发症，提供有关鱼骨嵌塞处理的全面信息至关重要。当喉镜无法取出鱼骨时，需要及时、果断的手术干预以取出异物。", "keywords_zh": "并发症、鱼刺、胃肠道异物、咽部异物", "keywords_en": "Complications, Fishbone, Gastrointestinal foreign body, Pharyngeal foreign body", "link": "https://pubmed.ncbi.nlm.nih.gov/40269939/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 24 Apr 2025"}, {"id": "40205247", "title_en": "Systematic review and meta-analysis of the efficacy and safety of stem cell treatment of anal fistulas", "title_zh": "干细胞治疗肛瘘疗效和安全性的系统评价和荟萃分析", "authors": "S D Wexner", "abstract_en": "**Background:** Since anal fistulas can be challenging to treat; numerous innovative treatments have been proposed, including stem cell therapy. This systematic review aimed to assess pooled rates of fistula healing and adverse events associated with stem cell treatment.\n\n**Methods:** In this PRISMA-compliant systematic review we searched PubMed and Scopus for observational and randomized studies reporting outcomes of stem cell treatment for anal fistulas. The main outcome measures were successful healing and adverse effects of stem cell therapy.\n\n**Results:** In total, 43 studies incorporating 1160 patients (53.6% male) were included. Underlying fistula etiologies were Crohn's disease (30 studies) and cryptoglandular disease (12 studies). The main origin of stem cells was from adipose tissue (34 studies) or bone marrow (6 studies). The median follow-up duration was 12 months. The combined overall pooled healing rate was 58.1% (95% confidence interval (CI) 51.5-64.7%). The pooled healing rate for Crohn's fistulas was 60.4% (95% CI 54.7-66.2%) with adipose-derived stem cells and 63.6% (95% CI 49.4-77.7%) with bone-marrow-derived cells. The pooled healing rate for cryptoglandular fistulas was 53.8% (95% CI 35.5-72.2%) with adipose-derived stem cells. The pooled complication rate was 37.3% (95% CI 27.1-47.5%). Stem cells were associated with higher odds of anal fistula healing (odds ratio (OR): 1.81, p = 0.003) and similar odds of complications (OR: 1, p = 0.986) compared with controls.\n\n**Conclusions:** Stem cell treatment of anal fistulas was associated with promising results. The healing rate in Crohn's anal fistulas was higher than in cryptoglandular fistulas. Bone-marrow-derived stem cells were associated with marginally better outcomes than were adipose-derived cells. This finding suggests that the autoimmune inflammatory etiology of Crohn's disease may respond better to autologous myoblasts than does the infectious etiology of cryptoglandular fistulas.", "abstract_zh": "**背景：** 由于肛瘘很难治疗；已经提出了许多创新疗法，包括干细胞疗法。本系统评价旨在评估与干细胞治疗相关的瘘管愈合和不良事件的汇总率。\n\n**方法：** 在这篇符合 PRISMA 标准的系统评价中，我们检索了 PubMed 和 Scopus 中报告干细胞治疗肛瘘结果的观察性和随机研究。主要结果指标是干细胞治疗的成功治愈和不良反应。\n\n**结果：** 总共纳入了 43 项研究，纳入了 1160 名患者（53.6% 为男性）。瘘管的潜在病因是克罗恩病（30 项研究）和隐腺病（12 项研究）。干细胞的主要来源是脂肪组织（34 项研究）或骨髓（6 项研究）。中位随访时间为 12 个月。合并后的总体治愈率为 58.1%（95% 置信区间 (CI) 51.5-64.7%）。脂肪源性干细胞克罗恩瘘管的综合治愈率为 60.4% (95% CI 54.7-66.2%)，骨髓源性细胞为 63.6% (95% CI 49.4-77.7%)。使用脂肪干细胞治疗隐窝腺瘘的综合治愈率为 53.8% (95% CI 35.5-72.2%)。合并并发症率为 37.3%（95% CI 27.1-47.5%）。与对照组相比，干细胞与肛瘘愈合的几率较高（比值比 (OR)：1.81，p = 0.003）和相似的并发症几率（OR：1，p = 0.986）相关。\n\n**结论：** 肛瘘的干细胞治疗具有良好的效果。克罗恩病肛瘘的治愈率高于隐腺瘘。骨髓来源的干细胞比脂肪来源的细胞具有稍微更好的结果。这一发现表明，克罗恩病的自身免疫炎症病因可能比隐腺瘘的感染病因对自体成肌细胞的反应更好。", "keywords_zh": "不良反应, 肛瘘, 愈合, 干细胞, 系统评价", "keywords_en": "Adverse effects, Anal fistulas, Healing, Stem cells, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40205247/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 09 Apr 2025"}, {"id": "40192869", "title_en": "Sphincter repair procedures may be favored in the treatment of obstetrical recto-vaginal fistula: a systematic review of the literature and meta-analysis", "title_zh": "括约肌修复手术可能有利于产科直肠阴道瘘的治疗：文献和荟萃分析的系统回顾", "authors": "J F Hamel", "abstract_en": "**Background:** The management of obstetric rectovaginal fistula (RVF) is challenging for the surgeon. The best surgical procedure to repair RVFs, specifically after obstetric anal sphincter injury, has not been extensively studied. The objective was to compare the success of the different procedures performed to repair obstetric RVF.\n\n**Methods:** The literature search was carried out on PubMed<sup>®</sup> and Web of Science<sup>®</sup
