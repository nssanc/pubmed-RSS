ng 2,335 participants were included in the analysis. MPFF improved the clinical efficacy of post-hemorrhoidectomy and reduced the bleeding rate, pain score, and edema score, although no substantial effect on adverse reactions was reported. Subgroup analyses showed a significant reduction in pain score and bleeding rate in trials with duration of 4-10 days and an improvement in clinical efficacy. Treatment for ≥ 10 days significantly improved the edema score; a dosage range of 1,800-2,700 mg/day of MPFF significantly reduced edema and pain scores, whereas < 1,800 mg/day significantly improved clinical efficacy.\n\n**Conclusions:** Based on searching the relevant literatures, this is the first meta-analysis on MPFF treatment of postoperative hemorrhoid complications. Our findings, validated by TSA, suggest that MPFF is safe and effective in reducing postoperative hemorrhoid complications, and that dose and duration are key factors in its efficacy, as illustrated by subgroup analysis. However, due to the small sample size, the standardized treatment regimen of MPFF could not be obtained; therefore, further research is warranted.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study design：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, Meta-analysis, Micronized purified flavonoid fractions, Postoperative complications", "link": "https://pubmed.ncbi.nlm.nih.gov/35752073/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 25 Jun 2022"}, {"id": "35685735", "title_en": "Be Kind to Your Behind: A Systematic Review of the Habitual Use of Bidets in Benign Perianal Disease", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "David Nathan Ginther", "abstract_en": "**Background:** Benign perianal disease carries significant morbidity and financial burden on the healthcare system. Given that sitz baths are recommended as a treatment modality, we considered whether using a continuous stream of water, in the form of a bidet, offers a convenient and effective alternative. Bidet use is the predominant form of perianal hygiene in Asia, but its role in perianal disease is unknown.\n\n**Purpose:** To critically analyze and systematically review the current evidence regarding the effect of habitual bidet use on symptoms of benign perianal disease. <i>Data Sources.</i> A database search was conducted on MEDLINE and Epub Ahead of Print, Embase, ClinicalTrials.gov, the Cochrane Library, and ProQuest Dissertations. All studies on bidet use in pruritus ani, hemorrhoids, or anal fissures were included. <i>Data Extraction.</i> The studies were screened and critically analyzed by two independent reviewers in line with PRISMA guidelines.\n\n**Results:** Two prospective trials and 1 cross-sectional study found that habitual use of bidets had no impact on the odds of developing hemorrhoids or hemorrhoidal symptoms. One RCT concluded that using bidets was non-inferior to sitz bath for post-hemorrhoidectomy pain. Two prospective trials and 1 cross-sectional study determined that habitual bidet use may increase the odds of developing pruritus ani. Two case series found that habitual bidet use may cause perianal burns or anterior anal fissures. A meta-analysis was not performed because only a limited number of studies were available, and they were of variable quality.\n\n**Conclusion:** The current evidence does not identify using bidets as a treatment modality for perianal disease, and further research is warranted to study this increasingly utilized technology.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/35685735/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 10 Jun 2022"}, {"id": "35551442", "title_en": "Clinical Outcomes Following Rectal Artery Embolisation for the Treatment of Internal Haemorrhoids: A Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Hamed Asadi", "abstract_en": "**Objectives:** Haemorrhoidal disease (HD) is a common anorectal disorder which can substantially impair quality of life. Rectal artery embolisation (RAE) is a recently described technique for the management of HD, however, its clinical efficacy and safety are unclear at present. The objective of this systematic review and meta-analysis is to evaluate the clinical outcomes following RAE.\n\n**Methods:** The PubMed, MEDLINE and EMBASE databases were searched for studies specifying the management of haemorrhoids with RAE from January 2000 to October 2021. Primary outcomes were: French bleeding score (FBS), Visual analogue scale (VAS) for pain, general quality of life (QoL) score, and the Goligher prolapse score (GPS). Secondary outcomes were technical success, clinical success, postoperative complications, and technical outcomes. A random-effects meta-analysis was conducted. Study heterogeneity was evaluated, and sensitivity analysis was performed.\n\n**Results:** Thirteen eligible studies were identified including 381 patients. Rectal artery embolisation was associated with improvements in the FBS (mean difference [MD] 2.66; 95% confidence interval [CI] 2.10-3.23), VAS (MD 1.92; 95% CI 1.58-2.27) and QoL (MD 1.41; 95% CI 1.20-3.80), although the grade of internal haemerrhoids increased with uncertain clinical significance (MD 0.30; 95% CI 0.23-0.36). Technical success was achieved in almost all procedures (99%; 95% CI 94-100%) however clinical efficacy was lower (82%; 95% CI 73-89%). Procedural duration and radiation exposure were heterogeneous. No major complications occurred.\n\n**Conclusion:** RAE demonstrates early clinical efficacy with low rates of peri-procedural complications or morbidity. RAE is a promising addition to the treatment options available for HD and warrants ongoing research.", "abstract_zh": "**Objectives：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Embolization, Haemorrhoids, Interventional radiology, Quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/35551442/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 13 May 2022"}, {"id": "35432740", "title_en": "Endoscopic management and outcome of non-variceal bleeding in patients with liver cirrhosis: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Evangelos Kalaitzakis", "abstract_en": "**Background:** Acute non-variceal bleeding accounts for approximately 20% of all-cause bleeding episodes in patients with liver cirrhosis. It is associated with high morbidity and mortality therefore prompt diagnosis and endoscopic management are crucial.\n\n**Aim:** To evaluate available data on the efficacy of endoscopic treatment modalities used to control acute non-variceal gastrointestinal bleeding (GIB) in cirrhotic patients as well as to assess treatment outcomes.\n\n**Methods:** Employing PRISMA methodology, the MEDLINE was searched through PubMed using appropriate MeSH terms. Data are reported in a summative manner and separately for each major non-variceal cause of bleeding.\n\n**Results:** Overall, 23 studies were identified with a total of 1288 cirrhotic patients of whom 958/1288 underwent endoscopic therapy for acute non-variceal GIB. Peptic ulcer bleeding was the most common cause of acute non-variceal bleeding, followed by portal hypertensive gastropathy, gastric antral vascular ectasia, Mallory-Weiss syndrome, Dieaulafoy lesions, portal hypertensive colopathy, and hemorrhoids. Failure to control bleeding from all-causes of non-variceal GIB accounted for less than 3.5% of cirrhotic patients. Rebleeding (range 2%-25%) and mortality (range 3%-40%) rates varied, presumably due to study heterogeneity. Rebleeding was usually managed endoscopically and salvage therapy using arterial embolisation or surgery was undertaken in very few cases. Mortality was usually associated with liver function deterioration and other organ failure or infections rather than uncontrolled bleeding. Endoscopic treatment-related complications were extremely rare. Lower acute non-variceal bleeding was examined in two studies (197/1288 patients) achieving initial hemostasis in all patients using argon plasma coagulation for portal hypertensive colopathy and endoscopic band ligation or sclerotherapy for bleeding hemorrhoids (rebleeding range 10%-13%). Data on the efficacy of endoscopic therapy of cirrhotic patients <i>vs</i> non-cirrhotic controls with acute GIB are very scarce.\n\n**Conclusion:** Endotherapy seems to be efficient as a means to control non-variceal hemorrhage in cirrhosis, although published data are very limited, particularly those comparing cirrhotics with non-cirrhotics and those regarding acute bleeding from the lower gastrointestinal tract. Rebleeding and mortality rates appear to be relatively high, although firm conclusions may not be drawn due to study heterogeneity. Hopefully this review may stimulate further research on this subject and help clinicians administer optimal endoscopic therapy for cirrhotic patients.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Endoscopic therapy, Gastric antral vascular ectasia, Gastrointestinal endoscopy, Liver cirrhosis, Mallory Weiss syndrome, Non-variceal gastrointestinal hemorrhage, Patient outcomes, Peptic ulcer", "link": "https://pubmed.ncbi.nlm.nih.gov/35432740/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 18 Apr 2022"}, {"id": "35412490", "title_en": "Functional constipation in patients with hemorrhoids: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Bastiaan Klarenbeek", "abstract_en": "Hemorrhoids are common anorectal pathology, with high recurrence rates after surgical treatment. It is hypothesized that high straining forces during paradoxical contractions and inadequate relaxation are causally related to hemorrhoids. This review aimed to assess the coprevalence of functional constipation and dyssynergic defecation in a population with hemorrhoids. Moreover, the effects of rubber band ligation (RBL) were analyzed. Sources included Pubmed, Embase and CENTRAL . Randomized trials, cohort and case-control studies that investigated the prevalence of constipation in patients with hemorrhoids or the prevalence of hemorrhoids in patients with constipation compared to healthy subjects were included. Manometric studies were also eligible. Quality assessment was performed by using the Newcastle Ottawa Quality Assessment Scale. The primary outcome was the prevalence of functional constipation or dyssynergic defecation in patients with hemorrhoids. Nineteen studies were included. Prevalence of constipation was significantly higher in patients with hemorrhoids compared to controls [OR (odds ratio), 2.09; 95% CI (confidence interval), 1.27-3.44]. No significant difference in the prevalence of hemorrhoids between patients with constipation compared to controls was found (OR, 2.37; 95% CI, 0.67-8.44). Anal pressures in patients with hemorrhoids were significantly higher compared to healthy controls in all manometric studies. After RBL, these pressures remained significantly higher in patients with hemorrhoids ( P  = 0.001). Functional constipation, dyssynergic defecation and higher basal anal pressures are more prevalent in patients with hemorrhoids compared to controls. Improvement of therapy for functional constipation, especially dyssynergic defecation patterns, might lead to better long-term outcomes and reduce recurrence.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/35412490/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 12 Apr 2022"}, {"id": "35334594", "title_en": "Strategies to Reduce Post-Hemorrhoidectomy Pain: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Romyen Jitmungngan", "abstract_en": "Background and Objectives: Excisional hemorrhoidectomy is considered as a mainstay operation for high-grade hemorrhoids and complicated hemorrhoids. However, postoperative pain remains a challenging problem after hemorrhoidectomy. This systematic review aims to identify pharmacological and non-pharmacological interventions for reducing post-hemorrhoidectomy pain. Materials and Methods: The databases of Ovid MEDLINE, PubMed and EMBASE were systematically searched for randomized controlled trails (published in English language with full-text from 1981 to 30 September 2021) to include comparative studies examining post-hemorrhoidectomy pain as their primary outcomes between an intervention and another intervention (or a sham or placebo). Results: Some 157 studies were included in this review with additional information from 15 meta-analyses. Fundamentally, strategies to reduce post-hemorrhoidectomy pain were categorized into four groups: anesthetic methods, surgical techniques, intraoperative adjuncts, and postoperative interventions. In brief, local anesthesia-alone or combined with intravenous sedation was the most effective anesthetic method for excisional hemorrhoidectomy. Regarding surgical techniques, closed (Ferguson) hemorrhoidectomy performed with a vascular sealing device or an ultrasonic scalpel was recommended. Lateral internal anal sphincterotomy may be performed as a surgical adjunct to reduce post-hemorrhoidectomy pain, although it increased risks of anal incontinence. Chemical sphincterotomy (botulinum toxin, topical calcium channel blockers, and topical glyceryl trinitrate) was also efficacious in reducing postoperative pain. So were other topical agents such as anesthetic cream, 10% metronidazole ointment, and 10% sucralfate ointment. Postoperative administration of oral metronidazole, flavonoids, and laxatives was associated with a significant reduction in post-hemorrhoidectomy pain. Conclusions: This systematic review comprehensively covers evidence-based strategies to reduce pain after excisional hemorrhoidectomy. Areas for future research on this topic are also addressed at the end of this article.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "analgesics, anesthesia, complication, hemorrhoidectomy, hemorrhoids, pain, postoperative pain, review", "link": "https://pubmed.ncbi.nlm.nih.gov/35334594/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 26 Mar 2022"}, {"id": "35199618", "title_en": "The association between varicocele and other vascular diseases: A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Gang Liu", "abstract_en": "**Objective:** This study is aimed to evaluate the association between varicocele and other vascular diseases through a systematic reviews and meta-analyses.\n\n**Material And Methods:** We searched Cochrane Central Register of Controlled Trials, Embase, PubMed, and Web of Science for studies that reported varicocele and other vascular diseases published before 30 June 2021. The meta-analysis was performed by Revman V.5.2 to calculate the pooled odds ratios and corresponding 95% confidence intervals. Subsequently, the impact of publication bias was evaluated, and sensitivity analysis as performed to assess our results' robustness.\n\n**Results:** In total, seven case-control studies, including 803 varicocele cases and 727 controls, were included. Our meta-analysis results showed that the varicocele patients had a higher risk of saphenofemoral insufficiency when compared with the control group (odds ratio [OR]: 2.80; 95% confidence intervals [CIs]: 2.03, 3.84; <i>p</i> < 0.00001). Additionally, varicocele patients also had a higher risk of lower extremity venous insufficiency when compared with the control group (OR: 2.34; 95% CI: 1.58, 3.47; <i>p</i> < 0.0001). However, there was no statistical difference in hemorrhoid risk between both groups (OR: 1.13; 95% CI: 0.28, 4.59; <i>p</i> = 0.87).\n\n**Conclusion:** Our study demonstrated that varicocele patients have higher risk of saphenofemoral and lower extremity venous insufficiencies but not the risk of hemorrhoids.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Material and methods：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoid, lower extremity venous insufficiency, meta-analysis, saphenofemoral insufficiency, varicocele", "link": "https://pubmed.ncbi.nlm.nih.gov/35199618/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 24 Feb 2022"}, {"id": "35160159", "title_en": "Surgical Management of Hemorrhoidal Disease in Inflammatory Bowel Disease: A Systematic Review with Proportional Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Giacomo Zanus", "abstract_en": "Surgical treatment of hemorrhoidal disease (HD) in inflammatory bowel disease (IBD) has been considered to be potentially harmful, but the evidence for this is poor. Therefore, a systematic review of the literature was undertaken to reappraise the safety and effectiveness of surgical treatments in this special circumstance. A MEDLINE, Web of Science, Scopus, and Cochrane Library search was performed to retrieve studies reporting the outcomes of surgical treatment of HD in patients with Crohn's disease (CD) and ulcerative colitis (UC). From a total of 2072 citations, 10 retrospective studies including 222 (range, 2-70) patients were identified. Of these, 119 (54%) had CD and 103 (46%) UC. Mean age was between 41 and 49 years (range 14-77). Most studies lacked information on the interval between surgery and the onset of complications. Operative treatments included open or closed hemorrhoidectomy (<i>n</i> = 156 patients (70%)), rubber band ligation (<i>n</i> = 39 (18%)), excision or incision of thrombosed hemorrhoid (<i>n</i> = 14 (6%)), and doppler-guided hemorrhoidal artery ligation (DG-HAL, <i>n</i> = 13 (6%)). In total, 23 patients developed a complication (pooled prevalence, 9%; (95%CI, 3-16%)), with a more than two-fold higher rate in patients with CD compared to UC (11% (5-16%) vs. 5% (0-13%), respectively). Despite the low quality evidence, surgical management of HD in IBD and particularly in CD patients who have failed nonoperative therapy should still be performed with caution and limited to inactive disease. Further studies should determine whether advantages in terms of safety and effectiveness with the use of non-excisional techniques (e.g., DG-HAL) can be obtained in this patient population.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Crohn, IBD, hemorrhoidal disease, hemorrhoidectomy, surgery, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/35160159/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 15 Feb 2022"}, {"id": "34633439", "title_en": "Interventional treatments for prolapsing haemorrhoids: network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "A G Hill", "abstract_en": "**Background:** Multiple treatments for early-moderate grade symptomatic haemorrhoids currently exist, each associated with their respective efficacy, complications, and risks. The aim of this study was to compare the relative clinical outcomes and effectiveness of interventional treatments for grade II-III haemorrhoids.\n\n**Methods:** A systematic review was conducted according to PRISMA criteria for all the RCTs published between 1980 and 2020; manuscripts were identified using the MEDLINE, Embase, and CENTRAL databases. Inclusion criteria were RCTs comparing procedural interventions for grade II-III haemorrhoids. Primary outcomes of interest were: symptom recurrence at a minimum follow-up of 6 weeks, postprocedural pain measured on a visual analogue scale (VAS) on day 1, and postprocedural complications (bleeding, urinary retention, and bowel incontinence). After bias assessment and heterogeneity analysis, a Bayesian network meta-analysis was performed.\n\n**Results:** Seventy-nine RCTs were identified, including 9232 patients. Fourteen different treatments were analysed in the network meta-analysis. Overall, there were 59 RCTs (73 per cent) judged as being at high risk of bias, and the greatest risk was in the domain measurement of outcome. Variable amounts of heterogeneity were detected in direct treatment comparisons, in particular for symptom recurrence and postprocedural pain. Recurrence of haemorrhoidal symptoms was reported by 54 studies, involving 7026 patients and 14 treatments. Closed haemorrhoidectomy had the lowest recurrence risk, followed by open haemorrhoidectomy, suture ligation with mucopexy, stapled haemorrhoidopexy, and Doppler-guided haemorrhoid artery ligation (DG-HAL) with mucopexy. Pain was reported in 34 studies involving 3812 patients and 11 treatments. Direct current electrotherapy, DG-HAL with mucopexy, and infrared coagulation yielded the lowest pain scores. Postprocedural bleeding was recorded in 46 studies involving 5696 patients and 14 treatments. Open haemorrhoidectomy had the greatest risk of postprocedural bleeding, followed by stapled haemorrhoidopexy and closed haemorrhoidectomy. Urinary retention was reported in 30 studies comparing 10 treatments involving 3116 participants. Open haemorrhoidectomy and stapled haemorrhoidopexy had significantly higher odds of urinary retention than rubber band ligation and DG-HAL with mucopexy. Nine studies reported bowel incontinence comparing five treatments involving 1269 participants. Open haemorrhoidectomy and stapled haemorrhoidopexy had the highest probability of bowel incontinence.\n\n**Conclusion:** Open and closed haemorrhoidectomy, and stapled haemorrhoidopexy were associated with worse pain, and more postprocedural bleeding, urinary retention, and bowel incontinence, but had the lowest rates of symptom recurrence. The risks and benefits of each treatment should be discussed with patients before a decision is made.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/34633439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 11 Oct 2021"}, {"id": "34530908", "title_en": "Anorectal emergencies: WSES-AAST guidelines", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fausto Catena", "abstract_en": "Anorectal emergencies comprise a wide variety of diseases that share common symptoms, i.e., anorectal pain or bleeding and might require immediate management. While most of the underlying conditions do not need inpatient management, some of them could be life-threatening and need prompt recognition and treatment. It is well known that an incorrect diagnosis is frequent for anorectal diseases and that a delayed diagnosis is related to an impaired outcome. This paper aims to improve the knowledge and the awareness on this specific topic and to provide a useful tool for every physician dealing with anorectal emergencies.The present guidelines have been developed according to the GRADE methodology. To create these guidelines, a panel of experts was designed and charged by the boards of the World Society of Emergency Surgery (WSES) and American Association for the Surgery of Trauma (AAST) to perform a systematic review of the available literature and to provide evidence-based statements with immediate practical application. All the statements were presented and discussed during the WSES-AAST-WJES Consensus Conference on Anorectal Emergencies, and for each statement, a consensus among the WSES-AAST panel of experts was reached. We structured our work into seven main topics to cover the entire management of patients with anorectal emergencies and to provide an up-to-date, easy-to-use tool that can help physicians and surgeons during the decision-making process.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Angiography, Anorectal Varices, Anorectal bleeding, Anorectal foreign bodies , Anorectal sepsis, Antibiotics, Diagnosis, Embolization, Fournier’s gangrene, Guidelines, Hemorrhoids, Non-operative management, Surgery, Technique, Timing", "link": "https://pubmed.ncbi.nlm.nih.gov/34530908/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 17 Sep 2021"}, {"id": "34417639", "title_en": "Post-hemorrhoidectomy pain: can surgeons reduce it? A systematic review and network meta-analysis of randomized trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Natalia Uribe", "abstract_en": "**Purpose:** Hemorrhoidectomy remains the gold standard treatment for grade III-IV hemorrhoids. However, despite strong recommendations for the suitability of outpatient surgery, post-operative pain has been a limitation to the widespread inclusion of this condition in day surgery programs. The aims of the study were to analyze and compare the post-operative pain of conventional open hemorrhoidectomy, considered the reference technique, against other surgical procedures such as closed hemorrhoidectomy, open hemorrhoidectomy using bipolar or ultrasonic sealant, hemorrhoidopexy, or HAL-RAR, when performed exclusively as outpatients.\n\n**Methods:** A systematic review and meta-analysis was conducted according to PRISMA methodology. All prospective and randomized studies of patients operated on for hemorrhoids in day surgery and specifying the value of post-operative pain, using a validated scale, were included. Conventional meta-analyses and a random-effects network meta-analysis were carried out.\n\n**Results:** Twenty-nine studies were included (3309 patients). None of the procedures described severe pain in the post-operative period. Hemorrhoidopexy was the least painful. Conventional open hemorrhoidectomy was the most painful on the first and seventh post-operative days. Pain was reduced after closed hemorrhoidectomy technique and when bipolar or harmonic scalpel was used. Furthermore, transfixive ligation of the hemorrhoidal pedicle was associated with increased post-operative pain.\n\n**Conclusion:** Hemorrhoidal surgery is feasible in day surgery units and post-operative pain can be adequately managed in an outpatient setting. Hemorrhoidopexy was the least painful; however, data should be carefully evaluated by the high rate of long-term recurrence described in literature. Closed hemorrhoidectomy, performed with bipolar or ultrasonic sealing, avoiding transfixive ligation of the hemorrhoidal pedicle, may improve post-operative pain control.\n\n**Trial Registration:** CRD42020185160.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 根据 PRISMA 方法进行系统评价和荟萃分析。纳入了所有在日间手术中接受痔疮手术的患者的前瞻性和随机研究，并使用经过验证的量表明确了术后疼痛的价值。进行了常规荟萃分析和随机效应网络荟萃分析。\n\n**结果：** 纳入 29 项研究（3309 名患者）。没有一个手术描述了术后期间的剧烈疼痛。痔疮固定术是最不痛苦的。传统的开放式痔切除术在术后第一天和第七天是最痛苦的。闭合性痔切除术和使用双极或谐波手术刀后疼痛减轻。此外，痔蒂的固定结扎与术后疼痛的增加有关。\n\n**结论：** 痔疮手术在日间手术室是可行的，术后疼痛可以在门诊得到充分的控制。痔疮固定术是最不痛苦的。然而，应根据文献中描述的高长期复发率仔细评估数据。采用双极或超声密封进行闭合痔切除术，避免痔蒂的固定结扎，可以改善术后疼痛控制。\n\n**Trial registration：** CRD42020185160。", "keywords_zh": "门诊手术、CMA、日间手术、痔疮疾病、荟萃分析、疼痛、随机、量表", "keywords_en": "Ambulatory surgery, CMA, Day-case surgery, Hemorrhoidal disease, Meta-analysis, Pain, Randomized, Scale", "link": "https://pubmed.ncbi.nlm.nih.gov/34417639/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 21 Aug 2021"}, {"id": "34101003", "title_en": "An update on surgical treatment of hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "痔疮手术治疗的最新进展：系统评价和荟萃分析", "authors": "Juan Lucas Poggio", "abstract_en": "**Background:** Pathologic hemorrhoids are common among adults age 45-65. Hemorrhoids are characterized as internal or external, and grades 1-4 based on severity. The type and grade dictate treatment, with surgical treatment reserved for grades 3/4. The aim of this study is to compare clinical outcomes of various surgical treatments.\n\n**Methods:** A systematic review was conducted to identify randomized clinical trials that compare surgical treatments for grade 3/4 hemorrhoids. A Bayesian network meta-analysis was done using NetMetaXL and WinBUGS.\n\n**Results:** A total of 26 studies with 3137 participants and 14 surgical treatments for grade 3/4 hemorrhoids were included. Pain was less in patients with techniques such as laser (OR 0.34, CI 0.01-6.51), infrared photocoagulation (OR 0.38, CI 0.02-5.61), and stapling (OR 0.48, CI 0.19-1.25), compared to open and closed hemorrhoidectomies. There was less recurrence with Starion (OR 0.01, CI 0.00-0.46) and harmonic scalpel (OR 0.00, CI 0.00-0.49), compared to infrared photocoagulation and transanal hemorrhoidal dearterialization. Fewer postoperative clinical complications were seen with infrared photocoagulation (OR 0.04, CI 0.00-2.54) and LigaSure (OR 0.16, CI 0.03-0.79), compared to suture ligation and open hemorrhoidectomy. With Doppler-guided (OR 0.26, CI 0.05-1.51) and stapled (OR 0.36, CI 0.15-0.84) techniques, patients return to work earlier when compared to open hemorrhoidectomy and laser.\n\n**Conclusion:** There are multiple favorable techniques without a clear \"gold standard\" based on current literature. Open discussion should be had between patients and physicians to guide individualized care.", "abstract_zh": "**背景：** 病理性痔疮在 45-65 岁的成年人中很常见。痔疮分为内痔和外痔，根据严重程度分为 1-4 级。类型和级别决定了治疗方法，3/4 级保留手术治疗。本研究的目的是比较各种手术治疗的临床结果。\n\n**方法：** 我们进行了一项系统评价，以确定比较 3/4 级痔疮手术治疗的随机临床试验。使用 NetMetaXL 和 WinBUGS 完成贝叶斯网络元分析。\n\n**结果：** 总共纳入了 26 项研究，涉及 3137 名参与者和 14 种针对 3/4 级痔疮的手术治疗。与开放式和闭合式痔切除术相比，采用激光（OR 0.34，CI 0.01-6.51）、红外光凝（OR 0.38，CI 0.02-5.61）和吻合器（OR 0.48，CI 0.19-1.25）等技术的患者疼痛减轻。与红外光凝和经肛门痔疮去动脉化术相比，Starion（OR 0.01，CI 0.00-0.46）和谐波手术刀（OR 0.00，CI 0.00-0.49）的复发率较低。与缝线结扎和开放痔切除术相比，红外光凝（OR 0.04，CI 0.00-2.54）和LigaSure（OR 0.16，CI 0.03-0.79）术后临床并发症较少。与开放式痔切除术和激光相比，多普勒引导（OR 0.26，CI 0.05-1.51）和吻合器（OR 0.36，CI 0.15-0.84）技术使患者更早返回工作岗位。\n\n**结论：** 根据当前文献，有多种有利的技术没有明确的“黄金标准”。患者和医生之间应进行公开讨论，以指导个体化护理。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/34101003/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 08 Jun 2021"}]}, currentFeed: '', currentPapers: [], currentPaper: null,
