统评价", "authors": "Hadi Rokni Yazdi", "abstract_en": "**Background And Aims:** Hemorrhoids are common vascular structures that can become symptomatic when prolapsed, representing the most prevalent benign anorectal condition worldwide. Despite affecting up to 11% of the population with symptoms including pain, bleeding, and discomfort, hemorrhoids remain underdiagnosed and often inappropriately managed. This systematic review aimed to evaluate the efficacy, clinical outcomes, and morbidity of endovascular artery embolization in hemorrhoids.\n\n**Method:** Up to August 2022, PubMed, Scopus, Web of Science, and Embase were searched comprehensively. All studies had eligible criteria included, except review articles, articles published in a language other than English, and case reports or series of cases. Two independent reviewers performed a literature review and data extraction. Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) 2020 checklist was used for quality assessment.\n\n**Results:** The systematic review included 15 studies. The patient's age ranged from 40.5 ± 9.51 to 72.2 ± 10.9. Eleven studies mentioned the sample size as gender-specific, with 57.89% (<i>n</i> = 187/323) male patients. The embolic site involved in embolization, according to the frequency, was 424 patients for the superior rectal artery in all studies, and coils and micro coils were utilized as Embolic material in most cases. No major complication or death was noted in 12 studies. The most frequent complications were postoperative pain and tenesmus, bleeding, ulceration and fibrotic scars, and low-grade fever. In 11.79% (<i>n</i> = 27/229) of patients re-embolization and after-treatment surgery were due to surgical failure and symptom recurrence, such as bleeding.\n\n**Conclusion:** Rectal artery embolization using microcoils, embolic particles, or a combination is a new method for managing internal hemorrhoids with proper clinical efficacy without significant complications. QoL score has improved after emborrhoid, and most cases had a lower bleeding score.", "abstract_zh": "**Background and aims：** 痔疮是常见的血管结构，脱垂时可能会出现症状，是全世界最常见的良性肛门直肠疾病。尽管有多达 11% 的人口出现疼痛、出血和不适等症状，但痔疮的诊断率仍然较低，而且往往治疗不当。本系统评价旨在评估血管内动脉栓塞治疗痔疮的疗效、临床结果和发病率。\n\n**Method：** 截至2022年8月，PubMed、Scopus、Web of Science、Embase均被全面检索。所有研究均包含合格标准，但评论文章、以英语以外的语言发表的文章以及病例报告或系列病例除外。两名独立评审员进行了文献评审和数据提取。系统评价和荟萃分析的首选报告项目 (PRISMA) 2020 检查表用于质量评估。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 使用微弹簧圈、栓塞颗粒或其组合进行直肠动脉栓塞是一种治疗内痔的新方法，具有良好的临床疗效，且无明显并发症。痔疮术后生活质量评分有所改善，大多数病例的出血评分较低。", "keywords_zh": "栓塞, 痔疮, 痔疮, 痔动脉, 直肠动脉", "keywords_en": "embolization, emborrhoid, hemorrhoid, hemorrhoidal artery, rectal artery", "link": "https://pubmed.ncbi.nlm.nih.gov/41503542/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 08 Jan 2026"}, {"id": "41450176", "title_en": "Worldwide prevalence of haemorrhoids: a systematic review and meta-analysis", "title_zh": "全球痔疮患病率：系统评价和荟萃分析", "authors": "Pouyan Ebrahimi", "abstract_en": "**Background:** Haemorrhoidal disease (HD) is one of the most common anorectal disorders globally, significantly impacting individuals' quality of life and productivity. Despite its importance, global prevalence remains unclear due to limited population-specific studies. This study aimed to systematically assess the global prevalence of HD through a systematic review and meta-analysis.\n\n**Methods:** We conducted a systematic review and meta-analysis by searching PubMed, Scopus, Embase, Web of Science, and Google Scholar up to March 31, 2025, without language restrictions. Studies reporting prevalence of haemorrhoids in general, clinical, or high-risk populations were included. Exclusion criteria comprised studies lacking total sample size, focusing on other anorectal conditions, or using duplicate or insufficient data. Four independent reviewers extracted and appraised study quality using the Joanna Briggs Institute tool. The primary outcome was pooled point prevalence of HD, analyzed using a random-effects model with 95% confidence intervals (CIs). The study was registered in PROSPERO (CRD420251045600).\n\n**Results:** From 6,312 records, 150 studies (210 datasets) comprising 8,960,338 individuals were included. The global pooled point prevalence was 25.92% (95% CI: 22.62-29.22). Lifetime prevalence was 27.19% (95% CI: 14.77-39.60), and one-year prevalence was 21.65% (95% CI: 14.33-28.97). Prevalence was higher in women (27.33%, 95% CI: 21.84-32.82) than in men, and highest in the African region 28.07% (95% CI: 15.34-40.79). Invasive diagnostic methods (28.05%, 95% CI: 23.86-32.26) yielded higher prevalence estimates than non-invasive methods. Also, factors showing associations with HD in unadjusted analyses include older age, obesity, pregnancy, diabetes, family history, constipation, and hypertension.\n\n**Conclusion:** HD remains a prevalent condition globally, with minor variation across regions. The burden is consistent regardless of socioeconomic context. Diagnostic method and population characteristics influence prevalence estimates. These findings underscore the importance of targeted prevention and early intervention strategies, especially for at-risk groups.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "痔疮、流行病学、痔疮、荟萃分析、患病率", "keywords_en": "Haemorrhoids, epidemiology, haemorrhoid, meta-analysis, prevalence", "link": "https://pubmed.ncbi.nlm.nih.gov/41450176/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 26 Dec 2025"}, {"id": "41263625", "title_en": "Regarding: \"Efficacy and safety of methylene blue for postoperative pain of haemorrhoids: a systematic review and meta-analysis\"", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fahmi H Kakamad", "abstract_en": "No abstract", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41263625/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 20 Nov 2025"}, {"id": "40944330", "title_en": "Efficacy and safety of methylene blue for postoperative pain of haemorrhoids: a systematic review and meta-analysis", "title_zh": "亚甲蓝治疗痔疮术后疼痛的疗效和安全性：系统评价和荟萃分析", "authors": "Li Xu", "abstract_en": "**Objectives:** Pain is a common complication after haemorrhoid surgery. In addition to anaesthetic methods, surgical techniques and postoperative interventions, surgeons also use intraoperative adjuncts to alleviate postoperative pain. This study aims to evaluate the effectiveness and safety of methylene blue in reducing postoperative pain in haemorrhoid patients.\n\n**Methods:** A search was conducted in PubMed, Embase, Cochrane Library and Web of Science for randomized controlled trials (RCTs) up until 9 December 2024, involving methylene blue use for pain relief after haemorrhoid surgery. Two reviewers independently assessed the study eligibility, extracted data and evaluated the risk of bias. Data analysis was performed using Stata 18 software. The primary outcome was the visual analogue scale (VAS) pain scores at different time points within 14 days postoperatively. Secondary outcomes included the number of patients requiring analgesics and the occurrence of complications.\n\n**Results:** 358 articles were retrieved and six studies involving 598 patients were included after screening. Compared with the control group, the use of methylene blue reduced pain within 12 h postoperatively(WMD -1.582, 95% CI -2.834 to -0.330, <i>p</i> = .013), as well as on day 2 (WMD -1.441, 95% CI - 1.874 to -1.008, <i>p</i> < .0001), day 3 (WMD -0.975, 95% CI -1.309 to -0.641, <i>p</i> < .0001), day 5(WMD -0.786, 95% CI -1.094 to -0.478, <i>p</i> = .028) and day 7 (WMD -0.679, 95% CI -1.257 to -0.101, <i>p</i> = .021), decreased the number of patients using analgesics(RR 0.293, 95% CI 0.203 to 0.422, <i>p</i> < .0001) and did not increase the incidence of complications(RR 0.65, 95% CI 0.39-1.10, <i>p</i> = .111) such as urinary retention, secondary haemorrhage, pruritus, temporary incontinence, wound infection, or local skin reactions.\n\n**Conclusions:** This study shows that methylene blue can reduce postoperative pain, decrease analgesic use and does not increase complications after haemorrhoid surgery.", "abstract_zh": "**Objectives：** 疼痛是痔疮手术后常见的并发症。除了麻醉方法、手术技术和术后干预外，外科医生还使用术中辅助手段来减轻术后疼痛。本研究旨在评估亚甲蓝减轻痔疮患者术后疼痛的有效性和安全性。\n\n**方法：** 在 PubMed、Embase、Cochrane 图书馆和 Web of Science 中检索了截至 2024 年 12 月 9 日的随机对照试验 (RCT)，涉及亚甲蓝用于缓解痔疮手术后的疼痛。两名评审员独立评估研究资格、提取数据并评估偏倚风险。使用Stata 18软件进行数据分析。主要结果是术后14天内不同时间点的视觉模拟评分（VAS）疼痛评分。次要结局包括需要镇痛药的患者数量和并发症的发生率。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Analgesia, haemorrhoidectomy, methylene blue, postoperative pain", "link": "https://pubmed.ncbi.nlm.nih.gov/40944330/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 13 Sep 2025"}, {"id": "40877526", "title_en": "Outcomes of embolization therapy of superior rectal arteries for the management of grade 1 to 3 internal hemorrhoids: a systematic Review of clinical studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jana Al Jnainati", "abstract_en": "**Background:** Superior rectal artery embolization (\"Emborrhoid\") offers a catheter-based alternative for grade I-III internal hemorrhoids when office therapies fail or surgery is undesirable.\n\n**Methods:** Following PRISMA 2020, PubMed and Embase were searched (Jan 2014-Jan 2024). Two reviewers independently screened records, extracted data, and applied RoB 2, ROBINS-I, or an adapted Newcastle-Ottawa Scale. Prespecified outcomes were technical success, clinical success (≥ 2-point fall in bleeding score or equivalent), adverse events, and recurrence. Substantial heterogeneity blocked meta-analysis; results were narratively synthesized.\n\n**Results:** Twenty-two studies encompassing 810 procedures qualified. Technical success reached 93-100%. Clinical success ranged from 63 to 94%, yielding marked bleeding control and symptom relief. Reported complications were mild and self-limited (pelvic discomfort, nausea, and low-grade fever); no ischemic injury, continence disturbance, or mortality occurred. Recurrence necessitating repeat treatment affected 8-20% of patients, usually when collateral arterial supply persisted. Patient-reported satisfaction exceeded 80% in every series. Only two small, heterogeneous comparative studies versus rubber-band ligation or sclerotherapy were available, precluding a pooled analysis.\n\n**Conclusions:** Current evidence suggests Emborrhoid is a safe, effective bridge between office procedures and surgery-particularly valuable for frail or anticoagulated patients. Yet small single-center cohorts, disparate techniques, and scarce head-to-head trials limit external validity. Multicenter randomized studies with harmonized outcomes and ≥ 24-month follow-up are required to confirm long-term efficacy, cost-effectiveness, and optimal patient selection.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 继 PRISMA 2020 之后，对 PubMed 和 Embase 进行了检索（2014 年 1 月-2024 年 1 月）。两名评审员独立筛选记录、提取数据并应用 RoB 2、ROBINS-I 或改编的纽卡斯尔-渥太华量表。预先设定的结果是技术成功、临床成功（出血评分下降≥2分或同等水平）、不良事件和复发。显着的异质性阻碍了荟萃分析；结果是叙述性综合的。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "栓塞材料、痔疮栓塞、微创治疗、患者满意度、复发率、直肠上动脉、系统评价", "keywords_en": "Embolic materials, Hemorrhoidal embolization, Minimally invasive therapy, Patient satisfaction, Recurrence rates, Superior rectal artery, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40877526/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 28 Aug 2025"}, {"id": "40793873", "title_en": "Systematic Review: The Relationship Between the Faecal Microbiome and Colorectal Neoplasia in Shotgun Metagenomic Studies", "title_zh": "系统综述：鸟枪法宏基因组研究中粪便微生物组与结直肠肿瘤之间的关系", "authors": "Colin Rees", "abstract_en": "**Background:** The human gut microbiome is of academic and clinical interest. Associations between certain organisms and colorectal neoplasia have been reported, but findings have limited reproducibility in different populations.\n\n**Methods:** We performed a systematic review of whole metagenome shotgun sequencing studies using faecal samples from patients with colorectal neoplasia and control populations. Searches were performed on 30th June 2023. We identified 26 studies, reporting on 22 study populations (13 from Asia, five from Europe and four from North America). Study size ranged from 14 to 971 individuals (mean 170).\n\n**Results:** Some reproducible data were identified, such as the significant enrichment of Fusobacterium nucleatum and Parvimonas micra in colorectal cancer patients compared to controls (in 10 and nine studies, respectively). However, 21 out of 26 studies scored poorly on quality appraisal, specifically surrounding selection of cases and controls. Definitions of controls varied; some studies used individuals with normal endoscopic investigations, some used 'healthy' individuals where no colonoscopy was performed, and one used those with non-neoplastic findings (haemorrhoids). There was even less reproducibility of data in studies where individuals with colorectal polyps were compared to controls, possibly because of heterogeneity in these patient groupings as a variety of definitions for 'polyp cases' were used.\n\n**Conclusions:** Heterogeneity and potential for bias indicates that findings should be interpreted with caution. Standardised protocols to ensure robust methodology and allow pooling of large-scale data are required before these findings can be used in clinical practice (PROSPERO: CRD42023431977).", "abstract_zh": "**背景：** 人类肠道微生物组具有学术和临床意义。某些微生物与结直肠肿瘤之间的关联已有报道，但研究结果在不同人群中的重复性有限。\n\n**方法：** 我们使用结直肠肿瘤患者和对照人群的粪便样本对整个宏基因组鸟枪法测序研究进行了系统回顾。检索于 2023 年 6 月 30 日进行。我们确定了 26 项研究，报告了 22 个研究人群（13 项来自亚洲，5 项来自欧洲，4 项来自北美）。研究规模从 14 人到 971 人不等（平均 170 人）。\n\n**结果：** 确定了一些可重复的数据，例如与对照组相比，结直肠癌患者中具核梭杆菌和微小单胞菌显着富集（分别在 10 项和 9 项研究中）。然而，26 项研究中有 21 项在质量评估方面得分较低，特别是在病例和对照的选择方面。控制的定义各不相同；一些研究使用了正常内窥镜检查的个体，一些研究使用了未进行结肠镜检查的“健康”个体，还有一项研究使用了非肿瘤发现（痔疮）的个体。在将结直肠息肉患者与对照组进行比较的研究中，数据的重复性甚至更低，这可能是因为这些患者分组的异质性，因为使用了多种“息肉病例”定义。\n\n**结论：** 异质性和潜在偏差表明应谨慎解释研究结果。在将这些发现用于临床实践之前，需要制定标准化方案以确保稳健的方法并允许汇集大规模数据（PROSPERO：CRD42023431977）。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40793873/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 12 Aug 2025"}, {"id": "40760310", "title_en": "Correction: Real-world use of polidocanol foam sclerotherapy for hemorrhoidal disease: insights from an international survey and systematic review with clinical practice recommendations", "title_zh": "更正：聚多卡醇泡沫硬化疗法治疗痔疮疾病的实际应用：国际调查和系统评价以及临床实践建议的见解", "authors": "Gianpiero Gravante", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40760310/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 05 Aug 2025"}, {"id": "40665575", "title_en": "Haemorrhoidal artery ligation: Is Doppler guidance useful? A systematic review and meta-analysis of randomized controlled trials", "title_zh": "痔动脉结扎：多普勒引导有用吗？随机对照试验的系统回顾和荟萃分析", "authors": "Gaetano Gallo", "abstract_en": "**Aim:** Haemorrhoidal arterial ligation (HAL) with or without mucopexy (recto-anal repair, RAR) is a minimally invasive technique for the treatment of haemorrhoidal disease. It is still debated if it should be performed with Doppler guidance (DG-HAL) or without. The primary aim of this study was to find evidence that the use of Doppler guidance reduces the risk of recurrence. The secondary aim was to evaluate the benefit of Doppler guidance on postoperative complications.\n\n**Methods:** A comprehensive literature search was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines (2020). The population, intervention, comparison, outcomes and study design (PICOS) framework was used for eligibility criteria. Data were extracted independently by two reviewers for initial screening and for eligibility to be included in the meta-analysis of randomized controlled trials. Random effects meta-analysis, leave-one-out meta-analysis and meta-regression were performed to assess the main outcomes.\n\n**Results:** Seven randomized controlled trials, published between 2008 and 2023, were selected. They included 514 patients (mean age 49.13 years, 46% men) with different haemorrhoidal degrees. The HAL technique was performed in 255 patients and DG-HAL in 259 patients. The meta-analysis revealed that the DG-HAL procedure was associated with a significant risk of recurrence (P = 0.007) and similar postoperative pain (P = 0.623) compared to the HAL procedure. In a subgroup analysis of patients treated with a combined RAR procedure, no differences were found between the DG-HAL-RAR and HAL-RAR regarding the risk of recurrence (P = 0.36) and postoperative pain (P = 0.31).\n\n**Conclusion:** In conclusion, this meta-analysis did not find superiority of DG-HAL over HAL with or without RAR in reducing postoperative complications and recurrence.", "abstract_zh": "**Aim：** 痔动脉结扎 (HAL) 联合或不联合粘液固定术（直肠肛门修复术，RAR）是一种治疗痔疮疾病的微创技术。是否应该使用多普勒引导 (DG-HAL) 或不使用多普勒引导进行仍有争议。本研究的主要目的是寻找证据证明使用多普勒引导可降低复发风险。第二个目的是评估多普勒引导对术后并发症的益处。\n\n**方法：** 根据系统评价和荟萃分析的首选报告项目 (PRISMA) 指南 (2020) 进行了全面的文献检索。人口、干预、比较、结果和研究设计 (PICOS) 框架用于资格标准。数据由两名评审员独立提取，用于初步筛选和纳入随机对照试验荟萃分析的资格。进行随机效应荟萃分析、留一荟萃分析和荟萃回归来评估主要结果。\n\n**结果：** 选择了 2008 年至 2023 年间发表的 7 项随机对照试验。他们包括 514 名患有不同程度痔疮的患者（平均年龄 49.13 岁，46% 为男性）。 255 名患者接受了 HAL 技术，259 名患者接受了 DG-HAL 技术。荟萃分析显示，与 HAL 手术相比，DG-HAL 手术具有显着的复发风险 (P = 0.007) 和相似的术后疼痛 (P = 0.623)。在对联合 RAR 手术治疗的患者进行的亚组分析中，DG-HAL-RAR 和 HAL-RAR 在复发风险 (P = 0.36) 和术后疼痛 (P = 0.31) 方面没有发现差异。\n\n**结论：** 总之，这项荟萃分析并未发现 DG-HAL 在减少术后并发症和复发方面比有或没有 RAR 的 HAL 具有优越性。", "keywords_zh": "多普勒、痔疮、痔动脉结扎、痔血管化、粘液固定术", "keywords_en": "Doppler, haemorrhoid, haemorrhoidal artery ligation, haemorrhoidal vascularization, mucopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/40665575/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 16 Jul 2025"}, {"id": "40624403", "title_en": "Real-world use of polidocanol foam sclerotherapy for hemorrhoidal disease: insights from an international survey and systematic review with clinical practice recommendations", "title_zh": "聚多卡醇泡沫硬化疗法治疗痔疮疾病的真实应用：国际调查和系统评价以及临床实践建议的见解", "authors": "Azka Mustaan", "abstract_en": "No abstract", "abstract_zh": "无摘要", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40624403/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 07 Jul 2025"}, {"id": "40596934", "title_en": "Comparison of efficacy and safety between surgical and conservative treatments for hemorrhoids: a meta-analysis", "title_zh": "手术治疗和保守治疗痔疮的疗效和安全性比较：一项荟萃分析", "authors": "Xiaoqiang Jia", "abstract_en": "**Objectives:** Hemorrhoids, a common anorectal condition, can be managed through surgical or conservative treatments. The aim of this meta-analysis is to compare the efficacy and safety of surgical and conservative treatments for hemorrhoids.\n\n**Methods:** A systematic search was conducted from of PubMed, Embase, the Cochrane Library, and Web of Science from their inception to September 25, 2024. Eligible studies compared surgical treatments with non-invasive conservative treatments in hemorrhoids. Statistical analyses included pooled odds ratios (ORs) and mean differences (MDs)/standard mean differences (SMDs) with 95% confidence intervals (CIs).\n\n**Results:** Seven studies, including 760 patients, were analyzed. Surgery achieved higher rates of complete symptom resolution than conservative therapy (OR = 2.96, 95% CI: 1.66-5.28, p < 0.001). Overall pain scores favored surgery (SMD = -0.93, 95% CI: 1.73 to -0.13, p = 0.02). Subgroup analysis showed clear superiority within four days (SMD = -1.26, 95% CI -1.84 to -0.68) but parity beyond ten days (SMD = 0.00, 95% CI -0.44 to 0.44; p = 0.99). Comparable patterns were observed in pregnant women with thrombosed external hemorrhoids. Rates of postoperative bleeding (OR: 1.09; 95% CI: 0.42 to 2.82, p = 0.86; I2 = 41%, p = 0.15) and urinary retention (OR: 1.75; 95% CI: 0.30 to 10.31, p = 0.54; I2 = 45%, p = 0.18) did not differ significantly between groups. Surgical-specific adverse events were infrequent (incontinence 3%, persistent pain 5%, watery discharge 6%). Surgery shortened recovery in pregnant thrombosed cases by approximately seven days (MD: -6.80; 95% CI: -7.64 to -5.96, p < 0.001; I2 = 55%, p = 0.14) and reduced overall recurrence (95% CI: 0.10 to 0.37, p < 0.001; I2 = 0%, p = 0.97).\n\n**Conclusion:** Surgical treatments provide superior symptom relief, faster recovery, and lower recurrence but with some specific post-treatment complications, while conservative treatments are safer and less invasive but with provides slower symptom relief and higher recurrence rates. Individualized treatment should consider symptom severity, patient preferences, and risk tolerance.", "abstract_zh": "**Objectives：** 痔疮是一种常见的肛门直肠疾病，可以通过手术或保守治疗来治疗。这项荟萃分析的目的是比较手术治疗和保守治疗痔疮的疗效和安全性。\n\n**方法：** 对 PubMed、Embase、Cochrane 图书馆和 Web of Science 从成立到 2024 年 9 月 25 日期间进行了系统检索。符合条件的研究比较了痔疮的手术治疗与非侵入性保守治疗。统计分析包括合并优势比 (OR) 和平均差 (MD)/标准平均差 (SMD)，置信区间 (CI) 为 95%。\n\n**结果：** 对七项研究（包括 760 名患者）进行了分析。手术的症状完全缓解率高于保守治疗（OR = 2.96，95% CI：1.66-5.28，p < 0.001）。总体疼痛评分倾向于手术（SMD = -0.93，95% CI：1.73 至 -0.13，p = 0.02）。亚组分析显示四天内具有明显优势（SMD = -1.26，95% CI -1.84 至 -0.68），但十天后则具有同等性（SMD = 0.00，95% CI -0.44 至 0.44；p = 0.99）。在患有血栓性外痔的孕妇中观察到了类似的模式。术后出血率（OR：1.09；95% CI：0.42至2.82，p = 0.86；I2 = 41%，p = 0.15）和尿潴留率（OR：1.75；95% CI：0.30至10.31，p = 0.54； I2 = 45%，p = 0.18）组间没有显着差异。手术特异性不良事件并不常见（失禁 3%、持续性疼痛 5%、水样分泌物 6%）。手术使妊娠血栓病例的恢复时间缩短约 7 天（MD：-6.80；95% CI：-7.64 至 -5.96，p< 0.001；I2 = 55%，p = 0.14），并减少总体复发（95% CI：0.10 至 0.37，p< 0.001； I2 = 0%，p = 0.97）。\n\n**结论：** 手术治疗可有效缓解症状、加快恢复速度并降低复发率，但会出现一些特定的治疗后并发症，而保守治疗更安全且侵入性较小，但症状缓解较慢且复发率较高。个体化治疗应考虑症状严重程度、患者偏好和风险承受能力。", "keywords_zh": "保守治疗、痔疮、荟萃分析、手术治疗", "keywords_en": "Conservative treatment, Hemorrhoids, Meta-Analysis, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40596934/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 02 Jul 2025"}, {"id": "40576944", "title_en": "Operative versus nonoperative treatment of thrombosed external hemorrhoids: a systematic review and meta-analysis", "title_zh": "血栓性外痔的手术与非手术治疗：系统评价和荟萃分析", "authors": "Rachid Eduardo Noleto da Nobrega Oliveira", "abstract_en": "Thrombosed external hemorrhoids are a complication of hemorrhoids characterized by severe pain, swelling, and lump formation due to acute venous engorgement. Treatment options remain controversial, with limited evidence guiding the choice between surgical and conservative approaches. PubMed, Embase, and Cochrane Library databases were searched from inception to December 2024 to identify clinical trials comparing surgery with conservative treatment in thrombosed external hemorrhoids. Statistical analyses were performed using Review Manager 5.4.1 with a random-effects model. Heterogeneity was assessed using the I<sup>2</sup> test. We included six studies with a total of 851 patients, of whom 390 (45.8%) underwent surgical treatment. Surgical treatment was associated with a lower risk of recurrence compared to conservative management (RR 0.49; 95% CI 0.26-0.91; P < 0.05; I<sup>2</sup> = 54%). However, there were no significant differences in the risk of bleeding between the groups (RR 0.96; 95% CI 0.27-3.44; P = 0.95; I<sup>2</sup> = 60%). Subgroup analyses of the excision surgery group revealed no differences between approaches. Our main findings indicated no significant difference in bleeding between surgery and conservative treatment groups. However, operative management is associated with significantly lower recurrences, which should be the preferred choice.", "abstract_zh": "血栓性外痔是痔疮的一种并发症，其特征是由于急性静脉充血而导致剧烈疼痛、肿胀和肿块形成。治疗选择仍然存在争议，指导手术和保守治疗之间选择的证据有限。对 PubMed、Embase 和 Cochrane 图书馆数据库进行了检索，从最初到 2024 年 12 月，以识别比较手术与保守治疗血栓性外痔的临床试验。使用 Review Manager 5.4.1 和随机效应模型进行统计分析。使用 I<sup>2</sup> 检验评估异质性。我们纳入了 6 项研究，共 851 名患者，其中 390 名 (45.8%) 接受了手术治疗。与保守治疗相比，手术治疗的复发风险较低（RR 0.49；95% CI 0.26-0.91；P < 0.05；I<sup>2</sup> = 54%）。然而，各组之间的出血风险没有显着差异（RR 0.96；95% CI 0.27-3.44；P = 0.95；I<sup>2</sup> = 60%）。切除手术组的亚组分析显示方法之间没有差异。我们的主要发现表明手术治疗组和保守治疗组之间的出血没有显着差异。然而，手术治疗可显着降低复发率，这应该是首选。", "keywords_zh": "痔疮，非手术性，手术性，复发", "keywords_en": "Hemorrhoids, Nonoperative, Operative, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/40576944/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 27 Jun 2025"}, {"id": "40508850", "title_en": "Biopsychosocial Strategies for Alleviating Low Back Pain in Late Mothers: A Systematic Review", "title_zh": "缓解已故母亲腰痛的生物心理社会策略：系统评价", "authors": "Mariola Bidzan", "abstract_en": "<b>Background:</b> Low back pain (LBP) in older mothers is a prevalent and multifaceted condition influenced by a range of biopsychosocial factors. As the trend of late motherhood increases globally, it is essential to understand how LBP affects this population from a biopsychosocial perspective. <b>Objective:</b> This systematic review aims to examine the biopsychosocial determinants of LBP in older mothers by synthesizing findings from quantitative studies published between January 2010 and May 2024. Specifically, it explores the biological, psychological, and social factors contributing to LBP in this population and how it affects their daily lives and well-being. <b>Methods:</b> A comprehensive literature search was conducted across PubMed, PsychInfo, Web of Science, EMBASE, DARE, and the Cochrane Library. Studies were screened for eligibility based on predefined criteria. Five quantitative studies with a combined sample of 118,964 participants were included. The methodological quality was assessed, and data were extracted for analysis. <b>Results:</b> All five studies addressed biological aspects of LBP, including pelvic girdle pain, hemorrhoids, and varicose veins. Three studies also explored psychological factors such as depression and stress. Two studies incorporated social dimensions, including inadequate support systems, occupational burdens, and healthcare access barriers. Age and parity were consistently reported as exacerbating physical and psychological symptoms. <b>Conclusions:</b> This review highlights the importance of considering biopsychosocial factors when managing LBP in older mothers. Tailored interventions, such as exercise programs, family support, and workplace accommodations, are essential for improving outcomes. Further research using longitudinal studies is needed to explore these factors in greater depth.", "abstract_zh": "<b>背景：</b>高龄母亲的腰痛 (LBP) 是一种普遍存在的多方面疾病，受一系列生物心理社会因素的影响。随着全球晚孕趋势的增加，有必要从生物心理社会角度了解光体痛如何影响这一人群。 <b>目的：</b>本系统综述旨在通过综合 2010 年 1 月至 2024 年 5 月期间发表的定量研究结果，探讨老年母亲 LBP 的生物心理社会决定因素。具体而言，它探讨了导致该人群 LBP 的生物、心理和社会因素，以及它如何影响她们的日常生活和福祉。 <b>方法：</b>在 PubMed、PsychInfo、Web of Science、EMBASE、DARE 和 Cochrane 图书馆进行了全面的文献检索。根据预先定义的标准筛选研究资格。其中包括五项定量研究，合并样本为 118,964 名参与者。评估方法学质量，并提取数据进行分析。 <b>结果：</b>所有五项研究都涉及 LBP 的生物学方面，包括骨盆带疼痛、痔疮和静脉曲张。三项研究还探讨了抑郁和压力等心理因素。两项研究纳入了社会层面，包括支持系统不足、职业负担和医疗保健获取障碍。据一致报道，年龄和胎次会加剧身体和心理症状。 <b>结论：</b>本综述强调了在管理高龄母亲腰痛时考虑生物心理社会因素的重要性。量身定制的干预措施，例如锻炼计划、家庭支持和工作场所住宿，对于改善结果至关重要。需要使用纵向研究进行进一步研究，以更深入地探讨这些因素。", "keywords_zh": "生物心理社会因素、生物心理社会模型、腰痛、高龄母亲", "keywords_en": "biopsychosocial factors, biopsychosocial model, low back pain, older mothers", "link": "https://pubmed.ncbi.nlm.nih.gov/40508850/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 13 Jun 2025"}, {"id": "40493094", "title_en": "Limitations of the Goligher classification in randomized trials for hemorrhoidal disease: a qualitative systematic review of selection criteria", "title_zh": "痔疮疾病随机试验中 Goligher 分类的局限性：选择标准的定性系统评价", "authors": "G Gallo", "abstract_en": "**Background:** The diverse range of therapeutic options for hemorrhoidal disease (HD) highlights the need for precise classification systems to guide treatment. Although the Goligher classification remains the most widely used, it has been criticized for its simplicity and limited ability to capture symptom severity or guide treatment decisions. This study aims to evaluate the patient selection criteria and classification systems employed in randomized controlled trials (RCTs) for HD.\n\n**Methods:** A systematic review was conducted following the 2020 PRISMA guidelines. A comprehensive search of databases identified randomized controlled trials (RCTs) comparing treatments for HD, focusing on classification systems used for patient enrollment. Eligible studies included adult patients and at least one arm involving surgical treatment.\n\n**Results:** Out of 6692 records, 162 studies met the inclusion criteria, with a median cohort size of 84 patients and 55.4% male. Most studies (86.4%) used the Goligher system, though the majority did not fully describe or cite the system. Only 13.6% of studies employed more recent alternative classification systems. The most common outcome measures across studies were postoperative pain (147 studies) and complications (133 studies). Recurrence rates were reported in 42% of studies, yet 70% of these did not provide adequate inclusion criteria or references to Goligher's classification.\n\n**Conclusions:** The inconsistent application of the Goligher classification and the variability in patient selection criteria across RCTs highlight the need for more nuanced and standardized systems. Future research should focus on refining classification methods and incorporating patient-reported outcomes to improve the reliability and relevance of HD trials.\n\n**Prospero Registration:** CRD42023387339.", "abstract_zh": "**背景：** 痔疮疾病 (HD) 的治疗选择多种多样，凸显了需要精确的分类系统来指导治疗。尽管 Goligher 分类仍然是使用最广泛的分类，但它因其简单性和捕捉症状严重程度或指导治疗决策的能力有限而受到批评。本研究旨在评估 HD 随机对照试验 (RCT) 中采用的患者选择标准和分类系统。\n\n**方法：** 根据 2020 年 PRISMA 指南进行了系统审查。对数据库进行全面检索，确定了比较 HD 治疗方法的随机对照试验 (RCT)，重点关注用于患者入组的分类系统。符合条件的研究包括成年患者和至少一只涉及手术治疗的手臂。\n\n**结果：** 在 6692 项记录中，有 162 项研究符合纳入标准，队列规模中位数为 84 名患者，其中 55.4% 为男性。大多数研究 (86.4%) 使用 Goligher 系统，尽管大多数研究没有完全描述或引用该系统。只有 13.6% 的研究采用了更新的替代分类系统。研究中最常见的结果指标是术后疼痛（147 项研究）和并发症（133 项研究）。 42% 的研究报告了复发率，但其中 70% 的研究没有提供足够的纳入标准或对 Goligher 分类的参考。\n\n**结论：** Goligher 分类的应用不一致以及随机对照试验中患者选择标准的可变性突出表明需要更细致和标准化的系统。未来的研究应侧重于完善分类方法并纳入患者报告的结果，以提高 HD 试验的可靠性和相关性。\n\n**Prospero registration：** CRD42023387339。", "keywords_zh": "分类系统、Goligher 分类、痔疮疾病、痔疮、患者选择、随机对照试验", "keywords_en": "Classification systems, Goligher classification, Hemorrhoidal disease, Hemorrhoids, Patient selection, Randomized controlled trials", "link": "https://pubmed.ncbi.nlm.nih.gov/40493094/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 10 Jun 2025"}, {"id": "40481245", "title_en": "Real-world use of polidocanol foam sclerotherapy for hemorrhoidal disease: insights from an international survey and systematic review with clinical practice recommendations", "title_zh": "聚多卡醇泡沫硬化疗法治疗痔疮疾病的真实应用：国际调查和系统评价以及临床实践建议的见解", "authors": "Gianpiero Gravante", "abstract_en": "Polidocanol foam sclerotherapy has gained increasing attention as a minimally invasive treatment for hemorrhoidal disease (HD). However, significant variability exists in its clinical application regarding patient selection, procedural techniques, and postoperative management. This study aimed to assess real-world practice patterns among international experts, summarize existing evidence through a systematic literature review, and develop evidence-based clinical practice recommendations. A systematic review was conducted in MEDLINE, EMBASE, and CENTRAL to identify studies evaluating polidocanol foam sclerotherapy for HD. A total of 20 studies met the inclusion criteria. Additionally, an international survey was distributed to 30 experts in proctology and colorectal surgery to explore variations in indications, perioperative management, technique, and follow-up. Survey responses were analyzed descriptively to identify common trends and areas of divergence. Subsequently, based on both the experts' opinions and the results of the survey, a Delphi method was employed to produce clinical practice recommendations. The questions for the Delphi process were developed by the authors leading the project, followed by a detailed discussion with the whole panel of experts. Most experts (90%) reported using polidocanol foam sclerotherapy primarily for Goligher grade II HD, with 67% extending its use to grade III cases. Preoperative bowel preparation and anesthesia use varied widely. The preferred concentration was 3% polidocanol, with 2 mL injected per hemorrhoidal pile in most cases. Post-procedural care lacked standardization, though stool softeners and flavonoids were commonly recommended. Compared to rubber band ligation, polidocanol foam was perceived as having higher success rates (88.3% vs. 66.7%) and lower recurrence rates (16.1% vs. 41.2%). Adverse events were infrequent. The present article offers a comprehensive suite of clinical practice expert-based recommendations concerning the use of polidocanol foam sclerotherapy for HD. However, there is still significant variation in its application. These findings highlight the need for standardized guidelines and further research to optimize procedural strategies and long-term outcomes.", "abstract_zh": "聚多卡醇泡沫硬化疗法作为痔疮疾病（HD）的微创治疗方法越来越受到关注。然而，其临床应用在患者选择、手术技术和术后管理方面存在显着差异。本研究旨在评估国际专家的真实实践模式，通过系统文献综述总结现有证据，并制定基于证据的临床实践建议。 MEDLINE、EMBASE 和 CENTRAL 进行了系统评价，以确定评估聚多卡醇泡沫硬化疗法治疗 HD 的研究。共有 20 项研究符合纳入标准。此外，还向 30 名直肠病学和结直肠外科专家进行了一项国际调查，以探讨适应症、围手术期管理、技术和随访方面的差异。对调查回复进行描述性分析，以确定共同趋势和分歧领域。随后，根据专家意见和调查结果，采用德尔菲法提出临床实践建议。德尔菲流程的问题是由领导该项目的作者提出的，然后与整个专家小组进行了详细的讨论。大多数专家 (90%) 报告主要使用聚多卡醇泡沫硬化疗法治疗 Goligher II 级 HD，其中 67% 将其使用范围扩大到 III 级病例。术前肠道准备和麻醉使用差异很大。首选浓度是 3% 聚多卡醇，大多数情况下每个痔疮注射 2 mL。尽管通常推荐使用大便软化剂和类黄酮，但术后护理缺乏标准化。与橡皮筋结扎相比，聚多卡醇泡沫被认为具有更高的成功率（88.3% vs. 66.7%）和较低的复发率（16.1% vs. 41.2%）。不良事件很少发生。本文提供了一套基于临床实践专家的全面建议，涉及使用聚多卡醇泡沫硬化疗法治疗 HD。然而，其应用仍然存在显着差异。这些发现强调需要标准化指南和进一步研究来优化程序策略和长期结果。", "keywords_zh": "专家调查、痔疮疾病、聚多卡醇泡沫、硬化疗法、系统评价", "keywords_en": "Expert survey, Hemorrhoidal disease, Polidocanol foam, Sclerotherapy, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40481245/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 06 Jun 2025"}, {"id": "40192825", "title_en": "Botulinum toxin injection for management of post-haemorrhoidectomy pain: an updated systematic review and meta-analysis of randomised clinical trials", "title_zh": "肉毒毒素注射治疗痔疮切除术后疼痛：随机临床试验的最新系统评价和荟萃分析", "authors": "S Albayati", "abstract_en": "**Introduction:** Excisional haemorrhoidectomy remains the gold-standard treatment for grade III-IV haemorrhoids owing to the high success rate. However, post-operative pain management is an ongoing challenge. Botulinum toxin injection is thought to improve pain by targeting the internal anal sphincter spasm which occurs following haemorrhoidectomy. This systematic review and meta-analysis examines the effects of concurrent botulinum toxin injection on post-haemorrhoidectomy pain.\n\n**Methods:** A search of MEDLINE, EMBASE and Cochrane Databases for randomised controlled trials (RCTs) of botulinum toxin injection compared with placebo for management of post-haemorrhoidectomy pain was conducted following Preferred Reporting Items for Systematic Reviews and Meta-analyses (PRISMA) guidelines. Outcomes assessed included daily post-operative pain scores assessed using an analogue scale (0-10), pain at first defecation, analgesia use, complication rates and time to return to work.\n\n**Results:** A total of seven RCTs assessing 340 patients who underwent an excisional haemorrhoidectomy were included. In total, seven studies (n = 340) found significant reduction in pain post-procedure with botulinum toxin use on day 1 (mean difference, MD -1.53; 95% confidence intervals, CI -2.12, -0.94; p < 0.00001), with similar findings on day 2 and 4 (MD -1.84, 95% CI -3.28, -0.41; p = 0.01 and MD -1.63, 95% CI -2.15, -1.09; p < 0.00001, respectively). However, the analgesic effects were not seen on subsequent analyses up to day 14. Botulinum toxin was seen to be safe, with no significant difference in faecal incontinence (MD 1.05, 95% CI 0.40, 2.75; p = 0.93) or urinary retention (MD 0.37, 95% CI 0.09, 1.53; p = 0.17).\n\n**Conclusions:** Botulinum toxin use for pain relief post-excisional haemorrhoidectomy is safe and effective in the initial peri-operative period; however, the results were short-lived. Further, more robust randomised controlled trials are needed to strengthen these findings and determine the utility of botulinum toxin in this setting.\n\n**Trial Registration:** PROSPERO Register for Systematic Reviews Registration Number - CRD42024541351 on April 29 2024.", "abstract_zh": "**介绍：** 由于成功率高，痔切除术仍然是治疗 III-IV 级痔疮的金标准。然而，术后疼痛管理是一个持续的挑战。肉毒杆菌毒素注射被认为可以通过针对痔疮切除术后发生的肛门内括约肌痉挛来改善疼痛。这项系统评价和荟萃分析研究了同时注射肉毒毒素对痔疮切除术后疼痛的影响。\n\n**方法：** 根据系统评价和荟萃分析的首选报告项目 (PRISMA) 指南，在 MEDLINE、EMBASE 和 Cochrane 数据库中检索肉毒毒素注射与安慰剂治疗痔疮切除术后疼痛的随机对照试验 (RCT)。评估的结果包括使用模拟量表（0-10）评估的每日术后疼痛评分、首次排便时的疼痛、镇痛剂的使用、并发症发生率和返回工作时间。\n\n**结果：** 总共纳入了 7 项随机对照试验，评估了 340 名接受痔切除术的患者。总共有七项研究 (n = 340) 发现在第 1 天使用肉毒杆菌毒素可显着减轻术后疼痛（平均差，MD -1.53；95% 置信区间，CI -2.12，-0.94；p< 0.00001），第 2 天和第 4 天有类似的结果（MD -1.84，95% CI -3.28， -0.41；p = 0.01，MD -1.63，95% CI -2.15，-1.09；p < 0.00001）。然而，在随后的第 14 天分析中并未发现镇痛作用。肉毒杆菌毒素被认为是安全的，在大便失禁（MD 1.05，95% CI 0.40，2.75；p = 0.93）或尿潴留（MD 0.37，95% CI 0.09，1.53；p = 0.93）方面没有显着差异。 p = 0.17）。\n\n**结论：** 在围手术期初期，使用肉毒杆菌毒素缓解痔疮切除术后的疼痛是安全有效的；然而，结果是短暂的。此外，需要更强有力的随机对照试验来加强这些发现并确定肉毒杆菌毒素在这种情况下的效用。\n\n**Trial registration：** PROSPERO 于 2024 年 4 月 29 日注册系统评价注册号 - CRD42024541351。", "keywords_zh": "镇痛、肉毒杆菌毒素、痔疮切除术、疼痛、术后", "keywords_en": "Analgesia, Botulinum Toxins, Hemorrhoidectomy, Pain, Post-operative", "link": "https://pubmed.ncbi.nlm.nih.gov/40192825/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 07 Apr 2025"}, {"id": "40171091", "title_en": "Treatment of Hemorrhoidal Disease in Patients with Liver Cirrhosis: A Systematic Review", "title_zh": "肝硬化患者痔疮的治疗：系统评价", "authors": "Paulo Salgueiro", "abstract_en": "**Introduction:** The incidence of hemorrhoidal disease (HD) in cirrhotic patients is similar to that of general population, varying between 21% and 79%. Managing this clinical condition in these patients is challenging, due to the need to differentiate between bleeding originating from hemorrhoids or anorectal varices, and the unique hemostatic balance of each patient, which can lead to a decompensation of liver function and subsequently increase the anesthetic risk. To date, there are no systematic reviews specifically addressing this topic.\n\n**Methods:** This was a systematic review following the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Studies were retrieved from three electronic databases. Efficacy (symptomatic improvement, patient satisfaction, quality of life improvement, disease recurrence/need for surgery and/or hemorrhoidal prolapse reduction in anoscopy) and safety (reported adverse events) outcomes were evaluated. Data from each study were initially described individually, followed by a comparative analysis for procedures applied in multiple studies.\n\n**Results:** Six studies were included - 1 randomized clinical trial (RCT), 2 prospective cohort studies, 1 retrospective cohort study, and 2 case series. The considered techniques encompassed rubber band ligation (RBL), injection sclerotherapy (IS) using 3 agents - aluminum potassium sulfate and tannic acid (ALTA), ethanolamine oleate 5% (EAO), or N-butyl-cyanoacrylate, hemorrhoidopexy, and emborrhoid technique. RBL showed great symptomatic improvement and patient satisfaction in 63% and 73% of patients, respectively, and in 90% was associated with one-grade prolapse reduction after only one session. The most frequently reported adverse events included pain (16%) and ulceration/fissure (1-17%). Concerning IS, symptomatic improvement was observed in all patients. Recurrence rates varied with the agent used (EAO: 13% at 12 months; N-butyl-cyanoacrylate: 40% at 12 months; ALTA: 18% at 5 years), and 86.7% of patients exhibited more than one-grade reduction after the initial session. The most frequent adverse event was pain (EAO: 63%; N-butyl-cyanoacrylate: 60%). Stapled hemorrhoidopexy resulted in symptomatic improvement in all patients, although associated with a recurrence rate of 25% within 4 months. With an emborrhoid technique, 80% of the patients showed clinical improvement at a 3-month follow-up, without significant adverse events, at the cost of a 40% recurrence rate.\n\n**Conclusions:** All the treatment methods assessed in the included studies appear to be effective and safe in cirrhotic patients. This assumption challenges previous concerns regarding significant bleeding after office-based procedures like RBL in this population. Future research should prioritize RCT to thoroughly assess the management of HD in these patients, particularly addressing polidocanol foam sclerotherapy, a minimally invasive technique that has previously been shown to be more effective than RBL in the general population and in patients with bleeding disorders.", "abstract_zh": "**介绍：** 肝硬化患者中痔疮疾病 (HD) 的发病率与一般人群相似，在 21% 至 79% 之间变化。处理这些患者的这种临床状况具有挑战性，因为需要区分源自痔疮或肛门直肠静脉曲张的出血，以及每个患者独特的止血平衡，这可能导致肝功能失代偿，从而增加麻醉风险。迄今为止，还没有专门针对该主题的系统综述。\n\n**方法：** 这是遵循系统评价和荟萃分析首选报告项目 (PRISMA) 指南的系统评价。研究是从三个电子数据库中检索的。评估疗效（症状改善、患者满意度、生活质量改善、疾病复发/手术需要和/或肛门镜检查中痔疮脱垂减少）和安全性（报告的不良事件）结果。每项研究的数据最初都是单独描述的，然后对多项研究中应用的程序进行比较分析。\n\n**结果：** 纳入六项研究 - 1 项随机临床试验 (RCT)、2 项前瞻性队列研究、1 项回顾性队列研究和 2 项病例系列研究。考虑的技术包括橡皮筋结扎 (RBL)、使用 3 种药物的注射硬化疗法 (IS) - 硫酸铝钾和单宁酸 (ALTA)、5% 油酸乙醇胺 (EAO) 或氰基丙烯酸正丁酯、痔疮固定术和痔疮技术。 RBL 分别在 63% 和 73% 的患者中显示出极大的症状改善和患者满意度，并且 90% 的患者仅在一次疗程后就实现了一级脱垂减少。最常报告的不良事件包括疼痛（16%）和溃疡/裂隙（1-17%）。关于 IS，所有患者均观察到症状改善。复发率随所用药物的不同而变化（EAO：12 个月时为 13%；氰基丙烯酸正丁酯：12 个月时为 40%；ALTA：5 年时为 18%），86.7% 的患者在初次治疗后表现出超过一级的复发率。最常见的不良事件是疼痛（EAO：63%；氰基丙烯酸正丁酯：60%）。吻合器痔疮固定术使所有患者的症状得到改善，但 4 个月内复发率高达 25%。使用痔疮技术，80% 的患者在 3 个月的随访中表现出临床改善，没有明显的不良事件，但代价是 40% 的复发率。\n\n**结论：** 纳入研究中评估的所有治疗方法似乎对肝硬化患者有效且安全。这一假设挑战了之前对该人群进行 RBL 等办公室手术后出现大量出血的担忧。未来的研究应优先考虑随机对照试验，以彻底评估这些患者的 HD 治疗，特别是解决聚多卡醇泡沫硬化疗法，这是一种微创技术，此前已被证明在普通人群和出血性疾病患者中比 RBL 更有效。", "keywords_zh": "痔疮疾病，肝硬化，系统评价", "keywords_en": "Hemorrhoidal disease, Liver cirrhosis, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40171091/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 02 Apr 2025"}, {"id": "40161159", "title_en": "Hemorrhoidal Artery Ligation (HAL) vs. Rubber Band Ligation (RBL) for Second- and Third-Degree Hemorrhoids: A Systematic Review and Meta-Analysis", "title_zh": "二度和三度痔疮的痔动脉结扎 (HAL) 与橡皮筋结扎 (RBL)：系统评价和荟萃分析", "authors": "Ali Yasen Mohamedahmed", "abstract_en": "This systematic review investigates the outcomes of rubber band ligation (RBL) vs. hemorrhoidal artery ligation (HAL) for second and third-degree hemorrhoids. This review was designed, performed, and reported as per the recommendations of the Cochrane Handbook for Systematic Reviews of Interventions and Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Literature databases, including PubMed, Cochrane, Science Direct, and Google Scholar, were searched for studies comparing rubber band ligation vs. hemorrhoidal artery ligation for second- and third-degree hemorrhoids. The primary outcome was the recurrence of hemorrhoids, while post-operative bleeding, post-operative pain, surgical site infection, and success rate were the secondary outcomes. The literature search and inclusion criteria identified five studies (n=953) comparing HAL (n=548) vs. RBL (n=405). The recurrence rate was higher in the RBL group (28.4%) compared to the HAL group (19.3%) (odds ratio {OR}: 0.57, p=0.001). The two groups showed comparable results regarding post-operative pain (OR: 0.77, p=0.77), post-operative bleeding (OR: 1.48, p=0.44), and surgical site infection (risk difference: 0.00, p=0.67). Moreover, the short-term success rate was 85% in HAL compared to 86% in RBL (p=0.71). Rubber band ligation and hemorrhoidal artery ligation showed comparable short-term outcomes regarding symptom treatment, post-operative bleeding, and pain. However, HAL was superior in terms of recurrence rate.", "abstract_zh": "本系统综述研究了橡皮筋结扎 (RBL) 与痔动脉结扎 (HAL) 对于二度和三度痔疮的疗效。本综述是根据干预系统评价 Cochrane 手册以及系统评价和荟萃分析首选报告项目 (PRISMA) 指南的建议进行设计、执行和报告的。检索了包括 PubMed、Cochrane、Science Direct 和 Google Scholar 在内的文献数据库，查找比较橡皮筋结扎与痔动脉结扎治疗二度和三度痔疮的研究。主要结局是痔疮复发，次要结局是术后出血、术后疼痛、手术部位感染和成功率。文献检索和纳入标准确定了五项研究 (n=953)，比较 HAL (n=548) 与 RBL (n=405)。 RBL 组的复发率 (28.4%) 高于 HAL 组 (19.3%)（比值比 {OR}：0.57，p=0.001）。两组在术后疼痛（OR：0.77，p=0.77）、术后出血（OR：1.48，p=0.44）和手术部位感染（风险差异：0.00，p=0.67）方面的结果相当。此外，HAL 的短期成功率为 85%，而 RBL 的短期成功率为 86% (p=0.71)。橡皮筋结扎和痔动脉结扎在症状治疗、术后出血和疼痛方面显示出可比的短期结果。然而，HAL 在复发率方面更胜一筹。", "keywords_zh": "二度、三度痔疮，二度，三度痔疮，痔动脉结扎手术（晕），痔疮手术，直肠科，橡皮筋结扎手术", "keywords_en": "2nd and 3rd degree hemorrhoids, 2nd degree and 3rd degree haemorrhoids, hemorrhoidal artery ligation operation (halo), hemorrhoids surgery, proctology, rubber band ligation procedure", "link": "https://pubmed.ncbi.nlm.nih.gov/40161159/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 31 Mar 2025"}, {"id": "39917290", "title_en": "PROSPECT guideline for haemorrhoid surgery: A systematic review and procedure-specific postoperative pain management recommendations", "title_zh": "痔疮手术的 PROSPECT 指南：系统回顾和针对具体手术的术后疼痛管理建议", "authors": "Eric Albrecht", "abstract_en": "**Background:** Haemorrhoidectomy is associated with moderate-to-severe postoperative pain.\n\n**Objective:** The aim of this systematic review was to assess the available literature and update previous PROSPECT (procedure specific postoperative pain management) recommendations for optimal pain management after haemorrhoidectomy.\n\n**Design And Eligibility Criteria:** A systematic review utilising PROSPECT methodology was undertaken.\n\n**Data Sources:** Randomised controlled trials published in the English language from January 1, 2016 to February 2, 2022 assessing postoperative pain using analgesic, anaesthetic, and surgical interventions were identified from MEDLINE, EMBASE and Cochrane Database.\n\n**Results:** Of the 371 randomized controlled trials (RCTs) identified, 84 RCTs and 19 systematic reviews, meta-analyses met our inclusion criteria (103 publications). Interventions that improved postoperative pain relief included: paracetamol and nonsteroidal anti-inflammatory drugs or cyclo-oxygenase-2 selective inhibitors, systemic steroids, pudendal nerve block, topical metronidazole, topical diltiazem, topical sucralfate or topical glyceryl trinitrate, and intramuscular injection of botulinum toxin.\n\n**Discussion:** This review has updated the previous recommendations written by our group. Important changes are abandoning oral metronidazole and recommending topical metronidazole, topical diltiazem, topical sucralfate, topical glyceryl trinitrate. Botulinum toxin can also be administered. Contemporary publications confirm the analgesic effect of bilateral pudendal nerve block but invalidate recommendations on perianal infiltration. The choice of the surgery is mostly left to the discretion of the surgeons based on their experience, expertise, type of haemorrhoids, and risk of relapse. That said, excisional surgery is more painful than other procedures.", "abstract_zh": "**背景：** 痔切除术与中度至重度术后疼痛有关。\n\n**目的：** 本系统综述的目的是评估现有文献并更新之前的 PROSPECT（手术后特定疼痛管理）建议，以实现痔切除术后最佳疼痛管理。\n\n**Design and eligibility criteria：** 利用 PROSPECT 方法进行了系统审查。\n\n**Data sources：** 从 MEDLINE、EMBASE 和 Cochrane 数据库中找到了 2016 年 1 月 1 日至 2022 年 2 月 2 日以英文发表的随机对照试验，评估使用镇痛、麻醉和手术干预措施的术后疼痛。\n\n**结果：** 在确定的 371 项随机对照试验 (RCT) 中，其中 84 项随机对照试验和 19 项系统评价、荟萃分析符合我们的纳入标准（103 篇出版物）。改善术后疼痛缓解的干预措施包括：扑热息痛和非甾体抗炎药或环加氧酶2选择性抑制剂、全身类固醇、阴部神经阻滞、外用甲硝唑、外用地尔硫卓、外用硫糖铝或外用三硝酸甘油以及肌肉注射肉毒杆菌毒素。\n\n**讨论：** 这篇评论更新了我们小组之前撰写的建议。重要的变化是放弃口服甲硝唑，推荐外用甲硝唑、外用地尔硫卓、外用硫糖铝、外用三硝酸甘油。也可以施用肉毒杆菌毒素。当代出版物证实了双侧阴部神经阻滞的镇痛作用，但对肛周浸润的建议无效。手术的选择主要由外科医生根据他们的经验、专业知识、痔疮类型和复发风险自行决定。也就是说，切除手术比其他手术更痛苦。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39917290/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 07 Feb 2025"}, {"id": "39908072", "title_en": "Endovascular rectal artery embolisation (RAE) for symptomatic haemorrhoids", "title_zh": "血管内直肠动脉栓塞术（RAE）治疗有症状的痔疮", "authors": "Ian Chetter", "abstract_en": "This is a protocol for a Cochrane Review (intervention). The objectives are as follows: To assess the safety and clinical effectiveness of endovascular rectal artery embolisation (RAE) for symptomatic haemorrhoids.", "abstract_zh": "这是 Cochrane 综述（干预）的方案。目标如下： 评估血管内直肠动脉栓塞术（RAE）治疗有症状的痔疮的安全性和临床有效性。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39908072/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 05 Feb 2025"}, {"id": "39854786", "title_en": "The prevalence of incontinence after excisional hemorrhoidectomy and stapled hemorrhoidopexy: A systematic review and meta-analysis", "title_zh": "痔切除术和吻合器痔固定术后失禁的发生率：系统评价和荟萃分析", "authors": "Andrew G Hill", "abstract_en": "**Background:** Excisional hemorrhoidectomy and stapled hemorrhoidopexy are 2 common procedures for treating symptomatic hemorrhoids. However, concerns persist regarding the risk of postoperative complications and their unclear prevalence in the literature. This systematic review aims to evaluate and compare the prevalence of incontinence after stapled hemorrhoidopexy and excisional hemorrhoidectomy.\n\n**Methods:** A systematic search of Medline, EMBASE, and CENTRAL identified studies published in the past 25 years that reported incontinence after excisional treatments for hemorrhoids. Primary outcomes included early (<3 months) and late (≥3 months) fecal incontinence. Secondary outcomes included postoperative bleeding, urinary retention, and recurrence. Single-arm meta-analyses of proportions were performed using R with meta-regression.\n\n**Results:** In total, 139 studies were included in the meta-analysis, including 68 randomized controlled trials with 8,445 participants and 71 observational studies with 22,687 participants. Early incontinence rates were 5.32% in randomized controlled trials (95% confidence interval, 2.74-8.51%) and 1.03% in nonrandomized controlled trials (95% confidence interval, 0.28-2.09%). Late incontinence rates were 2.48% in randomized controlled trials (95% confidence interval, 1.09-4.25%) and 1.44% in nonrandomized controlled trials (95% confidence interval, 0.71-2.37%). There was no significant difference in the risk of incontinence or other postoperative complications between stapled hemorrhoidopexy and excisional hemorrhoidectomy, both in randomized controlled trials and nonrandomized controlled trials.\n\n**Conclusion:** Incontinence after stapled hemorrhoidopexy and excisional hemorrhoidectomy is uncommon, and there appears to be no significant difference in risk between the 2 procedures. However, considerable heterogeneity was observed, likely the result of differences in assessment and reporting methods across studies. Future research should standardize definitions and methods for assessing incontinence and include preoperative assessments to more accurately define the risks of complications associated with hemorrhoid surgery.", "abstract_zh": "**背景：** 痔切除术和吻合器痔固定术是治疗症状性痔疮的两种常见手术。然而，人们仍然对术后并发症的风险及其文献中不清楚的发生率表示担忧。本系统评价旨在评估和比较吻合器痔固定术和痔切除术后失禁的发生率。\n\n**方法：** 对 Medline、EMBASE 和 CENTRAL 的系统检索发现了过去 25 年发表的研究，这些研究报告了痔疮切除治疗后的失禁情况。主要结局包括早期（<3 个月）和晚期（≥3 个月）大便失禁。次要结局包括术后出血、尿潴留和复发。使用 R 和荟萃回归对比例进行单臂荟萃分析。\n\n**结果：** 荟萃分析总共纳入了 139 项研究，其中包括 68 项随机对照试验（8,445 名受试者）和 71 项观察性研究（22,687 名受试者）。随机对照试验中的早期失禁率为 5.32%（95% 置信区间，2.74-8.51%），非随机对照试验中的早期失禁率为 1.03%（95% 置信区间，0.28-2.09%）。随机对照试验中的晚期失禁率为 2.48%（95% 置信区间，1.09-4.25%），非随机对照试验中的晚期失禁率为 1.44%（95% 置信区间，0.71-2.37%）。在随机对照试验和非随机对照试验中，吻合器痔固定术和痔切除术之间的失禁或其他术后并发症的风险没有显着差异。\n\n**结论：** 吻合器痔固定术和痔切除术术后失禁并不常见，两种手术之间的风险似乎没有显着差异。然而，观察到相当大的异质性，这可能是各个研究的评估和报告方法存在差异的结果。未来的研究应该标准化评估失禁的定义和方法，并包括术前评估，以更准确地确定与痔疮手术相关的并发症的风险。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39854786/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 24 Jan 2025"}, {"id": "39465535", "title_en": "Haemorrhoid artery ligation - recto anal repair (HAL-RAR) blind versus Doppler: a systematic review and meta-analysis", "title_zh": "痔动脉结扎 - 直肠肛门修复 (HAL-RAR) 盲法与多普勒：系统评价和荟萃分析", "authors": "Joseph C H Kong", "abstract_en": "**Background:** Haemorrhoids remain a highly prevalent condition in Australia, affecting 39% of the adult Australian population. While haemorrhoidectomy remains the gold standard in the management of haemorrhoids, newer techniques such as haemorrhoid artery ligation-recto anal repair (HAL-RAR) are emerging as promising management modalities. We compare the efficacy of non-Doppler guided (non-DG) HAL-RAR versus Doppler-guided (DG) HAL-RAR in the management of haemorrhoids.\n\n**Methods:** This study was registered with PROSPERO (CRD42022353806) and adhered to PRISMA 2020 guidelines. We conducted a systematic review using Medline, Embase and Cochrane database for comparative studies between Doppler-guided HAL-RAR and non-Doppler-guided HAL-RAR in accordance with the PRISMA 2020 statement for reporting systematic reviews.\n\n**Results:** Five studies were included in our systematic review and meta-analysis. There was no clinically significant difference in operative times (SMD 0.46, 9% CI -3.16 0 4.08, P = 0.804) or post-operative bleeding (P = 0.142) between the two groups. DG HAL-RAR patients were more likely to have post-operative urinary retention (P < 0.001). Non-DG patients were less likely to experience recurrence (OR 5.12, P < 0.001).\n\n**Conclusion:** Our review of non-DG HAL-RAR compared to DG HAL-RAR reflects the non-inferiority of the non-DG HALRAR procedure. We hope that these results would provide a guide to clinicians performing HAL-RAR, and would provide some cost savings for institutions who are unable to procure the necessary equipment for DG HAL-RAR.", "abstract_zh": "**背景：** 痔疮在澳大利亚仍然是一种非常普遍的疾病，影响了 39% 的澳大利亚成年人口。虽然痔切除术仍然是痔疮治疗的金标准，但痔动脉结扎-直肠肛门修复术 (HAL-RAR) 等新技术正在成为有前途的治疗方式。我们比较了非多普勒引导 (non-DG) HAL-RAR 与多普勒引导 (DG) HAL-RAR 在痔疮治疗中的疗效。\n\n**方法：** 本研究已在 PROSPERO 注册 (CRD42022353806) 并遵守 PRISMA 2020 指南。我们根据 PRISMA 2020 系统评价报告声明，使用 Medline、Embase 和 Cochrane 数据库对多普勒引导的 HAL-RAR 和非多普勒引导的 HAL-RAR 进行了比较研究。\n\n**结果：** 我们的系统评价和荟萃分析中纳入了五项研究。两组之间的手术时间（SMD 0.46，9% CI -3.16 0 4.08，P = 0.804）或术后出血（P = 0.142）无临床显着差异。 DG HAL-RAR 患者术后尿潴留的可能性更高（P<0.001）。非 DG 患者复发的可能性较小（OR 5.12，P<0.001）。\n\n**结论：** 我们对非 DG HAL-RAR 与 DG HAL-RAR 相比的审查反映了非 DG HALRAR 程序的非劣效性。我们希望这些结果能为临床医生执行 HAL-RAR 提供指导，并为无法采购 DG HAL-RAR 必要设备的机构节省一些成本。", "keywords_zh": "多普勒引导 HALRAR、HALRAR、HAL-RAR、肛门固定术、痔疮、痔动脉结扎直肠肛门修复术、粘液固定术、非多普勒 HALRAR、直肠固定术", "keywords_en": "Doppler guided HALRAR, HALRAR, HAL‐RAR, anopexy, haemorrhoid, haemorrhoid artery ligation with recto‐anal repair, mucopexy, non‐Doppler HALRAR, rectopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/39465535/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 28 Oct 2024"}, {"id": "39416699", "title_en": "Unraveling current breakthroughs in <em>Scorodocarpus borneensis</em> phytochemical therapeutics: A systematic review", "title_zh": "揭示当前在<em>Scorodocarpus Borneensis</em>植物化学疗法方面的突破：系统评价", "authors": "Sabreena Safuan", "abstract_en": "<i>Scorodocarpus borneensis</i>, also known as the Kulim tree or Garlic tree, has been consumed by the local communities in Southeast Asia as traditional spice using its old leaves, stem bark, and seeds. The locals also used Kulim tree parts as conventional alternative to treat many diseases such as hemorrhoids, leprosy, diabetes, and diarrhea. However, there was limited scientific evidence to support these traditional claims. Therefore, this systematic review aims to present and evaluate a detailed overview of the phytochemical constituents of <i>S. borneensis</i> from previous existing studies, shedding light on their chemical composition, bioactivity, and potential applications. In addition, current studies regarding <i>S. borneensis</i> are still on a fundamental level. Hence, we aim that this review will reveal the research gap from the previous literature and provide an insight to implement a new research approach in the future. A literature search was conducted using four databases: ScienceDirect, Scopus, Web of Science, and PubMed. The articles were screened and data were extracted based on the PRISMA (Preferred Reporting Items for Systematic Reviews and Meta-Analyses) guideline. 8 studies satisfied the inclusion criteria that focused on the phytochemicals from <i>S. borneensis</i>. The major phytochemical compound reported was phenolic compound. S. borneensis also exhibits several therapeutic outcomes such as antioxidant, antimicrobial, and anticancer but current studies are not enough to support the claims regarding <i>S. borneensis</i> health benefit. In conclusion, this review highlights the current understanding of <i>S. borneensis'</i> phytochemical composition and its therapeutic applications which are important in preventing human diseases especially non-communicable diseases.", "abstract_zh": "<i>Scorodocarpus Borneensis</i> 也称为居林树或大蒜树，东南亚当地社区利用其老叶、茎皮和种子将其作为传统香料食用。当地人还使用居林树的部分作为传统替代品来治疗许多疾病，如痔疮、麻风病、糖尿病和腹泻。然而，支持这些传统说法的科学证据有限。因此，本系统综述旨在呈现和评估 S 植物化学成分的详细概述。 Borneensis </i>来自以前的现有研究，揭示了它们的化学成分、生物活性和潜在应用。此外，目前关于<i>S的研究。 Borneensis 仍处于基础水平。因此，我们的目标是这篇综述将揭示与先前文献的研究差距，并为未来实施新的研究方法提供见解。使用四个数据库进行文献检索：ScienceDirect、Scopus、Web of Science 和 PubMed。根据 PRISMA（系统评价和荟萃分析的首选报告项目）指南对文章进行筛选并提取数据。 8 项研究满足关注 S 植物化学物质的纳入标准。博尔登西斯</i>。报道的主要植物化学化合物是酚类化合物。婆罗沙门氏菌还表现出多种治疗效果，例如抗氧化、抗菌和抗癌，但目前的研究不足以支持有关婆罗门沙门氏菌的主张。婆罗洲</i> 对健康有益。总之，这篇评论强调了当前对 <i>S 的理解。婆罗洲的植物化学成分及其治疗应用对于预防人类疾病特别是非传染性疾病具有重要意义。", "keywords_zh": "抗糖尿病、抗氧化剂、生物活性化合物、酚类化合物、治疗潜力", "keywords_en": "Antidiabetic, Antioxidant, Bioactive compound, Phenolic compound, Therapeutic potential", "link": "https://pubmed.ncbi.nlm.nih.gov/39416699/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 17 Oct 2024"}, {"id": "39117876", "title_en": "Topical metronidazole after haemorrhoidectomy to reduce postoperative pain: a systematic review", "title_zh": "痔疮切除术后局部甲硝唑减轻术后疼痛：系统评价", "authors": "Stefano Arcieri", "abstract_en": "Excisional haemorrhoidectomy is the gold standard for operating haemorrhoids, but it is accompanied by a significant problem: postoperative pain. Several strategies have been adopted to minimize this condition. Oral metronidazole has been proven to reduce postoperative pain but with some complications. This systematic review was conducted to investigate the effects and general efficacy of topical metronidazole administration and to evaluate its potential superiority over the oral formula. A systematic review of the literature was carried out. Randomized controlled trials published until September 2023 on PubMed, Central, and Web of Science were considered. The primary outcome considered was postoperative pain, which was evaluated using visual analogue scores. The secondary outcomes were analgesic use, return to work, and complications. Six randomized controlled trials were included, with a total of 536 patients. Topical metronidazole was compared with placebo in two studies, with oral formula in three studies, and with placebo and oral administration in one study. Topical metronidazole was found to be effective for treating postoperative pain when compared to a placebo but had no significant advantage over the oral formula. No complications were reported in the studies. Topical and oral metronidazole are effective solutions for postoperative pain after excisional haemorrhoidectomy. No superiority was demonstrated based on the route of administration, and complications were marginal for both formulas. Further studies are required to determine the best metronidazole solution.", "abstract_zh": "痔疮切除术是痔疮手术的金标准，但它也伴随着一个显着的问题：术后疼痛。已采取多种策略来尽量减少这种情况。口服甲硝唑已被证明可以减轻术后疼痛，但会带来一些并发症。本系统评价的目的是研究局部甲硝唑给药的效果和总体疗效，并评估其相对于口服配方的潜在优越性。对文献进行了系统回顾。考虑了截至 2023 年 9 月在 PubMed、Central 和 Web of Science 上发表的随机对照试验。考虑的主要结果是术后疼痛，使用视觉模拟评分进行评估。次要结局是镇痛剂的使用、重返工作岗位和并发症。纳入 6 项随机对照试验，总共 536 名患者。两项研究中将外用甲硝唑与安慰剂进行了比较，三项研究中将外用甲硝唑与口服配方进行了比较，一项研究中将外用甲硝唑与安慰剂和口服给药进行了比较。与安慰剂相比，外用甲硝唑被发现可有效治疗术后疼痛，但与口服配方相比没有显着优势。研究中没有报告并发症。外用和口服甲硝唑是治疗痔疮切除术后疼痛的有效方法。根据给药途径，没有显示出任何优越性，两种配方的并发症都很轻微。需要进一步研究以确定最佳甲硝唑溶液。", "keywords_zh": "痔切除术，术后疼痛，系统评价，外用甲硝唑", "keywords_en": "Haemorrhoidectomy, Postoperative pain, Systematic review, Topical metronidazole", "link": "https://pubmed.ncbi.nlm.nih.gov/39117876/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 08 Aug 2024"}, {"id": "39084191", "title_en": "Conventional Excisional Haemorrhoidectomy versus Transanal Haemorrhoidal Dearterialization for Haemorrhoids: A Systematic Review and Meta-Analysis", "title_zh": "传统痔疮切除术与经肛门痔疮脱动脉术治疗痔疮：系统评价和荟萃分析", "authors": "Shaheel Mohammad Sahebally", "abstract_en": "**Introduction:** Although effective, conventional excisional haemorrhoidectomy (CEH) is associated with significant postoperative pain. Novel techniques such as transanal haemorrhoidal dearterialization (THD) are suggested to reduce pain but may result in higher recurrence rates. We aimed to compare short- and long-term outcomes of CEH and THD in the present meta-analysis.\n\n**Methods:** A PRISMA-compliant meta-analysis was performed, searching PubMed, Embase, and CENTRAL databases for randomised controlled trials (RCTs) from 1995 to December 2022. The primary objective was recurrence. Secondary objectives included complication rates, length of stay (LOS), operative time, and time to return to baseline. Random-effects models were used to calculate pooled effect size estimates. Subgroup analysis was also performed.\n\n**Results:** A total of 6 RCTs encompassing 465 patients were captured. There were 142 (59%) males in the CEH group and 129 (54%) in the THD group. On random-effects analysis, THD had a higher recurrence rate (odds ratio = 2.76, 95% confidence interval [CI] = 1.03-7.38, p = 0.04) albeit a shorter return to baseline compared to CEH (mean difference = -14.05 days, 95% CI = -20.38 to -7.72, p &lt; 0.0001). There were no differences in bleeding (p = 0.12), urinary retention (p = 0.97), incontinence (p = 0.41), anal stenosis (p = 0.19), thrombosed residual haemorrhoids (p = 0.16), operating time (p = 0.19), or LOS (p = 0.22). Results remained similar on subgroup analysis.\n\n**Conclusions:** CEH is associated with lower recurrence but similar complication rates to THD, although patients take longer to return to baseline function postoperatively.", "abstract_zh": "**介绍：** 传统的痔疮切除术（CEH）虽然有效，但会带来严重的术后疼痛。建议采用经肛门痔疮去动脉化（THD）等新技术来减轻疼痛，但可能会导致更高的复发率。我们的目的是在本荟萃分析中比较 CEH 和 THD 的短期和长期结果。\n\n**方法：** 进行了符合 PRISMA 标准的荟萃分析，在 PubMed、Embase 和 CENTRAL 数据库中搜索 1995 年至 2022 年 12 月的随机对照试验 (RCT)。主要目标是复发。次要目标包括并发症发生率、住院时间 (LOS)、手术时间和恢复基线的时间。使用随机效应模型来计算汇总效应大小估计值。还进行了亚组分析。\n\n**结果：** 总共捕获了 6 项随机对照试验，涉及 465 名患者。 CEH 组有 142 名男性（59%），THD 组有 129 名男性（54%）。在随机效应分析中，与 CEH 相比，THD 的复发率较高（比值比 = 2.76，95% 置信区间 [CI] = 1.03-7.38，p = 0.04），尽管返回基线的时间较短（平均差 = -14.05 天，95% CI = -20.38 至 -7.72，p < 0.0001）。出血（p = 0.12）、尿潴留（p = 0.97）、失禁（p = 0.41）、肛门狭窄（p = 0.19）、血栓残留痔疮（p = 0.16）、手术时间（p = 0.19）或LOS（p = 0.22）方面没有差异。亚组分析结果仍然相似。\n\n**结论：** 尽管患者术后需要更长的时间才能恢复到基线功能，但 CEH 的复发率较低，但并发症发生率与 THD 相似。", "keywords_zh": "脱肛、切除、痔疮、脱垂、复发", "keywords_en": "Dearterialization, Excision, Haemorrhoids, Prolapse, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/39084191/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 31 Jul 2024"}, {"id": "39048788", "title_en": "A systematic review comparing the efficacy of 980 nm vs. 1470 nm wavelengths in laser hemorrhoidoplasty", "title_zh": "比较 980 nm 与 1470 nm 波长在激光痔疮成形术中的功效的系统评价", "authors": "Peter C Ambe", "abstract_en": "**Background:** Laser Hemorrhoidoplasty (LHP) is a minimally invasive surgical option for the management of hemorrhoidal disease that has been increasingly adopted by surgeons over the last decade. Two wavelengths; 980 nm and 1470 nm have been employed in LHP. However, no data exist comparing the effects of these two wavelengths for this indication. This systematic review investigates both wavelengths for the management of hemorrhoids via the LHP procedure.\n\n**Methods:** This systematic analysis and meta-analysis was performed following the PICOS and PRISMA guidelines. A systematic research of MEDLINE, Scopus, Clinicaltrials.gov, Embase, Cochrane Central Register of Controlled Trials, CENTRAL and Google Scholar databases from inception until March 2024 was performed.\n\n**Results:** Overall, 19 studies including seven randomized control trials (RCT) and 12 non-randomized control trials with a total of 2492 patients were included in this systematic review and meta-analysis. The duration of LHP with both wavelengths was significantly shorter compared to open hemorrhoidectomy, postoperative pain and the rate of postoperative complications were significantly lower following LHP. There was no statistically significant difference in the rate of recurrence between LHP with the 980-nm wavelength and open hemorrhoidectomy. However, LHP with 1470-nm wavelength resulted in significantly higher recurrence rate compared to hemorrhoidectomy.\n\n**Conclusion:** Although no direct studies have compared the two wavelengths used in LHP, the outcomes of LHP seem to be independent of the wavelength used. Both wavelengths, when correctly used provide similar results, which are mostly better compared to open hemorrhoidectomy in terms of postoperative complications and postoperative pain, but not in terms of recurrence, where at least for the 1470-nm wavelength, LHP seems to show a higher recurrence rate when compared to open hemorrhoidectomy. Although a direct comparison of both wavelengths was not possible, technical issues regarding number of shots and energy per pile represent relevant parameters for recurrence after LHP.", "abstract_zh": "**背景：** 激光痔疮成形术 (LHP) 是一种用于治疗痔疮疾病的微创手术选择，在过去十年中越来越多地被外科医生采用。两个波长； LHP 中使用了 980 nm 和 1470 nm。然而，没有数据比较这两种波长对此指示的影响。本系统综述研究了通过 LHP 程序治疗痔疮的两​​种波长。\n\n**方法：** 该系统分析和荟萃分析是按照 PICOS 和 PRISMA 指南进行的。对 MEDLINE、Scopus、Clinicaltrials.gov、Embase、Cochrane 对照试验中央注册库、CENTRAL 和 Google Scholar 数据库（从开始到 2024 年 3 月）进行了系统研究。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 尽管没有直接研究比较 LHP 中使用的两种波长，但 LHP 的结果似乎与所使用的波长无关。如果正确使用，这两种波长都会提供相似的结果，在术后并发症和术后疼痛方面，与开放式痔切除术相比，这两种波长大多更好，但在复发方面则不然，至少对于 1470 nm 波长，与开放式痔疮切除术相比，LHP 似乎表现出更高的复发率。尽管无法直接比较两种波长，但有关发射次数和每堆能量的技术问题代表了 LHP 后复发的相关参数。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "1470-nm wavelength, 980-nm wavelength, Hemorrhoidal surgery, Hemorrhoids, LHP, Laser hemorrhoidoplasty", "link": "https://pubmed.ncbi.nlm.nih.gov/39048788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 24 Jul 2024"}, {"id": "38863870", "title_en": "Efficacy and Safety of Snap Needles in the Treatment of Postoperative Hemorrhoidal Pain: A Systematic Review and Meta-Analysis", "title_zh": "卡扣针治疗痔疮术后疼痛的疗效和安全性：系统评价和荟萃分析", "authors": "Yuming Gu", "abstract_en": "**Purpose:** The aim of this study is to evaluate the efficacy and safety of Snap Needles (SN) in the management of Postoperative Hemorrhoidal Pain (POHP).\n\n**Patients And Methods:** A systematic search was conducted in various databases, including EMBASE, Web of Science, PubMed, WanFang database, China National Knowledge Infrastructure (CNKI), China Biomedical Literature Database (CBM), and China Science and Technology Journal Database (VIP), spanning from their inception to August 2023, to identify relevant randomized controlled trials (RCTs) on SN for POHP. The primary outcome measure was the Visual Analog Scale (VAS), while secondary outcomes encompassed the Total Effective Rate (TER), Wound Healing Time (WHT), Pain Relief Time (PRT), Pain Disappearance Time (PDT), and Adverse Events (AEs). The Cochrane Risk of Bias Tool was employed to assess the quality of individual studies. A meta-analysis was conducted using RevMan 5.4.1 software.\n\n**Results:** The meta-analysis included 11 RCTs involving 1188 POHP patients, with an overall assessment of study quality ranging from very low to moderate. The findings revealed that the SN group exhibited significant improvements in treatment outcomes when compared to the control group (CG). These improvements were reflected in reduced VAS scores (mean difference [MD] = -1.10, 95% confidence interval [CI]: -1.31, -0.89, <i>P</i> < 0.05), shorter WHT (MD = -2.55, 95% CI: -3.02, -2.09, <i>P</i> < 0.05), quicker PRT (MD = -7.99, 95% CI: -8.48, -7.49, <i>P</i> < 0.05), fewer AEs (risk ratio [RR] = 0.38, 95% CI: 0.22, 0.67, <i>P</i> < 0.05), improved TER (RR = 1.18, 95% CI: 1.09, 1.27, <i>P</i> < 0.05), and faster PDT (MD = 19.24, 95% CI: 14.17, 24.31, <i>P</i> < 0.05).\n\n**Conclusion:** The use of SN appears to yield favorable outcomes in the treatment of POHP, and is potentially an alternative therapy to western drug therapy.", "abstract_zh": "**Purpose：** 本研究的目的是评估卡扣针 (SN) 在治疗术后痔疮疼痛 (POHP) 中的有效性和安全性。\n\n**Patients and methods：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 荟萃分析包括 11 项随机对照试验，涉及 1188 名 POHP 患者，研究质量的总体评估范围从非常低到中等。研究结果显示，与对照组 (CG) 相比，SN 组的治疗结果有显着改善。这些改进体现在VAS评分降低（平均差[MD] = -1.10，95%置信区间[CI]：-1.31，-0.89，<i>P</i> < 0.05），较短的WHT（MD = -2.55，95% CI：-3.02，-2.09，<i>P</i> < 0.05），更快的PRT（MD = -7.99， 95% CI：-8.48、-7.49、<i>P</i> < 0.05）、较少 AE（风险比 [RR] = 0.38、95% CI：0.22、0.67、<i>P</i> < 0.05）、TER 改善（RR = 1.18、95% CI：1.09、1.27、 <i>P</i> < 0.05），以及更快的 PDT（MD = 19.24，95% CI：14.17、24.31，<i>P</i> < 0.05）。\n\n**结论：** SN 的使用似乎在 POHP 的治疗中产生了良好的效果，并且有可能成为西药治疗的替代疗法。", "keywords_zh": "POHP，SN，耳针，荟萃分析，术后痔疮疼痛，卡扣针，系统评价", "keywords_en": "POHP, SN, auricular acupuncture, meta-analysis, postoperative hemorrhoidal pain, snap needles, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/38863870/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 12 Jun 2024"}, {"id": "38847122", "title_en": "Flavonoids and post haemorrhoidectomy recovery: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Andrew G Hill", "abstract_en": "**Background:** Haemorrhoidectomy is the gold standard for definitive treatment of high-grade symptomatic haemorrhoids but is often associated with substantial pain. This systematic review aims to explore the potential of flavonoids in alleviating the postoperative symptom burden following excisional haemorrhoidectomy.\n\n**Methods:** A systematic review of the literature was conducted according to Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines (PROSPERO CRD42023472711). Randomized controlled trials (RCTs) published PubMed, MEDLINE, Embase, and Scopus from inception to 1st December 2023 were retrieved. The primary outcome investigated was post-operative pain. Meta-analysis was performed using Review Manager version 5.4.1.\n\n**Results:** Ten articles with 775 patients were included. The meta-analysis identified statistically significant decreases in post-operative pain in favour of the flavonoid groups (Standardized Mean Difference -0.66 [95% confidence intervals (CI) -0.82, -0.52]; P < 0.00001), and bleeding (Odds Ratio 0.13 [95% CI 0.09, 0.19]; P < 0.00001).\n\n**Conclusion:** Flavonoids show promise as a means of reducing pain associated with excisional haemorrhoidectomy. Further research is required to investigate topical routes of administration and standardize regimes.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "analgesia, flavonoids, haemorrhoidectomy, haemorrhoids, meta‐analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/38847122/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 07 Jun 2024"}, {"id": "38797982", "title_en": "Is routine histopathological analysis of hemorrhoidectomy specimens necessary? A systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Andrew Hill", "abstract_en": "**Background:** Hemorrhoidectomy is a common procedure used to treat symptomatic hemorrhoids. However, the necessity and cost-effectiveness of routinely conducting histopathological analysis on excised tissue samples are uncertain.\n\n**Methods:** A systematic review was conducted using MEDLINE and EMBASE up to December 2023 for studies assessing the histopathological outcomes of hemorrhoidectomy specimens. Meta-analysis was performed on articles with combinable results to determine the pooled proportions of cancer and anal intraepithelial neoplasia (AIN) using the random effects model.\n\n**Results:** From 2974 initial search results, 12 studies were included in the review, with 48,365 resected specimens from hemorrhoidectomy. Among these, there were 11 retrospective studies and one prospective study. A meta-analysis of 11 studies revealed that the prevalence of anal cancer was low, at 0.13% (95% CI: 0.05%-0.31%). The prevalence of anal cancer and AIN combined was 1.16% (95% CI: 0.53%-2.52%).\n\n**Conclusion:** This literature review estimated the probability of malignancy detection in hemorrhoid specimens sent for histopathological evaluation. The low incidence of malignant findings implies that routine analysis of hemorrhoidectomy samples may not be cost-effective. However, existing studies have yet to establish definitive risk factors for abnormal histological diagnoses to aid in the selection of specimens for selective histopathology.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal cancer, hemorrhoidectomy, hemorrhoids, histology, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/38797982/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 27 May 2024"}, {"id": "38762410", "title_en": "Diode laser hemorrhoidoplasty versus conventional Milligan-Morgan and Ferguson hemorrhoidectomy for symptomatic hemorrhoids: Meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.T
