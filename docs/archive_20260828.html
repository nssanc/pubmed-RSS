R&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 22 Nov 2022"}, {"id": "36271904", "title_en": "Placebo Response Rates in Randomized Controlled Trials for Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "肛周克罗恩病随机对照试验中的安慰剂反应率：系统评价和荟萃分析", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** Perianal fistulizing disease is a common complication of Crohn's disease [CD], for which new therapies are urgently needed. To assist the design of clinical trials for novel therapeutics, we conducted a systematic review and meta-analysis of randomised controlled trials [RCTs] to quantify placebo rates and identify factors influencing them in perianal CD [pCD].\n\n**Methods:** We searched MEDLINE, Embase and CENTRAL from inception to June 2021. Eligible studies were placebo-controlled trials of pharmacological interventions for pCD. Placebo fistula response and remission rates for induction and maintenance trials were extracted and pooled using a random-effects model. Mixed-effects meta-regression was used to evaluate the impact of patient and study-level characteristics on point estimates.\n\n**Results:** In 17 RCTs [13 induction, five maintenance] the pooled placebo fistula response and remission rate for induction trials was 25% (95% confidence interval [CI] 17-36%) and 17% [95% CI 11-25%], respectively. For maintenance trials, the pooled placebo fistula response and remission rate was 23% [95% CI 17-32%] and 19% [95% CI 14-25%], respectively. Trials enrolling patients with less disease activity and a higher proportion with ileal predominant disease were associated with significantly higher placebo response rates. Trials originating in Europe [compared to North America], therapies requiring perianal injection and a longer timepoint to measure remission were associated with higher placebo remission rates.\n\n**Conclusions:** Placebo response and remission rates in pCD trials are influenced by patient and disease-related factors, as well as the type of intervention being studied. These contemporary rates will inform trial design for novel therapeutics.", "abstract_zh": "**Background and aims：** 肛周瘘管病是克罗恩病[CD]的常见并发症，迫切需要新的治疗方法。为了协助设计新疗法的临床试验，我们对随机对照试验 [RCT] 进行了系统回顾和荟萃分析，以量化肛周 CD [pCD] 中的安慰剂率并确定影响安慰剂率的因素。\n\n**方法：** 我们检索了从开始到 2021 年 6 月的 MEDLINE、Embase 和 CENTRAL。符合条件的研究是针对 pCD 药物干预的安慰剂对照试验。使用随机效应模型提取并汇总诱导和维持试验的安慰剂瘘管反应和缓解率。混合效应元回归用于评估患者和研究水平特征对点估计的影响。\n\n**结果：** 在 17 项随机对照试验（13 项诱导，5 项维持）中，诱导试验的汇总安慰剂瘘反应和缓解率分别为 25%（95% 置信区间 [CI] 17-36%）和 17% [95% CI 11-25%]。对于维持试验，合并安慰剂瘘管反应和缓解率分别为 23% [95% CI 17-32%] 和 19% [95% CI 14-25%]。招募疾病活动性较低且回肠主要疾病比例较高的患者的试验与显着较高的安慰剂反应率相关。源自欧洲的试验[与北美相比]，需要肛周注射和较长时间点来测量缓解的治疗与较高的安慰剂缓解率相关。\n\n**结论：** pCD 试验中的安慰剂反应和缓解率受到患者和疾病相关因素以及正在研究的干预类型的影响。这些当代的比率将为新疗法的试验设计提供信息。", "keywords_zh": "肛周克罗恩病，临床试验，安慰剂", "keywords_en": "Peri-anal Crohn’s disease, clinical trials, placebo", "link": "https://pubmed.ncbi.nlm.nih.gov/36271904/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sat, 22 Oct 2022"}, {"id": "36176822", "title_en": "A Comparison of Different Surgical Treatments for Complex Anal Fistula: A Systematic Review", "title_zh": "复杂肛瘘不同手术治疗的比较：系统评价", "authors": "Pousette Hamid", "abstract_en": "Fistula-in-ano is a common proctological condition that primarily affects younger people and leads to chronic morbidity. An anal fistula is divided into simple and complex fistulas. A complex fistula is a challenging problem due to higher recurrence rates and incontinence associated with surgery. Many new methods have been developed for the closure of complex fistula-in-ano, but there is no single best method. The aim of this study is to identify a superior surgical technique for treating complex/high cryptoglandular perianal fistulas (HCPFs). A literature search was done using PubMed and Google Scholar for the period of 2012-2021. Articles that contain surgical treatment for complex anal fistula in the English language published in the last 10 years were included. The types of studies included were randomized controlled trials (RCTs), meta-analyses, systematic reviews, cohort studies, and traditional reviews. Articles excluded were those done more than 10 years ago, in other languages, and containing simple fistula management only. Nine studies were included in the review; a systematic review and meta-analysis concluded that no single method is effective. The ligation of the intersphincteric fistula tract (LIFT) procedure seems to be a promising and effective technique as it has a low rate of fecal incontinence as compared to other methods. Biological techniques give variable success rates so does fistula plug (FP). Mucosal advancement flap (MAF) and rerouting seton give good results according to one study. Fistula plug gives variable results and is not a preferred method. Ligation of the intersphincteric fistula tract (LIFT) seems to be a promising new technique for complex anal fistulas, but the data available is not enough to determine the best method. More randomized trials are required to compare traditional techniques and emerging new biological methods to see the best technique available.", "abstract_zh": "肛瘘是一种常见的直肠疾病，主要影响年轻人并导致慢性发病。肛瘘分为单纯性肛瘘和复杂性肛瘘。由于较高的复发率和与手术相关的失禁，复杂的瘘管是一个具有挑战性的问题。人们已经开发出许多新方法来闭合复杂的肛瘘，但没有单一的最佳方法。本研究的目的是确定一种治疗复杂/高位隐腺肛周瘘（HCPF）的优越手术技术。使用 PubMed 和 Google Scholar 进行了 2012-2021 年期间的文献检索。包含过去 10 年发表的英文版复杂肛瘘手术治疗的文章。纳入的研究类型包括随机对照试验 (RCT)、荟萃分析、系统评价、队列研究和传统评价。排除的文章是 10 多年前以其他语言发表的文章，并且仅包含简单的瘘管治疗。审查中纳入了九项研究；系统评价和荟萃分析得出的结论是，没有任何单一方法是有效的。括约肌间瘘管结扎（LIFT）手术似乎是一种有前途且有效的技术，因为与其他方法相比，它的大便失禁率较低。生物技术的成功率各不相同，瘘管塞 (FP) 也是如此。一项研究表明，粘膜推进瓣 (MAF) 和改道挂线可取得良好效果。瘘管栓塞会产生不同的结果，不是首选方法。括约肌间瘘管结扎术（LIFT）似乎是治疗复杂肛瘘的一种有前途的新技术，但现有数据不足以确定最佳方法。需要更多的随机试验来比较传统技术和新兴的生物方法，以确定可用的最佳技术。", "keywords_zh": "引流挂线、直肠内推进皮瓣、大便失禁、高位隐腺肛周瘘、直肠瘘", "keywords_en": "draining seton, endorectal advancement flap, fecal incontinence, high cryptoglandular perianal fistula, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/36176822/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 30 Sep 2022"}, {"id": "36130090", "title_en": "Perianal Crohn's Disease and the Development of Colorectal and Anal Cancer: A Systematic Review and Meta-analysis", "title_zh": "肛周克罗恩病与结直肠癌和肛门癌的发展：系统评价和荟萃分析", "authors": "Johan Burisch", "abstract_en": "**Background And Aims:** The aim of this systematic review was to assess the literature on the incidence and risk factors for colorectal cancer and anal cancer in patients with perianal Crohn's disease.\n\n**Method:** A systematic review of the literature was performed using PubMed, Embase and Google Scholar. A meta-analysis was then conducted using a random-effects model.\n\n**Results:** Five studies were included in the systematic review. Of the total patients, 26.5% had perianal Crohn's disease. The median follow-up was 6 years. In total, 127 cases of colorectal cancer were found [0.43% of the included Crohn's disease patients]. Perianal involvement was present in 50% of colorectal cancer patients [0.89% of the population]. Three of the studies specified the cancer to be rectal or anal, which were present in 68 and 24 cases [0.3% and 0.1% of patients], respectively. In a subgroup analysis of rectal and anal cancer, perianal involvement was most frequent in anal cancer, accounting for 46% of the cases. In the rectal cancer group, 37% had perianal involvement. The higher incidence of colorectal cancer in patients with perianal Crohn's disease was confirmed in a meta-analysis.\n\n**Conclusion:** Half of the patients with colorectal cancer and anal cancer were found to have perianal Crohn's disease. In patients with perianal involvement, there was a higher percentage of anal cancer compared with rectal cancer. These results support the theory that patients with perianal Crohn's disease are at increased risk for developing colorectal and anal cancer. Studies collecting more detailed data regarding patients and their cancers are needed to further specify the disease course.", "abstract_zh": "**Background and aims：** 本系统评价的目的是评估有关肛周克罗恩病患者结直肠癌和肛门癌的发病率和危险因素的文献。\n\n**Method：** 使用 PubMed、Embase 和 Google Scholar 对文献进行了系统回顾。然后使用随机效应模型进行荟萃分析。\n\n**结果：** 系统评价中纳入了五项研究。在所有患者中，26.5%患有肛周克罗恩病。中位随访时间为 6 年。总共发现了 127 例结直肠癌病例[占克罗恩病患者的 0.43%]。 50% 的结直肠癌患者（占人口的 0.89%）存在肛周受累。其中三项研究指定癌症为直肠癌或肛门癌，分别有 68 例和 24 例病例[占患者的 0.3% 和 0.1%]。在直肠癌和肛门癌的亚组分析中，肛门癌中肛周受累最常见，占病例的 46%。在直肠癌组中，37% 有肛周受累。一项荟萃分析证实，肛周克罗恩病患者结直肠癌的发病率较高。\n\n**结论：** 一半的结直肠癌和肛门癌患者被发现患有肛周克罗恩病。在肛周受累的患者中，与直肠癌相比，肛门癌的比例更高。这些结果支持这样的理论：肛周克罗恩病患者患结直肠癌和肛门癌的风险增加。需要收集有关患者及其癌症的更详细数据的研究来进一步明确疾病进程。", "keywords_zh": "肛周克罗恩病、结直肠癌、荟萃分析", "keywords_en": "Perianal Crohn’s disease, colorectal cancer, meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/36130090/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 21 Sep 2022"}, {"id": "36005069", "title_en": "Do Patient-Reported Quality-of-Life (QoL) Scales Provide an Adequate Assessment of Patients with Cryptoglandular Anal Fistulae? A Systematic Review of Measurement Instruments and Their Content Validity", "title_zh": "患者报告的生活质量 (QoL) 量表是否可以对隐腺肛瘘患者进行充分的评估？测量仪器及其内容有效性的系统审查", "authors": "Phil Tozer", "abstract_en": "**Background:** Cryptoglandular anal fistulae can significantly affect patient quality of life (QoL), making it essential to ensure that any study of fistula treatment assesses the impact on QoL. The aim of this systematic review was to evaluate the content validity of Patient-Reported Outcome Measures (PROMs) that assess QoL in patients with a fistula.\n\n**Methods:** MEDLINE, EMBASE, PsycINFO, and Scopus were searched and studies assessing the content validity of patient-reported QoL measurement instruments, or PROM development studies in patients with cryptoglandular anal fistulae, were included. Data were extracted from eligible studies to determine the instruments' relevance, comprehensiveness, and comprehensibility, and their quality was assessed according to COnsensus-based Standards for the Selection of health Measurement Instruments (COSMIN).\n\n**Results:** Two PROM development studies were identified, both of which described the development of a disease-specific QoL measurement instrument for patients with cryptoglandular anal fistulae. The overall content validity of these instruments was inconsistent and supported by very low-quality evidence. There were no studies assessing the content validity of established QoL measurement instruments in patients with fistulae.\n\n**Conclusions:** This systematic review could not establish the content validity of the available QoL PROMs for patients with anal fistulae, due either to the absence of designated content validity studies or a lack of comprehensiveness of the available PROMs. This highlights an important gap in the literature that needs to be addressed to ensure high-quality outcome assessment in patients with fistulae.", "abstract_zh": "**背景：** 隐腺肛瘘可显着影响患者的生活质量 (QoL)，因此必须确保任何瘘管治疗研究都能评估其对生活质量的影响。本系统评价的目的是评估评估瘘管患者生活质量的患者报告结果测量 (PROM) 的内容有效性。\n\n**方法：** 检索了 MEDLINE、EMBASE、PsycINFO 和 Scopus，纳入了评估患者报告的 QoL 测量仪器内容有效性的研究，或隐窝腺肛瘘患者的 PROM 发展研究。从符合条件的研究中提取数据，以确定工具的相关性、全面性和可理解性，并根据基于共识的健康测量工具选择标准 (COSMIN) 评估其质量。\n\n**结果：** 确定了两项 PROM 开发研究，两项研究均描述了针对隐腺肛瘘患者的疾病特异性 QoL 测量仪器的开发。这些工具的整体内容有效性不一致，并且得到的证据质量非常低。尚无研究评估已建立的瘘管患者生活质量测量工具的内容有效性。\n\n**结论：** 由于缺乏指定的内容有效性研究或现有 PROM 缺乏全面性，本系统评价无法确定肛瘘患者可用 QoL PROM 的内容有效性。这凸显了文献中的一个重要空白，需要加以解决，以确保对瘘管患者进行高质量的结果评估。", "keywords_zh": "COSMIN、PROM、QoL、肛瘘、结果测量、患者报告的结果测量、生活质量", "keywords_en": "COSMIN, PROMs, QoL, anal fistula, outcome measures, patient-reported outcome measures, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/36005069/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 25 Aug 2022"}, {"id": "35688686", "title_en": "Ileoanal pouch-related fistulae: A systematic review with meta-analysis on incidence, treatment options and outcomes", "title_zh": "回肠肛管相关瘘管：对发病率、治疗方案和结果进行荟萃分析的系统评价", "authors": "Guido Sciaudone", "abstract_en": "**Background:** Ileoanal pouch related fistulae (PRF) are a complication of restorative proctocolectomy often requiring repeated surgical interventions and with a high risk of long-term recurrence and pouch failure.\n\n**Aims:** To assess the incidence of PRF and to report on the outcomes of available surgical treatments.\n\n**Methods:** A PRISMA-compliant systematic literature search for articles reporting on PRF in patients with inflammatory bowel diseases (IBD) or familial adenomatous polyposis (FAP) from 1985 to 2020.\n\n**Results:** 34 studies comprising 770 patients with PRF after ileal-pouch anal anastomosis (IPAA) were included. Incidence of PRF was 1.5-12%. In IBD patients Crohn's Disease (CD) was responsible for one every four pouch-vaginal fistulae (PVF) (OR 24.7; p=0.001). The overall fistula recurrence was 49.4%; procedure-specific recurrence was: repeat IPAA (OR 42.1; GRADE +); transvaginal repair (OR 52.3; GRADE ++) and transanal ileal pouch advancement flap (OR 56.9; GRADE ++). The overall failure rate was 19%: pouch excision (OR 0.20; GRADE ++); persistence of diverting stoma (OR 0.13; GRADE +) and persistent fistula (OR 0.18; GRADE +).\n\n**Conclusion:** PVFs are more frequent compared to other types of PRF and are often associated to CD; surgical treatment has a risk of 50% recurrence. Repeat IPAA is the best surgical approach with a 42.1% recurrence rate.", "abstract_zh": "**背景：** 回肠储袋相关瘘（PRF）是恢复性直肠结肠切除术的并发症，通常需要重复手术干预，并且长期复发和储袋失败的风险很高。\n\n**Aims：** 评估 PRF 的发生率并报告可用手术治疗的结果。\n\n**方法：** 符合 PRISMA 标准的系统文献检索，检索报告 1985 年至 2020 年炎症性肠病 (IBD) 或家族性腺瘤性息肉病 (FAP) 患者 PRF 的文章。\n\n**结果：** 纳入了 34 项研究，其中包括 770 名回肠袋肛管吻合术 (IPAA) 后出现 PRF 的患者。 PRF 的发生率为 1.5-12%。在 IBD 患者中，每 4 个储袋阴道瘘 (PVF) 中就有 1 个是由克罗恩病 (CD) 引起的（OR 24.7；p=0.001）。总的瘘管复发率为49.4%；手术特异性复发为：重复 IPAA（OR 42.1；GRADE +）；经阴道修复术（OR 52.3；GRADE ++）和经肛门回肠袋推进皮瓣（OR 56.9；GRADE ++）。总体失败率为 19%：储袋切除术（OR 0.20；GRADE ++）；持续存在分流造口（OR 0.13；GRADE +）和持续性瘘管（OR 0.18；GRADE +）。\n\n**结论：** 与其他类型的 PRF 相比，PVF 更为常见，并且通常与 CD 相关；手术治疗有50%的复发风险。重复 IPAA 是最好的手术方法，复发率为 42.1%。", "keywords_zh": "恢复性直肠结肠切除术、回肠储袋瘘的治疗、储袋阴道瘘的治疗", "keywords_en": "Restorative proctocolectomy, Treatment of ileal pouch fistula, Treatment of pouch-vaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/35688686/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 10 Jun 2022"}, {"id": "35611255", "title_en": "Prevalence of anal fistulas: a systematic review and meta-analysis", "title_zh": "肛瘘的患病率：系统评价和荟萃分析", "authors": "Mahmoud Yousefifard", "abstract_en": "Anal fistula refers to a clinical condition with local pain and inflammation associated with purulent discharge that affects the quality of life. Due to the lack of studies, the presence of bias, and high heterogeneity in the studies, the present systematic review is the first to be performed on the population-based database in this field. The present systematic review and meta-analysis was performed according to MOOSE guidelines. After systematic searching in electronic databases, only four articles met the inclusion criteria. After preparing a checklist and extracting data from the relevant articles, a meta-analysis was performed. All studies on the prevalence of anal fistula are related to Europe, and so far, no study has been conducted on other continents. The overall prevalence of anal fistula in European countries was 18.37 (95% CI: 18.20-18.55%) per 100,000 individuals, and the highest prevalence was reported for Italy (23.20 (95% CI: 22.82 to 23.59) per 100,000 people). From the present population-based (224,097,362) study results, it can be concluded that there is a prominent knowledge gap in this context. Because all the studies included in the current study relate only to Europe, the need for further research in this field in other countries is inevitably sensible.", "abstract_zh": "肛瘘是指一种伴有局部疼痛和炎症、伴有脓性分泌物、影响生活质量的临床病症。由于研究缺乏、存在偏倚、异质性高，本系统评价是该领域首次针对人群数据库进行的系统评价。本系统评价和荟萃分析是根据 MOOSE 指南进行的。经过系统检索电子数据库，只有四篇文章符合纳入标准。在准备清单并从相关文章中提取数据后，进行了荟萃分析。所有关于肛瘘患病率的研究都与欧洲有关，到目前为止，还没有在其他大陆进行过研究。欧洲国家肛瘘的总体患病率为每 10 万人 18.37 例（95% CI：18.20-18.55%），其中意大利的患病率最高（每 10 万人 23.20 例（95% CI：22.82 至 23.59））。从目前基于人群（224,097,362）的研究结果可以得出结论，在这方面存在着显着的知识差距。由于当前研究中包含的所有研究仅与欧洲有关，因此在其他国家进行该领域的进一步研究的必要性不可避免地是合理的。", "keywords_zh": "肛瘘，患病率，系统评价。", "keywords_en": "Anal Fistulas, Prevalence, Systematic Review.", "link": "https://pubmed.ncbi.nlm.nih.gov/35611255/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 25 May 2022"}, {"id": "35357610", "title_en": "A systematic review and meta-analysis of the outcome of ileal pouch-anal anastomosis in patients with ulcerative colitis versus patients with familial adenomatous polyposis", "title_zh": "溃疡性结肠炎患者与家族性腺瘤性息肉病患者回肠储袋肛门吻合术结果的系统回顾和荟萃分析", "authors": "S D Wexner", "abstract_en": "**Background:** Ileal pouch-anal anastomosis (IPAA) is commonly used to restore gastrointestinal continuity after surgical treatment of mucosal ulcerative colitis (MUC) and familial adenomatous polyposis (FAP). The aim of the present systematic review was to compare the outcomes of patients with MUC and patients with FAP who underwent IPAA.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA)-compliant systematic review was performed. PubMed, Scopus, and Web of Science were searched through December 2021. Cohort and randomized studies were eligible for inclusion if they directly compared patients with MUC and FAP who underwent IPAA. The main outcome measures were pouch failure, complications, and need for pouch excision or revision. ROBINS-I tool was used to assess the risk of bias across the studies. A random-effect meta-analysis was conducted.\n\n**Results:** Twenty-three studies (9200 patients) were included in this meta-analysis. Seven thousand nine hundred fifty (86.4%) had MUC and 1250 (13.6%) had FAP. The median age of patients was 33.1 years. The male to female ratio was 1.4:1. MUC had higher odds of pouchitis (OR 3.9, 95% CI 2.8-5.4, p < 0.001), stricture (OR 1.82, 95% CI 1.25-2.65, p = 0.002), fistula (OR 1.74, 95% CI 1.18-2.54, p = 0.004), and total complications (OR 1.89, 95% CI 1.3-2.77, p < 0.001) as compared to FAP. Both groups had similar odds of pelvic sepsis, leakage, pouch failure, excision, revision, and fecal incontinence.\n\n**Conclusions:** Although patients with MUC undergoing IPAA may be at a higher risk of developing complications, particularly pouchitis, stricture, and fistula; the ultimate and functional outcome of the pouch is similar to patients with FAP. Pouch failure, excision and revision were similar in the two groups.", "abstract_zh": "**背景：** 回肠储袋肛门吻合术（IPAA）通常用于在粘膜溃疡性结肠炎（MUC）和家族性腺瘤性息肉病（FAP）手术治疗后恢复胃肠道连续性。本系统评价的目的是比较接受 IPAA 的 MUC 患者和 FAP 患者的结果。\n\n**方法：** 进行了符合系统评价和荟萃分析 (PRISMA) 的首选报告项目的系统评价。 PubMed、Scopus 和 Web of Science 的检索截止时间为 2021 年 12 月。队列研究和随机研究如果直接比较接受 IPAA 的 MUC 和 FAP 患者，则符合纳入条件。主要结果指标是造口袋失败、并发症以及造口袋切除或翻修的需要。 ROBINS-I 工具用于评估研究中的偏倚风险。进行了随机效应荟萃分析。\n\n**结果：** 本荟萃分析纳入了 23 项研究（9200 名患者）。 7950 人 (86.4%) 患有 MUC，1250 人 (13.6%) 患有 FAP。患者的中位年龄为 33.1 岁。男女比例为1.4：1。 MUC 发生储袋炎 (OR 3.9, 95% CI 2.8-5.4, p<0.001)、狭窄 (OR 1.82, 95% CI 1.25-2.65, p = 0.002)、瘘管 (OR 1.74, 95% CI 1.18-2.54,与 FAP 相比，p = 0.004）和总并发症（OR 1.89，95% CI 1.3-2.77，p< 0.001）。两组发生盆腔败血症、渗漏、造口袋失败、切除、翻修和大便失禁的几率相似。\n\n**结论：** 尽管接受 IPAA 的 MUC 患者出现并发症的风险可能更高，特别是储袋炎、狭窄和瘘管；造口袋的最终功能结果与 FAP 患者相似。两组的储袋失败、切除和翻修相似。", "keywords_zh": "家族性腺瘤性息肉病, 回肠贮袋-肛门吻合术, 荟萃分析, 结果, 系统评价, 溃疡性结肠炎", "keywords_en": "Familial adenomatous polyposis, Ileal pouch-anal anastomosis, Meta-analysis, Outcome, Systematic review, Ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/35357610/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 31 Mar 2022"}, {"id": "35347492", "title_en": "Video-assisted anal fistula treatment for complex anorectal fistulas in adults: a systematic review and meta-analysis", "title_zh": "成人复杂性肛肠瘘的视频辅助肛瘘治疗：系统评价和荟萃分析", "authors": "Y Q Wang", "abstract_en": "**Background:** Video-assisted anal fistula treatment (VAAFT) has gained increasing acceptance as a sphincter-sparing procedure for treating complex anorectal fistulas (CAF), but no unequivocal conclusions can yet be drawn regarding its ultimate effectiveness. We reviewed the literature and performed a meta-analysis to evaluate the efficacy and safety of VAAFT in CAF patients.\n\n**Methods:** The study protocol was registered with the PROSPERO database (CRD42021279085). A systematic literature search was performed in the PubMed, Embase, and Cochrane Library databases up to June 2021 with no restriction on language based on the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. We used the keywords video-assisted surgery, video-assisted anal fistula treatment, and complex anorectal fistula to identify relevant studies.\n\n**Results:** Fourteen trials (7 prospective and 7 retrospective) with a total of 1201 patients (mean age 43.5 years) were included. The median follow-up duration was 16.5(8-48) months. Pooled analysis showed that the rates of success, recurrence and postoperative complication across the studies were 83% (95% CI 81-85%, I<sup>2</sup> = 37.9%), 16% (95% CI 14-18%, I<sup>2</sup> = 4.8%), 11% (95% CI 7-15%, I<sup>2</sup> = 72.1%), respectively. The postoperative Jorge-Wexner score used to assess the level of anal incontinence was 1.09 (95% CI, 0.9-1.27, I<sup>2</sup> = 74.6%). The internal opening detection rate was 97.6% (95% CI 96.1-99.6%, I<sup>2</sup> = 48.2%). Recurrence rates varied according to the closure method of internal opening from 21.4% after using staplers, 18.7% after suturing, to 23.5% after advancement flap. The hospital stay was 3.15 days (95% CI 2.96-3.35, I<sup>2</sup> = 49.7%). Subgroup analysis indicated that the risk of heterogeneity in the urine retention group was higher  compared with that of the overall group and that retrospective studies may be the source of heterogeneity for postoperative anal incontinence. r . Sensitivity analysis confirmed the stability of the pooled results. Begg's and Egger's tests showed no evidence of publication bias.\n\n**Conclusions:** According to the available evidence, VAAFT may be a valuable alternative to fistulotomy or seton in treating CAF and has the additional long-term benefits of reducing anal incontinence and surgical morbidity, permitting earlier healing and accelerated rehabilitation.", "abstract_zh": "**背景：** 视频辅助肛瘘治疗（VAAFT）作为一种治疗复杂性肛肠瘘（CAF）的保留括约肌的手术已获得越来越多的认可，但关于其最终有效性尚无明确的结论。我们回顾了文献并进行了荟萃分析，以评估 VAAFT 在 CAF 患者中的疗效和安全性。\n\n**方法：** 研究方案已在 PROSPERO 数据库中注册 (CRD42021279085)。根据系统评价和荟萃分析指南的首选报告项目，在 PubMed、Embase 和 Cochrane 图书馆数据库中进行了截至 2021 年 6 月的系统文献检索，没有语言限制。我们使用关键词视频辅助手术、视频辅助肛瘘治疗和复杂性肛肠瘘来识别相关研究。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 根据现有证据，VAAFT 可能是治疗 CAF 时瘘管切开术或挂线的有价值的替代方案，并且具有减少肛门失禁和手术发病率、允许早期愈合和加速康复的额外长期益处。", "keywords_zh": "复杂性肛肠瘘，Meta分析，VAAFT，视频辅助肛瘘治疗", "keywords_en": "Complex anorectal fistula, Meta-analysis, VAAFT, Video-assisted anal fistula treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/35347492/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 29 Mar 2022"}, {"id": "35211503", "title_en": "Efficacy and Safety of Sphincter-Preserving Surgery in the Treatment of Complex Anal Fistula: A Network Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Shanshan Xu", "abstract_en": "**Background:** There are many surgical methods of sphincter preservation in treating complex anal fistula, but the therapeutic effects of each operation are different. Therefore, this study aimed to compare the impact of other treatment methods through a network meta-analysis to evaluate the best sphincter preservation method for treating complex anal fistula.\n\n**Methods:** We searched PubMed, Embase, Cochrane Library, China National Knowledge Infrastructure, Chinese Biomedical Literature Database, VIP Journal Database, and the Wanfang Database to collate randomized controlled trials on sphincter-preserving surgery for complex anal fistula.\n\n**Results:** A total of 29 articles were included in this meta-analysis. The cure rates showed no statistically significant differences between any two interventions (<i>P</i> > 0.05). The recurrence rate results showed that the rate of patients after Fistulectomy was higher than others (<i>P</i> < 0.05). The incidence rate of complications showed that the incidence rate after fistulectomy treatment was higher than that of others (<i>P</i> < 0.05). The surface under the cumulative ranking (SUCRA) was used to arrange their advantages and disadvantages, and a larger SUCRA value indicates that the intervention may be more effective. The results showed that TROPIS may have the highest cure rate (SUCRA = 78.6%), stem cell transplantation (SCT) may have the lowest recurrence rate (SUCRA = 85.5%), and imLIFT may have the least complications (SUCRA = 88.2%).\n\n**Conclusion:** According to the existing literature data, for patients with complex anal fistula, TROPIS may be the surgical method with the highest cure rate, SCT may be the treatment method with the lowest recurrence rate, and imLIFT may be the surgical method with the lowest incidence of postoperative complications.\n\n**Systematic Review Registration:** PROSPERO, identifier: CRD42020221907.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Systematic review registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "complex anal fistula, cure rate, meta, sphincter, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/35211503/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 25 Feb 2022"}, {"id": "35049123", "title_en": "Meta-analysis of platelet-rich plasma therapy for anal fistula", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Shuangqing Chang", "abstract_en": "**Objective:** To systematically evaluate the efficacy of platelet-rich plasma (PRP) in treating anal fistula.\n\n**Methods:** PubMed, EMBASE, and Cochrane Library databases were systematically searched for randomized controlled studies (RCTs) and case-control studies published before June 2021 on evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. References of the journals were manually searched for relevant studies. Literature search, screening, data extraction, and bias assessment were carried out by two researcher independently. Stata13.0 and RevMan 5.3 software were used for statistical analysis of the cure rate and recurrence rate of anal fistula.\n\n**Results:** A total of 6 case-control studies and 3 RCTs involving 289 patients were included. Meta-analysis showed that the pooled cure rate of all studies was 65% (95% CI 0.53-0.77), p = 0.000, and the pooled recurrence rate of all studies was 12% (95% CI 0.08-0.17).\n\n**Conclusion:** Platelet-rich plasma is safe and effective in treating anal fistula and should be promoted and further studied in clinical practice.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, efficacy, meta-analysis, platelet-rich plasma, randomized controlled trial", "link": "https://pubmed.ncbi.nlm.nih.gov/35049123/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 20 Jan 2022"}, {"id": "34920992", "title_en": "Ustekinumab is effective for perianal fistulising Crohn's disease: a real-world experience and systematic review with meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Alyssa M Parian", "abstract_en": "**Background:** Perianal Crohn's disease (pCD) is a debilitating complication affecting up to 30% of Crohn's disease (CD) population, leading to increased morbidity, mortality and decreased quality of life. Despite the growing armamentarium of medications for luminal CD, their efficacy in pCD remains poorly studied.\n\n**Aim:** To determine the efficacy of ustekinumab, a biologic approved for luminal CD, in pCD through a retrospective cohort study and systematic review.\n\n**Methods:** A retrospective cohort study on patients with CD with active perianal fistulae treated with ustekinumab from September 2013 to August 2019 was performed to determine perianal fistula response and remission at 6 and 12 months after ustekinumab induction. A systematic review was performed to further establish rates of fistula response and remission with ustekinumab.\n\n**Results:** At 6 months, 48.1% (13/27) patients achieved fistula response with none achieving fistula remission on provider exam, and 59.3% (16/27) achieved patient-reported symptomatic improvement with 3.7% (1/27) achieving symptomatic remission. At 1 year, on provider exam, 55.6% (5/9) had fistula response with none achieving fistula remission, and 100% (9/9) had symptomatic improvement with 22.2% (2/9) achieving symptomatic remission. There were no major safety signals during 1-year follow-up. The systematic review of 25 studies found 44% (92/209) of patients with active perianal fistulas had a clinical response within 6 months of follow-up, and 53.9% (85/152) of patients with 12 months of follow-up achieved clinical response.\n\n**Conclusion:** Ustekinumab presents a safe and effective therapy for treatment of pCD. Prospective, randomised trials are needed to further elucidate long-term efficacy of ustekinumab for pCD.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim：** Error 500 (Server Error)!!1500.That’s grated, a single-group rate meta-analysis was performed; we analyzed 3D-EAUS separately for the diagnosis of different anal fistula types, and conducted a meta-analysis of test accuracy. The analysis combined sensitivity, specificity, and the respective 95% CI, to draw a summary receiver operating characteristic curve (SROC), and estimate the area under curve (AUC).\n\n**Results:** Based on the inclusion criteria, we selected 8 studies covering 1057 cases of anal fistula and 548 cases of internal opening. The meta-analysis data show that 3D-EAUS has a total accuracy rate of 91% (95% CI, 88-94%). It has high sensitivity and specificity for different anal fistula classifications. The SROC curves for anal fistula internal openings were plotted, and the AUC was calculated to be 0.86 (95% CI, 0.83-0.89).\n\n**Conclusions:** 3D-EAUS can be used as the first-line diagnostic tool for anal fistula, because it has a high diagnostic accuracy for most anal fistulas. However, due to the insufficient diagnostic accuracy of 3D-EAUS for complex fistulas, 3D-EAUS combined with MRI examination can be used to more accurately detect the secondary extension of complex fistulas, so as to describe the complete anatomy of the fistula in more detail.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/34872892/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 07 Dec 2021"}, {"id": "34856655", "title_en": "Gene and protein expression of epithelial to mesenchymal transition for intestinal and anal fistula: a systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Nazefah Abdul Hamid", "abstract_en": "**Purpose:** Intestinal fibrosis is a common complication of inflammatory bowel diseases. However, the possible involvement of epithelial-mesenchymal transition (EMT) has been scarcely investigated. This systematic review aims to search through research papers that are focusing on messenger RNA (mRNA) and protein expression profile in EMT in fistula or in intestinal fibrosis.\n\n**Methods:** Electronic exploration was performed until April 24, 2019 through PubMed, Ovid, Science Direct, and Scopus databases with the terms of \"fistula\" OR \"intestinal fibrosis\" AND \"epithelial-mesenchymal transition\". Two independent reviewers scrutinized the suitability of the title and abstract before examining the full text that met the inclusion criteria. For each study, the sample types that were used, methods for analysis, and genes expressed were identified. The list of genes was further analyzed using DAVID (Database for Annotation, Visualization, and Integrated Discovery) and KEGG (Kyoto Encyclopedia of Genes and Genomes) pathway.\n\n**Results:** There were 896 citations found; however, only 3 studies fulfilled the requirements. Among the EMT-related genes, 5 were upregulated genes at mRNA level while 6 were at protein level. However, only 2 downregulated genes were found at each mRNA and protein level. Of the 4 inflammation-related genes found, 3 genes were upregulated at mRNA level and 1 at protein level. These genes were confirmed to be involved in the development of inflammatory induced fibrosis and fistula through EMT. Results from quantitative real-time polymerase chain reaction analysis were consistent with the process of EMT, confirmed by the western blot protein analysis.\n\n**Conclusion:** Many significant genes which are involved in the process of EMT in fistula and intestinal fibrosis have been identified. With high-end technology many more genes could be identified. These genes will be good molecular targets in the development of biomarkers for precision drug targeting in the future treatment of intestinal fibrosis and fistula.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 共找到 896 次引用；然而，只有 3 项研究满足要求。在EMT相关基因中，5个在mRNA水平上调，6个在蛋白质水平上调。然而，在每个 mRNA 和蛋白质水平上仅发现 2 个下调基因。在发现的 4 个炎症相关基因中，3 个基因在 mRNA 水平上调，1 个基因在蛋白质水平上调。这些基因被证实通过EMT参与炎症诱导的纤维化和瘘管的发生。实时定量聚合酶链式反应分析结果与 EMT 过程一致，经蛋白质印迹蛋白分析证实。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Epithelial-mesenchymal transition, Fistula, Gene, Intestinal fibrosis, Proteins", "link": "https://pubmed.ncbi.nlm.nih.gov/34856655/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 02 Dec 2021"}, {"id": "34677097", "title_en": "Predictive Risk Factors of the Conversion from Video-Assisted Treatment of Anal Fistula to Seton Fistulotomy", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Zhiliang Zhang", "abstract_en": "<b><i>Background:</i></b> To identify the risk factors of converting from video-assisted anal fistula treatment (VAAFT) to seton fistulotomy. <b><i>Materials and Methods:</i></b> A total of 180 patients registered to undergo VAAFT between January 2016 and June 2020 at the Erlonglu Hospital. Intraoperative examination of the fistula tract revealed that the patients were assigned to undergo the VAAFT operation and seton fistulotomy. <b><i>Results:</i></b> Among 180 patients aged 37 (±10.4) years who underwent intraoperative examination of the fistula tract, 101 completed the standard VAAFT and 79 converted to seton fistulotomy. Univariate analyses revealed that age, necrotic cavity diameter ≥1 cm, scars at the anal entrance, tissue edema, Parks classification, fistula stenosis, and fistula branches were significantly different between the VAAFT and converted groups (<i>P</i> < .05). Multivariate analysis revealed a significant correlation between the risk of surgery conversion and the presence of necrotic cavity with a diameter of ≥1 cm (odds ratio [OR]: 3.668, 95% confidence interval [CI]: 1.366-9.853, <i>P</i> = .01), scars at the anal entrance (OR: 9.462, 95% CI: 1.562-57.32, <i>P</i> = .014), fistula stenosis (OR: 25.14, 95% CI: 5.211-121.3, <i>P</i> < .001), and fistula branches (OR: 2.90, 95% CI: 1.088-7.73, <i>P</i> = .033). The nomogram based on the logistic model was fitted with high accuracy and area under curve of 0.793 (95% CI: 0.726-0.861). <b><i>Conclusions:</i></b> The independent risk factors of conversion from surgery for VAAFT to seton fistulotomy were the presence of necrotic cavity with a diameter of ≥1 cm, scars at the anal entrance, fistula stenosis, and fistula branches. The protocol of this systematic review was registered a priori in the Chinese Clinical Trial Registry (ChiCTR) under the registration number of ChiCTR1900022810.", "abstract_zh": "<b><i>背景：</i></b>旨在确定从视频辅助肛瘘治疗 (VAAFT) 转为挂线瘘管切开术的风险因素。 <b><i>材料和方法：</i></b>2016年1月至2020年6月期间，共有180名患者在二龙路医院登记接受VAAFT。术中瘘管检查显示患者被分配接受 VAAFT 手术和挂线瘘管切开术。 <b><i>结果：</i></b> 180 例年龄 37（±10.4）岁的患者接受术中瘘管检查，其中 101 例完成了标准 VAAFT，79 例转为挂线瘘管切开术。单变量分析显示，VAAFT组和转换组在年龄、坏死腔直径≥1cm、肛门口疤痕、组织水肿、Parks分类、瘘管狭窄和瘘管分支方面存在显着差异(<i>P</i> < .05)。多变量分析显示，手术中转的风险与直径≥1cm的坏死腔（比值比[OR]：3.668，95％置信区间[CI]：1.366-9.853，<i>P</i> = .01）、肛口疤痕（OR：9.462，95％CI： 1.562-57.32，<i>P</i> = .014）、瘘管狭窄（OR：25.14，95% CI：5.211-121.3，<i>P</i> < .001）和瘘管分支（OR：2.90，95% CI： 1.088-7.73，<i>P</i> = .033）。基于logistic模型的列线图拟合精度高，曲线下面积为0.793（95% CI：0.726-0.861）。 <b><i>结论：</i></b>VAAFT手术转挂线瘘管切开术的独立危险因素为直径≥1cm的坏死腔、肛口疤痕、瘘管狭窄、瘘管分支。本系统评价方案已在中国临床试验注册中心（ChiCTR）预先注册，注册号为ChiCTR1900022810。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "VAAFT, prediction model, rectal fistula, risk factor", "link": "https://pubmed.ncbi.nlm.nih.gov/34677097/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 22 Oct 2021"}, {"id": "34628909", "title_en": "A systematic review and meta-analysis of incision and seton drainage in the treatment of high perianal abscess", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Lihua Zheng", "abstract_en": "**Background:** Surgery is the clinically preferred treatment for high perianal abscesses. Incision and seton drainage improve the cure rate and reduce recurrence. We aimed to systematically evaluate the clinical effect and safety of incision and seton drainage in the treatment of high perianal abscess.\n\n**Methods:** China Knowledge Network (CNKI), WanFang database, VIP database, PubMed, and Cochrane Library were searched and all relevant Chinese and English language documents until July 2021were retrieved. All records that described randomized clinical trials (RCTs) of incision and seton drainage for the treatment of high perianal abscess were eligible. Documents that met the inclusion criteria were evaluated for bias using the Cochrane Collaboration Risk Evaluation Standard, and Revman5.4 software was used to analyze the data.\n\n**Results:** Fourteen RCTs were included. The results of nine studies showed that the clinical cure rate of the incision-seton group was higher than that of the incision-drainage group (P<0.05). Seven studies showed that the wound healing time of the incision-seton group was shorter than that of the incision-drainage group (P<0.05). Four studies showed that the visual analogue scale (VAS) score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Five studies showed that the Wexner score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Six studies showed that the formation rate of anal fistula in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Six studies demonstrated that the recurrence rate of abscess in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Seven studies showed that the incidence of adverse events in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Five studies demonstrated that the length of stay in the incision-seton group was shorter than that of the incision-drainage group (P<0.05).\n\n**Discussion:** The choice of surgical methods in clinical research has always been controversial. The incision-seton method can effectively and safely treat high perianal abscess. However, the results of this meta-analysis still leave some gaps in the evidence. More large-sample, high-quality, and multi-center RCTs are needed.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!150  87% p < 0.001) and 8% (95% CI: 4%-13%, I<sup>2</sup>  = 74% p < 0.001), respectively. Subgroup analysis according to fistula height could only be conducted on limited data. Pooled healing in high anal fistulae was 89% (95% CI: 84%-94%, I<sup>2</sup>  = 76% p < 0.001), 16% suffered disturbance of continence (95% CI: 7%-27%, I<sup>2</sup>  = 89% p < 0.001), 8% worsening continence from baseline (95% CI: 2%-16%, I<sup>2</sup>  = 80% p < 0.001) and 2% suffered sphincter dehiscence (95% CI: 0%-10%, I<sup>2</sup>  = 89% p < 0.001).\n\n**Conclusion:** The evidence suggests FISR is a safe, effective procedure. However, data are limited by inconsistencies in reporting of continence and definition of fistula height, particularly high anal fistulae. Significant heterogeneity means that outcomes in high fistulae remain uncertain.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "anal fistula, fistulectomy, fistulotomy, sphincteroplasty", "link": "https://pubmed.ncbi.nlm.nih.gov/34623747/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 08 Oct 2021"}, {"id": "34338860", "title_en": "Non-mucinous adenocarcinomas and squamous cell carcinomas of the anal region masquerading as abscess or fistula: a retrospective analysis and systematic review of literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Silke Schuele", "abstract_en": "**Purpose:** Abscess or fistula of the anal region is an uncommon presentation of malignancy. Under the assumption of a benign condition, diagnostics is often delayed, resulting in advanced tumour stages at first diagnosis. Due to the case rarity, treatment guidelines for cancers of anorectal region masquerading as abscess or fistula are missing.\n\n**Methods:** We analysed all patients presenting with an abscess or fistula of the anal region in our department between January 2004 and August 2020. The malignancies were included to our study to acquire data on clinical presentation, treatment and outcome. Furthermore, a systematic review to present adenocarcinomas and squamous cell carcinomas associated to an abscess or fistula was performed.\n\n**Results:** 0.5% of the patients treated for an abscess or fistula of the anal region met the selection criteria. Mean time from the onset of symptoms to diagnosis of malignancy was 100 days. Histology revealed adenocarcinoma and squamous cell carcinoma each in two patients. All patients had locally advanced tumours without distant metastases, in two cases with regional lymph-node metastases. Neoadjuvant chemoradiation was applied in two patients. All patients underwent abdomino-perineal resection of the rectum. The overall outcome reveals a recurrence-free survival of 4.5 and 3 years for two patients. Further two patients died within 5 months after the primary resection.\n\n**Conclusion:** Advanced carcinomas of the anorectal region may masquerade as abscess or fistula, cause diagnostic problems and delay oncologic treatment. However, even in these very advanced situations, surgical therapy with curative intent should be attempted.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know s and after screening of abstracts and full text review, 19 were included in the final review, involving 1602 patients. Operative mortality is low (0%-3.6%) after all types of continent ileostomy but reoperation rates are high (20.8%-65%) because of valve mechanism failures. Rates of fistulae (0%-25.5%) and stomal stenosis (0%-25%) can be relatively high postoperatively. Quality of life scores improve for most patients undergoing continent ileostomy, especially for patients converted from ileal pouch anal anastomosis. Overall, continent ileostomy retention is high in the long-term.\n\n**Discussion:** In the long-term, patients report high satisfaction and a good quality of life with continent ileostomy, despite high reoperation rates and complications. Newer technologies may reinvigorate interest in the continent ileostomy for this population.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "continent ileostomy, ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/34166559/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 24 Jun 2021"}, {"id": "33108254", "title_en": "LIFT: a feasible option for primary and recurrent fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Peter Cools", "abstract_en": "**Background:** The development of a surgical solution for anal fistulas with minimal recurrence and morbidity remains a challenge. Ligation of the intersphincteric fistula tract (LIFT), however, is a sphincter sparing technique that provides complete resolution of the transsphincteric fistula as well as minimizing recurrence and fecal incontinence. Our goal is to evaluate the efficacy of fistula tract ligation for primary and recurrent fistulas.\n\n**Methods:** A retrospective single-center case study was conducted from data between 2015 and 2019 in a large district hospital in Antwerp, Belgium. Patients who underwent LIFT were included. Demographic patient data as well as primary outcome during the follow-up period were collected. A systematic literature review and analysis was conducted with terms [ANAL FISTULA] [TREATMENT] [LIFT] [LIGATION OF INTERSPHINCTERIC FISTULA]. Primary healing and recurrence associated with surgical modifications were investigated.\n\n**Results:** 4 out of 25 patients presented with early failure (84% primary success rate) after a median follow-up period of 7 months. The median time until recurrence was 105 days. The success rate after a redo ligation was 100%. Twenty-eight studies were included for review and divided into three groups depending on the technical variation of the used technique. The success rate was 74.2% for the LIFT group, 72.9% in the LIFT + group, and 77.5% in the mLIFT group <i>p</i> = .92.\n\n**Conclusion:** LIFT is a feasible treatment option for primary and recurrent fistulas, with excellent success rates where fistula characteristics rather than chosen technique dictate the surgical outcome.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, anorectal disease surgical treatment, ligation of intersphincteric fistula tract", "link": "https://pubmed.ncbi.nlm.nih.gov/33108254/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Tue, 27 Oct 2020"}], "痔疮": [{"id": "42503488", "title_en": "Laser Hemorrhoidoplasty versus Excisional Hemorrhoidectomy: The Recovery-Durability Tradeoff in Hemorrhoid Surgery-A Systematic Review of Randomized Trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fernanda Bellotti Formiga", "abstract_en": "BackgroundExcisional hemorrhoidectomy remains the standard for advanced disease, while the applicability of laser hemorrhoidoplasty remains uncertain. This study evaluates the tradeoff between short-term recovery and long-term durability to inform patient-centered decision-making.MethodsA systematic search of PubMed, Web of Science, Scopus, and CENTRAL was conducted through September 2025. Randomized controlled trials (RCTs) comparing diode laser hemorrhoidoplasty with conventional hemorrhoidectomy were included. Pooled risk ratios (RR) and mean differences (MD) with 95% confidence intervals were estimated using random-effects models. Heterogeneity was assessed with the I<sup>2</sup> statistic, and trial sequential analysis (TSA) was performed to explore the robustness of selected outcomes.ResultsFifteen RCTs involving 1099 patients were included. Laser hemorrhoidoplasty was associated with reduced postoperative pain on day 1 (MD -2.02; 95% CI -2.83 to -1.20) and day 7 (MD -2.13; 95% CI -3.06 to -1.20), shorter duration of analgesic use (MD -2.72 days), operative time (MD -12.49 min), intraoperative blood loss (MD -21.63 mL), hospital stay (MD -0.63 days), and earlier return to daily activities (MD -10.78 days). It was also associated with lower rates of postoperative bleeding (RR 0.35), urinary retention (RR 0.29), and anal stenosis (RR 0.12). TSA suggested that some short-term findings may be robust; however, several outcomes remained underpowered, and limited follow-up restricts the interpretation of long-term outcomes.ConclusionLaser hemorrhoidoplasty offers improved short-term recovery but with uncertain long-term durability. Given the low to very low certainty of the evidence and limited follow-up, these findings support a preference-sensitive approach rather than replacing excisional hemorrhoidectomy.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ferguson technique, Milligan-Morgan, diode laser, hemorrhoidectomy, hemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/42503488/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sun, 26 Jul 2026"}, {"id": "42374341", "title_en": "Laser hemorrhoidoplasty versus LigaSure hemorrhoidectomy for grade II-IV hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Yousef El-Ayman", "abstract_en": "**Background:** Many surgical procedures have been developed to treat hemorrhoidal disease. Although conventional excisional techniques are effective, they are also associated with significant postoperative pain and longer recovery times. Consequently, newer techniques have been introduced to address these issues, including laser hemorrhoidoplasty (LHP) and LigaSure hemorrhoidectomy (LigH). This systematic review and meta-analysis aims to compare these two approaches in terms of perioperative outcomes and recurrence.\n\n**Methods:** A comprehensive search was conducted across PubMed, Scopus, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar, up to December 2025. We included all eligible studies involving adults with grade II-IV hemorrhoids. Primary outcomes included postoperative pain, time to return to routine activities, and recurrence. Secondary outcomes were operative time, length of hospital stay, and complications. The risk of bias was assessed using the RoB2 and ROBINS-I V2 tools. Meta-analyses were performed with a random-effects model. The certainty of evidence was evaluated using the GRADE approach.\n\n**Results:** Data from 461 patients (213 LHP, 248 LigH) across five studies were analyzed. Patients in the LHP group reported significantly lower pain scores on postoperative day 1 (MD: - 1.61 points; p = 0.025), earlier return to routine activities (MD: -5.75 days; p = 0.0002), shorter operative time (MD: -6.5 min; p = 0.002), and shorter hospital stay (MD: -0.3 days; p < 0.0001) compared to the LigH group. Conversely, LigH demonstrated a significantly lower risk of recurrence (RD: 0.12; 95% CI: [0.05, 0.19]). No significant differences were observed regarding postoperative bleeding, wound infection, urinary retention, or thrombosis.\n\n**Conclusion:** LHP yields better perioperative outcomes, including less pain and faster recovery, making it a favorable option for patient comfort. However, LigH has lower recurrence rates. The certainty of evidence is very low. Further high-quality randomized trials are needed to confirm these results.", "abstract_zh": "**背景：** Error , 2 retrospective cohorts; total n=671 patients) met PICOS criteria, with Wexner Incontinence Scores reported or retrospectively mapped. Quality appraisal used CASP Cohort Checklist.\n\n**Results:** Seventeen (2.5%) of 671 patients developed postoperative faecal incontinence. Of these, 14 (82%) cases were mild (Wexner 1-4) and transient, resolving within 3-6 months; 3 (18%) were moderate (Wexner 5-8), primarily in HAL-RAR (9/158 [5.7%]). Standard HAL showed 0/76 (0%) cases; THD had 1/104 (1.0%); DG-HAL had 7/293 (2.4%). No severe incontinence occurred.\n\n**Discussion:** HALO techniques demonstrate excellent long-term continence safety (overall 2.5% low-grade incontinence). HAL-RAR's higher risk (5.7%) warrants counselling. Standardised scoring and multicentre trials are recommended.", "abstract_zh": "**Aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42348182/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 25 Jun 2026"}, {"id": "42110541", "title_en": "An ethnobotanical review of medicinal plants used for treating hemorrhoids in Thailand", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ruyu Yao", "abstract_en": "Hemorrhoids is one of the most prevalent diseases affecting people's health both in Thailand and worldwide. The therapeutic use of medicinal plants for hemorrhoidal treatments is widespread across many countries, supported by evidence demonstrating the efficacy of their pharmacological activity. This study aims to (1) conduct an in-depth literature review on plants used in Thailand for hemorrhoid treatment and (2) identify the most promising species in traditional Thai medicine to effectively treat hemorrhoids. A total of 53 references were methodically reviewed. The important medicinal plants were determined using ethnobotanical indices including use-value (UV) and choice value of species (CVs), and the important species were selected for an in-depth review of their pharmacological activities. Our literature review found that there were 181 species belonging to 147 genera and 78 families used to treat hemorrhoids among 18 ethnic groups. The most cited species were <i>Cissus quadrangularis</i>, <i>Biancaea sappan</i>, <i>Croton persimilis</i>, <i>Mimosa pudica</i>, <i>Aegle marmelos</i>, <i>Leea indica</i>, <i>Plumbago indica</i>, <i>Rotheca serrata</i>, and <i>Tectona grandis</i>. Prevalent pharmacological activities such as anti-inflammatory, anti-oxidative, anti-microbial, anti-hemorrhoid, analgesic, and vasorelaxant activities are found in key species used for hemorrhoid treatment. This study identifies the most important species for ethnopharmacological explorations in hemorrhoid treatments, which is expected to inspire the selection of medicinal plants for development into pharmaceutical products.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Rid Si Duang, Thai medicine, anti-inflammatory plants, piles, quantitative ethnobotany, traditional", "link": "https://pubmed.ncbi.nlm.nih.gov/42110541/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knT  normal endoscopic findings within the IDA population as well as the prevalence of nonmalignant and malignant gastrointestinal pathology amongst clinically relevant subgroups. Results were synthesized using a random effects meta-analysis.\n\n**Results:** A total of 8563 citations were screened, and 39 articles were included from four continents, comprising 9807 patients with IDA. Overall, the most prevalent upper gastrointestinal finding was Helicobacter pylori gastritis (27.0%), and the most prevalent lower gastrointestinal finding was hemorrhoids (10.0%). The overall prevalence of upper gastrointestinal malignancy was 5.0%, and the prevalence of colorectal cancer was 8.0%. A total of 52.0% of upper gastrointestinal endoscopies and 66.0% of lower gastrointestinal endoscopies did not detect any abnormalities.\n\n**Conclusion:** The estimated prevalence of individual malignant and nonmalignant gastrointestinal disease will serve as a guide in the context of clinical decision making before endoscopy in patients with IDA. Further population-based studies are needed, particularly among relevant subgroups.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "cancer, endoscopy, gastrointestinal, iron deficiency anemia, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41784434/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqS adverse events and individual adverse events, such as postprocedural bleeding and incontinence.\n\n**Results:** Eight studies with 512 patients were included in the meta-analysis. The average age was 55.6 years, and the majority of patients were female. Most patients presented with grade I and grade II hemorrhoids. The HET demonstrated technical and clinical success rates of 100% and 86.1%, respectively. All adverse events were determined to be mild, according to the ASGE lexicon, except for 1 case of perianal hematoma that required hospitalization.\n\n**Conclusion:** Our study demonstrates that HET is an effective and safe treatment for grade I and II internal hemorrhoids.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Bipolar energy-based therapy, hemorrhoidal energy therapy, internal hemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/41659148/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 09 Feb 2026"}, {"id": "41629638", "title_en": "Fecal incontinence after prostate cancer irradiation: a systematic literature review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jean-Michel Hannoun-Levi", "abstract_en": "**Goal:** Fecal incontinence (FI) is an underrecognized but clinically significant late gastrointestinal toxicity following radiotherapy (RT) for prostate cancer. This systematic review aimed to synthesize current knowledge on the definition and pathophysiology of post-radiation anal continence, as well as prevention strategies, technical considerations, and therapeutic approaches.\n\n**Method:** A systematic literature search was conducted according to PRISMA guidelines using the keywords: \"Fecal incontinence,\" \"Radiation therapy,\" and \"Prostatic neoplasms.\" Eligible studies included randomized phase III trials and prospective or retrospective series reporting on FI after definitive or adjuvant/salvage prostate RT. Fifty-four articles were included in the final analysis.\n\n**Results:** FI after prostate RT results from functional, morphological, and neurogenic alterations of the anorectal system. Reported incidence ranges from 1 to 12%, most often presenting as flatulence or liquid stool leakage, while severe forms requiring pads are uncommon. Variability is largely explained by heterogeneity in definitions and assessment tools, as no standardized scoring system is universally applied. Risk factors include advanced age, prior abdominal surgery, vascular comorbidities, chronic inflammatory bowel disease, hemorrhoids, and rectal urgency during RT. Dosimetric analyses indicate that low-to-intermediate doses to the anal canal and high doses to the rectum contribute differentially to FI. Based on current evidence, the mean dose to the anal canal should be kept below 37 Gy, though further studies are needed to define precise constraints for both structures. Preventive strategies such as MRI-based contouring and endorectal balloon placement, perirectal hydrogel spacers placement show promise. Management is multidisciplinary, including dietary measures, medications, pelvic floor therapy, neuromodulation, and, in severe cases, diversion procedures.\n\n**Conclusion:** FI after prostate RT is likely underestimated due to the absence of a standardized assessment. Developing a validated, universally applicable scoring system is a priority to improve evaluation, enable cross-study comparisons, refine preventive measures, and guide therapeutic strategies.", "abstract_zh": "**Goal：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41629638/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 02 Feb 2026"}, {"id": "41586878", "title_en": "Metronidazole is an effective method of analgesia following haemorrhoidectomy: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Christina A Fleming", "abstract_en": "**Background:** Haemorrhoids are one of the most frequently encountered benign anorectal conditions that negatively impact patients' quality of life. Excisional haemorrhoidectomy (closed or open) is a surgical procedure reserved for the treatment of third- and fourth-degree haemorrhoids, with considerable post-procedure pain reported. The aim of this study was to clarify the association between post operative metronidazole use (both oral and topical) and post-haemorrhoidectomy pain scores through systematic review and meta-analysis of randomised controlled trials (RCTs).\n\n**Methods:** This study was guided by the Preferred Reporting Items for Systematic Reviews and Meta-Analysis (PRISMA) guidelines. Prospective registration was performed on PROSPERO (CRD42024580928). A systematic review was performed for RCTs reporting post-haemorrhoidectomy pain scores between patients who received metronidazole and patients who received placebo. Meta-analysis was performed using RevMan version 5.4.\n\n**Results:** Seventeen RCTs including 1297 participants were eligible for inclusion. Metronidazole administration was associated with significantly lower post-operative visual analogue scores (VAS) on day 1 (-1.18, p < 0.00001), day 2 (-1.15, p = 0.003), day 3 (-0.86, p < 0.00001), and day 7 post-operatively with a mean pain score difference of -1.72 (95% CI -2.27 to -1.18) (p < 0.00001). A significant difference in pain scores was seen on day 3 favouring topical metronidazole in comparison to the oral route (1.38, 95% CI [0.44, 2.32], p = 0.004).\n\n**Conclusion:** This review synthesises the best available evidence to support the use of metronidazole to reduce pain after excisional haemorrhoidectomy. While both oral and topical forms appear to be beneficial, topical administration appears to have a more effective analgesic effect from post-operative day 3.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Haemorrhoids, Metronidazole, RCT", "link": "https://pubmed.ncbi.nlm.nih.gov/41586878/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 26 Jan 2026"}, {"id": "41554450", "title_en": "Salvia plebeia R.Br.: A comprehensive review of its ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications", "title_zh": "Salvia plebeia R.Br.：对其民族药理学、植物化学、药理活性、质量控制和当前应用的全面综述", "authors": "Wei Jiang", "abstract_en": "**Ethnopharmacological Relevance:** Salvia plebeia R.Br. (Lamiaceae), the dried aerial parts, has been traditionally used across China and East/South Asia to treat sore throat, bronchitis, nephritis edema, abscesses, mastitis, hemorrhoids, and bleeding disorders, consistent with traditional indications of heat-clearing, detoxifying, cooling blood, and promoting diuresis.\n\n**Aim Of The Review:** This study provides a systematic overview of the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and current applications of S. plebeia, while highlighting current research gaps and future perspectives.\n\n**Materials And Methods:** A comprehensive literature search was conducted using multiple scientific databases, including Web of Science, PubMed, Elsevier, ACS, CNKI, and Google Scholar, covering publications from database inception to October 2025. Relevant information on the ethnopharmacology, phytochemistry, pharmacological activities, quality control, and applications of S. plebeia was systematically collected, screened, and synthesized according to predefined inclusion/exclusion criteria.\n\n**Results:** To date, 325 constituents have been identified, dominated by flavonoids, phenolic acids, terpenoids, volatile oils, sterols, lignans, and others. Extracts and purified compounds show tradition-relevant anti-inflammatory, antiviral, immunoregulatory, and antioxidant activities, while other reported effects (hepatoprotective, hypolipidemic, cardiovascular-protective, sedative/anticonvulsant, anticancer, and anti-photoaging) are presented as exploratory findings. Quality evaluation evolved from UV and HPLC to UPLC-MS fingerprinting using flavonoids and sesquiterpenes as markers. In practical applications, S. plebeia has been used in medicinal preparations for the management of pharyngitis, bronchitis, nephritis, dermatitis, and anorectal inflammation. In food sector, it has been developed into functional products, including health teas, chewable or effervescent tablets, composite beverages, and co-fermented vinegars.\n\n**Conclusion:** Although S. plebeia shows broad pharmacological potential, current investigations remain constrained by incomplete chemical space coverage, limited pharmacokinetic and toxicological characterization, and insufficient well-designed clinical evidence. Future research should focus on comprehensive constituent profiling, mechanism-oriented validation aligned with traditional indications, standardized quality markers/fingerprints, and rigorous PK-toxicology-clinical translation, to promote safe, effective, and evidence-based utilization of S. plebeia in medicine and functional food development.", "abstract_zh": "**Ethnopharmacological relevance：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Aim of the review：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 尽管S. plebeia显示出广泛的药理学潜力，但目前的研究仍然受到化学空间覆盖不完整、药代动力学和毒理学特征有限以及精心设计的临床证据不足的限制。未来的研究应侧重于全面的成分分析、与传统适应症相一致的机制导向验证、标准化的质量标记/指纹以及严格的PK-毒理学-临床转化，以促进普雷贝亚在医学和功能性食品开发中的安全、有效和循证利用。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Current applications, Ethnopharmacology, Pharmacological activity, Phytochemistry, Quality control, Salvia plebeia R.Br.", "link": "https://pubmed.ncbi.nlm.nih.gov/41554450/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 19 Jan 2026"}, {"id": "41535511", "title_en": "Long-term outcomes of stapled haemorrhoidopexy versus conventional haemorrhoidectomy: An updated systematic review, meta-analysis and trial-sequential analysis of randomized controlled trials", "title_zh": "吻合器痔疮固定术与传统痔疮切除术的长期结果：随机对照试验的最新系统评价、荟萃分析和试验序贯分析", "authors": "Roberto Cirocchi", "abstract_en": "**Purpose:** Stapled haemorrhoidopexy (SH) offers well-established short-term advantages over conventional haemorrhoidectomy (CH), but its long-term effectiveness remains controversial. This systematic review and meta-analysis aimed to compare long-term outcomes of SH versus CH in adult patients with grade II-IV haemorrhoids, incorporating Trial Sequential Analysis (TSA).\n\n**Methods:** MEDLINE, EMBASE and CENTRAL were searched from January 2001 to October 2025 for randomized controlled trials (RCTs) comparing SH and CH with a minimum follow-up of 12 months. Two reviewers independently performed study selection, data extraction and risk-of-bias assessment (RoB-2). Primary outcomes included recurrence, reintervention, anal function, and quality of life (QoL). Pooled risk ratios (RRs) with 95% confidence intervals (CIs) were calculated using random-effects models. TSA was applied to overall recurrence.\n\n**Results:** Seventeen RCTs including 1,041 SH and 1,031 CH patients were analysed. SH was associated with a higher risk of overall recurrence compared with CH (RR = 1.56,95%CI = 1.00-2.44;I<sup>2</sup> = 48%). TSA showed that the accrued information size (1,913 patients) did not reach the required information size (2,608 patients), indicating that current evidence remains underpowered. Prolapse-related recurrence was significantly more frequent after SH (RR = 3.28,95%CI = 1.49-7.25;I<sup>2</sup> = 12%), whereas bleeding-related recurrence did not differ between groups (RR = 1.20,95%CI = 0.63-2.26;I<sup>2</sup> = 23%). No significant differences were found for reintervention, persistent anal pain, functional impairment or QoL.\n\n**Conclusion:** SH is associated with a higher risk of long-term recurrence, particularly prolapse-related recurrence, compared with CH, while long-term pain, functional outcomes and QoL appear broadly comparable. These findings suggest that, although SH may remain an option for selected patients, CH provides more durable anatomical correction, and procedural choice should balance early recovery against long-term durability.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 与 CH 相比，SH 与长期复发风险较高相关，尤其是与脱垂相关的复发，而长期疼痛、功能结果和生活质量似乎大致相当。这些研究结果表明，尽管 SH 可能仍然是选定患者的一种选择，但 CH 提供了更持久的解剖矫正，并且手术选择应平衡早期恢复与长期耐久性。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Circular stapler, Ferguson, Haemorrhoidectomy, Haemorrhoids, Harmonic scalpel, LigaSure, Milligan-Morgan, PPH, Stapled haemorrhoidopexy", "link": "https://pubmed.ncbi.nlm.nih.gov/41535511/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 14 Jan 2026"}, {"id": "41503542", "title_en": "Arterial Embolization for the Internal Hemorrhoids Management: A Systematic Review", "title_zh": "动脉栓塞治疗内痔：系
