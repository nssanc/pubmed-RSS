hat’s all we know.", "authors": "Yan-Jiun Huang", "abstract_en": "Conventional hemorrhoidectomy is the mainstay of treatment for symptomatic haemorrhoids, but reported postoperative complications remains the main concern. On the contrary, with its minimally invasive nature, laser hemorrhoidoplasty showed the potential to reduce postoperative complications and discomfort. Therefore, we performed a systemic review and meta-analysis to evaluate the postoperative outcome of laser hemorrhoidoplasty compared to conventional hemorrhoidectomies, including Milligan-Morgan and Ferguson techniques. Of all studies from PubMed, EMBASE, Cochrane database, and Google Scholar, we included 17 trials with 1196 patients, of whom 596 (49.8 %) underwent laser hemorrhoidoplasty and 600 (50.2 %) underwent conventional hemorrhoidectomy. The primary outcomes were operative blood loss and postoperative haemorrhage, and the secondary outcomes were the operative time, postoperative pain score, complications, and haemorrhoid recurrence. In this study, we found that laser hemorrhoidoplasty showed benefits in operative blood loss (weighted mean difference [WMD]: -16.43 ml, 95 % confidence interval [CI]: -23.82 to -9.04), postoperative hemorrhage/bleeding (odds ratio [OR]: 0.16, 95 % CI: 0.10 to 0.28), operative time (WMD: -12.42 min, 95 % CI: -14.56 to -10.28), postoperative pain score on day 1 (WMD: -2.50, 95 % CI: -3.13 to -1.88), and anal stenosis (OR: 0.14, 95 % CI: 0.03 to 0.65) in comparison with conventional hemorrhoidectomy. However, incidence of fecal/flatus incontinence, urinary retention and hemorrhoid recurrence were not significantly different between the 2 groups. Consistent results were found in 5 subgroup analyses, including studies with low risk of bias, studies using 1470 nm laser, and studies using 980 nm laser, studies conducted in Asia, and studies conducted in Europe and America.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ferguson hemorrhoidectomy, Laser hemorrhoidoplasty, Milligan-morgan hemorrhoidectomy, Postoperative outcom", "link": "https://pubmed.ncbi.nlm.nih.gov/38762410/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 18 May 2024"}, {"id": "38733497", "title_en": "Common design and data elements on rectal artery embolization for treatment of symptomatic internal hemorrhoidal disease: an interactive systematic review of clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Scott M Thompson", "abstract_en": "**Background:** Internal hemorrhoids (IH) is a common medical condition that can result in morbidity secondary to bleeding and discomfort. Treatment for IH has traditionally consisted of dietary and conservative medical management, focal treatments including banding and sclerotherapy or hemorrhoidectomy. Recently, rectal artery embolization (RAE) has been studied as a potential treatment for bleeding predominant IH. We performed a common design and data element analysis of studies that report on RAE.\n\n**Materials And Methods:** We conducted a qualitative systematic literature review for rectal artery embolization (RAE) for symptomatic hemorrhoidal disease. The screening process involved five online databases (PubMed, Embase, Google Scholar, DOAJ, and Scopus). Additionally, ClinicalTrials.gov was examined for active, unpublished completed studies. The initial search yielded 2000 studies, with 15 studies meeting the inclusion criteria after screening and assessment. The included studies comprised one RCT, one case series, one pilot study and 12 cohort studies.\n\n**Results:** The population analysis revealed a male predominance across all studies, with varying cohort sizes. The baseline Goligher hemorrhoid grade was utilized in 80% of studies. The majority (73.3%) employed a transfemoral approach, and coils were the primary embolic material in 60% of studies, 26.6% were combination of coils and particles, and 6.6% were particles only. Patient selection criteria highlighted RAE's applicability for high surgical risk patients and those with anemia, chronic hematochezia, or treatment-refractory cases. Exclusion criteria emphasized factors such as previous surgeries, colorectal cancer, rectal prolapse, acute hemorrhoidal complications, and contrast allergy. Study designs varied, with cohort studies being the most common (12/15; 80%). Procedural details included the use of metallic coils and detachable micro-coils, with a high technical success rate reported in most studies ranging from 72 to 100%. The follow-up ranged from 1 to 18 months. The majority of studies reported no major immediate or post-procedural complications.\n\n**Conclusion:** While all studies focused on RAE as a treatment for IH, there was a great degree of heterogeneity among included studies, particularly regarding inclusion criteria, exclusion criteria, outcomes measures and timeframe. Future literature should attempt to standardize these design elements to help facilitate secondary analyses and increase understanding of RAE as a treatment option.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 ith a risk ratio of 1.01 (95% CI 0.64-1.60). The quality of the evidence was rated down to 'low' due to inconsistency and imprecision.\n\n**Conclusion:** This review supports the use of LA for reducing early post-procedural pain following haemorrhoid banding. The evidence was limited by small sample sizes and substantial heterogeneity across studies.\n\n**Registration:** PROSPERO (ID CRD42022322234).", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anaesthesia, Local, Haemorrhoids, Pain management, Surgeons", "link": "https://pubmed.ncbi.nlm.nih.gov/38436741/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 04 Mar 2024"}, {"id": "38428446", "title_en": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Kiriakos Ktenidis", "abstract_en": "**Background:** We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\n**Methods:** Our study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\n**Results:** Twelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\n**Conclusion:** ALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 涉及 4249 名患者的 12 项研究符合所有纳入标准并最终被纳入。随访结束时总体复发和并发症的粗略估计和汇总估计分别为 10% (95% CI, 6.52%-14.08%) 和 5.20% (95% CI, 2.59%-8.52%)。回归分析显示复发与痔疮疾病分级之间没有相关性，II 级，β= -0.0012（95% CI，-0.0074 至 0.0049）（<i>p< without pre-injection analgesia. The meta-analysis of 14 randomized controlled trials (RCTs) revealed that sclerotherapy was not inferior to control interventions in terms of success rate (risk ratio [RR] 1.00, 95% CI 0.71-1.41) and recurrence rate (RR 1.11, 95% CI 0.69-1.77), while resulting in fewer complications (RR 0.46, 95% CI 0.23-0.92).\n\n**Conclusions:** This systematic review highlights the safety and efficacy of sclerotherapy for HD, which yields similar success rates and fewer complications compared to other conservative or surgical approaches. Further research is warranted to optimize sclerotherapy techniques and evaluate long-term outcomes.\n\n**Registration:** PROSPERO 2023 CRD42023396910.", "abstract_zh": "**背景：** 这项系统回顾和荟萃分析旨在评估过去 40 年来痔疮疾病 (HD) 硬化疗法的安全性和有效性。\n\n**方法：** 该审查遵循 2020 年系统审查和荟萃分析首选报告项目 (PRISMA) 指南。我们进行了全面的文献检索，包括报告硬化疗法在 HD 患者中使用的研究。研究资格标准已确定，数据由作者独立提取。进行随机效应荟萃分析以评估感兴趣的结果。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Registration：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoidal disease, Meta-analysis, Polidocanol foam, Sclerotherapy, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/38261136/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Tue, 23 Jan 2024"}, {"id": "38152300", "title_en": "The role of pudendal nerve block in hemorrhoid surgery: a systematic review and meta-analysis of double-blind randomized controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Yue Li", "abstract_en": "**Background:** Pudendal nerve block (PNB) is a commonly used anesthesia method that has been widely used in postoperative analgesia for hemorrhoids in recent years. Therefore, we conducted a systematic review and meta-analysis of double-blind randomized controlled trials (RCTs) to analyze the effectiveness of PNB in postoperative analgesia for hemorrhoids.\n\n**Methods:** Relevant data and studies published from inception until August 14, 2023, were retrieved from PubMed, Embase, and Web of Science to evaluate the beneficial effects of PNB for analgesia following hemorrhoidectomy.\n\n**Results:** This meta-analysis included 6 double-blind RCTs comprising 501 patients. We evaluated the function of PNB in improving outcomes of postoperative analgesia of hemorrhoids. Visual analogue scale (VAS) scores on postoperative within 6 h (MD, -3.04; 95% CI, -4.13 to -1.95; <i>P</i> < 0.0001), 12 h (MD, -3.14; 95% CI, -3.87 to -2.40; <i>P</i> < 0.0001), and 24 h (MD, -2.25; 95% CI, -2.95 to -1.55; <i>P</i> < 0.0001) were enhanced by the application of PNB, but not in 48 h (MD, -2.54; 95% CI, -5.29 to 0.20; <i>P</i> = 0.07).\n\n**Conclusion:** Pudendal nerve block (PNB) could effectively relieve postoperative pain of hemorrhoids. However, our results still need to be confirmed by multi-center clinical studies.", "abstract_zh": "**背景：** 阴部神经阻滞（PNB）是一种常用的麻醉方法，近年来在痔疮术后镇痛中得到广泛应用。因此，我们对双盲随机对照试验（RCT）进行了系统回顾和荟萃分析，以分析PNB在痔疮术后镇痛中的有效性。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 这项荟萃分析包括 6 项双盲随机对照试验，涉及 501 名患者。我们评估了 PNB 在改善痔疮术后镇痛效果方面的功能。术后6小时内（MD，-3.04；95% CI，-4.13至-1.95；<i>P</i> < 0.0001）、12小时（MD，-3.14；95% CI，-3.87至-2.40；<i>P</i> < 0.0001）和24小时（MD，-3.14；95% CI，-3.87至-2.40）和24小时（MD，应用 PNB 可以增强 (-2.25；95% CI，-2.95 至 -1.55；<i>P</i> < 0.0001)，但在 48 小时内没有增强 (MD，-2.54；95% CI，-5.29 至 0.20；<i>P</i> = 0.07)。\n\n**结论：** 阴部神经阻滞（PNB）可有效缓解痔疮术后疼痛。但我们的结果仍需要多中心临床研究的证实。", "keywords_zh": "麻醉，痔疮，阴部神经阻滞，手术，视觉模拟量表", "keywords_en": "anesthesia, hemorrhoid, pudendal nerve block, surgery, visual analog scale", "link": "https://pubmed.ncbi.nlm.nih.gov/38152300/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 28 Dec 2023"}, {"id": "37627064", "title_en": "A Systematic Review of Population-Based Studies of Chronic Bowel Symptoms in Cancer Survivors following Pelvic Radiotherapy", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Linda Sharp", "abstract_en": "Pelvic radiotherapy can damage surrounding tissue and organs, causing chronic conditions including bowel symptoms. We systematically identified quantitative, population-based studies of patient-reported bowel symptoms following pelvic radiotherapy to synthesize evidence of symptom type, prevalence, and severity. Medline, CINAHL, EMBASE, and PsychINFO were searched from inception to September 2022. Following independent screening of titles, abstracts, and full-texts, population and study characteristics and symptom findings were extracted, and narrative synthesis was conducted. In total, 45 papers (prostate, <i>n</i> = 39; gynecological, <i>n</i> = 6) reporting 19 datasets were included. Studies were methodologically heterogeneous. Most frequently assessed was bowel function ('score', 26 papers, 'bother', 19 papers). Also assessed was urgency, diarrhea, bleeding, incontinence, abdominal pain, painful hemorrhoids, rectal wetness, constipation, mucous discharge, frequency, and gas. Prevalence ranged from 1% (bleeding) to 59% (anal bleeding for >12 months at any time since start of treatment). In total, 10 papers compared radiotherapy with non-cancer comparators and 24 with non-radiotherapy cancer patient groups. Symptom prevalence/severity was greater/worse in radiotherapy groups and symptoms more common/worse post-radiotherapy than pre-diagnosis/treatment. Symptom prevalence varied between studies and symptoms. This review confirms that many people experience chronic bowel symptoms following pelvic radiotherapy. Greater methodological consistency, and investigation of less-well-studied survivor populations, could better inform the provision of services and support.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "cancer survivorship, chronic bowel symptoms, gynecological cancer, pelvic radiation disease, pelvic radiotherapy, prostate cancer, radiotherapy, radiotherapy late-effects, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/37627064/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 26 Aug 2023"}, {"id": "37133577", "title_en": "HEmoRhoidal disease management with Band ligation versus polidocanol Sclerotherapy: a systematic review and meta-analysis (the HerBS Review)", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Cagla Eskicioglu", "abstract_en": "**Purpose:** Symptomatic internal hemorrhoids affect up to 40% of people in Western society. Patients with grade I-III hemorrhoids, who fail lifestyle and medical management, may benefit from office-based procedures. As per the American Society of Colon and Rectum Surgeons (ASCRS), rubber band ligation (RBL) is the first-line office-based treatment. Polidocanol sclerotherapy is a relatively new approach for these patients. The aim of this systematic review is to compare the efficacy of RBL and polidocanol sclerotherapy with the treatment of symptomatic grade I-III internal hemorrhoids.\n\n**Methods:** The systematic review was completed by searching MEDLINE, Embase, and CENTRAL databases from inception to August 2022 for prospective studies comparing RBL and polidocanol sclerotherapy or evaluating the efficacy of polidocanol sclerotherapy alone for adult (> 18 years) patients with grade I-III internal hemorrhoids. Treatments were evaluated for therapeutic success and post-procedure morbidity.\n\n**Results:** Of 155 citations obtained, 10 studies (3 comparative and 7 single-arm studies) and 4 abstracts (2 comparative and 2 single arm) were included in the study. The patients undergoing sclerotherapy had a 93% (151/163) therapeutic success rate compared to 75% (68/91) in the RBL group (OR 3.39, 95% CI 1.48-7.74, p < 0.01). The post-procedure morbidity was 8% (17/200) in the sclerotherapy group and 18% (23/128) in the RBL group (OR 0.53, 95% CI 0.15-1.82, p = 0.31).\n\n**Conclusion:** This study highlights that polidocanol sclerotherapy may be associated with higher therapeutic success in patients with symptomatic grade I-III internal hemorrhoids. Further evaluations in the form of randomized trials are required to evaluate patient populations, which may benefit more from sclerotherapy.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 这项系统评价是通过搜索 MEDLINE、Embase 和 CENTRAL 数据库从开始到 2022 年 8 月的前瞻性研究来比较 RBL 和聚多卡醇硬化疗法或评估单独聚多卡醇硬化疗法对 I-III 级内痔成人（> 18 岁）患者的疗效而完成的。评估治疗的治疗成功率和术后发病率。\n\n**结果：** 在获得的 155 篇引用中，该研究纳入了 10 项研究（3 项比较研究和 7 项单组研究）和 4 项摘要（2 项比较研究和 2 项单组研究）。接受硬化疗法的患者的治疗成功率为 93% (151/163)，而 RBL 组的治疗成功率为 75% (68/91)（OR 3.39，95% CI 1.48-7.74，p<0.01）。硬化治疗组的术后发病率为 8% (17/200)，RBL 组为 18% (23/128)（OR 0.53，95% CI 0.15-1.82，p = 0.31）。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "内痔，发病率，聚多卡醇硬化疗法，橡皮筋结扎，治疗成功", "keywords_en": "Internal hemorrhoids, Morbidity, Polidocanol sclerotherapy, Rubber band ligation, Therapeutic success", "link": "https://pubmed.ncbi.nlm.nih.gov/37133577/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 03 May 2023"}, {"id": "37117040", "title_en": "Rubber band ligation versus coagulation for the treatment of haemorrhoids: a meta-analysis of randomised controlled trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Fangyu Wang", "abstract_en": "Non-surgical therapies have the advantage of lower postoperative pain and complication rates compared with surgical therapies. Rubber band ligation and coagulation are two kinds of non-surgical therapies. The aim of this study is to compare the clinical outcomes of rubber band ligation and coagulation. A systematic review was conducted to identify randomised clinical trials that compare rubber band ligation and coagulation treatments for haemorrhoids. PubMed and Web of Science were searched, from inception to April 30th,2022. Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines were followed. Fifty-nine studies were identified. Nine trials met the inclusion criteria. All trials were of moderate methodological quality. No significant difference was found between rubber band ligation and coagulation in terms of efficacy rate, postoperative prolapse rate, recurrence rate and postoperative urine retention rate after treatment. Patients undergoing rubber band ligation had higher postoperative pain rate and lower postoperative bleeding rate than patients undergoing coagulation. The subgroup analysis showed that there was no significant difference between rubber band ligation and infrared coagulation or non-infrared coagulation in terms of efficacy rate, postoperative bleeding and postoperative urine retention rate after treatment. Patients undergoing rubber band ligation had a higher postoperative pain rate than patients undergoing infrared coagulation or non-infrared coagulation. We believe that coagulation for haemorrhoids still has a good future. PROSPERO registration number CRD42022311281.", "abstract_zh": "与手术治疗相比，非手术治疗具有术后疼痛和并发症发生率较低的优点。橡皮筋结扎和电凝是两种非手术疗法。本研究的目的是比较橡皮筋结扎和凝血的临床结果。进行了系统评价，以确定比较橡皮筋结扎和凝血治疗痔疮的随机临床试验。 PubMed 和 Web of Science 的检索时间为从建站到 2022 年 4 月 30 日。遵循系统评价和荟萃分析指南的首选报告项目。确定了 59 项研究。九项试验符合纳入标准。所有试验的方法学质量均中等。橡皮筋结扎术与电凝术治疗后有效率、术后脱垂率、复发率、术后尿潴留率无显着差异。与接受电凝治疗的患者相比，接受橡皮筋结扎的患者术后疼痛发生率更高，术后出血率更低。亚组分析显示，橡皮筋结扎术与红外凝固或非红外凝固治疗后的有效率、术后出血及术后尿潴留率无显着差异。接受橡皮筋结扎的患者术后疼痛发生率高于接受红外凝固或非红外凝固的患者。我们相信凝血治疗痔疮仍有美好的前景。 PROSPERO 注册号 CRD42022311281。", "keywords_zh": "结直肠手术", "keywords_en": "colorectal surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/37117040/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 28 Apr 2023"}, {"id": "36813670", "title_en": "FAPI-avid nonmalignant PET/CT findings: An expedited systematic review", "title_zh": "FAPI 热衷的非恶性 PET/CT 结果：快速系统评价", "authors": "Helle D Zacho", "abstract_en": "Fibroblast activation protein inhibitor (FAPI) is a promising tracer in oncologic positron emission tomography/computed tomography (PET/CT). Numerous studies have demonstrated the superior sensitivity of FAPI PET/CT over fluorodeoxyglucose (FDG) PET/CT in several types of cancer. However, the cancer specificity of FAPI uptake remains understudied, and several cases of false-positive FAPI PET/CT findings have been reported. A systematic search of PubMed, Embase, and Web of Science was conducted for studies published prior to April 2022 reporting nonmalignant FAPI PET/CT findings. We included original peer-reviewed articles of studies in humans using FAPI tracers radiolabeled with <sup>68</sup>Ga or <sup>18</sup>F that were published in English. Papers without original data and studies with insufficient information were excluded. Nonmalignant findings were presented on a per-lesion basis and grouped according to the type of organ or tissue involved. The search identified a total of 1.178 papers, of which 108 studies were eligible. Eighty studies were case reports (74%), and the remaining 28 were cohort studies (26%). A total of 2.372 FAPI-avid nonmalignant findings were reported, with the most frequent being uptake in the arteries, e.g., related to plaques (n = 1178, 49%). FAPI uptake was also frequently related to degenerative and traumatic bone and joint lesions (n = 147, 6%) or arthritis (n = 92, 4%). For organs, diffuse or focal uptake was often seen in cases of inflammation, infection, fibrosis, and IgG4-related disease (n = 157, 7%). FAPI-avid inflammatory/reactive lymph nodes (n = 121, 5%) and tuberculosis lesions (n = 51, 2%) have been reported and could prove to be potential pitfalls in cancer staging. Periodontitis (n = 76, 3%), hemorrhoids (n = 47, 2%), and scarring/wound healing (n = 35, 2%) also presented as focal uptake on FAPI PET/CT. The present review provides an overview of the reported FAPI-avid nonmalignant PET/CT findings to date. A large number of benign clinical entities may show FAPI uptake and should be kept in mind when interpreting FAPI PET/CT findings in patients with cancer.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/36813670/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 22 Feb 2023"}, {"id": "36755770", "title_en": "Efficacy of Harmonic Scalpel Versus Bipolar Diathermy in Hemorrhoidectomy: A Systematic Review and Meta-Analysis of Nine Randomized Controlled Trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Mujahed S Alenezi", "abstract_en": "Hemorrhoidectomy is one of the most common surgical interventions to remove the third and fourth degrees of prolapse hemorrhoid. We carried out this systematic review and meta-analysis of the randomized controlled trials (RCTs) to comprehensively evaluate the efficacy of harmonic scalpel (HS) versus bipolar diathermy (BD) methods in terms of decreasing intraoperative and postoperative morbidities among patients undergoing hemorrhoidectomy. Suitable citations were found utilizing digital medical sources, including the CENTRAL, Web of Science, PubMed, Scopus, and Google Scholar, from inception until December 2022. Only RCTs that matched the inclusion requirements were selected. We used the updated Cochrane risk of bias (ROB) tool (version 2) to assess the quality of the involved citations. The Review Manager (version 5.4 for Windows) was used to perform the pooled analysis. Data were pooled and reported as mean difference (MD) or risk ratio (RR) with a 95% confidence interval (CI) in random-effects models. Overall, there was no significant difference between HS and BD in terms of decreasing intraoperative morbidities like operative time, intraoperative blood loss, mean duration of hospital stay, and mean duration of first bowel movement (P>0.05). Similarly, the rate of postoperative complications like pain, bleeding, urinary retention, anal stenosis, flatus incontinence, and wound edema; was similar in both groups with no significant difference (P>0.05). In conclusion, our pooled analysis revealed there was no substantial difference between HS and BD in terms of intraoperative and postoperative endpoints. Additional RCTs with larger sample sizes are needed to consolidate the power and quality of the presented evidence.", "abstract_zh": "痔切除术是去除三度和四度脱垂痔的最常见手术干预措施之一。我们对随机对照试验 (RCT) 进行了系统回顾和荟萃分析，以全面评估谐波手术刀 (HS) 与双极透热疗法 (BD) 方法在降低接受痔切除术的患者术中和术后发病率方面的功效。 从成立到 2022 年 12 月，利用数字医学资源（包括 CENTRAL、Web of Science、PubMed、Scopus 和 Google Scholar）找到了合适的引文。仅选择符合纳入要求的随机对照试验。我们使用更新的 Cochrane 偏倚风险 (ROB) 工具（第 2 版）来评估所涉及引文的质量。 Review Manager（Windows 版本 5.4）用于执行汇总分析。数据被汇总并报告为随机效应模型中具有 95% 置信区间 (CI) 的平均差 (MD) 或风险比 (RR)。总体而言，HS和BD在降低手术时间、术中失血量、平均住院时间和平均首次排便时间等术中并发症方面没有显着差异（P>0.05）。同样，术后并发症如疼痛、出血、尿潴留、肛门狭窄、肠胃胀气失禁和伤口水肿的发生率；两组相似，无显着性差异（P>0.05）。总之，我们的汇总分析显示，HS 和 BD 在术中和术后终点方面没有显着差异。需要进行更多样本量更大的随机对照试验，以巩固所提供证据的功效和质量。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "bipolar, haemorrhoid, harmonic, piles, systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/36755770/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 09 Feb 2023"}, {"id": "36695928", "title_en": "Hemorrhoid laser dearterialization: systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Davide Corbetta", "abstract_en": "Hemorrhoidal disease is a common and troublesome condition. Excisional hemorrhoidectomy can assure the best chance of cure but it is hampered by postoperative pain and potential long-term morbidity therefore minimally invasive techniques have been developed. Since 2009 a doppler-guided hemorrhoidal dearterialization with laser (the hemorrhoidal laser procedure; HeLP) has been proposed to control symptoms without significant sequelae. The aim of this systematic review is to analyze the benefits and disadvantages of HeLP for symptomatic hemorrhoids. The Medline/PubMed, Embase, and Cochrane library databases were searched from January 2010 to March 2022, language was restricted to English and documents to the full text. Randomized and non-randomized, prospective and retrospective cohort studies were included. Risk of bias assessment was performed using the Risk of bias for non-randomized studies (ROBINS-I) and the RoB2 Tool for randomized clinical trial. Primary outcome was to assess the efficacy of HeLP on symptoms' resolution. Secondary objectives were postoperative pain and complications, comparison with other interventional techniques, and evaluation of long-term recurrence. Whenever possible, a meta-analysis was conducted. The GRADE approach was employed to assess the certainty of evidence. We included six non-randomized and one randomized study. HeLP improved or resolved preoperative symptoms in 83.6 to 100% of patients during follow-up. In the randomized study symptoms resolved in 90% of patients after HeLP and 53.3% after rubber band ligation as comparator. Published data indicate that HeLP is effective, relatively safe, with limited recurrence rate, after a short to medium follow-up. The quality of evidence was however low. There is a paucity of studies assessing the benefits or harms of laser dearterialization for the treatment of hemorrhoids and randomized trials are furthermore rare, therefore trials with adequate power and proper design, assessing the advantages and disadvantages of HeLP versus other minimally invasive techniques, are needed. Furthermore, studies evaluating long-term follow-up are wanted.", "abstract_zh": "痔疮疾病是一种常见且麻烦的疾病。痔切除术可以确保最好的治愈机会，但它受到术后疼痛和潜在的长期发病率的阻碍，因此微创技术已经被开发出来。自 2009 年以来，有人提出采用多普勒引导激光痔去动脉化术（痔疮激光手术；HeLP）来控制症状，且不会产生明显后遗症。本系统评价的目的是分析 HeLP 治疗症状性痔疮的优点和缺点。 Medline/PubMed、Embase 和 Cochrane 图书馆数据库的检索时间为 2010 年 1 月至 2022 年 3 月，语言仅限于英语，文献仅限全文。包括随机和非随机、前瞻性和回顾性队列研究。使用非随机研究偏倚风险 (ROBINS-I) 和随机临床试验 RoB2 工具进行偏倚风险评估。主要结果是评估 HeLP 对症状缓解的功效。次要目标是术后疼痛和并发症、与其他介入技术的比较以及长期复发的评估。只要有可能，就进行荟萃分析。采用 GRADE 方法来评估证据的确定性。我们纳入了六项非随机研究和一项随机研究。在随访期间，HeLP 改善或解决了 83.6% 至 100% 患者的术前症状。在随机研究中，HeLP 后 90% 的患者症状得到缓解，橡皮筋结扎后 53.3% 的患者症状得到缓解（作为比较）。已发表的数据表明，经过短至中期随访后，HeLP 是有效的、相对安全的、复发率有限。然而证据的质量很低。评估激光去动脉化治疗痔疮的益处或危害的研究很少，而且随机试验也很少，因此需要有足够功率和适当设计的试验，评估 HeLP 与其他微创技术的优缺点。此外，还需要评估长期随访的研究。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, Laser coagulation, Laser dearterialization, Stapled hemorrhoidopexy, Superior rectal artery, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/36695928/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Wed, 25 Jan 2023"}, {"id": "36593573", "title_en": "Laser hemorrhoidoplasty versus conventional hemorrhoidectomy for grade II/III hemorrhoids: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Emile John Kwong-Wei Tan", "abstract_en": "**Purpose:** This study compared the short- and long-term clinical outcomes of laser hemorrhoidoplasty (LH) vs. conventional hemorrhoidectomy (CH) in patients with grade II/III hemorrhoids.\n\n**Methods:** PubMed/Medline and the Cochrane Library were searched for randomized and nonrandomized studies comparing LH against CH in grade II/III hemorrhoids. The primary outcomes included postoperative use of analgesia, postoperative morbidity (bleeding, urinary retention, pain, thrombosis), and time of return to work/daily activities.\n\n**Results:** Nine studies totaling 661 patients (LH, 336 and CH, 325) were included. The LH group had shorter operative time (P<0.001) and less intraoperative blood loss (P<0.001). Postoperative pain was lower in the LH group, with lower postoperative day 1 (mean difference [MD], -2.09; 95% confidence interval [CI], -3.44 to -0.75; P=0.002) and postoperative day 7 (MD, -3.94; 95% CI, -6.36 to -1.52; P=0.001) visual analogue scores and use of analgesia (risk ratio [RR], 0.59; 95% CI, 0.42-0.81; P=0.001). The risk of postoperative bleeding was also lower in the LH group (RR, 0.18; 95% CI, 0.12- 0.28; P<0.001), with a quicker return to work or daily activities (P=0.002). The 12-month risks of bleeding (P>0.999) and prolapse (P=0.240), and the likelihood of complete resolution at 12 months, were similar (P=0.240).\n\n**Conclusion:** LH offers more favorable short-term clinical outcomes than CH, with reduced morbidity and pain and earlier return to work or daily activities. Medium-term symptom recurrence at 12 months was similar. Our results should be verified in future well-designed trials with larger samples.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Blood coagulation, Hemorrhoidectomy, Hemorrhoids, Laser therapy", "link": "https://pubmed.ncbi.nlm.nih.gov/36593573/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 02 Jan 2023"}, {"id": "36578968", "title_en": "The effects of laser procedure in symptomatic patients with haemorrhoids: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Pedro Leão", "abstract_en": "**Purpose:** Haemorrhoids are normal structures in the human body, only seen as pathological when symptomatic. Nowadays, new techniques have surfaced using a diode laser which, after locating the target arteries, blocks the blood flow while hitting and shrinking the local mucosa/submucosa at a depth of 4 mm. Our work aimed to give a broad view over this new technique and its consequences in the post-operative follow-up with a systematic review.\n\n**Methods:** EMBASE and MEDLINE databases were consulted, retrieving clinical trials, which mentioned the use of 980 nm diode laser on the treatment of haemorrhoids.\n\n**Results:** Ten clinical trials analyzing the post-operative effects of laser haemorrhoidectomy were selected, including 2 randomized controlled clinical trials and 1 controlled clinical trial. The overall quality of the trials was low, indicating a high risk of bias.\n\n**Conclusion:** The laser haemorrhoidectomy procedure revealed a high therapeutic potential, considering the reduced number of postoperative complaints (bleeding/pain), the high symptom resolution and the reduced recurrence, albeit the high heterogeneity between the studies in terms of reported results. Future investigations with higher quality and controlled double-blinded studies obtaining better-categorized results should be conducted in order to better evaluate this procedure and compare it to the current paradigm.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 考虑到术后投诉（出血/疼痛）数量减少、症状消退率高和复发率降低，激光痔疮切除术显示出很高的治疗潜力，尽管各研究之间报告结果存在高度异质性。未来应进行更高质量的调查和受控双盲研究，以获得更好的分类结果，以便更好地评估该程序并将其与当前的范式进行比较。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "HeLP, diode laser, haemorrhoidectomy, haemorrhoidplasty, haemorrhoids", "link": "https://pubmed.ncbi.nlm.nih.gov/36578968/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 29 Dec 2022"}, {"id": "36545183", "title_en": "Office-Based Procedures in the Management of Hemorrhoidal Disease: Rubber Band Ligation versus Sclerotherapy - Systematic Review and Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Diogo Libânio", "abstract_en": "**Introduction:** The most frequently used office-based procedures in hemorrhoidal disease (HD) are rubber band ligation (RBL) and sclerotherapy. Few studies have been published comparing the various types of instrumental therapy. The aim of this systematic review and meta-analysis was to compare the efficacy and safety of sclerotherapy and RBL.\n\n**Methods:** Three online databases were searched. Efficacy (control of symptoms, prolapse, bleeding and pain, patients' satisfaction, and disease recurrence) and safety (complications, such as pain and bleeding) were the assessed outcomes. Pooled relative risks (RR) were computed for each outcome using a random-effects model, and heterogeneity was assessed by Cochran's Q test and <i>I</i><sup>2</sup>.\n\n**Results:** Six RCTs and three cohort studies were included. Control of prolapse and bleeding was significantly higher with RBL (93.1% RBL vs. 66.4% sclerotherapy, RR 1.34, 95% CI 1.12-1.60 and 89.1% RBL vs. 78.7% SCL, RR 1.17, 95% CI 1.02-1.34, respectively). Both techniques had similar results in terms of pain relief, overall control of symptoms, and risk of recurrence at 3 months. Although patient satisfaction was significantly higher with RBL (77.8% RBL vs. 46.7% sclerotherapy, RR 1.59, 95% CI 1.01-2.50), post-procedural pain was significantly higher with this technique (24% RBL vs. 14% sclerotherapy, RR 1.74, 95% CI 1.32-2.28). There was no significant difference regarding post-procedure bleeding (11.1% RBL vs. 8.7% sclerotherapy, RR 1.29, 95% CI 0.86-1.94). In the subgroup analysis, according to the HD grade, post-procedure pain was higher with RBL only in HD grade II (vs. HD grade I-III).\n\n**Conclusions:** RBL performs better than sclerotherapy in controlling HD symptoms, specifically prolapse and bleeding, although post-procedural pain is a frequent complication. Recurrence is similar with both procedures. While waiting for the publication of results with sclerotherapy with new sclerosants, RBL remains the office-based treatment of choice in HD.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoidal disease, Rubber band ligation, Sclerotherapy", "link": "https://pubmed.ncbi.nlm.nih.gov/36545183/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 22 Dec 2022"}, {"id": "36432034", "title_en": "Citroflavonoids as Promising Agents for Drug Discovery in Diabetes and Hypertension: A Systematic Review of Experimental Studies", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Emanuel Hernández-Núñez", "abstract_en": "Flavonoids are naturally occurring compounds widely distributed in the <i>Citrus</i> genus. These natural compounds have many health benefits, mainly for metabolic and cardiovascular diseases. In fact, some these compounds are components of drug products with approved indications for peripheral vascular insufficiency and hemorrhoids. However, information on pharmacological effects of these compounds remains disperse and there is scarce comprehensive analysis of whole data and evidence. These kinds of evidence analyses could be necessary in drug design and the development of novel and innovate drug products in diabetes and hypertension. We aimed to systematically search for evidence on the efficacy of citroflavonoids in diabetes and hypertension in in vivo models. We searched four literature databases based on a PICO strategy. After database curation, twenty-nine articles were retrieved to analyze experimental data. There was high heterogeneity in both outcomes and methodology. Naringenin and hesperetin derivates were the most studied citroflavonoids in both experimental models. More investigation is still needed to determine its potential for drug design and development.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "biochemical parameters, blood markers, gene expression, hesperidin, naringenin, protein content", "link": "https://pubmed.ncbi.nlm.nih.gov/36432034/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Sat, 26 Nov 2022"}, {"id": "36371772", "title_en": "The role of the Rafaelo procedure in the management of hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "George Tzovaras", "abstract_en": "**Background:** The aim of this study was to summarize the current evidence regarding the role of the Rafaelo procedure in the management of hemorrhoidal disease (HD).\n\n**Methods:** This study was based on the Cochrane Handbook for Systematic Reviews of Interventions and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. A literature search was performed (Medline, Scopus, CENTRAL, and Web of Science) from inception to 25/09/2022. Grey literature databases were also reviewed. The primary endpoint was the pooled complications rate of the Rafaelo procedure in patients with HD. Secondary endpoints included short- (bleeding, pain, thrombosis, necrosis, urinary retention, fever, oedema, anal fissure, and readmission) and long-term (stenosis, meteorism, constipation, anal tags, anal hyposensibility, reoperation, and recurrence) postoperative complication rates. Both prospective and retrospective studies were considered. Quality evaluation was performed via the ROBINS-I tool. Certainty of Evidence was based on the Grading of Recommendations, Assessment, Development, and Evaluation (GRADE) methodology.\n\n**Results:** Overall, 6 non-randomized studies and 327 patients were included. The overall complication rate was 17.6% (95% CI 8.8-26.3%). Short-term complications were bleeding (7.5%, 95% CI 2.5-12.5%), thrombosis (2.2%, 95% CI 0.4-4.8%), and pain (1.6%, 95% CI 0.2-3.3%). Reoperation and recurrence rates were 1.8% (95% CI 0.3-3.4%) and 4.8% (95% CI 1.2-8.4%), respectively. A significant improvement in the presenting symptoms was noted. Method approval and patient satisfaction rates were 89.1% (95% CI 81.7-96.6%) and 95% (95% CI 89.8-100%), correspondingly. Overall CoE was \"Very Low\".\n\n**Conclusions:** Further randomized controlled trials are required to delineate the exact role of the Rafaelo procedure in HD.", "abstract_zh": "**背景：**  Embase, Cumulative Index to Nursing and Allied Health Literature, and the Cochrane Database of Systematic Reviews.\n\n**Results:** The SLR identified 44 eligible publications. Consistent data were limited on the epidemiology of HD or HD recurrence. Specifically, incidence and prevalence reported across geographies were impacted by differences in data collection. Reported risk factors for HD were sedentary behavior, constipation, male gender, and age. Twenty-three RWE studies and one meta-analysis reported HD recurrence rates ranging from 0 to 56.5% following surgery or phlebotonics, with most (n = 19) reporting rates of 20% or less. In addition to time since treatment, risk factors for recurring disease were similar to those for HD in general. With respect to treatment, micronized purified flavonoid fractions significantly improved the main symptoms of HD compared to other pharmacological treatments.\n\n**Conclusion:** The SLRs did not identify any RWE studies reporting recurrence in patients receiving systemic or topical treatments, highlighting the need for future research in this area. Further, more studies are needed to understand the optimum duration of medical treatment to prevent recurrence.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, MPFF, Phlebotonics, Recurrence, Risk factors", "link": "https://pubmed.ncbi.nlm.nih.gov/36331754/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 04 Nov 2022"}, {"id": "36199772", "title_en": "Three Acupuncture Methods for Postoperative Pain in Mixed Hemorrhoids: A Systematic Review and Network Meta-Analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xiaoxue Jiang", "abstract_en": "**Background:** Mixed hemorrhoids are a common anorectal disorder, surgery is the most effective means of eradicating hemorrhoids, and pain is the most common postoperative complication of mixed hemorrhoids.\n\n**Objective:** To compare the clinical efficacy of auricular plaster, acupoint application, and acupoint catgut embedding for treating postoperative pain in mixed hemorrhoids.\n\n**Method:** PubMed, Embase, The Cochrane Library, Web of Science, CNKI, Wanfang, VIP, and CBM databases were searched for randomized controlled trials (RCTs) of three acupuncture-related therapies for postoperative pain in mixed hemorrhoids from the time of database creation to October 2021. After screening the literature, extracting information, and evaluating the risk of bias of included studies, statistical analysis was performed using RevMan 5.3 and Stata 15.0.\n\n**Result:** Forty-seven RCTs with a total of 5121 patients were included. Network meta-analysis (NMA) showed that auricular plaster (OR = 5.90, 95% CI = (2.02, 17.21)) and acupoint catgut embedding therapy (OR = 5.55, 95% CI = (1.01, 30.40)) were more effective than analgesics in the treatment of postoperative pain in mixed hemorrhoids. The cumulative ranking probability (SUCRA) showed that acupoint application (73.6%) had the best overall efficacy and the rest were auricular plaster (68.7%), acupoint catgut embedding therapy (64.6%), auricular plaster combined with acupoint application (63.4%), and pain medication (8.9%) in that order. Secondly, auricular plaster (OR = -0.93, 95% CI = (-1.66, -0.20)), acupoint catgut embedding (OR = -0.8, 95% CI = (-1.50, -0.10)), and acupoint application (OR = -1.4, 95% CI = (-2.50, -0.31)) all led to a significant decrease in pain scores and were all more effective than analgesics. As ranked by SUCRA, the results showed that the efficacy of acupoint application (73.5%) was optimal and the rest were auricular plaster (56.1%), acupoint catgut embedding (50.2%), and pain medication (15.3%) in that order. In terms of pain degree, acupoint application (OR = 3.83, 95% CI = (1.25, 11.74)) was significantly better than pain medication.\n\n**Conclusion:** Acupoint application can improve the overall efficiency, reduce pain scores, and relieve the degree of postoperative pain in mixed hemorrhoids.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Result：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/36199772/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Thu, 06 Oct 2022"}, {"id": "36094598", "title_en": "Laser hemorrhoidoplasty for hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ryanto Karobuana Sitepu", "abstract_en": "Laser hemorrhoidoplasty (LHP) is known as a new minimally invasive and painless procedure for symptomatic hemorrhoids. However, Milligan-Morgan (MM) may offer the best result of long-term cure rates. In this study, we aim to compare the efficacy between LHP and MM for hemorrhoidal disease treatment. Using specific keywords, we comprehensively go through the potential articles on PubMed, Europe PMC, and Google Scholar sources until April 19, 2022. All published studies on LHP and MM hemorrhoidectomy were collected. Statistical analysis was done by using Review Manager 5.4 software. Twelve studies with a total of 1756 patients with hemorrhoid grades II-IV were included for the analysis. Our pooled analysis revealed that LHP was associated with shorter operative time (p < 0.00001), shorter length of hospital stay (p = 0.0005), lower risk of urinary retention (p = 0.005) and anal stenosis (p = 0.0004), and lower VAS 24-h post-operative (p < 0.00001) when compared with MM. However, LHP and MM did not differ in terms of recurrence rate (p = 0.70). LHP was superior to MM procedure in terms of shortening the recovery time and minimizing post-operative complications for patients with hemorrhoidal disease.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Hemorrhoids, Laser, Minimal invasive, Rectum, Surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/36094598/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 12 Sep 2022"}, {"id": "36048469", "title_en": "Utility of botulinum toxin injection for post-operative pain management after conventional hemorrhoidectomy: a systematic review and meta-analysis of clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Timotius Ivan Hariyanto", "abstract_en": "**Background:** Botulinum Toxin (BTX) has been found to have anti-spasm and analgesic effects. The utility of BTX after conventional hemorrhoidectomy remains unclear. Thus, a systematic review and meta-analysis are required to find out its utility after conventional hemorrhoidectomy.\n\n**Methods:** Using specific keywords, we comprehensively go through the potential articles on PubMed, ClinicalTrials.gov, and Europe PMC sources until March 27<sup>th</sup>, 2022. All published studies on botulinum toxin anal sphincter injection after conventional hemorrhoidectomy were collected. We were using Review Manager 5.4 software to conduct statistical analysis.\n\n**Results:** Five clinical trial studies with a total of 260 patients undergoing hemorrhoidectomy were included in the analysis Our pooled analysis revealed that BTX injection after hemorrhoidectomy was associated with lower VAS at 24 h post-operative [Mean Difference -1.35 (95% CI -1.90, -0.80), <i>p</i> < 0.00001, <i>I</i><sup>2</sup> = 0%] and shorter time to return work [Mean Difference -8.94 days (95% CI -12.57, -5.30), <i>p</i> < 0.00001, <i>I</i><sup>2</sup> = 0%]. However, BTX injection did not differ significantly from placebo in terms of time to first defecation (<i>p</i> = 0.22), fecal incontinence (<i>p</i> = 0.91) and urinary retention incidence (<i>p</i> = 0.18).\n\n**Conclusion:** BTX sphincter injection may offer some benefit after conventional hemorrhoidectomy in reducing pain from the first day after the procedure and promoting wound healing without complication. Further randomized clinical trials are still needed to confirm the results of our study.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)! tudies were reported from Oromia region followed by Amhara (33.3%) regional state. A total of 50 medicinal plants have been reported where Fabaceae and Solanaceae represent the most commonly used families. Herbs were the most (38%) commonly used medicinal plants followed by shrubs (34%) and trees (26%). Leaf (44%) and root (24%) were the first and second most commonly used plant parts, respectively. Most of the medicinal remedies (36%) were prepared by pounding the fresh part of the plant. Besides, 56.1% of the herbal preparations were administered through topical route.\n\n**Conclusion And Recommendations:** Numerous medicinal plants from various families have been documented in this review as anti-hemorrhoidal remedies. Further studies could be anticipated in the search for new, effective, and safe plant-based medications from medicinal plants discussed in this review.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Conclusion and recommendations：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Ethiopia, Hemorrhoids, Herbal medication, Medicinal plant", "link": "https://pubmed.ncbi.nlm.nih.gov/36033288/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Mon, 29 Aug 2022"}, {"id": "35906356", "title_en": "Systematic review and meta-analysis of postoperative pain and symptoms control following laser haemorrhoidoplasty versus Milligan-Morgan haemorrhoidectomy for symptomatic haemorrhoids: a new standard", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Frederick H Koh", "abstract_en": "**Purpose:** Haemorrhoidal disease (HD) plagues one in every ten people, with a plethora of surgical treatment modalities, of which laser haemorrhoidoplasty (LHP) is a relatively novel option. This systematic review and meta-analysis objectively evaluated the efficacy, safety, and tolerability of LHP compared against conventional (Milligan-Morgan) open haemorrhoidectomy (CoH).\n\n**Method:** A comprehensive search of MEDLINE, EMBASE, CENTRAL, and Google Scholar was conducted. Randomised controlled trials (RCTs) and comparative cohort studies (CCSs) which compared LHP against CoH were included, with postoperative pain as the primary outcome. Secondary outcomes included intraoperative characteristics, short- and moderate-term outcome, and complications.\n\n**Results:** A total of 12 studies (6 RCTs and 6 CCSs), with a total of 1824 patients, were analysed. LHP resulted in reduced postoperative pain for the first day (mean difference of 2.07 visual analogue scale units), week, and month. The mean dosage and duration of postoperative analgesia use was similarly lower, with a mean difference of 4.88 mg (morphine) and 2.25 days, respectively. Crucially, recurrence was equivocal (HR: 0.72, CI: 0.21-2.40) at a mean follow-up duration of 8.58 ± 9.55 months. LHP resulted in lower blood loss and was 12.74 min shorter on average. LHP's postoperative recovery time was 9.03 days less with equivalent or decreased risk of most short- and moderate-term complications except anal thrombosis.\n\n**Conclusion:** Our study suggests that LHP is more tolerable than CoH, providing patients with superior postoperative quality of life at equivalent moderate-term efficacy. These findings contribute to improved understanding of LHP and its potential at enhancing the quality of HD care.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Haemorrhoids, Laser, Outcomes, Surgery, Technique", "link": "https://pubmed.ncbi.nlm.nih.gov/35906356/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260828062351&v=2.20.1", "date": "Fri, 29 Jul 2022"}, {"id": "35792887", "title_en": "Anoplasty for anatomical anal stenosis: systematic review of complications and recurrences", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ugo Grossi", "abstract_en": "**Aim:** The optimal surgical treatment for anatomical anal stenosis (AS) remains to be determined. The aim of this study was to determine the rates of complications and recurrence after anoplasty for anatomical AS and, wherever feasible, compare the outcomes for the various techniques.\n\n**Method:** A PROSPERO-registered systematic review was reported following the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. Medline, PubMed, Embase, Cochrane Library of Systematic Review, Scopus and Web of Science were searched for articles published up to May 2021. Studies that assessed the outcomes of anoplasty in adult patients with anatomical AS were selected. The primary outcomes were complications and recurrence. The methodological quality of studies was appraised using the Joanna Briggs Institute critical appraisal tools.\n\n**Results:** From the total of 2705 unique screened records, 151 were assessed for eligibility. Only 29 studies (two prospective) met the inclusion criteria, reporting data on 556 patients [mean age 53 (18-83) years, 46% female]. Previous history of surgery for haemorrhoidal disease accounted for three quarters of cases. A total of 14 types of anoplasty were found, with the Y-V flap being the most performed technique [27% of cases (n = 149)]. Complications frequently occurred, with a pooled prevalence of 10.2% (95% CI 3.9%-24.1%) after Y-V flap and 11.5% (5.3%-23.0%) after rhomboid/diamond flap. Patients undergoing house flap achieved better results in terms of clinical improvement, satisfaction and quality of life compared with Y-V flap and rhomboid/diamond flap. When considering only studies with at least 12 months of follow-up, the pooled prevalence of recurrence was 4.7% (2.2%-9.8%), with significantly higher rates observed in the prospective versus retrospective series [pooled prevalence 18.9% (11.5%-29.5%) vs. 3.6% (1.7-7.8%), respectively; p < 0.001].\n\n**Conclusion:** Both complications and recurrence were significantly lower after house flap compared with rhomboid/diamond and Y-V flap. Better designed multicentre studies with longer follow-up are needed to confirm these findings.\n\n**Prospero Registration Number:** CRD42021239493.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try ag
