> from database inception until 31 December 2022. Selection criteria were: (1) patients with a diagnosis of obstetric-related RVF; (2) patients treated surgically with no restriction concerning the considered surgery; (3) clinical trials or epidemiological studies. Meta-analysis was conducted considering the network meta-analysis framework to allow studying the relative value of each treatment mentioned in the selected articles.\n\n**Results:** The quantitative synthesis included 32 studies (18 retrospective and 14 prospective) accounting for 595 patients. The quality of these studies was low because of the lack of prospective randomization. Nineteen procedure types were described and assessed. Most patients (n = 180) underwent endorectal advancement flap (ERAF) followed by excision and layered closure (ELC) (n = 213) and Musset procedure (n = 65). A diverting stoma was performed in 66/132 patients. Only 13 studies reported the functional results of the procedure. In the meta-analysis, the Musset procedure (OR = 4.29; 95% CI: 1.18-16.14), transvaginal ELC (OR = 11.84; 95% CI: 2.18-91.80) and transperineal ELC (OR = 3.56; 95% CI: 1.26-10) significantly improved the anatomical results compared to ERAF.\n\n**Conclusions:** A further randomized controlled trial in the literature assessing ERAF and sphincteroplasty to compare the anatomical results, functional results and morbidity of this treatment is needed.\n\n**Registration:** PROSPERO CRD42023447875.", "abstract_zh": "**背景：** 产科直肠阴道瘘（RVF）的治疗对于外科医生来说是一项挑战。修复 RVF 的最佳手术方法，特别是在产科肛门括约肌损伤后，尚未得到广泛研究。目的是比较修复产科 RVF 的不同手术的成功率。\n\n**方法：** 文献检索在 PubMed<sup>®</sup> 和 Web of Science<sup>®</sup> 上进行，从数据库建立到 2022 年 12 月 31 日。选择标准为： (1) 诊断为产科相关 RVF 的患者； (2) 接受手术治疗且对所考虑手术没有限制的患者； (3)临床试验或流行病学研究。考虑网络荟萃分析框架进行荟萃分析，以研究所选文章中提到的每种治疗方法的相对价值。\n\n**结果：** 定量综合包括 32 项研究（18 项回顾性研究和 14 项前瞻性研究），涉及 595 名患者。由于缺乏前瞻性随机化，这些研究的质量较低。描述并评估了十九种手术类型。大多数患者（n = 180）接受直肠内推进皮瓣（ERAF），然后进行切除和分层闭合（ELC）（n = 213）和Musset手术（n = 65）。 66/132 名患者进行了改道造口。只有 13 项研究报告了该手术的功能结果。在荟萃分析中，Musset手术（OR = 4.29；95% CI：1.18-16.14）、经阴道ELC（OR = 11.84；95% CI：2.18-91.80）和经会阴ELC（OR = 3.56；95% CI： 1.26-10) 与 ERAF 相比，显着改善了解剖结果。\n\n**结论：** 需要在文献中进行进一步的随机对照试验来评估 ERAF 和括约肌成形术，以比较这种治疗的解剖结果、功能结果和发病率。\n\n**Registration：** 普洛斯彼罗 CRD42023447875。", "keywords_zh": "肛门阴道瘘、产科、直肠阴道瘘、修复", "keywords_en": "Anovaginal fistula, Obstetric, Rectovaginal fistula, Repair", "link": "https://pubmed.ncbi.nlm.nih.gov/40192869/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 07 Apr 2025"}, {"id": "40125894", "title_en": "Fistulotomy versus fistulectomy for simple fistula-in-ano: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "单纯性肛瘘的瘘管切开术与瘘管切除术：随机对照试验的系统评价和荟萃分析", "authors": "Rebecca J Lendzion", "abstract_en": "**Background:** Perianal fistulas are a common anorectal pathology. The sphincter-cutting techniques of fistulectomy and fistulotomy are associated with high cure rates for low or simple fistula-in-ano, with negligible risk of incontinence. However, the superiority of either technique has not previously been conclusively demonstrated. The aim of this systematic review is to compare the outcomes of the two surgical techniques for the management of simple fistula-in-ano.\n\n**Methods:** A search of MEDLINE, EMBASE and Cochrane Databases for randomized controlled trials (RCT) comparing fistulotomy to fistulectomy for simple fistula-in-ano was conducted. The primary outcome was healing time; secondary outcomes included operative time, length of hospital stay, post-operative pain score, post-operative complications and fistula recurrence.\n\n**Results:** Thirteen RCTs meet inclusion criteria, comprising a total of 685 fistulectomy and 688 fistulotomy patients. There was no significant difference between the techniques for healing time (P = 0.15), operative time (P = 0.13), length of stay (P = 0.05), wound infection (P = 0.97), flatus or faecal incontinence (P = 0.35 and P = 0.70, respectively) or recurrence (P = 0.19). Post-operative pain at 24 h, assessed using a visual analogue scale, was significantly lower in the fistulectomy group (MD-0.49, 95% CI: -0.90, -0.08; P = 0.02), and we found significantly fewer post-operative bleeding complications in the fistulotomy group (OR: 3.81, 95% CI: 1.23, 11.80; P = 0.02).\n\n**Conclusion:** This systematic review did not find conclusive evidence of the superiority of either fistulectomy or fistulotomy in terms of healing time. The two statistically significant findings were lower post-operative pain scores with fistulectomy and reduced post-operative bleeding with fistulotomy.", "abstract_zh": "**背景：** 肛周瘘是一种常见的肛肠疾病。瘘管切除术和瘘管切开术的括约肌切割技术与低度或单纯性肛门瘘的治愈率较高，并且失禁的风险可以忽略不计。然而，这两种技术的优越性之前都没有得到最终证明。本系统评价的目的是比较两种手术技术治疗单纯性肛瘘的结果。\n\n**方法：** 对 MEDLINE、EMBASE 和 Cochrane 数据库进行了随机对照试验 (RCT) 的检索，比较了单纯性肛瘘的瘘管切开术和瘘管切除术。主要结果是愈合时间；次要结局包括手术时间、住院时间、术后疼痛评分、术后并发症和瘘管复发。\n\n**结果：** 13 项随机对照试验符合纳入标准，总共包括 685 例瘘管切除术患者和 688 例瘘管切开术患者。愈合时间（P = 0.15）、手术时间（P = 0.13）、住院时间（P = 0.05）、伤口感染（P = 0.97）、排气或大便失禁（P = 0.35和P = 0.70）之间没有显着差异。分别）或复发（P = 0.19）。使用视觉模拟量表评估，瘘管切除组的术后 24 小时疼痛明显较低（MD-0.49，95% CI：-0.90，-0.08；P = 0.02），并且我们发现瘘管切开组的术后出血并发症明显较少（OR：3.81，95% CI：1.23，11.80； P = 0.02）。\n\n**结论：** 这项系统评价没有找到确凿的证据证明瘘管切除术或瘘管切开术在愈合时间方面具有优越性。两项具有统计学意义的发现是瘘管切除术术后疼痛评分较低，以及瘘管切开术减少术后出血。", "keywords_zh": "肛瘘, 瘘管切除术, 瘘管切开术, 随机对照试验", "keywords_en": "anal fistula, fistulectomy, fistulotomy, randomized controlled trials", "link": "https://pubmed.ncbi.nlm.nih.gov/40125894/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 24 Mar 2025"}, {"id": "40024986", "title_en": "A systematic review of outcome measurement instruments used in pouch anal and vaginal fistulae: a COSMIN-based analysis", "title_zh": "对储袋肛瘘和阴道瘘使用的结果测量仪器进行系统评价：基于 COSMIN 的分析", "authors": "Phil Tozer", "abstract_en": "**Purpose:** Pouch-related fistulae are devastating complications of ileoanal pouch surgery, which is performed to improve the quality of life (QoL) for patients who have had a proctocolectomy. Their management is limited by inconsistent evidence, including using poorly and heterogeneously defined outcomes. This study aims to identify all Outcome Measurement Instruments (OMIs) used in pouch fistula research, including Patient-Reported Outcome Measures (PROMs) and Clinician-Reported Outcome Measures (ClinROMs) and evaluate their quality using COSMIN guidelines to help select the best tool for a standardised core outcome measurement set in a future consensus study.\n\n**Methods:** A systematic review was conducted to identify all OMIs used in ileo-anal pouch fistulae studies, from MEDLINE, Embase, and the Cochrane Library. We evaluated existing OMIs based on COSMIN guidelines and used the GRADE approach to assess evidence quality. Results were synthesized narratively.\n\n**Results:** Among 91 studies, 13 OMIs were reviewed. Pouch-specific instruments performed poorly in key domains of reliability, validity, and responsiveness. Only 17.6% of studies assessed QoL using PROMs. The best-performing instruments were the SF-36 and IBDQ. The Ileoanal Pouch Syndrome Severity Score was the only pouch-specific instrument that involved patients in its development and although useful for pouch dysfunction, it lacks specific QoL assessment and was not validated in pouch-fistulae patients.\n\n**Conclusion:** Existing OMIs for pouch-related fistulae lack adequate measurement properties, with no PROMs specifically validated for QoL in this population and very few instruments involving patients in their development. There is an unmet need for a validated PROM specifically for QoL in pouch-related fistulae.", "abstract_zh": "**Purpose：** 储袋相关瘘管是回肠肛管储袋手术的严重并发症，该手术的目的是提高直肠结肠切除术患者的生活质量 (QoL)。他们的管理受到不一致的证据的限制，包括使用不明确和异质定义的结果。本研究旨在确定储袋瘘研究中使用的所有结果测量仪器 (OMIs)，包括患者报告的结果测量 (PROM) 和临床医生报告的结果测量 (ClinROM)，并使用 COSMIN 指南评估其质量，以帮助在未来的共识研究中选择标准化核心结果测量集的最佳工具。\n\n**方法：** 我们对 MEDLINE、Embase 和 Cochrane 图书馆进行了系统评价，以确定回肠肛袋瘘研究中使用的所有 OMI。我们根据 COSMIN 指南评估了现有的 OMI，并使用 GRADE 方法来评估证据质量。结果以叙述方式综合。\n\n**结果：** 在 91 项研究中，审查了 13 项 OMI。造口袋专用仪器在可靠性、有效性和响应性等关键领域表现不佳。只有 17.6% 的研究使用 PROM 评估生活质量。性能最好的仪器是 SF-36 和 IBDQ。回肠储袋综合征严重程度评分是唯一让患者参与其发展的储袋特异性工具，虽然对于储袋功能障碍有用，但缺乏具体的生活质量评估，并且未在储袋瘘患者中进行验证。\n\n**结论：** 现有的用于与造口袋相关的瘘管的 OMI 缺乏足够的测量特性，没有专门针对该人群的 QoL 进行验证的 PROM，并且涉及患者开发的仪器也很少。对于专为造口袋相关瘘管的生活质量而设计的经过验证的 PROM 的需求尚未得到满足。", "keywords_zh": "COSMIN、患者报告的结果测量、储袋瘘、储袋肛瘘、储袋阴道瘘", "keywords_en": "COSMIN, Patient reported outcome measures, Pouch Fistula, Pouch anal fistula, Pouch vaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40024986/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sun, 02 Mar 2025"}, {"id": "39422801", "title_en": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "肛周粘液性腺癌：一例报告和文献系统回顾", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\n**Methods:** A systematic PubMed and Scopus search was conducted, a propos of a case report.\n\n**Results:** One hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "**背景：** 肛门粘液性腺癌是一种罕见的胃肠道肿瘤。在大多数情况下，这种疾病的早期诊断很困难，因为它的症状经常模仿良性炎症。\n\n**方法：** 根据病例报告的建议，进行了系统的 PubMed 和 Scopus 检索。\n\n**结果：** 纳入 93 份病例报告中的 150 名患者。患者的平均年龄为 60.5 岁（范围：18-81 岁）。其中大多数为男性（150 人中的 124 人，82.7%），而已知的主要危险因素是慢性瘘管病史（150 人中的 109 人，72.7%）。复发性肛周脓毒症和肛周疼痛是就诊时的主要症状。仅 3 名患者没有报告任何症状（150 名患者中有 3 名，2%）。关于患者既往手术史，分别有62名（41.3%）和19名（12.7%）患者接受过多处脓肿引流和肛周瘘相关干预。 150例患者中，有53例（35.3%）接受了新辅助放化疗，其中大多数患者接受了化疗和放疗的联合治疗。 APR 及其变体是最常用的手术治疗方法 (68%)。几乎三分之一的纳入患者（34%）接受了辅助放化疗。 150 名患者中有 41 名（27.3%）报告疾病复发。 150 名患者中有 44 名死亡（29.3%）。\n\n**结论：** 对现有已发表文献的回顾表明，肛周粘液性腺癌是一种极其罕见的肿瘤。由于这种肿瘤的罕见性，在诊断和治疗策略方面尚未达成共识。高度的临床怀疑和组织病理学证实是诊断粘液腺癌的主要必要条件，特别是在慢性溃疡增殖性肛周病变的情况下。", "keywords_zh": "肛门、肛门、肛门内超声检查、粘液性腺癌、肛周", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39186335", "title_en": "Efficacy and Safety of Endorectal Advancement Flap for the Treatment of Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "直肠内推进皮瓣治疗肛瘘的疗效和安全性：系统评价和荟萃分析", "authors": "Wencong Xu", "abstract_en": "**Aim:** Complex anal fistula poses a significant challenge for anorectal surgeons due to its high risks of recurrence and incontinence. A sphincter-preserving procedure named endorectal advancement flap (ERAF) is gradually being applied to clinical practice. Therefore, this meta-analysis aims to evaluate the efficacy and safety of ERAF in managing anal fistula.\n\n**Methods:** We searched PubMed, Embase, Cochrane, and Web of Science databases for relevant manuscripts published from 29 August 2003 to 29 August 2023. Among these studies, outcomes included healing rate, recurrence rate, incontinence rate, and complications. Furthermore, the quality of the included studies was assessed using the Newcastle-Ottawa Scale (NOS) and the Cochrane risk-of-bias tool. The heterogeneity was determined using the chi-squared test and I2 statistic. A random effects model was applied if significant heterogeneity (p < 0.05 and I2 > 50%) was observed. Sensitivity analysis was conducted by excluding studies with a high risk of bias.\n\n**Results:** Thirty-eight studies were included in the present analysis, involving 1559 participants. The pooled healing rate and recurrence rate of ERAF were 65.5% (95% confidence intervals (CI): 57.6%-73.4%) and 19.6% (95% CI: 14.8%-24.4%), respectively. The pooled incontinence rate was 10.6% (95% CI: 6.0%-15.1%). According to the subgroup analysis, the healing rate, recurrence rate, and incontinence rate of ERAF for fistula associated with inflammatory bowel disease (IBD) were 53.9% (95% CI: 38.1%-69.7%), 32.6% (95% CI: 21.3%-43.8%), and 2.8% (95% CI: 0%-10.6%), respectively. For patients without IBD, the healing rate, recurrence rate, and incontinence rate of ERAF were 70.6% (95% CI: 63.9%-77.4%), 15.7% (95% CI: 9.9%-21.5%), and 16.5% (95% CI: 8.1%-24.9%), respectively. We observed that bleeding, local infection or abscess, flap dehiscence, and haematomas were the common complications, with incidences of 2.2% (95% CI: 0%-4.5%), 9.5% (95% CI: 4.7%-14.4%), 10.4% (95% CI: 0.0%-21.6%), and 12.4% (95% CI: 0%-27.6%), respectively.\n\n**Conclusions:** ERAF may be an optional treatment for anal fistula from the perspective of effectiveness and safety.\n\n**Systematic Review Registration:** PROSPERO: CRD42023451451.", "abstract_zh": "**Aim：** 复杂肛瘘由于其复发和失禁的高风险，给肛肠外科医生带来了重大挑战。直肠内推进皮瓣（ERAF）的保留括约肌手术正逐渐应用于临床。因此，本荟萃分析旨在评估 ERAF 治疗肛瘘的有效性和安全性。\n\n**方法：** 我们检索了 PubMed、Embase、Cochrane 和 Web of Science 数据库，查找 2003 年 8 月 29 日至 2023 年 8 月 29 日发表的相关手稿。在这些研究中，结果包括治愈率、复发率、失禁率和并发症。此外，使用纽卡斯尔-渥太华量表（NOS）和 Cochrane 偏倚风险工具评估了纳入研究的质量。使用卡方检验和 I2 统计量确定异质性。如果观察到显着的异质性（p < 0.05 且 I2 > 50%），则应用随机效应模型。通过排除具有高偏倚风险的研究来进行敏感性分析。\n\n**结果：** 本分析纳入 38 项研究，涉及 1559 名参与者。 ERAF 的合并治愈率和复发率分别为 65.5%（95% 置信区间 (CI)：57.6%-73.4%）和 19.6%（95% CI：14.8%-24.4%）。合并失禁率为 10.6%（95% CI：6.0%-15.1%）。根据亚组分析，ERAF治疗炎症性肠病（IBD）相关瘘管的治愈率、复发率和失禁率分别为53.9%（95% CI：38.1%-69.7%）、32.6%（95% CI：21.3%-43.8%）和2.8%（95% CI：0%-10.6%）。对于无IBD的患者，ERAF的治愈率、复发率和失禁率分别为70.6%（95% CI：63.9%-77.4%）、15.7%（95% CI：9.9%-21.5%）和16.5%（95% CI：8.1%-24.9%）。我们观察到出血、局部感染或脓肿、皮瓣裂开和血肿是常见的并发症，发生率分别为2.2%（95% CI：0%-4.5%）、9.5%（95% CI：4.7%-14.4%）、10.4%（95% CI：0.0%-21.6%）和12.4%（95% CI： 0%-27.6%），分别。\n\n**结论：** 从有效性和安全性的角度来看，ERAF可能是肛瘘的一种可选治疗方法。\n\n**Systematic review registration：** 普洛斯彼罗：CRD42023451451。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39186335/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 26 Aug 2024"}, {"id": "39175475", "title_en": "Efficacy and safety evaluation of mixed nutrition for postoperative esophageal cancer patients in China: a meta-analysis", "title_zh": "中国食管癌术后患者混合营养的疗效和安全性评价：荟萃分析", "authors": "Xiaochuan Liu", "abstract_en": "**Objective:** The purpose of this study was to evaluate the clinical effect of mixed nutrition and parenteral nutrition support on postoperative patients with esophageal cancer.\n\n**Method:** By searching PubMed, Web of Science, Cochrane, CNKI, Wanfang and other databases, all the literatures until March 2024 about the comparison of randomized controlled Trial (RCT) of mixed nutrition and parenteral nutrition support in postoperative patients with esophageal cancer were screened. The inclusion criteria were that the patients were from randomized controlled trials or clinical trials in China, and the patients were all diagnosed with esophageal cancer by pathological biopsy. The exclusion criteria were the literature other than the above, including repeated published literature, non-Chinese and English literature, incomplete or missing analysis data, etc. After two researchers independently screened the literature, extracted the data and evaluated the risk of bias according to the criteria, Meta-analysis was carried out with RevMan 5.4 software.\n\n**Results:** A total of 11 studies were included, including 1216 patients. Meta-analysis showed that, compared with parenteral nutrition, mixed nutrition can improve the levels of transferrin, serum albumin, prealbumin and lymphocyte counts in patients with esophageal cancer after surgery, shorten the time of anal recovery of exhaust, defecation and hospital stay after surgery, and reduce the incidence of pulmonary infection, abdominal distension, incision infection and anastomotic fistula, with statistical significance between the two groups (<i>P</i> < 0.05). The heterogeneity of individual results in this study is relatively high, the analysis comes from clinical heterogeneity, and the publication bias is analyzed through Funnel plot. Taking the incidence of lung infection as an example, the results are evenly distributed on both sides of the Funnel plot, and the publication bias has little impact on the results of the study.\n\n**Conclusion:** Compared with parenteral nutrition, mixed nutrition can improve the prognosis of postoperative patients with esophageal cancer and reduce the incidence of related adverse events.", "abstract_zh": "**目的：** 本研究旨在评价混合营养与肠外营养支持对食管癌术后患者的临床效果。\n\n**Method：** 通过检索PubMed、Web of Science、Cochrane、CNKI、万方等数据库，筛选截至2024年3月关于食管癌术后患者混合营养与肠外营养支持随机对照试验（RCT）比较的文献。纳入标准为患者来自中国的随机对照试验或临床试验，且患者均经病理活检确诊为食管癌。排除标准为上述以外的文献，包括重复发表的文献、非中英文文献、分析数据不完整或缺失等。两名研究者根据标准独立筛选文献、提取数据并评估偏倚风险后，采用RevMan 5.4软件进行Meta分析。\n\n**结果：** 总共纳入 11 项研究，包括 1216 名患者。 Meta分析显示，与肠外营养相比，混合营养可提高食管癌术后患者转铁蛋白、血清白蛋白、前白蛋白和淋巴细胞计数水平，缩短术后肛门恢复排气、排便和住院时间，减少肺部感染、腹胀、切口感染和吻合口瘘的发生率，两组比较差异有统计学意义（<i>P</i> < 0.05）。本研究个体结果异质性较高，分析来自临床异质性，通过漏斗图分析发表偏倚。以肺部感染的发生率为例，结果均匀分布在漏斗图两侧，发表偏倚对研究结果影响不大。\n\n**结论：** 与肠外营养相比，混合营养可以改善食管癌术后患者的预后，减少相关不良事件的发生。", "keywords_zh": "疗效与安全性、荟萃分析、混合营养、肠外营养、食管癌术后", "keywords_en": "efficacy and safety, meta-analysis, mixed nutrition, parenteral nutrition, postoperative esophageal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/39175475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 23 Aug 2024"}, {"id": "39127896", "title_en": "Efficacy and safety of autologous platelet-rich plasma in anal fistula: a systematic review and meta-analysis", "title_zh": "自体富血小板血浆治疗肛瘘的疗效和安全性：系统评价和荟萃分析", "authors": "Chang Ge", "abstract_en": "**Introduction:** This study aimed to determine the efficacy and safety of autologous PRP in anal fistula.\n\n**Methods:** The search was done in electronic databases such as; PubMed, Scopus, Google Scholar, Embase, and Cochrane Library. The outcomes investigated in this study were the rate of improvement, the rate of recurrence, and the rate of fecal incontinence.\n\n**Results:** Cure, incontinence, and recurrence rates were 68% (95% CI, .60-.76), 27% (95% CI, .12-.46), and 18% (95% CI, .12-.26), respectively. The pooled improvement ratio in patients treated with PRP compared to control group was 1.35 times, which was statistically significant (pooled OR=1.35, 95% CI, 1.14-1.60, <i>P</i><001). The pooled recurrence ratio in patients treated with PRP compared to control group was 1.17, which was not statistically significant (pooled OR=1.17, 95% CI, 0.44-3.11).\n\n**Discussion:** Platelet-rich plasma is an effective method of healing people with anal fistula.", "abstract_zh": "**介绍：** 本研究旨在确定自体 PRP 治疗肛瘘的有效性和安全性。\n\n**方法：** 搜索是在电子数据库中完成的，例如： PubMed、Scopus、Google Scholar、Embase 和 Cochrane 图书馆。本研究调查的结果是改善率、复发率和大便失禁率。\n\n**结果：** 治愈率、失禁率和复发率分别为 68% (95% CI, .60-.76)、27% (95% CI, .12-.46) 和 18% (95% CI, .12-.26)。与对照组相比，PRP治疗组患者的汇总改善率为1.35倍，具有统计学意义（汇总OR=1.35，95% CI，1.14-1.60，<i>P</i><001）。与对照组相比，接受 PRP 治疗的患者的汇总复发率为 1.17，无统计学意义（汇总 OR=1.17，95% CI，0.44-3.11）。\n\n**讨论：** 富含血小板的血浆是治疗肛瘘患者的有效方法。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39127896/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sun, 11 Aug 2024"}, {"id": "39118327", "title_en": "The prevalence of pouch fistulas in ulcerative colitis following restorative proctocolectomy: a systematic review and meta-analysis", "title_zh": "恢复性直肠结肠切除术后溃疡性结肠炎储袋瘘的患病率：系统评价和荟萃分析", "authors": "Jonathan P Segal", "abstract_en": "**Background/Aims:** One complication of restorative proctocolectomy with ileo-anal pouch anastomosis is fistula formation in the pouch. Fistulas can be associated with significant morbidity and pouch failure. We conducted a systematic review with meta- analysis to try and understand the prevalence of pouch fistulas in patients with ulcerative colitis following restorative proctocolectomy.\n\n**Methods:** The Embase, Embase Classic, and PubMed databases were searched between January 1979 and April 2022. Studies were included if there were cross-sectional, case-controlled, population-based or cohort studies reporting on prevalence of pouch fistulas in ulcerative colitis. Studies had to report the number of patients with pouch fistulas using either clinical, endoscopic, or radiological diagnosis in an adult population.\n\n**Results:** Thirty-three studies screened met the inclusion criteria. The pooled prevalence of developing at least 1 fistula was 0.05 (95% confidence interval [CI], 0.04-0.07). The pooled prevalence of pouch failure in patients with pouch fistula was found to be 0.24 (95% CI, 0.19-0.30). The pooled prevalence of developing a pouch fistula at 3 years, 5 years and more than 5 years was 0.04 (95% CI, 0.02-0.07), 0.05 (95% CI, 0.02-0.07), and 0.05 (95% CI, 0.02-0.10), respectively.\n\n**Conclusions:** This is the first systematic review and meta-analysis to report the prevalence of pouch fistula. It also provides a pooled prevalence of pouch failure in these patients. These results can help to shape future guidelines, power future studies, and help counsel patients.", "abstract_zh": "**Background/aims：** 恢复性直肠结肠切除术联合回肠肛管储袋吻合术的并发症之一是储袋内形成瘘管。瘘管可能与显着的发病率和造口袋失败有关。我们进行了一项系统回顾和荟萃分析，试图了解恢复性直肠结肠切除术后溃疡性结肠炎患者储袋瘘的患病率。\n\n**方法：** 检索了 1979 年 1 月至 2022 年 4 月期间的 Embase、Embase Classic 和 PubMed 数据库。如果存在报告溃疡性结肠炎储袋瘘患病率的横断面、病例对照、基于人群或队列研究，则纳入研究。研究必须报告成年人群中使用临床、内窥镜或放射学诊断的储袋瘘患者的数量。\n\n**结果：** 筛选的 33 项研究符合纳入标准。至少发生 1 个瘘管的汇总患病率为 0.05（95% 置信区间 [CI]，0.04-0.07）。储袋瘘患者储袋失败的汇总患病率为 0.24（95% CI，0.19-0.30）。 3年、5年和5年以上发生储袋瘘的汇总患病率分别为0.04（95% CI，0.02-0.07）、0.05（95% CI，0.02-0.07）和0.05（95% CI，0.02-0.10）。\n\n**结论：** 这是第一个报告储袋瘘患病率的系统评价和荟萃分析。它还提供了这些患者储袋失败的汇总患病率。这些结果可以帮助制定未来的指导方针，为未来的研究提供动力，并帮助为患者提供咨询。", "keywords_zh": "瘘管、储袋、恢复性直肠结肠切除术、溃疡性结肠炎", "keywords_en": "Fistula, Pouch, Restorative proctocolectomy, Ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/39118327/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 09 Aug 2024"}, {"id": "38910957", "title_en": "Current Status and Role of Artificial Intelligence in Anorectal Diseases and Pelvic Floor Disorders", "title_zh": "人工智能在肛肠疾病和盆底疾病中的现状和作用", "authors": "Jasneet Bhullar", "abstract_en": "**Background:** Anorectal diseases and pelvic floor disorders are prevalent among the general population. Patients may present with overlapping symptoms, delaying diagnosis, and lowering quality of life. Treating physicians encounter numerous challenges attributed to the complex nature of pelvic anatomy, limitations of diagnostic techniques, and lack of available resources. This article is an overview of the current state of artificial intelligence (AI) in tackling the difficulties of managing benign anorectal disorders and pelvic floor disorders.\n\n**Methods:** A systematic literature review was performed according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. We searched the PubMed database to identify all potentially relevant studies published from January 2000 to August 2023. Search queries were built using the following terms: AI, machine learning, deep learning, benign anorectal disease, pelvic floor disorder, fecal incontinence, obstructive defecation, anal fistula, rectal prolapse, and anorectal manometry. Malignant anorectal articles and abstracts were excluded. Data from selected articles were analyzed.\n\n**Results:** 139 articles were found, 15 of which met our inclusion and exclusion criteria. The most common AI module was convolutional neural network. researchers were able to develop AI modules to optimize imaging studies for pelvis, fistula, and abscess anatomy, facilitated anorectal manometry interpretation, and improved high-definition anoscope use. None of the modules were validated in an external cohort.\n\n**Conclusion:** There is potential for AI to enhance the management of pelvic floor and benign anorectal diseases. Ongoing research necessitates the use of multidisciplinary approaches and collaboration between physicians and AI programmers to tackle pressing challenges.", "abstract_zh": "**背景：** 肛门直肠疾病和盆底疾病在普通人群中普遍存在。患者可能会出现重叠的症状，从而延误诊断并降低生活质量。由于盆腔解剖结构的复杂性、诊断技术的局限性以及可用资源的缺乏，治疗医生遇到了许多挑战。本文概述了人工智能 (AI) 在解决良性肛门直肠疾病和盆底疾病管理难题方面的现状。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 共找到 139 篇文章，其中 15 篇符合我们的纳入和排除标准。最常见的人工智能模块是卷积神经网络。研究人员能够开发人工智能模块来优化骨盆、瘘管和脓肿解剖的成像研究，促进肛门直肠测压解释，并改进高清肛门镜的使用。所有模块均未在外部队列中得到验证。\n\n**结论：** 人工智能有潜力加强盆底和良性肛门直肠疾病的管理。正在进行的研究需要使用多学科方法以及医生和人工智能程序员之间的合作来应对紧迫的挑战。", "keywords_zh": "肛肠疾病、人工智能、深度学习、盆底疾病", "keywords_en": "Anorectal disease, Artificial intelligence, Deep learning, Pelvic floor disorder", "link": "https://pubmed.ncbi.nlm.nih.gov/38910957/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 24 Jun 2024"}, {"id": "38296841", "title_en": "The use of core descriptors from the ENiGMA code study in recent literature: a systematic review", "title_zh": "最近文献中 ENiGMA 代码研究的核心描述符的使用：系统回顾", "authors": "Sharon L Stein", "abstract_en": "**Aim:** The heterogeneity in data quality presented in studies regarding Crohn's anal fistula (CAF) limit extrapolation into clinical practice. The ENiGMA collaborators established a core descriptor set to standardize reporting of CAF. The aim of this work was to quantify the use of these descriptors in recent literature.\n\n**Method:** We completed a systematic review of PubMed and the Cochrane Library, extracting publications from the past 10 years specific to the clinical interventions and outcomes of CAF, and reported in line with PRISMA guidance. Each article was assessed for inclusion of ENiGMA descriptors. The median number of descriptors per publication was evaluated along with the overall frequency of each individual descriptor. Use of ENiGMA descriptors was compared between medical and procedural publications.\n\n**Results:** Ninety publications were included. The median number of descriptors was 15 of 37; 16 descriptors were used in over half of the publications while 17 were used in fewer than a third. Descriptors were more frequently used in procedural (n = 16) than medical publications (n = 14) (p = 0.031). In procedural publications, eight descriptors were more frequently used including Faecal incontinence, Number of previous fistula interventions, Presence and severity of anorectal stenosis and Current proctitis. Medical publications were more likely to include Previous response to biological therapy and Duration and type of current course of biological therapy.\n\n**Conclusion:** With many descriptors being used infrequently and variations between medical and procedural literature, the colorectal community should assess the need for all 37 descriptors.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 其中包括九十种出版物。描述符数量中位数为 37 个中的 15 个；超过一半的出版物使用了 16 个描述符，而不到三分之一的出版物使用了 17 个描述符。描述符在程序性出版物 (n = 16) 中的使用频率高于医学出版物 (n = 14) (p = 0.031)。在程序性出版物中，八个描述词被更频繁地使用，包括大便失禁、既往瘘管干预次数、肛门直肠狭窄的存在和严重程度以及当前直肠炎。医学出版物更有可能包括以前对生物治疗的反应以及当前生物治疗过程的持续时间和类型。\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "core descriptor set, crohn’s perianal fistulae, multidisciplinary care, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38296841/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 31 Jan 2024"}, {"id": "38197847", "title_en": "Efficacy and safety of video-assisted anal fistula treatment in anorectal fistula: a meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xuebing Wang", "abstract_en": "**Introduction:** By searching relevant literature, the recurrence rate, complication rate after video-assisted anal fistula treatment (VAAFT), and efficacy and safety of the treatment were analyzed.\n\n**Evidence Acquisition:** Articles that reported the outcomes of VAAFT up to December 2020 were searched in PubMed (Medline) and Cochrane Library, in accordance with the preferred reporting items for systematic review and meta-analysis (PRISMA) screening guidelines. Two researchers independently completed the whole process from screening and inclusion to quality evaluation and bias risk assessment, and the data was included in the RevMan 5.3 software for analysis. The main outcomes were demographic data of patients, detection rate, classification of internal opening of anorectal fistula, postoperative recurrence rate, and incidence of complications.\n\n**Evidence Synthesis:** A total of 10 articles were included (779 patients). The average age of the patients was 44 years old, average operation time was 60 min, and the average follow-up time was 22 months. The ratio of male to female was 2.4:1, the ratio of high anorectal fistula to low anorectal fistula was 6.6:1, the detection rate of internal openings was 98%, the weighted recurrence rate was 24%, and the weighted complication rate was 1%.\n\n**Conclusions:** VAAFT is effective and safe in the treatment of anorectal fistulas.", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence acquisition：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Evidence synthesis：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38197847/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 10 Jan 2024"}, {"id": "38126903", "title_en": "Scoring Indices for Perianal Fistulising Crohn's Disease: A Systematic Review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** In this systematic review we summarise existing scoring indices for assessing disease activity and quality of life in perianal fistulising Crohn's disease [PFCD], and highlight gaps in the literature.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL were searched from August 24, 2022, to identify studies evaluating clinical, radiological, or patient-reported outcome measures [PROMS] in PFCD. The primary objective was to identify all available scoring indices and describe the operating properties of these indices.\n\n**Results:** A total of 53 studies reported on the use of one clinical index [Perianal Disease Activity Index: PDAI], three PROMs, and 10 radiological indices; 25 studies evaluated the operating properties of these indices. The PDAI demonstrated content validity, construct validity, and responsiveness but criterion validity or reliability were not assessed. The Van Assche Index [VAI], modified VAI, and the Magnetic Resonance Index for Assessing Fistulas in Patients with CD [MAGNIFI-CD] were the most studied radiological indices. These indices demonstrated responsiveness and reliability. The VAI and MAGNIFI-CD demonstrated construct validity; criterion and content validity and feasibility have not been assessed. Among the three PROMs, the Crohn's Anal Fistula Quality of Life index demonstrated content and construct validity, inter-observer reliability, and responsiveness; criterion validity, intra-observer reliability, and feasibility have not been assessed for this index.\n\n**Conclusions:** There are no fully valid, reliable, and responsive clinical disease or radiological indices for PFCD. Although the radiological indices demonstrated responsiveness and reliability, well-defined cut-offs for response and remission are lacking. Future research should focus on establishing standardised definitions and thresholds for outcomes.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Outcomes, disease activity indices, operating properties, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38126903/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 21 Dec 2023"}, {"id": "37882975", "title_en": "Comparison of clinical outcomes of anal fistula plug and endoanal advancement flap repair treating the complex anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Jihua Gao", "abstract_en": "Anal fistula (AF) is a common disease with high prevalence and surgical operations are effective treatments in clinical work. There exist many well-known surgical techniques treating complex anal fistula (CAF), however, none is ideal. To compare the superiority of Anal fistula plug (AFP) and Endoanal advancement flap repair (EAFR) for complex anal fistula. We searched worldwide databases including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed from their inception to March 2023. Studies comparing the outcomes of AFP and EAFR were included according to the PICO principles. The indicators of the healing rate, recurrence rate, wound infection rate, and complication rate, et al. were extracted and compared between different surgical methods. 5 RCTS and 7 non-RCTs were included in the meta-analysis with a total of 847 patients (341 patients conducted with AFP and 506 patients with EAFR). By combining the total effect of the 12 articles, we found that there was a statistical difference reporting the healing rate of AFP 48.3% and EAFR 64.4% treating the CAF (OR 0.68, 95% CI 0.30,1.55, P = 0.03), and EAFR has a better healing rate. However, there was no significant difference in terms of the recurrence rate (OR 1.68, 95% CI 0.80,3.54, P = 0.17), the wound infection rate (OR 1.82, 95% CI 0.95,3.52, P = 0.07), and the complication rate (OR 1.06, 95% CI 0.70,1.61, P = 0.77) either in the 12 articles or in the subgroup. The meta-analysis indicated that the EAFR was superior to AFP in terms of the healing rate treating the CAF, however, there were no significant differences between the two groups when it came to the recurrence rate, the wound infection rate, and the complication rate. EAFR might be one initial treatment for the complex cryptoglandular anal fistulas compared with AFP.", "abstract_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula plug, Complex anal fistula, Endoanal advancement flap repair, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37882975/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 26 Oct 2023"}, {"id": "37737881", "title_en": "Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Maosheng Tian", "abstract_en": "**Background:** Considering the difficulty of treating complex anal fistula (CAF), various surgical techniques exist in clinical work. However, none are ideal. Evidence on the efficacy and safety of different surgical treatments is scarce. The authors aimed to compare the outcomes of the 13 surgical techniques and tried to find the best surgical method for treating CAF.\n\n**Materials And Methods:** The authors searched worldwide databases, including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed, from inception to March 2023. All randomized controlled trials comparing the outcomes of 13 surgical techniques were included according to the PICO principles. The indicators of the cure rate, the recurrence rate, the complication rate, the operating time, the postoperative pain on day 1 (VAS), and the postoperative incontinence in month 1 (Wexner) were extracted and analyzed using STATA software 15.1, Review Manager 5.4, and GeMTC14.3.\n\n**Results:** Twenty-eight randomized controlled trials with a total of 2274 patients were included in the network meta-analysis. There was no statistically significant difference in the comparison among any surgical interventions in terms of the cure rate ( P >0.05 Table 2) and recurrence rate ( P >0.05 Table 3). However, in terms of complication rate, fistulectomy was lower than FPS (Median: 0.14; 95% CI: 0.02-0.70) or fistulotomy (Median: 0.09; 95% CI: 0.01-0.55), and fistulotomy was lower than EAFR (Median: 0.24; 95% CI: 0.05-0.84), LIFT (Median: 0.17; 95% CI: 0.02-0.66) or LIFT-EAFR (Median: 0.11; 95% CI: 0.01-0.69) ( P >0.05 Table 4). The surface estimated the advantages and disadvantages under the cumulative ranking (SUCRA). The ranking results indicated that fistulectomy might have the lowest complication rate (SUCRA=7.9%). Because the network results of the operating time, the postoperative pain, and the postoperative incontinence contained no closed loops, the results of their probability ranking could only be referenced, demonstrating that fistulectomy might have the shortest operating time (SUCRA=23.4%), video-assisted modified ligation of the intersphincteric fistula tract (VAMLIFT) might have the lowest postoperative pain on day 1 (VAS) (SUCRA=0.4%) and LIFT might have the lowest postoperative incontinence in month 1(Wexner) (SUCRA=16.2%).\n\n**Conclusion:** Fistulectomy might have the lowest complication rate, which might be the relatively superior surgical technique for treating CAF.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**材料与方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37737881/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Fri, 22 Sep 2023"}, {"id": "37707561", "title_en": "Comparing the efficacy and safety of different thread-drawing surgery method for treating high complex anal fistula: a systematic review and network meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Guofeng Li", "abstract_en": "**Purpose:** To evaluate the effect of different surgical methods in the treatment of high complex anal fistula by systematic review and network meta-analysis.\n\n**Methods:** Randomized controlled trials that met the inclusion criteria in PubMed, Cochrane Library, Embase, Web of Science, CBM, CNKI, WANFANG DATA, VIP were searched from the date of database construction to May 23, 2023.\n\n**Results:** Among the 48 randomized controlled trials (RCTs), 4205 patients were included in the network meta-analysis. Incision thread-drawing counter-drainage procedure (ITCP) in improving the effective rate, the cure rate; reduce the recurrence rate, reduce the anal canal damage has a huge advantage. Directional line-hanging method (DLM) is optimal for safety and postoperative pain relief. Directional line-hanging method (ITSS) protect the optimal anal function after surgery. Sphincter preserving thread-hanging method (SPTM) has a significant advantage in accelerating wound healing time. Main tube incision combined with thread-hanging branch tube drainage (MIBD) is second only to incision thread-drawing counter-drainage procedure (ITCP) in improving effective rate, cure rate, reducing recurrence rate and reduce complication rate.\n\n**Conclusion:** In general, different thread-drawing surgery methods have good clinical effect for the treatment of high complex anal fistula. In general, these methods provide evidence-based medical evidence for early treatment in terms of improving clinical efficacy, relieving anal pain and reducing wound healing time. However, there are differences in the number of included literature studies, and further verification by large-sample, high-quality, multicenter RCTS is still needed in the next stage.", "abstract_zh": "**Purpose：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "高位复杂性肛瘘 网络荟萃分析 系统评价 挂线手术方法", "keywords_en": "High complex anal fistula, Network meta-analysis, Systematic review, Thread-drawing surgery method", "link": "https://pubmed.ncbi.nlm.nih.gov/37707561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 14 Sep 2023"}, {"id": "37359408", "title_en": "Predictors of outcome in cryptoglandular anal fistula according to magnetic resonance imaging: A systematic review", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Amirhosein Naseri", "abstract_en": "**Background And Aims:** Anal fistula (AF) with cryptoglandular origin tends to recur, and multiple risk factors are implicated. Recently, some magnetic resonance imaging (MRI) findings with predictive value for disease outcomes have been proposed. These intrinsic anatomic features include those of the AF and its surrounding structures. This study aims to clarify the prognostic role of MRI in AF.\n\n**Methods:** We performed a systematic search of PubMed, Embase, and EBSCO databases. Two independent reviewers conducted the search and screened the articles. We selected studies that used MRI to assess AF and reported its relationship to disease outcome. We extracted data regarding the study design, type of intervention, outcome, MRI-measured items, and their significance.\n\n**Results:** Out of 1230 retrieved articles, 18 were eligible for final inclusion, and a total of 4026 patients were enrolled in the selected studies. For preoperative MRI, the significant items affecting the outcome were the length of the fistula, horseshoe type, presence of multiple tracts, supralevator extension, and apparent diffusion coefficient (ADC) value. Other studies investigated the healing process using postoperative MRI.\n\n**Conclusion:** This review found that MRI can be useful in the management of AF, both preoperatively and postoperatively. Factors, such as fistula length, horseshoe type, presence of multiple tracts, supralevator extension, and ADC value were found to be significantly associated with treatment outcomes. The presence of the fistula tract and the development of new abscesses on postoperative MRI was found to hinder the healing process. Further studies are needed to confirm these findings.", "abstract_zh": "**Background and aims：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, magnetic resonance imaging, recurrence, treatment outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/37359408/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 26 Jun 2023"}, {"id": "37277090", "title_en": "Neonatal head circumference as a risk factor for obstetric anal sphincter injuries: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Ahmad Azmi Nasution", "abstract_en": "**Objective:** Between 53% and 79% of women will sustain some degree of perineal laceration during vaginal delivery. Third- and fourth-degree perineal lacerations are known as obstetric anal sphincter injuries. Timely diagnosis and prompt treatment of obstetric anal sphincter injuries can help to prevent the development of severe consequences like fecal incontinence, urinary incontinence, and rectovaginal fistula. Neonatal head circumference is routinely measured postpartum but is often not mentioned as a risk factor for obstetric anal sphincter injuries in clinical guidelines. Thus far, no review article on the risk factors for obstetric anal sphincter injuries has discussed the role of neonatal head circumference. This study aimed to review and analyze the relationship between head circumference and the occurrence of obstetric anal sphincter injuries among previous studies to conclude whether head circumference should be recognized as an important risk factor.\n\n**Data Sources:** Through study screening on Google Scholar, PubMed, Scopus, and Science Direct for articles published between 2013 to 2023, followed by assessment of eligibility, this study ended up reviewing 25 studies, 17 of which were included in the meta-analysis.\n\n**Study Eligibility Criteria:** Only studies that reported both the neonatal head circumference and the occurrence of obstetric anal sphincter injuries were included in this review.\n\n**Methods:** The included studies were appraised using the Dartmouth Library risk of bias assessment checklist. Qualitative synthesis was based on the study population, findings, adjusted confounding factors, and suggested causative links in each study. Quantitative synthesis was conducted using calculation and pooling of odds ratios and inverse variance using Review Manager 5.4.1.\n\n**Results:** A statistically significant association between head circumference and obstetric anal sphincter injuries was reported in 21 of 25 studies; 4 studies reported that head circumference was a true independent risk factor. A meta-analysis of the studies that reported neonatal head circumference as a dichotomous categorical variable with a cutoff point of 35±1 cm yielded statistically significant pooled results (odds ratio, 1.92; 95% confidence interval, 1.80-2.04).\n\n**Conclusion:** The risk for obstetric anal sphincter injuries increased as the neonatal head circumference increased-this should be considered in decision-making during labor and postpartum management to attain the best outcome.", "abstract_zh": "**目的：** 53% 至 79% 的女性在阴道分娩期间会出现一定程度的会阴撕裂伤。三度和四度会阴撕裂伤被称为产科肛门括约肌损伤。产科肛门括约肌损伤的及时诊断和及时治疗有助于防止大便失禁、尿失禁和直肠阴道瘘等严重后果的发生。产后常规测量新生儿头围，但临床指南中通常没有将其作为产科肛门括约肌损伤的危险因素提及。迄今为止，还没有关于产科肛门括约肌损伤危险因素的综述文章讨论了新生儿头围的作用。本研究旨在回顾和分析以往研究中头围与产科肛门括约肌损伤发生的关系，以得出头围是否应被视为重要危险因素的结论。\n\n**Data sources：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Study eligibility criteria：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 使用达特茅斯图书馆偏倚风险评估清单对纳入的研究进行评估。定性综合基于研究人群、研究结果、调整后的混杂因素以及每项研究中建议的因果关系。使用 Review Manager 5.4.1 计算并合并优势比和逆方差，进行定量综合。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "delivery, neonatal head circumference, obstetric anal sphincter injuries", "link": "https://pubmed.ncbi.nlm.nih.gov/37277090/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Mon, 05 Jun 2023"}, {"id": "37198039", "title_en": "Endorectal advancement flap compared to ligation of inter-sphincteric fistula tract in the treatment of complex anal fistulas: A meta-analysis of randomized clinical trials", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Steven D Wexner", "abstract_en": "**Background:** Rectal advancement flap and ligation of intersphincteric fistula tract are common procedures for treating complex anal fistula. The present meta-analysis aimed to compare the surgical outcomes of advancement flap and ligation of intersphincteric fistula tract.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review of randomized clinical trials comparing the ligation of intersphincteric fistula tract and advancement flap was conducted. PubMed, Scopus, and Web of Science were searched through January 2023. The risk of bias was assessed using the Risk of Bias 2 tool and certainty of evidence with the Grading of Recommendations Assessment, Development and Evaluation approach. The primary outcomes were healing and recurrence of anal fistulas, and secondary outcomes were operative time, complications, fecal incontinence, and early pain.\n\n**Results:** Three randomized clinical trials (193 patients, 74.6% male) were included. The median follow-up was 19.2 months. Two trials had a low risk of bias, and 1 had some risk of bias. The odds of healing (odds ratio: 1.363, 95% confidence interval: 0.373-4.972, P = .639), recurrence (odds ratio: 0.525, 95% confidence interval: 0.263-1.047, P = .067), and complications (odds ratio: 0.356, 95% confidence interval: 0.085-1.487, P = .157) were similar between the 2 procedures. Ligation of intersphincteric fistula tract was associated with a significantly shorter operation time (weighted mean difference: -4.876, 95% confidence interval: -7.988 to -1.764, P = .002) and less postoperative pain (weighted mean difference: -1.030, 95% confidence interval: -1.418 to -0.641, 0.198, P < .001, I<sup>2</sup> = 3.85%) than advancement flap. Ligation of intersphincteric fistula tract was associated with marginally lower odds of fecal incontinence than advancement flap (odds ratio: 0.27, 95% confidence interval: 0.069-1.06, P = .06).\n\n**Conclusion:** Ligation of intersphincteric fistula tract and advancement flap had similar odds of healing, recurrence, and complications. The odds of fecal incontinence and extent of pain after ligation of intersphincteric fistula tract were lower than after advancement flap.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 对比较括约肌间瘘道结扎和推进皮瓣的随机临床试验进行了系统评价和符合荟萃分析的系统评价的首选报告项目。 PubMed、Scopus 和 Web of Science 的检索时间截至 2023 年 1 月。使用偏倚风险 2 工具评估偏倚风险，并使用建议评估、制定和评估分级方法评估证据的确定性。主要结局是肛瘘的愈合和复发，次要结局是手术时间、并发症、大便失禁和早期疼痛。\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37198039/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 17 May 2023"}, {"id": "37101285", "title_en": "Mesenchymal stem cells transplantation for perianal fistulas: a systematic review and meta-analysis of clinical trials", "title_zh": "间充质干细胞移植治疗肛周瘘：临床试验的系统评价和荟萃分析", "authors": "J L Jiang", "abstract_en": "**Background:** Perianal fistulas, characterised as granulomatous inflammation of fistulas around the anal canal, are associated with significant morbidity resulting in a negative impact on quality of life and a tremendous burden to the healthcare system. Treatment of anal fistulas usually consists of anal surgery; however, results of closure rates are not satisfactory especially with complex perianal fistulas, after which many patients may suffer from anal incontinence. Recently, the administration of mesenchymal stem cells (MSCs) has shown promising efficacy. Herein, we aim to explore whether MSCs are effective for complex perianal fistulas and if they have either short-term, medium-term, long-term or over-long-term efficacy. Additionally, we want to elucidate whether factors such as drug dosage, MSC source, cell type, and disease aetiology influence treatment efficacy. We searched four online databases and analysed data based on information within the clinical trials registry. The outcomes of eligible trials were analysed with Review Manager 5.4.1. Relative risk and related 95% confidence interval were calculated to compare the effect between the MSCs and control groups. In addition, the Cochrane risk of bias tool was applied to evaluate the bias risk of eligible studies. Meta-analyses showed that therapy with MSCs was superior to conventional treatment for complex perianal fistulas in short-, long- and over-long-term follow-up phases. However, there was no statistical difference in treatment efficacy in the medium term between the two methods. Subgroup meta-analyses showed factors including cell type, cell source and cell dosage were superior compared to the control, but there was no significant difference between different experimental groups of those factors. Besides, local MSCs therapy has shown more promising results for fistulas as a result of Crohn's Disease (CD). Although we tend to maintain that MSCs therapy is effective for cryptoglandular fistulas equally, more studies are needed to confirm this conclusion in the future.\n\n**Short Conclusion:** MSCs Transplantation could be a new therapeutic method for complex perianal fistulas of both cryptoglandular and CD origin showing high efficacy in the short-term to over-long-term phases, as well as high efficacy in sustained healing. The difference in cell types, cell sources and cell dosages did not influence MSCs' efficacy.", "abstract_zh": "**背景：** 肛周瘘管的特征是肛管周围瘘管的肉芽肿性炎症，其发病率很高，会对生活质量产生负面影响，并给医疗保健系统带来巨大负担。肛瘘的治疗通常包括肛门手术；然而，闭合率的结果并不令人满意，尤其是对于复杂的肛周瘘，术后许多患者可能会出现肛门失禁。最近，间充质干细胞（MSC）的施用显示出有希望的功效。在此，我们的目的是探讨间充质干细胞治疗复杂性肛周瘘是否有效，以及是否具有短期、中期、长期或超长期疗效。此外，我们希望阐明药物剂量、MSC 来源、细胞类型和疾病病因等因素是否影响治疗效果。我们搜索了四个在线数据库，并根据临床试验登记处的信息分析了数据。使用 Review Manager 5.4.1 分析合格试验的结果。计算相对风险和相关的 95% 置信区间，以比较 MSC 和对照组之间的效果。此外，应用Cochrane偏倚风险工具来评估合格研究的偏倚风险。荟萃分析表明，在短期、长期和超长期随访阶段，间充质干细胞治疗复杂肛周瘘的效果优于传统治疗。然而，两种方法的中期治疗效果没有统计学差异。亚组荟萃分析显示，细胞类型、细胞来源和细胞剂量等因素均优于对照组，但不同实验组之间这些因素没有显着差异。此外，局部间充质干细胞治疗对于克罗恩病（CD）引起的瘘管显示出更有希望的效果。尽管我们倾向于认为间充质干细胞治疗对隐腺瘘同样有效，但未来还需要更多的研究来证实这一结论。\n\n**Short conclusion：** 间充质干细胞移植可能是治疗隐腺和 CD 起源的复杂肛周瘘的新方法，在短期至超长期阶段显示出高效能，并且在持续愈合方面也具有高效能。细胞类型、细胞来源和细胞剂量的差异并不影响MSC的功效。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Clinical trials, Efficacy and safety, Healing rate, Mesenchymal stem cells transplantation, Perianal fistulas, Randomised controlled trial, Systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37101285/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 26 Apr 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "单独引流与引流联合瘘管治疗儿童肛周脓肿的系统回顾和荟萃分析", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "这项非随机研究（NRS）的系统回顾和荟萃分析旨在评估两种类型的手术干预（分别单独引流和引流联合初次瘘管治疗）治疗儿童肛周脓肿（PA）的临床疗效和安全性。在 10 个电子数据库中检索了 1992 年至 2022 年 7 月的研究。包括所有具有可用数据的相关 NRS，这些 NRS 比较了手术引流与或不进行初次瘘管治疗的情况。排除患有导致脓肿形成的基础疾病的患者。纽卡斯尔-渥太华量表用于评估纳入研究的偏倚风险和质量。结果是愈合率、瘘管形成率、大便失禁和伤口愈合持续时间。共有 16 篇文章、1,262 名患者被认为适合最终的荟萃分析。与单独切开引流相比，原发性瘘管治疗具有显着更高的治愈率（比值比 [OR]：5.76，95% 置信区间 [CI]：4.04-8.22）。这种积极的 PA 手术使瘘管形成率降低了 86%（OR：0.14，95% CI：0.06-0.32）。有限的数据显示，接受原发性瘘管治疗的患者对术后大便失禁的影响较小。原发性瘘管治疗在促进儿童PAs愈合率和减少瘘管形成方面显示出更好的临床疗效。现有证据表明这种干预后对肛门功能有轻微影响。", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36905499", "title_en": "A Systematic Review of Epidemiology and Outcomes Associated with Local Surgical and Intersphincteric Ligation Procedures for Complex Cryptoglandular Fistulas", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Suzanne F Cook", "abstract_en": "**Introduction:** This systematic literature review (SLR) assessed incidence/prevalence of cryptoglandular fistulas (CCF) and outcomes associated with local surgical and intersphincteric ligation procedures for CCFs.\n\n**Methods:** Two trained reviewers searched PubMed and Embase for observational studies evaluating the incidence/prevalence of cryptoglandular fistula and clinical outcomes of treatments for CCF after local surgical and intersphincteric ligation procedures for CCF.\n\n**Results:** In total 148 studies met a priori eligibility criteria for all cryptoglandular fistulas and all intervention types. Of those, two assessed incidence/prevalence of cryptoglandular fistulas. Eighteen reported clinical outcomes of surgeries of interest in CCF and were published in the past 5 years. Prevalence was reported as 1.35/10,000 non-Crohn's patients, and 52.6% of non-IBD patients were found to progress from anorectal abscess to fistula over 12 months. Primary healing rates ranged from 57.1% to 100%; recurrence occurred in a range of 4.9-60.7% and failure in 2.8-18.0% of patients. Limited published evidence suggests postoperative fecal incontinence and long-term postoperative pain were rare. Several of the studies were limited by single-center design with small sample sizes and short follow-up durations.\n\n**Discussion:** This SLR summarizes outcomes from specific surgical procedures for the treatment of CCF. Healing rates vary according to procedure and clinical factors. Differences in study design, outcome definition, and length of follow-up prevent direct comparison. Overall, published studies offer a wide range of findings with respect to recurrence. Postsurgical incontinence and long-term postoperative pain were rare in the included studies, but more research is needed to confirm rates of these conditions following CCF treatments.\n\n**Conclusion:** Published studies on the epidemiology of CCF are rare and limited. Outcomes of local surgical and intersphincteric ligation procedures show differing success and failure rates, and more research is needed to compare outcomes across various procedures. (PROSPERO; registration number CRD42020177732).", "abstract_zh": "**介绍：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** 两名训练有素的审稿人在 PubMed 和 Embase 中检索了观察性研究，评估隐腺瘘的发生率/患病率以及 CCF 局部手术和括约肌间结扎手术后 CCF 治疗的临床结果。\n\n**结果：** 总共 148 项研究符合所有隐腺瘘和所有干预类型的先验资格标准。其中，有两项评估了隐腺瘘管的发病率/患病率。过去 5 年发表了 18 份报告，其中涉及 CCF 手术的临床结果。据报道，非克罗恩病患者的患病率为 1.35/10,000，并且发现 52.6% 的非 IBD 患者在 12 个月内从肛门直肠脓肿进展为瘘管。一期愈合率从57.1%到100%；复发率为 4.9-60.7%，失败率为 2.8-18.0%。有限的已发表证据表明术后大便失禁和长期术后疼痛很少见。一些研究受到单中心设计、样本量小和随访时间短的限制。\n\n**讨论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Complex cryptoglandular fistula, Healing, Incontinence, Pain, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/36905499/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36905475", "title_en": "Platelet-rich plasma in the treatment of anal fistula: a systematic review and meta-analysis", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Xiaofei Li", "abstract_en": "**Objective:** To analyse the safety and effectiveness of platelet-rich plasma (PRP) in anal fistula patients.\n\n**Methods:** Online databases including PubMed, Embase, Cochrane Library, and Web of Science were searched from inception to December 5, 2022, for eligible studies about evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. Literature search, screening, data extraction, and quality assessment were carried out by two independent investigators. The overall cure rate, the complete cure rate, the recurrence rate, and the adverse event rate with their 95% confidence intervals (95% CI) were the primary calculation indexes. Subgroup analyses were conducted primarily according to whether PRP was combined with other treatments. Softwares of MedCalc 18.2 and Review Manager 5.3 were used for meta-analysis.\n\n**Results:** A total of 14 studies with 514 patients were included in the meta-analysis. The overall cure rate of 14 studies was 72.11% (95% CI 0.64-0.79). The cure rate of PRP alone was 62.39% (95% CI 0.55-0.69). The combined cure rate of PRP with other treatments was 83.12% (95% CI 0.77-0.88). The cure rate of interventions involving PRP were superior to the cure rate of surgery methods without using PRP significantly in the 4 randomized controlled studies (RR = 1.30, 95% CI 1.10-1.54, p = 0.002). The complete cure rate of the 8 studies was 66.37% (95% CI 0.52-0.79). The recurrence rate of the 12 studies was 14.84% (95% CI 0.08-0.24). The adverse event rate of the 12 studies was 6.31% (95% CI 0.02-0.12).\n\n**Conclusion:** PRP showed favorable safety and effectiveness in the treatment of anal fistula, especially combined with other treatment procedures.", "abstract_zh": "**目的：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** 荟萃分析共纳入 14 项研究，涉及 514 名患者。 14项研究的总体治愈率为72.11%（95% CI 0.64-0.79）。单独 PRP 的治愈率为 62.39% (95% CI 0.55-0.69)。 PRP与其他治疗的综合治愈率为83.12%（95% CI 0.77-0.88）。在4项随机对照研究中，涉及PRP的干预措施的治愈率显着优于不使用PRP的手术方法的治愈率（RR = 1.30，95% CI 1.10-1.54，p = 0.002）。 8项研究的完全治愈率为66.37%（95% CI 0.52-0.79）。 12项研究的复发率为14.84%（95% CI 0.08-0.24）。 12项研究的不良事件发生率为6.31%（95% CI 0.02-0.12）。\n\n**结论：** PRP 在治疗肛瘘方面显示出良好的安全性和有效性，特别是与其他治疗方法联合使用。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Adverse events, Anal fistula, Cure rate, Meta-analysis, PRP, Recurrence rate", "link": "https://pubmed.ncbi.nlm.nih.gov/36905475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "小儿肛周脓肿和肛瘘的最佳初步治疗：系统评价和荟萃分析", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "**背景：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 由于缺乏前瞻性或随机对照研究，无法提出强烈建议。然而，目前基于真实初级管理的研究支持对肛周脓肿和肛瘘的儿科患者进行初步手术干预以预防复发。\n\n**Level of evidence：** 研究类型：系统评价；证据级别：II级。", "keywords_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36474515", "title_en": "Postoperative complications of colectomy and J-pouch with ileostomy versus without ileostomy in children with inflammatory bowel diseases: a systematic review and meta-analysis", "title_zh": "炎症性肠病儿童结肠切除术和 J 型袋回肠造口与不回肠造口的术后并发症：系统评价和荟萃分析", "authors": "Ahmed Nasr", "abstract_en": "**Background:** The efficacy of performing a restorative proctocolectomy and J-pouch ileoanal anastomosis without diverting ileostomy in children with inflammatory bowel disease has been a longstanding debate. A systematic review and meta-analysis is presented comparing the occurrence of postoperative complications in children who underwent either the pouch-anal anastomosis (IPAA) with ileostomy (diverted) versus the undiverted procedure.\n\n**Methods:** Records were sourced from CINAHL, CENTRAL, EMBASE and MEDLINE databases. Studies followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines and compared postoperative complications in pediatric patients diagnosed with inflammatory diseases aged less than 18 years who underwent J-pouch with ileostomy versus without ileostomy. The primary outcome was the occurrence of postoperative leaks, and the secondary outcomes were presence of postoperative small bowel obstruction (SBO), pouchitis, stricture and fistula complications. A random-effects meta-analysis was used.\n\n**Results:** Twenty-three observational studies in the systematic review were included with 658 patients (83% diverted, 17% undiverted). Pooled estimates showed no difference in occurrence of leaks in children who underwent J-pouch/IPAA with ileostomy versus without (odds ratio (OR) 0.54, 95% confidence interval (CI) 0.17 to 1.64, I<sup>2</sup>=16%). There was no difference in the occurrence of SBO, pouchitis or strictures in children who underwent J-pouch/IPAA with ileostomy versus without (SBO: OR 2.27, 95% CI 0.52 to 9.92, I<sup>2</sup>=0%, pouchitis: OR 1.76, 95% CI 0.95 to 3.24, I<sup>2</sup>=0%, strictures: OR 2.72, 95% CI 0.44 to 16.69, I<sup>2</sup>=66%).\n\n**Conclusion:** The meta-analysis did not find differences in the occurrence of complications in pediatric patients who underwent the IPAA with ileostomy procedure versus without ileostomy.", "abstract_zh": "**背景：** 对于患有炎症性肠病的儿童，在不改道回肠造口的情况下进行恢复性直肠结肠切除术和 J 型袋回肠肛门吻合术的疗效一直存在争议。系统评价和荟萃分析比较了接受储袋肛门吻合术 (IPAA) 联合回肠造口术（转行）与未转行手术的儿童术后并发症的发生率。\n\n**方法：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结果：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**结论：** 荟萃分析未发现接受 IPAA 并进行回肠造口术的儿科患者与未进行回肠造口术的儿科患者的并发症发生率存在差异。", "keywords_zh": "青少年健康、教育、循证医学、医学、统计", "keywords_en": "adolescent health, education, evidence-based medicine, medical, statistics", "link": "https://pubmed.ncbi.nlm.nih.gov/36474515/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260828062153&v=2.20.1", "date": "Wed, 07 Dec 2022"}, {"id": "36413086", "title_en": "Gracilis muscle interposition for complex perineal fistulas: A systematic review and meta-analysis of the literature", "title_zh": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "authors": "Steven D Wexner", "abstract_en": "**Aim:** Complex perineal fistulas (CPFs) are among the most challenging problems in colorectal practice. Various procedures have been used to treat CPFs, with none being a panacea. Our study aimed to assess the overall success and complication rates after gracilis muscle interposition in patients with CPF.\n\n**Method:** PubMed, Scopus and Google Scholar databases were systematically searched until January 2022 according to PRISMA 2020 guidelines. Studies including children <18 years or <10 patients were excluded, as well as reviews, duplicate or animal studies, studies with poor documentation (no report of success rate) and non-English text. An open-source, cross-platform software for advanced meta-analysis openMeta [Analyst]™ version 12.11.14 and Cochrane Review Manager 5.4® were used to conduct the meta-analysis of data.\n\n**Results:** Twenty-five studies published between 2002 and 2021 were identified. The studies included 658 patients (409 women). Most patients had rectovaginal (50.7%) or rectourethral fistulas (33.7%). The most common causes of CPF were pelvic surgery (29.4%) and inflammatory bowel disease (25.2%). A history of radiotherapy was reported in approximately 18% of the patients. 498 (75.7%) patients with CPF achieved complete healing after gracilis muscle interposition. The weighted mean rate of success of the gracilis interposition procedure was 79.4% (95% CI 73.8%-85%, I<sup>2</sup>  = 75.3%), the weighted mean short-term complication rate was 25.7% (95% CI 18.1-33.2, I<sup>2</sup>  = 84.1%) and the weighted mean rate for 30-day reoperation was 3.6% (95% CI 1.6-5.6, I<sup>2</sup>  = 42%). The weighted mean rate of fistula recurrence was 16.7% (95% CI 11%-22.3%, I<sup>2</sup>  = 61%).\n\n**Conclusion:** The gracilis muscle interposition technique is a viable treatment option for CPF. Surgeons should be familiar with indications and techniques to offer it as an option for patients. Given the relatively infrequent use of the operation, referral rather than performance of graciloplasty is an acceptable option.", "abstract_zh": "**Aim：** Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n\n**Method：** 根据 PRISMA 2020 指南，对 PubMed、Scopus 和 Google Scholar 数据库进行了系统检索，直至 2022 年 1 月。排除了包括 <18 岁儿童或 <10 名患者的研究，以及综述、重复研究或动物研究、记录较差的研究（没有成功率报告）和非英文文本。用于高级荟萃分析的开源跨平台软件 openMeta [Analyst]™ 12.11.14 版和 Cochrane Review Manager 5.4® 用于进行数据荟萃分析。\n\n**结果：** 确定了 2002 年至 2021 年间发表的 25 项研究。该研究包括 658 名患者（409 名女性）。大多数患者有直肠阴道瘘（50.7%）或直肠尿道瘘（33.7%）。 CPF 最常见的原因是盆腔手术（29.4%）和炎症性肠病（25.2%）。大约 18% 的患者报告有放射治疗史。 498 名（75.7%）CPF 患者在股薄肌介入治疗后实现完全愈合。股薄肌介入手术的加权平均成功率为 79.4%（95% CI 73.8%-85%，I<sup>2</sup> = 75.3%），加权平均短期并发症率为 25.7%（95% CI 18.1-33.2，I<sup>2</sup> = 84.1%），30 天再手术的加权平均率为 3.6%（95% CI 1.6-5.6，I<sup>2</sup> = 42%）。瘘管复发的加权平均率为 16.7%（95% CI 11%-22.3%，I<sup>2</sup> = 61%）。\n\n**结论：** 股薄肌介入技术是 CPF 的可行治疗选择。外科医生应该熟悉适应症和技术，为患者提供它作为一种选择。鉴于该手术的使用相对较少，转诊而不是进行股薄成形术是可以接受的选择。", "keywords_zh": "肛门、复杂会阴、瘘管、股薄肌、股薄肌介入、股薄成形术、直肠尿道、直肠阴道", "keywords_en": "anal, complex perineal, fistula, gracilis, gracilis muscle interposition, graciloplasty, rectourethral, rectovaginal", "link": "https://pubmed.ncbi.nlm.nih.gov/36413086/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8Qd
