ension, and ADC value were found to be significantly associated with treatment outcomes. The presence of the fistula tract and the development of new abscesses on postoperative MRI was found to hinder the healing process. Further studies are needed to confirm these findings.", "abstract_zh": "Anal fistula (AF) with cryptoglandular origin tends to recur, and multiple risk factors are implicated. Recently, some magnetic resonance imaging (MRI) findings with predictive value for disease outcomes have been proposed. These intrinsic anatomic features include those of the AF and its surrounding structures. This study aims to clarify the prognostic role of MRI in AF.\n\nWe performed a systematic search of PubMed, Embase, and EBSCO databases. Two independent reviewers conducted the search and screened the articles. We selected studies that used MRI to assess AF and reported its relationship to disease outcome. We extracted data regarding the study design, type of intervention, outcome, MRI-measured items, and their significance.\n\nOut of 1230 retrieved articles, 18 were eligible for final inclusion, and a total of 4026 patients were enrolled in the selected studies. For preoperative MRI, the significant items affecting the outcome were the length of the fistula, horseshoe type, presence of multiple tracts, supralevator extension, and apparent diffusion coefficient (ADC) value. Other studies investigated the healing process using postoperative MRI.\n\nThis review found that MRI can be useful in the management of AF, both preoperatively and postoperatively. Factors, such as fistula length, horseshoe type, presence of multiple tracts, supralevator extension, and ADC value were found to be significantly associated with treatment outcomes. The presence of the fistula tract and the development of new abscesses on postoperative MRI was found to hinder the healing process. Further studies are needed to confirm these findings.", "keywords_zh": "Anal fistula, magnetic resonance imaging, recurrence, treatment outcomes", "keywords_en": "Anal fistula, magnetic resonance imaging, recurrence, treatment outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/37359408/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 26 Jun 2023"}, {"id": "37277090", "title_en": "Neonatal head circumference as a risk factor for obstetric anal sphincter injuries: a systematic review and meta-analysis", "title_zh": "Neonatal head circumference as a risk factor for obstetric anal sphincter injuries: a systematic review and meta-analysis", "authors": "Ahmad Azmi Nasution", "abstract_en": "**Objective:** Between 53% and 79% of women will sustain some degree of perineal laceration during vaginal delivery. Third- and fourth-degree perineal lacerations are known as obstetric anal sphincter injuries. Timely diagnosis and prompt treatment of obstetric anal sphincter injuries can help to prevent the development of severe consequences like fecal incontinence, urinary incontinence, and rectovaginal fistula. Neonatal head circumference is routinely measured postpartum but is often not mentioned as a risk factor for obstetric anal sphincter injuries in clinical guidelines. Thus far, no review article on the risk factors for obstetric anal sphincter injuries has discussed the role of neonatal head circumference. This study aimed to review and analyze the relationship between head circumference and the occurrence of obstetric anal sphincter injuries among previous studies to conclude whether head circumference should be recognized as an important risk factor.\n\n**Data Sources:** Through study screening on Google Scholar, PubMed, Scopus, and Science Direct for articles published between 2013 to 2023, followed by assessment of eligibility, this study ended up reviewing 25 studies, 17 of which were included in the meta-analysis.\n\n**Study Eligibility Criteria:** Only studies that reported both the neonatal head circumference and the occurrence of obstetric anal sphincter injuries were included in this review.\n\n**Methods:** The included studies were appraised using the Dartmouth Library risk of bias assessment checklist. Qualitative synthesis was based on the study population, findings, adjusted confounding factors, and suggested causative links in each study. Quantitative synthesis was conducted using calculation and pooling of odds ratios and inverse variance using Review Manager 5.4.1.\n\n**Results:** A statistically significant association between head circumference and obstetric anal sphincter injuries was reported in 21 of 25 studies; 4 studies reported that head circumference was a true independent risk factor. A meta-analysis of the studies that reported neonatal head circumference as a dichotomous categorical variable with a cutoff point of 35±1 cm yielded statistically significant pooled results (odds ratio, 1.92; 95% confidence interval, 1.80-2.04).\n\n**Conclusion:** The risk for obstetric anal sphincter injuries increased as the neonatal head circumference increased-this should be considered in decision-making during labor and postpartum management to attain the best outcome.", "abstract_zh": "Between 53% and 79% of women will sustain some degree of perineal laceration during vaginal delivery. Third- and fourth-degree perineal lacerations are known as obstetric anal sphincter injuries. Timely diagnosis and prompt treatment of obstetric anal sphincter injuries can help to prevent the development of severe consequences like fecal incontinence, urinary incontinence, and rectovaginal fistula. Neonatal head circumference is routinely measured postpartum but is often not mentioned as a risk factor for obstetric anal sphincter injuries in clinical guidelines. Thus far, no review article on the risk factors for obstetric anal sphincter injuries has discussed the role of neonatal head circumference. This study aimed to review and analyze the relationship between head circumference and the occurrence of obstetric anal sphincter injuries among previous studies to conclude whether head circumference should be recognized as an important risk factor.\n\nThrough study screening on Google Scholar, PubMed, Scopus, and Science Direct for articles published between 2013 to 2023, followed by assessment of eligibility, this study ended up reviewing 25 studies, 17 of which were included in the meta-analysis.\n\nOnly studies that reported both the neonatal head circumference and the occurrence of obstetric anal sphincter injuries were included in this review.\n\nThe included studies were appraised using the Dartmouth Library risk of bias assessment checklist. Qualitative synthesis was based on the study population, findings, adjusted confounding factors, and suggested causative links in each study. Quantitative synthesis was conducted using calculation and pooling of odds ratios and inverse variance using Review Manager 5.4.1.\n\nA statistically significant association between head circumference and obstetric anal sphincter injuries was reported in 21 of 25 studies; 4 studies reported that head circumference was a true independent risk factor. A meta-analysis of the studies that reported neonatal head circumference as a dichotomous categorical variable with a cutoff point of 35±1 cm yielded statistically significant pooled results (odds ratio, 1.92; 95% confidence interval, 1.80-2.04).\n\nThe risk for obstetric anal sphincter injuries increased as the neonatal head circumference increased-this should be considered in decision-making during labor and postpartum management to attain the best outcome.", "keywords_zh": "delivery, neonatal head circumference, obstetric anal sphincter injuries", "keywords_en": "delivery, neonatal head circumference, obstetric anal sphincter injuries", "link": "https://pubmed.ncbi.nlm.nih.gov/37277090/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 05 Jun 2023"}, {"id": "37213241", "title_en": "Incidence of Rectal Injury After Radical Prostatectomy: A Systematic Review and Meta-analysis", "title_zh": "Incidence of Rectal Injury After Radical Prostatectomy: A Systematic Review and Meta-analysis", "authors": "Vincenzo Ficarra", "abstract_en": "**Context:** Rectal injury (RI) is a dreaded complication after radical prostatectomy (RP), increasing the risk of early postoperative complications, such as bleeding and severe infection/sepsis, and late sequelae, such as a rectourethral fistula (RUF). Considering its traditionally low incidence, uncertainty remains as to predisposing risk factors and management.\n\n**Objective:** To examine the incidence of RI after RP in contemporary series and to propose a pragmatic algorithm for its management.\n\n**Evidence Acquisition:** A systematic literature search was performed using the Medline and Scopus databases. Studies reporting data on RI incidence were selected. Subgroup analyses were conducted to assess the differential incidence by age, surgical approach, salvage RP after radiation therapy, and previous benign prostatic hyperplasia (BPH)-related surgery.\n\n**Evidence Synthesis:** Eighty-eight, mostly retrospective noncomparative, studies were selected. The meta-analysis obtained a pooled RI incidence of 0.58% (95% confidence interval [CI] 0.46-0.73) in contemporary series with significant across-study heterogeneity (I<sup>2</sup> = 100%, <i>p</i> < 0.00001). The highest RI incidence was found in patients undergoing open RP (1.25%; 95% CI 0.66-2.38) and laparoscopic RP (1.25%; 95% CI 0.75-2.08) followed by perineal RP (0.19%; 95% CI 0-276.95) and robotic RP (0.08%; 95% CI 0.02-0.31). Age ≥60 yr (0.56%; 95% CI 0.37-06) and salvage RP after radiation therapy (6.01%; 95% CI 3.99-9.05), but not previous BPH-related surgery (4.08%, 95% CI 0.92-18.20), were also associated with an increased RI incidence. Intraoperative versus postoperative RI detection was associated with a significantly decreased risk of severe postoperative complications (such as sepsis and bleeding) and subsequent formation of a RUF.\n\n**Conclusions:** RI is a rare, but potentially devastating, complication following RP. RI incidence was higher in patients ≥60 yr of age, and in those who underwent open/laparoscopic approach or salvage RP after radiation therapy. Intraoperative RI detection and repair apparently constitute the single most critical step to significantly decrease the risk of major postoperative complications and subsequent RUF formation. Conversely, intraoperatively undetected RI can lead more often to severe infective complications and RUF, the management of which remains poorly standardised and requires complex procedures.\n\n**Patient Summary:** Accidental rectum tear is a rare, but potentially devastating, complication in men undergoing prostate removal for cancer. It occurs more often in patients aged 60 yr or older as well as in those who underwent prostate removal via an open/laparoscopic approach and/or prostate removal after radiation therapy for recurrent disease. Prompt identification and repair of this condition during the initial operation are the key to reduce further complications such as the formation of an abnormal opening between the rectum and the urinary tract.", "abstract_zh": "Rectal injury (RI) is a dreaded complication after radical prostatectomy (RP), increasing the risk of early postoperative complications, such as bleeding and severe infection/sepsis, and late sequelae, such as a rectourethral fistula (RUF). Considering its traditionally low incidence, uncertainty remains as to predisposing risk factors and management.\n\nTo examine the incidence of RI after RP in contemporary series and to propose a pragmatic algorithm for its management.\n\nA systematic literature search was performed using the Medline and Scopus databases. Studies reporting data on RI incidence were selected. Subgroup analyses were conducted to assess the differential incidence by age, surgical approach, salvage RP after radiation therapy, and previous benign prostatic hyperplasia (BPH)-related surgery.\n\nEighty-eight, mostly retrospective noncomparative, studies were selected. The meta-analysis obtained a pooled RI incidence of 0.58% (95% confidence interval [CI] 0.46-0.73) in contemporary series with significant across-study heterogeneity (I<sup>2</sup> = 100%, <i>p</i> < 0.00001). The highest RI incidence was found in patients undergoing open RP (1.25%; 95% CI 0.66-2.38) and laparoscopic RP (1.25%; 95% CI 0.75-2.08) followed by perineal RP (0.19%; 95% CI 0-276.95) and robotic RP (0.08%; 95% CI 0.02-0.31). Age ≥60 yr (0.56%; 95% CI 0.37-06) and salvage RP after radiation therapy (6.01%; 95% CI 3.99-9.05), but not previous BPH-related surgery (4.08%, 95% CI 0.92-18.20), were also associated with an increased RI incidence. Intraoperative versus postoperative RI detection was associated with a significantly decreased risk of severe postoperative complications (such as sepsis and bleeding) and subsequent formation of a RUF.\n\nRI is a rare, but potentially devastating, complication following RP. RI incidence was higher in patients ≥60 yr of age, and in those who underwent open/laparoscopic approach or salvage RP after radiation therapy. Intraoperative RI detection and repair apparently constitute the single most critical step to significantly decrease the risk of major postoperative complications and subsequent RUF formation. Conversely, intraoperatively undetected RI can lead more often to severe infective complications and RUF, the management of which remains poorly standardised and requires complex procedures.\n\nAccidental rectum tear is a rare, but potentially devastating, complication in men undergoing prostate removal for cancer. It occurs more often in patients aged 60 yr or older as well as in those who underwent prostate removal via an open/laparoscopic approach and/or prostate removal after radiation therapy for recurrent disease. Prompt identification and repair of this condition during the initial operation are the key to reduce further complications such as the formation of an abnormal opening between the rectum and the urinary tract.", "keywords_zh": "Complications, Prostate cancer, Radical prostatectomy, Rectal injury, Systematic review", "keywords_en": "Complications, Prostate cancer, Radical prostatectomy, Rectal injury, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/37213241/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 22 May 2023"}, {"id": "37198039", "title_en": "Endorectal advancement flap compared to ligation of inter-sphincteric fistula tract in the treatment of complex anal fistulas: A meta-analysis of randomized clinical trials", "title_zh": "Endorectal advancement flap compared to ligation of inter-sphincteric fistula tract in the treatment of complex anal fistulas: A meta-analysis of randomized clinical trials", "authors": "Steven D Wexner", "abstract_en": "**Background:** Rectal advancement flap and ligation of intersphincteric fistula tract are common procedures for treating complex anal fistula. The present meta-analysis aimed to compare the surgical outcomes of advancement flap and ligation of intersphincteric fistula tract.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review of randomized clinical trials comparing the ligation of intersphincteric fistula tract and advancement flap was conducted. PubMed, Scopus, and Web of Science were searched through January 2023. The risk of bias was assessed using the Risk of Bias 2 tool and certainty of evidence with the Grading of Recommendations Assessment, Development and Evaluation approach. The primary outcomes were healing and recurrence of anal fistulas, and secondary outcomes were operative time, complications, fecal incontinence, and early pain.\n\n**Results:** Three randomized clinical trials (193 patients, 74.6% male) were included. The median follow-up was 19.2 months. Two trials had a low risk of bias, and 1 had some risk of bias. The odds of healing (odds ratio: 1.363, 95% confidence interval: 0.373-4.972, P = .639), recurrence (odds ratio: 0.525, 95% confidence interval: 0.263-1.047, P = .067), and complications (odds ratio: 0.356, 95% confidence interval: 0.085-1.487, P = .157) were similar between the 2 procedures. Ligation of intersphincteric fistula tract was associated with a significantly shorter operation time (weighted mean difference: -4.876, 95% confidence interval: -7.988 to -1.764, P = .002) and less postoperative pain (weighted mean difference: -1.030, 95% confidence interval: -1.418 to -0.641, 0.198, P < .001, I<sup>2</sup> = 3.85%) than advancement flap. Ligation of intersphincteric fistula tract was associated with marginally lower odds of fecal incontinence than advancement flap (odds ratio: 0.27, 95% confidence interval: 0.069-1.06, P = .06).\n\n**Conclusion:** Ligation of intersphincteric fistula tract and advancement flap had similar odds of healing, recurrence, and complications. The odds of fecal incontinence and extent of pain after ligation of intersphincteric fistula tract were lower than after advancement flap.", "abstract_zh": "Rectal advancement flap and ligation of intersphincteric fistula tract are common procedures for treating complex anal fistula. The present meta-analysis aimed to compare the surgical outcomes of advancement flap and ligation of intersphincteric fistula tract.\n\nA Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review of randomized clinical trials comparing the ligation of intersphincteric fistula tract and advancement flap was conducted. PubMed, Scopus, and Web of Science were searched through January 2023. The risk of bias was assessed using the Risk of Bias 2 tool and certainty of evidence with the Grading of Recommendations Assessment, Development and Evaluation approach. The primary outcomes were healing and recurrence of anal fistulas, and secondary outcomes were operative time, complications, fecal incontinence, and early pain.\n\nThree randomized clinical trials (193 patients, 74.6% male) were included. The median follow-up was 19.2 months. Two trials had a low risk of bias, and 1 had some risk of bias. The odds of healing (odds ratio: 1.363, 95% confidence interval: 0.373-4.972, P = .639), recurrence (odds ratio: 0.525, 95% confidence interval: 0.263-1.047, P = .067), and complications (odds ratio: 0.356, 95% confidence interval: 0.085-1.487, P = .157) were similar between the 2 procedures. Ligation of intersphincteric fistula tract was associated with a significantly shorter operation time (weighted mean difference: -4.876, 95% confidence interval: -7.988 to -1.764, P = .002) and less postoperative pain (weighted mean difference: -1.030, 95% confidence interval: -1.418 to -0.641, 0.198, P < .001, I<sup>2</sup> = 3.85%) than advancement flap. Ligation of intersphincteric fistula tract was associated with marginally lower odds of fecal incontinence than advancement flap (odds ratio: 0.27, 95% confidence interval: 0.069-1.06, P = .06).\n\nLigation of intersphincteric fistula tract and advancement flap had similar odds of healing, recurrence, and complications. The odds of fecal incontinence and extent of pain after ligation of intersphincteric fistula tract were lower than after advancement flap.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37198039/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 17 May 2023"}, {"id": "37101285", "title_en": "Mesenchymal stem cells transplantation for perianal fistulas: a systematic review and meta-analysis of clinical trials", "title_zh": "Mesenchymal stem cells transplantation for perianal fistulas: a systematic review and meta-analysis of clinical trials", "authors": "J L Jiang", "abstract_en": "**Background:** Perianal fistulas, characterised as granulomatous inflammation of fistulas around the anal canal, are associated with significant morbidity resulting in a negative impact on quality of life and a tremendous burden to the healthcare system. Treatment of anal fistulas usually consists of anal surgery; however, results of closure rates are not satisfactory especially with complex perianal fistulas, after which many patients may suffer from anal incontinence. Recently, the administration of mesenchymal stem cells (MSCs) has shown promising efficacy. Herein, we aim to explore whether MSCs are effective for complex perianal fistulas and if they have either short-term, medium-term, long-term or over-long-term efficacy. Additionally, we want to elucidate whether factors such as drug dosage, MSC source, cell type, and disease aetiology influence treatment efficacy. We searched four online databases and analysed data based on information within the clinical trials registry. The outcomes of eligible trials were analysed with Review Manager 5.4.1. Relative risk and related 95% confidence interval were calculated to compare the effect between the MSCs and control groups. In addition, the Cochrane risk of bias tool was applied to evaluate the bias risk of eligible studies. Meta-analyses showed that therapy with MSCs was superior to conventional treatment for complex perianal fistulas in short-, long- and over-long-term follow-up phases. However, there was no statistical difference in treatment efficacy in the medium term between the two methods. Subgroup meta-analyses showed factors including cell type, cell source and cell dosage were superior compared to the control, but there was no significant difference between different experimental groups of those factors. Besides, local MSCs therapy has shown more promising results for fistulas as a result of Crohn's Disease (CD). Although we tend to maintain that MSCs therapy is effective for cryptoglandular fistulas equally, more studies are needed to confirm this conclusion in the future.\n\n**Short Conclusion:** MSCs Transplantation could be a new therapeutic method for complex perianal fistulas of both cryptoglandular and CD origin showing high efficacy in the short-term to over-long-term phases, as well as high efficacy in sustained healing. The difference in cell types, cell sources and cell dosages did not influence MSCs' efficacy.", "abstract_zh": "Perianal fistulas, characterised as granulomatous inflammation of fistulas around the anal canal, are associated with significant morbidity resulting in a negative impact on quality of life and a tremendous burden to the healthcare system. Treatment of anal fistulas usually consists of anal surgery; however, results of closure rates are not satisfactory especially with complex perianal fistulas, after which many patients may suffer from anal incontinence. Recently, the administration of mesenchymal stem cells (MSCs) has shown promising efficacy. Herein, we aim to explore whether MSCs are effective for complex perianal fistulas and if they have either short-term, medium-term, long-term or over-long-term efficacy. Additionally, we want to elucidate whether factors such as drug dosage, MSC source, cell type, and disease aetiology influence treatment efficacy. We searched four online databases and analysed data based on information within the clinical trials registry. The outcomes of eligible trials were analysed with Review Manager 5.4.1. Relative risk and related 95% confidence interval were calculated to compare the effect between the MSCs and control groups. In addition, the Cochrane risk of bias tool was applied to evaluate the bias risk of eligible studies. Meta-analyses showed that therapy with MSCs was superior to conventional treatment for complex perianal fistulas in short-, long- and over-long-term follow-up phases. However, there was no statistical difference in treatment efficacy in the medium term between the two methods. Subgroup meta-analyses showed factors including cell type, cell source and cell dosage were superior compared to the control, but there was no significant difference between different experimental groups of those factors. Besides, local MSCs therapy has shown more promising results for fistulas as a result of Crohn's Disease (CD). Although we tend to maintain that MSCs therapy is effective for cryptoglandular fistulas equally, more studies are needed to confirm this conclusion in the future.\n\nMSCs Transplantation could be a new therapeutic method for complex perianal fistulas of both cryptoglandular and CD origin showing high efficacy in the short-term to over-long-term phases, as well as high efficacy in sustained healing. The difference in cell types, cell sources and cell dosages did not influence MSCs' efficacy.", "keywords_zh": "Clinical trials, Efficacy and safety, Healing rate, Mesenchymal stem cells transplantation, Perianal fistulas, Randomised controlled trial, Systematic review and meta-analysis", "keywords_en": "Clinical trials, Efficacy and safety, Healing rate, Mesenchymal stem cells transplantation, Perianal fistulas, Randomised controlled trial, Systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37101285/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 26 Apr 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36905499", "title_en": "A Systematic Review of Epidemiology and Outcomes Associated with Local Surgical and Intersphincteric Ligation Procedures for Complex Cryptoglandular Fistulas", "title_zh": "A Systematic Review of Epidemiology and Outcomes Associated with Local Surgical and Intersphincteric Ligation Procedures for Complex Cryptoglandular Fistulas", "authors": "Suzanne F Cook", "abstract_en": "**Introduction:** This systematic literature review (SLR) assessed incidence/prevalence of cryptoglandular fistulas (CCF) and outcomes associated with local surgical and intersphincteric ligation procedures for CCFs.\n\n**Methods:** Two trained reviewers searched PubMed and Embase for observational studies evaluating the incidence/prevalence of cryptoglandular fistula and clinical outcomes of treatments for CCF after local surgical and intersphincteric ligation procedures for CCF.\n\n**Results:** In total 148 studies met a priori eligibility criteria for all cryptoglandular fistulas and all intervention types. Of those, two assessed incidence/prevalence of cryptoglandular fistulas. Eighteen reported clinical outcomes of surgeries of interest in CCF and were published in the past 5 years. Prevalence was reported as 1.35/10,000 non-Crohn's patients, and 52.6% of non-IBD patients were found to progress from anorectal abscess to fistula over 12 months. Primary healing rates ranged from 57.1% to 100%; recurrence occurred in a range of 4.9-60.7% and failure in 2.8-18.0% of patients. Limited published evidence suggests postoperative fecal incontinence and long-term postoperative pain were rare. Several of the studies were limited by single-center design with small sample sizes and short follow-up durations.\n\n**Discussion:** This SLR summarizes outcomes from specific surgical procedures for the treatment of CCF. Healing rates vary according to procedure and clinical factors. Differences in study design, outcome definition, and length of follow-up prevent direct comparison. Overall, published studies offer a wide range of findings with respect to recurrence. Postsurgical incontinence and long-term postoperative pain were rare in the included studies, but more research is needed to confirm rates of these conditions following CCF treatments.\n\n**Conclusion:** Published studies on the epidemiology of CCF are rare and limited. Outcomes of local surgical and intersphincteric ligation procedures show differing success and failure rates, and more research is needed to compare outcomes across various procedures. (PROSPERO; registration number CRD42020177732).", "abstract_zh": "This systematic literature review (SLR) assessed incidence/prevalence of cryptoglandular fistulas (CCF) and outcomes associated with local surgical and intersphincteric ligation procedures for CCFs.\n\nTwo trained reviewers searched PubMed and Embase for observational studies evaluating the incidence/prevalence of cryptoglandular fistula and clinical outcomes of treatments for CCF after local surgical and intersphincteric ligation procedures for CCF.\n\nIn total 148 studies met a priori eligibility criteria for all cryptoglandular fistulas and all intervention types. Of those, two assessed incidence/prevalence of cryptoglandular fistulas. Eighteen reported clinical outcomes of surgeries of interest in CCF and were published in the past 5 years. Prevalence was reported as 1.35/10,000 non-Crohn's patients, and 52.6% of non-IBD patients were found to progress from anorectal abscess to fistula over 12 months. Primary healing rates ranged from 57.1% to 100%; recurrence occurred in a range of 4.9-60.7% and failure in 2.8-18.0% of patients. Limited published evidence suggests postoperative fecal incontinence and long-term postoperative pain were rare. Several of the studies were limited by single-center design with small sample sizes and short follow-up durations.\n\nThis SLR summarizes outcomes from specific surgical procedures for the treatment of CCF. Healing rates vary according to procedure and clinical factors. Differences in study design, outcome definition, and length of follow-up prevent direct comparison. Overall, published studies offer a wide range of findings with respect to recurrence. Postsurgical incontinence and long-term postoperative pain were rare in the included studies, but more research is needed to confirm rates of these conditions following CCF treatments.\n\nPublished studies on the epidemiology of CCF are rare and limited. Outcomes of local surgical and intersphincteric ligation procedures show differing success and failure rates, and more research is needed to compare outcomes across various procedures. (PROSPERO; registration number CRD42020177732).", "keywords_zh": "Anal fistula, Complex cryptoglandular fistula, Healing, Incontinence, Pain, Recurrence", "keywords_en": "Anal fistula, Complex cryptoglandular fistula, Healing, Incontinence, Pain, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/36905499/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36905475", "title_en": "Platelet-rich plasma in the treatment of anal fistula: a systematic review and meta-analysis", "title_zh": "Platelet-rich plasma in the treatment of anal fistula: a systematic review and meta-analysis", "authors": "Xiaofei Li", "abstract_en": "**Objective:** To analyse the safety and effectiveness of platelet-rich plasma (PRP) in anal fistula patients.\n\n**Methods:** Online databases including PubMed, Embase, Cochrane Library, and Web of Science were searched from inception to December 5, 2022, for eligible studies about evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. Literature search, screening, data extraction, and quality assessment were carried out by two independent investigators. The overall cure rate, the complete cure rate, the recurrence rate, and the adverse event rate with their 95% confidence intervals (95% CI) were the primary calculation indexes. Subgroup analyses were conducted primarily according to whether PRP was combined with other treatments. Softwares of MedCalc 18.2 and Review Manager 5.3 were used for meta-analysis.\n\n**Results:** A total of 14 studies with 514 patients were included in the meta-analysis. The overall cure rate of 14 studies was 72.11% (95% CI 0.64-0.79). The cure rate of PRP alone was 62.39% (95% CI 0.55-0.69). The combined cure rate of PRP with other treatments was 83.12% (95% CI 0.77-0.88). The cure rate of interventions involving PRP were superior to the cure rate of surgery methods without using PRP significantly in the 4 randomized controlled studies (RR = 1.30, 95% CI 1.10-1.54, p = 0.002). The complete cure rate of the 8 studies was 66.37% (95% CI 0.52-0.79). The recurrence rate of the 12 studies was 14.84% (95% CI 0.08-0.24). The adverse event rate of the 12 studies was 6.31% (95% CI 0.02-0.12).\n\n**Conclusion:** PRP showed favorable safety and effectiveness in the treatment of anal fistula, especially combined with other treatment procedures.", "abstract_zh": "To analyse the safety and effectiveness of platelet-rich plasma (PRP) in anal fistula patients.\n\nOnline databases including PubMed, Embase, Cochrane Library, and Web of Science were searched from inception to December 5, 2022, for eligible studies about evaluating the efficacy of platelet-rich plasma (PRP) in treating anal fistula. Literature search, screening, data extraction, and quality assessment were carried out by two independent investigators. The overall cure rate, the complete cure rate, the recurrence rate, and the adverse event rate with their 95% confidence intervals (95% CI) were the primary calculation indexes. Subgroup analyses were conducted primarily according to whether PRP was combined with other treatments. Softwares of MedCalc 18.2 and Review Manager 5.3 were used for meta-analysis.\n\nA total of 14 studies with 514 patients were included in the meta-analysis. The overall cure rate of 14 studies was 72.11% (95% CI 0.64-0.79). The cure rate of PRP alone was 62.39% (95% CI 0.55-0.69). The combined cure rate of PRP with other treatments was 83.12% (95% CI 0.77-0.88). The cure rate of interventions involving PRP were superior to the cure rate of surgery methods without using PRP significantly in the 4 randomized controlled studies (RR = 1.30, 95% CI 1.10-1.54, p = 0.002). The complete cure rate of the 8 studies was 66.37% (95% CI 0.52-0.79). The recurrence rate of the 12 studies was 14.84% (95% CI 0.08-0.24). The adverse event rate of the 12 studies was 6.31% (95% CI 0.02-0.12).\n\nPRP showed favorable safety and effectiveness in the treatment of anal fistula, especially combined with other treatment procedures.", "keywords_zh": "Adverse events, Anal fistula, Cure rate, Meta-analysis, PRP, Recurrence rate", "keywords_en": "Adverse events, Anal fistula, Cure rate, Meta-analysis, PRP, Recurrence rate", "link": "https://pubmed.ncbi.nlm.nih.gov/36905475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 11 Mar 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\nUsing PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\nThirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\nStrong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\nType of study: Systemic review; Evidence level: Level II.", "keywords_zh": "Anal fistula, Pediatric, Perianal abscess, Primary management", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36847868", "title_en": "Conservative surgery versus colorectal resection for endometriosis with rectal involvement: a systematic review and meta-analysis of surgical and long-term outcomes", "title_zh": "Conservative surgery versus colorectal resection for endometriosis with rectal involvement: a systematic review and meta-analysis of surgical and long-term outcomes", "authors": "Cillian Clancy", "abstract_en": "**Purpose:** The optimal surgical approach for removal of colorectal endometrial deposits is unclear. Shaving and discoid excision of colorectal deposits allow organ preservation but risk recurrence with associated functional issues and re-operation. Formal resection risks potential higher complications but may be associated with lower recurrence rates. This meta-analysis compares peri-operative and long-term outcomes between conservative surgery (shaving and disc excision) versus formal colorectal resection.\n\n**Methods:** The study was registered with PROSPERO. A systematic search was performed on PubMed and EMBASE databases. All comparative studies examining surgical outcomes in patients that underwent conservative surgery versus colorectal resection for rectal endometrial deposits were included. The two main groups (conservative versus resection) were compared in three main blocks of variables including group comparability, operative outcomes and long-term outcomes.\n\n**Results:** Seventeen studies including 2861 patients were analysed with patients subdivided by procedure: colorectal resection (n = 1389), shaving (n = 703) and discoid excision (n = 742). When formal colorectal resection was compared to conservative surgery there was lower risk of recurrence (p = 0.002), comparable functional outcomes (minor LARS, p = 0.30, major LARS, p = 0.54), similar rates of postoperative leaks (p = 0.22), pelvic abscesses (p = 0.18) and rectovaginal fistula (p = 0.92). On subgroup analysis, shaving had the highest recurrence rate (p = 0.0007), however a lower rate of stoma formation (p < 0.00001) and rectal stenosis (p = 0.01). Discoid excision and formal resection were comparable.\n\n**Conclusion:** Colorectal resection has a significantly lower recurrence rate compared to shaving. There is no difference in complications or functional outcomes between discoid excision and formal resection and both have similar recurrence rates.", "abstract_zh": "The optimal surgical approach for removal of colorectal endometrial deposits is unclear. Shaving and discoid excision of colorectal deposits allow organ preservation but risk recurrence with associated functional issues and re-operation. Formal resection risks potential higher complications but may be associated with lower recurrence rates. This meta-analysis compares peri-operative and long-term outcomes between conservative surgery (shaving and disc excision) versus formal colorectal resection.\n\nThe study was registered with PROSPERO. A systematic search was performed on PubMed and EMBASE databases. All comparative studies examining surgical outcomes in patients that underwent conservative surgery versus colorectal resection for rectal endometrial deposits were included. The two main groups (conservative versus resection) were compared in three main blocks of variables including group comparability, operative outcomes and long-term outcomes.\n\nSeventeen studies including 2861 patients were analysed with patients subdivided by procedure: colorectal resection (n = 1389), shaving (n = 703) and discoid excision (n = 742). When formal colorectal resection was compared to conservative surgery there was lower risk of recurrence (p = 0.002), comparable functional outcomes (minor LARS, p = 0.30, major LARS, p = 0.54), similar rates of postoperative leaks (p = 0.22), pelvic abscesses (p = 0.18) and rectovaginal fistula (p = 0.92). On subgroup analysis, shaving had the highest recurrence rate (p = 0.0007), however a lower rate of stoma formation (p < 0.00001) and rectal stenosis (p = 0.01). Discoid excision and formal resection were comparable.\n\nColorectal resection has a significantly lower recurrence rate compared to shaving. There is no difference in complications or functional outcomes between discoid excision and formal resection and both have similar recurrence rates.", "keywords_zh": "Colorectal surgery, Endometriosis, Meta-analysis, Surgery, Surgery outcomes", "keywords_en": "Colorectal surgery, Endometriosis, Meta-analysis, Surgery, Surgery outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/36847868/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 27 Feb 2023"}, {"id": "36740680", "title_en": "Surgical management of complex perianal fistula revisited in a systematic review: a critical view of available scientific evidence", "title_zh": "Surgical management of complex perianal fistula revisited in a systematic review: a critical view of available scientific evidence", "authors": "F de la Portilla", "abstract_en": "**Background:** Treating complex perianal fistulas in Crohn's disease patients remains a challenge. Classical surgical treatments for Crohn's disease fistulas have been extrapolated from cryptoglandular fistulas treatment, which have different etiology, and this might interfere with its effectiveness, in addition, they increase fecal incontinence risk. Recently, new surgical techniques with support from biological approaches, like stem cells, have been developed to preserve the function of the sphincter. We have performed a systematic literature review to compare the results of these different techniques in the treatment of Crohn's or Cryptoglandular fistula.\n\n**Methods:** PubMed, EMBASE, Database of Abstracts of Reviews of Effectiveness, Cochrane Central Register of Controlled Trials were searched systematically for relevant articles. We included randomized controlled trials and observational studies that referred to humans, were written in English, included adults 18+ years old, and were published during the 10-year period from 2/01/2010 to 2/29/2020. Evidence level was assigned as designated by the Scottish Intercollegiate Guidelines Network.\n\n**Results:** Of the 577 citations screened, a total of 79 were ultimately included in our review. In Crohn's disease patients, classical techniques such as primarily seton, Ligation of Intersphincteric Fistula Tracks, or lay open, healing rates were approximately 50-60%, while in cryptoglandular fistula were around, 70-80% for setons or flaps. In Crohn's disease patients, new surgical techniques using derivatives of adipose tissue reported healing rates exceeding 70%, stem cells-treated patients achieved higher combined remission versus controls (56.3% vs 38.6%, p = 0.010), mesenchymal cells reported a healing rate of 80% at week 12. In patients with cryptoglandular fistulas, a healing rate of 70% using derivatives of adipose tissue or platelets was achieved, and a healing rate of 80% was achieved using laser technology. Fecal incontinence was improved after the use of autologous platelet growth factors and Nitinol Clips.\n\n**Conclusion:** New surgical techniques showed better healing rates in Crohn's disease patients than classical techniques, which have better results in cryptoglandular fistula than in Crohn's disease. Healing rates for complex cryptoglandular fistulas were similar between the classic and new techniques, being the new techniques less invasive; the incontinence rate improved with the current techniques.", "abstract_zh": "Treating complex perianal fistulas in Crohn's disease patients remains a challenge. Classical surgical treatments for Crohn's disease fistulas have been extrapolated from cryptoglandular fistulas treatment, which have different etiology, and this might interfere with its effectiveness, in addition, they increase fecal incontinence risk. Recently, new surgical techniques with support from biological approaches, like stem cells, have been developed to preserve the function of the sphincter. We have performed a systematic literature review to compare the results of these different techniques in the treatment of Crohn's or Cryptoglandular fistula.\n\nPubMed, EMBASE, Database of Abstracts of Reviews of Effectiveness, Cochrane Central Register of Controlled Trials were searched systematically for relevant articles. We included randomized controlled trials and observational studies that referred to humans, were written in English, included adults 18+ years old, and were published during the 10-year period from 2/01/2010 to 2/29/2020. Evidence level was assigned as designated by the Scottish Intercollegiate Guidelines Network.\n\nOf the 577 citations screened, a total of 79 were ultimately included in our review. In Crohn's disease patients, classical techniques such as primarily seton, Ligation of Intersphincteric Fistula Tracks, or lay open, healing rates were approximately 50-60%, while in cryptoglandular fistula were around, 70-80% for setons or flaps. In Crohn's disease patients, new surgical techniques using derivatives of adipose tissue reported healing rates exceeding 70%, stem cells-treated patients achieved higher combined remission versus controls (56.3% vs 38.6%, p = 0.010), mesenchymal cells reported a healing rate of 80% at week 12. In patients with cryptoglandular fistulas, a healing rate of 70% using derivatives of adipose tissue or platelets was achieved, and a healing rate of 80% was achieved using laser technology. Fecal incontinence was improved after the use of autologous platelet growth factors and Nitinol Clips.\n\nNew surgical techniques showed better healing rates in Crohn's disease patients than classical techniques, which have better results in cryptoglandular fistula than in Crohn's disease. Healing rates for complex cryptoglandular fistulas were similar between the classic and new techniques, being the new techniques less invasive; the incontinence rate improved with the current techniques.", "keywords_zh": "Complex perianal fistula, Crohn’s disease, Cryptoglandular fistula, Surgery", "keywords_en": "Complex perianal fistula, Crohn’s disease, Cryptoglandular fistula, Surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/36740680/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sun, 05 Feb 2023"}, {"id": "36735766", "title_en": "Gracilis Muscle Interposition for the Treatment of Rectovaginal Fistula: A Systematic Review and Pooled Analysis", "title_zh": "Gracilis Muscle Interposition for the Treatment of Rectovaginal Fistula: A Systematic Review and Pooled Analysis", "authors": "Tracy L Hull", "abstract_en": "**Background:** A rectovaginal fistula is a debilitating condition that often severely impacts quality of life. Despite many treatment options available, the best surgical treatment is far from being established, and many patients will undergo several procedures before fistula closure is achieved. Gracilis muscle interposition, which is the transposition of the gracilis muscle into the rectovaginal septum, is an option for complex and persistent fistulas, but literature on the subject is scarce, mainly consisting of small case series.\n\n**Objective:** This study aimed to assess the success rate of gracilis muscle interposition for the surgical treatment of rectovaginal fistula.\n\n**Data Sources:** MEDLINE, Embase, Cochrane Library, and Web of Science.\n\n**Study Selection:** Studies comprising at least 5 patients who underwent gracilis muscle interposition for rectovaginal fistula were included. No date or language restrictions was applied.\n\n**Intervention:** Gracilis muscle interposition.\n\n**Main Outcome Measures:** The primary outcome is the fistula closure rate (%). Other domains analyzed are stoma closure rate, postoperative complications, quality of life, fecal continence, and sexual function.\n\n**Results:** Twenty studies were included for a total of 384 patients. The pooled fistula closure rate for gracilis muscle interposition was 64% (95% CI, 53%-74%; range, 33%-100%). Risk factors for failure were smoking, underlying Crohn's disease, and more than 2 previous repairs, whereas stoma formation was associated with improved outcomes. Postoperative complications ranged from 0% to 37%, mostly related to surgical site occurrences at the harvest site and perineal area. No deaths occurred. Gracilis muscle interposition improved quality of life and fecal continence, but impairment of sexual function was common.\n\n**Limitations:** Most of the included studies were small case series.\n\n**Conclusions:** Gracilis muscle interposition is a safe and moderately effective treatment that could be taken into consideration as second- or third-line therapy for recurrent rectovaginal fistula.\n\n**Registration No:** CRD42022319621.", "abstract_zh": "A rectovaginal fistula is a debilitating condition that often severely impacts quality of life. Despite many treatment options available, the best surgical treatment is far from being established, and many patients will undergo several procedures before fistula closure is achieved. Gracilis muscle interposition, which is the transposition of the gracilis muscle into the rectovaginal septum, is an option for complex and persistent fistulas, but literature on the subject is scarce, mainly consisting of small case series.\n\nThis study aimed to assess the success rate of gracilis muscle interposition for the surgical treatment of rectovaginal fistula.\n\nMEDLINE, Embase, Cochrane Library, and Web of Science.\n\nStudies comprising at least 5 patients who underwent gracilis muscle interposition for rectovaginal fistula were included. No date or language restrictions was applied.\n\nGracilis muscle interposition.\n\nThe primary outcome is the fistula closure rate (%). Other domains analyzed are stoma closure rate, postoperative complications, quality of life, fecal continence, and sexual function.\n\nTwenty studies were included for a total of 384 patients. The pooled fistula closure rate for gracilis muscle interposition was 64% (95% CI, 53%-74%; range, 33%-100%). Risk factors for failure were smoking, underlying Crohn's disease, and more than 2 previous repairs, whereas stoma formation was associated with improved outcomes. Postoperative complications ranged from 0% to 37%, mostly related to surgical site occurrences at the harvest site and perineal area. No deaths occurred. Gracilis muscle interposition improved quality of life and fecal continence, but impairment of sexual function was common.\n\nMost of the included studies were small case series.\n\nGracilis muscle interposition is a safe and moderately effective treatment that could be taken into consideration as second- or third-line therapy for recurrent rectovaginal fistula.\n\nCRD42022319621.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/36735766/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 03 Feb 2023"}, {"id": "36658773", "title_en": "Autologous fat graft injections for the treatment of perianal fistulas in Crohn's disease: a systematic review and single-arm meta-analysis", "title_zh": "Autologous fat graft injections for the treatment of perianal fistulas in Crohn's disease: a systematic review and single-arm meta-analysis", "authors": "SVHM IBD Collaborative Group", "abstract_en": "**Background:** Crohn's perianal fistulas are often refractory to standard management. Fat graft injections are hypothesised to improve fistula healing rates. We evaluated the treatment efficacy of fat graft injections for Crohn's perianal fistulas in a systematic review (PRISMA).\n\n**Methods:** We completed database searches of MEDLINE (Ovid), Embase, and PubMed. All studies published in English in full text or abstract, from January 2001 to August 2021, evaluating fat graft injections for Crohn's perianal fistulas were selected. Included randomized controlled trials, single-arm intervention trials, cohort studies, and case series; excluded single case reports. Primary outcome was pooled clinical healing, defined as non-draining treated fistulas, or closure, defined as closure of treated fistulas. Secondary outcomes were clinical healing, clinical closure, radiologic response, and adverse events.\n\n**Results:** Of 1258 publications identified, 891 articles were assessed for eligibility, and 107 relevant for manuscript review. Forty-nine patients received fat graft injections for Crohn's perianal fistulas across four single-arm intervention trials. Clinical healing or closure was achieved in 74% in a pooled single-arm meta-analysis (95% confidence interval: 57%, 85%), with moderate heterogeneity between studies. Clinical healing was achieved in 20% and 60% at 3 and 12 months, respectively. Clinical closure was achieved in 83% at 6 months. Variable parameters were used to define radiologic response, with success rates from 20% to 67%. Minimal adverse events were reported.\n\n**Conclusion:** Fat graft injections show promise as a novel treatment for Crohn's perianal fistulas in this systematic review and meta-analysis. Assessment in controlled matched studies is warranted.", "abstract_zh": "Crohn's perianal fistulas are often refractory to standard management. Fat graft injections are hypothesised to improve fistula healing rates. We evaluated the treatment efficacy of fat graft injections for Crohn's perianal fistulas in a systematic review (PRISMA).\n\nWe completed database searches of MEDLINE (Ovid), Embase, and PubMed. All studies published in English in full text or abstract, from January 2001 to August 2021, evaluating fat graft injections for Crohn's perianal fistulas were selected. Included randomized controlled trials, single-arm intervention trials, cohort studies, and case series; excluded single case reports. Primary outcome was pooled clinical healing, defined as non-draining treated fistulas, or closure, defined as closure of treated fistulas. Secondary outcomes were clinical healing, clinical closure, radiologic response, and adverse events.\n\nOf 1258 publications identified, 891 articles were assessed for eligibility, and 107 relevant for manuscript review. Forty-nine patients received fat graft injections for Crohn's perianal fistulas across four single-arm intervention trials. Clinical healing or closure was achieved in 74% in a pooled single-arm meta-analysis (95% confidence interval: 57%, 85%), with moderate heterogeneity between studies. Clinical healing was achieved in 20% and 60% at 3 and 12 months, respectively. Clinical closure was achieved in 83% at 6 months. Variable parameters were used to define radiologic response, with success rates from 20% to 67%. Minimal adverse events were reported.\n\nFat graft injections show promise as a novel treatment for Crohn's perianal fistulas in this systematic review and meta-analysis. Assessment in controlled matched studies is warranted.", "keywords_zh": "Crohn's disease, fat graft, metaanalysis, perianal fistula, systematic review", "keywords_en": "Crohn's disease, fat graft, metaanalysis, perianal fistula, systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/36658773/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 20 Jan 2023"}, {"id": "36474515", "title_en": "Postoperative complications of colectomy and J-pouch with ileostomy versus without ileostomy in children with inflammatory bowel diseases: a systematic review and meta-analysis", "title_zh": "Postoperative complications of colectomy and J-pouch with ileostomy versus without ileostomy in children with inflammatory bowel diseases: a systematic review and meta-analysis", "authors": "Ahmed Nasr", "abstract_en": "**Background:** The efficacy of performing a restorative proctocolectomy and J-pouch ileoanal anastomosis without diverting ileostomy in children with inflammatory bowel disease has been a longstanding debate. A systematic review and meta-analysis is presented comparing the occurrence of postoperative complications in children who underwent either the pouch-anal anastomosis (IPAA) with ileostomy (diverted) versus the undiverted procedure.\n\n**Methods:** Records were sourced from CINAHL, CENTRAL, EMBASE and MEDLINE databases. Studies followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines and compared postoperative complications in pediatric patients diagnosed with inflammatory diseases aged less than 18 years who underwent J-pouch with ileostomy versus without ileostomy. The primary outcome was the occurrence of postoperative leaks, and the secondary outcomes were presence of postoperative small bowel obstruction (SBO), pouchitis, stricture and fistula complications. A random-effects meta-analysis was used.\n\n**Results:** Twenty-three observational studies in the systematic review were included with 658 patients (83% diverted, 17% undiverted). Pooled estimates showed no difference in occurrence of leaks in children who underwent J-pouch/IPAA with ileostomy versus without (odds ratio (OR) 0.54, 95% confidence interval (CI) 0.17 to 1.64, I<sup>2</sup>=16%). There was no difference in the occurrence of SBO, pouchitis or strictures in children who underwent J-pouch/IPAA with ileostomy versus without (SBO: OR 2.27, 95% CI 0.52 to 9.92, I<sup>2</sup>=0%, pouchitis: OR 1.76, 95% CI 0.95 to 3.24, I<sup>2</sup>=0%, strictures: OR 2.72, 95% CI 0.44 to 16.69, I<sup>2</sup>=66%).\n\n**Conclusion:** The meta-analysis did not find differences in the occurrence of complications in pediatric patients who underwent the IPAA with ileostomy procedure versus without ileostomy.", "abstract_zh": "The efficacy of performing a restorative proctocolectomy and J-pouch ileoanal anastomosis without diverting ileostomy in children with inflammatory bowel disease has been a longstanding debate. A systematic review and meta-analysis is presented comparing the occurrence of postoperative complications in children who underwent either the pouch-anal anastomosis (IPAA) with ileostomy (diverted) versus the undiverted procedure.\n\nRecords were sourced from CINAHL, CENTRAL, EMBASE and MEDLINE databases. Studies followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines and compared postoperative complications in pediatric patients diagnosed with inflammatory diseases aged less than 18 years who underwent J-pouch with ileostomy versus without ileostomy. The primary outcome was the occurrence of postoperative leaks, and the secondary outcomes were presence of postoperative small bowel obstruction (SBO), pouchitis, stricture and fistula complications. A random-effects meta-analysis was used.\n\nTwenty-three observational studies in the systematic review were included with 658 patients (83% diverted, 17% undiverted). Pooled estimates showed no difference in occurrence of leaks in children who underwent J-pouch/IPAA with ileostomy versus without (odds ratio (OR) 0.54, 95% confidence interval (CI) 0.17 to 1.64, I<sup>2</sup>=16%). There was no difference in the occurrence of SBO, pouchitis or strictures in children who underwent J-pouch/IPAA with ileostomy versus without (SBO: OR 2.27, 95% CI 0.52 to 9.92, I<sup>2</sup>=0%, pouchitis: OR 1.76, 95% CI 0.95 to 3.24, I<sup>2</sup>=0%, strictures: OR 2.72, 95% CI 0.44 to 16.69, I<sup>2</sup>=66%).\n\nThe meta-analysis did not find differences in the occurrence of complications in pediatric patients who underwent the IPAA with ileostomy procedure versus without ileostomy.", "keywords_zh": "adolescent health, education, evidence-based medicine, medical, statistics", "keywords_en": "adolescent health, education, evidence-based medicine, medical, statistics", "link": "https://pubmed.ncbi.nlm.nih.gov/36474515/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 07 Dec 2022"}, {"id": "36413086", "title_en": "Gracilis muscle interposition for complex perineal fistulas: A systematic review and meta-analysis of the literature", "title_zh": "Gracilis muscle interposition for complex perineal fistulas: A systematic review and meta-analysis of the literature", "authors": "Steven D Wexner", "abstract_en": "**Aim:** Complex perineal fistulas (CPFs) are among the most challenging problems in colorectal practice. Various procedures have been used to treat CPFs, with none being a panacea. Our study aimed to assess the overall success and complication rates after gracilis muscle interposition in patients with CPF.\n\n**Method:** PubMed, Scopus and Google Scholar databases were systematically searched until January 2022 according to PRISMA 2020 guidelines. Studies including children <18 years or <10 patients were excluded, as well as reviews, duplicate or animal studies, studies with poor documentation (no report of success rate) and non-English text. An open-source, cross-platform software for advanced meta-analysis openMeta [Analyst]™ version 12.11.14 and Cochrane Review Manager 5.4® were used to conduct the meta-analysis of data.\n\n**Results:** Twenty-five studies published between 2002 and 2021 were identified. The studies included 658 patients (409 women). Most patients had rectovaginal (50.7%) or rectourethral fistulas (33.7%). The most common causes of CPF were pelvic surgery (29.4%) and inflammatory bowel disease (25.2%). A history of radiotherapy was reported in approximately 18% of the patients. 498 (75.7%) patients with CPF achieved complete healing after gracilis muscle interposition. The weighted mean rate of success of the gracilis interposition procedure was 79.4% (95% CI 73.8%-85%, I<sup>2</sup>  = 75.3%), the weighted mean short-term complication rate was 25.7% (95% CI 18.1-33.2, I<sup>2</sup>  = 84.1%) and the weighted mean rate for 30-day reoperation was 3.6% (95% CI 1.6-5.6, I<sup>2</sup>  = 42%). The weighted mean rate of fistula recurrence was 16.7% (95% CI 11%-22.3%, I<sup>2</sup>  = 61%).\n\n**Conclusion:** The gracilis muscle interposition technique is a viable treatment option for CPF. Surgeons should be familiar with indications and techniques to offer it as an option for patients. Given the relatively infrequent use of the operation, referral rather than performance of graciloplasty is an acceptable option.", "abstract_zh": "Complex perineal fistulas (CPFs) are among the most challenging problems in colorectal practice. Various procedures have been used to treat CPFs, with none being a panacea. Our study aimed to assess the overall success and complication rates after gracilis muscle interposition in patients with CPF.\n\nPubMed, Scopus and Google Scholar databases were systematically searched until January 2022 according to PRISMA 2020 guidelines. Studies including children <18 years or <10 patients were excluded, as well as reviews, duplicate or animal studies, studies with poor documentation (no report of success rate) and non-English text. An open-source, cross-platform software for advanced meta-analysis openMeta [Analyst]™ version 12.11.14 and Cochrane Review Manager 5.4® were used to conduct the meta-analysis of data.\n\nTwenty-five studies published between 2002 and 2021 were identified. The studies included 658 patients (409 women). Most patients had rectovaginal (50.7%) or rectourethral fistulas (33.7%). The most common causes of CPF were pelvic surgery (29.4%) and inflammatory bowel disease (25.2%). A history of radiotherapy was reported in approximately 18% of the patients. 498 (75.7%) patients with CPF achieved complete healing after gracilis muscle interposition. The weighted mean rate of success of the gracilis interposition procedure was 79.4% (95% CI 73.8%-85%, I<sup>2</sup>  = 75.3%), the weighted mean short-term complication rate was 25.7% (95% CI 18.1-33.2, I<sup>2</sup>  = 84.1%) and the weighted mean rate for 30-day reoperation was 3.6% (95% CI 1.6-5.6, I<sup>2</sup>  = 42%). The weighted mean rate of fistula recurrence was 16.7% (95% CI 11%-22.3%, I<sup>2</sup>  = 61%).\n\nThe gracilis muscle interposition technique is a viable treatment option for CPF. Surgeons should be familiar with indications and techniques to offer it as an option for patients. Given the relatively infrequent use of the operation, referral rather than performance of graciloplasty is an acceptable option.", "keywords_zh": "anal, complex perineal, fistula, gracilis, gracilis muscle interposition, graciloplasty, rectourethral, rectovaginal", "keywords_en": "anal, complex perineal, fistula, gracilis, gracilis muscle interposition, graciloplasty, rectourethral, rectovaginal", "link": "https://pubmed.ncbi.nlm.nih.gov/36413086/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 22 Nov 2022"}], "痔疮": [{"id": "42726324", "title_en": "Non-linear predictive modeling and comprehensive meta-analysis of rectal temperature in Santa Ines sheep: a systematic review of thermal challenges and biometerological trends", "title_zh": "Non-linear predictive modeling and comprehensive meta-analysis of rectal temperature in Santa Ines sheep: a systematic review of thermal challenges and biometerological trends", "authors": "Tadayuki Yanagi Junior", "abstract_en": "A systematic and bibliometric review, combined with a meta-analysis, was used to adjust an equation for estimating the physiological responses of Santa Inês sheep subjected to different thermal challenges. The systematic review compiled data on physiological responses and the thermal environment, which were then used in the meta-analysis to adjust regression models. The bibliometric analysis mapped the relationships among studies, highlighting their usefulness in interpreting research findings...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42726324/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Fri, 11 Sep 2026"}, {"id": "42715146", "title_en": "HARMONIC SCALPEL HEMORRHOIDECTOMY VERSUS STAPLED HEMORRHOIDOPEXY IN GRADE III / IV HEMORRHOIDS: SYSTEMATIC REVIEW AND META-ANALYSIS OF RANDOMIZED CONTROLLED TRIALS", "title_zh": "HARMONIC SCALPEL HEMORRHOIDECTOMY VERSUS STAPLED HEMORRHOIDOPEXY IN GRADE III / IV HEMORRHOIDS: SYSTEMATIC REVIEW AND META-ANALYSIS OF RANDOMIZED CONTROLLED TRIALS", "authors": "Ugo Grossi", "abstract_en": "CONCLUSION: HSH and SH are comparable in the treatment of grade III/IV hemorrhoids, analyzing postoperative bleeding, fecal incontinence, operative time, hospital stay and urinary retention. However, SH presented less severe and overall pain, showing better results in the short term and HSH presented lower recurrence, highlighting as a better outcome in the long term.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42715146/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Wed, 09 Sep 2026"}, {"id": "42699804", "title_en": "Hemorrhoids and Rectal Cancer: A Systematic Review of Clinical Overlap, Diagnostic Misclassification, and Early Detection Strategies for Primary Care", "title_zh": "Hemorrhoids and Rectal Cancer: A Systematic Review of Clinical Overlap, Diagnostic Misclassification, and Early Detection Strategies for Primary Care", "authors": "Yangfeng Huang", "abstract_en": "Hemorrhoidal disease (HD) and rectal cancer (RC) are common anorectal disorders with overlapping clinical symptoms, including rectal bleeding, altered bowel habits, and anorectal discomfort. This similarity leads to frequent misdiagnosis of RC as HD, and early diagnosis is essential for improving survival and quality of life in patients with RC. This systematic review aimed to summarize overlapping features, analyze causes of misdiagnosis, and review advances in early detection to provide...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42699804/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sat, 05 Sep 2026"}, {"id": "42684859", "title_en": "Delays in Diagnosis of Early-Onset Colorectal Cancer Across the United States: A Systematic Review", "title_zh": "Delays in Diagnosis of Early-Onset Colorectal Cancer Across the United States: A Systematic Review", "authors": "Pasithorn A Suwanabol", "abstract_en": "CONCLUSIONS: Diagnostic delays in early-onset colorectal cancer are difficult to confine to a single interval and require system-level interventions to support earlier detection. More qualitative inquiry is necessary to identify effective interventions, including interviews that elicit patient and provider experiences of barriers.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42684859/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Wed, 02 Sep 2026"}, {"id": "42594997", "title_en": "Comparison of the outcomes of ileal pouch-anal anastomosis and ileorectal anastomosis for patients with familial adenomatous polyposis: a systematic review and meta-analysis", "title_zh": "Comparison of the outcomes of ileal pouch-anal anastomosis and ileorectal anastomosis for patients with familial adenomatous polyposis: a systematic review and meta-analysis", "authors": "Ka-Wai Tam", "abstract_en": "CONCLUSION: IPAA is associated with greater long-term oncologic protection but worse bowel function and a higher desmoid tumor risk compared with IRA. These findings support individualized procedure selection based on surveillance feasibility to balance functional trade-offs, perioperative risks, and durability.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42594997/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Thu, 13 Aug 2026"}, {"id": "42534720", "title_en": "A Systematic Review of Post-surgical Adverse Events Related to Hem-O-Lok Clips: A Commonly Used Device With Potential Complications", "title_zh": "A Systematic Review of Post-surgical Adverse Events Related to Hem-O-Lok Clips: A Commonly Used Device With Potential Complications", "authors": "Palanivelraju Gopalakrishnan", "abstract_en
