national Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "abstract_zh": "Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\nThe study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\nA radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\nThis international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "keywords_zh": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "keywords_en": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40210078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 10 Apr 2025"}, {"id": "40205247", "title_en": "Systematic review and meta-analysis of the efficacy and safety of stem cell treatment of anal fistulas", "title_zh": "Systematic review and meta-analysis of the efficacy and safety of stem cell treatment of anal fistulas", "authors": "S D Wexner", "abstract_en": "**Background:** Since anal fistulas can be challenging to treat; numerous innovative treatments have been proposed, including stem cell therapy. This systematic review aimed to assess pooled rates of fistula healing and adverse events associated with stem cell treatment.\n\n**Methods:** In this PRISMA-compliant systematic review we searched PubMed and Scopus for observational and randomized studies reporting outcomes of stem cell treatment for anal fistulas. The main outcome measures were successful healing and adverse effects of stem cell therapy.\n\n**Results:** In total, 43 studies incorporating 1160 patients (53.6% male) were included. Underlying fistula etiologies were Crohn's disease (30 studies) and cryptoglandular disease (12 studies). The main origin of stem cells was from adipose tissue (34 studies) or bone marrow (6 studies). The median follow-up duration was 12 months. The combined overall pooled healing rate was 58.1% (95% confidence interval (CI) 51.5-64.7%). The pooled healing rate for Crohn's fistulas was 60.4% (95% CI 54.7-66.2%) with adipose-derived stem cells and 63.6% (95% CI 49.4-77.7%) with bone-marrow-derived cells. The pooled healing rate for cryptoglandular fistulas was 53.8% (95% CI 35.5-72.2%) with adipose-derived stem cells. The pooled complication rate was 37.3% (95% CI 27.1-47.5%). Stem cells were associated with higher odds of anal fistula healing (odds ratio (OR): 1.81, p = 0.003) and similar odds of complications (OR: 1, p = 0.986) compared with controls.\n\n**Conclusions:** Stem cell treatment of anal fistulas was associated with promising results. The healing rate in Crohn's anal fistulas was higher than in cryptoglandular fistulas. Bone-marrow-derived stem cells were associated with marginally better outcomes than were adipose-derived cells. This finding suggests that the autoimmune inflammatory etiology of Crohn's disease may respond better to autologous myoblasts than does the infectious etiology of cryptoglandular fistulas.", "abstract_zh": "Since anal fistulas can be challenging to treat; numerous innovative treatments have been proposed, including stem cell therapy. This systematic review aimed to assess pooled rates of fistula healing and adverse events associated with stem cell treatment.\n\nIn this PRISMA-compliant systematic review we searched PubMed and Scopus for observational and randomized studies reporting outcomes of stem cell treatment for anal fistulas. The main outcome measures were successful healing and adverse effects of stem cell therapy.\n\nIn total, 43 studies incorporating 1160 patients (53.6% male) were included. Underlying fistula etiologies were Crohn's disease (30 studies) and cryptoglandular disease (12 studies). The main origin of stem cells was from adipose tissue (34 studies) or bone marrow (6 studies). The median follow-up duration was 12 months. The combined overall pooled healing rate was 58.1% (95% confidence interval (CI) 51.5-64.7%). The pooled healing rate for Crohn's fistulas was 60.4% (95% CI 54.7-66.2%) with adipose-derived stem cells and 63.6% (95% CI 49.4-77.7%) with bone-marrow-derived cells. The pooled healing rate for cryptoglandular fistulas was 53.8% (95% CI 35.5-72.2%) with adipose-derived stem cells. The pooled complication rate was 37.3% (95% CI 27.1-47.5%). Stem cells were associated with higher odds of anal fistula healing (odds ratio (OR): 1.81, p = 0.003) and similar odds of complications (OR: 1, p = 0.986) compared with controls.\n\nStem cell treatment of anal fistulas was associated with promising results. The healing rate in Crohn's anal fistulas was higher than in cryptoglandular fistulas. Bone-marrow-derived stem cells were associated with marginally better outcomes than were adipose-derived cells. This finding suggests that the autoimmune inflammatory etiology of Crohn's disease may respond better to autologous myoblasts than does the infectious etiology of cryptoglandular fistulas.", "keywords_zh": "Adverse effects, Anal fistulas, Healing, Stem cells, Systematic review", "keywords_en": "Adverse effects, Anal fistulas, Healing, Stem cells, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/40205247/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 09 Apr 2025"}, {"id": "40192869", "title_en": "Sphincter repair procedures may be favored in the treatment of obstetrical recto-vaginal fistula: a systematic review of the literature and meta-analysis", "title_zh": "Sphincter repair procedures may be favored in the treatment of obstetrical recto-vaginal fistula: a systematic review of the literature and meta-analysis", "authors": "J F Hamel", "abstract_en": "**Background:** The management of obstetric rectovaginal fistula (RVF) is challenging for the surgeon. The best surgical procedure to repair RVFs, specifically after obstetric anal sphincter injury, has not been extensively studied. The objective was to compare the success of the different procedures performed to repair obstetric RVF.\n\n**Methods:** The literature search was carried out on PubMed<sup>®</sup> and Web of Science<sup>®</sup> from database inception until 31 December 2022. Selection criteria were: (1) patients with a diagnosis of obstetric-related RVF; (2) patients treated surgically with no restriction concerning the considered surgery; (3) clinical trials or epidemiological studies. Meta-analysis was conducted considering the network meta-analysis framework to allow studying the relative value of each treatment mentioned in the selected articles.\n\n**Results:** The quantitative synthesis included 32 studies (18 retrospective and 14 prospective) accounting for 595 patients. The quality of these studies was low because of the lack of prospective randomization. Nineteen procedure types were described and assessed. Most patients (n = 180) underwent endorectal advancement flap (ERAF) followed by excision and layered closure (ELC) (n = 213) and Musset procedure (n = 65). A diverting stoma was performed in 66/132 patients. Only 13 studies reported the functional results of the procedure. In the meta-analysis, the Musset procedure (OR = 4.29; 95% CI: 1.18-16.14), transvaginal ELC (OR = 11.84; 95% CI: 2.18-91.80) and transperineal ELC (OR = 3.56; 95% CI: 1.26-10) significantly improved the anatomical results compared to ERAF.\n\n**Conclusions:** A further randomized controlled trial in the literature assessing ERAF and sphincteroplasty to compare the anatomical results, functional results and morbidity of this treatment is needed.\n\n**Registration:** PROSPERO CRD42023447875.", "abstract_zh": "The management of obstetric rectovaginal fistula (RVF) is challenging for the surgeon. The best surgical procedure to repair RVFs, specifically after obstetric anal sphincter injury, has not been extensively studied. The objective was to compare the success of the different procedures performed to repair obstetric RVF.\n\nThe literature search was carried out on PubMed<sup>®</sup> and Web of Science<sup>®</sup> from database inception until 31 December 2022. Selection criteria were: (1) patients with a diagnosis of obstetric-related RVF; (2) patients treated surgically with no restriction concerning the considered surgery; (3) clinical trials or epidemiological studies. Meta-analysis was conducted considering the network meta-analysis framework to allow studying the relative value of each treatment mentioned in the selected articles.\n\nThe quantitative synthesis included 32 studies (18 retrospective and 14 prospective) accounting for 595 patients. The quality of these studies was low because of the lack of prospective randomization. Nineteen procedure types were described and assessed. Most patients (n = 180) underwent endorectal advancement flap (ERAF) followed by excision and layered closure (ELC) (n = 213) and Musset procedure (n = 65). A diverting stoma was performed in 66/132 patients. Only 13 studies reported the functional results of the procedure. In the meta-analysis, the Musset procedure (OR = 4.29; 95% CI: 1.18-16.14), transvaginal ELC (OR = 11.84; 95% CI: 2.18-91.80) and transperineal ELC (OR = 3.56; 95% CI: 1.26-10) significantly improved the anatomical results compared to ERAF.\n\nA further randomized controlled trial in the literature assessing ERAF and sphincteroplasty to compare the anatomical results, functional results and morbidity of this treatment is needed.\n\nPROSPERO CRD42023447875.", "keywords_zh": "Anovaginal fistula, Obstetric, Rectovaginal fistula, Repair", "keywords_en": "Anovaginal fistula, Obstetric, Rectovaginal fistula, Repair", "link": "https://pubmed.ncbi.nlm.nih.gov/40192869/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 07 Apr 2025"}, {"id": "40185644", "title_en": "Oncological and functional outcomes after sacrectomy for colorectal cancer: A systematic review", "title_zh": "Oncological and functional outcomes after sacrectomy for colorectal cancer: A systematic review", "authors": "Gabriëlle H van Ramshorst", "abstract_en": "**Aim:** Worldwide, of all cancers, colorectal cancer has the fourth highest rate of mortality. Curative treatment for locally advanced or recurrent rectal cancer can require extended resections with sacrectomy, but this sugery can have major consequences for patients. The aim of this study was to investigate the oncological and functional outcomes after sacrectomy in patients with colorectal cancer.\n\n**Method:** The protocol was registered in (PROSPERO), the international prospective register of systematic reviews. PubMed, Embase, The Cochrane Library, Scopus and Google Scholar were searched using a predetermined search strategy. Article selection, quality of evidence [Grading of Recommendation, Assessment, Development and Evaluation (GRADE)] and risk of bias [The Risk Of Bias In Non-randomized Studies-of Interventions (ROBINS-I)] were assessed by two independent reviewers. Studies reporting on sacrectomy for colorectal cancer were included. Oncological and functional outcomes after sacrectomy for colorectal cancer were the primary outcomes.\n\n**Results:** Forty-six articles with 1687 patients (1115 men; 506 women) were included. Median follow-up was 31.4 months. Mean 30-day mortality was 1.1%. After R0 resection, overall survival was achieved in 86.2%, 68.0% and 42.1% patients, and disease-free survival was achieved in 75.0%, 51.0% and 43.0% patients, respectively, after 1, 3 and 5 years. Survival rates were lower after R1 or R2 resection. Most patients reported elimination of or significantly reduced pain after surgery, and 82.2% were able to walk independently, without the use of assistive devices. More patients were dependent on walking-assist devices after high sacrectomy than after low sacrectomy. The most commonly reported bowel dysfunctions were bowel obstruction (22.3%) and fistula (4.6%). Bladder dysfunction was mainly reported as incontinence (8.3%) and neurogenic bladder (23.3%). No study included quality of life as an outcome.\n\n**Conclusions:** The mortality was limited, and the morbidity rates were in concordance with published literature. The results suggest that R0 resection has higher survival rates than R1/R2 resections. Both short- and long-term functional outcomes could have major impact on a patient's quality of life. Heterogeneity was high, and neither comparative analyses nor meta-analysis could be performed.", "abstract_zh": "Worldwide, of all cancers, colorectal cancer has the fourth highest rate of mortality. Curative treatment for locally advanced or recurrent rectal cancer can require extended resections with sacrectomy, but this sugery can have major consequences for patients. The aim of this study was to investigate the oncological and functional outcomes after sacrectomy in patients with colorectal cancer.\n\nThe protocol was registered in (PROSPERO), the international prospective register of systematic reviews. PubMed, Embase, The Cochrane Library, Scopus and Google Scholar were searched using a predetermined search strategy. Article selection, quality of evidence [Grading of Recommendation, Assessment, Development and Evaluation (GRADE)] and risk of bias [The Risk Of Bias In Non-randomized Studies-of Interventions (ROBINS-I)] were assessed by two independent reviewers. Studies reporting on sacrectomy for colorectal cancer were included. Oncological and functional outcomes after sacrectomy for colorectal cancer were the primary outcomes.\n\nForty-six articles with 1687 patients (1115 men; 506 women) were included. Median follow-up was 31.4 months. Mean 30-day mortality was 1.1%. After R0 resection, overall survival was achieved in 86.2%, 68.0% and 42.1% patients, and disease-free survival was achieved in 75.0%, 51.0% and 43.0% patients, respectively, after 1, 3 and 5 years. Survival rates were lower after R1 or R2 resection. Most patients reported elimination of or significantly reduced pain after surgery, and 82.2% were able to walk independently, without the use of assistive devices. More patients were dependent on walking-assist devices after high sacrectomy than after low sacrectomy. The most commonly reported bowel dysfunctions were bowel obstruction (22.3%) and fistula (4.6%). Bladder dysfunction was mainly reported as incontinence (8.3%) and neurogenic bladder (23.3%). No study included quality of life as an outcome.\n\nThe mortality was limited, and the morbidity rates were in concordance with published literature. The results suggest that R0 resection has higher survival rates than R1/R2 resections. Both short- and long-term functional outcomes could have major impact on a patient's quality of life. Heterogeneity was high, and neither comparative analyses nor meta-analysis could be performed.", "keywords_zh": "colorectal cancer, functional outcomes, oncological outcomes, sacrectomy", "keywords_en": "colorectal cancer, functional outcomes, oncological outcomes, sacrectomy", "link": "https://pubmed.ncbi.nlm.nih.gov/40185644/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 04 Apr 2025"}, {"id": "40156066", "title_en": "Efficacy of mesenchymal stem cell-based therapies in the treatment of perianal fistulizing Crohn's disease: a systematic review and meta-analysis", "title_zh": "Efficacy of mesenchymal stem cell-based therapies in the treatment of perianal fistulizing Crohn's disease: a systematic review and meta-analysis", "authors": "Jérémy Magalon", "abstract_en": "**Background:** Perianal lesions of Crohn's disease (CD) are complex and disabling conditions. Mesenchymal stem cell (MSC)-based therapies have emerged as an innovative approach in managing refractory perianal fistulizing CD. We conducted a systematic review and meta-analysis to describe and compare combined remission and clinical outcomes of MSC-based therapies, and then whether one approach stands out from the rest.\n\n**Methods:** We searched in MEDLINE, EMBASE and CENTRAL (up to December 31, 2023) all prospective studies assessing a local injection of MSC-based therapy in perianal fistulas of CD. The primary outcome was achievement of combined remission. MSC-based therapy strategies were compared.\n\n**Results:** Twenty-five studies were included in the meta-analysis, enrolling 596 patients with perianal fistulizing CD. The combined remission rate at 3, 6 and 12 months were 36.2% (95% confidence interval (CI), 24.5-49.7), 57.9% (95% CI 51.3-64.2) and 52% (95% CI 38.8-64.8), respectively. MSC-based therapies demonstrated a significant effect in achieving combined remission compared to placebo at 3 months (relative risk (RR) = 1.6; 95% CI 1.0-2.8) and at 6 months (RR = 1.5; 95% CI 1.1-1.9). At 6 months, the combined remission rate was 57.2% (95% CI 47.2-66.6) for adipose-derived stem cells (ASCs) and 55.7% (95% CI 26.4-81.5) for bone marrow-derived stem cells (BMSCs). In the network meta-analysis, allogeneic ASCs and BMSCs did not demonstrate superiority over each other (RR = 0.74; 95% CI 0.31-1.77).\n\n**Conclusion:** MSC-based therapies are effective for achieving combined remission of refractory and/or complex perianal fistulizing CD. The optimal efficacy effect is reached after 6 months of treatment. No superiority has yet been demonstrated between ASCs and BMSCs therapies.", "abstract_zh": "Perianal lesions of Crohn's disease (CD) are complex and disabling conditions. Mesenchymal stem cell (MSC)-based therapies have emerged as an innovative approach in managing refractory perianal fistulizing CD. We conducted a systematic review and meta-analysis to describe and compare combined remission and clinical outcomes of MSC-based therapies, and then whether one approach stands out from the rest.\n\nWe searched in MEDLINE, EMBASE and CENTRAL (up to December 31, 2023) all prospective studies assessing a local injection of MSC-based therapy in perianal fistulas of CD. The primary outcome was achievement of combined remission. MSC-based therapy strategies were compared.\n\nTwenty-five studies were included in the meta-analysis, enrolling 596 patients with perianal fistulizing CD. The combined remission rate at 3, 6 and 12 months were 36.2% (95% confidence interval (CI), 24.5-49.7), 57.9% (95% CI 51.3-64.2) and 52% (95% CI 38.8-64.8), respectively. MSC-based therapies demonstrated a significant effect in achieving combined remission compared to placebo at 3 months (relative risk (RR) = 1.6; 95% CI 1.0-2.8) and at 6 months (RR = 1.5; 95% CI 1.1-1.9). At 6 months, the combined remission rate was 57.2% (95% CI 47.2-66.6) for adipose-derived stem cells (ASCs) and 55.7% (95% CI 26.4-81.5) for bone marrow-derived stem cells (BMSCs). In the network meta-analysis, allogeneic ASCs and BMSCs did not demonstrate superiority over each other (RR = 0.74; 95% CI 0.31-1.77).\n\nMSC-based therapies are effective for achieving combined remission of refractory and/or complex perianal fistulizing CD. The optimal efficacy effect is reached after 6 months of treatment. No superiority has yet been demonstrated between ASCs and BMSCs therapies.", "keywords_zh": "Crohn’s disease, Fistula, Mesenchymal stem cells, Meta-analysis, Stromal vascular fraction", "keywords_en": "Crohn’s disease, Fistula, Mesenchymal stem cells, Meta-analysis, Stromal vascular fraction", "link": "https://pubmed.ncbi.nlm.nih.gov/40156066/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "40155532", "title_en": "Early diagnosis of Crohn's disease in patients presenting with a perianal fistula: systematic review and development of a perianal red flags index", "title_zh": "Early diagnosis of Crohn's disease in patients presenting with a perianal fistula: systematic review and development of a perianal red flags index", "authors": "J D W van der Bilt", "abstract_en": "**Background:** Delay in diagnosing Crohn's disease (CD) in patients presenting with perianal abscess (PAA) and/or fistula (PAF) is common. The aim of this study was to identify red flags suggestive of CD.\n\n**Methods:** A systematic literature review was conducted to identify symptoms associated with CD in patients presenting with PAA/PAF. A questionnaire including those symptoms, supplemented with items from the International Organization for the Study of Inflammatory Bowel Diseases (IO-IBD) red flags index for luminal CD, was administered to all adult patients presenting with a PAF and eventually diagnosed with CD and matched patients (1:3) from the same study period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\n**Results:** The systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\n**Conclusions:** The perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "abstract_zh": "Delay in diagnosing Crohn's disease (CD) in patients presenting with perianal abscess (PAA) and/or fistula (PAF) is common. The aim of this study was to identify red flags suggestive of CD.\n\nA systematic literature review was conducted to identify symptoms associated with CD in patients presenting with PAA/PAF. A questionnaire including those symptoms, supplemented with items from the International Organization for the Study of Inflammatory Bowel Diseases (IO-IBD) red flags index for luminal CD, was administered to all adult patients presenting with a PAF and eventually diagnosed with CD and matched patients (1:3) from the same study period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\nThe systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\nThe perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "keywords_zh": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "keywords_en": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40155532/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "40125894", "title_en": "Fistulotomy versus fistulectomy for simple fistula-in-ano: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Fistulotomy versus fistulectomy for simple fistula-in-ano: a systematic review and meta-analysis of randomized controlled trials", "authors": "Rebecca J Lendzion", "abstract_en": "**Background:** Perianal fistulas are a common anorectal pathology. The sphincter-cutting techniques of fistulectomy and fistulotomy are associated with high cure rates for low or simple fistula-in-ano, with negligible risk of incontinence. However, the superiority of either technique has not previously been conclusively demonstrated. The aim of this systematic review is to compare the outcomes of the two surgical techniques for the management of simple fistula-in-ano.\n\n**Methods:** A search of MEDLINE, EMBASE and Cochrane Databases for randomized controlled trials (RCT) comparing fistulotomy to fistulectomy for simple fistula-in-ano was conducted. The primary outcome was healing time; secondary outcomes included operative time, length of hospital stay, post-operative pain score, post-operative complications and fistula recurrence.\n\n**Results:** Thirteen RCTs meet inclusion criteria, comprising a total of 685 fistulectomy and 688 fistulotomy patients. There was no significant difference between the techniques for healing time (P = 0.15), operative time (P = 0.13), length of stay (P = 0.05), wound infection (P = 0.97), flatus or faecal incontinence (P = 0.35 and P = 0.70, respectively) or recurrence (P = 0.19). Post-operative pain at 24 h, assessed using a visual analogue scale, was significantly lower in the fistulectomy group (MD-0.49, 95% CI: -0.90, -0.08; P = 0.02), and we found significantly fewer post-operative bleeding complications in the fistulotomy group (OR: 3.81, 95% CI: 1.23, 11.80; P = 0.02).\n\n**Conclusion:** This systematic review did not find conclusive evidence of the superiority of either fistulectomy or fistulotomy in terms of healing time. The two statistically significant findings were lower post-operative pain scores with fistulectomy and reduced post-operative bleeding with fistulotomy.", "abstract_zh": "Perianal fistulas are a common anorectal pathology. The sphincter-cutting techniques of fistulectomy and fistulotomy are associated with high cure rates for low or simple fistula-in-ano, with negligible risk of incontinence. However, the superiority of either technique has not previously been conclusively demonstrated. The aim of this systematic review is to compare the outcomes of the two surgical techniques for the management of simple fistula-in-ano.\n\nA search of MEDLINE, EMBASE and Cochrane Databases for randomized controlled trials (RCT) comparing fistulotomy to fistulectomy for simple fistula-in-ano was conducted. The primary outcome was healing time; secondary outcomes included operative time, length of hospital stay, post-operative pain score, post-operative complications and fistula recurrence.\n\nThirteen RCTs meet inclusion criteria, comprising a total of 685 fistulectomy and 688 fistulotomy patients. There was no significant difference between the techniques for healing time (P = 0.15), operative time (P = 0.13), length of stay (P = 0.05), wound infection (P = 0.97), flatus or faecal incontinence (P = 0.35 and P = 0.70, respectively) or recurrence (P = 0.19). Post-operative pain at 24 h, assessed using a visual analogue scale, was significantly lower in the fistulectomy group (MD-0.49, 95% CI: -0.90, -0.08; P = 0.02), and we found significantly fewer post-operative bleeding complications in the fistulotomy group (OR: 3.81, 95% CI: 1.23, 11.80; P = 0.02).\n\nThis systematic review did not find conclusive evidence of the superiority of either fistulectomy or fistulotomy in terms of healing time. The two statistically significant findings were lower post-operative pain scores with fistulectomy and reduced post-operative bleeding with fistulotomy.", "keywords_zh": "anal fistula, fistulectomy, fistulotomy, randomized controlled trials", "keywords_en": "anal fistula, fistulectomy, fistulotomy, randomized controlled trials", "link": "https://pubmed.ncbi.nlm.nih.gov/40125894/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 24 Mar 2025"}, {"id": "40024986", "title_en": "A systematic review of outcome measurement instruments used in pouch anal and vaginal fistulae: a COSMIN-based analysis", "title_zh": "A systematic review of outcome measurement instruments used in pouch anal and vaginal fistulae: a COSMIN-based analysis", "authors": "Phil Tozer", "abstract_en": "**Purpose:** Pouch-related fistulae are devastating complications of ileoanal pouch surgery, which is performed to improve the quality of life (QoL) for patients who have had a proctocolectomy. Their management is limited by inconsistent evidence, including using poorly and heterogeneously defined outcomes. This study aims to identify all Outcome Measurement Instruments (OMIs) used in pouch fistula research, including Patient-Reported Outcome Measures (PROMs) and Clinician-Reported Outcome Measures (ClinROMs) and evaluate their quality using COSMIN guidelines to help select the best tool for a standardised core outcome measurement set in a future consensus study.\n\n**Methods:** A systematic review was conducted to identify all OMIs used in ileo-anal pouch fistulae studies, from MEDLINE, Embase, and the Cochrane Library. We evaluated existing OMIs based on COSMIN guidelines and used the GRADE approach to assess evidence quality. Results were synthesized narratively.\n\n**Results:** Among 91 studies, 13 OMIs were reviewed. Pouch-specific instruments performed poorly in key domains of reliability, validity, and responsiveness. Only 17.6% of studies assessed QoL using PROMs. The best-performing instruments were the SF-36 and IBDQ. The Ileoanal Pouch Syndrome Severity Score was the only pouch-specific instrument that involved patients in its development and although useful for pouch dysfunction, it lacks specific QoL assessment and was not validated in pouch-fistulae patients.\n\n**Conclusion:** Existing OMIs for pouch-related fistulae lack adequate measurement properties, with no PROMs specifically validated for QoL in this population and very few instruments involving patients in their development. There is an unmet need for a validated PROM specifically for QoL in pouch-related fistulae.", "abstract_zh": "Pouch-related fistulae are devastating complications of ileoanal pouch surgery, which is performed to improve the quality of life (QoL) for patients who have had a proctocolectomy. Their management is limited by inconsistent evidence, including using poorly and heterogeneously defined outcomes. This study aims to identify all Outcome Measurement Instruments (OMIs) used in pouch fistula research, including Patient-Reported Outcome Measures (PROMs) and Clinician-Reported Outcome Measures (ClinROMs) and evaluate their quality using COSMIN guidelines to help select the best tool for a standardised core outcome measurement set in a future consensus study.\n\nA systematic review was conducted to identify all OMIs used in ileo-anal pouch fistulae studies, from MEDLINE, Embase, and the Cochrane Library. We evaluated existing OMIs based on COSMIN guidelines and used the GRADE approach to assess evidence quality. Results were synthesized narratively.\n\nAmong 91 studies, 13 OMIs were reviewed. Pouch-specific instruments performed poorly in key domains of reliability, validity, and responsiveness. Only 17.6% of studies assessed QoL using PROMs. The best-performing instruments were the SF-36 and IBDQ. The Ileoanal Pouch Syndrome Severity Score was the only pouch-specific instrument that involved patients in its development and although useful for pouch dysfunction, it lacks specific QoL assessment and was not validated in pouch-fistulae patients.\n\nExisting OMIs for pouch-related fistulae lack adequate measurement properties, with no PROMs specifically validated for QoL in this population and very few instruments involving patients in their development. There is an unmet need for a validated PROM specifically for QoL in pouch-related fistulae.", "keywords_zh": "COSMIN, Patient reported outcome measures, Pouch Fistula, Pouch anal fistula, Pouch vaginal fistula", "keywords_en": "COSMIN, Patient reported outcome measures, Pouch Fistula, Pouch anal fistula, Pouch vaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40024986/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sun, 02 Mar 2025"}, {"id": "39946821", "title_en": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "title_zh": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "authors": "G S Octavius", "abstract_en": "**Introduction:** This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\n**Methods:** The protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\n**Results:** Of 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\n**Conclusion:** ADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\n**Implications For Practice:** T2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "abstract_zh": "This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\nThe protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\nOf 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\nADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\nT2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "keywords_zh": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "keywords_en": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39946821/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 13 Feb 2025"}, {"id": "39876853", "title_en": "Rectovaginal Fistula Repair Following Vaginoplasty in Transgender Females: A Systematic Review of Surgical Techniques", "title_zh": "Rectovaginal Fistula Repair Following Vaginoplasty in Transgender Females: A Systematic Review of Surgical Techniques", "authors": "Gabriel A Del Corral", "abstract_en": "<b>Background:</b> Rectovaginal fistula (RVF) remains a complex complication following gender-affirming vaginoplasty. This review aims to evaluate RVF repair techniques and outcomes following vaginoplasty. <b>Methods:</b> A systematic review was performed per PRISMA guidelines. Ovid MEDLINE, Ovid EMBASE, Cochrane, and Web of Science were queried for records pertaining to RVF repair following vaginoplasty. Study characteristics, operative details, and demographics were collected. Outcomes included RVF repair method, recurrence rate, and complications. <b>Results:</b> Among 282 screened citations, 17 articles representing 41 patients were included. Rectovaginal fistula repair methods identified included 4 conservative management approaches (n = 12 patients), primary closure with or without fistulectomy and ostomy (n = 22), 10 reconstructive surgical techniques (n = 18). The most common reconstructive techniques were V-Y full-thickness advancement with rectal flap (n = 5) and infragluteal fasciocutaneous flap (n = 4). Median time to recurrence was 6 months (interquartile range 7.5). Reported RVF repair complications included RVF recurrence (n = 5, 14.7%) and wound complication or dehiscence (n = 2, 5.88%). Three cases of RVF recurred after primary closure with or without fistulectomy and ostomy, while 2 cases of recurrence followed reconstruction. <b>Conclusion:</b> There remains a high level of variability in the approach to RVF repair following vaginoplasty. Reconstructive surgical techniques may be a more optimal solution without necessitating ostomies, but this decision must be considered in the context of RVF location, individual patient expectations, and clinical presentation.", "abstract_zh": "<b>Background:</b> Rectovaginal fistula (RVF) remains a complex complication following gender-affirming vaginoplasty. This review aims to evaluate RVF repair techniques and outcomes following vaginoplasty. <b>Methods:</b> A systematic review was performed per PRISMA guidelines. Ovid MEDLINE, Ovid EMBASE, Cochrane, and Web of Science were queried for records pertaining to RVF repair following vaginoplasty. Study characteristics, operative details, and demographics were collected. Outcomes included RVF repair method, recurrence rate, and complications. <b>Results:</b> Among 282 screened citations, 17 articles representing 41 patients were included. Rectovaginal fistula repair methods identified included 4 conservative management approaches (n = 12 patients), primary closure with or without fistulectomy and ostomy (n = 22), 10 reconstructive surgical techniques (n = 18). The most common reconstructive techniques were V-Y full-thickness advancement with rectal flap (n = 5) and infragluteal fasciocutaneous flap (n = 4). Median time to recurrence was 6 months (interquartile range 7.5). Reported RVF repair complications included RVF recurrence (n = 5, 14.7%) and wound complication or dehiscence (n = 2, 5.88%). Three cases of RVF recurred after primary closure with or without fistulectomy and ostomy, while 2 cases of recurrence followed reconstruction. <b>Conclusion:</b> There remains a high level of variability in the approach to RVF repair following vaginoplasty. Reconstructive surgical techniques may be a more optimal solution without necessitating ostomies, but this decision must be considered in the context of RVF location, individual patient expectations, and clinical presentation.", "keywords_zh": "neovagina, rectovaginal fistula, surgical technique, transgender, vaginoplasty", "keywords_en": "neovagina, rectovaginal fistula, surgical technique, transgender, vaginoplasty", "link": "https://pubmed.ncbi.nlm.nih.gov/39876853/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 29 Jan 2025"}, {"id": "39833536", "title_en": "Fistulae Secondary to Vaginal Pessary Use for Pelvic Organ Prolapse: A Systematic Review", "title_zh": "Fistulae Secondary to Vaginal Pessary Use for Pelvic Organ Prolapse: A Systematic Review", "authors": "Thomas Giles Gray", "abstract_en": "**Introduction And Hypothesis:** Urogenital and rectovaginal fistulae are rare complications of pessary use for pelvic organ prolapse (POP). This systematic review investigates the prevalence of these complications in patients using pessary for POP, potential risk factors and approaches to their investigation and management.\n\n**Methods:** All studies in English reporting urogenital or rectovaginal fistulae secondary to pessaries for POP were eligible for inclusion. AMED, CINAHL, MedLine, Scopus and Web of Science databases were searched from inception to March 2024. Risk of bias was assessed using validated tools: Murad et al.'s tool for case series/reports and ROBINS-I for non-randomised studies. Quantitative synthesis of descriptive statistics and narrative summary were performed.\n\n**Results:** Two retrospective studies and 60 case series/reports were included, describing 76 fistulae (34 urogenital, 42 rectovaginal). The retrospective studies estimated the prevalence of fistulae to be 3%. Of reported fistulae, 45% occurred with Gellhorn, 16% with ring, 11% with shelf and 9% with cube pessaries. Fifty percent were associated with neglected pessary care. Conservative management resulted in size reduction or resolution in 69% of fistulae: this approach should be considered. Vaginal (88%) and abdominal (100%) vesicovaginal fistula repairs were successful. Diverting ostomies were popular for rectovaginal fistulae but often resulted in permanent stoma without reducing mortality, recurrence or repair failure. Colpocleisis represents an effective procedure for managing co-existing POP.\n\n**Conclusions:** The prevalence of fistulae from pessary use is likely < 1% but may rise to 3% with risk factors present, including Gellhorn pessaries and neglected care. Both conservative and surgical management are viable treatment options.", "abstract_zh": "Urogenital and rectovaginal fistulae are rare complications of pessary use for pelvic organ prolapse (POP). This systematic review investigates the prevalence of these complications in patients using pessary for POP, potential risk factors and approaches to their investigation and management.\n\nAll studies in English reporting urogenital or rectovaginal fistulae secondary to pessaries for POP were eligible for inclusion. AMED, CINAHL, MedLine, Scopus and Web of Science databases were searched from inception to March 2024. Risk of bias was assessed using validated tools: Murad et al.'s tool for case series/reports and ROBINS-I for non-randomised studies. Quantitative synthesis of descriptive statistics and narrative summary were performed.\n\nTwo retrospective studies and 60 case series/reports were included, describing 76 fistulae (34 urogenital, 42 rectovaginal). The retrospective studies estimated the prevalence of fistulae to be 3%. Of reported fistulae, 45% occurred with Gellhorn, 16% with ring, 11% with shelf and 9% with cube pessaries. Fifty percent were associated with neglected pessary care. Conservative management resulted in size reduction or resolution in 69% of fistulae: this approach should be considered. Vaginal (88%) and abdominal (100%) vesicovaginal fistula repairs were successful. Diverting ostomies were popular for rectovaginal fistulae but often resulted in permanent stoma without reducing mortality, recurrence or repair failure. Colpocleisis represents an effective procedure for managing co-existing POP.\n\nThe prevalence of fistulae from pessary use is likely < 1% but may rise to 3% with risk factors present, including Gellhorn pessaries and neglected care. Both conservative and surgical management are viable treatment options.", "keywords_zh": "Pelvic organ prolapse, Pessaries, Rectovaginal fistula, Systematic review, Vesicovaginal fistula", "keywords_en": "Pelvic organ prolapse, Pessaries, Rectovaginal fistula, Systematic review, Vesicovaginal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39833536/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 20 Jan 2025"}, {"id": "39623055", "title_en": "Salvage irreversible electroporation for locally recurrent prostate cancer after definitive radiotherapy: a systematic review", "title_zh": "Salvage irreversible electroporation for locally recurrent prostate cancer after definitive radiotherapy: a systematic review", "authors": "Gencay Hatiboglu", "abstract_en": "**Background:** To systematically evaluate the available evidence regarding the effect of salvage irreversible electroporation (IRE) in patients with local recurrent prostate cancer (PCa) after definitive radiotherapy (RT).\n\n**Methods:** A systematic search was conducted in the electronic databases PubMed-MEDLINE and the Web of Science. The following search terms were used: \"irreversible electroporation AND recurrent prostate cancer\", ''salvage irreversible electroporation AND prostate cancer AND radiation\", \"nanoknife AND recurrent prostate cancer\", and ''salvage irreversible electroporation AND prostate cancer\" by combining PICO (population, intervention, comparison, and outcome) terms.\n\n**Results:** We identified 5 eligible studies. Following IRE, local oncological control was ranging from 67 to 78%. In-field and out-field lesion recurrences after IRE were ranging from 3 to 10% and from 8 to 14%, respectively. Only one study reported an overall metastasis-free survival rate of 91% and a 5-year progression-free survival rate of 60%. The post-IRE continence status ranged 73-100%. Two studies reported a decline in the proportion of patients maintaining erections sufficient for sexual intercourse and two studies reported 50% preservation of erection. The majority of complications were of a low-to-mild nature, classified as Clavien-Dindo grade I-II, with the exception of the development of a rectal fistula in a single case.\n\n**Conclusions:** IRE represents an alternative salvage treatment option for patients with localised recurrent PCa following RT. The procedure offers a favourable safety profile and effective preservation of urinary function. The oncological results are promising, but further investigation is required.", "abstract_zh": "To systematically evaluate the available evidence regarding the effect of salvage irreversible electroporation (IRE) in patients with local recurrent prostate cancer (PCa) after definitive radiotherapy (RT).\n\nA systematic search was conducted in the electronic databases PubMed-MEDLINE and the Web of Science. The following search terms were used: \"irreversible electroporation AND recurrent prostate cancer\", ''salvage irreversible electroporation AND prostate cancer AND radiation\", \"nanoknife AND recurrent prostate cancer\", and ''salvage irreversible electroporation AND prostate cancer\" by combining PICO (population, intervention, comparison, and outcome) terms.\n\nWe identified 5 eligible studies. Following IRE, local oncological control was ranging from 67 to 78%. In-field and out-field lesion recurrences after IRE were ranging from 3 to 10% and from 8 to 14%, respectively. Only one study reported an overall metastasis-free survival rate of 91% and a 5-year progression-free survival rate of 60%. The post-IRE continence status ranged 73-100%. Two studies reported a decline in the proportion of patients maintaining erections sufficient for sexual intercourse and two studies reported 50% preservation of erection. The majority of complications were of a low-to-mild nature, classified as Clavien-Dindo grade I-II, with the exception of the development of a rectal fistula in a single case.\n\nIRE represents an alternative salvage treatment option for patients with localised recurrent PCa following RT. The procedure offers a favourable safety profile and effective preservation of urinary function. The oncological results are promising, but further investigation is required.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39623055/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 02 Dec 2024"}, {"id": "39422801", "title_en": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\n**Methods:** A systematic PubMed and Scopus search was conducted, a propos of a case report.\n\n**Results:** One hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\nA systematic PubMed and Scopus search was conducted, a propos of a case report.\n\nOne hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\nReview of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "keywords_zh": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39360706", "title_en": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "authors": "Cristina Alba", "abstract_en": "**Background:** Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\n**Objective:** This study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\n**Methods:** A systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\n**Results:** Twelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\n**Conclusion:** Evidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "abstract_zh": "Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\nThis study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\nA systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\nTwelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\nEvidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "keywords_zh": "Crohn's disease, adipose‐derived allogenic mesenchymal stem cells, alofisel, darvadstrocel, inflammatory bowel disease, meta‐analysis, perianal fistulas", "keywords_en": "Crohn's disease, adipose‐derived allogenic mesenchymal stem cells, alofisel, darvadstrocel, inflammatory bowel disease, meta‐analysis, perianal fistulas", "link": "https://pubmed.ncbi.nlm.nih.gov/39360706/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 03 Oct 2024"}, {"id": "39332832", "title_en": "Role of prolonged packing in postoperative anorectal abscess management: a systematic review and meta-analysis", "title_zh": "Role of prolonged packing in postoperative anorectal abscess management: a systematic review and meta-analysis", "authors": "Valentin Mocanu", "abstract_en": "**Background:** Prolonged packing of anorectal abscess cavities with internal dressings after incision and drainage is frequently used, but the efficacy of this practice remains controversial. Some studies highlight its use in hemostasis and preventing fistula and abscess recurrence, whereas others describe its economic burden and increase in pain. In this systematic review, we examine current evidence on the impact of packing after incision and drainage for anorectal abscesses.\n\n**Methods:** The medical librarian conducted a comprehensive literature search on January 5, 2023. We conducted the meta-analysis using RevMan 5.4.1 software with a Mantel-Haenszel random-effects model.\n\n**Results:** We identified 3 randomized controlled trials, comprising 490 patients. Of those, 241 patients (49%) received postoperative packing; most patients were male (<i>n</i> = 158, 65.6%), with a median age of 40.5 years and a follow-up of 6 months. Meta-analysis showed that prolonged wound packing was associated with delayed wound healing and increased pain, but no difference in abscess recurrence or fistula formation.\n\n**Conclusion:** In this systematic review of current evidence highlighting the impact of packing after incision and drainage for anorectal abscesses, we found that the practice is not associated with significant differences in abscess recurrence and fistula formation, but is associated with increased postoperative pain and delayed wound healing.", "abstract_zh": "Prolonged packing of anorectal abscess cavities with internal dressings after incision and drainage is frequently used, but the efficacy of this practice remains controversial. Some studies highlight its use in hemostasis and preventing fistula and abscess recurrence, whereas others describe its economic burden and increase in pain. In this systematic review, we examine current evidence on the impact of packing after incision and drainage for anorectal abscesses.\n\nThe medical librarian conducted a comprehensive literature search on January 5, 2023. We conducted the meta-analysis using RevMan 5.4.1 software with a Mantel-Haenszel random-effects model.\n\nWe identified 3 randomized controlled trials, comprising 490 patients. Of those, 241 patients (49%) received postoperative packing; most patients were male (<i>n</i> = 158, 65.6%), with a median age of 40.5 years and a follow-up of 6 months. Meta-analysis showed that prolonged wound packing was associated with delayed wound healing and increased pain, but no difference in abscess recurrence or fistula formation.\n\nIn this systematic review of current evidence highlighting the impact of packing after incision and drainage for anorectal abscesses, we found that the practice is not associated with significant differences in abscess recurrence and fistula formation, but is associated with increased postoperative pain and delayed wound healing.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39332832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 27 Sep 2024"}, {"id": "39298676", "title_en": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "title_zh": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "authors": "Phillip Fleshner", "abstract_en": "**Background:** Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\n**Results:** Overall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\n**Conclusions:** Optimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "abstract_zh": "Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\nElectronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\nOverall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\nOptimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "keywords_zh": "Crohn’s disease, perianal fistula, seton", "keywords_en": "Crohn’s disease, perianal fistula, seton", "link": "https://pubmed.ncbi.nlm.nih.gov/39298676/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 19 Sep 2024"}, {"id": "39186335", "title_en": "Efficacy and Safety of Endorectal Advancement Flap for the Treatment of Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Efficacy and Safety of Endorectal Advancement Flap for the Treatment of Anal Fistula: A Systematic Review and Meta-Analysis", "authors": "Wencong Xu", "abstract_en": "**Aim:** Complex anal fistula poses a significant challenge for anorectal surgeons due to its high risks of recurrence and incontinence. A sphincter-preserving procedure named endorectal advancement flap (ERAF) is gradually being applied to clinical practice. Therefore, this meta-analysis aims to evaluate the efficacy and safety of ERAF in managing anal fistula.\n\n**Methods:** We searched PubMed, Embase, Cochrane, and Web of Science databases for relevant manuscripts published from 29 August 2003 to 29 August 2023. Among these studies, outcomes included healing rate, recurrence rate, incontinence rate, and complications. Furthermore, the quality of the included studies was assessed using the Newcastle-Ottawa Scale (NOS) and the Cochrane risk-of-bias tool. The heterogeneity was determined using the chi-squared test and I2 statistic. A random effects model was applied if significant heterogeneity (p < 0.05 and I2 > 50%) was observed. Sensitivity analysis was conducted by excluding studies with a high risk of bias.\n\n**Results:** Thirty-eight studies were included in the present analysis, involving 1559 participants. The pooled healing rate and recurrence rate of ERAF were 65.5% (95% confidence intervals (CI): 57.6%-73.4%) and 19.6% (95% CI: 14.8%-24.4%), respectively. The pooled incontinence rate was 10.6% (95% CI: 6.0%-15.1%). According to the subgroup analysis, the healing rate, recurrence rate, and incontinence rate of ERAF for fistula associated with inflammatory bowel disease (IBD) were 53.9% (95% CI: 38.1%-69.7%), 32.6% (95% CI: 21.3%-43.8%), and 2.8% (95% CI: 0%-10.6%), respectively. For patients without IBD, the healing rate, recurrence rate, and incontinence rate of ERAF were 70.6% (95% CI: 63.9%-77.4%), 15.7% (95% CI: 9.9%-21.5%), and 16.5% (95% CI: 8.1%-24.9%), respectively. We observed that bleeding, local infection or abscess, flap dehiscence, and haematomas were the common complications, with incidences of 2.2% (95% CI: 0%-4.5%), 9.5% (95% CI: 4.7%-14.4%), 10.4% (95% CI: 0.0%-21.6%), and 12.4% (95% CI: 0%-27.6%), respectively.\n\n**Conclusions:** ERAF may be an optional treatment for anal fistula from the perspective of effectiveness and safety.\n\n**Systematic Review Registration:** PROSPERO: CRD42023451451.", "abstract_zh": "Complex anal fistula poses a significant challenge for anorectal surgeons due to its high risks of recurrence and incontinence. A sphincter-preserving procedure named endorectal advancement flap (ERAF) is gradually being applied to clinical practice. Therefore, this meta-analysis aims to evaluate the efficacy and safety of ERAF in managing anal fistula.\n\nWe searched PubMed, Embase, Cochrane, and Web of Science databases for relevant manuscripts published from 29 August 2003 to 29 August 2023. Among these studies, outcomes included healing rate, recurrence rate, incontinence rate, and complications. Furthermore, the quality of the included studies was assessed using the Newcastle-Ottawa Scale (NOS) and the Cochrane risk-of-bias tool. The heterogeneity was determined using the chi-squared test and I2 statistic. A random effects model was applied if significant heterogeneity (p < 0.05 and I2 > 50%) was observed. Sensitivity analysis was conducted by excluding studies with a high risk of bias.\n\nThirty-eight studies were included in the present analysis, involving 1559 participants. The pooled healing rate and recurrence rate of ERAF were 65.5% (95% confidence intervals (CI): 57.6%-73.4%) and 19.6% (95% CI: 14.8%-24.4%), respectively. The pooled incontinence rate was 10.6% (95% CI: 6.0%-15.1%). According to the subgroup analysis, the healing rate, recurrence rate, and incontinence rate of ERAF for fistula associated with inflammatory bowel disease (IBD) were 53.9% (95% CI: 38.1%-69.7%), 32.6% (95% CI: 21.3%-43.8%), and 2.8% (95% CI: 0%-10.6%), respectively. For patients without IBD, the healing rate, recurrence rate, and incontinence rate of ERAF were 70.6% (95% CI: 63.9%-77.4%), 15.7% (95% CI: 9.9%-21.5%), and 16.5% (95% CI: 8.1%-24.9%), respectively. We observed that bleeding, local infection or abscess, flap dehiscence, and haematomas were the common complications, with incidences of 2.2% (95% CI: 0%-4.5%), 9.5% (95% CI: 4.7%-14.4%), 10.4% (95% CI: 0.0%-21.6%), and 12.4% (95% CI: 0%-27.6%), respectively.\n\nERAF may be an optional treatment for anal fistula from the perspective of effectiveness and safety.\n\nPROSPERO: CRD42023451451.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39186335/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 26 Aug 2024"}, {"id": "39175475", "title_en": "Efficacy and safety evaluation of mixed nutrition for postoperative esophageal cancer patients in China: a meta-analysis", "title_zh": "Efficacy and safety evaluation of mixed nutrition for postoperative esophageal cancer patients in China: a meta-analysis", "authors": "Xiaochuan Liu", "abstract_en": "**Objective:** The purpose of this study was to evaluate the clinical effect of mixed nutrition and parenteral nutrition support on postoperative patients with esophageal cancer.\n\n**Method:** By searching PubMed, Web of Science, Cochrane, CNKI, Wanfang and other databases, all the literatures until March 2024 about the comparison of randomized controlled Trial (RCT) of mixed nutrition and parenteral nutrition support in postoperative patients with esophageal cancer were screened. The inclusion criteria were that the patients were from randomized controlled trials or clinical trials in China, and the patients were all diagnosed with esophageal cancer by pathological biopsy. The exclusion criteria were the literature other than the above, including repeated published literature, non-Chinese and English literature, incomplete or missing analysis data, etc. After two researchers independently screened the literature, extracted the data and evaluated the risk of bias according to the criteria, Meta-analysis was carried out with RevMan 5.4 software.\n\n**Results:** A total of 11 studies were included, including 1216 patients. Meta-analysis showed that, compared with parenteral nutrition, mixed nutrition can improve the levels of transferrin, serum albumin, prealbumin and lymphocyte counts in patients with esophageal cancer after surgery, shorten the time of anal recovery of exhaust, defecation and hospital stay after surgery, and reduce the incidence of pulmonary infection, abdominal distension, incision infection and anastomotic fistula, with statistical significance between the two groups (<i>P</i> < 0.05). The heterogeneity of individual results in this study is relatively high, the analysis comes from clinical heterogeneity, and the publication bias is analyzed through Funnel plot. Taking the incidence of lung infection as an example, the results are evenly distributed on both sides of the Funnel plot, and the publication bias has little impact on the results of the study.\n\n**Conclusion:** Compared with parenteral nutrition, mixed nutrition can improve the prognosis of postoperative patients with esophageal cancer and reduce the incidence of related adverse events.", "abstract_zh": "The purpose of this study was to evaluate the clinical effect of mixed nutrition and parenteral nutrition support on postoperative patients with esophageal cancer.\n\nBy searching PubMed, Web of Science, Cochrane, CNKI, Wanfang and other databases, all the literatures until March 2024 about the comparison of randomized controlled Trial (RCT) of mixed nutrition and parenteral nutrition support in postoperative patients with esophageal cancer were screened. The inclusion criteria were that the patients were from randomized controlled trials or clinical trials in China, and the patients were all diagnosed with esophageal cancer by pathological biopsy. The exclusion criteria were the literature other than the above, including repeated published literature, non-Chinese and English literature, incomplete or missing analysis data, etc. After two researchers independently screened the literature, extracted the data and evaluated the risk of bias according to the criteria, Meta-analysis was carried out with RevMan 5.4 software.\n\nA total of 11 studies were included, including 1216 patients. Meta-analysis showed that, compared with parenteral nutrition, mixed nutrition can improve the levels of transferrin, serum albumin, prealbumin and lymphocyte counts in patients with esophageal cancer after surgery, shorten the time of anal recovery of exhaust, defecation and hospital stay after surgery, and reduce the incidence of pulmonary infection, abdominal distension, incision infection and anastomotic fistula, with statistical significance between the two groups (<i>P</i> < 0.05). The heterogeneity of individual results in this study is relatively high, the analysis comes from clinical heterogeneity, and the publication bias is analyzed through Funnel plot. Taking the incidence of lung infection as an example, the results are evenly distributed on both sides of the Funnel plot, and the publication bias has little impact on the results of the study.\n\nCompared with parenteral nutrition, mixed nutrition can improve the prognosis of postoperative patients with esophageal cancer and reduce the in
