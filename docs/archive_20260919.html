s, with year 2010 reporting the strongest association. The systematic review of 37 studies highlighted VAPP occurrence within 2 months to 4 years post-vaccination, typically with acute flaccid paralysis. Immunodeficiency and perianal abscess emerged as major risk factors. Out of the 37 included studies, 27 showed consistent causal association of VAPP with OPV using WHO-AEFI causality assessment tool.\n\n**Conclusion:** The study emphasized the seriousness of VAPP and highlights its association with OPV, identifying immunodeficiency as a prominent contributor to VAPP manifestation.", "abstract_zh": "Vaccine-associated paralytic poliomyelitis (VAPP) is a rare adverse event of oral poliovirus vaccines (OPV), particularly affecting immunodeficient individuals.\n\nThis study aimed to (1) Assess the association between OPV and VAPP using Vaccine Adverse Event Reporting System (VAERS) database (2) Outline patient characteristics and risk factors associated with the occurrence of VAPP in OPV recipients through a systematic review of case reports and case series. A disproportionality analysis was conducted using the data from VAERS, encompassing adverse events reported from 1990 till February 2023. Additionally, we conducted a systematic review of case reports and case series using PubMed, Scopus, and Embase databases.\n\nThe VAERS data revealed 130 VAPP reports among 1,739,903 OPV linked adverse events, with year 2010 reporting the strongest association. The systematic review of 37 studies highlighted VAPP occurrence within 2 months to 4 years post-vaccination, typically with acute flaccid paralysis. Immunodeficiency and perianal abscess emerged as major risk factors. Out of the 37 included studies, 27 showed consistent causal association of VAPP with OPV using WHO-AEFI causality assessment tool.\n\nThe study emphasized the seriousness of VAPP and highlights its association with OPV, identifying immunodeficiency as a prominent contributor to VAPP manifestation.", "keywords_zh": "Case report, OPV, VAPP, causality, immunodeficiency, polio", "keywords_en": "Case report, OPV, VAPP, causality, immunodeficiency, polio", "link": "https://pubmed.ncbi.nlm.nih.gov/38813942/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 30 May 2024"}, {"id": "38563064", "title_en": "A systematic review and meta-analysis of the use of packing in the management of perianal abscesses", "title_zh": "A systematic review and meta-analysis of the use of packing in the management of perianal abscesses", "authors": "Ome Padfield", "abstract_en": "**Background:** Perianal abscesses are common presentations and reasons for emergency general surgery admissions. Management involves incision and drainage of the abscess and packing the cavity with internal wound dressings. This meta-analysis aimed to assess in adults if packing an abscess or leaving it unpacked leads to a significant difference in the outcomes of pain on wound dressing, time to healing, rate of fistulation and abscess recurrence.\n\n**Methods:** Randomised controlled trials (RCTs) with participants aged 18 years or older that compared packing of perianal abscess cavities with no packing between 2002 and 2022 were searched for in December 2022 on OVID Medline and Embase, the CENTRAL register of trials, PubMed and Google Scholar. Risk of bias was assessed using the Cochrane Risk of Bias tool. Random effects meta-analysis was conducted on the data extracted.\n\n**Results:** Three RCTs involving 490 patients were analysed for the outcomes of abscess recurrence and postoperative fistula formation; the data were not adequate to assess pain on dressing and time to healing. For unpacked versus packed, the pooled relative risk of abscess recurrence was 1.57 (95% confidence interval (CI) 0.764, 3.29, <i>p</i>=0.219) and for fistula formation 0.686 (95% CI 0.430, 1.09, <i>p</i>=0.114). These results suggest there is no significant benefit to packing abscess cavities.\n\n**Conclusions:** Analysis of the outcomes suggests there is no significant difference with regards to rates of abscess recurrence or fistula formation between the packed and unpacked groups; however, appropriately powered RCTs are required in this area to provide more primary evidence to inform best practice and clinical management.", "abstract_zh": "Perianal abscesses are common presentations and reasons for emergency general surgery admissions. Management involves incision and drainage of the abscess and packing the cavity with internal wound dressings. This meta-analysis aimed to assess in adults if packing an abscess or leaving it unpacked leads to a significant difference in the outcomes of pain on wound dressing, time to healing, rate of fistulation and abscess recurrence.\n\nRandomised controlled trials (RCTs) with participants aged 18 years or older that compared packing of perianal abscess cavities with no packing between 2002 and 2022 were searched for in December 2022 on OVID Medline and Embase, the CENTRAL register of trials, PubMed and Google Scholar. Risk of bias was assessed using the Cochrane Risk of Bias tool. Random effects meta-analysis was conducted on the data extracted.\n\nThree RCTs involving 490 patients were analysed for the outcomes of abscess recurrence and postoperative fistula formation; the data were not adequate to assess pain on dressing and time to healing. For unpacked versus packed, the pooled relative risk of abscess recurrence was 1.57 (95% confidence interval (CI) 0.764, 3.29, <i>p</i>=0.219) and for fistula formation 0.686 (95% CI 0.430, 1.09, <i>p</i>=0.114). These results suggest there is no significant benefit to packing abscess cavities.\n\nAnalysis of the outcomes suggests there is no significant difference with regards to rates of abscess recurrence or fistula formation between the packed and unpacked groups; however, appropriately powered RCTs are required in this area to provide more primary evidence to inform best practice and clinical management.", "keywords_zh": "Abscess packing, Perianal abscesses, Recurrence", "keywords_en": "Abscess packing, Perianal abscesses, Recurrence", "link": "https://pubmed.ncbi.nlm.nih.gov/38563064/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Tue, 02 Apr 2024"}, {"id": "38428446", "title_en": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for hemorrhoidal disease: a systematic review and meta-analysis", "authors": "Kiriakos Ktenidis", "abstract_en": "**Background:** We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\n**Methods:** Our study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\n**Results:** Twelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\n**Conclusion:** ALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "abstract_zh": "We conducted a systematic review to assess the safety and efficacy of Aluminum potassium sulfate and tannic acid (ALTA) sclerotherapy for the treatment of hemorrhoidal disease.\n\nOur study was conducted in accordance with the PRISMA statement (Preferred Reporting Items for Systematic Reviews and Meta-analyses) 2020. Primary endpoints included overall recurrence and type of recurrence while secondary endpoints included postoperative complications, reintervention, presence of rectal ulcer, rectal stricture, defecation abnormalities and perianal abscess. Α regression analysis, where the percentage of patients with grade II, III and IV hemorrhoidal disease was used as a covariate, was also performed.\n\nTwelve studies with 4249 patients met all the inclusion criteria and were eventually included. The crude and pooled estimates of the overall recurrence and complications by the end of follow-up were 10% (95% CI, 6.52%-14.08%) and 5.20% (95% CI, 2.59%-8.52%), respectively. Regression analysis displayed no correlation between recurrence and the grade of hemorrhoid disease II, β= -0.0012 (95% CI, -0.0074 to 0.0049) (<i>p</i> = .64), grade III β= -0.0006 (95% CI, -0.0056 to 0.0045) (<i>p</i> = .79) and grade IV β = 0.0025 (95% CI, -0.0075 to 0.0124). However, a trend suggestive of increased recurrence was observed in patient populations with a higher proportion of grade IV disease.\n\nALTA sclerotherapy may be a safe and viable alternative for patients with hemorrhoidal disease. Long-term follow-up and high-quality randomized controlled trials will help define the place of ALTA sclerotherapy in the armamentarium of treatment of hemorrhoids.", "keywords_zh": "ALTA, aluminum potassium sulfate, hemorrhoidal disease, hemorrhoids, sclerotherapy", "keywords_en": "ALTA, aluminum potassium sulfate, hemorrhoidal disease, hemorrhoids, sclerotherapy", "link": "https://pubmed.ncbi.nlm.nih.gov/38428446/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Fri, 01 Mar 2024"}, {"id": "38223244", "title_en": "Effectiveness and safety of darvadstrocel in patients with complex perianal fistulizing Crohn's disease: a systematic review", "title_zh": "Effectiveness and safety of darvadstrocel in patients with complex perianal fistulizing Crohn's disease: a systematic review", "authors": "Konstantinos H Katsanos", "abstract_en": "**Background:** Managing complex perianal fistulizing Crohn's disease (CD) remains challenging, despite current medical and surgical treatment approaches. Darvadstrocel, a therapy utilizing adipose-derived stem cells, shows promise in promoting tissue regeneration and healing, offering a novel and effective treatment for fistula management.\n\n**Method:** A systematic literature search was conducted on PubMed and Scopus to identify studies involving patients with complex perianal fistulizing CD treated with darvadstrocel.\n\n**Results:** In total, 2 randomized controlled trials (RCT), 5 observational studies with retrospective data collection and 2 observational studies with prospective design were included in the final review. Data from the European ADMIRE-CD RCT demonstrated that darvadstrocel is superior to placebo in terms of clinical and imaging improvement over both the short and long term. These findings align with the prospective studies analyzed in this systematic review. The rate of treatment-emergent adverse events in the ADMIRE-CD trial's RCTs was similar in both the darvadstrocel and control groups, with perianal abscess being the most common adverse event up to 52 weeks after drug administration. Retrospective studies indicated no side-effects beyond 52 weeks.\n\n**Conclusions:** Darvadstrocel appears to be a new, potentially effective and safe treatment option for the management of complex perianal fistulas. However, more randomized clinical trials are needed to evaluate the efficacy and safety profile of the drug.", "abstract_zh": "Managing complex perianal fistulizing Crohn's disease (CD) remains challenging, despite current medical and surgical treatment approaches. Darvadstrocel, a therapy utilizing adipose-derived stem cells, shows promise in promoting tissue regeneration and healing, offering a novel and effective treatment for fistula management.\n\nA systematic literature search was conducted on PubMed and Scopus to identify studies involving patients with complex perianal fistulizing CD treated with darvadstrocel.\n\nIn total, 2 randomized controlled trials (RCT), 5 observational studies with retrospective data collection and 2 observational studies with prospective design were included in the final review. Data from the European ADMIRE-CD RCT demonstrated that darvadstrocel is superior to placebo in terms of clinical and imaging improvement over both the short and long term. These findings align with the prospective studies analyzed in this systematic review. The rate of treatment-emergent adverse events in the ADMIRE-CD trial's RCTs was similar in both the darvadstrocel and control groups, with perianal abscess being the most common adverse event up to 52 weeks after drug administration. Retrospective studies indicated no side-effects beyond 52 weeks.\n\nDarvadstrocel appears to be a new, potentially effective and safe treatment option for the management of complex perianal fistulas. However, more randomized clinical trials are needed to evaluate the efficacy and safety profile of the drug.", "keywords_zh": "Fistulizing Crohn’s disease, adipose-derived stem-cells, darvadstrocel, treatment", "keywords_en": "Fistulizing Crohn’s disease, adipose-derived stem-cells, darvadstrocel, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/38223244/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 15 Jan 2024"}, {"id": "37545826", "title_en": "Hidradenitis suppurativa and squamous cell carcinoma: a systematic review of the literature", "title_zh": "Hidradenitis suppurativa and squamous cell carcinoma: a systematic review of the literature", "authors": "Beata Bergler-Czop", "abstract_en": "Hidradenitis suppurativa (HS) is a chronic disease which is often recurrent and occurs as abscesses of the apocrine gland. The most common locations of HS are gluteal/perianal, axillary or inguinal. It is reasonable to assume that squamous cell carcinoma may arise from HS. As researchers in the field of dermatology, HS surgery and conventional surgical oncology, we studied whether there is any correlation between HS and neoplasms. Evidence shows a correlation between HS and squamous cell carcinoma. The aim of the study was to find literature about HS and SCC and analyse potential risk factors. This is a systemic review concerning squamous cell carcinoma and hidradenitis suppurativa.", "abstract_zh": "Hidradenitis suppurativa (HS) is a chronic disease which is often recurrent and occurs as abscesses of the apocrine gland. The most common locations of HS are gluteal/perianal, axillary or inguinal. It is reasonable to assume that squamous cell carcinoma may arise from HS. As researchers in the field of dermatology, HS surgery and conventional surgical oncology, we studied whether there is any correlation between HS and neoplasms. Evidence shows a correlation between HS and squamous cell carcinoma. The aim of the study was to find literature about HS and SCC and analyse potential risk factors. This is a systemic review concerning squamous cell carcinoma and hidradenitis suppurativa.", "keywords_zh": "hidradenitis suppurativa, squamous cell carcinoma, surgical treatment", "keywords_en": "hidradenitis suppurativa, squamous cell carcinoma, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/37545826/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 07 Aug 2023"}, {"id": "37023788", "title_en": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "title_zh": "A Systematic Review and Meta-Analysis of Comparing Drainage Alone versus Drainage with Primary Fistula Treatment for the Perianal Abscess in Children", "authors": "Chen Wang", "abstract_en": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "abstract_zh": "This systematic review and meta-analysis of nonrandomized studies (NRSs) aimed to evaluate the clinical efficacy and safety of two types of surgical interventions (respectively drainage alone and drainage with primary fistula treatment) for perianal abscesses (PAs) in children. Studies from 1992 to July 2022 were searched in 10 electronic databases. All relevant NRSs with available data which compared surgical drainage with or without primary fistula treatment were included. Patients with underlying diseases which led to abscess formation were excluded. The Newcastle-Ottawa Scale was used to assess the risk of bias and quality of the included studies. The outcomes were the healing rate, fistula formation rate, fecal incontinence, and wound healing duration. A total of 16 articles with 1,262 patients were considered suitable for the final meta-analysis. Primary fistula treatment was associated with a significantly higher healing rate when compared with incision and drainage alone (odds ratio [OR]: 5.76, 95% confidence interval [CI]: 4.04-8.22). This aggressive procedure for PA resulted in an 86% reduction in the fistula formation rate (OR: 0.14, 95% CI: 0.06-0.32). Limited data showed patients who underwent primary fistula treatment have a minor effect on postoperative fecal incontinence. Primary fistula treatment demonstrates a better clinical efficacy in promoting the healing rate and decreasing the formation of fistulas in PAs in children. The available evidence for a minor impact on anal function after this intervention is less strong.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37023788/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 06 Apr 2023"}, {"id": "36894443", "title_en": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "title_zh": "The Optimal Primary Treatment for Pediatric Perianal Abscess and Anal Fistula: A Systemic Review and Meta-Analysis", "authors": "Hou-Chuan Chen", "abstract_en": "**Background:** Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\n**Methods:** Using PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\n**Results:** Thirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\n**Conclusion:** Strong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\n**Level Of Evidence:** Type of study: Systemic review; Evidence level: Level II.", "abstract_zh": "Perianal abscesses and anal fistulas are common. The principle of intention-to-treat has not been considered in previous systemic reviews. Thus, the comparison between primary and post-recurrence management was confused, and the recommendation of primary treatment is obscure. The current study aims to identify the optimal initial treatment for pediatric patients.\n\nUsing PRISMA guidelines, studies were identified from MEDLINE, EMBASE, PubMed, Cochrane Library, and Google Scholar without any language or study design restriction. The inclusion criteria include original articles or articles with original data, studies of management for a perianal abscess with or without anal fistula, and patient age of <18 years. Patients with local malignancy, Crohn's disease, or other underlying predisposing conditions were excluded. Studies without analyzing recurrence, case series of <5, and irrelevant articles were excluded in the screening stage. Of the 124 screened articles, 14 articles had no full texts or detailed information. Articles written in a language other than English or Mandarin were translated by Google Translation first and confirmed with native speakers. After the eligibility process, studies that compared identified primary managements were then included in the qualitative synthesis.\n\nThirty-one studies involving 2507 pediatric patients met the inclusion criteria. The study design consisted of two prospective case series of 47 patients and retrospective cohort studies. No randomized control trials were identified. Meta-analyses for recurrence after initial management were performed with a random-effects model. Conservative treatment and drainage revealed no difference (Odds ratio [OR], 1.222; 95% Confidential interval [CI]: 0.615-2.427, p = 0.567). Conservative management had a higher risk of recurrence than surgery without statistical significance (OR 0.278, 95% CI: 0.109-0.707, p = 0.007). Compared with incision/drainage, surgery can prevent recurrence remarkably (OR 4.360, 95% CI: 1.761-10.792, p = 0.001). Subgroup analysis of different approaches within conservative treatment and operation was not performed for lacking information.\n\nStrong recommendations cannot be made due to the lack of prospective or randomized controlled studies. However, the current study based on real primary management supports initial surgical intervention for pediatric patients with perianal abscesses and anal fistula to prevent recurrence.\n\nType of study: Systemic review; Evidence level: Level II.", "keywords_zh": "Anal fistula, Pediatric, Perianal abscess, Primary management", "keywords_en": "Anal fistula, Pediatric, Perianal abscess, Primary management", "link": "https://pubmed.ncbi.nlm.nih.gov/36894443/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 09 Mar 2023"}, {"id": "36794974", "title_en": "Mesenchymal Stem Cells Versus Placebo for Perianal Fistulizing Crohn's Disease: A Systemic Review and Meta-Analysis", "title_zh": "Mesenchymal Stem Cells Versus Placebo for Perianal Fistulizing Crohn's Disease: A Systemic Review and Meta-Analysis", "authors": "Minhao Yu", "abstract_en": "**Background:** Mesenchymal stem cells (MSCs)-based therapy for perianal fistulizing Crohn's disease (pfCD) has been extensively studies in the past decade. Its efficacy and safety had been preliminarily confirmed in some phase 2 or phase 3 clinical trials. This meta-analysis is performed to evaluate the efficacy and safety of MSCs-based therapy for pfCD.\n\n**Methods:** Electronic databases (Pubmed, Cochrane Library, Embase) were searched for studies that reported the efficacy and safety of MSCs. And RevMan were used to assess the efficacy and safety.\n\n**Results:** After screening, 5 randomized controlled trials (RCTs) were included in this meta-analysis. RevMan 5.4 for meta-analysis showed that: [Efficacy] Patients had definite remission after MSCs treatment, with an odds ratio (OR) of 2.06 (<i>P</i> < .0001, 95%CI 1.46, 2.89) vs controls. [Safety] The incidence of the most frequently reported TEAEs (treatment-emergent adverse events, TEAEs), perianal abscess and proctalgia, did not significantly increase due to the use of MSCs, with an OR of 1.07 in perianal abscess (<i>P</i> = .87, 95%CI 0.67, 1.72) vs controls, and an OR of 1.10 in proctalgia (<i>P</i> = .47, 95%CI 0.63, 1.92) vs controls.\n\n**Conclusions:** MSCs seem to be an effective and safe therapy for pfCD. MSCs based therapy has the potential to be used in combination with traditional therapies.", "abstract_zh": "Mesenchymal stem cells (MSCs)-based therapy for perianal fistulizing Crohn's disease (pfCD) has been extensively studies in the past decade. Its efficacy and safety had been preliminarily confirmed in some phase 2 or phase 3 clinical trials. This meta-analysis is performed to evaluate the efficacy and safety of MSCs-based therapy for pfCD.\n\nElectronic databases (Pubmed, Cochrane Library, Embase) were searched for studies that reported the efficacy and safety of MSCs. And RevMan were used to assess the efficacy and safety.\n\nAfter screening, 5 randomized controlled trials (RCTs) were included in this meta-analysis. RevMan 5.4 for meta-analysis showed that: [Efficacy] Patients had definite remission after MSCs treatment, with an odds ratio (OR) of 2.06 (<i>P</i> < .0001, 95%CI 1.46, 2.89) vs controls. [Safety] The incidence of the most frequently reported TEAEs (treatment-emergent adverse events, TEAEs), perianal abscess and proctalgia, did not significantly increase due to the use of MSCs, with an OR of 1.07 in perianal abscess (<i>P</i> = .87, 95%CI 0.67, 1.72) vs controls, and an OR of 1.10 in proctalgia (<i>P</i> = .47, 95%CI 0.63, 1.92) vs controls.\n\nMSCs seem to be an effective and safe therapy for pfCD. MSCs based therapy has the potential to be used in combination with traditional therapies.", "keywords_zh": "mesenchymal stem cells, meta-analysis, perianal fistulizing Crohn’s disease", "keywords_en": "mesenchymal stem cells, meta-analysis, perianal fistulizing Crohn’s disease", "link": "https://pubmed.ncbi.nlm.nih.gov/36794974/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 16 Feb 2023"}, {"id": "34792604", "title_en": "Epidemiology and Natural History of Perianal Crohn's Disease: A Systematic Review and Meta-Analysis of Population-Based Cohorts", "title_zh": "Epidemiology and Natural History of Perianal Crohn's Disease: A Systematic Review and Meta-Analysis of Population-Based Cohorts", "authors": "Siddharth Singh", "abstract_en": "**Background And Aims:** Perianal Crohn's disease (pCD) is a potentially severe phenotype of CD. We conducted a systematic review with meta-analysis to estimate cumulative incidence, risk factors, and outcomes of pCD in population-based cohort studies.\n\n**Methods:** Through a systematic literature review through March 1, 2021, we identified population-based inception cohort studies reporting cumulative incidence of perianal disease (primarily abscess and/or fistula) in patients with CD. We estimated the cumulative incidence of pCD at presentation and 1-, 5-, and 10-year follow-up, and risk factors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\n**Results:** In 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\n**Conclusions:** Approximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "abstract_zh": "Perianal Crohn's disease (pCD) is a potentially severe phenotype of CD. We conducted a systematic review with meta-analysis to estimate cumulative incidence, risk factors, and outcomes of pCD in population-based cohort studies.\n\nThrough a systematic literature review through March 1, 2021, we identified population-based inception cohort studies reporting cumulative incidence of perianal disease (primarily abscess and/or fistula) in patients with CD. We estimated the cumulative incidence of pCD at presentation and 1-, 5-, and 10-year follow-up, and risk factors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\nIn 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\nApproximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "keywords_zh": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "keywords_en": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "link": "https://pubmed.ncbi.nlm.nih.gov/34792604/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34792583", "title_en": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "title_zh": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\n**Methods:** We performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\n**Results:** Twenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\n**Conclusions:** Limited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "abstract_zh": "Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\nWe performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\nTwenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\nLimited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "keywords_zh": "cryptoglandular disease, fistula-in-ano, perianal disease", "keywords_en": "cryptoglandular disease, fistula-in-ano, perianal disease", "link": "https://pubmed.ncbi.nlm.nih.gov/34792583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 18 Nov 2021"}], "肛瘘": [{"id": "42678555", "title_en": "Efficacy of FiLaC in different types of anal fistula. A systematic review and meta-analysis", "title_zh": "Efficacy of FiLaC in different types of anal fistula. A systematic review and meta-analysis", "authors": "Peter C Ambe", "abstract_en": "Fistula Tract Laser Closure (FiLaC) represents a minimally invasive technique for the management of fistula in ano. However, no data exists on the success rates of FiLaC for the different fistula types. This systematic analysis and meta-analysis were performed following the PICOS and PRISMA guidelines. A systematic literature review was conducted for articles published in Web of Science, Embase, Cochrane Library, PubMed using search terms 'Anal fistula OR fistula in ano OR anorectal fistula' (Mesh term), 'Laser', 'Park´s classification, 'complex fistula (Mesh term), and 'Clinical Trial' (Mesh term), 'healing rate', and 'closure rate' from inception until February 2025. Pooled results for 16 studies indicated higher healing rates for simple fistula (60.8%) compared to complex fistula (54.6%). Amongst complex fistulae, transsphincteric fistulae have the best odds of healing following FiLaC. The success rate of FiLaC for extrasphincteric and suprasphincteric fistulae is about 50%. Amongst all fistula types, although not statistically significant simple fistulae have a higher odds of healing following FiLaC in comparison to complex fistulae. Amongst complex fistulae, transsphincteric fistulae have the best success rates following FiLaC. Extrasphincteric and suprasphincteric fistulae have about 50% success rate following FiLaC.", "abstract_zh": "Fistula Tract Laser Closure (FiLaC) represents a minimally invasive technique for the management of fistula in ano. However, no data exists on the success rates of FiLaC for the different fistula types. This systematic analysis and meta-analysis were performed following the PICOS and PRISMA guidelines. A systematic literature review was conducted for articles published in Web of Science, Embase, Cochrane Library, PubMed using search terms 'Anal fistula OR fistula in ano OR anorectal fistula' (Mesh term), 'Laser', 'Park´s classification, 'complex fistula (Mesh term), and 'Clinical Trial' (Mesh term), 'healing rate', and 'closure rate' from inception until February 2025. Pooled results for 16 studies indicated higher healing rates for simple fistula (60.8%) compared to complex fistula (54.6%). Amongst complex fistulae, transsphincteric fistulae have the best odds of healing following FiLaC. The success rate of FiLaC for extrasphincteric and suprasphincteric fistulae is about 50%. Amongst all fistula types, although not statistically significant simple fistulae have a higher odds of healing following FiLaC in comparison to complex fistulae. Amongst complex fistulae, transsphincteric fistulae have the best success rates following FiLaC. Extrasphincteric and suprasphincteric fistulae have about 50% success rate following FiLaC.", "keywords_zh": "Anal fistula, Complex fistula, FiLaC, Fistula closure, Fistula in ano, Healing rate, Laser fistula tract closure, Simple fistula", "keywords_en": "Anal fistula, Complex fistula, FiLaC, Fistula closure, Fistula in ano, Healing rate, Laser fistula tract closure, Simple fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/42678555/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 01 Sep 2026"}, {"id": "42674909", "title_en": "Comparative effectiveness of sphincter-sparing and non-sphincter-sparing procedures for complex anal fistulas: A systematic review and network meta-analysis of postoperative incontinence, pain, and quality of life", "title_zh": "Comparative effectiveness of sphincter-sparing and non-sphincter-sparing procedures for complex anal fistulas: A systematic review and network meta-analysis of postoperative incontinence, pain, and quality of life", "authors": "Emre Gorgun", "abstract_en": "**Background:** In complex anal fistulas, treatment should achieve healing while preserving continence and quality of life. However, direct comparative evidence across sphincter-preserving, sphincter-dividing/reconstructive, and seton-based approaches remains limited. We compared these techniques for postoperative fecal incontinence, pain, quality of life, and recurrence.\n\n**Methods:** We followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses 2020 statement and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses-Network Meta-Analysis checklist to report our study. We searched PubMed, Embase, and CENTRAL until August 2025. We included randomized controlled trials and nonrandomized controlled trials in adults with complex cryptoglandular anal fistulas. We extracted data via Research Electronic Data Capture and performed risk-of-bias evaluation via Risk of Bias 2/ROBINS-I. We performed data analysis using MetaXL with setonas the reference technique. We used Grading of Recommendations Assessment, Development, and Evaluation to rate the certainty of our evidence.\n\n**Results:** We included 2,972 patients across 43 studies. For fecal incontinence, adipose-derived stem cells plus fibrin glue and video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract showed the most consistent reductions compared with seton (moderate-high certainty). For pain, the JUMP seton technique (described by Khoshnevis et al) and video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract were associated with lower pain scores (moderate certainty). Soluble N-ethylmaleimide-sensitive factor attachment protein receptor, video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract, and ligation of the intersphincteric fistula tract plus platelet-rich plasma showed higher quality-of-life scores compared with seton (moderate certainty). Recurrence was lower with adipose-derived stem cells plus fibrin glue (relative risk, 0.02) and acellular dermal matrix (relative risk, 0.08) compared with seton. Randomized controlled trial-only sensitivity analyses were consistent with low inconsistency.\n\n**Conclusions:** Ligation and adhesive-based approaches showed an advantage over seton-based techniques in terms of fecal incontinence, pain, and quality-of-life results with comparable recurrence rates. These results highlight the importance of careful patient selection and choosing specific surgical approaches to improve patients' outcomes.", "abstract_zh": "In complex anal fistulas, treatment should achieve healing while preserving continence and quality of life. However, direct comparative evidence across sphincter-preserving, sphincter-dividing/reconstructive, and seton-based approaches remains limited. We compared these techniques for postoperative fecal incontinence, pain, quality of life, and recurrence.\n\nWe followed the Preferred Reporting Items for Systematic Reviews and Meta-Analyses 2020 statement and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses-Network Meta-Analysis checklist to report our study. We searched PubMed, Embase, and CENTRAL until August 2025. We included randomized controlled trials and nonrandomized controlled trials in adults with complex cryptoglandular anal fistulas. We extracted data via Research Electronic Data Capture and performed risk-of-bias evaluation via Risk of Bias 2/ROBINS-I. We performed data analysis using MetaXL with setonas the reference technique. We used Grading of Recommendations Assessment, Development, and Evaluation to rate the certainty of our evidence.\n\nWe included 2,972 patients across 43 studies. For fecal incontinence, adipose-derived stem cells plus fibrin glue and video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract showed the most consistent reductions compared with seton (moderate-high certainty). For pain, the JUMP seton technique (described by Khoshnevis et al) and video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract were associated with lower pain scores (moderate certainty). Soluble N-ethylmaleimide-sensitive factor attachment protein receptor, video-assisted anal fistula treatment combined with ligation of the intersphincteric fistula tract, and ligation of the intersphincteric fistula tract plus platelet-rich plasma showed higher quality-of-life scores compared with seton (moderate certainty). Recurrence was lower with adipose-derived stem cells plus fibrin glue (relative risk, 0.02) and acellular dermal matrix (relative risk, 0.08) compared with seton. Randomized controlled trial-only sensitivity analyses were consistent with low inconsistency.\n\nLigation and adhesive-based approaches showed an advantage over seton-based techniques in terms of fecal incontinence, pain, and quality-of-life results with comparable recurrence rates. These results highlight the importance of careful patient selection and choosing specific surgical approaches to improve patients' outcomes.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42674909/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 31 Aug 2026"}, {"id": "42562203", "title_en": "Invited commentary on \"Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery\"", "title_zh": "Invited commentary on \"Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery\"", "authors": "Samuel Eisenstein", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42562203/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 06 Aug 2026"}, {"id": "42437515", "title_en": "Malignant Transformation of Perianal Fistulas: A Systematic Review of the Literature", "title_zh": "Malignant Transformation of Perianal Fistulas: A Systematic Review of the Literature", "authors": "Rakesh Kumar Gupta", "abstract_en": "Malignant transformation of a perianal fistula is rare, predominantly associated with chronic fistula. Carcinogenesis is presumably initiated by chronic inflammation, and its mechanism is not clearly understood. We aimed to study the clinicopathologic characteristics and treatment outcomes of patients with malignant perianal fistula. A systematic literature search was performed on the electronic databases of PubMed, Scopus, and Web of Knowledge. A single-arm meta-analysis of non-comparative studies was performed using OpenMeta[Analyst] software. Eleven retrospective studies, including 172 patients (M: 135/F: 37), were included. The mean age of the patients was 56.89 years, and the most frequent presenting complaint was pain. The estimated mean duration of Crohn's disease (CD) was 30.61 years, and the mean duration of fistula before diagnosis was 17.92 years. The most commonly performed procedure was abdominoperineal resection (APR) and the most common histopathological subtype was adenocarcinoma. During the mean follow-up time of 40.56 months, 20.16% of patients had recurrence, and 35.62% of patients died. The pathophysiology of fistula-associated cancer is not well known, has diagnostic challenges, and the literature is sparse in predicting prognosis.", "abstract_zh": "Malignant transformation of a perianal fistula is rare, predominantly associated with chronic fistula. Carcinogenesis is presumably initiated by chronic inflammation, and its mechanism is not clearly understood. We aimed to study the clinicopathologic characteristics and treatment outcomes of patients with malignant perianal fistula. A systematic literature search was performed on the electronic databases of PubMed, Scopus, and Web of Knowledge. A single-arm meta-analysis of non-comparative studies was performed using OpenMeta[Analyst] software. Eleven retrospective studies, including 172 patients (M: 135/F: 37), were included. The mean age of the patients was 56.89 years, and the most frequent presenting complaint was pain. The estimated mean duration of Crohn's disease (CD) was 30.61 years, and the mean duration of fistula before diagnosis was 17.92 years. The most commonly performed procedure was abdominoperineal resection (APR) and the most common histopathological subtype was adenocarcinoma. During the mean follow-up time of 40.56 months, 20.16% of patients had recurrence, and 35.62% of patients died. The pathophysiology of fistula-associated cancer is not well known, has diagnostic challenges, and the literature is sparse in predicting prognosis.", "keywords_zh": "fistula‐in‐ano, malignancy, perianal fistula, transformation", "keywords_en": "fistula‐in‐ano, malignancy, perianal fistula, transformation", "link": "https://pubmed.ncbi.nlm.nih.gov/42437515/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sun, 12 Jul 2026"}, {"id": "42404302", "title_en": "Diffusion tensor imaging of the pelvic floor muscles and pelvic organs: a systematic review", "title_zh": "Diffusion tensor imaging of the pelvic floor muscles and pelvic organs: a systematic review", "authors": "Yan Chen", "abstract_en": "**Purpose:** This paper provides a systematic review of the current applications of diffusion tensor imaging (DTI) in the imaging of pelvic floor-related anatomical structures and the assessment of microscopic pathological changes.\n\n**Methods:** A systematic search of the PubMed, EMBASE, and Cochrane Library databases was conducted, with a focus on studies involving the application of diffusion tensor imaging to pelvic organs and muscles. The search was conducted from the inception of each database through to 11 December 2025. The present study incorporated a range of research methodologies, including randomized controlled trials (RCTs) and observational studies. The screening and reporting phases of the study adhered to the PRISMA guidelines, while the quality assessment was conducted using the Oxford Centre for Evidence-Based Medicine (OEBM) evidence grading tool.\n\n**Results:** The final sample comprised a total of 30 studies. Of these, two studies reported the application of DTI on the anal canal and its diagnostic value for anal fistula. Five studies demonstrated the ability of DTI to visualize microstructural alterations in endometriosis and uterine fibroids by measuring uterine anisotropy fraction and fibre tracking. A total of 19 studies reported the utilization of DTI applications in the context of prostate and prostate tumor analysis. Four studies have documented its use in healthy pelvic muscles and pelvic floor dysfunction.\n\n**Conclusion:** The findings suggest that the application of diffusion tensor imaging metrics in the pelvic region may aid in the assessment of tissue microstructural disruption and the distinction between benign and malignant or inflammatory lesions through relevant parameters, thereby enhancing diagnostic specificity. As diffusion tensor imaging becomes increasingly utilized in imaging for treatment guidance, it is imperative to develop a comprehensive understanding of its application in the pelvic region.", "abstract_zh": "This paper provides a systematic review of the current applications of diffusion tensor imaging (DTI) in the imaging of pelvic floor-related anatomical structures and the assessment of microscopic pathological changes.\n\nA systematic search of the PubMed, EMBASE, and Cochrane Library databases was conducted, with a focus on studies involving the application of diffusion tensor imaging to pelvic organs and muscles. The search was conducted from the inception of each database through to 11 December 2025. The present study incorporated a range of research methodologies, including randomized controlled trials (RCTs) and observational studies. The screening and reporting phases of the study adhered to the PRISMA guidelines, while the quality assessment was conducted using the Oxford Centre for Evidence-Based Medicine (OEBM) evidence grading tool.\n\nThe final sample comprised a total of 30 studies. Of these, two studies reported the application of DTI on the anal canal and its diagnostic value for anal fistula. Five studies demonstrated the ability of DTI to visualize microstructural alterations in endometriosis and uterine fibroids by measuring uterine anisotropy fraction and fibre tracking. A total of 19 studies reported the utilization of DTI applications in the context of prostate and prostate tumor analysis. Four studies have documented its use in healthy pelvic muscles and pelvic floor dysfunction.\n\nThe findings suggest that the application of diffusion tensor imaging metrics in the pelvic region may aid in the assessment of tissue microstructural disruption and the distinction between benign and malignant or inflammatory lesions through relevant parameters, thereby enhancing diagnostic specificity. As diffusion tensor imaging becomes increasingly utilized in imaging for treatment guidance, it is imperative to develop a comprehensive understanding of its application in the pelvic region.", "keywords_zh": "diffusion, diffusion tensor imaging, magnetic resonance imaging, pelvic floor, pelvic floor organ", "keywords_en": "diffusion, diffusion tensor imaging, magnetic resonance imaging, pelvic floor, pelvic floor organ", "link": "https://pubmed.ncbi.nlm.nih.gov/42404302/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 06 Jul 2026"}, {"id": "42392439", "title_en": "Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery", "title_zh": "Beyond incontinence: a systematic review and meta-analysis of sexual dysfunction after anal fistula surgery", "authors": "Vipul D Yagnik", "abstract_en": "**Background:** Traditional metrics for anal fistula surgery prioritize healing and continence, largely ignoring intimacy and psychosocial well-being. Addressing a critical literature gap, this novel systematic review and exploratory meta-analysis is the first to mathematically evaluate the sex-specific impacts of fistula surgery and seton placement on sexual function.\n\n**Methods:** A Preferred Reporting Items for Systematic Reviews and Meta-Analyzes-compliant search of PubMed, Embase, Scopus, and Cochrane databases identified studies using validated sexual indices: International Index of Erectile Function (IIEF) for males and the Female Sexual Function Index (FSFI), and targeted quality-of-life surveys for cryptoglandular or Crohn's-associated fistulas. This study uniquely pooled continuous pre- and postoperative functional data using standardized mean differences.\n\n**Results:** A total of 18 studies were included. The systematic review established a stark, previously unquantified sex dimorphism in surgical recovery. Definitive surgical cure yielded highly significant improvements in IIEF (male) by eradicating chronic suppuration (P <.001). Conversely, FSFI (female) showed negligible improvement or active deterioration, frequently complicated by anterior-tract dyspareunia. Furthermore, this review quantified the \"Seton Paradox:\" although loose setons successfully mitigate sepsis, cross-sectional pooling demonstrated that they inflict severe, statistically significant impairment on female sexual function (P =.02) and drive high rates of body-image avoidance across both genders. Crucially, the synthesis of patient-reported data revealed a systemic failure in informed consent, showing that 79% of patients never received preoperative sexual counseling.\n\n**Conclusion:** Anal fistula surgery inflicts a profound, sex-dimorphic toll on sexual function. As the first systematic review to objectively highlight this disparity and quantify the psychological burden of chronic setons, these findings mandate a clinical paradigm shift. Proactive counseling regarding dyspareunia, body image, and intimacy must become a mandatory component of preoperative informed consent.", "abstract_zh": "Traditional metrics for anal fistula surgery prioritize healing and continence, largely ignoring intimacy and psychosocial well-being. Addressing a critical literature gap, this novel systematic review and exploratory meta-analysis is the first to mathematically evaluate the sex-specific impacts of fistula surgery and seton placement on sexual function.\n\nA Preferred Reporting Items for Systematic Reviews and Meta-Analyzes-compliant search of PubMed, Embase, Scopus, and Cochrane databases identified studies using validated sexual indices: International Index of Erectile Function (IIEF) for males and the Female Sexual Function Index (FSFI), and targeted quality-of-life surveys for cryptoglandular or Crohn's-associated fistulas. This study uniquely pooled continuous pre- and postoperative functional data using standardized mean differences.\n\nA total of 18 studies were included. The systematic review established a stark, previously unquantified sex dimorphism in surgical recovery. Definitive surgical cure yielded highly significant improvements in IIEF (male) by eradicating chronic suppuration (P <.001). Conversely, FSFI (female) showed negligible improvement or active deterioration, frequently complicated by anterior-tract dyspareunia. Furthermore, this review quantified the \"Seton Paradox:\" although loose setons successfully mitigate sepsis, cross-sectional pooling demonstrated that they inflict severe, statistically significant impairment on female sexual function (P =.02) and drive high rates of body-image avoidance across both genders. Crucially, the synthesis of patient-reported data revealed a systemic failure in informed consent, showing that 79% of patients never received preoperative sexual counseling.\n\nAnal fistula surgery inflicts a profound, sex-dimorphic toll on sexual function. As the first systematic review to objectively highlight this disparity and quantify the psychological burden of chronic setons, these findings mandate a clinical paradigm shift. Proactive counseling regarding dyspareunia, body image, and intimacy must become a mandatory component of preoperative informed consent.", "keywords_zh": "Anal fistula, Crohn’s disease, Dyspareunia, Quality of life, Sexual dysfunction", "keywords_en": "Anal fistula, Crohn’s disease, Dyspareunia, Quality of life, Sexual dysfunction", "link": "https://pubmed.ncbi.nlm.nih.gov/42392439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 02 Jul 2026"}, {"id": "42329424", "title_en": "Biomarkers in the pathogenesis and diagnosis of Crohn's perianal fistulas: a systematic review", "title_zh": "Biomarkers in the pathogenesis and diagnosis of Crohn's perianal fistulas: a systematic review", "authors": "M D Santos", "abstract_en": "**Background And Aims:** Perianal fistulas in Crohn's disease (PFCD) continue to pose a therapeutic challenge owing to low rates of healing and remission. Identifying biomarkers involved in their pathogenesis and diagnosis is essential for personalising care and improving treatment outcomes. This systematic review aims to highlight PFCD biomarkers and provide insights for clinical practice.\n\n**Methods:** This systematic review, registered at PROSPERO (CRD42024575480) and conducted in accordance with PRISMA guidelines, includes English-language studies on PFCD biomarkers published through May 2025. Searches were performed in PubMed and Scopus. Study selection and risk-of-bias assessment were conducted independently by two reviewers, according to prespecified search and eligibility criteria.\n\n**Results:** Of 5242 records initially identified, 3700 were screened, and 33 studies were included (24 addressing pathogenesis and 9 diagnostic biomarkers). Variants in OCTN1/2, NOD2, IRGM, TYK2, and VDR genes influence fistula risk and severity in Crohn's disease, particularly polymorphisms in IRGM, NOD2, and genes within the JAK-STAT signalling pathway. Altered microbiota and the presence of antibiotic resistance genes support a bacterial role in pathogenesis. Key pro-inflammatory cytokines (IL-1β, TNF-α, IL-6) and cellular populations (CD4⁺ T-cells, macrophages) drive inflammation, while epithelial-mesenchymal transition and extracellular matrix remodelling contribute to fistula persistence. Recent evidence suggests that PFCD arises from complex immune-stromal cell interactions, involving cellular senescence, epigenetic alterations, and population heterogeneity. Diagnostic advances include metabolic profiling and urinary Raman spectroscopy, alongside established biomarkers such as granulomas, faecal calprotectin, and NGAL.\n\n**Conclusions:** This review highlights several promising biomarkers involved in the pathogenesis and diagnosis of PFCD; however, heterogeneity across studies limits their immediate translation into clinical guidelines. Larger, well-designed studies are needed to validate these biomarkers and support personalised treatment strategies.", "abstract_zh": "Perianal fistulas in Crohn's disease (PFCD) continue to pose a therapeutic challenge owing to low rates of healing and remission. Identifying biomarkers involved in their pathogenesis and diagnosis is essential for personalising care and improving treatment outcomes. This systematic review aims to highlight PFCD biomarkers and provide insights for clinical practice.\n\nThis systematic review, registered at PROSPERO (CRD42024575480) and conducted in accordance with PRISMA guidelines, includes English-language studies on PFCD biomarkers published through May 2025. Searches were performed in PubMed and Scopus. Study selection and risk-of-bias assessment were conducted independently by two reviewers, according to prespecified search and eligibility criteria.\n\nOf 5242 records initially identified, 3700 were screened, and 33 studies were included (24 addressing pathogenesis and 9 diagnostic biomarkers). Variants in OCTN1/2, NOD2, IRGM, TYK2, and VDR genes influence fistula risk and severity in Crohn's disease, particularly polymorphisms in IRGM, NOD2, and genes within the JAK-STAT signalling pathway. Altered microbiota and the presence of antibiotic resistance genes support a bacterial role in pathogenesis. Key pro-inflammatory cytokines (IL-1β, TNF-α, IL-6) and cellular populations (CD4⁺ T-cells, macrophages) drive inflammation, while epithelial-mesenchymal transition and extracellular matrix remodelling contribute to fistula persistence. Recent evidence suggests that PFCD arises from complex immune-stromal cell interactions, involving cellular senescence, epigenetic alterations, and population heterogeneity. Diagnostic advances include metabolic profiling and urinary Raman spectroscopy, alongside established biomarkers such as granulomas, faecal calprotectin, and NGAL.\n\nThis review highlights several promising biomarkers involved in the pathogenesis and diagnosis of PFCD; however, heterogeneity across studies limits their immediate translation into clinical guidelines. Larger, well-designed studies are needed to validate these biomarkers and support personalised treatment strategies.", "keywords_zh": "Biomarkers, Crohn's disease, Diagnosis, Pathogenesis, Perianal fistula", "keywords_en": "Biomarkers, Crohn's disease, Diagnosis, Pathogenesis, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/42329424/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 22 Jun 2026"}, {"id": "42161324", "title_en": "Intestinal ultrasound to detect postoperative recurrence in patients with Crohn's disease: an international, multidisciplinary, RAND/UCLA appropriateness method study", "title_zh": "Intestinal ultrasound to detect postoperative recurrence in patients with Crohn's disease: an international, multidisciplinary, RAND/UCLA appropriateness method study", "authors": "Kerri L Novak", "abstract_en": "**Background:** Intestinal ultrasound is a non-invasive method increasingly used to diagnose and monitor disease activity in patients with inflammatory bowel disease; however, there is no consensus on the appropriate implementation of intestinal ultrasound to assess postoperative recurrence in Crohn's disease. We aimed to develop expert-based recommendations for standardising intestinal ultrasound use for the detection and evaluation of postoperative Crohn's disease recurrence.\n\n**Methods:** An international, multidisciplinary, modified RAND/University of California Los Angeles appropriateness method was used. Based on a systematic review and meta-analysis of the literature, expert opinion, and panellist feedback, a list of statements related to the use of intestinal ultrasound in this setting was generated. Panellists with expertise in Crohn's disease intestinal ultrasound, surgery, postoperative management, clinical trials, and outcome measures were invited. Panellists rated the appropriateness of each statement on a 9-point Likert scale in two rounds of voting, with statements classified as appropriate, inappropriate, or uncertain based on median panel rating and the presence of disagreement, then met in person to discuss the results and vote on the appropriate and inappropriate statements in a final round of ratification voting. Statements ratified by 75% or more of the panellists were incorporated into the final recommendations.\n\n**Findings:** The first online survey was open to the panellists from June 21, 2024, to Aug 6, 2024, and the second survey round was available between Nov 1 and Nov 25, 2024. The in-person ratification meeting was held on Feb 21, 2025. The panel comprised 16 experts (12 [75%] men and four [25%] women) from nine countries (Brazil, Canada, Denmark, Germany, Italy, the Netherlands, Spain, the UK, and the USA) with specialties in gastroenterology (n=10), colorectal surgery (n=4), and radiology (n=2). The overall response rate was 100% (all 16 panellists) for the first round of voting and 94% (15 of 16) for the second round of voting, with 12 (75%) of 16 panellists participating in ratification voting. The first survey contained 116 statements, with 88 (76%) rated as appropriate, two (2%) as inappropriate, and 26 (22%) as uncertain. Of the 122 statements in the second survey, 97 (80%) were rated appropriate, two (2%) were inappropriate, and 23 (19%) were uncertain. 79 statements were voted on during the ratification meeting and 67 (85%) were ratified. Recommended anatomical components for sonographic evaluation were the colonic segment immediately distal to the anastomosis, the neoterminal ileum, neoterminal ileal inlet, colonic and ileal blind side of the anastomosis, sonographically visible colonic segments, and the surrounding mesentery. Recommended parameters for assessment were bowel wall thickness, bowel wall stratification, bowel wall vascularity; mesenteric inflammatory fat and lymphadenopathy; luminal narrowing; and the presence of complications (abscess, inflammatory mass, fistula or sinus tract, stricture and stricture length, and prestenotic dilation). Intestinal ultrasound findings in the neoterminal ileum and the inlet of the neoterminal ileum were considered most likely to reflect clinically meaningful disease activity. Waiting at least 4 weeks after surgery to perform intestinal ultrasound was recommended to avoid confounding the interpretation of sonographic findings with immediate postoperative complications or changes associated with surgical healing. The first assessment is recommended to be performed 3-12 months after surgery.\n\n**Interpretation:** These multidisciplinary recommendations aim to standardise the application of intestinal ultrasound for assessing postoperative recurrence of Crohn's disease after surgical bowel ileocolic resection. Future development of a reliable, validated index for Crohn's disease postoperative recurrence is an important next step.\n\n**Funding:** Johnson & Johnson Innovative Medicine.", "abstract_zh": "Intestinal ultrasound is a non-invasive method increasingly used to diagnose and monitor disease activity in patients with inflammatory bowel disease; however, there is no consensus on the appropriate implementation of intestinal ultrasound to assess postoperative recurrence in Crohn's disease. We aimed to develop expert-based recommendations for standardising intestinal ultrasound use for the detection and evaluation of postoperative Crohn's disease recurrence.\n\nAn international, multidisciplinary, modified RAND/University of California Los Angeles appropriateness method was used. Based on a systematic review and meta-analysis of the literature, expert opinion, and panellist feedback, a list of statements related to the use of intestinal ultrasound in this setting was generated. Panellists with expertise in Crohn's disease intestinal ultrasound, surgery, postoperative management, clinical trials, and outcome measures were invited. Panellists rated the appropriateness of each statement on a 9-point Likert scale in two rounds of voting, with statements classified as appropriate, inappropriate, or uncertain based on median panel rating and the presence of disagreement, then met in person to discuss the results and vote on the appropriate and inappropriate statements in a final round of ratification voting. Statements ratified by 75% or more of the panellists were incorporated into the final recommendations.\n\nThe first online survey was open to the panellists from June 21, 2024, to Aug 6, 2024, and the second survey round was available between Nov 1 and Nov 25, 2024. The in-person ratification meeting was held on Feb 21, 2025. The panel comprised 16 experts (12 [75%] men and four [25%] women) from nine countries (Brazil, Canada, Denmark, Germany, Italy, the Netherlands, Spain, the UK, and the USA) with specialties in gastroenterology (n=10), colorectal surgery (n=4), and radiology (n=2). The overall response rate was 100% (all 16 panellists) for the first round of voting and 94% (15 of 16) for the second round of voting, with 12 (75%) of 16 panellists participating in ratification voting. The first survey contained 116 statements, with 88 (76%) rated as appropriate, two (2%) as inappropriate, and 26 (22%) as uncertain. Of the 122 statements in the second survey, 97 (80%) were rated appropriate, two (2%) were inappropriate, and 23 (19%) were uncertain. 79 statements were voted on during the ratification meeting and 67 (85%) were ratified. Recommended anatomical components for sonographic evaluation were the colonic segment immediately distal to the anastomosis, the neoterminal ileum, neoterminal ileal inlet, colonic and ileal blind side of the anastomosis, sonographically visible colonic segments, and the surrounding mesentery. Recommended parameters for assessment were bowel wall thickness, bowel wall stratification, bowel wall vascularity; mesenteric inflammatory fat and lymphadenopathy; luminal narrowing; and the presence of complications (abscess, inflammatory mass, fistula or sinus tract, stricture and stricture length, and prestenotic dilation). Intestinal ultrasound findings in the neoterminal ileum and the inlet of the neoterminal ileum were considered most likely to reflect clinically meaningful disease activity. Waiting at least 4 weeks after surgery to perform intestinal ultrasound was recommended to avoid confounding the interpretation of sonographic findings with immediate postoperative complications or changes associated with surgical healing. The first assessment is recommended to be performed 3-12 months after surgery.\n\nThese multidisciplinary recommendations aim to standardise the application of intestinal ultrasound for assessing postoperative recurrence of Crohn's disease after surgical bowel ileocolic resection. Future development of a reliable, validated index for Crohn's disease postoperative recurrence is an important next step.\n\nJohnson & Johnson Innovative Medicine.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42161324/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 20 May 2026"}, {"id": "42069871", "title_en": "Clinical and surgical management of recto-urinary fistula after radical prostatectomy: a systematic review on current evidence", "title_zh": "Clinical and surgical management of recto-urinary fistula after radical prostatectomy: a systematic review on current evidence", "authors": "Marco Bandini", "abstract_en": "**Background:** Management of rectourinary fistula (RUF) is challenging due to limited data and variability in presentation and treatment. We conducted a systematic review of radical prostatectomy (RP)-related RUF to assess clinical features, diagnostics, treatments, and outcomes, and to propose a structured algorithm to guide management.\n\n**Methods:** We conducted a systematic review in accordance with PRISMA guidelines to evaluate the clinical presentation, diagnostic strategies, management approaches, and outcomes of RUF following RP. A comprehensive search of PubMed, Embase, and Web of Science was performed from database inception to January 2025. Data were extracted on patient demographics, symptoms, diagnostic modalities, management strategies, surgical repair techniques and treatment outcomes.\n\n**Results:** A total of 455 cases of RUF following RP were identified across 34 studies. The reported incidence of RUF ranged from <0.01% to 1.5%. The most frequent presenting symptoms were urine leakage per rectum (60.7%), fecaluria (44.1%), and pneumaturia (50.0%). Fecal and/or urinary diversion was utilized in over 60% of cases, with a median stoma duration of 3 months and an indwelling urinary catheter duration of 1 month. Conservative management (observation, fluid replacement and antibiotic therapy) was attempted in a minority of patients and was generally associated with success rates below 50%. Surgical repair was performed in nearly all cases, with the transperineal and transsphincteric approaches being the most commonly employed techniques. The median time to fistula closure ranged from 0.5 to 30 months, with reported surgical success rates varying between 41% and 100%. We propose a management flowchart based on our clinical experience, outlining the diagnostic and therapeutic approach to rectal injury and RP-related RUF.\n\n**Conclusions:** RUF after RP remains a challenging complication, often requiring stepwise management. Conservative treatments rarely succeed, and surgery is often necessary. Our proposed algorithm aims to standardize the approach to RI and RUF, guiding treatment decisions and improving outcomes.", "abstract_zh": "Management of rectourinary fistula (RUF) is challenging due to limited data and variability in presentation and treatment. We conducted a systematic review of radical prostatectomy (RP)-related RUF to assess clinical features, diagnostics, treatments, and outcomes, and to propose a structured algorithm to guide management.\n\nWe conducted a systematic review in accordance with PRISMA guidelines to evaluate the clinical presentation, diagnostic strategies, management approaches, and outcomes of RUF following RP. A comprehensive search of PubMed, Embase, and Web of Science was performed from database inception to January 2025. Data were extracted on patient demographics, symptoms, diagnostic modalities, management strategies, surgical repair techniques and treatment outcomes.\n\nA total of 455 cases of RUF following RP were identified across 34 studies. The reported incidence of RUF ranged from <0.01% to 1.5%. The most frequent presenting symptoms were urine leakage per rectum (60.7%), fecaluria (44.1%), and pneumaturia (50.0%). Fecal and/or urinary diversion was utilized in over 60% of cases, with a median stoma duration of 3 months and an indwelling urinary catheter duration of 1 month. Conservative management (observation, fluid replacement and antibiotic therapy) was attempted in a minority of patients and was generally associated with success rates below 50%. Surgical repair was performed in nearly all cases, with the transperineal and transsphincteric approaches being the most commonly employed techniques. The median time to fistula closure ranged from 0.5 to 30 months, with reported surgical success rates varying between 41% and 100%. We prop
