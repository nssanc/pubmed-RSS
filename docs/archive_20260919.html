                return {
                    feeds: {"肛周脓肿": [{"id": "41904989", "title_en": "Risk factors for postoperative complications in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Risk factors for postoperative complications in Crohn's disease: A systematic review and meta-analysis", "authors": "Michał Mik", "abstract_en": "**Background:** Crohn's disease (CD) is a non-specific inflammatory bowel disorder for which no definitive cure is available. The primary management strategy is pharmacological treatment aimed at alleviating symptoms. However, many patients ultimately require surgical intervention to manage complications arising from the disease.\n\n**Objectives:** The aim of this study was to investigate disease-related factors that may increase the risk of early postoperative complications in patients with CD.\n\n**Material And Methods:** A meta-analysis was conducted based on studies examining early surgical and medical complications following abdominal surgery for CD. The analyzed risk factors included disease duration prior to surgery, history of previous surgeries, presence of concurrent perianal disease, intra-abdominal abscess during surgery, and Montreal classification subtypes A1-3, L1-4, and B1-3. A systematic review was performed using 4 major databases: PubMed, Cochrane Library, Academic Search Ultimate (EBSCO), and Google Scholar. Outcomes were assessed using the odds ratio (OR) and response ratio (R), together with 95% confidence intervals (95% CIs). Egger's test was used to evaluate publication bias. Heterogeneity was assessed using the I2 statistic, with I2 > 50% indicating significant variability.\n\n**Results:** A total of 51 articles met the inclusion criteria. The analysis identified several significant risk-increasing factors: history of previous surgeries (OR = 1.39; 95% CI: 1.23-1.57), Montreal classification group B3 (OR = 1.26; 95% CI: 1.11-1.42), disease duration before surgery (R = 1.10; 95% CI: 1.02-1.18), and group L2 (OR = 1.38; 95% CI: 1.11-1.72). Conversely, factors associated with a reduced risk of postoperative complications included group L1 (OR = 0.81; 95% CI: 0.71-0.92) and group B2 (OR = 0.81; 95% CI: 0.71-0.91).\n\n**Conclusion:** This meta-analysis aggregated data from a broad spectrum of patients and treatment settings across multiple institutions worldwide. Although some risk of bias and heterogeneity was observed, the findings nevertheless highlight the importance of considering disease subtype and progression when assessing the likelihood of postoperative complications in patients with CD. This knowledge may be valuable for optimizing treatment strategies.", "abstract_zh": "Crohn's disease (CD) is a non-specific inflammatory bowel disorder for which no definitive cure is available. The primary management strategy is pharmacological treatment aimed at alleviating symptoms. However, many patients ultimately require surgical intervention to manage complications arising from the disease.\n\nThe aim of this study was to investigate disease-related factors that may increase the risk of early postoperative complications in patients with CD.\n\nA meta-analysis was conducted based on studies examining early surgical and medical complications following abdominal surgery for CD. The analyzed risk factors included disease duration prior to surgery, history of previous surgeries, presence of concurrent perianal disease, intra-abdominal abscess during surgery, and Montreal classification subtypes A1-3, L1-4, and B1-3. A systematic review was performed using 4 major databases: PubMed, Cochrane Library, Academic Search Ultimate (EBSCO), and Google Scholar. Outcomes were assessed using the odds ratio (OR) and response ratio (R), together with 95% confidence intervals (95% CIs). Egger's test was used to evaluate publication bias. Heterogeneity was assessed using the I2 statistic, with I2 > 50% indicating significant variability.\n\nA total of 51 articles met the inclusion criteria. The analysis identified several significant risk-increasing factors: history of previous surgeries (OR = 1.39; 95% CI: 1.23-1.57), Montreal classification group B3 (OR = 1.26; 95% CI: 1.11-1.42), disease duration before surgery (R = 1.10; 95% CI: 1.02-1.18), and group L2 (OR = 1.38; 95% CI: 1.11-1.72). Conversely, factors associated with a reduced risk of postoperative complications included group L1 (OR = 0.81; 95% CI: 0.71-0.92) and group B2 (OR = 0.81; 95% CI: 0.71-0.91).\n\nThis meta-analysis aggregated data from a broad spectrum of patients and treatment settings across multiple institutions worldwide. Although some risk of bias and heterogeneity was observed, the findings nevertheless highlight the importance of considering disease subtype and progression when assessing the likelihood of postoperative complications in patients with CD. This knowledge may be valuable for optimizing treatment strategies.", "keywords_zh": "Crohn’s disease, abdominal surgery, disease progression, postoperative complications, risk factors", "keywords_en": "Crohn’s disease, abdominal surgery, disease progression, postoperative complications, risk factors", "link": "https://pubmed.ncbi.nlm.nih.gov/41904989/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Sun, 29 Mar 2026"}, {"id": "41873840", "title_en": "Transperineal ultrasonography in detecting penetrating perianal disease: a systematic review and meta-analysis", "title_zh": "Transperineal ultrasonography in detecting penetrating perianal disease: a systematic review and meta-analysis", "authors": "Krisztina Gecse", "abstract_en": "**Background And Aims:** Perianal complications such as fistulas and abscesses are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\n**Methods:** A comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\n**Results:** Of 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\n**Conclusions:** TPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "abstract_zh": "Perianal complications such as fistulas and abscesses are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\nA comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\nOf 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\nTPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "keywords_zh": "TPUS, abscess, perianal fistula, perianal fistulizing Crohn’s disease, transperineal ultrasound", "keywords_en": "TPUS, abscess, perianal fistula, perianal fistulizing Crohn’s disease, transperineal ultrasound", "link": "https://pubmed.ncbi.nlm.nih.gov/41873840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Tue, 24 Mar 2026"}, {"id": "41693361", "title_en": "Systematic Review of Published Guidelines: Recommendations for Exams Under Anaesthesia, Seton Insertion and Timing of Seton Removal for Perianal and Rectovaginal Fistulising Crohn's Disease", "title_zh": "Systematic Review of Published Guidelines: Recommendations for Exams Under Anaesthesia, Seton Insertion and Timing of Seton Removal for Perianal and Rectovaginal Fistulising Crohn's Disease", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background And Aims:** Perianal fistulising Crohn's disease (pfCD) is a heterogeneous phenotype of Crohn's disease with marked variability in anatomical complexity, symptomatology, and disease trajectory. This often creates uncertainty in the optimal approach to management, particularly the surgical aspects of when to perform examination under anaesthesia (EUA) and when to insert or remove setons.\n\n**Methods:** We conducted a systematic review following PRISMA guidelines. Multiple databases were searched from inception through December 2025. Eligible publications included clinical guidelines on pfCD and/or rectovaginal fistulas that reported indications for EUA, seton insertion, and/or seton removal. We stratified recommendations by fistula complexity, the presence of abscesses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\n**Results:** Twenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\n**Conclusion:** Substantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "abstract_zh": "Perianal fistulising Crohn's disease (pfCD) is a heterogeneous phenotype of Crohn's disease with marked variability in anatomical complexity, symptomatology, and disease trajectory. This often creates uncertainty in the optimal approach to management, particularly the surgical aspects of when to perform examination under anaesthesia (EUA) and when to insert or remove setons.\n\nWe conducted a systematic review following PRISMA guidelines. Multiple databases were searched from inception through December 2025. Eligible publications included clinical guidelines on pfCD and/or rectovaginal fistulas that reported indications for EUA, seton insertion, and/or seton removal. We stratified recommendations by fistula complexity, the presence of abscesses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\nTwenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\nSubstantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "keywords_zh": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "keywords_en": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41693361/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 16 Feb 2026"}, {"id": "41359092", "title_en": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "title_zh": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "authors": "A Hart", "abstract_en": "**Introduction:** Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\n**Methods:** A literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\n**Results:** Of 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, cleft closure, omentoplasty, skin grafting, gracilis and rectus abdominis flap, platelet-derived growth factor, curettage, lay open and excision of sinuses. Reported healing rates ranged from 30% to 100%. Heterogeneity in the reporting of outcomes, as well as the interventions performed precluded meta-analysis.\n\n**Conclusion:** The published evidence for treatment of PPS in IBD consists of low-quality evidence case series with high risk of bias. There is a need for standardised outcome reporting and high-quality, prospective studies to establish effective treatment algorithms.", "abstract_zh": "Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\nA literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\nOf 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, cleft closure, omentoplasty, skin grafting, gracilis and rectus abdominis flap, platelet-derived growth factor, curettage, lay open and excision of sinuses. Reported healing rates ranged from 30% to 100%. Heterogeneity in the reporting of outcomes, as well as the interventions performed precluded meta-analysis.\n\nThe published evidence for treatment of PPS in IBD consists of low-quality evidence case series with high risk of bias. There is a need for standardised outcome reporting and high-quality, prospective studies to establish effective treatment algorithms.", "keywords_zh": "Fistulizing perianal Crohn’s disease, Perianal abscess", "keywords_en": "Fistulizing perianal Crohn’s disease, Perianal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/41359092/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 08 Dec 2025"}, {"id": "41219674", "title_en": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\n**Methods:** MEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\n**Results:** Eighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\n**Conclusions:** This systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "abstract_zh": "While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\nMEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\nEighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\nThis systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "keywords_zh": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "keywords_en": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/41219674/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Tue, 11 Nov 2025"}, {"id": "41159400", "title_en": "Management of Perianal Sepsis in Neutropenic Patients With Haematological Malignancies-A Systematic Review", "title_zh": "Management of Perianal Sepsis in Neutropenic Patients With Haematological Malignancies-A Systematic Review", "authors": "Zi Qin Ng", "abstract_en": "**Introduction:** Despite neutropenia being considered a significant risk factor for acute perianal sepsis, there is a lack of consensus on treatment guidelines for perianal abscess in the immunocompromised patient, specifically in patients with neutropenia secondary to a haematological malignancy. The aim of the article is to review the available literature on. Whether surgical intervention produces better outcomes than a non-surgical approach for perianal sepsis in the immunocompromised patient with a haematological malignancy.\n\n**Methods:** Relevant papers were identified through electronic databases including PubMed, Medline and Scopus. Data were extracted independently by two authors on a Microsoft Excel spreadsheet up to July 2024.\n\n**Results:** A total of eight studies were included in the final analysis (124 cases). Perianal or rectal pain (n = 81, 65.3%) was the most reported complaint, followed by fever (n = 72, 58.1%), swelling and induration (n = 54, 43.5%) and erythema was reported in 26 (21.0%) cases. The most common organisms cultured from blood and anorectum were Escherichia coli and Pseudomonas aeruginosa. A total of 12 deaths (18.8%) were reported out of the 64 patients who underwent conservative management, while 10 (16.7%) deaths were reported out of 60 patients who underwent surgical management. Complete wound healing or good wound granulation was achieved for 35 (54.7%) patients in the conservative group and 35 (58.3%) patients in the surgical group.\n\n**Conclusion:** Our review suggests that conservative management is an acceptable treatment in carefully selected patients without an obvious perianal abscess on cross-sectional radiological imaging.", "abstract_zh": "Despite neutropenia being considered a significant risk factor for acute perianal sepsis, there is a lack of consensus on treatment guidelines for perianal abscess in the immunocompromised patient, specifically in patients with neutropenia secondary to a haematological malignancy. The aim of the article is to review the available literature on. Whether surgical intervention produces better outcomes than a non-surgical approach for perianal sepsis in the immunocompromised patient with a haematological malignancy.\n\nRelevant papers were identified through electronic databases including PubMed, Medline and Scopus. Data were extracted independently by two authors on a Microsoft Excel spreadsheet up to July 2024.\n\nA total of eight studies were included in the final analysis (124 cases). Perianal or rectal pain (n = 81, 65.3%) was the most reported complaint, followed by fever (n = 72, 58.1%), swelling and induration (n = 54, 43.5%) and erythema was reported in 26 (21.0%) cases. The most common organisms cultured from blood and anorectum were Escherichia coli and Pseudomonas aeruginosa. A total of 12 deaths (18.8%) were reported out of the 64 patients who underwent conservative management, while 10 (16.7%) deaths were reported out of 60 patients who underwent surgical management. Complete wound healing or good wound granulation was achieved for 35 (54.7%) patients in the conservative group and 35 (58.3%) patients in the surgical group.\n\nOur review suggests that conservative management is an acceptable treatment in carefully selected patients without an obvious perianal abscess on cross-sectional radiological imaging.", "keywords_zh": "abscess neutropenia, anorectal, immunocompromised, perianal", "keywords_en": "abscess neutropenia, anorectal, immunocompromised, perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/41159400/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Wed, 29 Oct 2025"}, {"id": "40983150", "title_en": "Management of Perianal Abscesses in Infants: A Systematic Review From the APSA Outcomes and Evidence-Based Practice Committee", "title_zh": "Management of Perianal Abscesses in Infants: A Systematic Review From the APSA Outcomes and Evidence-Based Practice Committee", "authors": "American Pediatric Surgical Association Outcomes and Evidence-Based Practice Committee", "abstract_en": "**Background:** Management of infant perianal disease, including perianal abscess and fistula-in- ano (FIA), remains controversial. There is lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\n**Methods:** The American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\n**Results:** Over 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\n**Conclusions:** Both operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\n**Type Of Study:** Systematic Review of level 3-4 studies.\n\n**Level Of Evidence:** Level 4.", "abstract_zh": "Management of infant perianal disease, including perianal abscess and fistula-in- ano (FIA), remains controversial. There is lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\nThe American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\nOver 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\nBoth operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\nSystematic Review of level 3-4 studies.\n\nLevel 4.", "keywords_zh": "Fistula-in-ano, Fistulotomy, Infants, Perianal abscess, Perirectal abscess", "keywords_en": "Fistula-in-ano, Fistulotomy, Infants, Perianal abscess, Perirectal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/40983150/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 22 Sep 2025"}, {"id": "40740890", "title_en": "Epidemiology, treatment patterns, and associated risk factors in perianal fistulizing Crohn's disease: A systematic literature review", "title_zh": "Epidemiology, treatment patterns, and associated risk factors in perianal fistulizing Crohn's disease: A systematic literature review", "authors": "Julian Panés", "abstract_en": "**Background:** Data regarding complex Crohn's perianal fistulas (CPF) epidemiology are limited, and optimal treatment strategies are elusive. An improved understanding of how CPF treatment options are used in the real-world setting and factors associated with CPF development, treatment failure, and reasons for undergoing multiple surgeries may help to inform optimal patient management strategies, reduce treatment burden, and improve outcomes in patients with CPF.\n\n**Aim:** To describe the epidemiology, treatments, outcomes, and associated risk/protective factors for complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, EMBASE, EBM Reviews, EconLit) were searched. Two reviewers independently used populations, interventions, comparators, outcomes, study designs, and time criteria to identify relevant studies. Observational studies published in English from January 1, 2015 to February 17, 2022 with > 50 patients were included, even if complex CPF was not defined. Items of interest included complex CPF definitions, epidemiology, treatment patterns, morbidity, mortality, and risk factors associated with complex CPF development, treatment failure, and undergoing multiple surgeries. Data were reported using descriptive statistics.\n\n**Results:** Overall, 140 studies were included. Complex CPF definitions were heterogeneous and rarely reported (24 studies). Hence, data mostly related to CPF in general. CPF prevalence was variable (range: 1.5%-81.0%). Incidence was wide-ranging and mostly reported cumulatively at 1-year post-Crohn's disease diagnosis (range: 3.5%-50.1%). Overall healing and failure rates after treatment were in the range of 10.5%-80.2% and 3.6%-83.0%, respectively. Abscesses were the most frequently reported morbidity (<i>n =</i> 18). No CPF-related deaths were reported. No consistent risk or protective factors were identified.\n\n**Conclusion:** Epidemiology, treatment patterns, and risk factors for CPF vary, likely due to inconsistent CPF and clinical outcome definitions. Standardization would facilitate comparability, which may inform optimal complex CPF treatment strategies.", "abstract_zh": "Data regarding complex Crohn's perianal fistulas (CPF) epidemiology are limited, and optimal treatment strategies are elusive. An improved understanding of how CPF treatment options are used in the real-world setting and factors associated with CPF development, treatment failure, and reasons for undergoing multiple surgeries may help to inform optimal patient management strategies, reduce treatment burden, and improve outcomes in patients with CPF.\n\nTo describe the epidemiology, treatments, outcomes, and associated risk/protective factors for complex CPF.\n\nElectronic databases (MEDLINE, EMBASE, EBM Reviews, EconLit) were searched. Two reviewers independently used populations, interventions, comparators, outcomes, study designs, and time criteria to identify relevant studies. Observational studies published in English from January 1, 2015 to February 17, 2022 with > 50 patients were included, even if complex CPF was not defined. Items of interest included complex CPF definitions, epidemiology, treatment patterns, morbidity, mortality, and risk factors associated with complex CPF development, treatment failure, and undergoing multiple surgeries. Data were reported using descriptive statistics.\n\nOverall, 140 studies were included. Complex CPF definitions were heterogeneous and rarely reported (24 studies). Hence, data mostly related to CPF in general. CPF prevalence was variable (range: 1.5%-81.0%). Incidence was wide-ranging and mostly reported cumulatively at 1-year post-Crohn's disease diagnosis (range: 3.5%-50.1%). Overall healing and failure rates after treatment were in the range of 10.5%-80.2% and 3.6%-83.0%, respectively. Abscesses were the most frequently reported morbidity (<i>n =</i> 18). No CPF-related deaths were reported. No consistent risk or protective factors were identified.\n\nEpidemiology, treatment patterns, and risk factors for CPF vary, likely due to inconsistent CPF and clinical outcome definitions. Standardization would facilitate comparability, which may inform optimal complex CPF treatment strategies.", "keywords_zh": "Complex perianal fistula, Crohn’s disease, Epidemiology, Morbidity, Risk factors, Treatment patterns", "keywords_en": "Complex perianal fistula, Crohn’s disease, Epidemiology, Morbidity, Risk factors, Treatment patterns", "link": "https://pubmed.ncbi.nlm.nih.gov/40740890/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 31 Jul 2025"}, {"id": "40585484", "title_en": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "title_zh": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "authors": "Li Xu", "abstract_en": "**Introduction:** The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\n**Material And Methods:** A thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\n**Results:** A total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\n**Conclusion:** The available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "abstract_zh": "The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\nA thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\nA total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\nThe available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\nhttps://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "keywords_zh": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "keywords_en": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40585484/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Mon, 30 Jun 2025"}, {"id": "40538531", "title_en": "The Correlation between Hidradenitis Suppurativa and Irritable Bowel Diseases: A Systematic Review", "title_zh": "The Correlation between Hidradenitis Suppurativa and Irritable Bowel Diseases: A Systematic Review", "authors": "Ayezel Munoz Gonzalez", "abstract_en": "**Background:** Hidradenitis suppurativa (HS) is an inflammatory skin condition that presents with nodules or abscesses associated with sinus tracts. Inflammatory bowel diseases (IBD) are inflammatory gastrointestinal (GI) conditions presenting with irregular bowel movements. Although HS and IBDs may have similarities in their clinical presentation and pathophysiology, they can differ in their cutaneous manifestations. Both conditions are potentially caused by genetic changes in the human leukocyte antigen (HLA), cause skin inflammation, and are characterized by abscesses in the GI and sinus tracts.\n\n**Objective:** We sought to determine the extent of coincident IBD and HS and the associated risk factors.\n\n**Methods:** The Ovid Medline database was searched for all current literature on the correlations between HS and IBD. Articles were then included and removed according to specific inclusion and exclusion criteria, and a systematic review was performed on the remaining articles.\n\n**Results:** Thirteen papers that met the inclusion and the exclusion criteria were selected, and after data collection, a significant correlation was found between the development of HS and IBD. Most of the articles reviewed stated that the corresponding association was a causal link between the two diseases. Furthermore, there were various risk factors and comorbidities associated with HS and the development of IBD, including smoking, obesity, perianal disease, and genetic predispositions such as HLA-B27 mutations.\n\n**Discussion:** Studies show that there is a potential correlation with HS and IBDs. Additional research should to determine the genetic correlations between HS and IBDs and the underlying pathophysiological mechanism.", "abstract_zh": "Hidradenitis suppurativa (HS) is an inflammatory skin condition that presents with nodules or abscesses associated with sinus tracts. Inflammatory bowel diseases (IBD) are inflammatory gastrointestinal (GI) conditions presenting with irregular bowel movements. Although HS and IBDs may have similarities in their clinical presentation and pathophysiology, they can differ in their cutaneous manifestations. Both conditions are potentially caused by genetic changes in the human leukocyte antigen (HLA), cause skin inflammation, and are characterized by abscesses in the GI and sinus tracts.\n\nWe sought to determine the extent of coincident IBD and HS and the associated risk factors.\n\nThe Ovid Medline database was searched for all current literature on the correlations between HS and IBD. Articles were then included and removed according to specific inclusion and exclusion criteria, and a systematic review was performed on the remaining articles.\n\nThirteen papers that met the inclusion and the exclusion criteria were selected, and after data collection, a significant correlation was found between the development of HS and IBD. Most of the articles reviewed stated that the corresponding association was a causal link between the two diseases. Furthermore, there were various risk factors and comorbidities associated with HS and the development of IBD, including smoking, obesity, perianal disease, and genetic predispositions such as HLA-B27 mutations.\n\nStudies show that there is a potential correlation with HS and IBDs. Additional research should to determine the genetic correlations between HS and IBDs and the underlying pathophysiological mechanism.", "keywords_zh": "Hidradenitis suppurativa, autoimmunity, dermatology, gastroenterology, irritable bowel diseases", "keywords_en": "Hidradenitis suppurativa, autoimmunity, dermatology, gastroenterology, irritable bowel diseases", "link": "https://pubmed.ncbi.nlm.nih.gov/40538531/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Fri, 20 Jun 2025"}, {"id": "40210078", "title_en": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "title_zh": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "authors": "TOpClass collaborative authors", "abstract_en": "**Background & Aims:** Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\n**Methods:** The study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\n**Results:** A radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\n**Conclusions:** This international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "abstract_zh": "Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\nThe study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\nA radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\nThis international Delphi consensus standardizes radiological endpoints in pfCD, improving consistency in clinical and research settings. Future studies will validate this definition and assess how radiological changes predict long-term clinical outcomes and quality of life improvements.", "keywords_zh": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "keywords_en": "Endpoints, Fistula, Healing, MRI, Perianal Fistulising Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40210078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 10 Apr 2025"}, {"id": "40155532", "title_en": "Early diagnosis of Crohn's disease in patients presenting with a perianal fistula: systematic review and development of a perianal red flags index", "title_zh": "Early diagnosis of Crohn's disease in patients presenting with a perianal fistula: systematic review and development of a perianal red flags index", "authors": "J D W van der Bilt", "abstract_en": "**Background:** Delay in diagnosing Crohn's disease (CD) in patients presenting with perianal abscess (PAA) and/or fistula (PAF) is common. The aim of this study was to identify red flags suggestive of CD.\n\n**Methods:** A systematic literature review was conducted to identify symptoms associated with CD in patients presenting with PAA/PAF. A questionnaire including those symptoms, supplemented with items from the International Organization for the Study of Inflammatory Bowel Diseases (IO-IBD) red flags index for luminal CD, was administered to all adult patients presenting with a PAF and eventually diagnosed with CD and matched patients (1:3) from the same study period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\n**Results:** The systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\n**Conclusions:** The perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "abstract_zh": "Delay in diagnosing Crohn's disease (CD) in patients presenting with perianal abscess (PAA) and/or fistula (PAF) is common. The aim of this study was to identify red flags suggestive of CD.\n\nA systematic literature review was conducted to identify symptoms associated with CD in patients presenting with PAA/PAF. A questionnaire including those symptoms, supplemented with items from the International Organization for the Study of Inflammatory Bowel Diseases (IO-IBD) red flags index for luminal CD, was administered to all adult patients presenting with a PAF and eventually diagnosed with CD and matched patients (1:3) from the same study period with a cryptoglandular PAF (2012-2023) at a single non-academic teaching hospital. All patients were asked to recall symptoms/signs experienced during their first PAF.\n\nThe systematic review identified 8 articles reporting on 15 clinical characteristics in patients presenting with PAA (n = 2)/PAF (n = 6), supplemented with 13 items from the IO-IBD red flags index (28 items in total). A total of 25 patients with CD and 75 patients with PAF without CD answered the questionnaire. Univariate analysis identified seven items associated with CD (age, family history, > 2 perianal interventions, weight loss, abdominal pain, diarrhoea and fatigue), and four items remained significant in multivariate analysis: age (OR 3.4 [1.0-11.5]), > 2 previous perianal interventions (OR 3.4 [1.0-10.1]), weight loss (OR 14.4 [3.7-55.6]) and abdominal pain (OR 9.8 [1.9-49.8]). Receiver-operating characteristic curve (ROC) analysis showed that a combination of these red flags was associated with good discrimination of CD versus non-CD (AUC 0.83 [0.72-0.94]).\n\nThe perianal red flags index has a good predictive value for early identification of patients with PAF at risk for underlying CD.", "keywords_zh": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "keywords_en": "Crohn’s disease, Delay, Inflammatory bowel disease, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40155532/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Sat, 29 Mar 2025"}, {"id": "39946821", "title_en": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "title_zh": "A systematic review and meta-analysis of the diagnostic test accuracy of diffusion weighted imaging and apparent diffusion coefficient in differentiating active from inactive perianal fistula", "authors": "G S Octavius", "abstract_en": "**Introduction:** This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\n**Methods:** The protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\n**Results:** Of 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\n**Conclusion:** ADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\n**Implications For Practice:** T2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "abstract_zh": "This systematic review and meta-analysis evaluated the diagnostic accuracy of MRI-based apparent diffusion coefficient (ADC) and diffusion-weighted imaging (DWI) for differentiating active from inactive perianal fistulas.\n\nThe protocol was registered with the International Prospective Register of Systematic Reviews (PROSPERO) (CRD42024596604). The review included five databases (MEDLINE, Cochrane Library, PubMed, Science Direct, and Google Scholar). Meta-analyses were performed on studies reporting ADC values and other sequences using STATA software with the \"Midas\" command.\n\nOf 21 studies included in the review, 12 were meta-analyzed, encompassing 1007 patients (77.5 % male) with 1092 fistulas and 321 abscesses. Six studies reported ADC values for active vs. inactive fistulas, with a pooled sensitivity of 83 % (95%CI 68-92), specificity of 75 % (95%CI 60-85), and AUC of 0.85 (95%CI 0.81-0.87). Pooled ADC cut-offs ranged from 1.105 to 1.109 × 10⁻³ mm<sup>2</sup>/s. The T2WI + DWI sequence demonstrated the highest diagnostic accuracy, with a pooled sensitivity of 99 % (95%CI 90-100), specificity of 97 % (95%CI 79-100), and an AUC of 1.\n\nADC alone is inadequate for reliably distinguishing active from inactive fistulas. T2WI combined with DWI offers superior diagnostic performance, surpassing contrast-enhanced T1WI, and is promising for non-invasive evaluation of perianal fistulas. However, several limitations, such as moderate to high risk of bias and heterogeneity, may bias this conclusion.\n\nT2WI + DWI could become the standard for assessing perianal fistulas, avoiding contrast agents, and benefiting patients contraindicated for Gadolinium-based contrast media. Variability and potential bias across studies warrant further research.", "keywords_zh": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "keywords_en": "Apparent diffusion coefficient, Diagnostic test accuracy, Diffusion weighted imaging, Magnetic resonance imaging, Perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/39946821/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 13 Feb 2025"}, {"id": "39887706", "title_en": "Hidradenitis Suppurativa Treatment During Pregnancy and Lactation: Navigating Challenges", "title_zh": "Hidradenitis Suppurativa Treatment During Pregnancy and Lactation: Navigating Challenges", "authors": "Seçil Vural", "abstract_en": "Hidradenitis suppurativa (HS), or acne inversa, is a chronic inflammatory skin condition primarily affecting skin folds such as the axilla, groins, and the inframammary, perineal, and perianal regions. It is characterized by painful abscesses, sinus tracts, and scarring. Predominantly affecting young adults, particularly females, HS often emerges during reproductive age, and flares are widely reported during pregnancy and postpartum, underscoring the need to consider management strategies tailored to pregnant or lactating individuals. Moreover, the chronic and relapsing nature of HS, along with challenges related to the safety and compliance of medication use during pregnancy and lactation, as well as various comorbidities and psychological distress, significantly complicate its management in pregnant or lactating women. Treatment options, including topical clindamycin, oral clindamycin-rifampicin, adalimumab, metformin, antiseptic washes, and certolizumab pegol, have accumulated evidence supporting their relative safety in pregnant and lactating women. While certolizumab pegol has shown promising safety data among biologics, it requires more efficacy data in HS. Conversely, while newly approved HS medications such as secukinumab and bimekizumab show promise for the general population, further research is necessary to evaluate their safety profiles in pregnant and breastfeeding individuals. The scant research available on HS in pregnant and lactating women, also shown by our systematic literature review, highlights the need for a comprehensive investigation into the safety, efficacy, and suitability of management strategies.", "abstract_zh": "Hidradenitis suppurativa (HS), or acne inversa, is a chronic inflammatory skin condition primarily affecting skin folds such as the axilla, groins, and the inframammary, perineal, and perianal regions. It is characterized by painful abscesses, sinus tracts, and scarring. Predominantly affecting young adults, particularly females, HS often emerges during reproductive age, and flares are widely reported during pregnancy and postpartum, underscoring the need to consider management strategies tailored to pregnant or lactating individuals. Moreover, the chronic and relapsing nature of HS, along with challenges related to the safety and compliance of medication use during pregnancy and lactation, as well as various comorbidities and psychological distress, significantly complicate its management in pregnant or lactating women. Treatment options, including topical clindamycin, oral clindamycin-rifampicin, adalimumab, metformin, antiseptic washes, and certolizumab pegol, have accumulated evidence supporting their relative safety in pregnant and lactating women. While certolizumab pegol has shown promising safety data among biologics, it requires more efficacy data in HS. Conversely, while newly approved HS medications such as secukinumab and bimekizumab show promise for the general population, further research is necessary to evaluate their safety profiles in pregnant and breastfeeding individuals. The scant research available on HS in pregnant and lactating women, also shown by our systematic literature review, highlights the need for a comprehensive investigation into the safety, efficacy, and suitability of management strategies.", "keywords_zh": "breastfeeding, hidradenitis suppurativa, lactation, pregnancy, safety, therapeutics", "keywords_en": "breastfeeding, hidradenitis suppurativa, lactation, pregnancy, safety, therapeutics", "link": "https://pubmed.ncbi.nlm.nih.gov/39887706/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Fri, 31 Jan 2025"}, {"id": "39422801", "title_en": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "title_zh": "Perianal Mucinous Adenocarcinoma: A Case Report and a Systematic Review of the Literature", "authors": "Apostolos P Stamatiadis", "abstract_en": "**Background:** Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\n**Methods:** A systematic PubMed and Scopus search was conducted, a propos of a case report.\n\n**Results:** One hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\n**Conclusion:** Review of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "abstract_zh": "Mucinous adenocarcinoma of anus is an uncommon neoplasm of the gastrointestinal tract. In most of the cases, early diagnosis of this disease is difficult since its symptoms frequently mimic benign inflammatory conditions.\n\nA systematic PubMed and Scopus search was conducted, a propos of a case report.\n\nOne hundred fifty patients from 93 case reports were included. The mean age of the patients was 60.5 years (range: 18-81). The majority of them were males (124 out of 150, 82.7%), while the main known risk factor was the history of chronic fistula (109 out of 150, 72.7%). Recurrent perianal sepsis and perianal pain were the principal symptoms at the time of presentation. No symptoms have been reported only in three patients (3 out of 150, 2%). Regarding the prior surgical history of the patients, multiple abscess drainage and perianal fistula's related interventions were present in 62 (41.3%) and 19 (12.7%) patients, respectively. Neoadjuvant chemoradiotherapy was administered in 53 out of 150 patients (35.3%), while the majority of them have been treated with combined treatment of chemotherapy and radiotherapy. APR and its variations were the most applied surgical treatment (68%). Adjuvant chemoradiotherapy was administered almost up to one-third of the included patients (34%). Recurrence of the disease was reported in 41 out of 150 patients (27.3%). Death was reported in 44 out of 150 patients (29.3%).\n\nReview of the available published literature suggests that perianal mucinous adenocarcinoma is an extremely rare neoplasia. Τhere is no consensus as far as the diagnosis and the treatment strategies, due to the rarity of this neoplasm. High degree of clinical suspicion as well as histopathological confirmation is the principal requisites for the diagnosis of mucinous adenocarcinoma, especially in the ground of chronic ulcero-proliferative perianal lesions.", "keywords_zh": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "keywords_en": "Anal, Anus, Endoanal ultrasonography, Mucinous adenocarcinoma, Perianal", "link": "https://pubmed.ncbi.nlm.nih.gov/39422801/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Fri, 18 Oct 2024"}, {"id": "39360706", "title_en": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "title_zh": "Darvadstrocel for complex perianal fistulas in Crohn's disease: A systematic review and meta-analysis", "authors": "Cristina Alba", "abstract_en": "**Background:** Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\n**Objective:** This study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\n**Methods:** A systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\n**Results:** Twelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\n**Conclusion:** Evidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "abstract_zh": "Local injection of darvadstrocel, a suspension of expanded adipose-derived allogenic mesenchymal stem cells, has been used for treatment-refractory perianal fistulas in Crohn's disease (CD).\n\nThis study aimed to investigate efficacy and safety of darvadstrocel for complex perianal fistulas in CD.\n\nA systematic search was conducted through April 2024 in relevant databases for observational studies evaluating darvadstrocel. A random-effects meta-analysis model was used to calculate the pooled effect sizes (proportions or incidence rates [IRs]) with 95% confidence intervals (CIs) of effectiveness and safety outcomes. The risk of bias was evaluated using the Joanna Briggs Institute Critical Appraisal Tool. The I<sup>2</sup> value assessed heterogeneity. Sensitivity and subgroup analyses were also conducted.\n\nTwelve studies were included with 595 patients. The pooled rate of patients achieving clinical remission, defined as fistula healing, was 68.1% at month 6 (95% CI 63.4-72.7) and 77.2% (95% CI 70.1-83.8) at month 12. Combined remission, defined as clinical remission and absence of collections >2 cm confirmed by magnetic resonance imaging, was reported in 60.6% and in 69.7% of patients at months 6 and 12, respectively. The rate of patients with treatment failure, defined as no clinical remission at the last follow-up (mean 18.7 months; SD 9.9), was 34.5%. Failure rate was independent of follow-up time (p = 0.85). For effectiveness outcomes, between-study heterogeneity was negligible. Subgroup analysis indicated that none of the covariates modified the treatment effect. Pooled IRs per 100 patient-years of adverse events (AE), serious AEs, perianal abscesses, and reoperations were 19.6, 3.2, 16.9 and 7.1, respectively.\n\nEvidence from observational studies supports the efficacy and safety of darvadstrocel for complex perianal fistulas in CD. Studies have reported high fistula healing rates that can be sustained long-term in most patients, with negligible between-study heterogeneity, as well as a favorable safety profile.", "keywords_zh": "Crohn's disease, adipose‐derived allogenic mesenchymal stem cells, alofisel, darvadstrocel, inflammatory bowel disease, meta‐analysis, perianal fistulas", "keywords_en": "Crohn's disease, adipose‐derived allogenic mesenchymal stem cells, alofisel, darvadstrocel, inflammatory bowel disease, meta‐analysis, perianal fistulas", "link": "https://pubmed.ncbi.nlm.nih.gov/39360706/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 03 Oct 2024"}, {"id": "39298676", "title_en": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "title_zh": "Impact of Seton Use on Clinical, Patient-Reported, and Healthcare Resource Utilization Outcomes in Complex Crohn's Perianal Fistulas: A Systematic Literature Review", "authors": "Phillip Fleshner", "abstract_en": "**Background:** Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\n**Methods:** Electronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\n**Results:** Overall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\n**Conclusions:** Optimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "abstract_zh": "Optimal treatment strategies for seton use in patients with Crohn's perianal fistulas (CPF) remain elusive. This systematic literature review aimed to summarize clinical, patient-reported, and healthcare resource utilization (HCRU) outcomes associated with seton use for symptomatic relief and treatment of complex CPF.\n\nElectronic databases (MEDLINE, Embase, EBM Reviews, EconLit) were searched. Titles, abstracts, and relevant full texts were screened by 2 reviewers for inclusion using prespecified PICOS-T criteria. Articles published in English between January 1, 1980 and September 6, 2021 were included; animal/in vitro studies and case reports with <5 patients were excluded. Outcomes of interest included rates of complete response/remission and fistula recurrence in patients receiving seton with/without infliximab or biologics. Data were summarized using descriptive statistics.\n\nOverall, 56 studies were included (full texts: n = 43; congress abstracts: n = 13). CPF and clinical outcome definitions were heterogeneous. Rates (range) of complete response/remission varied widely (seton: 13%-75%; seton + infliximab: 23%-100%; seton + biologics: 23%-59%) as did rates for fistula recurrence (seton: 4%-68%; seton + infliximab: 0%-50%; seton + biologics: 0%-17%). Rates of fistula-related reintervention, new fistula or abscess formation, and abscess recurrence were also varied; more consistency was observed regarding the use of patient-reported outcomes. Few studies reported outcomes from pediatric/adolescent patients or HCRU.\n\nOptimal use of seton in patients with CPF remains unclear. International standardization of definitions for CPF and related clinical outcomes are required to permit data comparability and identify the most effective treatment strategies involving seton use in CPF.", "keywords_zh": "Crohn’s disease, perianal fistula, seton", "keywords_en": "Crohn’s disease, perianal fistula, seton", "link": "https://pubmed.ncbi.nlm.nih.gov/39298676/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260918235107&v=2.20.1", "date": "Thu, 19 Sep 2024"}, {"id": "38813942", "title_en": "Vaccine-associated paralytic poliomyelitis in oral polio vaccine recipients: disproportionality analysis using VAERS and systematic review", "title_zh": "Vaccine-associated paralytic poliomyelitis in oral polio vaccine recipients: disproportionality analysis using VAERS and systematic review", "authors": "Girish Thunga", "abstract_en": "**Background:** Vaccine-associated paralytic poliomyelitis (VAPP) is a rare adverse event of oral poliovirus vaccines (OPV), particularly affecting immunodeficient individuals.\n\n**Research Design And Methods:** This study aimed to (1) Assess the association between OPV and VAPP using Vaccine Adverse Event Reporting System (VAERS) database (2) Outline patient characteristics and risk factors associated with the occurrence of VAPP in OPV recipients through a systematic review of case reports and case series. A disproportionality analysis was conducted using the data from VAERS, encompassing adverse events reported from 1990 till February 2023. Additionally, we conducted a systematic review of case reports and case series using PubMed, Scopus, and Embase databases.\n\n**Results:** The VAERS data revealed 130 VAPP reports among 1,739,903 OPV linked adverse event
