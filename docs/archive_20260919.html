ose a management flowchart based on our clinical experience, outlining the diagnostic and therapeutic approach to rectal injury and RP-related RUF.\n\nRUF after RP remains a challenging complication, often requiring stepwise management. Conservative treatments rarely succeed, and surgery is often necessary. Our proposed algorithm aims to standardize the approach to RI and RUF, guiding treatment decisions and improving outcomes.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42069871/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 02 May 2026"}, {"id": "42034194", "title_en": "Outcomes of Stage IVA Cervical Cancer Treated with Radiation Therapy: A Systematic Review and Meta-Analysis", "title_zh": "Outcomes of Stage IVA Cervical Cancer Treated with Radiation Therapy: A Systematic Review and Meta-Analysis", "authors": "D N Sharma", "abstract_en": "FIGO stage IVA cervical cancer, defined by bladder or rectal mucosal invasion without distant metastasis, is an uncommon but clinically challenging disease with limited high-quality evidence to guide management. We performed a systematic review and meta-analysis to evaluate survival outcomes, treatment-related morbidity, and prognostic factors in patients with stage IVA cervical cancer treated with definitive radiotherapy. Following PRISMA 2020 guidelines and PROSPERO registration (CRD42024602426), PubMed, Embase, and Web of Science were searched through February 2025. Eleven studies comprising 492 patients met eligibility criteria. Pooled random-effects analyses demonstrated 2-, 3-, and 5-year disease-free survival rates of 41.5% (95% CI, 28.1-55.0), 34.2% (95% CI, 21.1-47.3), and 30.9% (95% CI, 16.0-45.8), respectively. Corresponding overall survival rates were 56.0% (95% CI, 46.2-65.9), 45.9% (95% CI, 35.9-55.9), and 34.8% (95% CI, 26.4-43.3). Weighted median disease-free survival and overall survival were 15.6 and 33.6 months, respectively. The pooled incidence of vesicovaginal or rectovaginal fistula was 23.7% (95% CI, 12.9-34.6). Adverse prognostic factors included pelvic nodal involvement, hydronephrosis, rectal invasion, omission of brachytherapy, and total EQD2 below 80-85 Gy. Concurrent chemoradiation and completion of brachytherapy were consistently associated with improved outcomes. Despite curative-intent treatment, long-term survival remains poor and treatment-related morbidity substantial. Durable pelvic control remains the principal therapeutic challenge. Concurrent chemoradiation with adequate-dose brachytherapy appears essential for optimal outcomes, while future stage IVA-specific studies incorporating image-guided adaptive brachytherapy, advanced radiotherapy techniques, and systemic treatment intensification are needed to improve survival and reduce treatment-related morbidity.", "abstract_zh": "FIGO stage IVA cervical cancer, defined by bladder or rectal mucosal invasion without distant metastasis, is an uncommon but clinically challenging disease with limited high-quality evidence to guide management. We performed a systematic review and meta-analysis to evaluate survival outcomes, treatment-related morbidity, and prognostic factors in patients with stage IVA cervical cancer treated with definitive radiotherapy. Following PRISMA 2020 guidelines and PROSPERO registration (CRD42024602426), PubMed, Embase, and Web of Science were searched through February 2025. Eleven studies comprising 492 patients met eligibility criteria. Pooled random-effects analyses demonstrated 2-, 3-, and 5-year disease-free survival rates of 41.5% (95% CI, 28.1-55.0), 34.2% (95% CI, 21.1-47.3), and 30.9% (95% CI, 16.0-45.8), respectively. Corresponding overall survival rates were 56.0% (95% CI, 46.2-65.9), 45.9% (95% CI, 35.9-55.9), and 34.8% (95% CI, 26.4-43.3). Weighted median disease-free survival and overall survival were 15.6 and 33.6 months, respectively. The pooled incidence of vesicovaginal or rectovaginal fistula was 23.7% (95% CI, 12.9-34.6). Adverse prognostic factors included pelvic nodal involvement, hydronephrosis, rectal invasion, omission of brachytherapy, and total EQD2 below 80-85 Gy. Concurrent chemoradiation and completion of brachytherapy were consistently associated with improved outcomes. Despite curative-intent treatment, long-term survival remains poor and treatment-related morbidity substantial. Durable pelvic control remains the principal therapeutic challenge. Concurrent chemoradiation with adequate-dose brachytherapy appears essential for optimal outcomes, while future stage IVA-specific studies incorporating image-guided adaptive brachytherapy, advanced radiotherapy techniques, and systemic treatment intensification are needed to improve survival and reduce treatment-related morbidity.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42034194/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 25 Apr 2026"}, {"id": "42003433", "title_en": "Timing of seton removal and clinical outcomes in perianal fistulizing Crohn's disease: A systematic review and meta-analysis", "title_zh": "Timing of seton removal and clinical outcomes in perianal fistulizing Crohn's disease: A systematic review and meta-analysis", "authors": "Hiroki Ikeuchi", "abstract_en": "**Background:** The optimal timing for seton removal in perianal fistulizing Crohn's disease (PFCD) remains unclear. Therefore, we examined the range of reported timing strategies and their association with clinical outcomes.\n\n**Methods:** We systematically searched PubMed, Web of Science, Cochrane Library and Ichushi-Web for studies published from January 1990 to June 2025. Eligible studies included adult patients with PFCD who underwent seton placement and reported removal timing and clinical outcomes. Healing and recurrence rates were pooled using a random effects model. Subgroup analyses evaluated seton removal timing (<34 vs. ≥34 weeks) and biologic and antibiotic usage.\n\n**Results:** Overall, nine studies were included (nine observational studies). The pooled healing rate was 57% (95% confidence interval [CI], 40-73%), and the pooled recurrence rate was 31% (95% CI, 15-53%), both with substantial heterogeneity (I<sup>2</sup> > 80%). Short-term removal (<34 weeks) achieved a healing rate of 69% (95% CI, 56-79%) vs. 46% (95% CI, 22-72%) for long-term removal (≥34 weeks) (p = 0.03). A significant correlation was found between seton removal timing and healing rate (r = -0.70, p = 0.03). The recurrence incidence was 12.7 (95% CI, 4.7-34.3) in the short-term group and 3.9 (95% CI, 0.7-21.4) in the long-term group (p = 0.09).\n\n**Conclusion:** An association between seton removal timing and fistula healing was observed without a corresponding increase in recurrence. These findings should be interpreted cautiously because removal timing may reflect disease severity and treatment response rather than a causal effect.", "abstract_zh": "The optimal timing for seton removal in perianal fistulizing Crohn's disease (PFCD) remains unclear. Therefore, we examined the range of reported timing strategies and their association with clinical outcomes.\n\nWe systematically searched PubMed, Web of Science, Cochrane Library and Ichushi-Web for studies published from January 1990 to June 2025. Eligible studies included adult patients with PFCD who underwent seton placement and reported removal timing and clinical outcomes. Healing and recurrence rates were pooled using a random effects model. Subgroup analyses evaluated seton removal timing (<34 vs. ≥34 weeks) and biologic and antibiotic usage.\n\nOverall, nine studies were included (nine observational studies). The pooled healing rate was 57% (95% confidence interval [CI], 40-73%), and the pooled recurrence rate was 31% (95% CI, 15-53%), both with substantial heterogeneity (I<sup>2</sup> > 80%). Short-term removal (<34 weeks) achieved a healing rate of 69% (95% CI, 56-79%) vs. 46% (95% CI, 22-72%) for long-term removal (≥34 weeks) (p = 0.03). A significant correlation was found between seton removal timing and healing rate (r = -0.70, p = 0.03). The recurrence incidence was 12.7 (95% CI, 4.7-34.3) in the short-term group and 3.9 (95% CI, 0.7-21.4) in the long-term group (p = 0.09).\n\nAn association between seton removal timing and fistula healing was observed without a corresponding increase in recurrence. These findings should be interpreted cautiously because removal timing may reflect disease severity and treatment response rather than a causal effect.", "keywords_zh": "meta‐analysis, perianal fistulizing Crohn's disease, seton placement, seton removal", "keywords_en": "meta‐analysis, perianal fistulizing Crohn's disease, seton placement, seton removal", "link": "https://pubmed.ncbi.nlm.nih.gov/42003433/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 20 Apr 2026"}, {"id": "41873840", "title_en": "Transperineal ultrasonography in detecting penetrating perianal disease: a systematic review and meta-analysis", "title_zh": "Transperineal ultrasonography in detecting penetrating perianal disease: a systematic review and meta-analysis", "authors": "Krisztina Gecse", "abstract_en": "**Background And Aims:** Perianal complications such as fistulas and abscesses are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\n**Methods:** A comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\n**Results:** Of 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\n**Conclusions:** TPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "abstract_zh": "Perianal complications such as fistulas and abscesses are common in Crohn's disease (CD) and contribute to significant morbidity. Transperineal ultrasonography (TPUS) has emerged as a non-invasive and accurate method for perianal fistulizing CD (pfCD). This review evaluates the diagnostic accuracy of TPUS compared with magnetic resonance imaging (MRI), transrectal ultrasonography (TRUS), and examination under anesthesia (EUA) for detecting and classifying perianal fistulas and abscesses.\n\nA comprehensive literature search was conducted across multiple databases through January 2025 to identify studies evaluating TPUS accuracy in detecting perianal fistulas and abscesses compared with MRI, TRUS, or EUA as the reference standard. Meta-analysis was performed to assess TPUS accuracy for fistula detection (FD), fistula classification (FC), internal opening (IO) detection, and abscess detection (AD). The Quality Assessment of Diagnostic Accuracy Studies-2 tool was used to evaluate risk of bias.\n\nOf 1059 studies identified, 29 were included in this review. Pooled sensitivities for FD (18 studies, 1474 patients), FC (11 studies, 585 patients), IO detection (six studies, 481 patients), and AD (16 studies, 1276 patients) were 97.5%, 80.3%, 89.6%, and 93.5% respectively while pooled specificities for FD, IO detection, and AD were 69.0%, 66.3%, and 94.5% respectively. The overall TPUS accuracy for FD, FC, IO detection, and AD was 88.0%, 88.6%, 77.8%, and 91.8% respectively. Subgroup analysis on CD patients showed an accuracy of 86.4%, 87.6%, and 83.3% for FD, FC, and AD respectively.\n\nTPUS demonstrates high accuracy in detecting perianal fistulas and abscesses, supporting its use as a non-invasive, first-line diagnostic tool.", "keywords_zh": "TPUS, abscess, perianal fistula, perianal fistulizing Crohn’s disease, transperineal ultrasound", "keywords_en": "TPUS, abscess, perianal fistula, perianal fistulizing Crohn’s disease, transperineal ultrasound", "link": "https://pubmed.ncbi.nlm.nih.gov/41873840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 24 Mar 2026"}, {"id": "41815267", "title_en": "Response to \"Comment on the systematic review of TROPIS for anal fistula\"", "title_zh": "Response to \"Comment on the systematic review of TROPIS for anal fistula\"", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815267/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41815266", "title_en": "Comment on the systematic review of TROPIS for anal fistula", "title_zh": "Comment on the systematic review of TROPIS for anal fistula", "authors": "Prema Ram Choudhary", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41815266/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 12 Mar 2026"}, {"id": "41796653", "title_en": "Feasibility and safety of laparoscopic versus open repair for rectobulbar fistula in anorectal malformations: A systematic review and meta-analysis", "title_zh": "Feasibility and safety of laparoscopic versus open repair for rectobulbar fistula in anorectal malformations: A systematic review and meta-analysis", "authors": "Vikesh Agrawal", "abstract_en": "**Background:** Laparoscopic-assisted Anorectoplasty (LAARP) for male recto-bulbar fistula (RBF) remains debated, with early reports describing approach-specific complications. Prior meta-analyses pooled heterogeneous Anorectal malformation (ARM) subtypes, limiting conclusions for RBF. We conducted an RBF-specific systematic review and meta-analysis comparing LAARP with posterior sagittal anorectoplasty (PSARP).\n\n**Methods:** PubMed/MEDLINE, Embase, Scopus, and Google Scholar were searched (2000-November 2025) for comparative studies of LAARP versus PSARP in male children with RBF. Risk of bias was assessed using the ROBINS-I tool. Random-effects meta-analyses in Jeffreys's Amazing Statistics Program (JASP) used log effect sizes for dichotomous outcomes and mean differences for operative time. Sensitivity analyses excluded studies with zero events in both arms.\n\n**Results:** Six observational cohort studies (278 patients; LAARP 154, PSARP 124) were included. No intraoperative complications or conversions to open surgery were reported. Postoperative urethral diverticulum (UD) was not reported in five studies; one study reported 4 cases (15.38 %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in the pooled analysis (log OR 1.23, 95 % CI 0.02 to 2.44); this persisted in event-positive studies (log OR 1.45, 95 % CI 0.18 to 2.72). Operative time was longer with LAARP (mean difference (MD) 66.74 min, 95 % CI 27.48 to 106.00), with substantial heterogeneity (I<sup>2</sup> 97.57 %). Wound infection was uncommon and inconsistently reported; quantitative pooling was not undertaken.\n\n**Conclusions:** LAARP is a feasible and safe option for male RBF, with outcomes comparable to those of PSARP for major postoperative complications; however, the certainty of the evidence remains limited, underscoring the need for high-quality prospective studies.", "abstract_zh": "Laparoscopic-assisted Anorectoplasty (LAARP) for male recto-bulbar fistula (RBF) remains debated, with early reports describing approach-specific complications. Prior meta-analyses pooled heterogeneous Anorectal malformation (ARM) subtypes, limiting conclusions for RBF. We conducted an RBF-specific systematic review and meta-analysis comparing LAARP with posterior sagittal anorectoplasty (PSARP).\n\nPubMed/MEDLINE, Embase, Scopus, and Google Scholar were searched (2000-November 2025) for comparative studies of LAARP versus PSARP in male children with RBF. Risk of bias was assessed using the ROBINS-I tool. Random-effects meta-analyses in Jeffreys's Amazing Statistics Program (JASP) used log effect sizes for dichotomous outcomes and mean differences for operative time. Sensitivity analyses excluded studies with zero events in both arms.\n\nSix observational cohort studies (278 patients; LAARP 154, PSARP 124) were included. No intraoperative complications or conversions to open surgery were reported. Postoperative urethral diverticulum (UD) was not reported in five studies; one study reported 4 cases (15.38 %) after LAARP and none after PSARP, precluding meta-analysis. Primary analyses showed no statistically significant differences between LAARP and PSARP for residual fistula (RSF) (pooled log odds ratio (OR) 0.68, 95 % confidence interval (CI) -0.86 to 2.22), anal stenosis (log OR -0.36, 95 % CI -1.35 to 0.63), or rectal prolapse (log OR 1.03, 95 % CI -0.03 to 2.09). Reoperation was infrequent but higher after LAARP in the pooled analysis (log OR 1.23, 95 % CI 0.02 to 2.44); this persisted in event-positive studies (log OR 1.45, 95 % CI 0.18 to 2.72). Operative time was longer with LAARP (mean difference (MD) 66.74 min, 95 % CI 27.48 to 106.00), with substantial heterogeneity (I<sup>2</sup> 97.57 %). Wound infection was uncommon and inconsistently reported; quantitative pooling was not undertaken.\n\nLAARP is a feasible and safe option for male RBF, with outcomes comparable to those of PSARP for major postoperative complications; however, the certainty of the evidence remains limited, underscoring the need for high-quality prospective studies.", "keywords_zh": "Anorectal malformations, Laparoscopic-assisted anorectoplasty, Meta-analysis, Pediatric colorectal surgery, Posterior sagittal anorectoplasty, Rectobulbar fistula, Systematic review", "keywords_en": "Anorectal malformations, Laparoscopic-assisted anorectoplasty, Meta-analysis, Pediatric colorectal surgery, Posterior sagittal anorectoplasty, Rectobulbar fistula, Systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41796653/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 09 Mar 2026"}, {"id": "41714221", "title_en": "Diagnostic Performance of Three-Dimensional Endoanal Ultrasound Compared with MRI in Anal Fistula: A Systematic Review and Meta-analysis", "title_zh": "Diagnostic Performance of Three-Dimensional Endoanal Ultrasound Compared with MRI in Anal Fistula: A Systematic Review and Meta-analysis", "authors": "Jing Li", "abstract_en": "**Rationale And Objectives:** Anal fistula severely impacts patients' quality of life, and accurate preoperative Parks classification is critical for surgical planning and anal sphincter preservation. This systematic review and meta-analysis evaluated the diagnostic efficacy of 3D-endoanal ultrasound (3D-EAUS) and unenhanced/contrast-enhanced (CE) magnetic resonance imaging (MRI) for anal fistula classification.\n\n**Materials And Methods:** Following PRISMA guidelines, PubMed, Embase and Cochrane Library were searched for studies (2010-2025) comparing the two modalities, with diagnostic indices extracted and meta-analyzed via RevMan 5.3.\n\n**Results:** A total of 32 studies involving 4104 anal fistula cases were included. The summary receiver operating characteristic curves of 3D-EAUS, unenhanced MRI, and contrast-enhanced MRI (CE-MRI) showed that most points fell on or in the upper-left corner of the curves, indicating good diagnostic performance for all three modalities. 3D-EAUS exhibited high sensitivity and specificity for intersphincteric (SEN: 0.89, SPE: 0.94) and transsphincteric anal fistulas (SEN: 0.96, SPE: 0.86), but lower diagnostic sensitivity for suprasphincteric (SEN: 0.72) and extrasphincteric (SEN: 0.75) fistulas. unenhanced MRI demonstrated high specificity (>0.94) for all classifications and moderate sensitivity (>0.85), except for suprasphincteric fistulas (SEN: 0.71). CE-MRI showed the highest diagnostic accuracy, with both sensitivity and specificity exceeding 0.90 for most classifications.\n\n**Conclusion:** Both 3D-EAUS and MRI can effectively diagnose anal fistulas. 3D-EAUS is the preferred initial examination, and CE-MRI is recommended for complex or unclear cases, providing an evidence-based basis for clinical decision-making and improving patient prognosis.", "abstract_zh": "Anal fistula severely impacts patients' quality of life, and accurate preoperative Parks classification is critical for surgical planning and anal sphincter preservation. This systematic review and meta-analysis evaluated the diagnostic efficacy of 3D-endoanal ultrasound (3D-EAUS) and unenhanced/contrast-enhanced (CE) magnetic resonance imaging (MRI) for anal fistula classification.\n\nFollowing PRISMA guidelines, PubMed, Embase and Cochrane Library were searched for studies (2010-2025) comparing the two modalities, with diagnostic indices extracted and meta-analyzed via RevMan 5.3.\n\nA total of 32 studies involving 4104 anal fistula cases were included. The summary receiver operating characteristic curves of 3D-EAUS, unenhanced MRI, and contrast-enhanced MRI (CE-MRI) showed that most points fell on or in the upper-left corner of the curves, indicating good diagnostic performance for all three modalities. 3D-EAUS exhibited high sensitivity and specificity for intersphincteric (SEN: 0.89, SPE: 0.94) and transsphincteric anal fistulas (SEN: 0.96, SPE: 0.86), but lower diagnostic sensitivity for suprasphincteric (SEN: 0.72) and extrasphincteric (SEN: 0.75) fistulas. unenhanced MRI demonstrated high specificity (>0.94) for all classifications and moderate sensitivity (>0.85), except for suprasphincteric fistulas (SEN: 0.71). CE-MRI showed the highest diagnostic accuracy, with both sensitivity and specificity exceeding 0.90 for most classifications.\n\nBoth 3D-EAUS and MRI can effectively diagnose anal fistulas. 3D-EAUS is the preferred initial examination, and CE-MRI is recommended for complex or unclear cases, providing an evidence-based basis for clinical decision-making and improving patient prognosis.", "keywords_zh": "3D-EAUS, Anal fistula, Diagnostic accuracy, MRI, Meta-analysis", "keywords_en": "3D-EAUS, Anal fistula, Diagnostic accuracy, MRI, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/41714221/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 19 Feb 2026"}, {"id": "41698846", "title_en": "Tunnel vision: rethinking local therapy for perianal fistulas in Crohn's disease", "title_zh": "Tunnel vision: rethinking local therapy for perianal fistulas in Crohn's disease", "authors": "Serre-Yu Wong", "abstract_en": "**Background And Aims:** Local therapies involving direct delivery of agents to fistula tracts in perianal fistulizing Crohn's disease (PFCD) have been explored but are not standard in clinical practice. We aimed to conduct a systematic review of local therapies for PFCD to evaluate their role in fistula closure, considering current pathophysiological insights and contemporary surgical and medical expertise.\n\n**Methods:** We performed a systematic review assessing the efficacy of local therapies for PFCD, excluding mesenchymal stem cell therapies, which have been reviewed elsewhere. The reporting quality of the studies was assessed using a validated checklist.\n\n**Results:** The systematic review included 31 studies evaluating fibrin glue (n = 11), fistula plugs (n = 11), locally injected medications (n = 5), ointments (n = 3), and platelet-rich plasma (n = 2). Fibrin glue showed short-term success (healing rates 30%-91%) but poor long-term outcomes (26%-57%). Fistula plugs had variable success rates (15%-85%) with minimal benefit from repeated applications. Locally injected biologics achieved healing rates of over 60%, often with durable responses. Metronidazole ointment had only short-term efficacy, while tacrolimus had no significant benefit. A potential approach to improving the efficacy and durability of local therapies for PFCD may involve surgical preconditioning (through curettage and internal orifice closure) and the efficient delivery of agents into fistula tracts that modulate microbial communities, inflammation, and, ultimately, wound healing.\n\n**Conclusions:** There is an unmet need to generate novel local therapies that achieve long-lasting fistula closure. To facilitate their development, the delineation of host and microbial pathways contributing to PFCD pathogenesis and research in drug delivery systems are needed.", "abstract_zh": "Local therapies involving direct delivery of agents to fistula tracts in perianal fistulizing Crohn's disease (PFCD) have been explored but are not standard in clinical practice. We aimed to conduct a systematic review of local therapies for PFCD to evaluate their role in fistula closure, considering current pathophysiological insights and contemporary surgical and medical expertise.\n\nWe performed a systematic review assessing the efficacy of local therapies for PFCD, excluding mesenchymal stem cell therapies, which have been reviewed elsewhere. The reporting quality of the studies was assessed using a validated checklist.\n\nThe systematic review included 31 studies evaluating fibrin glue (n = 11), fistula plugs (n = 11), locally injected medications (n = 5), ointments (n = 3), and platelet-rich plasma (n = 2). Fibrin glue showed short-term success (healing rates 30%-91%) but poor long-term outcomes (26%-57%). Fistula plugs had variable success rates (15%-85%) with minimal benefit from repeated applications. Locally injected biologics achieved healing rates of over 60%, often with durable responses. Metronidazole ointment had only short-term efficacy, while tacrolimus had no significant benefit. A potential approach to improving the efficacy and durability of local therapies for PFCD may involve surgical preconditioning (through curettage and internal orifice closure) and the efficient delivery of agents into fistula tracts that modulate microbial communities, inflammation, and, ultimately, wound healing.\n\nThere is an unmet need to generate novel local therapies that achieve long-lasting fistula closure. To facilitate their development, the delineation of host and microbial pathways contributing to PFCD pathogenesis and research in drug delivery systems are needed.", "keywords_zh": "host–microbe interactions, local therapy, perianal fistulizing Crohn’s disease", "keywords_en": "host–microbe interactions, local therapy, perianal fistulizing Crohn’s disease", "link": "https://pubmed.ncbi.nlm.nih.gov/41698846/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 16 Feb 2026"}, {"id": "41693361", "title_en": "Systematic Review of Published Guidelines: Recommendations for Exams Under Anaesthesia, Seton Insertion and Timing of Seton Removal for Perianal and Rectovaginal Fistulising Crohn's Disease", "title_zh": "Systematic Review of Published Guidelines: Recommendations for Exams Under Anaesthesia, Seton Insertion and Timing of Seton Removal for Perianal and Rectovaginal Fistulising Crohn's Disease", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background And Aims:** Perianal fistulising Crohn's disease (pfCD) is a heterogeneous phenotype of Crohn's disease with marked variability in anatomical complexity, symptomatology, and disease trajectory. This often creates uncertainty in the optimal approach to management, particularly the surgical aspects of when to perform examination under anaesthesia (EUA) and when to insert or remove setons.\n\n**Methods:** We conducted a systematic review following PRISMA guidelines. Multiple databases were searched from inception through December 2025. Eligible publications included clinical guidelines on pfCD and/or rectovaginal fistulas that reported indications for EUA, seton insertion, and/or seton removal. We stratified recommendations by fistula complexity, the presence of abscesses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\n**Results:** Twenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\n**Conclusion:** Substantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "abstract_zh": "Perianal fistulising Crohn's disease (pfCD) is a heterogeneous phenotype of Crohn's disease with marked variability in anatomical complexity, symptomatology, and disease trajectory. This often creates uncertainty in the optimal approach to management, particularly the surgical aspects of when to perform examination under anaesthesia (EUA) and when to insert or remove setons.\n\nWe conducted a systematic review following PRISMA guidelines. Multiple databases were searched from inception through December 2025. Eligible publications included clinical guidelines on pfCD and/or rectovaginal fistulas that reported indications for EUA, seton insertion, and/or seton removal. We stratified recommendations by fistula complexity, the presence of abscesses, and clinical symptoms. Risk of bias was assessed using the AGREE II Instrument.\n\nTwenty-four guidelines met inclusion criteria. EUA (and often seton placement) was universally recommended for perianal abscesses and frequently for symptomatic complex pfCD. For asymptomatic complex or symptomatic simple fistulas, recommendations were variable and often conditional on the presence of proctitis or plans for biologic therapy. In contrast, EUA and setons were not broadly endorsed for asymptomatic simple fistulas. Recommendations for seton removal varied widely, ranging from predefined intervals after anti-TNF therapy initiation to individualised criteria based on clinical or radiologic response. Most guidelines did not consider symptom type/severity, prior surgery, suitability for surgical closure, and asymptomatic abscesses detected by imaging.\n\nSubstantial heterogeneity and limitations exist across guidelines on the surgical management of pfCD. This underscores the need for international consensus informed by multidisciplinary expertise to standardise care in this complex population.", "keywords_zh": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "keywords_en": "Crohn's disease, abscess, colorectal surgery, inflammatory bowel diseases, rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41693361/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 16 Feb 2026"}, {"id": "41692935", "title_en": "Intraluminal bypass devices as an alternative to defunctioning stoma in anterior resection: A systematic review of safety and feasibility", "title_zh": "Intraluminal bypass devices as an alternative to defunctioning stoma in anterior resection: A systematic review of safety and feasibility", "authors": "Ziqiang Wang", "abstract_en": "**Aim:** To systematically evaluate the safety and feasibility of intraluminal bypass devices (IBDs) as alternatives to defunctioning stoma for colorectal/coloanal anastomoses after anterior resection.\n\n**Method:** The present systematic review was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Endpoints were feasibility (placement, fixation, maintenance, removal) and safety (device-related events, postoperative morbidity and anastomotic leakage).\n\n**Results:** In total, 10 studies evaluating five types of IBDs were included in this systematic review. Each IBD had a head portion with a proximal fixation component and a tail portion consisting of a transanal endoluminal tubular sheath or tube for faecal diversion but with a distinct design. Device-related events included migration, sheath internalization, partial colonic wall erosions and enterocutaneous fistula. Overall postoperative complications were reported in 0-74% and anastomotic leakage in 0-32% across studies. Stoma avoidance ranged from 66.7% to 100%.\n\n**Conclusion:** IBDs are technically feasible and appear acceptably safe, with potential to reduce reliance on defunctioning stoma; however, evidence remains early and heterogeneous. Further studies are needed, and optimization of fixation and anti-migration strategies should be prioritized.", "abstract_zh": "To systematically evaluate the safety and feasibility of intraluminal bypass devices (IBDs) as alternatives to defunctioning stoma for colorectal/coloanal anastomoses after anterior resection.\n\nThe present systematic review was conducted according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. Endpoints were feasibility (placement, fixation, maintenance, removal) and safety (device-related events, postoperative morbidity and anastomotic leakage).\n\nIn total, 10 studies evaluating five types of IBDs were included in this systematic review. Each IBD had a head portion with a proximal fixation component and a tail portion consisting of a transanal endoluminal tubular sheath or tube for faecal diversion but with a distinct design. Device-related events included migration, sheath internalization, partial colonic wall erosions and enterocutaneous fistula. Overall postoperative complications were reported in 0-74% and anastomotic leakage in 0-32% across studies. Stoma avoidance ranged from 66.7% to 100%.\n\nIBDs are technically feasible and appear acceptably safe, with potential to reduce reliance on defunctioning stoma; however, evidence remains early and heterogeneous. Further studies are needed, and optimization of fixation and anti-migration strategies should be prioritized.", "keywords_zh": "anastomosis protection device, anastomotic leakage, defunctioning stoma, low anterior resection, postoperative complications", "keywords_en": "anastomosis protection device, anastomotic leakage, defunctioning stoma, low anterior resection, postoperative complications", "link": "https://pubmed.ncbi.nlm.nih.gov/41692935/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sun, 15 Feb 2026"}, {"id": "41537212", "title_en": "Transanal Opening of the Intersphincteric Space to Treat Anal Fistula: A Systematic Review and Meta-Analysis", "title_zh": "Transanal Opening of the Intersphincteric Space to Treat Anal Fistula: A Systematic Review and Meta-Analysis", "authors": "Zhen-Yi Wang", "abstract_en": "**Aim:** Transanal opening of the intersphincteric space (TROPIS) is a minimally invasive surgical treatment for anal fistula that not only eliminates the source of infection but also protects anal function to the greatest extent. This systematic review and meta-analysis aims to evaluate the efficacy of TROPIS in the treatment of anal fistula.\n\n**Methods:** We searched PubMed, EMBASE, Web of Science, and the Cochrane Library for information on TROPIS surgery for anal fistulas performed between the inception of each database and 1 November 2024. We used the single-arm studies for analysis, with a total of 918 subjects and a follow-up period ranging from 3 months to 36 months. The analysis focused on the cure rate of different types of anal fistula, postoperative bleeding, infection, and adverse reactions.\n\n**Results:** This systematic review included six single-arm studies involving a total of 918 patients with anal fistula who underwent TROPIS surgery, with follow-up durations ranging from 3 to 36 months. Among the included studies, all were classified as high quality (score ≥7). This study demonstrated an 80% success rate for the initial operation (95% confidence interval (CI): 0.77-0.83), as well as an 80% success rate specifically for high fistulas (95% CI: 0.77-0.83). The success rate for second operations was 73% (95% CI: 0.47-0.99). For patients with high fistulas who underwent a second procedure, the success rate was 78% (95% CI: 0.40-1.00). The cure rate for anal fistulas accompanied by abscesses was 88%, while the cure rate for anal fistulas without abscesses is the same. For horseshoe fistulas, the cure rate was 87%, whereas it was 88% for non-horseshoe fistulas. The overall cure rate in this study was 88% (95% CI: 0.86-0.90). The rate of intraoperative bleeding was 3%, the postoperative infection rate was 5%, and the overall incidence of adverse reactions was 3%.\n\n**Conclusions:** This study demonstrates that TROPIS holds significant potential in the treatment of anal fistulas, particularly for high fistulas, fistulas with associated abscesses, and horseshoe-shaped fistulas, whilst exhibiting a relatively low incidence of incontinence.", "abstract_zh": "Transanal opening of the intersphincteric space (TROPIS) is a minimally invasive surgical treatment for anal fistula that not only eliminates the source of infection but also protects anal function to the greatest extent. This systematic review and meta-analysis aims to evaluate the efficacy of TROPIS in the treatment of anal fistula.\n\nWe searched PubMed, EMBASE, Web of Science, and the Cochrane Library for information on TROPIS surgery for anal fistulas performed between the inception of each database and 1 November 2024. We used the single-arm studies for analysis, with a total of 918 subjects and a follow-up period ranging from 3 months to 36 months. The analysis focused on the cure rate of different types of anal fistula, postoperative bleeding, infection, and adverse reactions.\n\nThis systematic review included six single-arm studies involving a total of 918 patients with anal fistula who underwent TROPIS surgery, with follow-up durations ranging from 3 to 36 months. Among the included studies, all were classified as high quality (score ≥7). This study demonstrated an 80% success rate for the initial operation (95% confidence interval (CI): 0.77-0.83), as well as an 80% success rate specifically for high fistulas (95% CI: 0.77-0.83). The success rate for second operations was 73% (95% CI: 0.47-0.99). For patients with high fistulas who underwent a second procedure, the success rate was 78% (95% CI: 0.40-1.00). The cure rate for anal fistulas accompanied by abscesses was 88%, while the cure rate for anal fistulas without abscesses is the same. For horseshoe fistulas, the cure rate was 87%, whereas it was 88% for non-horseshoe fistulas. The overall cure rate in this study was 88% (95% CI: 0.86-0.90). The rate of intraoperative bleeding was 3%, the postoperative infection rate was 5%, and the overall incidence of adverse reactions was 3%.\n\nThis study demonstrates that TROPIS holds significant potential in the treatment of anal fistulas, particularly for high fistulas, fistulas with associated abscesses, and horseshoe-shaped fistulas, whilst exhibiting a relatively low incidence of incontinence.", "keywords_zh": "anal fistula, meta-analysis, sphincter-preserving procedure, transanal opening of intersphincteric space", "keywords_en": "anal fistula, meta-analysis, sphincter-preserving procedure, transanal opening of intersphincteric space", "link": "https://pubmed.ncbi.nlm.nih.gov/41537212/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 15 Jan 2026"}, {"id": "41359092", "title_en": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "title_zh": "Systematic review: The management of unhealed wounds and persistent perineal sinuses following proctectomy in inflammatory bowel disease", "authors": "A Hart", "abstract_en": "**Introduction:** Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\n**Methods:** A literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\n**Results:** Of 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, cleft closure, omentoplasty, skin grafting, gracilis and rectus abdominis flap, platelet-derived growth factor, curettage, lay open and excision of sinuses. Reported healing rates ranged from 30% to 100%. Heterogeneity in the reporting of outcomes, as well as the interventions performed precluded meta-analysis.\n\n**Conclusion:** The published evidence for treatment of PPS in IBD consists of low-quality evidence case series with high risk of bias. There is a need for standardised outcome reporting and high-quality, prospective studies to establish effective treatment algorithms.", "abstract_zh": "Unhealed wounds and persistent perineal sinuses (PPS) may occur in as many as one third of patients after proctectomy for Crohn's disease. The management of these conditions remains a significant challenge, particularly in the context of inflammatory bowel disease (IBD), with existing therapies plagued by high failure rates. This systematic review of the literature assessed the efficacy of medical and surgical therapy for PPS closure in IBD. Secondary aims included review of classification systems used for PPS.\n\nA literature search was conducted using Medline, Embase and Cochrane databases on 17 December 2024. The review was registered on PROSPERO (CRD42024622582). Inclusion criteria were adult patients with IBD and PPS or unhealed wounds following proctectomy. We excluded abstract-only publications, case reports, cancer and paediatric cohorts. Two reviewers independently screened abstracts and full texts and extracted data. The primary outcome was clinical healing rate. Secondary outcomes included classification systems used to describe PPS. Risk of bias was assessed.\n\nOf 496 records identified, following removal of duplicates, 489 abstracts were screened, and 60 full text articles assessed for eligibility. Of 25 articles included in the final analysis, 23 were case series or retrospective cohort studies, and all were at high risk of bias. No randomised controlled trials were identified. Five articles (including two of the case series) described classification systems for PPS. Interventions included hyperbaric oxygen therapy, Karydakis flap, cleft closure, omentoplasty, skin grafting, gracilis and rectus abdominis flap, platelet-derived growth factor, curettage, lay open and excision of sinuses. Reported healing rates ranged from 30% to 100%. Heterogeneity in the reporting of outcomes, as well as the interventions performed precluded meta-analysis.\n\nThe published evidence for treatment of PPS in IBD consists of low-quality evidence case series with high risk of bias. There is a need for standardised outcome reporting and high-quality, prospective studies to establish effective treatment algorithms.", "keywords_zh": "Fistulizing perianal Crohn’s disease, Perianal abscess", "keywords_en": "Fistulizing perianal Crohn’s disease, Perianal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/41359092/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 08 Dec 2025"}, {"id": "41345764", "title_en": "The diagnostic value of faecal calprotectin levels in patients with perianal fistula: A systematic review", "title_zh": "The diagnostic value of faecal calprotectin levels in patients with perianal fistula: A systematic review", "authors": "Dimitrios Chatziisaak", "abstract_en": "**Aim:** Perianal fistula (PAF) is a common condition encountered in surgical and gastroenterological practice. Distinguishing between cryptoglandular disease (CGD) and inflammatory bowel disease (IBD)-related perianal disease is critical to ensure appropriate management. Faecal calprotectin (FC) has emerged as a promising non-invasive biomarker for IBD; however, its role in acute perianal disease is not well established. This systematic review aimed to evaluate the diagnostic accuracy of FC in distinguishing IBD-related perianal disease from CGD.\n\n**Method:** A systematic literature search was conducted in PubMed, Embase and Cochrane databases following PRISMA guidelines. Studies were included if they assessed FC levels in patients with PAF and provided diagnostic accuracy metrics. Data extraction focused on study design, population characteristics, FC cut-off values, sensitivity, specificity and area under the curve (AUC) metrics.\n\n**Results:** Three studies met the inclusion criteria, all reporting significantly higher FC levels in IBD-related PAF compared to CGD-related fistulas. The proposed FC cut-off values varied, ranging from 110 μg/g to 344 μg/g, with corresponding sensitivities between 52% and 81%, as well as specificities between 77% and 93%. The AUC values indicated moderate to high diagnostic accuracy.\n\n**Conclusion:** FC shows potential as a diagnostic tool for differentiating IBD-related perianal disease from CGD. A cut-off of 110-150 μg/g appears most suitable for early screening, whereas a higher threshold may be appropriate for confirmatory diagnosis. Further prospective studies with standardized protocols are necessary to refine these thresholds and validate FC as a clinical decision-making tool.", "abstract_zh": "Perianal fistula (PAF) is a common condition encountered in surgical and gastroenterological practice. Distinguishing between cryptoglandular disease (CGD) and inflammatory bowel disease (IBD)-related perianal disease is critical to ensure appropriate management. Faecal calprotectin (FC) has emerged as a promising non-invasive biomarker for IBD; however, its role in acute perianal disease is not well established. This systematic review aimed to evaluate the diagnostic accuracy of FC in distinguishing IBD-related perianal disease from CGD.\n\nA systematic literature search was conducted in PubMed, Embase and Cochrane databases following PRISMA guidelines. Studies were included if they assessed FC levels in patients with PAF and provided diagnostic accuracy metrics. Data extraction focused on study design, population characteristics, FC cut-off values, sensitivity, specificity and area under the curve (AUC) metrics.\n\nThree studies met the inclusion criteria, all reporting significantly higher FC levels in IBD-related PAF compared to CGD-related fistulas. The proposed FC cut-off values varied, ranging from 110 μg/g to 344 μg/g, with corresponding sensitivities between 52% and 81%, as well as specificities between 77% and 93%. The AUC values indicated moderate to high diagnostic accuracy.\n\nFC shows potential as a diagnostic tool for differentiating IBD-related perianal disease from CGD. A cut-off of 110-150 μg/g appears most suitable for early screening, whereas a higher threshold may be appropriate for confirmatory diagnosis. Further prospective studies with standardized protocols are necessary to refine these thresholds and validate FC as a clinical decision-making tool.", "keywords_zh": "Crohn's disease, cryptoglandular disease, faecal calprotectin, inflammatory bowel disease, perianal fistula", "keywords_en": "Crohn's disease, cryptoglandular disease, faecal calprotectin, inflammatory bowel disease, perianal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/41345764/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 04 Dec 2025"}, {"id": "41342583", "title_en": "Letter to the Editor: commentary on \"Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Letter to the Editor: commentary on \"Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "authors": "Jingen Lu", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41342583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 04 Dec 2025"}, {"id": "41273375", "title_en": "Association Between Sexual Violence and Reported Anorectal Symptoms Among Adults: A Systematic Review", "title_zh": "Association Between Sexual Violence and Reported Anorectal Symptoms Among Adults: A Systematic Review", "authors": "Veronique Feipel", "abstract_en": "**Introduction And Hypothesis:** Individuals experiencing anorectal symptoms may report a history of sexual violence (SV) and conversely, survivors of SV may later report anorectal symptoms. However, the nature of the relationship between SV and these symptoms remains insufficiently understood. This review aims to systematically assess the reported prevalence and severity of anorectal symptoms, as well as their association with sexual violence, among adult survivors of both sexes.\n\n**Material And Methods:** Following the PRISMA guidelines, a systematic search of three databases, CINAHL, Embase, and MEDLINE/PubMed, was performed for quantitative observational studies concerning SV (rape, sexual harassment, childhood sexual abuse, female genital mutilation) as well as reported anorectal symptoms among adults. Cross-sectional, cohort, case-control, and case series studies published in English and French were included. The Mixed Methods Appraisal Tool (MMAT) was used for assessing the quality of included studies.\n\n**Results:** Thirteen studies met the inclusion criteria for data extraction. Most studies (12/13) were conducted in a medical setting with a cross-sectional design. Two cross-sectional studies assessed the prevalence of reported anorectal symptoms among SV survivors and 11 studies evaluated the prevalence of SV among patients with anorectal disorders. SV prevalence ranged from 4.1% to 62%. Constipation was the main studied symptom (9/13) followed by fecal incontinence (7/13), anorectal pain (2/13), and recto-vaginal fistula (1/13). Assessments for both SV and anorectal disorders lacked standardization, involving heterogeneous findings.\n\n**Conclusion:** This review highlights the need for more specific research using standardized assessment of SV and anorectal disorders to better understand their association to improve trauma-informed care pathways.", "abstract_zh": "Individuals experiencing anorectal symptoms may report a history of sexual violence (SV) and conversely, survivors of SV may later report anorectal symptoms. However, the nature of the relationship between SV and these symptoms remains insufficiently understood. This review aims to systematically assess the reported prevalence and severity of anorectal symptoms, as well as their association with sexual violence, among adult survivors of both sexes.\n\nFollowing the PRISMA guidelines, a systematic search of three databases, CINAHL, Embase, and MEDLINE/PubMed, was performed for quantitative observational studies concerning SV (rape, sexual harassment, childhood sexual abuse, female genital mutilation) as well as reported anorectal symptoms among adults. Cross-sectional, cohort, case-control, and case series studies published in English and French were included. The Mixed Methods Appraisal Tool (MMAT) was used for assessing the quality of included studies.\n\nThirteen studies met the inclusion criteria for data extraction. Most studies (12/13) were conducted in a medical setting with a cross-sectional design. Two cross-sectional studies assessed the prevalence of reported anorectal symptoms among SV survivors and 11 studies evaluated the prevalence of SV among patients with anorectal disorders. SV prevalence ranged from 4.1% to 62%. Constipation was the main studied symptom (9/13) followed by fecal incontinence (7/13), anorectal pain (2/13), and recto-vaginal fistula (1/13). Assessments for both SV and anorectal disorders lacked standardization, involving heterogeneous findings.\n\nThis review highlights the need for more specific research using standardized assessment of SV and anorectal disorders to better understand their association to improve trauma-informed care pathways.", "keywords_zh": "Anorectal symptoms, Constipation, Fecal incontinence, Sexual violence systematic review", "keywords_en": "Anorectal symptoms, Constipation, Fecal incontinence, Sexual violence systematic review", "link": "https://pubmed.ncbi.nlm.nih.gov/41273375/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 22 Nov 2025"}, {"id": "41267606", "title_en": "Efficacy of Adalimumab Biosimilars in Managing Perianal Fistula in Moderate to Severe Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Efficacy of Adalimumab Biosimilars in Managing Perianal Fistula in Moderate to Severe Crohn's Disease: A Systematic Review and Meta-Analysis", "authors": "M R Bakry", "abstract_en": "**Background:** Perianal fistulas represent a severe complication of Crohn's disease (CD), leading to significant morbidity and a decline in patients' quality of life. Adalimumab, a tumor necrosis factor (TNF) inhibitor, has been widely used for managing CD-related fistulas. However, with the introduction of adalimumab biosimilars, their comparative efficacy in fistula closure remains unclear. This systematic review and meta-analysis assessed the effectiveness and safety of adalimumab biosimilars in achieving complete fistula closure in moderate to severe CD.\n\n**Objective:** To evaluate the efficacy of adalimumab biosimilars in achieving complete fistula closure in patients with moderate to severe Crohn's disease, compared to placebo or standard therapies.\n\n**Methods:** A systematic review and meta-analysis were conducted following PRISMA guidelines. Studies published between 2007 and 2024 were retrieved from PubMed, Web of Science, Embase, Google Scholar, and the Cochrane Library. The included studies consisted of randomized controlled trials (RCTs), non-RCTs, case-control studies, and cohort studies that evaluated the efficacy of adalimumab biosimilars in fistula closure. Data extraction and quality assessment were independently performed using the MINORS evaluation tool. Heterogeneity was assessed using Q and I² statistics, and sensitivity analyses were conducted to explore potential sources of heterogeneity. Funnel plots were used to assess publication bias.\n\n**Results:** Ten studies met the inclusion criteria. The analysis demonstrated that adalimumab biosimilars significantly improved the complete fistula closure rate compared to placebo or conventional treatments. The pooled results indicated a moderate to high efficacy, with a statistically significant improvement in clinical remission rates (P < 0.05). Safety analysis revealed that adverse events were comparable between biosimilars and the original adalimumab, with no significant increase in serious adverse reactions. Sensitivity analysis confirmed the robustness of the findings, and publication bias assessment did not indicate significant bias.\n\n**Conclusions:** This meta-analysis supports the efficacy and safety of adalimumab biosimilars in managing perianal fistulas in moderate to severe CD. The findings suggest that adalimumab biosimilars are effective and safe in managing perianal fistulas in Crohn's disease, but further direct comparative studies with originator adalimumab are needed to establish equivalence. Further large-scale RCTs are recommended to confirm these results and establish long-term safety data.", "abstract_zh": "Perianal fistulas represent a severe complication of Crohn's disease (CD), leading to significant morbidity and a decline in patients' quality of life. Adalimumab, a tumor necrosis factor (TNF) inhibitor, has been widely used for managing CD-related fistulas. However, with the introduction of adalimumab biosimilars, their comparative efficacy in fistula closure remains unclear. This systematic review and meta-analysis assessed the effectiveness and safety of adalimumab biosimilars in achieving complete fistula closure in moderate to severe CD.\n\nTo evaluate the efficacy of adalimumab biosimilars in achieving complete fistula closure in patients with moderate to severe Crohn's disease, compared to placebo or standard therapies.\n\nA systematic review and meta-analysis were conducted following PRISMA guidelines. Studies published between 2007 and 2024 were retrieved from PubMed, Web of Science, Embase, Google Scholar, and the Cochrane Library. The included studies consisted of randomized controlled trials (RCTs), non-RCTs, case-control studies, and cohort studies that evaluated the efficacy of adalimumab biosimilars in fistula closure. Data extraction and quality assessment were independently performed using the MINORS evaluation tool. Heterogeneity was assessed using Q and I² statistics, and sensitivity analyses were conducted to explore potential sources of heterogeneity. Funnel plots were used to assess publication bias.\n\nTen studies met the inclusion criteria. The analysis demonstrated that adalimumab biosimilars significantly improved the complete fistula closure rate compared to placebo or conventional treatments. The pooled results indicated a moderate to high efficacy, with a statistically significant improvement in clinical remission rates (P < 0.05). Safety analysis revealed that adverse events were comparable between biosimilars and the original adalimumab, with no significant increase in serious adverse reactions. Sensitivity analysis confirmed the robustness of the findings, and publication bias assessment did not indicate significant bias.\n\nThis meta-analysis supports the efficacy and safety of adalimumab biosimilars in managing perianal fistulas in moderate to severe CD. The findings suggest that adalimumab biosimilars are effective and safe in managing perianal fistulas in Crohn's disease, but further direct comparative studies with originator adalimumab are needed to establish equivalence. Further large-scale RCTs are recommended to confirm these results and establish long-term safety data.", "keywords_zh": "Adalimumab, Crohn’s disease, adalimumab biosimilars, anti-TNF agents., biologic therapy, biosimilars, fistula closure, perianal fistula, tumor necrosis factor inhibitors", "keywords_en": "Adalimumab, Crohn’s disease, adalimumab biosimilars, anti-TNF agents., biologic therapy, biosimilars, fistula closure, perianal fistula, tumor necrosis factor inhibitors", "link": "https://pubmed.ncbi.nlm.nih.gov/41267606/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 21 Nov 2025"}, {"id": "41219674", "title_en": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Fistula Outcomes After Seton Removal in Patients with Perianal Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\n**Methods:** MEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\n**Results:** Eighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\n**Conclusions:** This systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "abstract_zh": "While setons are commonly used in the multidisciplinary care of patients with perianal fistulizing Crohn's disease (PFCD), fistula outcomes after their removal are poorly understood. We performed a systematic review with meta-analysis to evaluate fistula outcomes after seton removal in patients with PFCD.\n\nMEDLINE, EMBASE, Web of Science, and Cochrane databases were systematically searched until December 2023. We included studies reporting fistula outcomes after seton removal in PFCD. We used a hierarchy to stratify patients into one of three treatment categories: medical therapy alone, surgical closure, or cell/plasma-based therapy. Fistula outcomes were reported as weighted proportions with 95% confidence intervals (CI).\n\nEighty-two studies (n = 2441 patients) were analyzed. Mean/median seton duration varied widely (2 to 70 weeks). Pooled estimates (95% CI) of fistula outcomes after seton removal for patients treated in the medical therapy alone, surgical closure, or cell/plasma-based therapy categories were, respectively, 64% (54-75), 65% (52-78), and 71% (65-77) for fistula remission; 30% (22-38), 29% (16-42), and 20% (15-25) for recurrence; 15% (8-22), 11% (4-20), and 14% (8-21) for abscess formation; and 26% (18-35), 23% (17-29), and 13% (2-26) for surgical re-intervention. Fistula outcome estimates remained stable in multiple sensitivity analyses. Limited studies directly compared fistula outcomes based on seton duration, yielding inconsistent results.\n\nThis systematic review provides comprehensive estimates of fistula outcomes after seton removal and demonstrates substantial variability in seton duration. Future research is required to determine the optimal duration of setons.", "keywords_zh": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "keywords_en": "Anal fistula, Biologic therapy, Crohn’s disease, Drainage, Mesenchymal stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/41219674/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 11 Nov 2025"}, {"id": "41133388", "title_en": "Letter to the Editor: insights into \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "Letter to the Editor: insights into \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "authors": "Jing Wang", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41133388/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 24 Oct 2025"}, {"id": "40983150", "title_en": "Management of Perianal Abscesses in Infants: A Systematic Review From the APSA Outcomes and Evidence-Based Practice Committee", "title_zh": "Management of Perianal Abscesses in Infants: A Systematic Review From the APSA Outcomes and Evidence-Based Practice Committee", "authors": "American Pediatric Surgical Association Outcomes and Evidence-Based Practice Committee", "abstract_en": "**Background:** Management of infant perianal disease, including perianal abscess and fistula-in- ano (FIA), remains controversial. There is lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\n**Methods:** The American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\n**Results:** Over 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\n**Conclusions:** Both operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\n**Type Of Study:** Systematic Review of level 3-4 studies.\n\n**Level Of Evidence:** Level 4.", "abstract_zh": "Management of infant perianal disease, including perianal abscess and fistula-in- ano (FIA), remains controversial. There is lack of consensus regarding the risks and benefits of operative and non-operative approaches.\n\nThe American Pediatric Surgical Association Outcomes and Evidence Based Practice Committee created a priori consensus-based questions regarding the various approaches to management of perianal abscess and FIA in infants. A comprehensive search strategy was created, and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines were used to identify and review relevant articles and answer the established questions.\n\nOver 2460 titles and abstracts were screened to identify 31 manuscripts describing the expected course of perianal disease when managed with nonoperative management (NOM) strategies (such as hygiene, sitz baths, and systemic antibiotics), operative intervention for abscess only (incision and drainage (I&D)) or direct surgical management of the FIA (e.g. upfront fistulotomy). Initial failure of NOM is approximately 37.5 %. Recurrence rate after initial success with NOM or I&D is approximately 21 % and 24 %, respectively. The rate of FIA development is approximately 21 % after NOM and 20 % after I&D. Recurrence after operative management of FIA, regardless of approach, is 7 %. Time to complete resolution varies widely and does not appear to differ based on treatment strategy.\n\nBoth operative and non-operative approaches can be safely used in the management of perianal abscess and FIA but recurrence is common regardless of approach. Risks and benefits of each approach should be considered on a case-by-case basis.\n\nSystematic Review of level 3-4 studies.\n\nLevel 4.", "keywords_zh": "Fistula-in-ano, Fistulotomy, Infants, Perianal abscess, Perirectal abscess", "keywords_en": "Fistula-in-ano, Fistulotomy, Infants, Perianal abscess, Perirectal abscess", "link": "https://pubmed.ncbi.nlm.nih.gov/40983150/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 22 Sep 2025"}, {"id": "40936062", "title_en": "Effectiveness of Laser-Based Fistula Therapies with and without Adjunctive Measures in Anal Fistulas Management: A Systematic Review and Single-Arm Meta-Analysis", "title_zh": "Effectiveness of Laser-Based Fistula Therapies with and without Adjunctive Measures in Anal Fistulas Management: A Systematic Review and Single-Arm Meta-Analysis", "authors": "Stefano Baraldo", "abstract_en": "**Purpose:** Fistula Laser Closure (FiLaC®) is a sphincter-preserving technique for anal fistulas, but its efficacy and safety remain under discussion. Therefore, we aim to evaluate the efficacy and safety of FiLaC® in the management of patients with cryptoglandular fistulas.\n\n**Methods:** A systematic review was performed in MEDLINE, Embase, and Cochrane databases in January 2025, following PRISMA guidelines. We included randomized controlled trials (RCTs) and observational studies assessing FiLaC® for cryptoglandular fistulas, with or without surgical adjunctive measures. The main outcome was the primary healing rate. Secondary outcomes included fistula recurrence, incontinence, reoperation rates, and postoperative complications. Subgroup analyses explored variables related to the primary healing rate. Data are presented as percentages (95% confidence interval). Statistical analyses were performed using R (version 4.4.1 (2024-06-14 (ucrt)).\n\n**Results:** We included 24 studies with 1,503 patients. The pooled primary healing rate was 57.46% (49.40-65.33). Recurrence occurred in 18.48% of patients (10.14-28.47), while new-onset incontinence was rare (0.57%; 0.00-2.15). The reoperation rate was 36.49% (28.95-44.36), and anal abscesses or infections affected 6.54% (1.93-13.09) of patients. Subgroup analysis showed no statistically significant differences in the primary healing rate based on fistula type, adjunctive measures, or sex. Sensitivity analysis confirmed the robustness of our findings.\n\n**Conclusions:** FiLaC® seems to be a safe option with an intermediate healing rate in patients with cryptoglandular fistulas, although it is associated with a considerable recurrence rate. While its sphincter preservation advantage is evident, further RCTs standardizing the technique and adjunctive approaches are needed to optimize outcomes and refine its application in fistula management.", "abstract_zh": "Fistula Laser Closure (FiLaC®) is a sphincter-preserving technique for anal fistulas, but its efficacy and safety remain under discussion. Therefore, we aim to evaluate the efficacy and safety of FiLaC® in the management of patients with cryptoglandular fistulas.\n\nA systematic review was performed in MEDLINE, Embase, and Cochrane databases in January 2025, following PRISMA guidelines. We included randomized controlled trials (RCTs) and observational studies assessing FiLaC® for cryptoglandular fistulas, with or without surgical adjunctive measures. The main outcome was the primary healing rate. Secondary outcomes included fistula recurrence, incontinence, reoperation rates, and postoperative complications. Subgroup analyses explored variables related to the primary healing rate. Data are presented as percentages (95% confidence interval). Statistical analyses were performed using R (version 4.4.1 (2024-06-14 (ucrt)).\n\nWe included 24 studies with 1,503 patients. The pooled primary healing rate was 57.46% (49.40-65.33). Recurrence occurred in 18.48% of patients (10.14-28.47), while new-onset incontinence was rare (0.57%; 0.00-2.15). The reoperation rate was 36.49% (28.95-44.36), and anal abscesses or infections affected 6.54% (1.93-13.09) of patients. Subgroup analysis showed no statistically significant differences in the primary healing rate based on fistula type, adjunctive measures, or sex. Sensitivity analysis confirmed the robustness of our findings.\n\nFiLaC® seems to be a safe option with an intermediate healing rate in patients with cryptoglandular fistulas, although it is associated with a considerable recurrence rate. While its sphincter preservation advantage is evident, further RCTs standardizing the technique and adjunctive approaches are needed to optimize outcomes and refine its application in fistula management.", "keywords_zh": "Cryptoglandular fistulas, FiLaC, Healing rate, Meta-analysis, Rectal fistula", "keywords_en": "Cryptoglandular fistulas, FiLaC, Healing rate, Meta-analysis, Rectal fistula", "link": "https://pubmed.ncbi.nlm.nih.gov/40936062/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40933558", "title_en": "Adipose-derived stem cell therapies for complex anal fistula: a systematic review and meta-analysis of randomized controlled trials", "title_zh": "Adipose-derived stem cell therapies for complex anal fistula: a systematic review and meta-analysis of randomized controlled trials", "authors": "Wenjiang Wu", "abstract_en": "**Purpose:** This study aimed to systematically investigate the efficacy of adipose-derived stem cells (ASCs) in complex anal fistula treatment.\n\n**Methods:** This study systematically searched randomized controlled studies on the efficacy of ASCs in treating complex anal fistula published before June 2024 in PubMed, EMBASE, Web of Science, and Cochrane Library. Further, relevant journals were manually searched for relevant references, and two researchers independently performed literature search and screening, data extraction, and bias assessment. Stata version 12.0 was utilized to statistically analyze the healing rate of the anal fistula and the incidence of adverse events.\n\n**Results:** This study involved 1,056 patients from five randomized controlled trials, including 561 patients in the treatment group (ASCs/ASCs + fibrin glue) and 495 patients in the control group (fibrin glue/placebo). Meta-analysis revealed better short- and long-term efficacy of adipose mesenchymal stem cell treatment for complex perianal fistulas than in conventional treatment. However, no statistical difference was observed between mid-term and ultra-long-term treatments. Subgroup meta-analysis demonstrated a difference in efficacy between various cell doses. Further, all treatments with different sources of ASCs were superior to conventional quality.\n\n**Conclusion:** This study confirms that Adipose-derived Stem Cells can effectively improve short-term and long-term (1-year) clinical outcomes in patients with complex perianal fistulas, supporting their potential as a novel therapeutic strategy.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/view/CRD42024602327.", "abstract_zh": "This study aimed to systematically investigate the efficacy of adipose-derived stem cells (ASCs) in complex anal fistula treatment.\n\nThis study systematically searched randomized controlled studies on the efficacy of ASCs in treating complex anal fistula published before June 2024 in PubMed, EMBASE, Web of Science, and Cochrane Library. Further, relevant journals were manually searched for relevant references, and two researchers i
