": "Since their introduction, Hem-o-lok clips (HOLCs) have become widely accepted and increasingly reliable devices among surgeons performing minimally invasive surgery due to their effectiveness in achieving vascular pedicle control and haemostasis. Although HOLCs are generally regarded as safe devices, various complications have been reported. This review aimed to identify and summarise complications occurring at any time following HOLC use, from their initial introduction in January 1999 through...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42534720/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Fri, 31 Jul 2026"}, {"id": "42503488", "title_en": "Laser Hemorrhoidoplasty versus Excisional Hemorrhoidectomy: The Recovery-Durability Tradeoff in Hemorrhoid Surgery-A Systematic Review of Randomized Trials", "title_zh": "Laser Hemorrhoidoplasty versus Excisional Hemorrhoidectomy: The Recovery-Durability Tradeoff in Hemorrhoid Surgery-A Systematic Review of Randomized Trials", "authors": "Fernanda Bellotti Formiga", "abstract_en": "BackgroundExcisional hemorrhoidectomy remains the standard for advanced disease, while the applicability of laser hemorrhoidoplasty remains uncertain. This study evaluates the tradeoff between short-term recovery and long-term durability to inform patient-centered decision-making.MethodsA systematic search of PubMed, Web of Science, Scopus, and CENTRAL was conducted through September 2025. Randomized controlled trials (RCTs) comparing diode laser hemorrhoidoplasty with conventional...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42503488/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sun, 26 Jul 2026"}, {"id": "42489929", "title_en": "Rethinking congenital anal stenosis: a systematic review with histological observations toward a revised conceptual framework", "title_zh": "Rethinking congenital anal stenosis: a systematic review with histological observations toward a revised conceptual framework", "authors": "Go Miyano", "abstract_en": "The concept of congenital anal stenosis remains poorly defined, encompassing anatomically distinct conditions that may differ in pathogenesis and management. This study aimed to re-evaluate the current concept of congenital anal stenosis through a systematic review and histological examination of representative cases. We conducted a systematic review of English-language publications to assess clinical characteristics, treatment methods, and outcomes in patients diagnosed with congenital anal...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42489929/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Thu, 23 Jul 2026"}, {"id": "42470776", "title_en": "Assessment of the risk of developing second tumors after pediatric craniospinal irradiation", "title_zh": "Assessment of the risk of developing second tumors after pediatric craniospinal irradiation", "authors": "Ana Cravo Sá", "abstract_en": "CONCLUSION: This study provides a comparative and exploratory model-based assessment of second cancer risk after pediatric craniospinal radiotherapy. The findings support the importance of treatment technique selection in pediatric radiotherapy, while indicating that future studies should incorporate individualized treatment planning data and, when feasible, Monte Carlo-based dose reconstruction to improve the precision of absolute risk estimates.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42470776/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sat, 18 Jul 2026"}, {"id": "42455200", "title_en": "Single-stage versus staged reconstruction for high and intermediate anorectal malformations in neonates: a systematic review and meta-analysis", "title_zh": "Single-stage versus staged reconstruction for high and intermediate anorectal malformations in neonates: a systematic review and meta-analysis", "authors": "Chieu Minh Vuong", "abstract_en": "The surgical approach to high and intermediate anorectal malformations remains controversial. This systematic review compared continence and infection outcomes between the two approaches. MEDLINE, Embase, and Cochrane CENTRAL were searched per a registered protocol (PROSPERO CRD420261291319). Comparative studies of single-stage versus staged repair in neonates with high or intermediate anorectal malformations were included. Risk of bias was assessed using ROBINS-I. Random-effects meta-analysis...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42455200/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42449595", "title_en": "Macrophage Polarization as a Target for Colorectal Cancer Treatment Optimization: A Systematic Review", "title_zh": "Macrophage Polarization as a Target for Colorectal Cancer Treatment Optimization: A Systematic Review", "authors": "Susan Galandiuk", "abstract_en": "Background: Colorectal cancer (CRC) remains a leading cause of cancer-related mortality worldwide, with poor survival rates of late-stage disease. While immune checkpoint blockade (ICB) therapy has transformed treatment for mismatch repair-deficient (MMRd)/microsatellite instability-high (MSI-H) tumors, most CRC cases are mismatch repair-proficient (MMRp)/microsatellite-stable (MSS) and derive little to no benefit from current immunotherapy regimens. Tumor-associated macrophages (TAMs)...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42449595/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Wed, 15 Jul 2026"}, {"id": "42398078", "title_en": "Single-stapling versus double-stapling technique for rectal anastomosis-meta-analysis", "title_zh": "Single-stapling versus double-stapling technique for rectal anastomosis-meta-analysis", "authors": "Jim Tiernan", "abstract_en": "CONCLUSIONS: Although the causes of AL are multifactorial, with respect to the stapling technique, SST was associated with a lower risk of AL than DST, and this effect was primarily driven by transanal SST. However, the certainty of evidence is low, and ongoing prospective studies will better define the role of SST.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42398078/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Fri, 03 Jul 2026"}, {"id": "42374341", "title_en": "Laser hemorrhoidoplasty versus LigaSure hemorrhoidectomy for grade II-IV hemorrhoidal disease: a systematic review and meta-analysis", "title_zh": "Laser hemorrhoidoplasty versus LigaSure hemorrhoidectomy for grade II-IV hemorrhoidal disease: a systematic review and meta-analysis", "authors": "Yousef El-Ayman", "abstract_en": "CONCLUSION: LHP yields better perioperative outcomes, including less pain and faster recovery, making it a favorable option for patient comfort. However, LigH has lower recurrence rates. The certainty of evidence is very low. Further high-quality randomized trials are needed to confirm these results.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42374341/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Mon, 29 Jun 2026"}, {"id": "42373984", "title_en": "Single-stapled versus non-single-stapled colorectal anastomosis in minimally invasive anterior resections: a systematic review and meta-analysis", "title_zh": "Single-stapled versus non-single-stapled colorectal anastomosis in minimally invasive anterior resections: a systematic review and meta-analysis", "authors": "A Malik", "abstract_en": "CONCLUSIONS: Single-stapled anastomosis in minimally invasive anterior resection is associated with a lower pooled risk of anastomotic leak compared with non-single-stapled techniques. Despite heterogeneity in secondary outcomes, SST appears to be a promising technical refinement; however, randomised trials are required before routine adoption.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42373984/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Mon, 29 Jun 2026"}, {"id": "42348182", "title_en": "Long-term impact of haemorrhoidal artery ligation on anal function and continence", "title_zh": "Long-term impact of haemorrhoidal artery ligation on anal function and continence", "authors": "A Arif", "abstract_en": "AIMS: Haemorrhoidal artery ligation (HALO) and variants including Doppler-guided HAL (DG-HAL), HAL with rectoanal repair (HAL-RAR), and transanal haemorrhoidal dearterialisation (THD) serve as minimally invasive alternatives to excisional haemorrhoidectomy, reducing pain while preserving sphincter function. Long-term faecal incontinence remains a concern due to its quality-of-life impact. This systematic review assessed prevalence, severity, and patterns of incontinence beyond six months...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42348182/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Thu, 25 Jun 2026"}, {"id": "42341213", "title_en": "Hospital and surgeon volume versus outcomes after colorectal cancer surgery: umbrella review and meta-analysis", "title_zh": "Hospital and surgeon volume versus outcomes after colorectal cancer surgery: umbrella review and meta-analysis", "authors": "Francesco Giovinazzo", "abstract_en": "CONCLUSION: High-volume hospitals and surgeons are associated with both improved short- and long-term outcomes for patients undergoing colorectal cancer surgery. However, a specific cut-off definition for high- versus low-volume hospitals and surgeons is yet to be elucidated owing to the heterogeneity of existing volume definitions. Future studies are required to confirm a threshold for this dose-response relationship.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/42341213/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Wed, 24 Jun 2026"}, {"id": "42330709", "title_en": "Systematic review and Bayesian network meta-analysis comparing multiple anastomotic techniques after total mesorectal excision in rectal cancer", "title_zh": "Systematic review and Bayesian network meta-analysis comparing multiple anastomotic techniques after total mesorectal excision in rectal cancer", "authors": "Jacques Marescaux", "abstract_en": "CONCLUSIONS: The findings of this study suggest that TTSS may be associated with a lower risk of postoperative AL after ence. Further large, high-quality studies incorporating standardized definitions of AL and patient-specific risk stratification are warranted.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41832382/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sun, 15 Mar 2026"}, {"id": "41822113", "title_en": "Perioperative outcomes of robotic-assisted vs. conventional laparoscopy for colorectal cancer resection: a systematic review and meta-analysis", "title_zh": "Perioperative outcomes of robotic-assisted vs. conventional laparoscopy for colorectal cancer resection: a systematic review and meta-analysis", "authors": "Ashraf Abdelmonem Elsayed", "abstract_en": "CONCLUSION: When compared to CLS, RAS has the advantage of lowering conversion and re-operation rates, albeit at the expense of higher operating time. CLS led to shorter hospital stays, but in some circumstances, the complication rates were on level with or lower than those of RAS. According to these results, RAS might be useful in some surgical situations and patient demographics.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/41822113/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Fri, 13 Mar 2026"}, {"id": "41821307", "title_en": "Preoperative low-energy diets for patients with a body mass index >30 kg/m2 undergoing non-bariatric surgery: pilot feasibility randomized clinical trial and a systematic review and meta-analysis of efficacy data", "title_zh": "Preoperative low-energy diets for patients with a body mass index >30 kg/m2 undergoing non-bariatric surgery: pilot feasibility randomized clinical trial and a systematic review and meta-analysis of efficacy g", "abstract_en": "CONCLUSION: EOCRC often presents with more aggressive and metastatic features due to its frequent diagnosis at advanced stages. TP53 mutations and the MSI-H status are prevalent in EOCRC. EOCRC's prognosis is often comparable to LOCRC. Radical and tailored treatment strategies should be developed to improve the survival outcomes in advanced and metastatic EOCRC.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40956186/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Tue, 16 Sep 2025"}, {"id": "40944330", "title_en": "Efficacy and safety of methylene blue for postoperative pain of haemorrhoids: a systematic review and meta-analysis", "title_zh": "Efficacy and safety of methylene blue for postoperative pain of haemorrhoids: a systematic review and meta-analysis", "authors": "Li Xu", "abstract_en": "CONCLUSIONS: This study shows that methylene blue can reduce postoperative pain, decrease analgesic use and does not increase complications after haemorrhoid surgery.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40944330/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sat, 13 Sep 2025"}, {"id": "40914745", "title_en": "Robotic versus laparoscopic total mesorectal excision for mid-low rectal cancer after neoadjuvant chemoradiotherapy: a systematic review and meta-analysis of oncological, perioperative, and survival-related outcomes", "title_zh": "Robotic versus laparoscopic total mesorectal excision for mid-low rectal cancer after neoadjuvant chemoradiotherapy: a systematic review and meta-analysis of oncological, perioperative, and survival-related outcomes", "authors": "Shukai Wang", "abstract_en": "A major cause of cancer death, colorectal cancer is becoming more common in younger people. The comparative effectiveness of robotic versus laparoscopic total mesorectal excision (TME) as surgical interventions for mid-low rectal cancer following neoadjuvant chemoradiotherapy (nCRT) remains uncertain. To systematically evaluate oncological, perioperative, and survival outcomes of robotic versus laparoscopic surgery for mid-low rectal cancer following nCRT. A PRISMA-compliant systematic review...", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40914745/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Sat, 06 Sep 2025"}, {"id": "40907429", "title_en": "ICG-FA for Anastomotic Leak Prevention During Minimally Invasive Colorectal Surgery: A Meta-analysis", "title_zh": "ICG-FA for Anastomotic Leak Prevention During Minimally Invasive Colorectal Surgery: A Meta-analysis", "authors": "Muhammad Shehryar Hussain", "abstract_en": "CONCLUSIONS: ICG-FA significantly reduces anastomotic leakage and overall complications in minimally invasive colorectal surgery, especially for left-sided anastomoses. However, its use is associated with a slightly longer operative time. Further research is needed to confirm its role in right-sided procedures and long-term outcomes.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40907429/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Thu, 04 Sep 2025"}, {"id": "40905480", "title_en": "Neoadjuvant Chemotherapy Without Radiation for Locally Advanced Rectal Cancer: A Meta-analysis of Surgical Outcomes After Total Mesorectal Excision", "title_zh": "Neoadjuvant Chemotherapy Without Radiation for Locally Advanced Rectal Cancer: A Meta-analysis of Surgical Outcomes After Total Mesorectal Excision", "authors": "Dean A Fergusson", "abstract_en": "CONCLUSIONS: Important surgical outcomes were not reported in trials comparing neoadjuvant chemotherapy alone to chemoradiation therapy for locally advanced rectal cancer. Based on the limited data available, chemotherapy alone was associated with reduced risk of anastomotic leak, diverting ostomy use, and ostomy nonreversal. See Video Abstract .", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40905480/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Thu, 04 Sep 2025"}, {"id": "40894328", "title_en": "Systematic meta-review: diagnostic accuracy of colon capsule endoscopy for colonic neoplasia with umbrella meta-analysis", "title_zh": "Systematic meta-review: diagnostic accuracy of colon capsule endoscopy for colonic neoplasia with umbrella meta-analysis", "authors": "Anastasios Koulaouzidis", "abstract_en": "CONCLUSION: CCE2 has high diagnostic accuracy for polyps and colorectal cancer detection. While technical challenges persist, CCE2 shows promise as a complementary diagnostic tool to help address the increasing demands for endoscopy services.", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40894328/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1p9j2Ia0knTignEE7vvWNCOPD-p8oHaBJk6HqSr1JJOMQoMsn2&fc=20260103012326&ff=20260918235559&v=2.20.1", "date": "Tue, 02 Sep 2025"}, {"id": "40877526", "title_en": "Outcomes of embolization therapy of superior rectal arteries for the management of grade 1 to 3 internal hemorrhoids: a systematic Review of clinical studies", "title_zh": "Outcomes of embolization therapy of superior rectal arteries for the management of grade
