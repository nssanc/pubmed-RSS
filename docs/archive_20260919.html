cidence of related adverse events.", "keywords_zh": "efficacy and safety, meta-analysis, mixed nutrition, parenteral nutrition, postoperative esophageal cancer", "keywords_en": "efficacy and safety, meta-analysis, mixed nutrition, parenteral nutrition, postoperative esophageal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/39175475/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 23 Aug 2024"}, {"id": "39127896", "title_en": "Efficacy and safety of autologous platelet-rich plasma in anal fistula: a systematic review and meta-analysis", "title_zh": "Efficacy and safety of autologous platelet-rich plasma in anal fistula: a systematic review and meta-analysis", "authors": "Chang Ge", "abstract_en": "**Introduction:** This study aimed to determine the efficacy and safety of autologous PRP in anal fistula.\n\n**Methods:** The search was done in electronic databases such as; PubMed, Scopus, Google Scholar, Embase, and Cochrane Library. The outcomes investigated in this study were the rate of improvement, the rate of recurrence, and the rate of fecal incontinence.\n\n**Results:** Cure, incontinence, and recurrence rates were 68% (95% CI, .60-.76), 27% (95% CI, .12-.46), and 18% (95% CI, .12-.26), respectively. The pooled improvement ratio in patients treated with PRP compared to control group was 1.35 times, which was statistically significant (pooled OR=1.35, 95% CI, 1.14-1.60, <i>P</i><001). The pooled recurrence ratio in patients treated with PRP compared to control group was 1.17, which was not statistically significant (pooled OR=1.17, 95% CI, 0.44-3.11).\n\n**Discussion:** Platelet-rich plasma is an effective method of healing people with anal fistula.", "abstract_zh": "This study aimed to determine the efficacy and safety of autologous PRP in anal fistula.\n\nThe search was done in electronic databases such as; PubMed, Scopus, Google Scholar, Embase, and Cochrane Library. The outcomes investigated in this study were the rate of improvement, the rate of recurrence, and the rate of fecal incontinence.\n\nCure, incontinence, and recurrence rates were 68% (95% CI, .60-.76), 27% (95% CI, .12-.46), and 18% (95% CI, .12-.26), respectively. The pooled improvement ratio in patients treated with PRP compared to control group was 1.35 times, which was statistically significant (pooled OR=1.35, 95% CI, 1.14-1.60, <i>P</i><001). The pooled recurrence ratio in patients treated with PRP compared to control group was 1.17, which was not statistically significant (pooled OR=1.17, 95% CI, 0.44-3.11).\n\nPlatelet-rich plasma is an effective method of healing people with anal fistula.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/39127896/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sun, 11 Aug 2024"}, {"id": "39118327", "title_en": "The prevalence of pouch fistulas in ulcerative colitis following restorative proctocolectomy: a systematic review and meta-analysis", "title_zh": "The prevalence of pouch fistulas in ulcerative colitis following restorative proctocolectomy: a systematic review and meta-analysis", "authors": "Jonathan P Segal", "abstract_en": "**Background/Aims:** One complication of restorative proctocolectomy with ileo-anal pouch anastomosis is fistula formation in the pouch. Fistulas can be associated with significant morbidity and pouch failure. We conducted a systematic review with meta- analysis to try and understand the prevalence of pouch fistulas in patients with ulcerative colitis following restorative proctocolectomy.\n\n**Methods:** The Embase, Embase Classic, and PubMed databases were searched between January 1979 and April 2022. Studies were included if there were cross-sectional, case-controlled, population-based or cohort studies reporting on prevalence of pouch fistulas in ulcerative colitis. Studies had to report the number of patients with pouch fistulas using either clinical, endoscopic, or radiological diagnosis in an adult population.\n\n**Results:** Thirty-three studies screened met the inclusion criteria. The pooled prevalence of developing at least 1 fistula was 0.05 (95% confidence interval [CI], 0.04-0.07). The pooled prevalence of pouch failure in patients with pouch fistula was found to be 0.24 (95% CI, 0.19-0.30). The pooled prevalence of developing a pouch fistula at 3 years, 5 years and more than 5 years was 0.04 (95% CI, 0.02-0.07), 0.05 (95% CI, 0.02-0.07), and 0.05 (95% CI, 0.02-0.10), respectively.\n\n**Conclusions:** This is the first systematic review and meta-analysis to report the prevalence of pouch fistula. It also provides a pooled prevalence of pouch failure in these patients. These results can help to shape future guidelines, power future studies, and help counsel patients.", "abstract_zh": "One complication of restorative proctocolectomy with ileo-anal pouch anastomosis is fistula formation in the pouch. Fistulas can be associated with significant morbidity and pouch failure. We conducted a systematic review with meta- analysis to try and understand the prevalence of pouch fistulas in patients with ulcerative colitis following restorative proctocolectomy.\n\nThe Embase, Embase Classic, and PubMed databases were searched between January 1979 and April 2022. Studies were included if there were cross-sectional, case-controlled, population-based or cohort studies reporting on prevalence of pouch fistulas in ulcerative colitis. Studies had to report the number of patients with pouch fistulas using either clinical, endoscopic, or radiological diagnosis in an adult population.\n\nThirty-three studies screened met the inclusion criteria. The pooled prevalence of developing at least 1 fistula was 0.05 (95% confidence interval [CI], 0.04-0.07). The pooled prevalence of pouch failure in patients with pouch fistula was found to be 0.24 (95% CI, 0.19-0.30). The pooled prevalence of developing a pouch fistula at 3 years, 5 years and more than 5 years was 0.04 (95% CI, 0.02-0.07), 0.05 (95% CI, 0.02-0.07), and 0.05 (95% CI, 0.02-0.10), respectively.\n\nThis is the first systematic review and meta-analysis to report the prevalence of pouch fistula. It also provides a pooled prevalence of pouch failure in these patients. These results can help to shape future guidelines, power future studies, and help counsel patients.", "keywords_zh": "Fistula, Pouch, Restorative proctocolectomy, Ulcerative colitis", "keywords_en": "Fistula, Pouch, Restorative proctocolectomy, Ulcerative colitis", "link": "https://pubmed.ncbi.nlm.nih.gov/39118327/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 09 Aug 2024"}, {"id": "38910957", "title_en": "Current Status and Role of Artificial Intelligence in Anorectal Diseases and Pelvic Floor Disorders", "title_zh": "Current Status and Role of Artificial Intelligence in Anorectal Diseases and Pelvic Floor Disorders", "authors": "Jasneet Bhullar", "abstract_en": "**Background:** Anorectal diseases and pelvic floor disorders are prevalent among the general population. Patients may present with overlapping symptoms, delaying diagnosis, and lowering quality of life. Treating physicians encounter numerous challenges attributed to the complex nature of pelvic anatomy, limitations of diagnostic techniques, and lack of available resources. This article is an overview of the current state of artificial intelligence (AI) in tackling the difficulties of managing benign anorectal disorders and pelvic floor disorders.\n\n**Methods:** A systematic literature review was performed according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. We searched the PubMed database to identify all potentially relevant studies published from January 2000 to August 2023. Search queries were built using the following terms: AI, machine learning, deep learning, benign anorectal disease, pelvic floor disorder, fecal incontinence, obstructive defecation, anal fistula, rectal prolapse, and anorectal manometry. Malignant anorectal articles and abstracts were excluded. Data from selected articles were analyzed.\n\n**Results:** 139 articles were found, 15 of which met our inclusion and exclusion criteria. The most common AI module was convolutional neural network. researchers were able to develop AI modules to optimize imaging studies for pelvis, fistula, and abscess anatomy, facilitated anorectal manometry interpretation, and improved high-definition anoscope use. None of the modules were validated in an external cohort.\n\n**Conclusion:** There is potential for AI to enhance the management of pelvic floor and benign anorectal diseases. Ongoing research necessitates the use of multidisciplinary approaches and collaboration between physicians and AI programmers to tackle pressing challenges.", "abstract_zh": "Anorectal diseases and pelvic floor disorders are prevalent among the general population. Patients may present with overlapping symptoms, delaying diagnosis, and lowering quality of life. Treating physicians encounter numerous challenges attributed to the complex nature of pelvic anatomy, limitations of diagnostic techniques, and lack of available resources. This article is an overview of the current state of artificial intelligence (AI) in tackling the difficulties of managing benign anorectal disorders and pelvic floor disorders.\n\nA systematic literature review was performed according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses guidelines. We searched the PubMed database to identify all potentially relevant studies published from January 2000 to August 2023. Search queries were built using the following terms: AI, machine learning, deep learning, benign anorectal disease, pelvic floor disorder, fecal incontinence, obstructive defecation, anal fistula, rectal prolapse, and anorectal manometry. Malignant anorectal articles and abstracts were excluded. Data from selected articles were analyzed.\n\n139 articles were found, 15 of which met our inclusion and exclusion criteria. The most common AI module was convolutional neural network. researchers were able to develop AI modules to optimize imaging studies for pelvis, fistula, and abscess anatomy, facilitated anorectal manometry interpretation, and improved high-definition anoscope use. None of the modules were validated in an external cohort.\n\nThere is potential for AI to enhance the management of pelvic floor and benign anorectal diseases. Ongoing research necessitates the use of multidisciplinary approaches and collaboration between physicians and AI programmers to tackle pressing challenges.", "keywords_zh": "Anorectal disease, Artificial intelligence, Deep learning, Pelvic floor disorder", "keywords_en": "Anorectal disease, Artificial intelligence, Deep learning, Pelvic floor disorder", "link": "https://pubmed.ncbi.nlm.nih.gov/38910957/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 24 Jun 2024"}, {"id": "38871152", "title_en": "Perianal Fistulizing Crohn's Disease-Associated Anorectal and Fistula Cancers: Systematic Review and Expert Consensus", "title_zh": "Perianal Fistulizing Crohn's Disease-Associated Anorectal and Fistula Cancers: Systematic Review and Expert Consensus", "authors": "Jean-Frederic Colombel", "abstract_en": "**Background & Aims:** Perianal fistulizing Crohn's disease (PFCD)-associated anorectal and fistula cancers are rare but often devastating diagnoses. However, given the low incidence and consequent lack of data and clinical trials in the field, there is little to no guidance on screening and management of these cancers. To inform clinical practice, we developed consensus guidelines on PFCD-associated anorectal and fistula cancers by multidisciplinary experts from the international TOpClass consortium.\n\n**Methods:** We conducted a systematic review by standard methodology, using the Newcastle-Ottawa Scale quality assessment tool. We subsequently developed consensus statements using a Delphi consensus approach.\n\n**Results:** Of 561 articles identified, 110 were eligible, and 76 articles were included. The overall quality of evidence was low. The TOpClass consortium reached consensus on 6 structured statements addressing screening, risk assessment, and management of PFCD-associated anorectal and fistula cancers. Patients with long-standing (>10 years) PFCD should be considered at small but increased risk of developing perianal cancer, including squamous cell carcinoma of the anus and anorectal carcinoma. Risk factors for squamous cell carcinoma of the anus, notably human papilloma virus, should be considered. New, refractory, or progressive perianal symptoms should prompt evaluation for fistula cancer. There was no consensus on timing or frequency of screening in patients with asymptomatic perianal fistula. Multiple modalities may be required for diagnosis, including an examination under anesthesia with biopsy. Multidisciplinary team efforts were deemed central to the management of fistula cancers.\n\n**Conclusions:** Inflammatory bowel disease clinicians should be aware of the risk of PFCD-associated anorectal and fistula cancers in all patients with PFCD. The TOpClass consortium consensus statements outlined herein offer guidance in managing this challenging scenario.", "abstract_zh": "Perianal fistulizing Crohn's disease (PFCD)-associated anorectal and fistula cancers are rare but often devastating diagnoses. However, given the low incidence and consequent lack of data and clinical trials in the field, there is little to no guidance on screening and management of these cancers. To inform clinical practice, we developed consensus guidelines on PFCD-associated anorectal and fistula cancers by multidisciplinary experts from the international TOpClass consortium.\n\nWe conducted a systematic review by standard methodology, using the Newcastle-Ottawa Scale quality assessment tool. We subsequently developed consensus statements using a Delphi consensus approach.\n\nOf 561 articles identified, 110 were eligible, and 76 articles were included. The overall quality of evidence was low. The TOpClass consortium reached consensus on 6 structured statements addressing screening, risk assessment, and management of PFCD-associated anorectal and fistula cancers. Patients with long-standing (>10 years) PFCD should be considered at small but increased risk of developing perianal cancer, including squamous cell carcinoma of the anus and anorectal carcinoma. Risk factors for squamous cell carcinoma of the anus, notably human papilloma virus, should be considered. New, refractory, or progressive perianal symptoms should prompt evaluation for fistula cancer. There was no consensus on timing or frequency of screening in patients with asymptomatic perianal fistula. Multiple modalities may be required for diagnosis, including an examination under anesthesia with biopsy. Multidisciplinary team efforts were deemed central to the management of fistula cancers.\n\nInflammatory bowel disease clinicians should be aware of the risk of PFCD-associated anorectal and fistula cancers in all patients with PFCD. The TOpClass consortium consensus statements outlined herein offer guidance in managing this challenging scenario.", "keywords_zh": "Anorectal Cancer, Inflammatory Bowel Disease, Perianal Fistulizing Crohn’s Disease", "keywords_en": "Anorectal Cancer, Inflammatory Bowel Disease, Perianal Fistulizing Crohn’s Disease", "link": "https://pubmed.ncbi.nlm.nih.gov/38871152/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 13 Jun 2024"}, {"id": "38491943", "title_en": "Does Combined Medical and Surgical Treatment Improve Perianal Fistula Outcomes in Patients With Crohn's Disease? A Systematic Review and Meta-Analysis", "title_zh": "Does Combined Medical and Surgical Treatment Improve Perianal Fistula Outcomes in Patients With Crohn's Disease? A Systematic Review and Meta-Analysis", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** The optimal treatment of perianal fistulizing Crohn's disease [PFCD] is unknown. We performed a systematic review with meta-analysis to compare combined surgical intervention and anti-tumour necrosis factor [anti-TNF] therapy [combined therapy] vs either therapy alone.\n\n**Methods:** MEDLINE, EMBASE, and Cochrane databases were searched systematically up to end December 2023. Surgical intervention was defined as an exam under anaesthesia ± setons. We calculated weighted risk ratios [RRs] with 95% confidence intervals [CIs] for our co-primary outcomes: fistula response and healing, defined clinically as a reduction in fistula drainage or number of draining fistulas and fistula closure respectively.\n\n**Results:** Thirteen studies were analysed: 515 patients treated with combined therapy, 330 patients with surgical intervention, and 406 patients with anti-TNF therapy with follow-up between 10 weeks and 3 years. Fistula response [RR 1.10; 95% CI 0.93-1.30, p = 0.28] and healing [RR 1.06; 95% CI 0.86-1.31, p = 0.58] was not significantly different when comparing combined therapy with anti-TNF therapy alone. In contrast, combined therapy was associated with significantly higher rates of fistula response [RR 1.25; 95% CI 1.10-1.41, p < 0.001] and healing [RR 1.17; 95% CI 1.00-1.36, p = 0.05] compared with surgical intervention alone. Our results remained stable when limiting to studies that assessed outcomes within 1 year and studies where <10% of patients underwent fistula closure procedures.\n\n**Conclusion:** Combined surgery and anti-TNF therapy was not associated with improved PFCD outcomes compared with anti-TNF therapy alone. Due to an inability to control for confounding and small study sizes, future, controlled trials are warranted to confirm these findings.", "abstract_zh": "The optimal treatment of perianal fistulizing Crohn's disease [PFCD] is unknown. We performed a systematic review with meta-analysis to compare combined surgical intervention and anti-tumour necrosis factor [anti-TNF] therapy [combined therapy] vs either therapy alone.\n\nMEDLINE, EMBASE, and Cochrane databases were searched systematically up to end December 2023. Surgical intervention was defined as an exam under anaesthesia ± setons. We calculated weighted risk ratios [RRs] with 95% confidence intervals [CIs] for our co-primary outcomes: fistula response and healing, defined clinically as a reduction in fistula drainage or number of draining fistulas and fistula closure respectively.\n\nThirteen studies were analysed: 515 patients treated with combined therapy, 330 patients with surgical intervention, and 406 patients with anti-TNF therapy with follow-up between 10 weeks and 3 years. Fistula response [RR 1.10; 95% CI 0.93-1.30, p = 0.28] and healing [RR 1.06; 95% CI 0.86-1.31, p = 0.58] was not significantly different when comparing combined therapy with anti-TNF therapy alone. In contrast, combined therapy was associated with significantly higher rates of fistula response [RR 1.25; 95% CI 1.10-1.41, p < 0.001] and healing [RR 1.17; 95% CI 1.00-1.36, p = 0.05] compared with surgical intervention alone. Our results remained stable when limiting to studies that assessed outcomes within 1 year and studies where <10% of patients underwent fistula closure procedures.\n\nCombined surgery and anti-TNF therapy was not associated with improved PFCD outcomes compared with anti-TNF therapy alone. Due to an inability to control for confounding and small study sizes, future, controlled trials are warranted to confirm these findings.", "keywords_zh": "Perianal fistula, anti-TNF, combined medical and surgical", "keywords_en": "Perianal fistula, anti-TNF, combined medical and surgical", "link": "https://pubmed.ncbi.nlm.nih.gov/38491943/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Sat, 16 Mar 2024"}, {"id": "38475976", "title_en": "Martius flaps for low rectovaginal fistulae: a systematic review and proportional meta-analysis", "title_zh": "Martius flaps for low rectovaginal fistulae: a systematic review and proportional meta-analysis", "authors": "Shaheel Mohammad Sahebally", "abstract_en": "**Background:** Rectovaginal fistulae (RVF) are notoriously challenging to treat. Martius flap (MF) is a technique employed to manage RVF, among various others, with none being universally successful. We aimed to assess the outcomes of RVF managed with MF interposition.\n\n**Methods:** A PRISMA-compliant meta-analysis searching for all studies specifically reporting on the outcomes of MF for RVF was performed. The primary objective was the mean success rate, whilst secondary objectives included complications and recurrence. The MedCalc software (version 20.118) was used to conduct proportional meta-analyses of data. Weighted mean values with 95% CI are presented and stratified according to aetiology where possible.\n\n**Results:** Twelve non-randomized (11 retrospective, 1 prospective) studies, assessing 137 MF were included. The mean age of the study population was 42.4 (±15.7), years. There were 44 primary and 93 recurrent RVF. The weighted mean success rate for MF when performed for primary RVF was 91.4% (95% CI: 79.45-98.46; I<sup>2</sup> = 32.1%; P = 0.183) and that for recurrent RVF was 77.5% (95% CI: 62.24-89.67; I<sup>2</sup> = 58.1%; P = 0.008). The weighted mean complication rate was 29% (95% CI: 8.98-54.68; I<sup>2</sup> = 85.4%; P < 0.0001) and the overall recurrence rate was 12.0% (95% CI: 5.03-21.93; I<sup>2</sup> = 52.3%; P = 0.021). When purely radiotherapy-induced RVF were evaluated, the mean overall success rate was 94.6% (95% CI: 83.33-99.75; I<sup>2</sup> = 0%; P = 0.350).\n\n**Conclusions:** MF interposition appears to be more effective for primary than recurrent RVF. However, the poor quality of the data limits definitive conclusions being drawn and demands further assessment with randomized studies.", "abstract_zh": "Rectovaginal fistulae (RVF) are notoriously challenging to treat. Martius flap (MF) is a technique employed to manage RVF, among various others, with none being universally successful. We aimed to assess the outcomes of RVF managed with MF interposition.\n\nA PRISMA-compliant meta-analysis searching for all studies specifically reporting on the outcomes of MF for RVF was performed. The primary objective was the mean success rate, whilst secondary objectives included complications and recurrence. The MedCalc software (version 20.118) was used to conduct proportional meta-analyses of data. Weighted mean values with 95% CI are presented and stratified according to aetiology where possible.\n\nTwelve non-randomized (11 retrospective, 1 prospective) studies, assessing 137 MF were included. The mean age of the study population was 42.4 (±15.7), years. There were 44 primary and 93 recurrent RVF. The weighted mean success rate for MF when performed for primary RVF was 91.4% (95% CI: 79.45-98.46; I<sup>2</sup> = 32.1%; P = 0.183) and that for recurrent RVF was 77.5% (95% CI: 62.24-89.67; I<sup>2</sup> = 58.1%; P = 0.008). The weighted mean complication rate was 29% (95% CI: 8.98-54.68; I<sup>2</sup> = 85.4%; P < 0.0001) and the overall recurrence rate was 12.0% (95% CI: 5.03-21.93; I<sup>2</sup> = 52.3%; P = 0.021). When purely radiotherapy-induced RVF were evaluated, the mean overall success rate was 94.6% (95% CI: 83.33-99.75; I<sup>2</sup> = 0%; P = 0.350).\n\nMF interposition appears to be more effective for primary than recurrent RVF. However, the poor quality of the data limits definitive conclusions being drawn and demands further assessment with randomized studies.", "keywords_zh": "complication, fistula, primary, rectovaginal, recurrence, success", "keywords_en": "complication, fistula, primary, rectovaginal, recurrence, success", "link": "https://pubmed.ncbi.nlm.nih.gov/38475976/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 13 Mar 2024"}, {"id": "38315695", "title_en": "Obstetric fistula repair failure and its associated factors among women who underwent repair in sub-Saharan Africa. A systematic review and meta-analysis", "title_zh": "Obstetric fistula repair failure and its associated factors among women who underwent repair in sub-Saharan Africa. A systematic review and meta-analysis", "authors": "Mesfin Abebe", "abstract_en": "**Background:** Obstetric fistula repair failure can result in increased depression, social isolation, financial burden for the woman, and fistula care programs. However, there is limited, comprehensive evidence on obstetric fistula repair failure in Sub-Saharan African countries. This systematic review and meta-analysis aimed to determine the pooled prevalence of obstetric fistula repair failure and associated factors among women who underwent surgical repair in Sub-Saharan African countries.\n\n**Methods:** To identify potential articles, a systematic search was done utilizing online databases (PubMed, Hinari, and Google Scholar). The Preferred Reporting Items for Systematic Review and Meta-Analysis Statement (PRISMA) guideline was used to report the review's findings. I2 test statistics were employed to examine study heterogeneity. A random-effects model was used to assess the pooled prevalence of obstetric fistula repair failure, and the association was determined using the log odds ratio. Publication bias was investigated using the funnel plot and Egger's statistical test at the 5% level of significance. Meta-regression and subgroup analysis were done to identify potential sources of heterogeneity. The data were analyzed using STATA version 17 statistical software.\n\n**Results:** A total of 24 articles with 9866 study participants from 13 Sub-Saharan African countries were included in this meta-analysis. The pooled prevalence of obstetric fistula repair failure in sub-Saharan Africa was 24.92% [95% CI: 20.34-29.50%]. The sub-group analysis by country revealed that the highest prevalence was in Angola (58%, 95% CI: 53.20-62.80%) and the lowest in Rwanda (13.9, 95% CI: 9.79-18.01%). Total urethral damage [OR  =  3.50, 95% CI: 2.09, 4.91], large fistula [OR = 3.09, 95% CI: (2.00, 4.10)], duration of labor [OR = 0.45, 95% CI: 0.27, 0.76], and previous fistula repair [OR = 2.70, 95% CI: 1.94, 3.45] were factors associated with obstetric fistula repair failure.\n\n**Conclusion:** Women who received surgical treatment for obstetric fistulas in Sub-Saharan African countries experienced more repair failures than the WHO standards. Obstetric fistula repair failure was affected by urethral damage, fistula size, duration of labor, types of fistula, and history of previous repairs. Therefore, we suggest policy measures specific to each country to provide special attention to the prevention of all risk factors, including poor nutrition, multiparty, obstructed labor, and maternal age, which can result in conditions like large fistulas, urethral damage, and repeat repair, in order to reduce obstetric fistula repair failure.", "abstract_zh": "Obstetric fistula repair failure can result in increased depression, social isolation, financial burden for the woman, and fistula care programs. However, there is limited, comprehensive evidence on obstetric fistula repair failure in Sub-Saharan African countries. This systematic review and meta-analysis aimed to determine the pooled prevalence of obstetric fistula repair failure and associated factors among women who underwent surgical repair in Sub-Saharan African countries.\n\nTo identify potential articles, a systematic search was done utilizing online databases (PubMed, Hinari, and Google Scholar). The Preferred Reporting Items for Systematic Review and Meta-Analysis Statement (PRISMA) guideline was used to report the review's findings. I2 test statistics were employed to examine study heterogeneity. A random-effects model was used to assess the pooled prevalence of obstetric fistula repair failure, and the association was determined using the log odds ratio. Publication bias was investigated using the funnel plot and Egger's statistical test at the 5% level of significance. Meta-regression and subgroup analysis were done to identify potential sources of heterogeneity. The data were analyzed using STATA version 17 statistical software.\n\nA total of 24 articles with 9866 study participants from 13 Sub-Saharan African countries were included in this meta-analysis. The pooled prevalence of obstetric fistula repair failure in sub-Saharan Africa was 24.92% [95% CI: 20.34-29.50%]. The sub-group analysis by country revealed that the highest prevalence was in Angola (58%, 95% CI: 53.20-62.80%) and the lowest in Rwanda (13.9, 95% CI: 9.79-18.01%). Total urethral damage [OR  =  3.50, 95% CI: 2.09, 4.91], large fistula [OR = 3.09, 95% CI: (2.00, 4.10)], duration of labor [OR = 0.45, 95% CI: 0.27, 0.76], and previous fistula repair [OR = 2.70, 95% CI: 1.94, 3.45] were factors associated with obstetric fistula repair failure.\n\nWomen who received surgical treatment for obstetric fistulas in Sub-Saharan African countries experienced more repair failures than the WHO standards. Obstetric fistula repair failure was affected by urethral damage, fistula size, duration of labor, types of fistula, and history of previous repairs. Therefore, we suggest policy measures specific to each country to provide special attention to the prevention of all risk factors, including poor nutrition, multiparty, obstructed labor, and maternal age, which can result in conditions like large fistulas, urethral damage, and repeat repair, in order to reduce obstetric fistula repair failure.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38315695/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 05 Feb 2024"}, {"id": "38296841", "title_en": "The use of core descriptors from the ENiGMA code study in recent literature: a systematic review", "title_zh": "The use of core descriptors from the ENiGMA code study in recent literature: a systematic review", "authors": "Sharon L Stein", "abstract_en": "**Aim:** The heterogeneity in data quality presented in studies regarding Crohn's anal fistula (CAF) limit extrapolation into clinical practice. The ENiGMA collaborators established a core descriptor set to standardize reporting of CAF. The aim of this work was to quantify the use of these descriptors in recent literature.\n\n**Method:** We completed a systematic review of PubMed and the Cochrane Library, extracting publications from the past 10 years specific to the clinical interventions and outcomes of CAF, and reported in line with PRISMA guidance. Each article was assessed for inclusion of ENiGMA descriptors. The median number of descriptors per publication was evaluated along with the overall frequency of each individual descriptor. Use of ENiGMA descriptors was compared between medical and procedural publications.\n\n**Results:** Ninety publications were included. The median number of descriptors was 15 of 37; 16 descriptors were used in over half of the publications while 17 were used in fewer than a third. Descriptors were more frequently used in procedural (n = 16) than medical publications (n = 14) (p = 0.031). In procedural publications, eight descriptors were more frequently used including Faecal incontinence, Number of previous fistula interventions, Presence and severity of anorectal stenosis and Current proctitis. Medical publications were more likely to include Previous response to biological therapy and Duration and type of current course of biological therapy.\n\n**Conclusion:** With many descriptors being used infrequently and variations between medical and procedural literature, the colorectal community should assess the need for all 37 descriptors.", "abstract_zh": "The heterogeneity in data quality presented in studies regarding Crohn's anal fistula (CAF) limit extrapolation into clinical practice. The ENiGMA collaborators established a core descriptor set to standardize reporting of CAF. The aim of this work was to quantify the use of these descriptors in recent literature.\n\nWe completed a systematic review of PubMed and the Cochrane Library, extracting publications from the past 10 years specific to the clinical interventions and outcomes of CAF, and reported in line with PRISMA guidance. Each article was assessed for inclusion of ENiGMA descriptors. The median number of descriptors per publication was evaluated along with the overall frequency of each individual descriptor. Use of ENiGMA descriptors was compared between medical and procedural publications.\n\nNinety publications were included. The median number of descriptors was 15 of 37; 16 descriptors were used in over half of the publications while 17 were used in fewer than a third. Descriptors were more frequently used in procedural (n = 16) than medical publications (n = 14) (p = 0.031). In procedural publications, eight descriptors were more frequently used including Faecal incontinence, Number of previous fistula interventions, Presence and severity of anorectal stenosis and Current proctitis. Medical publications were more likely to include Previous response to biological therapy and Duration and type of current course of biological therapy.\n\nWith many descriptors being used infrequently and variations between medical and procedural literature, the colorectal community should assess the need for all 37 descriptors.", "keywords_zh": "core descriptor set, crohn’s perianal fistulae, multidisciplinary care, quality of life", "keywords_en": "core descriptor set, crohn’s perianal fistulae, multidisciplinary care, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38296841/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 31 Jan 2024"}, {"id": "38197847", "title_en": "Efficacy and safety of video-assisted anal fistula treatment in anorectal fistula: a meta-analysis", "title_zh": "Efficacy and safety of video-assisted anal fistula treatment in anorectal fistula: a meta-analysis", "authors": "Xuebing Wang", "abstract_en": "**Introduction:** By searching relevant literature, the recurrence rate, complication rate after video-assisted anal fistula treatment (VAAFT), and efficacy and safety of the treatment were analyzed.\n\n**Evidence Acquisition:** Articles that reported the outcomes of VAAFT up to December 2020 were searched in PubMed (Medline) and Cochrane Library, in accordance with the preferred reporting items for systematic review and meta-analysis (PRISMA) screening guidelines. Two researchers independently completed the whole process from screening and inclusion to quality evaluation and bias risk assessment, and the data was included in the RevMan 5.3 software for analysis. The main outcomes were demographic data of patients, detection rate, classification of internal opening of anorectal fistula, postoperative recurrence rate, and incidence of complications.\n\n**Evidence Synthesis:** A total of 10 articles were included (779 patients). The average age of the patients was 44 years old, average operation time was 60 min, and the average follow-up time was 22 months. The ratio of male to female was 2.4:1, the ratio of high anorectal fistula to low anorectal fistula was 6.6:1, the detection rate of internal openings was 98%, the weighted recurrence rate was 24%, and the weighted complication rate was 1%.\n\n**Conclusions:** VAAFT is effective and safe in the treatment of anorectal fistulas.", "abstract_zh": "By searching relevant literature, the recurrence rate, complication rate after video-assisted anal fistula treatment (VAAFT), and efficacy and safety of the treatment were analyzed.\n\nArticles that reported the outcomes of VAAFT up to December 2020 were searched in PubMed (Medline) and Cochrane Library, in accordance with the preferred reporting items for systematic review and meta-analysis (PRISMA) screening guidelines. Two researchers independently completed the whole process from screening and inclusion to quality evaluation and bias risk assessment, and the data was included in the RevMan 5.3 software for analysis. The main outcomes were demographic data of patients, detection rate, classification of internal opening of anorectal fistula, postoperative recurrence rate, and incidence of complications.\n\nA total of 10 articles were included (779 patients). The average age of the patients was 44 years old, average operation time was 60 min, and the average follow-up time was 22 months. The ratio of male to female was 2.4:1, the ratio of high anorectal fistula to low anorectal fistula was 6.6:1, the detection rate of internal openings was 98%, the weighted recurrence rate was 24%, and the weighted complication rate was 1%.\n\nVAAFT is effective and safe in the treatment of anorectal fistulas.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38197847/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 10 Jan 2024"}, {"id": "38126903", "title_en": "Scoring Indices for Perianal Fistulising Crohn's Disease: A Systematic Review", "title_zh": "Scoring Indices for Perianal Fistulising Crohn's Disease: A Systematic Review", "authors": "Vipul Jairath", "abstract_en": "**Background And Aims:** In this systematic review we summarise existing scoring indices for assessing disease activity and quality of life in perianal fistulising Crohn's disease [PFCD], and highlight gaps in the literature.\n\n**Methods:** MEDLINE, EMBASE, and CENTRAL were searched from August 24, 2022, to identify studies evaluating clinical, radiological, or patient-reported outcome measures [PROMS] in PFCD. The primary objective was to identify all available scoring indices and describe the operating properties of these indices.\n\n**Results:** A total of 53 studies reported on the use of one clinical index [Perianal Disease Activity Index: PDAI], three PROMs, and 10 radiological indices; 25 studies evaluated the operating properties of these indices. The PDAI demonstrated content validity, construct validity, and responsiveness but criterion validity or reliability were not assessed. The Van Assche Index [VAI], modified VAI, and the Magnetic Resonance Index for Assessing Fistulas in Patients with CD [MAGNIFI-CD] were the most studied radiological indices. These indices demonstrated responsiveness and reliability. The VAI and MAGNIFI-CD demonstrated construct validity; criterion and content validity and feasibility have not been assessed. Among the three PROMs, the Crohn's Anal Fistula Quality of Life index demonstrated content and construct validity, inter-observer reliability, and responsiveness; criterion validity, intra-observer reliability, and feasibility have not been assessed for this index.\n\n**Conclusions:** There are no fully valid, reliable, and responsive clinical disease or radiological indices for PFCD. Although the radiological indices demonstrated responsiveness and reliability, well-defined cut-offs for response and remission are lacking. Future research should focus on establishing standardised definitions and thresholds for outcomes.", "abstract_zh": "In this systematic review we summarise existing scoring indices for assessing disease activity and quality of life in perianal fistulising Crohn's disease [PFCD], and highlight gaps in the literature.\n\nMEDLINE, EMBASE, and CENTRAL were searched from August 24, 2022, to identify studies evaluating clinical, radiological, or patient-reported outcome measures [PROMS] in PFCD. The primary objective was to identify all available scoring indices and describe the operating properties of these indices.\n\nA total of 53 studies reported on the use of one clinical index [Perianal Disease Activity Index: PDAI], three PROMs, and 10 radiological indices; 25 studies evaluated the operating properties of these indices. The PDAI demonstrated content validity, construct validity, and responsiveness but criterion validity or reliability were not assessed. The Van Assche Index [VAI], modified VAI, and the Magnetic Resonance Index for Assessing Fistulas in Patients with CD [MAGNIFI-CD] were the most studied radiological indices. These indices demonstrated responsiveness and reliability. The VAI and MAGNIFI-CD demonstrated construct validity; criterion and content validity and feasibility have not been assessed. Among the three PROMs, the Crohn's Anal Fistula Quality of Life index demonstrated content and construct validity, inter-observer reliability, and responsiveness; criterion validity, intra-observer reliability, and feasibility have not been assessed for this index.\n\nThere are no fully valid, reliable, and responsive clinical disease or radiological indices for PFCD. Although the radiological indices demonstrated responsiveness and reliability, well-defined cut-offs for response and remission are lacking. Future research should focus on establishing standardised definitions and thresholds for outcomes.", "keywords_zh": "Outcomes, disease activity indices, operating properties, quality of life", "keywords_en": "Outcomes, disease activity indices, operating properties, quality of life", "link": "https://pubmed.ncbi.nlm.nih.gov/38126903/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 21 Dec 2023"}, {"id": "38091125", "title_en": "Cutting seton for the treatment of cryptoglandular fistula-in-ano: a systematic review and meta-analysis", "title_zh": "Cutting seton for the treatment of cryptoglandular fistula-in-ano: a systematic review and meta-analysis", "authors": "C Eskicioglu", "abstract_en": "**Background:** The use of cutting seton (CS) for the management of cryptoglandular fistula-in-ano has remained controversial because of reports of fecal incontinence, postoperative pain, and extended healing time. The aim of this review was to provide the first synthesis of studies investigating the use of CS for the treatment of cryptoglandular fistula-in-ano.\n\n**Methods:** MEDLINE, Embase, and CENTRAL were searched up to October 2022. Randomized controlled trials and observational studies comparing CS with alternative interventions were included, along with single-arm studies evaluating CS alone. The primary outcome was fistula-in-ano recurrence, and secondary outcomes included incontinence, healing time, proportion with complete healing, and postoperative pain. Inverse variance random-effects meta-analyses were used to pool effect estimates.\n\n**Results:** After screening 661 citations, 29 studies were included. Overall, 1513 patients undergoing CS (18.8% female, mean age: 43.1 years) were included. Patients with CS had a 6% (95% CI: 3-12%) risk of recurrence and a 16% (95% CI: 5-38%) risk of incontinence at 6 months. CS patients had an average healing time of 14.6 weeks (95% CI: 10-19 weeks) with 73% (95% CI: 48-89%) of patients achieving complete healing at 6 months postoperatively. There was no difference in recurrence between CS and fistulotomy, advancement flap, two-stage seton fistulotomy, or draining seton.\n\n**Conclusions:** Overall, this analysis shows that CS has comparable recurrence and incontinence rates to other modalities. However, this may be at the expense of more postoperative pain and extended healing time. Further comparative studies between CS and other modalities are warranted.", "abstract_zh": "The use of cutting seton (CS) for the management of cryptoglandular fistula-in-ano has remained controversial because of reports of fecal incontinence, postoperative pain, and extended healing time. The aim of this review was to provide the first synthesis of studies investigating the use of CS for the treatment of cryptoglandular fistula-in-ano.\n\nMEDLINE, Embase, and CENTRAL were searched up to October 2022. Randomized controlled trials and observational studies comparing CS with alternative interventions were included, along with single-arm studies evaluating CS alone. The primary outcome was fistula-in-ano recurrence, and secondary outcomes included incontinence, healing time, proportion with complete healing, and postoperative pain. Inverse variance random-effects meta-analyses were used to pool effect estimates.\n\nAfter screening 661 citations, 29 studies were included. Overall, 1513 patients undergoing CS (18.8% female, mean age: 43.1 years) were included. Patients with CS had a 6% (95% CI: 3-12%) risk of recurrence and a 16% (95% CI: 5-38%) risk of incontinence at 6 months. CS patients had an average healing time of 14.6 weeks (95% CI: 10-19 weeks) with 73% (95% CI: 48-89%) of patients achieving complete healing at 6 months postoperatively. There was no difference in recurrence between CS and fistulotomy, advancement flap, two-stage seton fistulotomy, or draining seton.\n\nOverall, this analysis shows that CS has comparable recurrence and incontinence rates to other modalities. However, this may be at the expense of more postoperative pain and extended healing time. Further comparative studies between CS and other modalities are warranted.", "keywords_zh": "Anorectal fistula, Colorectal surgery, Cryptoglandular fistula, Cutting seton, Fistula-in-ano", "keywords_en": "Anorectal fistula, Colorectal surgery, Cryptoglandular fistula, Cutting seton, Fistula-in-ano", "link": "https://pubmed.ncbi.nlm.nih.gov/38091125/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 13 Dec 2023"}, {"id": "38018554", "title_en": "FISTULIZING PERIANAL CROHN'S DISEASE: IS THE PATIENT'S SEX A BURDEN? A SYSTEMATIC REVIEW", "title_zh": "FISTULIZING PERIANAL CROHN'S DISEASE: IS THE PATIENT'S SEX A BURDEN? A SYSTEMATIC REVIEW", "authors": "Odery Ramos Júnior", "abstract_en": "**Background:** Fistulizing perianal Crohn's disease poses a treatment challenge, and researchers postulate that this phenotype in young male patients could have a worst outcome.\n\n**Objective:** Thus, the aim of this study was to assess whether sex influences the response to treatment for these patients.\n\n**Methods:** This systematic review (PROSPERO CRD42022319629) was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses protocol. We selected articles published in English, Spanish, Portuguese, and Italian between 2010 and 2020 in the PubMed and Science Direct databases. According to the PICO acronym, prospective studies in patients older than 18 years with the objective of treating fistulizing perianal Crohn's disease were selected. Studies in pediatric populations, retrospective, without treatment objectives, and that included only rectovaginal fistulas or a single sex were excluded. Study quality was assessed using the Cochrane risk of bias tool and Newcastle-Ottawa scale.\n\n**Results:** Of the 1887 articles found, 33 were included. Most studies used anti-TNF drugs as treatment (n=11). Ten studies had subgroup analyses; of them, the two studies reporting sex differences used infliximab and adalimumab as treatment and showed that women had a longer fistula closure time than men.\n\n**Conclusion:** This systematic review showed that few data corroborate the difference between sexes in the treatment of fistulizing perianal Crohn's disease, possibly having a greater relationship with the phenotype. However, considering the lack of results, further studies with this objective and with standardization of fistulas and response assessment methods are needed.", "abstract_zh": "Fistulizing perianal Crohn's disease poses a treatment challenge, and researchers postulate that this phenotype in young male patients could have a worst outcome.\n\nThus, the aim of this study was to assess whether sex influences the response to treatment for these patients.\n\nThis systematic review (PROSPERO CRD42022319629) was conducted in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses protocol. We selected articles published in English, Spanish, Portuguese, and Italian between 2010 and 2020 in the PubMed and Science Direct databases. According to the PICO acronym, prospective studies in patients older than 18 years with the objective of treating fistulizing perianal Crohn's disease were selected. Studies in pediatric populations, retrospective, without treatment objectives, and that included only rectovaginal fistulas or a single sex were excluded. Study quality was assessed using the Cochrane risk of bias tool and Newcastle-Ottawa scale.\n\nOf the 1887 articles found, 33 were included. Most studies used anti-TNF drugs as treatment (n=11). Ten studies had subgroup analyses; of them, the two studies reporting sex differences used infliximab and adalimumab as treatment and showed that women had a longer fistula closure time than men.\n\nThis systematic review showed that few data corroborate the difference between sexes in the treatment of fistulizing perianal Crohn's disease, possibly having a greater relationship with the phenotype. However, considering the lack of results, further studies with this objective and with standardization of fistulas and response assessment methods are needed.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/38018554/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 29 Nov 2023"}, {"id": "37933849", "title_en": "Pharmacological Therapies for the Management of Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Pharmacological Therapies for the Management of Fistulizing Crohn's Disease: A Systematic Review and Meta-Analysis", "authors": "Vipul Jairath", "abstract_en": "**Background:** Fistulas are a debilitating complication of Crohn's disease [CD]. We conducted a systematic review to assess the efficacy of medical therapies for fistulizing CD.\n\n**Methods:** MEDLINE, Embase, and CENTRAL were searched on May 26, 2022, for randomized controlled trials [RCTs] of pharmacological therapy in adults with fistulizing CD. The primary outcome was induction and maintenance of fistula response. Pooled risk ratios [RRs] and 95% confidence intervals [CIs] were calculated. GRADE was used to assess the certainty of evidence.\n\n**Results:** Thirty-eight RCTs were included. Nineteen trials [50%] exclusively involved perianal fistula. The remaining studies included some participants with non-perianal fistula. Pooled RRs for anti-tumour necrosis factor [TNF] agents were not statistically significant for induction [RR 1.36, 95% CI 0.97-1.91] or maintenance of fistula response [RR 1.48, 95% CI 0.97-2.27]. However, in a sensitivity analysis of studies with fistula response as the primary outcome, anti-TNFs were superior to placebo for induction [RR 1.94, 95% CI 1.10-3.41] and maintenance [RR 1.88, 95% CI 1.23-2.88] of fistula response. Oral small molecules [RR 2.56, 95% CI 1.18-5.53] and mesenchymal stem cell [MSC] therapy [RR 1.26, 95% CI 1.01-1.57] were effective for induction of fistula response. Ustekinumab was associated with maintenance of fistula response [RR 1.80, 95% CI 1.04-3.11]. Vedolizumab was not superior to placebo. The certainty of evidence ranged from very low to moderate.\n\n**Conclusion:** Very low- to moderate-certainty evidence suggests that anti-TNF therapy, oral small molecules, ustekinumab, and MSCs are effective for perianal fistulizing CD. Dedicated fistula studies evaluating biologics and small molecules are needed.", "abstract_zh": "Fistulas are a debilitating complication of Crohn's disease [CD]. We conducted a systematic review to assess the efficacy of medical therapies for fistulizing CD.\n\nMEDLINE, Embase, and CENTRAL were searched on May 26, 2022, for randomized controlled trials [RCTs] of pharmacological therapy in adults with fistulizing CD. The primary outcome was induction and maintenance of fistula response. Pooled risk ratios [RRs] and 95% confidence intervals [CIs] were calculated. GRADE was used to assess the certainty of evidence.\n\nThirty-eight RCTs were included. Nineteen trials [50%] exclusively involved perianal fistula. The remaining studies included some participants with non-perianal fistula. Pooled RRs for anti-tumour necrosis factor [TNF] agents were not statistically significant for induction [RR 1.36, 95% CI 0.97-1.91] or maintenance of fistula response [RR 1.48, 95% CI 0.97-2.27]. However, in a sensitivity analysis of studies with fistula response as the primary outcome, anti-TNFs were superior to placebo for induction [RR 1.94, 95% CI 1.10-3.41] and maintenance [RR 1.88, 95% CI 1.23-2.88] of fistula response. Oral small molecules [RR 2.56, 95% CI 1.18-5.53] and mesenchymal stem cell [MSC] therapy [RR 1.26, 95% CI 1.01-1.57] were effective for induction of fistula response. Ustekinumab was associated with maintenance of fistula response [RR 1.80, 95% CI 1.04-3.11]. Vedolizumab was not superior to placebo. The certainty of evidence ranged from very low to moderate.\n\nVery low- to moderate-certainty evidence suggests that anti-TNF therapy, oral small molecules, ustekinumab, and MSCs are effective for perianal fistulizing CD. Dedicated fistula studies evaluating biologics and small molecules are needed.", "keywords_zh": "Biologic, fistula, stem cells", "keywords_en": "Biologic, fistula, stem cells", "link": "https://pubmed.ncbi.nlm.nih.gov/37933849/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 07 Nov 2023"}, {"id": "37882975", "title_en": "Comparison of clinical outcomes of anal fistula plug and endoanal advancement flap repair treating the complex anal fistula: a systematic review and meta-analysis", "title_zh": "Comparison of clinical outcomes of anal fistula plug and endoanal advancement flap repair treating the complex anal fistula: a systematic review and meta-analysis", "authors": "Jihua Gao", "abstract_en": "Anal fistula (AF) is a common disease with high prevalence and surgical operations are effective treatments in clinical work. There exist many well-known surgical techniques treating complex anal fistula (CAF), however, none is ideal. To compare the superiority of Anal fistula plug (AFP) and Endoanal advancement flap repair (EAFR) for complex anal fistula. We searched worldwide databases including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed from their inception to March 2023. Studies comparing the outcomes of AFP and EAFR were included according to the PICO principles. The indicators of the healing rate, recurrence rate, wound infection rate, and complication rate, et al. were extracted and compared between different surgical methods. 5 RCTS and 7 non-RCTs were included in the meta-analysis with a total of 847 patients (341 patients conducted with AFP and 506 patients with EAFR). By combining the total effect of the 12 articles, we found that there was a statistical difference reporting the healing rate of AFP 48.3% and EAFR 64.4% treating the CAF (OR 0.68, 95% CI 0.30,1.55, P = 0.03), and EAFR has a better healing rate. However, there was no significant difference in terms of the recurrence rate (OR 1.68, 95% CI 0.80,3.54, P = 0.17), the wound infection rate (OR 1.82, 95% CI 0.95,3.52, P = 0.07), and the complication rate (OR 1.06, 95% CI 0.70,1.61, P = 0.77) either in the 12 articles or in the subgroup. The meta-analysis indicated that the EAFR was superior to AFP in terms of the healing rate treating the CAF, however, there were no significant differences between the two groups when it came to the recurrence rate, the wound infection rate, and the complication rate. EAFR might be one initial treatment for the complex cryptoglandular anal fistulas compared with AFP.", "abstract_zh": "Anal fistula (AF) is a common disease with high prevalence and surgical operations are effective treatments in clinical work. There exist many well-known surgical techniques treating complex anal fistula (CAF), however, none is ideal. To compare the superiority of Anal fistula plug (AFP) and Endoanal advancement flap repair (EAFR) for complex anal fistula. We searched worldwide databases including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed from their inception to March 2023. Studies comparing the outcomes of AFP and EAFR were included according to the PICO principles. The indicators of the healing rate, recurrence rate, wound infection rate, and complication rate, et al. were extracted and compared between different surgical methods. 5 RCTS and 7 non-RCTs were included in the meta-analysis with a total of 847 patients (341 patients conducted with AFP and 506 patients with EAFR). By combining the total effect of the 12 articles, we found that there was a statistical difference reporting the healing rate of AFP 48.3% and EAFR 64.4% treating the CAF (OR 0.68, 95% CI 0.30,1.55, P = 0.03), and EAFR has a better healing rate. However, there was no significant difference in terms of the recurrence rate (OR 1.68, 95% CI 0.80,3.54, P = 0.17), the wound infection rate (OR 1.82, 95% CI 0.95,3.52, P = 0.07), and the complication rate (OR 1.06, 95% CI 0.70,1.61, P = 0.77) either in the 12 articles or in the subgroup. The meta-analysis indicated that the EAFR was superior to AFP in terms of the healing rate treating the CAF, however, there were no significant differences between the two groups when it came to the recurrence rate, the wound infection rate, and the complication rate. EAFR might be one initial treatment for the complex cryptoglandular anal fistulas compared with AFP.", "keywords_zh": "Anal fistula plug, Complex anal fistula, Endoanal advancement flap repair, Meta-analysis", "keywords_en": "Anal fistula plug, Complex anal fistula, Endoanal advancement flap repair, Meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/37882975/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 26 Oct 2023"}, {"id": "37737881", "title_en": "Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis", "title_zh": "Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis", "authors": "Maosheng Tian", "abstract_en": "**Background:** Considering the difficulty of treating complex anal fistula (CAF), various surgical techniques exist in clinical work. However, none are ideal. Evidence on the efficacy and safety of different surgical treatments is scarce. The authors aimed to compare the outcomes of the 13 surgical techniques and tried to find the best surgical method for treating CAF.\n\n**Materials And Methods:** The authors searched worldwide databases, including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed, from inception to March 2023. All randomized controlled trials comparing the outcomes of 13 surgical techniques were included according to the PICO principles. The indicators of the cure rate, the recurrence rate, the complication rate, the operating time, the postoperative pain on day 1 (VAS), and the postoperative incontinence in month 1 (Wexner) were extracted and analyzed using STATA software 15.1, Review Manager 5.4, and GeMTC14.3.\n\n**Results:** Twenty-eight randomized controlled trials with a total of 2274 patients were included in the network meta-analysis. There was no statistically significant difference in the comparison among any surgical interventions in terms of the cure rate ( P >0.05 Table 2) and recurrence rate ( P >0.05 Table 3). However, in terms of complication rate, fistulectomy was lower than FPS (Median: 0.14; 95% CI: 0.02-0.70) or fistulotomy (Median: 0.09; 95% CI: 0.01-0.55), and fistulotomy was lower than EAFR (Median: 0.24; 95% CI: 0.05-0.84), LIFT (Median: 0.17; 95% CI: 0.02-0.66) or LIFT-EAFR (Median: 0.11; 95% CI: 0.01-0.69) ( P >0.05 Table 4). The surface estimated the advantages and disadvantages under the cumulative ranking (SUCRA). The ranking results indicated that fistulectomy might have the lowest complication rate (SUCRA=7.9%). Because the network results of the operating time, the postoperative pain, and the postoperative incontinence contained no closed loops, the results of their probability ranking could only be referenced, demonstrating that fistulectomy might have the shortest operating time (SUCRA=23.4%), video-assisted modified ligation of the intersphincteric fistula tract (VAMLIFT) might have the lowest postoperative pain on day 1 (VAS) (SUCRA=0.4%) and LIFT might have the lowest postoperative incontinence in month 1(Wexner) (SUCRA=16.2%).\n\n**Conclusion:** Fistulectomy might have the lowest complication rate, which might be the relatively superior surgical technique for treating CAF.", "abstract_zh": "Considering the difficulty of treating complex anal fistula (CAF), various surgical techniques exist in clinical work. However, none are ideal. Evidence on the efficacy and safety of different surgical treatments is scarce. The authors aimed to compare the outcomes of the 13 surgical techniques and tried to find the best surgical method for treating CAF.\n\nThe authors searched worldwide databases, including Pubmed, Embase, Cochrane Library, Web of Science, CNKI, WanFang, VIP, and SinoMed, from inception to March 2023. All randomized controlled trials comparing the outcomes of 13 surgical techniques were included according to the PICO principles. The indicators of the cure rate, the recurrence rate, the complication rate, the operating time, the postoperative pain on day 1 (VAS), and the postoperative incontinence in month 1 (Wexner) were extracted and analyzed using STATA software 15.1, Review Manager 5.4, and GeMTC14.3.\n\nTwenty-eight randomized controlled trials with a total of 2274 patients were included in the network meta-analysis. There was no statistically significant difference in the comparison among any surgical interventions in terms of the cure rate ( P >0.05 Table 2) and recurrence rate ( P >0.05 Table 3). However, in terms of complication rate, fistulectomy was lower than FPS (Median: 0.14; 95% CI: 0.02-0.70) or fistulotomy (Median: 0.09; 95% CI: 0.01-0.55), and fistulotomy was lower than EAFR (Median: 0.24; 95% CI: 0.05-0.84), LIFT (Median: 0.17; 95% CI: 0.02-0.66) or LIFT-EAFR (Median: 0.11; 95% CI: 0.01-0.69) ( P >0.05 Table 4). The surface estimated the advantages and disadvantages under the cumulative ranking (SUCRA). The ranking results indicated that fistulectomy might have the lowest complication rate (SUCRA=7.9%). Because the network results of the operating time, the postoperative pain, and the postoperative incontinence contained no closed loops, the results of their probability ranking could only be referenced, demonstrating that fistulectomy might have the shortest operating time (SUCRA=23.4%), video-assisted modified ligation of the intersphincteric fistula tract (VAMLIFT) might have the lowest postoperative pain on day 1 (VAS) (SUCRA=0.4%) and LIFT might have the lowest postoperative incontinence in month 1(Wexner) (SUCRA=16.2%).\n\nFistulectomy might have the lowest complication rate, which might be the relatively superior surgical technique for treating CAF.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/37737881/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 22 Sep 2023"}, {"id": "37707561", "title_en": "Comparing the efficacy and safety of different thread-drawing surgery method for treating high complex anal fistula: a systematic review and network meta-analysis", "title_zh": "Comparing the efficacy and safety of different thread-drawing surgery method for treating high complex anal fistula: a systematic review and network meta-analysis", "authors": "Guofeng Li", "abstract_en": "**Purpose:** To evaluate the effect of different surgical methods in the treatment of high complex anal fistula by systematic review and network meta-analysis.\n\n**Methods:** Randomized controlled trials that met the inclusion criteria in PubMed, Cochrane Library, Embase, Web of Science, CBM, CNKI, WANFANG DATA, VIP were searched from the date of database construction to May 23, 2023.\n\n**Results:** Among the 48 randomized controlled trials (RCTs), 4205 patients were included in the network meta-analysis. Incision thread-drawing counter-drainage procedure (ITCP) in improving the effective rate, the cure rate; reduce the recurrence rate, reduce the anal canal damage has a huge advantage. Directional line-hanging method (DLM) is optimal for safety and postoperative pain relief. Directional line-hanging method (ITSS) protect the optimal anal function after surgery. Sphincter preserving thread-hanging method (SPTM) has a significant advantage in accelerating wound healing time. Main tube incision combined with thread-hanging branch tube drainage (MIBD) is second only to incision thread-drawing counter-drainage procedure (ITCP) in improving effective rate, cure rate, reducing recurrence rate and reduce complication rate.\n\n**Conclusion:** In general, different thread-drawing surgery methods have good clinical effect for the treatment of high complex anal fistula. In general, these methods provide evidence-based medical evidence for early treatment in terms of improving clinical efficacy, relieving anal pain and reducing wound healing time. However, there are differences in the number of included literature studies, and further verification by large-sample, high-quality, multicenter RCTS is still needed in the next stage.", "abstract_zh": "To evaluate the effect of different surgical methods in the treatment of high complex anal fistula by systematic review and network meta-analysis.\n\nRandomized controlled trials that met the inclusion criteria in PubMed, Cochrane Library, Embase, Web of Science, CBM, CNKI, WANFANG DATA, VIP were searched from the date of database construction to May 23, 2023.\n\nAmong the 48 randomized controlled trials (RCTs), 4205 patients were included in the network meta-analysis. Incision thread-drawing counter-drainage procedure (ITCP) in improving the effective rate, the cure rate; reduce the recurrence rate, reduce the anal canal damage has a huge advantage. Directional line-hanging method (DLM) is optimal for safety and postoperative pain relief. Directional line-hanging method (ITSS) protect the optimal anal function after surgery. Sphincter preserving thread-hanging method (SPTM) has a significant advantage in accelerating wound healing time. Main tube incision combined with thread-hanging branch tube drainage (MIBD) is second only to incision thread-drawing counter-drainage procedure (ITCP) in improving effective rate, cure rate, reducing recurrence rate and reduce complication rate.\n\nIn general, different thread-drawing surgery methods have good clinical effect for the treatment of high complex anal fistula. In general, these methods provide evidence-based medical evidence for early treatment in terms of improving clinical efficacy, relieving anal pain and reducing wound healing time. However, there are differences in the number of included literature studies, and further verification by large-sample, high-quality, multicenter RCTS is still needed in the next stage.", "keywords_zh": "High complex anal fistula, Network meta-analysis, Systematic review, Thread-drawing surgery method", "keywords_en": "High complex anal fistula, Network meta-analysis, Systematic review, Thread-drawing surgery method", "link": "https://pubmed.ncbi.nlm.nih.gov/37707561/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 14 Sep 2023"}, {"id": "37704476", "title_en": "Risk factors for anastomotic stenosis after radical resection of rectal cancer: A systematic review and meta-analysis", "title_zh": "Risk factors for anastomotic stenosis after radical resection of rectal cancer: A systematic review and meta-analysis", "authors": "Kun Qian", "abstract_en": "Radical resection of rectal cancer is a safe and effective treatment, but there remain several complications related to anastomosis. We aimed to assess the risk factors and incidence of rectal anastomotic stenosis (AS) after rectal cancer resection. We conducted a systematic review and meta-analysis after searching PubMed, Embase, Web of Science, and Medline databases from inception until May 2023. Data are reported as the combined odds ratio (OR) for categorical variables and the weighted mean difference (WMD) for continuous variables. Six hundred and fifty-nine studies were retrieved, nine (3031 patients) of which were included in the meta-analysis. Young age (WMD = -3.09, P = 0.0002), male sex (OR = 1.53, P = 0.0002), smoking (OR = 1.54, P = 0.009), radiotherapy (OR = 2.34, P = 0.0002), protective stoma (OR = 2.88, P = 0.007), intersphincteric resection surgery (OR = 6.28, P = 0.05), anastomotic fistula (OR = 3.72, P = 0.003), and anastomotic distance (WMD = -3.11, P = 0.0006) were identified as factors that increased the risk of AS, while staple (OR = 0.39, P < 0.001) was a protective factor. The incidence of AS after rectal cancer resection was approximately 17% (95% CI: 13%-21%). We identified eight risk factors and one protective factor associated with AS after rectal cancer resection. These factors may be combined in future studies to develop a more comprehensive and accurate prediction model related to AS after rectal cancer resection.", "abstract_zh": "Radical resection of rectal cancer is a safe and effective treatment, but there remain several complications related to anastomosis. We aimed to assess the risk factors and incidence of rectal anastomotic stenosis (AS) after rectal cancer resection. We conducted a systematic review and meta-analysis after searching PubMed, Embase, Web of Science, and Medline databases from inception until May 2023. Data are reported as the combined odds ratio (OR) for categorical variables and the weighted mean difference (WMD) for continuous variables. Six hundred and fifty-nine studies were retrieved, nine (3031 patients) of which were included in the meta-analysis. Young age (WMD = -3.09, P = 0.0002), male sex (OR = 1.53, P = 0.0002), smoking (OR = 1.54, P = 0.009), radiotherapy (OR = 2.34, P = 0.0002), protective stoma (OR = 2.88, P = 0.007), intersphincteric resection surgery (OR = 6.28, P = 0.05), anastomotic fistula (OR = 3.72, P = 0.003), and anastomotic distance (WMD = -3.11, P = 0.0006) were identified as factors that increased the risk of AS, while staple (OR = 0.39, P < 0.001) was a protective factor. The incidence of AS after rectal cancer resection was approximately 17% (95% CI: 13%-21%). We identified eight risk factors and one protective factor associated with AS after rectal cancer resection. These factors may be combined in future studies to develop a more comprehensive and accurate prediction model related to AS after rectal cancer resection.", "keywords_zh": "Anastomotic stenosis, Meta-analysis, Radical resection of rectal cancer", "keywords_en": "Anastomotic stenosis, Meta-analysis, Radical resection of rectal cancer", "link": "https://pubmed.ncbi.nlm.nih.gov/37704476/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 13 Sep 2023"}, {"id": "37608385", "title_en": "Comparative efficacy of oral drugs for chronic radiation proctitis - a systematic review", "title_zh": "Comparative efficacy of oral drugs for chronic radiation proctitis - a systematic review", "authors": "Jinjun Liang", "abstract_en": "**Background:** Chronic radiation proctitis (CRP) is a long-term complication of pelvic radiotherapy that manifests as rectal bleeding, diarrhoea, fistula formation and obstruction. Treatments such as endoscopic argon plasma coagulation, hyperbaric oxygen therapy and rectal topical formalin have imposed a significant medical burden on CRP patients. In contrast, oral therapies offer a more accessible and acceptable option for managing CRP. Here, we conducted a systematic review of the efficacy of oral treatments for CRP to assess their potential as an effective and convenient treatment option for this condition.\n\n**Methods:** We searched the Cochrane Central Register of Controlled Trials, PubMed, Web of Science, China National Knowledge Infrastructure and Chinese VIP in February 2021. We included post-radiotherapy participants with CRP that compared oral medicine alone or in combination with other treatments versus control treatments. The primary outcomes were bleeding, diarrhoea and symptom score. Heterogeneity between studies was checked using Cochrane Q test statistics and I<sup>2</sup> test statistics. The Cochrane risk-of-bias tool was used to assess the quality of the included studies.\n\n**Results:** We included 10 randomised controlled trials (RCTs) and 1 retrospective study with 898 participants. Three placebo-controlled trials evaluated the effects of oral sucralfate on CRP, with meta-analysis showing no significant different with placebo arm. Four trials on TCM demonstrated significant improvement of symptoms, especially for the 3 trials on oral TCM drinks. Retinyl palmitate and high-fibre diet were found to reduce rectal bleeding. The combination of oral pentoxifylline and tocopherol did not significantly change the process of CRP.\n\n**Conclusions:** Our study implies that oral TCM drinks, retinyl palmitate and a high-fiber diet showed significant improvement in CRP symptoms, but not with the combination of oral pentoxifylline and tocopherol. Further multicentre, larger-scale RCTs are needed to confirm the efficacy and safety of these treatments and optimize treatment strategies, ultimately improving the quality of life for patients with CRP.", "abstract_zh": "Chronic radiation proctitis (CRP) is a long-term complication of pelvic radiotherapy that manifests as rectal bleeding, diarrhoea, fistula formation and obstruction. Treatments such as endoscopic argon plasma coagulation, hyperbaric oxygen therapy and rectal topical formalin have imposed a significant medical burden on CRP patients. In contrast, oral therapies offer a more accessible and acceptable option for managing CRP. Here, we conducted a systematic review of the efficacy of oral treatments for CRP to assess their potential as an effective and convenient treatment option for this condition.\n\nWe searched the Cochrane Central Register of Controlled Trials, PubMed, Web of Science, China National Knowledge Infrastructure and Chinese VIP in February 2021. We included post-radiotherapy participants with CRP that compared oral medicine alone or in combination with other treatments versus control treatments. The primary outcomes were bleeding, diarrhoea and symptom score. Heterogeneity between studies was checked using Cochrane Q test statistics and I<sup>2</sup> test statistics. The Cochrane risk-of-bias tool was used to assess the quality of the included studies.\n\nWe included 10 randomised controlled trials (RCTs) and 1 retrospective study with 898 participants. Three placebo-controlled trials evaluated the effects of oral sucralfate on CRP, with meta-analysis showing no significant different with placebo arm. Four trials on TCM demonstrated significant improvement of symptoms, especially for the 3 trials on oral TCM drinks. Retinyl palmitate and high-fibre diet were found to reduce rectal bleeding. The combination of oral pentoxifylline and tocopherol did not significantly change the process of CRP.\n\nOur study implies that oral TCM drinks, retinyl palmitate and a high-fiber diet showed significant improvement in CRP symptoms, but not with the combination of oral pentoxifylline and tocopherol. Further multicentre, larger-scale RCTs are needed to confirm the efficacy and safety of these treatments and optimize treatment strategies, ultimately improving the quality of life for patients with CRP.", "keywords_zh": "Chronic radiation proctitis, Diarrhoea, Oral treatments, Radiation toxicity, Rectal bleeding", "keywords_en": "Chronic radiation proctitis, Diarrhoea, Oral treatments, Radiation toxicity, Rectal bleeding", "link": "https://pubmed.ncbi.nlm.nih.gov/37608385/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 23 Aug 2023"}, {"id": "37359408", "title_en": "Predictors of outcome in cryptoglandular anal fistula according to magnetic resonance imaging: A systematic review", "title_zh": "Predictors of outcome in cryptoglandular anal fistula according to magnetic resonance imaging: A systematic review", "authors": "Amirhosein Naseri", "abstract_en": "**Background And Aims:** Anal fistula (AF) with cryptoglandular origin tends to recur, and multiple risk factors are implicated. Recently, some magnetic resonance imaging (MRI) findings with predictive value for disease outcomes have been proposed. These intrinsic anatomic features include those of the AF and its surrounding structures. This study aims to clarify the prognostic role of MRI in AF.\n\n**Methods:** We performed a systematic search of PubMed, Embase, and EBSCO databases. Two independent reviewers conducted the search and screened the articles. We selected studies that used MRI to assess AF and reported its relationship to disease outcome. We extracted data regarding the study design, type of intervention, outcome, MRI-measured items, and their significance.\n\n**Results:** Out of 1230 retrieved articles, 18 were eligible for final inclusion, and a total of 4026 patients were enrolled in the selected studies. For preoperative MRI, the significant items affecting the outcome were the length of the fistula, horseshoe type, presence of multiple tracts, supralevator extension, and apparent diffusion coefficient (ADC) value. Other studies investigated the healing process using postoperative MRI.\n\n**Conclusion:** This review found that MRI can be useful in the management of AF, both preoperatively and postoperatively. Factors, such as fistula length, horseshoe type, presence of multiple tracts, supralevator ext
