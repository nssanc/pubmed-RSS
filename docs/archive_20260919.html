ndependently performed literature search and screening, data extraction, and bias assessment. Stata version 12.0 was utilized to statistically analyze the healing rate of the anal fistula and the incidence of adverse events.\n\nThis study involved 1,056 patients from five randomized controlled trials, including 561 patients in the treatment group (ASCs/ASCs + fibrin glue) and 495 patients in the control group (fibrin glue/placebo). Meta-analysis revealed better short- and long-term efficacy of adipose mesenchymal stem cell treatment for complex perianal fistulas than in conventional treatment. However, no statistical difference was observed between mid-term and ultra-long-term treatments. Subgroup meta-analysis demonstrated a difference in efficacy between various cell doses. Further, all treatments with different sources of ASCs were superior to conventional quality.\n\nThis study confirms that Adipose-derived Stem Cells can effectively improve short-term and long-term (1-year) clinical outcomes in patients with complex perianal fistulas, supporting their potential as a novel therapeutic strategy.\n\nhttps://www.crd.york.ac.uk/PROSPERO/view/CRD42024602327.", "keywords_zh": "adipose stem cells, adipose-derived mesenchymal stem cell, perianal fistula, randomized controlled trial, systematic review and meta-analysis", "keywords_en": "adipose stem cells, adipose-derived mesenchymal stem cell, perianal fistula, randomized controlled trial, systematic review and meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/40933558/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 11 Sep 2025"}, {"id": "40929949", "title_en": "A systematic review and meta-analysis of the outcomes of anal fistula clips in the treatment of anal fistulas", "title_zh": "A systematic review and meta-analysis of the outcomes of anal fistula clips in the treatment of anal fistulas", "authors": "Giovanna DaSilva", "abstract_en": "**Introduction:** One recent novel method for the treatment of anal fistulas is the over-the-scope clip. This meta-analysis aimed to examine the success of anal fistula clips.\n\n**Methods:** This Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review searched PubMed, Scopus, and Cochrane Library from January 2000 through March 2025 for observational and randomized controlled trials that used over-the-scope clips in treating cryptoglandular and inflammatory bowel disease-related anal fistulas. Main outcomes were pooled healing and complication rates, and length of stay.\n\n**Results:** 12 studies (2 randomized controlled trials) incorporating a total of 438 patients were included; 293 patients underwent anal fistula clip placement. The median age of the patients was 45.5 years. The pooled healing rate was 67.7% (95% confidence interval: 54.7%-80.7%) with a median follow-up of 11.3 months. Pooled healing was 78.7% (95% confidence interval: 62.3%-95.1%) in cryptoglandular fistulas and 59.5% (95% confidence interval: 41.8%-77.2%) in studies that included both cryptoglandular and inflammatory bowel disease fistulas. The medical hospital stay across 3 studies was 4.9 days. Pooled complication rate was 30.9% (95% confidence interval: 14.6%-47.2%). The most common complications were spontaneous migration or unscheduled removal of a clip (17.3%, 95% confidence interval: 8.3%-26.4%) and clinically significant pain (3.8%, 95% confidence interval: 0.9%-6.7%). Seven studies assessed continence after over-the-scope clip placement, and no cases of fecal incontinence were reported.\n\n**Conclusions:** The over-the-scope clip is a promising and novel minimally invasive treatment for anal fistulas. The pooled healing rate was 67.7% overall and >75% for cryptoglandular fistulas. Despite its encouraging success, the over-the-scope clip's complication rate of 30.9% highlights the need for further refinement of this technique and patient selection.", "abstract_zh": "One recent novel method for the treatment of anal fistulas is the over-the-scope clip. This meta-analysis aimed to examine the success of anal fistula clips.\n\nThis Preferred Reporting Items for Systematic Reviews and Meta-Analyses-compliant systematic review searched PubMed, Scopus, and Cochrane Library from January 2000 through March 2025 for observational and randomized controlled trials that used over-the-scope clips in treating cryptoglandular and inflammatory bowel disease-related anal fistulas. Main outcomes were pooled healing and complication rates, and length of stay.\n\n12 studies (2 randomized controlled trials) incorporating a total of 438 patients were included; 293 patients underwent anal fistula clip placement. The median age of the patients was 45.5 years. The pooled healing rate was 67.7% (95% confidence interval: 54.7%-80.7%) with a median follow-up of 11.3 months. Pooled healing was 78.7% (95% confidence interval: 62.3%-95.1%) in cryptoglandular fistulas and 59.5% (95% confidence interval: 41.8%-77.2%) in studies that included both cryptoglandular and inflammatory bowel disease fistulas. The medical hospital stay across 3 studies was 4.9 days. Pooled complication rate was 30.9% (95% confidence interval: 14.6%-47.2%). The most common complications were spontaneous migration or unscheduled removal of a clip (17.3%, 95% confidence interval: 8.3%-26.4%) and clinically significant pain (3.8%, 95% confidence interval: 0.9%-6.7%). Seven studies assessed continence after over-the-scope clip placement, and no cases of fecal incontinence were reported.\n\nThe over-the-scope clip is a promising and novel minimally invasive treatment for anal fistulas. The pooled healing rate was 67.7% overall and >75% for cryptoglandular fistulas. Despite its encouraging success, the over-the-scope clip's complication rate of 30.9% highlights the need for further refinement of this technique and patient selection.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40929949/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 10 Sep 2025"}, {"id": "40844884", "title_en": "A commentary on \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "title_zh": "A commentary on \"Transanal Opening of Intersphincteric Space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis\"", "authors": "Chunxue Li", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40844884/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 22 Aug 2025"}, {"id": "40833840", "title_en": "Bacteriology of Anorectal Abscess and Anal Fistula: A Systematic Review of the Literature", "title_zh": "Bacteriology of Anorectal Abscess and Anal Fistula: A Systematic Review of the Literature", "authors": "David Parés", "abstract_en": "<b><i>Aim:</i></b> A cryptoglandular anorectal abscess is a collection of purulent material around the anus, often leading to the development of an anal fistula after drainage. Although <i>Escherichia coli</i> and <i>Bacteroides fragilis</i> have been considered key bacteria in these conditions, recent evidence suggests the need to revisit this assumption. This work aimed to analyze the presence and role of bacteria in the development of anal fistulas following anorectal abscesses. <b><i>Patients and Methods:</i></b> A search was conducted using MEDLINE via PubMed, EMBASE, Cochrane Library, and Google Scholar. Articles reporting the microbiology of cryptoglandular anorectal abscesses and the resulting anal fistulas in human beings were included. The main outcome was to evaluate the presence of bacteria in cultures of anorectal abscesses or in patients who developed anal fistulas. Additional goals included identifying patient characteristics and assessing clinical outcomes on the basis of the isolated bacteria. <b><i>Results:</i></b> In total, 22 articles on anorectal abscesses and seven on anal fistulas met the inclusion criteria. Men were the most prevalent in both cases. <i>Escherichia coli</i> and the <i>Bacteroides</i> genus were the most isolated microorganisms in abscesses and fistulas, though inconsistently in the latter. <i>Bilophila wadsworthia</i> was newly isolated in abscesses, and <i>Rothia</i> sp. was notable in fistulas using new molecular techniques. <b><i>Conclusions:</i></b> <i>Escherichia coli</i> and <i>Bacteroides</i> sp. are involved in anorectal abscesses and anal fistula formation. Recently, using new technology non-well-known bacteria had been isolated involved in this clinical problem.", "abstract_zh": "<b><i>Aim:</i></b> A cryptoglandular anorectal abscess is a collection of purulent material around the anus, often leading to the development of an anal fistula after drainage. Although <i>Escherichia coli</i> and <i>Bacteroides fragilis</i> have been considered key bacteria in these conditions, recent evidence suggests the need to revisit this assumption. This work aimed to analyze the presence and role of bacteria in the development of anal fistulas following anorectal abscesses. <b><i>Patients and Methods:</i></b> A search was conducted using MEDLINE via PubMed, EMBASE, Cochrane Library, and Google Scholar. Articles reporting the microbiology of cryptoglandular anorectal abscesses and the resulting anal fistulas in human beings were included. The main outcome was to evaluate the presence of bacteria in cultures of anorectal abscesses or in patients who developed anal fistulas. Additional goals included identifying patient characteristics and assessing clinical outcomes on the basis of the isolated bacteria. <b><i>Results:</i></b> In total, 22 articles on anorectal abscesses and seven on anal fistulas met the inclusion criteria. Men were the most prevalent in both cases. <i>Escherichia coli</i> and the <i>Bacteroides</i> genus were the most isolated microorganisms in abscesses and fistulas, though inconsistently in the latter. <i>Bilophila wadsworthia</i> was newly isolated in abscesses, and <i>Rothia</i> sp. was notable in fistulas using new molecular techniques. <b><i>Conclusions:</i></b> <i>Escherichia coli</i> and <i>Bacteroides</i> sp. are involved in anorectal abscesses and anal fistula formation. Recently, using new technology non-well-known bacteria had been isolated involved in this clinical problem.", "keywords_zh": "anal fistula, anorectal abscess, bacteriology, cultures", "keywords_en": "anal fistula, anorectal abscess, bacteriology, cultures", "link": "https://pubmed.ncbi.nlm.nih.gov/40833840/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Wed, 20 Aug 2025"}, {"id": "40824311", "title_en": "Abdominoperineal pull-through with delayed coloanal anastomosis for pelvic anastomotic failure-a systematic review", "title_zh": "Abdominoperineal pull-through with delayed coloanal anastomosis for pelvic anastomotic failure-a systematic review", "authors": "I Seow-En", "abstract_en": "**Aim:** Despite the potential benefits of abdominoperineal pull-through with delayed coloanal anastomosis (DCAA), it is still infrequently performed as a salvage procedure for pelvic anastomotic failure. We aimed to perform a systematic review on the subject to guide practice.\n\n**Method:** PubMed, Embase and Cochrane were used to identify studies evaluating DCAA for salvage after pelvic surgery from inception to August 2024. Risk of bias assessment was performed using the Newcastle-Ottawa scale. The primary outcome was overall stoma-free survival. Secondary outcomes included hospital length of stay, high-grade postoperative complication rates, 30-day postoperative mortality rates, incidence of redo surgical intervention after DCAA, and postoperative anorectal function.\n\n**Results:** Five retrospective cohort studies evaluating a total of 97 patients who underwent salvage abdominoperineal pull-through and DCAA were included in this review. All patients had previous pelvic surgery, predominantly proctectomy (n = 84, 86.6%). The most common indication for redo surgery was chronic fistula (n = 62, 63.9%) followed by anastomotic leak or chronic pelvic sepsis (n = 34, 35.1%). The pooled overall stoma-free survival rate across all five studies was 81.4% over a mean 24-month postoperative follow-up duration. The overall incidence of high-grade complications after DCAA was 39.1% (n = 38). Pooled mean length of stay was 17 days. There were no cases of early postoperative death. Pooled rate of repeat surgery across four studies was 11.6% (n = 8). Pooled mean functional scores across three studies indicated minor low anterior resection syndrome at 26 months.\n\n**Conclusion:** Abdominoperineal pull-through with delayed coloanal anastomosis is a viable option for salvage surgery following pelvic anastomotic complications, with low rates of permanent stoma and acceptable long-term anorectal function.", "abstract_zh": "Despite the potential benefits of abdominoperineal pull-through with delayed coloanal anastomosis (DCAA), it is still infrequently performed as a salvage procedure for pelvic anastomotic failure. We aimed to perform a systematic review on the subject to guide practice.\n\nPubMed, Embase and Cochrane were used to identify studies evaluating DCAA for salvage after pelvic surgery from inception to August 2024. Risk of bias assessment was performed using the Newcastle-Ottawa scale. The primary outcome was overall stoma-free survival. Secondary outcomes included hospital length of stay, high-grade postoperative complication rates, 30-day postoperative mortality rates, incidence of redo surgical intervention after DCAA, and postoperative anorectal function.\n\nFive retrospective cohort studies evaluating a total of 97 patients who underwent salvage abdominoperineal pull-through and DCAA were included in this review. All patients had previous pelvic surgery, predominantly proctectomy (n = 84, 86.6%). The most common indication for redo surgery was chronic fistula (n = 62, 63.9%) followed by anastomotic leak or chronic pelvic sepsis (n = 34, 35.1%). The pooled overall stoma-free survival rate across all five studies was 81.4% over a mean 24-month postoperative follow-up duration. The overall incidence of high-grade complications after DCAA was 39.1% (n = 38). Pooled mean length of stay was 17 days. There were no cases of early postoperative death. Pooled rate of repeat surgery across four studies was 11.6% (n = 8). Pooled mean functional scores across three studies indicated minor low anterior resection syndrome at 26 months.\n\nAbdominoperineal pull-through with delayed coloanal anastomosis is a viable option for salvage surgery following pelvic anastomotic complications, with low rates of permanent stoma and acceptable long-term anorectal function.", "keywords_zh": "Abdominoperineal pull-through, Colorectal surgery, Delayed coloanal anastomosis, Redo surgery", "keywords_en": "Abdominoperineal pull-through, Colorectal surgery, Delayed coloanal anastomosis, Redo surgery", "link": "https://pubmed.ncbi.nlm.nih.gov/40824311/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 18 Aug 2025"}, {"id": "40780867", "title_en": "PAVFCOS: The development of a core outcome set for pouch anal and vaginal fistula", "title_zh": "PAVFCOS: The development of a core outcome set for pouch anal and vaginal fistula", "authors": "Phil Tozer", "abstract_en": "**Aims:** The primary aim was to develop a patient-centred core outcome set (COS) for interventional studies in patients with pouch anal and vaginal fistula (PAVF).\n\n**Method:** PAVFCOS was developed using the methodology outlined by the Core Outcome Measures in Effectiveness Trials (COMET). Systematic review and qualitative patient interviews produced a long list of candidate outcomes. An online Delphi exercise was conducted with stakeholders to prioritise and shortlist outcomes. A consensus meeting of patients and clinicians ratified the final core outcome set.\n\n**Results:** A systematic review of the literature and 14 qualitative patient interviews produced a long list of 99 outcomes. These were reduced to 46 outcomes and subjected to two rounds of a Delphi exercise with 70 participants, including patients (45%), colorectal surgeons (31%), radiologists (6%), gastroenterologists (11%) and pouch specialist nurses (7%). Thirty-six outcomes were discussed in a consensus meeting of seven clinicians and seven patients. Seven core outcomes were selected for inclusion: global assessment of continence, pain related to fistula and surrounding area, impact on quality of life of fistula discharge, fistula healing (clinical and radiological), new fistula or abscess, need for rescue intervention (minor or major) and global quality-of-life assessment.\n\n**Conclusion:** PAVFCOS is the first to establish outcomes that are important to patients with pouch anal and vaginal fistula. PAVFCOS should be used in interventional studies to introduce much-needed standardisation of outcome reporting in this challenging condition.", "abstract_zh": "The primary aim was to develop a patient-centred core outcome set (COS) for interventional studies in patients with pouch anal and vaginal fistula (PAVF).\n\nPAVFCOS was developed using the methodology outlined by the Core Outcome Measures in Effectiveness Trials (COMET). Systematic review and qualitative patient interviews produced a long list of candidate outcomes. An online Delphi exercise was conducted with stakeholders to prioritise and shortlist outcomes. A consensus meeting of patients and clinicians ratified the final core outcome set.\n\nA systematic review of the literature and 14 qualitative patient interviews produced a long list of 99 outcomes. These were reduced to 46 outcomes and subjected to two rounds of a Delphi exercise with 70 participants, including patients (45%), colorectal surgeons (31%), radiologists (6%), gastroenterologists (11%) and pouch specialist nurses (7%). Thirty-six outcomes were discussed in a consensus meeting of seven clinicians and seven patients. Seven core outcomes were selected for inclusion: global assessment of continence, pain related to fistula and surrounding area, impact on quality of life of fistula discharge, fistula healing (clinical and radiological), new fistula or abscess, need for rescue intervention (minor or major) and global quality-of-life assessment.\n\nPAVFCOS is the first to establish outcomes that are important to patients with pouch anal and vaginal fistula. PAVFCOS should be used in interventional studies to introduce much-needed standardisation of outcome reporting in this challenging condition.", "keywords_zh": "core outcome set, ileoanal pouch, inflammatory bowel disease, patient‐reported outcomes", "keywords_en": "core outcome set, ileoanal pouch, inflammatory bowel disease, patient‐reported outcomes", "link": "https://pubmed.ncbi.nlm.nih.gov/40780867/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 08 Aug 2025"}, {"id": "40693967", "title_en": "Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis", "title_zh": "Transanal opening of intersphincteric space (TROPIS) treatment for high complex anal fistula: a systematic review and meta-analysis", "authors": "Jiawen Wang", "abstract_en": "**Background:** The transanal opening of intersphincteric space (TROPIS) is a new surgical modality for treating anal fistulas. This procedure involves a transanal incision between the sphincters to promote drainage, excision of the infected areas, and maintenance of sphincter patency. In this meta-analysis, we evaluated the efficacy and safety of TROPIS in treating high complex anal fistula.\n\n**Methods:** We searched the PubMed (NLM), LISTA (EBSCO), and Web of Science Core Collection (Clarivate) databases for all related clinical research literature on highly complex anal fistulas treated with TROPIS from the time of database creation to 31 December 2024, with inclusion restricted to studies published in English. All included articles follow the PICO principle. Data on surgical one-time cure rate, recurrence rate after the first surgery, final cure rate, and occurrence of adverse events were extracted for further analysis.\n\n**Results:** Six studies involving 499 patients were included. The heterogeneity test revealed no heterogeneity, and results for one-time cure rate showed I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (effect size [ES] = 0.80, 95% confidence interval [CI] (0.77, 0.84), Z = 45.96, P = 0.00), where the one-time cure rate was 80%; recurrence rate after first surgery I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00), and the recurrence rate is 20%; final cure rate I 2  = 0.00% < 50%, and Q test P = 0.82 > 0.1 (ES = 0.89, 95% CI (0.86, 0.92), Z = 51.21, P = 0.00), and the final cure rate was 89%. No adverse events were reported in any of the patients. Sensitivity analyses showed excellent stability of the surgical cure results in all studies. No publication bias was detected in any of the included studies.\n\n**Conclusions:** The TROPIS procedure for highly complex anal fistulas exhibits a high one-time cure rate, low recurrence rate, and high overall cure rate and is not associated with any adverse events.", "abstract_zh": "The transanal opening of intersphincteric space (TROPIS) is a new surgical modality for treating anal fistulas. This procedure involves a transanal incision between the sphincters to promote drainage, excision of the infected areas, and maintenance of sphincter patency. In this meta-analysis, we evaluated the efficacy and safety of TROPIS in treating high complex anal fistula.\n\nWe searched the PubMed (NLM), LISTA (EBSCO), and Web of Science Core Collection (Clarivate) databases for all related clinical research literature on highly complex anal fistulas treated with TROPIS from the time of database creation to 31 December 2024, with inclusion restricted to studies published in English. All included articles follow the PICO principle. Data on surgical one-time cure rate, recurrence rate after the first surgery, final cure rate, and occurrence of adverse events were extracted for further analysis.\n\nSix studies involving 499 patients were included. The heterogeneity test revealed no heterogeneity, and results for one-time cure rate showed I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (effect size [ES] = 0.80, 95% confidence interval [CI] (0.77, 0.84), Z = 45.96, P = 0.00), where the one-time cure rate was 80%; recurrence rate after first surgery I 2  = 0.00% < 50%, and Q test P = 0.81 > 0.1 (ES = 0.20, 95% CI (0.16, 0.23), Z = 17.49, P = 0.00), and the recurrence rate is 20%; final cure rate I 2  = 0.00% < 50%, and Q test P = 0.82 > 0.1 (ES = 0.89, 95% CI (0.86, 0.92), Z = 51.21, P = 0.00), and the final cure rate was 89%. No adverse events were reported in any of the patients. Sensitivity analyses showed excellent stability of the surgical cure results in all studies. No publication bias was detected in any of the included studies.\n\nThe TROPIS procedure for highly complex anal fistulas exhibits a high one-time cure rate, low recurrence rate, and high overall cure rate and is not associated with any adverse events.", "keywords_zh": "anal fistula, high complex anal fistula, meta-analysis, systematic review, transanal opening of intersphincteric space (TROPIS)", "keywords_en": "anal fistula, high complex anal fistula, meta-analysis, systematic review, transanal opening of intersphincteric space (TROPIS)", "link": "https://pubmed.ncbi.nlm.nih.gov/40693967/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 22 Jul 2025"}, {"id": "40672439", "title_en": "Diagnosis and treatment for anal fistula: a systematic review of clinical practice guidelines and consensus statements", "title_zh": "Diagnosis and treatment for anal fistula: a systematic review of clinical practice guidelines and consensus statements", "authors": "Rong Shi", "abstract_en": "**Background:** Anal fistula constitutes a pathological channel originating either from the anal canal or rectum to the skin surrounding the anus, primarily characterized by recurrent pain, purulent discharge, and pruritus. This study aims to compare and standardize the recommendations for the diagnosis and treatment of anal fistula, drawing on contemporary clinical practice guidelines.\n\n**Methods:** A comprehensive search was conducted across multiple databases including PubMed, EMBASE, China National Knowledge Infrastructure, Wanfang Database, Chinese Science and Technology Periodical Database, and Chinese Biological Medicine Database, from their inception through April 1, 2024. The objective was to collate all published guidelines on anal fistula. The quality of the eligible guidelines was appraised by two reviewers using the Appraisal of Guidelines for Research and Evaluation II instrument.\n\n**Results:** The search yielded fifteen guidance documents -comprising nine guidelines and six consensus statements -each offering specific recommendations. Twelve of these documents address screening and diagnosis of anal fistula, while all fifteen discuss various treatment and management strategies. Document analysis highlighted MRI as the predominant diagnostic recommendation. Treatment and management strategies were categorized into four categories: preoperative management, surgical method selection, pharmacological interventions, and postoperative management. Regarding surgical interventions, all guidelines address incision and drainage of fistulas. Most guidelines offer a low recommendation for cutting setons, mainly attributed to the presence of incontinence. For high-positioned anal fistula, a push-pull flap procedure is recommended, whereas the LIFT procedure is advocated for newly identified, high, and sphincter-penetrating fistulas. Among the 15 guidelines and consensus statements evaluated in this study, more than half demonstrated methodological limitations, with particularly deficient performance in the applicability domain. As a critical determinant of implementation effectiveness, these deficiencies may undermine guidelines' capacity to optimize health outcomes.\n\n**Conclusion:** There is a pressing need for an updated search of potential evidence on the diagnosis and treatment of anal fistula. Effective diagnoses and therapeutic approaches, whether conventional or complementary and alternative medicine, should be thoroughly evaluated and incorporated based on robust evidence.", "abstract_zh": "Anal fistula constitutes a pathological channel originating either from the anal canal or rectum to the skin surrounding the anus, primarily characterized by recurrent pain, purulent discharge, and pruritus. This study aims to compare and standardize the recommendations for the diagnosis and treatment of anal fistula, drawing on contemporary clinical practice guidelines.\n\nA comprehensive search was conducted across multiple databases including PubMed, EMBASE, China National Knowledge Infrastructure, Wanfang Database, Chinese Science and Technology Periodical Database, and Chinese Biological Medicine Database, from their inception through April 1, 2024. The objective was to collate all published guidelines on anal fistula. The quality of the eligible guidelines was appraised by two reviewers using the Appraisal of Guidelines for Research and Evaluation II instrument.\n\nThe search yielded fifteen guidance documents -comprising nine guidelines and six consensus statements -each offering specific recommendations. Twelve of these documents address screening and diagnosis of anal fistula, while all fifteen discuss various treatment and management strategies. Document analysis highlighted MRI as the predominant diagnostic recommendation. Treatment and management strategies were categorized into four categories: preoperative management, surgical method selection, pharmacological interventions, and postoperative management. Regarding surgical interventions, all guidelines address incision and drainage of fistulas. Most guidelines offer a low recommendation for cutting setons, mainly attributed to the presence of incontinence. For high-positioned anal fistula, a push-pull flap procedure is recommended, whereas the LIFT procedure is advocated for newly identified, high, and sphincter-penetrating fistulas. Among the 15 guidelines and consensus statements evaluated in this study, more than half demonstrated methodological limitations, with particularly deficient performance in the applicability domain. As a critical determinant of implementation effectiveness, these deficiencies may undermine guidelines' capacity to optimize health outcomes.\n\nThere is a pressing need for an updated search of potential evidence on the diagnosis and treatment of anal fistula. Effective diagnoses and therapeutic approaches, whether conventional or complementary and alternative medicine, should be thoroughly evaluated and incorporated based on robust evidence.", "keywords_zh": "anal fistula, diagnosis, guidelines, systematic review, therapeutic", "keywords_en": "anal fistula, diagnosis, guidelines, systematic review, therapeutic", "link": "https://pubmed.ncbi.nlm.nih.gov/40672439/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 17 Jul 2025"}, {"id": "40607121", "title_en": "Systematic review and meta-analysis of Transanal Opening of Intersphincteric Space (TROPIS) versus conventional treatments for anal fistula", "title_zh": "Systematic review and meta-analysis of Transanal Opening of Intersphincteric Space (TROPIS) versus conventional treatments for anal fistula", "authors": "Jing Wang", "abstract_en": "Transanal Opening of Intersphincteric Space (TROPIS) has emerged as a promising surgical approach for anal fistula management over recent years. This meta-analysis comprehensively evaluates the comparative efficacy and safety of TROPIS versus conventional treatments through systematic analysis of 24 clinical studies involving 2813 patients. Through systematic searches across 7 major biomedical databases (including PubMed, EMBASE, and Chinese repositories) from inception to March 2024, we identified comparative studies assessing TROPIS against six established interventions: incision-thread-drawing, seton placement, LIFT, EAFR, fistulotomy, and incision-suture techniques. Pooled analysis demonstrated TROPIS achieved superior clinical outcomes, with a 3.15-fold higher total efficacy rate (95 % CI 1.22-8.13, <i>p</i> = 0.02) and 64 % lower complication risk compared to conventional methods (OR 0.28, 95 % CI 0.18-0.42, <i>p</i> < 0.00001). Sensitivity analyses confirmed result stability across study designs, while publication bias assessment via funnel plots and Egger's test revealed no significant distortion. Importantly, TROPIS maintained its advantage across various complication subtypes including incontinence (OR 0.31), infection (OR 0.27), and recurrence (OR 0.19). These findings establish TROPIS as a clinically superior alternative that significantly improves therapeutic outcomes while reducing procedure-related risks, suggesting its potential to become the new reference standard in anal fistula management. The consistent results across diverse patient populations and comparator procedures underscore the robustness of this evidence synthesis.", "abstract_zh": "Transanal Opening of Intersphincteric Space (TROPIS) has emerged as a promising surgical approach for anal fistula management over recent years. This meta-analysis comprehensively evaluates the comparative efficacy and safety of TROPIS versus conventional treatments through systematic analysis of 24 clinical studies involving 2813 patients. Through systematic searches across 7 major biomedical databases (including PubMed, EMBASE, and Chinese repositories) from inception to March 2024, we identified comparative studies assessing TROPIS against six established interventions: incision-thread-drawing, seton placement, LIFT, EAFR, fistulotomy, and incision-suture techniques. Pooled analysis demonstrated TROPIS achieved superior clinical outcomes, with a 3.15-fold higher total efficacy rate (95 % CI 1.22-8.13, <i>p</i> = 0.02) and 64 % lower complication risk compared to conventional methods (OR 0.28, 95 % CI 0.18-0.42, <i>p</i> < 0.00001). Sensitivity analyses confirmed result stability across study designs, while publication bias assessment via funnel plots and Egger's test revealed no significant distortion. Importantly, TROPIS maintained its advantage across various complication subtypes including incontinence (OR 0.31), infection (OR 0.27), and recurrence (OR 0.19). These findings establish TROPIS as a clinically superior alternative that significantly improves therapeutic outcomes while reducing procedure-related risks, suggesting its potential to become the new reference standard in anal fistula management. The consistent results across diverse patient populations and comparator procedures underscore the robustness of this evidence synthesis.", "keywords_zh": "Anal fistula, Meta-analysis, TROPIS, Transanal Opening of Intersphincteric Space", "keywords_en": "Anal fistula, Meta-analysis, TROPIS, Transanal Opening of Intersphincteric Space", "link": "https://pubmed.ncbi.nlm.nih.gov/40607121/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 03 Jul 2025"}, {"id": "40590873", "title_en": "Endoscopic Submucosal Dissection and Transanal Endoscopic Microsurgery in the Treatment of Rectal Neuroendocrine Tumors: Systematic Review and Meta-Analysis of the Observational Studies", "title_zh": "Endoscopic Submucosal Dissection and Transanal Endoscopic Microsurgery in the Treatment of Rectal Neuroendocrine Tumors: Systematic Review and Meta-Analysis of the Observational Studies", "authors": "Andrzej Białek", "abstract_en": "**Introduction:** Rectal neuroendocrine tumors (rNETs) are subepithelial lesions with potential of malignancy. Despite the guidelines recommending that rNETs measuring 10-20 mm should be removed either endoscopic submucosal dissection (ESD) or transanal endoscopic microsurgery (TEM), the management with these entities is still a clinical dilemma. We performed a meta-analysis to compare ESD and TEM regarding method effectiveness and safety in the treatment of rNETs.\n\n**Methods:** PubMed/MEDLINE/Embase/EBSCO/CINAHL was searched up for observational studies analyzing the efficacy and safety of both methods in the treatment of rNETs.\n\n**Results:** A total of 59 observational studies with a total of n = 2,804 participants were included. In a subgroup analysis, we demonstrated that the R0 resection rate was significantly ( P = 0.002) lower for ESD (rate: 0.854) than for TEM (0.924). The recurrence rate differed significantly ( P = 0.008); the lowest (event rate [ER] = 0.015) was found for ESD and the highest for TEM (ER = 0.035). The overall bleeding rate was 0.046 and perforation rate was 0.023 and no significant differences ( P = 0.274 for bleeding, P = 0.808 for perforation) were found by intervention type. The rate of other complications (wound dehiscence, soilage, incontinence, rectovaginal fistula, pelvic pain, retroperitoneal emphysema, coagulation syndrome) was significantly ( P = 0.000) higher for TEM (ER = 0.107) than ESD (ER = 0.013). We also included 4 comparative studies with 490 patients. Using random-effects analysis, we found that the risk ratio for R0 resection was approximately 10% lower for ESD. Our analysis showed significantly greater size ( P = 0.01) and follow-up ( P = 0.03) in the group treated with TEM.\n\n**Discussion:** The efficacy of TEM is higher than ESD with a higher risk of complications in this method. Lesions with a greater size are treated with TEM, and recurrence rate is greater for this procedure. Long follow-up is needed after the treatment of rNETs to detect the recurrence early.", "abstract_zh": "Rectal neuroendocrine tumors (rNETs) are subepithelial lesions with potential of malignancy. Despite the guidelines recommending that rNETs measuring 10-20 mm should be removed either endoscopic submucosal dissection (ESD) or transanal endoscopic microsurgery (TEM), the management with these entities is still a clinical dilemma. We performed a meta-analysis to compare ESD and TEM regarding method effectiveness and safety in the treatment of rNETs.\n\nPubMed/MEDLINE/Embase/EBSCO/CINAHL was searched up for observational studies analyzing the efficacy and safety of both methods in the treatment of rNETs.\n\nA total of 59 observational studies with a total of n = 2,804 participants were included. In a subgroup analysis, we demonstrated that the R0 resection rate was significantly ( P = 0.002) lower for ESD (rate: 0.854) than for TEM (0.924). The recurrence rate differed significantly ( P = 0.008); the lowest (event rate [ER] = 0.015) was found for ESD and the highest for TEM (ER = 0.035). The overall bleeding rate was 0.046 and perforation rate was 0.023 and no significant differences ( P = 0.274 for bleeding, P = 0.808 for perforation) were found by intervention type. The rate of other complications (wound dehiscence, soilage, incontinence, rectovaginal fistula, pelvic pain, retroperitoneal emphysema, coagulation syndrome) was significantly ( P = 0.000) higher for TEM (ER = 0.107) than ESD (ER = 0.013). We also included 4 comparative studies with 490 patients. Using random-effects analysis, we found that the risk ratio for R0 resection was approximately 10% lower for ESD. Our analysis showed significantly greater size ( P = 0.01) and follow-up ( P = 0.03) in the group treated with TEM.\n\nThe efficacy of TEM is higher than ESD with a higher risk of complications in this method. Lesions with a greater size are treated with TEM, and recurrence rate is greater for this procedure. Long follow-up is needed after the treatment of rNETs to detect the recurrence early.", "keywords_zh": "ESD, TEM, rNETs, rectal neuroendocrine tumors, treatment", "keywords_en": "ESD, TEM, rNETs, rectal neuroendocrine tumors, treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40590873/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 01 Jul 2025"}, {"id": "40585484", "title_en": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "title_zh": "Treatment of perianal abscess and anal fistula in infants: a systematic review", "authors": "Li Xu", "abstract_en": "**Introduction:** The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\n**Material And Methods:** A thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\n**Results:** A total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\n**Conclusion:** The available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\n**Systematic Review Registration:** https://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "abstract_zh": "The optimal treatment approach for perianal abscess (PA) and fistula-in-ano (FIA) in infants remains a subject of debate.\n\nA thorough literature search was conducted across multiple databases, including Embase, PubMed, Web of Science, Cochrane Library, ClinicalTrials.gov, and Google Scholar.\n\nA total of eighteen retrospective studies, encompassing 1,770 patients, were analyzed. Of the 702 cases (38.7%) that underwent conservative treatment, 528 cases (75.2%) achieved a cure, while 174 cases (24.8%) were unsuccessful, with 93 experiencing PA recurrence and 81 developing FIA. In contrast, among the 1,068 cases (61.3%) that received surgical interventions, 784 cases (73.4%) were cured, whereas 284 cases (26.6%) were not, with 151 experiencing PA recurrence and 133 developing FIA.\n\nThe available studies indicate minimal differences in the cure and recurrence rates of PA and FIA between the conservative and surgical treatment groups.\n\nhttps://www.crd.york.ac.uk/PROSPERO/, PROSPERO (CRD42023472249).", "keywords_zh": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "keywords_en": "conservative treatment, fistula-in-ano, infants, perianal abscess, surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40585484/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 30 Jun 2025"}, {"id": "40579441", "title_en": "A systematic review on the surgical management of acquired rectourethral fistula", "title_zh": "A systematic review on the surgical management of acquired rectourethral fistula", "authors": "Javier Romero-Otero", "abstract_en": "Recto-urethral fistulas represent a rare and challenging condition, occurring either congenitally or due to various prostatic and pelvic interventions such as radical prostatectomy and radiation therapies. This condition often manifests with symptoms such as pneumaturia, fecaluria, and urinary tract infections. Despite its rarity, this condition presents significant clinical management challenges due to the lack of consensus on standardized treatment protocols, particularly in patients with a history of irradiation. This study aims to systematically review the available literature on the efficacy and safety of primary surgical repair of adult-acquired recto-urethral fistulas. We conducted a comprehensive bibliographic search of MEDLINE, Scopus, and Web of Science Core Collection databases in August 2024, following the PRISMA guidelines. A total of 10 studies, covering over 500 patients, were included in our review. The most common surgical approach used was the transperineal technique with gracilis muscle flap interposition. Findings indicate higher complication rates and diminished healing in irradiated patients compared to non-irradiated counterparts. Although transperineal approaches generally resulted in high success rates irradiated individuals frequently required additional surgeries or definitive urinary diversion. Further research is required to establish evidence-based guidelines for optimal management, particularly for complex cases involving radiation-induced recto-urethral fistulas.", "abstract_zh": "Recto-urethral fistulas represent a rare and challenging condition, occurring either congenitally or due to various prostatic and pelvic interventions such as radical prostatectomy and radiation therapies. This condition often manifests with symptoms such as pneumaturia, fecaluria, and urinary tract infections. Despite its rarity, this condition presents significant clinical management challenges due to the lack of consensus on standardized treatment protocols, particularly in patients with a history of irradiation. This study aims to systematically review the available literature on the efficacy and safety of primary surgical repair of adult-acquired recto-urethral fistulas. We conducted a comprehensive bibliographic search of MEDLINE, Scopus, and Web of Science Core Collection databases in August 2024, following the PRISMA guidelines. A total of 10 studies, covering over 500 patients, were included in our review. The most common surgical approach used was the transperineal technique with gracilis muscle flap interposition. Findings indicate higher complication rates and diminished healing in irradiated patients compared to non-irradiated counterparts. Although transperineal approaches generally resulted in high success rates irradiated individuals frequently required additional surgeries or definitive urinary diversion. Further research is required to establish evidence-based guidelines for optimal management, particularly for complex cases involving radiation-induced recto-urethral fistulas.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40579441/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 27 Jun 2025"}, {"id": "40518593", "title_en": "Outcomes of Fecal Diversion in Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "title_zh": "Outcomes of Fecal Diversion in Perianal Crohn's Disease: A Systematic Review and Meta-Analysis", "authors": "Nik Sheng Ding", "abstract_en": "**Objectives:** Perianal fistulizing Crohn's disease (pfCD) is a severe type of inflammatory bowel disease resulting in significant patient morbidity. Despite advancements in treatments, pfCD remains challenging to manage with low healing rates. Fecal diversion (FD) has previously demonstrated clinical improvement for patients with refractory disease. Our meta-analysis aimed to explore the clinical response to FD, rates of successful restoration of bowel continuity after FD, rates of re-diversion, and factors affecting the success of FD in pfCD.\n\n**Methods:** A systematic review and meta-analysis was carried out of adult patients who had undergone FD for pfCD, with detailed patient outcome data. Studies were identified through a literature search of six bibliographic databases and one trial register, all run on February 28, 2025, including MEDLINE ALL, EMBASE, Emcare, APA PsycInfo, CINAHL, Cochrane Library, and Clinicaltrials.gov.\n\n**Results:** Seventeen studies encompassing 714 adult pfCD patients were included. FD resulted in a 65% clinical improvement rate, yet considerable heterogeneity existed in study methodologies and outcome definitions. While 29% of patients achieved bowel restoration within a median follow-up of 58.2 months, challenges in sustaining the effects were evident, with 10% requiring repeat diversion and a 37% overall proctectomy/proctocolectomy rate. Factors associated with diversion success included the absence of rectal involvement and quiescent luminal disease, with biologic use showing no impact on outcomes.\n\n**Conclusions:** FD offers symptom control in pfCD, although restoration rates remain low. These findings emphasize the need for individualized patient counseling. Future research should strive for uniform measures and refined approaches to enhance pfCD management.", "abstract_zh": "Perianal fistulizing Crohn's disease (pfCD) is a severe type of inflammatory bowel disease resulting in significant patient morbidity. Despite advancements in treatments, pfCD remains challenging to manage with low healing rates. Fecal diversion (FD) has previously demonstrated clinical improvement for patients with refractory disease. Our meta-analysis aimed to explore the clinical response to FD, rates of successful restoration of bowel continuity after FD, rates of re-diversion, and factors affecting the success of FD in pfCD.\n\nA systematic review and meta-analysis was carried out of adult patients who had undergone FD for pfCD, with detailed patient outcome data. Studies were identified through a literature search of six bibliographic databases and one trial register, all run on February 28, 2025, including MEDLINE ALL, EMBASE, Emcare, APA PsycInfo, CINAHL, Cochrane Library, and Clinicaltrials.gov.\n\nSeventeen studies encompassing 714 adult pfCD patients were included. FD resulted in a 65% clinical improvement rate, yet considerable heterogeneity existed in study methodologies and outcome definitions. While 29% of patients achieved bowel restoration within a median follow-up of 58.2 months, challenges in sustaining the effects were evident, with 10% requiring repeat diversion and a 37% overall proctectomy/proctocolectomy rate. Factors associated with diversion success included the absence of rectal involvement and quiescent luminal disease, with biologic use showing no impact on outcomes.\n\nFD offers symptom control in pfCD, although restoration rates remain low. These findings emphasize the need for individualized patient counseling. Future research should strive for uniform measures and refined approaches to enhance pfCD management.", "keywords_zh": "fecal diversion, inflammatory bowel diseases, perianal fistulizing Crohn's disease", "keywords_en": "fecal diversion, inflammatory bowel diseases, perianal fistulizing Crohn's disease", "link": "https://pubmed.ncbi.nlm.nih.gov/40518593/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 16 Jun 2025"}, {"id": "40474832", "title_en": "Comment on \"Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis\"", "title_zh": "Comment on \"Efficacy and safety of 13 surgical techniques for the treatment of complex anal fistula, non-Crohn CAF: a systematic review and network meta-analysis\"", "authors": "Libo Zhou", "abstract_en": "No abstract", "abstract_zh": "翻译失败", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40474832/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 06 Jun 2025"}, {"id": "40442569", "title_en": "Systematic review and network meta-analysis of cryptoglandular complex anal fistula treatment: evaluation of surgical strategies", "title_zh": "Systematic review and network meta-analysis of cryptoglandular complex anal fistula treatment: evaluation of surgical strategies", "authors": "Natalia Uribe Quintana", "abstract_en": "**Background:** Several surgical approaches are available for managing complex cryptoglandular perianal fistulas. However, a gold standard surgical technique has not yet been established. This network meta-analysis aims to assess and compare postoperative failure and anal incontinence pooled rates for different available surgical techniques for complex cryptoglandular anal fistulas.\n\n**Methods:** Systematic searches were carried out on Pubmed, Ovid, the Cochrane Library database and ClinicalTrials.gov up to June 2023. All randomized comparative trials of nine surgical techniques for cryptoglandular complex perianal fistulas in adult patients were included. A systematic review and network meta-analysis was conducted using the PRISMA-NMA methodology. The endorectal advancement flap was used as the control technique, and the odds ratios (ORs) were calculated through pairwise and network meta-analysis with random effects.\n\n**Results:** 16 randomized trials were included in this study. Network meta-analysis was conducted for each outcome. Techniques, such as cutting seton, fistulotomy with sphincter reconstruction, LIFT, and VAAFT, obtained similar results in terms of technique failure to the transanal advancement flap with no statistically significant differences. PLUG (OR = 3.6 [95%CI 1.1-11.5]), fibrin glue (OR = 7.5 [95%CI 2.2-25], and platelet-rich plasma (PRP) (OR = 11.5[95%CI 1.3-99]) demonstrated a statistically significant increase in the pooled failure rate. For anal incontinence, only the cutting seton technique exhibited a higher risk of postoperative incontinence (OR = 8.6 [95%CI 1-72.5]).\n\n**Conclusion:** Our research highlights effective therapeutic approaches for complex anal fistulas, stressing the need to customize treatment based on location, anatomy, patient characteristics, and preferences. However, it advises against using plugs, fibrin glue, PRP therapy due to lower healing rates, and the seton technique because of its potential impact on anal continence. PROSPERO number CRD42022304345.", "abstract_zh": "Several surgical approaches are available for managing complex cryptoglandular perianal fistulas. However, a gold standard surgical technique has not yet been established. This network meta-analysis aims to assess and compare postoperative failure and anal incontinence pooled rates for different available surgical techniques for complex cryptoglandular anal fistulas.\n\nSystematic searches were carried out on Pubmed, Ovid, the Cochrane Library database and ClinicalTrials.gov up to June 2023. All randomized comparative trials of nine surgical techniques for cryptoglandular complex perianal fistulas in adult patients were included. A systematic review and network meta-analysis was conducted using the PRISMA-NMA methodology. The endorectal advancement flap was used as the control technique, and the odds ratios (ORs) were calculated through pairwise and network meta-analysis with random effects.\n\n16 randomized trials were included in this study. Network meta-analysis was conducted for each outcome. Techniques, such as cutting seton, fistulotomy with sphincter reconstruction, LIFT, and VAAFT, obtained similar results in terms of technique failure to the transanal advancement flap with no statistically significant differences. PLUG (OR = 3.6 [95%CI 1.1-11.5]), fibrin glue (OR = 7.5 [95%CI 2.2-25], and platelet-rich plasma (PRP) (OR = 11.5[95%CI 1.3-99]) demonstrated a statistically significant increase in the pooled failure rate. For anal incontinence, only the cutting seton technique exhibited a higher risk of postoperative incontinence (OR = 8.6 [95%CI 1-72.5]).\n\nOur research highlights effective therapeutic approaches for complex anal fistulas, stressing the need to customize treatment based on location, anatomy, patient characteristics, and preferences. However, it advises against using plugs, fibrin glue, PRP therapy due to lower healing rates, and the seton technique because of its potential impact on anal continence. PROSPERO number CRD42022304345.", "keywords_zh": "Anal incontinence, Complex anal fistula, Network meta-analysis, Persistence, Recurrence, Surgical treatment", "keywords_en": "Anal incontinence, Complex anal fistula, Network meta-analysis, Persistence, Recurrence, Surgical treatment", "link": "https://pubmed.ncbi.nlm.nih.gov/40442569/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 29 May 2025"}, {"id": "40392371", "title_en": "Failure rates and complications of four sphincter-sparing techniques for the treatment of fistula-in-ano: a systematic review and network meta-analysis", "title_zh": "Failure rates and complications of four sphincter-sparing techniques for the treatment of fistula-in-ano: a systematic review and network meta-analysis", "authors": "G Pellino", "abstract_en": "**Background:** Several techniques are available to reduce the risk of sphincter injury when treating anal fistula, such as ligation of the intersphincteric fistula tract (LIFT), video-assisted anal fistula treatment (VAAFT), fistula laser closure (FiLaC) and endoanal flap (EAF). The aim of this meta-analysis is to provide data on the safety, complications and failure of these techniques.\n\n**Methods:** Studies published after 2017, with patients undergoing at least one among LIFT, VAAFT, FiLaC and EAF for perianal fistula and providing data regarding failure, were retrieved from PubMed and EMBASE. Primary outcome was failure; other outcomes included continence disturbance and complications.\n\n**Results:** Forty-nine articles with 3520 patients were included. The failure rates were 28.6% (range 3.8-75) for LIFT, 22.3% (6.2-65.2) for VAAFT, 43.9% (11.1-80) for FiLaC and 25.9% (4.7-100) for EAF, with a mean follow-up of 35.4 (6-80.4), 32.4 (6-48), 31.6(6.3-60) and 42.4 (12-155) months. The available network meta-analysis on failure showed RD of -0.08 (95% CI - 0.58 to 0.42) comparing LIFT vs VAAFT and 0.30 (95% CI 0.03 to 0.58) comparing LIFT vs EAF. No patients undergoing VAAFT or FiLaC reported worsening continence, while for LIFT and EAF, the continence disturbance rate was 1.5% and 7.3%, respectively. No major complications were observed. The most common minor complications were pain (1.4%), bleeding (1.1%) and wound infection (1.2%). Overall, minor complication rates were 4.3% for LIFT, 7.2% for VAAFT, 10.2% for FiLaC and 6.2% for EAF. Crohn's disease was associated with a higher failure rate (39.5% vs 31.4%).\n\n**Conclusions:** FiLaC, VAAFT, LIFT and EAF may represent a valid option in the treatment of anal fistula. VAAFT showed the lowest rate of failure but with no differences from network metanalysis. Wider homogeneous studies with long-term follow-up are necessary to obtain more robust data.\n\n**Prospero Number:** CRD42022375600.", "abstract_zh": "Several techniques are available to reduce the risk of sphincter injury when treating anal fistula, such as ligation of the intersphincteric fistula tract (LIFT), video-assisted anal fistula treatment (VAAFT), fistula laser closure (FiLaC) and endoanal flap (EAF). The aim of this meta-analysis is to provide data on the safety, complications and failure of these techniques.\n\nStudies published after 2017, with patients undergoing at least one among LIFT, VAAFT, FiLaC and EAF for perianal fistula and providing data regarding failure, were retrieved from PubMed and EMBASE. Primary outcome was failure; other outcomes included continence disturbance and complications.\n\nForty-nine articles with 3520 patients were included. The failure rates were 28.6% (range 3.8-75) for LIFT, 22.3% (6.2-65.2) for VAAFT, 43.9% (11.1-80) for FiLaC and 25.9% (4.7-100) for EAF, with a mean follow-up of 35.4 (6-80.4), 32.4 (6-48), 31.6(6.3-60) and 42.4 (12-155) months. The available network meta-analysis on failure showed RD of -0.08 (95% CI - 0.58 to 0.42) comparing LIFT vs VAAFT and 0.30 (95% CI 0.03 to 0.58) comparing LIFT vs EAF. No patients undergoing VAAFT or FiLaC reported worsening continence, while for LIFT and EAF, the continence disturbance rate was 1.5% and 7.3%, respectively. No major complications were observed. The most common minor complications were pain (1.4%), bleeding (1.1%) and wound infection (1.2%). Overall, minor complication rates were 4.3% for LIFT, 7.2% for VAAFT, 10.2% for FiLaC and 6.2% for EAF. Crohn's disease was associated with a higher failure rate (39.5% vs 31.4%).\n\nFiLaC, VAAFT, LIFT and EAF may represent a valid option in the treatment of anal fistula. VAAFT showed the lowest rate of failure but with no differences from network metanalysis. Wider homogeneous studies with long-term follow-up are necessary to obtain more robust data.\n\nCRD42022375600.", "keywords_zh": "Anal fistula, Complications, Endoanal flap, FILAC, LIFT, Recurrence, VAAFT", "keywords_en": "Anal fistula, Complications, Endoanal flap, FILAC, LIFT, Recurrence, VAAFT", "link": "https://pubmed.ncbi.nlm.nih.gov/40392371/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 20 May 2025"}, {"id": "40353830", "title_en": "Early Resuturing versus expectant Management for Perineal Wound Dehiscence: A systematic review", "title_zh": "Early Resuturing versus expectant Management for Perineal Wound Dehiscence: A systematic review", "authors": "Debjyoti Karmakar", "abstract_en": "**Background And Objective:** Perineal wound dehiscence is a common complication of vaginal birth that impacts maternal well-being and quality of life. This systematic review compares early resuturing with expectant management in the treatment of perineal wound dehiscence.\n\n**Methods:** We searched Ovid MEDLINE, CINAHL, and PubMed databases, and hand-searched recent reviews and relevant studies. Human prospective and retrospective studies, randomized controlled trials (RCTs), and case series evaluating early resuturing within the postnatal period were included. Two reviewers independently assessed the studies for outcomes and risk of bias. The primary outcome was healing time; secondary outcomes included dyspareunia, long-term symptoms, functional outcomes, infection rates, and anal sphincter injury.\n\n**Results:** Thirteen studies (1987-2022) were included: three RCTs, four prospective cohort studies or case series, and six retrospective studies-heterogeneity in study designs and outcomes limited data synthesis. Early resuturing was associated with reduced healing time, particularly for wounds not involving the anal sphincter, but increased the risk of complications such as fistula formation. Many studies emphasized meticulous preoperative wound care.\n\n**Conclusions:** Limited evidence suggests that early resuturing may reduce healing time without increasing wound infection risk. However, the increased risk of complications necessitates cautious application and highlights the importance of preoperative wound care. Further robust research is needed, although challenging to conduct. Alternative analytical methods, such as data mining and decision tree algorithms, should be explored. Based on current evidence, clinicians should carefully individualize recommendations on the benefits and risks of early resuturing.", "abstract_zh": "Perineal wound dehiscence is a common complication of vaginal birth that impacts maternal well-being and quality of life. This systematic review compares early resuturing with expectant management in the treatment of perineal wound dehiscence.\n\nWe searched Ovid MEDLINE, CINAHL, and PubMed databases, and hand-searched recent reviews and relevant studies. Human prospective and retrospective studies, randomized controlled trials (RCTs), and case series evaluating early resuturing within the postnatal period were included. Two reviewers independently assessed the studies for outcomes and risk of bias. The primary outcome was healing time; secondary outcomes included dyspareunia, long-term symptoms, functional outcomes, infection rates, and anal sphincter injury.\n\nThirteen studies (1987-2022) were included: three RCTs, four prospective cohort studies or case series, and six retrospective studies-heterogeneity in study designs and outcomes limited data synthesis. Early resuturing was associated with reduced healing time, particularly for wounds not involving the anal sphincter, but increased the risk of complications such as fistula formation. Many studies emphasized meticulous preoperative wound care.\n\nLimited evidence suggests that early resuturing may reduce healing time without increasing wound infection risk. However, the increased risk of complications necessitates cautious application and highlights the importance of preoperative wound care. Further robust research is needed, although challenging to conduct. Alternative analytical methods, such as data mining and decision tree algorithms, should be explored. Based on current evidence, clinicians should carefully individualize recommendations on the benefits and risks of early resuturing.", "keywords_zh": "early resuturing, perineal dehiscence, perineal wound breakdown, postpartum", "keywords_en": "early resuturing, perineal dehiscence, perineal wound breakdown, postpartum", "link": "https://pubmed.ncbi.nlm.nih.gov/40353830/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Mon, 12 May 2025"}, {"id": "40325545", "title_en": "The Current Applications in Surgery of Three-Dimensional Modelling Technology for Complex Fistula-In-Ano: A Systematic Review", "title_zh": "The Current Applications in Surgery of Three-Dimensional Modelling Technology for Complex Fistula-In-Ano: A Systematic Review", "authors": "Roland Shannon", "abstract_en": "**Background:** Complex fistula-in-ano (FIA) poses significant clinical challenges due to its intricate anatomy and high recurrence rates. Traditional imaging techniques like MRI are limited by their two-dimensional (2D) nature, prompting the use of three-dimensional (3D) modeling for enhanced visualization.\n\n**Methods:** This systematic review, adhering to PRISMA guidelines, analysed 17 studies using 3D models for surgical planning, education, and patient engagement in managing complex FIA. A risk of bias assessment was conducted using the Cochrane Risk of Bias Tool for randomized studies and ROBINS-I for non-randomized studies, revealing that all included studies had at least a moderate risk of bias.\n\n**Results:** Three-dimensional models improved anatomical visualization compared to 2D MRI, potentially enhancing surgical planning accuracy and reducing recurrence rates. They also offered educational benefits for surgeons and patients. However, the evidence is limited by methodological weaknesses such as small sample sizes and subjective outcome measures.\n\n**Conclusion:** Three-dimensional modelling technology shows promise in improving surgical precision and patient outcomes for complex FIA, but further high-quality research is needed to validate its clinical utility due to methodological weaknesses in current studies.", "abstract_zh": "Complex fistula-in-ano (FIA) poses significant clinical challenges due to its intricate anatomy and high recurrence rates. Traditional imaging techniques like MRI are limited by their two-dimensional (2D) nature, prompting the use of three-dimensional (3D) modeling for enhanced visualization.\n\nThis systematic review, adhering to PRISMA guidelines, analysed 17 studies using 3D models for surgical planning, education, and patient engagement in managing complex FIA. A risk of bias assessment was conducted using the Cochrane Risk of Bias Tool for randomized studies and ROBINS-I for non-randomized studies, revealing that all included studies had at least a moderate risk of bias.\n\nThree-dimensional models improved anatomical visualization compared to 2D MRI, potentially enhancing surgical planning accuracy and reducing recurrence rates. They also offered educational benefits for surgeons and patients. However, the evidence is limited by methodological weaknesses such as small sample sizes and subjective outcome measures.\n\nThree-dimensional modelling technology shows promise in improving surgical precision and patient outcomes for complex FIA, but further high-quality research is needed to validate its clinical utility due to methodological weaknesses in current studies.", "keywords_zh": "fistula‐in‐ano, patient education, surgical education, surgical planning, three‐dimensional modelling", "keywords_en": "fistula‐in‐ano, patient education, surgical education, surgical planning, three‐dimensional modelling", "link": "https://pubmed.ncbi.nlm.nih.gov/40325545/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Tue, 06 May 2025"}, {"id": "40315877", "title_en": "Isolated perianal Crohn's disease: a systematic review and expert consensus proposing novel diagnostic criteria and management advice", "title_zh": "Isolated perianal Crohn's disease: a systematic review and expert consensus proposing novel diagnostic criteria and management advice", "authors": "TOpClass Collaborators", "abstract_en": "Perianal fistulae can present a diagnostic challenge when distinguishing perianal Crohn's disease from idiopathic perianal fistulae. This distinction is key, as perianal Crohn's disease requires inflammatory bowel disease (IBD) therapy, whereas idiopathic perianal fistulae are primarily managed surgically. When luminal inflammation is absent, but Crohn's disease is suspected, the term isolated perianal Crohn's disease is sometimes applied. However, no formal guidance exists for diagnosing or managing isolated perianal Crohn's disease. Furthermore, whereas fistula granuloma might provide specific evidence of Crohn's disease, they are rarely detected in perianal fistulae, so are unlikely to sensitively delineate aetiology. This project aimed to develop an opinion-based framework for isolated perianal Crohn's disease. A systematic review evaluated clinical features suggestive of isolated perianal Crohn's disease and evidence for IBD therapies in patients with perianal fistulae without luminal IBD. The findings of this systematic review informed a multidisciplinary consensus process with IBD specialists, resulting in the formulation of diagnostic criteria and management recommendations for isolated perianal Crohn's disease. We then tested this diagnostic approach in a prospective cohort of 50 patients treated as having idiopathic perianal fistulae at a proctology referral centre, identifying six (12%) individuals as meeting the diagnostic criteria. Our findings underscore the scarcity of evidence guiding isolated perianal Crohn's disease diagnosis and the need for a composite risk-based assessment. The proposed framework provides a tool for clinical practice and research but requires validation and refinement. Clear communication with patients is essential, given the diagnostic and therapeutic uncertainties. Future studies should refine these criteria, explore biological markers for isolated perianal Crohn's disease, and establish evidence-based methods to differentiate isolated perianal Crohn's disease within the perianal fistulae spectrum.", "abstract_zh": "Perianal fistulae can present a diagnostic challenge when distinguishing perianal Crohn's disease from idiopathic perianal fistulae. This distinction is key, as perianal Crohn's disease requires inflammatory bowel disease (IBD) therapy, whereas idiopathic perianal fistulae are primarily managed surgically. When luminal inflammation is absent, but Crohn's disease is suspected, the term isolated perianal Crohn's disease is sometimes applied. However, no formal guidance exists for diagnosing or managing isolated perianal Crohn's disease. Furthermore, whereas fistula granuloma might provide specific evidence of Crohn's disease, they are rarely detected in perianal fistulae, so are unlikely to sensitively delineate aetiology. This project aimed to develop an opinion-based framework for isolated perianal Crohn's disease. A systematic review evaluated clinical features suggestive of isolated perianal Crohn's disease and evidence for IBD therapies in patients with perianal fistulae without luminal IBD. The findings of this systematic review informed a multidisciplinary consensus process with IBD specialists, resulting in the formulation of diagnostic criteria and management recommendations for isolated perianal Crohn's disease. We then tested this diagnostic approach in a prospective cohort of 50 patients treated as having idiopathic perianal fistulae at a proctology referral centre, identifying six (12%) individuals as meeting the diagnostic criteria. Our findings underscore the scarcity of evidence guiding isolated perianal Crohn's disease diagnosis and the need for a composite risk-based assessment. The proposed framework provides a tool for clinical practice and research but requires validation and refinement. Clear communication with patients is essential, given the diagnostic and therapeutic uncertainties. Future studies should refine these criteria, explore biological markers for isolated perianal Crohn's disease, and establish evidence-based methods to differentiate isolated perianal Crohn's disease within the perianal fistulae spectrum.", "keywords_zh": "", "keywords_en": "", "link": "https://pubmed.ncbi.nlm.nih.gov/40315877/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Fri, 02 May 2025"}, {"id": "40269939", "title_en": "Fish bone migration: complications, diagnostic challenges, and treatment strategies", "title_zh": "Fish bone migration: complications, diagnostic challenges, and treatment strategies", "authors": "Jichuan Chen", "abstract_en": "**Background:** Fish bone impaction in the pharynx is a common otolaryngological emergency. However, if the fish bone perforates the pharyngeal wall or the gastrointestinal wall and migrates to the neck tissues or organs, entering the lungs, mediastinum, heart, liver, biliary tract, spleen, pancreas, or other structures, or damages major blood vessels in the thoracic or abdominal cavities, it can lead to severe complications. This condition is rare and dangerous, potentially resulting in a series of serious complications, including neck abscess, thyroid abscess, thrombosis or air embolism of the cervical vessels, esophageal perforation, rupture of major mediastinal vessels, mediastinitis, aorto-esophageal fistula, lung abscess, spinal injury, sepsis, splenic abscess, hepatic abscess, anal fistula, and it may even be misdiagnosed as a tumor.\n\n**Objective:** This narrative review synthesizes evidence on fish bone translocation complications to (1) identify high-risk clinical presentations, (2) guide site-specific imaging selection, and (3) inform multidisciplinary management strategies.\n\n**Methods:** Use the keyword \"fishbone\" to systematically search articles from PubMed、CNKI and Embase databases from 1972 to 2024. Review all original articles and include them in this review where appropriate. This narrative review synthesizes evidence from case reports and observational studies to explore complications and management of fish bone translocation in uncommon sites. Given the predominance of heterogeneous case reports, a formal systematic review with meta-analysis was not feasible; however, we employed systematic search strategies to minimize selection bias.\n\n**Conclusion:** To avoid severe complications, it is crucial to provide comprehensive information on the management of fish bone impaction. When fish bone removal cannot be achieved using laryngoscopy, prompt and decisive surgical intervention is required to extract the foreign body.", "abstract_zh": "Fish bone impaction in the pharynx is a common otolaryngological emergency. However, if the fish bone perforates the pharyngeal wall or the gastrointestinal wall and migrates to the neck tissues or organs, entering the lungs, mediastinum, heart, liver, biliary tract, spleen, pancreas, or other structures, or damages major blood vessels in the thoracic or abdominal cavities, it can lead to severe complications. This condition is rare and dangerous, potentially resulting in a series of serious complications, including neck abscess, thyroid abscess, thrombosis or air embolism of the cervical vessels, esophageal perforation, rupture of major mediastinal vessels, mediastinitis, aorto-esophageal fistula, lung abscess, spinal injury, sepsis, splenic abscess, hepatic abscess, anal fistula, and it may even be misdiagnosed as a tumor.\n\nThis narrative review synthesizes evidence on fish bone translocation complications to (1) identify high-risk clinical presentations, (2) guide site-specific imaging selection, and (3) inform multidisciplinary management strategies.\n\nUse the keyword \"fishbone\" to systematically search articles from PubMed、CNKI and Embase databases from 1972 to 2024. Review all original articles and include them in this review where appropriate. This narrative review synthesizes evidence from case reports and observational studies to explore complications and management of fish bone translocation in uncommon sites. Given the predominance of heterogeneous case reports, a formal systematic review with meta-analysis was not feasible; however, we employed systematic search strategies to minimize selection bias.\n\nTo avoid severe complications, it is crucial to provide comprehensive information on the management of fish bone impaction. When fish bone removal cannot be achieved using laryngoscopy, prompt and decisive surgical intervention is required to extract the foreign body.", "keywords_zh": "Complications, Fishbone, Gastrointestinal foreign body, Pharyngeal foreign body", "keywords_en": "Complications, Fishbone, Gastrointestinal foreign body, Pharyngeal foreign body", "link": "https://pubmed.ncbi.nlm.nih.gov/40269939/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=1PQPGz2gzLgNzuaNos66c7B3c89tbZUZXKYTEvBxn0Ttaa8QdR&fc=20260103012404&ff=20260918235214&v=2.20.1", "date": "Thu, 24 Apr 2025"}, {"id": "40210078", "title_en": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "title_zh": "Defining Radiological Healing in Perianal Fistulizing Crohn's Disease: A TOpClass Global Expert Delphi Consensus", "authors": "TOpClass collaborative authors", "abstract_en": "**Background & Aims:** Perianal fistulising Crohn's disease (pfCD) affects one-fifth of patients with Crohn's disease (CD), significantly affecting their quality of life. Magnetic resonance imaging is the gold standard for evaluating fistula healing in pfCD, but variability in radiological definitions hampers meaningful clinical interpretation and consistent trial design. This study aimed to establish an international consensus on the definition of radiological healing in pfCD.\n\n**Methods:** The study was conducted in 2 phases. Phase 1 involved a systematic review to identify magnetic resonance imaging-based variables and indices used to define healing in pfCD, assessing methodological quality using the COnsensus-based Standards for the selection of health Measurement INstruments (COSMIN) framework. Phase 2 utilized a 2-round online Delphi consensus process with 84 international experts, followed by a stakeholder meeting to achieve consensus (agreement threshold >80%). Results were reported as per Accurate Consensus Reporting Document (ACCORD) guidelines.\n\n**Results:** A radiologically healed fistula can be defined by the absence of T2-weighted hyperintensity, a completely fibrotic fistula tract and, when contrast is used, the absence of contrast enhancement on post-contrast T1-weighted images (95% consensus). Radiological improvement of a fistula can be defined (80% consensus) by the presence of a least one essential criterion: an increasingly fibrotic fistula tract, an unequivocal reduction in one or more of the following: T2-weighted hyperintensity, fistula diameter, fistula length, abscess size, or contrast enhancement of the fistula tract.\n\n**Conclusions:** This inter
