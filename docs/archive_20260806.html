ctors for perianal disease and outcomes including risk of major (bowel resection, proctectomy, ostomy) and minor perianal (incision and drainage, seton placement, etc.) surgery.\n\n**Results:** In 12 population-based studies, prevalence of pCD was 18.7% (95% confidence interval [CI], 12.5%-27.0%) with 1-, 5-, and 10-year risk of perianal disease being 14.3% (95% CI, 7.9%-24.6%), 17.6% (95% CI, 11.3%-26.5%), and 18.9% (95% CI, 15.0%-23.4%), respectively. Approximately 11.5% of patients (95% CI, 6.7%-19.0%) had perianal disease at or before CD diagnosis. Colonic disease location and rectal involvement were associated with higher risk of pCD. Overall, 63.3% of patients (95% CI, 53.3-72.3) required minor perianal surgery and 6.4% of patients (95% CI, 1.8%-20.6%) required major abdominal surgery for pCD. Use of biologic therapy for pCD is common and has steadily increased throughout the years.\n\n**Conclusions:** Approximately 1 in 5 patients with CD develops perianal disease within 10 years of CD diagnosis, including 11.5% who have perianal disease at presentation. Approximately two-thirds of patients require perianal surgery, with a smaller fraction requiring major abdominal surgery.", "abstract_zh": "**Background and aims：** 肛周克罗恩病 (pCD) 是一种潜在的严重克罗恩病表型。我们通过荟萃分析进行了系统回顾，以估计基于人群的队列研究中 pCD 的累积发病率、危险因素和结果。\n\n**方法：** 通过截至 2021 年 3 月 1 日的系统文献回顾，我们确定了基于人群的起始队列研究，报告了 CD 患者肛周疾病（主要是脓肿和/或瘘管）的累积发病率。我们估计了就诊时以及 1 年、5 年和 10 年随访时的 pCD 累积发生率，以及肛周疾病和结局的危险因素，包括大手术（肠切除、直肠切除术、造口术）和小肛周手术（切开引流、挂线放置等）的风险。\n\n**结果：** 在 12 项基于人群的研究中，pCD 患病率为 18.7%（95% 置信区间 [CI]，12.5%-27.0%），肛周疾病的 1 年、5 年和 10 年风险分别为 14.3%（95% CI，7.9%-24.6%）、17.6%（95% CI，11.3%-26.5%）和分别为 18.9%（95% CI，15.0%-23.4%）。大约 11.5% 的患者 (95% CI, 6.7%-19.0%) 在 CD 诊断时或之前患有肛周疾病。结肠疾病部位和直肠受累与较高的 pCD 风险相关。总体而言，63.3% 的患者 (95% CI, 53.3-72.3) 需要进行小型肛周手术，6.4% 的患者 (95% CI, 1.8%-20.6%) 需要针对 pCD 进行腹部大手术。使用生物疗法治疗 pCD 很常见，并且多年来一直在稳步增加。\n\n**结论：** 大约五分之一的 CD 患者在 CD 诊断后 10 年内出现肛周疾病，其中 11.5% 就诊时患有肛周疾病。大约三分之二的患者需要进行肛周手术，一小部分患者需要进行腹部大手术。", "keywords_zh": "蒙特利尔分类，抗 TNF，流行病学，瘘管，自然史", "keywords_en": "Montreal classification, anti-TNF, epidemiology, fistula, natural history", "link": "https://pubmed.ncbi.nlm.nih.gov/34792604/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260805224922&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34792583", "title_en": "Strategies to Distinguish Perianal Fistulas Related to Crohn's Disease From Cryptoglandular Disease: Systematic Review With Meta-Analysis", "title_zh": "区分与克罗恩病相关的肛周瘘和隐腺疾病的策略：荟萃分析的系统评价", "authors": "Jeffrey D McCurdy", "abstract_en": "**Background:** Management of perianal fistulas differs based on fistula type. We aimed to assess the ability of diagnostic strategies to differentiate between Crohn's disease (CD) and cryptoglandular disease (CGD) in patients with perianal fistulas.\n\n**Methods:** We performed a diagnostic accuracy systematic review and meta-analysis. A systematic search of electronic databases was performed from inception through February 2021 for studies assessing a diagnostic test's ability to distinguish fistula types. We calculated weighted summary estimates with 95% confidence intervals for sensitivity and specificity by bivariate analysis, using fixed effects models when data were available from 2 or more studies. The Quality Assessment of Diagnostic Accuracy Studies tool was used to assess study quality.\n\n**Results:** Twenty-one studies were identified and included clinical symptoms (2 studies; n=154), magnetic resonance imaging (MRI) characteristics (3 studies; n=296), ultrasound characteristics (7 studies; n=1003), video capsule endoscopy (2 studies; n=44), fecal calprotectin (1 study; n=56), and various biomarkers (8 studies; n=440). MRI and ultrasound characteristics had the most robust data. Rectal inflammation, multiple-branched fistula tracts, and abscesses on pelvic MRI and the Crohn's ultrasound fistula sign, fistula debris, and bifurcated fistulas on pelvic ultrasonography had high specificity (range, 80%-95% vs 89%-96%) but poor sensitivity (range, 17%-37% vs 31%-63%), respectively. Fourteen of 21 studies had risk of bias on at least 1 of the Quality Assessment of Diagnostic Accuracy Studies domains.\n\n**Conclusions:** Limited high-quality evidence suggest that imaging characteristics may help discriminate CD from CGD in patients with perianal fistulas. Larger, prospective studies are needed to confirm these findings and to evaluate if combining multiple diagnostic tests can improve diagnostic sensitivity.", "abstract_zh": "**背景：** 肛周瘘管的治疗根据瘘管类型的不同而有所不同。我们的目的是评估诊断策略区分肛周瘘患者克罗恩病（CD）和隐腺病（CGD）的能力。\n\n**方法：** 我们进行了诊断准确性系统评价和荟萃分析。从一开始到 2021 年 2 月，我们对电子数据库进行了系统搜索，以评估诊断测试区分瘘管类型的能力。当数据来自 2 项或更多研究时，我们使用固定效应模型，通过双变量分析计算了灵敏度和特异性的 95% 置信区间的加权汇总估计值。诊断准确性研究质量评估工具用于评估研究质量。\n\n**结果：** 确定了 21 项研究，包括临床症状（2 项研究；n=154）、磁共振成像 (MRI) 特征（3 项研究；n=296）、超声特征（7 项研究；n=1003）、视频胶囊内窥镜检查（2 项研究；n=44）、粪便钙卫蛋白（1 项研究；n=56）和各种生物标志物（8 项研究；n=440）。 MRI 和超声特征拥有最可靠的数据。盆腔 MRI 上的直肠炎症、多分支瘘管和脓肿以及盆腔超声检查上的克罗恩氏超声瘘征、瘘管碎片和分叉瘘的特异性较高（范围，80%-95% vs 89%-96%），但敏感性较差（范围，17%-37% vs 31%-63%）。 21 项研究中有 14 项在至少 1 个诊断准确性研究质量评估领域存在偏倚风险。\n\n**结论：** 有限的高质量证据表明，影像学特征可能有助于区分肛周瘘患者的 CD 和 CGD。需要更大规模的前瞻性研究来证实这些发现，并评估结合多种诊断测试是否可以提高诊断灵敏度。", "keywords_zh": "隐腺疾病、肛瘘、肛周疾病", "keywords_en": "cryptoglandular disease, fistula-in-ano, perianal disease", "link": "https://pubmed.ncbi.nlm.nih.gov/34792583/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260805224922&v=2.20.1", "date": "Thu, 18 Nov 2021"}, {"id": "34628909", "title_en": "A systematic review and meta-analysis of incision and seton drainage in the treatment of high perianal abscess", "title_zh": "切开挂线引流治疗高位肛周脓肿的系统评价和荟萃分析", "authors": "Lihua Zheng", "abstract_en": "**Background:** Surgery is the clinically preferred treatment for high perianal abscesses. Incision and seton drainage improve the cure rate and reduce recurrence. We aimed to systematically evaluate the clinical effect and safety of incision and seton drainage in the treatment of high perianal abscess.\n\n**Methods:** China Knowledge Network (CNKI), WanFang database, VIP database, PubMed, and Cochrane Library were searched and all relevant Chinese and English language documents until July 2021were retrieved. All records that described randomized clinical trials (RCTs) of incision and seton drainage for the treatment of high perianal abscess were eligible. Documents that met the inclusion criteria were evaluated for bias using the Cochrane Collaboration Risk Evaluation Standard, and Revman5.4 software was used to analyze the data.\n\n**Results:** Fourteen RCTs were included. The results of nine studies showed that the clinical cure rate of the incision-seton group was higher than that of the incision-drainage group (P<0.05). Seven studies showed that the wound healing time of the incision-seton group was shorter than that of the incision-drainage group (P<0.05). Four studies showed that the visual analogue scale (VAS) score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Five studies showed that the Wexner score of the incision-seton group was lower than that of the incision-drainage group (P<0.05). Six studies showed that the formation rate of anal fistula in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Six studies demonstrated that the recurrence rate of abscess in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Seven studies showed that the incidence of adverse events in the incision-seton group was lower than that in the incision-drainage group (P<0.05). Five studies demonstrated that the length of stay in the incision-seton group was shorter than that of the incision-drainage group (P<0.05).\n\n**Discussion:** The choice of surgical methods in clinical research has always been controversial. The incision-seton method can effectively and safely treat high perianal abscess. However, the results of this meta-analysis still leave some gaps in the evidence. More large-sample, high-quality, and multi-center RCTs are needed.", "abstract_zh": "**背景：** 手术是临床上治疗高位肛周脓肿的首选治疗方法。切开挂线引流提高治愈率，减少复发。目的 系统评价切开挂线引流治疗高位肛周脓肿的临床效果和安全性。\n\n**方法：** 检索中国知网（CNKI）、万方数据库、维普数据库、PubMed、Cochrane图书馆，检索截至2021年7月的所有相关中英文文献。所有描述切开挂线引流治疗高位肛周脓肿的随机临床试验 (RCT) 的记录均符合资格。使用Cochrane协作风险评估标准对符合纳入标准的文献进行偏倚评估，并使用Revman5.4软件对数据进行分析。\n\n**结果：** 其中包括 14 项随机对照试验。 9项研究结果显示切开挂线组临床治愈率高于切开引流组（P<0.05）。 7项研究显示切开挂线组伤口愈合时间短于切开引流组（P<0.05）。 4项研究显示切开挂线组视觉模拟评分（VAS）低于切开引流组（P<0.05）。 5项研究显示切开挂线组Wexner评分低于切开引流组（P<0.05）。 6项研究显示切开挂线组肛瘘形成率低于切开引流组（P<0.05）。 6项研究显示切开挂线组脓肿复发率低于切开引流组（P<0.05）。 7项研究显示切开挂线组不良事件发生率低于切开引流组（P<0.05）。 5项研究显示切开挂线组的住院时间短于切开引流组（P<0.05）。\n\n**讨论：** 临床研究中手术方式的选择一直存在争议。切开挂线法可以有效、安全地治疗高位肛周脓肿。然而，这项荟萃分析的结果仍然在证据上留下了一些空白。需要更多大样本、高质量、多中心的随机对照试验。", "keywords_zh": "切开挂线治疗，高位肛周脓肿，切开引流治疗，Meta分析", "keywords_en": "Incision-seton therapy, high perianal abscess, incision-drainage therapy, meta-analysis", "link": "https://pubmed.ncbi.nlm.nih.gov/34628909/?utm_source=Other&utm_medium=rss&utm_campaign=pubmed-2&utm_content=14OzJS8GjXZKNRRzPCpEeeWNsNMgy1WIuhFrUouU5lu4ZC2kX-&fc=20260103014642&ff=20260805224922&v=2.20.1", "date": "Mon, 11 Oct 2021"}], "未命名": []}, currentFeed: '', currentPapers: [], currentPaper: null,
                    init() { const ks = Object.keys(this.feeds); if(ks.length > 0) { this.currentFeed = ks[0]; this.selectFeed(); } },
                    selectFeed() { this.currentPapers = this.feeds[this.currentFeed]; this.currentPaper = this.currentPapers.length > 0 ? this.currentPapers[0] : null; document.querySelector('aside').scrollTop = 0; }
                }
            }
